name: BBYA Music Manager - Simple Upload v1.3

on:
  workflow_dispatch:
    inputs:
      batch_json:
        description: JSON array of drive_file_id/title objects
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  upload-audio:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, 'BBYA MUSIC BATCH V1.3')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      AUDIO_KEY: ${{ secrets.TALONTHEDEVIL_AUDIO_PUBLISHER }}
      MAX_MODERATION_WAIT_SECONDS: '14400'

    steps:
      - name: Checkout uploader
        uses: actions/checkout@v4

      - name: Read and validate batch request
        shell: bash
        env:
          DISPATCH_BATCH_JSON: ${{ inputs.batch_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib

          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              raw = os.environ.get('DISPATCH_BATCH_JSON', '')
          else:
              event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
              body = (event.get('issue') or {}).get('body') or ''
              raw = ''
              for line in body.splitlines():
                  if line.startswith('batch_json='):
                      raw = line[len('batch_json='):]
                      break

          batch = json.loads(raw)
          if not isinstance(batch, list) or not 1 <= len(batch) <= 100:
              raise SystemExit('BATCH_MUST_CONTAIN_1_TO_100_ITEMS')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bbya-music-batch.json'
          target.write_text(json.dumps(batch, ensure_ascii=False), encoding='utf-8')
          print(f'Validated {len(batch)} audio request(s).')
          PY

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python3 -m pip install --quiet 'gdown==6.1.0'
          ffmpeg -version | head -1
          gdown --version

      - name: Upload 1.75x audio and await moderation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bbya-music-simple-upload-v13.py \
            --batch "$RUNNER_TEMP/bbya-music-batch.json" \
            --result upload-result.json

      - name: Preserve machine-readable result
        if: always() && hashFiles('upload-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bbya-music-simple-upload-v13-${{ github.run_id }}
          path: upload-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Reply result to request issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            if (!fs.existsSync('upload-result.json')) {
              body = 'BBYA MUSIC SIMPLE UPLOAD v1.3 FAILED BEFORE RESULT — check workflow logs. No map publish was attempted.';
            } else {
              const data = JSON.parse(fs.readFileSync('upload-result.json', 'utf8'));
              const clean = (value) => String(value ?? '').replaceAll('|', '\\|').replaceAll('\n', ' ').slice(0, 180);
              const lines = [
                '## BBYA Music Simple Upload v1.3',
                '',
                `Speed factor: **${data.speedFactor}x** · Roblox PlaybackSpeed: **${data.playbackSpeed}**`,
                '',
                '| # | Source title | Asset ID | Moderation | Status |',
                '|---:|---|---:|---|---|',
              ];
              for (const item of data.items || []) {
                lines.push(`| ${item.index} | ${clean(item.sourceTitle)} | ${clean(item.assetId || '—')} | ${clean(item.moderation || item.moderationState || '—')} | ${clean(item.status)} |`);
                if (item.error) lines.push(`|  | Error |  |  | ${clean(item.error)} |`);
              }
              lines.push('', '**No Audio Bank name was chosen. No Universe permission was granted. No map was injected or published.**');
              lines.push('', '```json', JSON.stringify(data.summary || {}, null, 2), '```');
              body = lines.join('\n').slice(0, 65000);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
