name: BBYA Staff Tower Integration QC

on:
  push:
    branches: [bbya/staff-tower-prod-integration-v1-1]
    paths:
      - 'maps/bbya-social-hub/148-staff-tower.server.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-staff-tower-integration-qc.yml'

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact handoff source and registration
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tower='maps/bbya-social-hub/148-staff-tower.server.lua'
          $project='maps/bbya-social-hub/default.project.json'
          $funkot='maps/bbya-social-hub/92-funkot-club.server.lua'
          function GitBlobSha([string]$path){
            $bytes=[System.IO.File]::ReadAllBytes((Resolve-Path $path))
            $prefix=[System.Text.Encoding]::ASCII.GetBytes("blob $($bytes.Length)`0")
            $all=New-Object byte[] ($prefix.Length+$bytes.Length)
            [Array]::Copy($prefix,0,$all,0,$prefix.Length)
            [Array]::Copy($bytes,0,$all,$prefix.Length,$bytes.Length)
            $sha=[System.Security.Cryptography.SHA1]::Create()
            try{return -join ($sha.ComputeHash($all)|ForEach-Object{$_.ToString('x2')})}finally{$sha.Dispose()}
          }
          $towerSha=GitBlobSha $tower
          if($towerSha -ne '9725f96428414c5106fcb8d23979dd206ba9700b'){throw "Staff Tower blob mismatch: $towerSha"}
          $funkotSha=GitBlobSha $funkot
          if($funkotSha -ne '35d45d286361bb35dfd09e0f15af88b0a97086ef'){throw "Funkot authority changed: $funkotSha"}
          $p=Get-Content $project -Raw
          if(([regex]::Matches($p,'148-staff-tower\.server\.lua')).Count -ne 1){throw 'Staff Tower must be registered exactly once'}
          $s=Get-Content $tower -Raw
          foreach($m in @('STAFF_TOWER_V1','148_STAFF_TOWER_V1','ABOVE_FUNKOT','PRIVATE_EXECUTIVE_STAFF_RESIDENCE','local PODIUM_W,PODIUM_D=72,48','local TOWER_W,TOWER_D=52,34','OpenInteriorSide",true','UnitCount",4','OwnerPenthouse','HelipadVisualOnly",true','RoofPlanterNE')){if($s -notmatch [regex]::Escape($m)){throw "Missing tower lock marker: $m"}}
          if($s -match 'RunService|Heartbeat'){throw 'Runtime loop forbidden in Staff Tower source'}
          Write-Host "Staff Tower exact-source static QC PASS tower=$towerSha funkot=$funkotSha"

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-staff-tower-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-staff-tower-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory($zip,$dir)
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Full BBYA Rojo build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'bbya-staff-tower-integration.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not (Test-Path $out)){throw 'RBXL missing'}
          if((Get-Item $out).Length -lt 1024){throw 'RBXL too small'}
          Write-Host "STAFF_TOWER_BUILD_PASS bytes=$((Get-Item $out).Length) source=$env:GITHUB_SHA"
