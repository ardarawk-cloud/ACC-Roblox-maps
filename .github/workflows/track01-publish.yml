name: Publish TRACK 01

on:
  push:
    branches: [main]
    paths:
      - 'maps/track-01/**'
      - 'scripts/build-track01.js'
      - 'scripts/publish-track01-direct.js'
      - '.github/workflows/track01-publish.yml'
  workflow_dispatch:

concurrency:
  group: track01-live-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate TRACK 01 target lock
        shell: bash
        run: |
          node - <<'NODE'
          const c=require('./maps/track-01/track01.config.json');
          if(String(c.universeId)!=='10745349805') throw new Error('Wrong Universe ID');
          if(String(c.placeId)!=='79748872921213') throw new Error('Wrong Place ID');
          if(String(c.version)!=='2.9.0') throw new Error('Wrong TRACK 01 version');
          if(!c.enabled) throw new Error('TRACK 01 target disabled');
          console.log('TRACK 01 target lock PASS',c.version,c.artDirection);
          NODE

      - name: Build TRACK 01 masterplan place
        run: node scripts/build-track01.js

      - name: Validate generated place
        shell: bash
        run: |
          set -euo pipefail
          test -s maps/track-01/place.rbxlx
          grep -q 'TRACK01_AisleHotfix' maps/track-01/place.rbxlx
          grep -q 'TRACK01_CinematicCorrection' maps/track-01/place.rbxlx
          grep -q 'ACC_TRACK01_AISLE_CLEAR' maps/track-01/place.rbxlx
          grep -q 'ACC_TRACK01_CINEMATIC_READY' maps/track-01/place.rbxlx
          grep -q 'TRACK01_CinematicGrade' maps/track-01/place.rbxlx
          grep -q 'TRACK01_ControlledBloom' maps/track-01/place.rbxlx
          grep -q 'AisleFill' maps/track-01/place.rbxlx
          grep -q 'DadoShadow' maps/track-01/place.rbxlx
          grep -q 'CeilingCableTray' maps/track-01/place.rbxlx
          grep -q 'DJBackGlow' maps/track-01/place.rbxlx
          grep -q 'END OF LINE' maps/track-01/place.rbxlx
          echo 'TRACK 01 v2.9 cinematic-correction validation PASS'

      - name: Publish TRACK 01 to Roblox
        id: publish
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: node scripts/publish-track01-direct.js

      - name: Persist TRACK 01 publish result
        if: always()
        shell: bash
        run: |
          if [ ! -s deploy-status/track01-direct.json ]; then
            mkdir -p deploy-status
            printf '{"ok":false,"httpStatus":"NO_RESULT","universeId":"10745349805","placeId":"79748872921213","at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy-status/track01-direct.json
          fi
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/track01-direct.json maps/track-01/place.rbxlx
          if ! git diff --cached --quiet; then
            git commit -m "Record TRACK 01 v2.9 live publish [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce publish success
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('deploy-status/track01-direct.json','utf8'));
          if(!r.ok || String(r.universeId)!=='10745349805' || String(r.placeId)!=='79748872921213') {
            console.error('TRACK 01 publish did not succeed:',r);
            process.exit(1);
          }
          console.log('TRACK 01 LIVE PUBLISH VERIFIED:',r.payload);
          NODE
