# BBYA runner watchdog/report v8
name: BBYA Runner Unblock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-runner-unblock.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Report BBYA workflow queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          runs=$(curl -fsSL "${auth[@]}" "https://api.github.com/repos/$REPO/actions/runs?per_page=100")
          report="$(date -u +%FT%TZ)\nRUNS\n"
          report+=$(echo "$runs" | jq -r '.workflow_runs[] | select(.name|startswith("BBYA")) | [.id,.name,.status,.conclusion,.head_sha,.created_at] | @tsv' | head -80)
          report+=$'\n'
          content=$(printf '%s' "$report" | base64 -w0)
          path='deploy-status/bbya-runner-unblock.txt'
          fileApi="https://api.github.com/repos/$REPO/contents/$path"
          sha=$(curl -sS "${auth[@]}" "$fileApi" | jq -r '.sha // empty')
          body=$(jq -n --arg m 'Record BBYA workflow queue [skip ci]' --arg c "$content" --arg s "$sha" '{message:$m,content:$c,branch:"main",sha:$s}')
          curl -fsSL -X PUT "${auth[@]}" -H "Content-Type: application/json" -d "$body" "$fileApi" >/dev/null
