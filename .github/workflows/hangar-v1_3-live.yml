name: HANGAR v1.3 FULL MESH UNIVERSE GRANT

on:
  push:
    branches: [aeroclub-hangar-rebuild-v1-lab]
    paths:
      - '.github/workflows/hangar-v1_3-live.yml'
      - 'maps/aeroclub-hangar/default.project.json'
      - 'maps/aeroclub-hangar/server/spawn-safety.server.lua'
      - 'maps/aeroclub-hangar/server/visual-bootstrap-v1_3.server.lua'
      - 'scripts/aeroclub-hangar-v1_2-glb.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hangar-v1-3-live
  cancel-in-progress: true

env:
  LIVE_UNIVERSE_ID: '10745364913'
  LIVE_PLACE_ID: '76001567401911'
  BRANCH_LOCK: 'aeroclub-hangar-rebuild-v1-lab'
  ASSET_OWNER_USER_ID: '4141352496'

jobs:
  build-upload-grant-publish-live:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout HANGAR v1.3
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: HANGAR authority QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF_NAME -ne $env:BRANCH_LOCK){throw "Wrong branch: $env:GITHUB_REF_NAME"}
          $project=Get-Content 'maps/aeroclub-hangar/default.project.json' -Raw
          if($project -notmatch 'HangarFullMeshV1_3'){throw 'v1.3 full mesh runtime not mounted'}
          if($project -match 'VisibleFailsafeV1' -or $project -match 'failsafe-visible-hangar'){throw 'Visible fallback must not be mounted'}
          $runtime=Get-Content 'maps/aeroclub-hangar/server/visual-bootstrap-v1_3.server.lua' -Raw
          foreach($m in @('HANGAR_V13_MODEL_ASSET_ID','V1_3_LIVE_CREATOR_FULL_MESH','READY_OWNER_RUNTIME_QC','HangarVisibleFallback')){if($runtime -notmatch [regex]::Escape($m)){throw "Missing v1.3 marker $m"}}
          $spawn=Get-Content 'maps/aeroclub-hangar/server/spawn-safety.server.lua' -Raw
          foreach($m in @('Vector3.new(0, 6, -325)','CENTRAL_JET','V1_1_FARTHER_FACING_JET')){if($spawn -notmatch [regex]::Escape($m)){throw "Spawn marker missing $m"}}
          node --check scripts/aeroclub-hangar-v1_2-glb.js
          if($LASTEXITCODE -ne 0){throw 'GLB generator syntax failed'}
          Write-Host 'HANGAR_V13_AUTHORITY_QC_PASS'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build HANGAR static GLB
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'hangar-v1-3.glb'
          node scripts/aeroclub-hangar-v1_2-glb.js $out
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $out)){throw 'HANGAR GLB generation failed'}
          $bytes=(Get-Item $out).Length
          if($bytes -lt 300000){throw "HANGAR GLB unexpectedly small: $bytes"}
          "HANGAR_GLB=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_GLB_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_GLB_SHA256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_V13_GLB_PASS bytes=$bytes"

      - name: Upload HANGAR model under authorized asset owner
        shell: powershell
        env:
          ROBLOX_ASSET_KEY: ${{ secrets.AM_STUDIO }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_ASSET_KEY)){throw 'AM_STUDIO asset key missing'}
          if($env:ASSET_OWNER_USER_ID -notmatch '^\d+$' -or [int64]$env:ASSET_OWNER_USER_ID -le 0){throw 'Invalid asset owner'}
          $request=@{
            assetType='Model'
            displayName='HANGAR v1.3 Full Mesh'
            description='HANGAR full-mesh environment. Explicitly granted to the HANGAR live universe.'
            creationContext=@{creator=@{userId=[int64]$env:ASSET_OWNER_USER_ID}}
          }|ConvertTo-Json -Depth 8 -Compress
          $requestFile=Join-Path $env:RUNNER_TEMP 'hangar-v13-asset-request.json'
          [System.IO.File]::WriteAllText($requestFile,$request,(New-Object System.Text.UTF8Encoding($false)))
          try{
            $args=@('--silent','--show-error','--location','--request','POST','--header',"x-api-key: $env:ROBLOX_ASSET_KEY",'--form',"request=<$requestFile;type=application/json",'--form',"fileContent=@$env:HANGAR_GLB;type=model/gltf-binary",'https://apis.roblox.com/assets/v1/assets')
            $raw=& curl.exe @args
          }finally{Remove-Item $requestFile -Force -ErrorAction SilentlyContinue}
          if($LASTEXITCODE -ne 0){throw 'Asset upload request failed'}
          try{$created=$raw|ConvertFrom-Json}catch{throw "Invalid asset upload response: $raw"}
          if(-not $created.path){throw "Asset upload rejected: $raw"}
          $operationId=([string]$created.path)-replace '^operations/',''
          $assetId=$null;$moderation=$null
          for($i=0;$i -lt 90;$i++){
            Start-Sleep -Seconds 4
            $opRaw=& curl.exe --silent --show-error --location --header "x-api-key: $env:ROBLOX_ASSET_KEY" "https://apis.roblox.com/assets/v1/operations/$operationId"
            if($LASTEXITCODE -ne 0){continue}
            try{$op=$opRaw|ConvertFrom-Json}catch{continue}
            if($op.done){
              if($op.error){throw "Asset operation failed: $($op.error|ConvertTo-Json -Compress -Depth 8)"}
              $assetId=[string]$op.response.assetId
              $moderation=[string]$op.response.moderationResult.moderationState
              break
            }
          }
          if($assetId -notmatch '^\d+$' -or [int64]$assetId -le 0){throw 'No valid HANGAR model asset ID'}
          "HANGAR_MODEL_ASSET_ID=$assetId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_MODEL_MODERATION=$moderation" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_V13_UPLOAD_PASS asset=$assetId moderation=$moderation owner=$env:ASSET_OWNER_USER_ID"

      - name: Grant model and dependencies to LIVE HANGAR universe
        shell: powershell
        env:
          ROBLOX_ASSET_KEY: ${{ secrets.AM_STUDIO }}
          ROBLOX_MASTER_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          $body=@{
            subjectType='Universe'
            subjectId=$env:LIVE_UNIVERSE_ID
            action='Use'
            requests=@(@{assetId=[int64]$env:HANGAR_MODEL_ASSET_ID;grantToDependencies=$true})
          }|ConvertTo-Json -Depth 8 -Compress
          $url='https://apis.roblox.com/asset-permissions-api/v1/assets/permissions'
          $granted=$false
          foreach($key in @($env:ROBLOX_ASSET_KEY,$env:ROBLOX_MASTER_KEY)){
            if([string]::IsNullOrWhiteSpace($key)){continue}
            try{
              $resp=Invoke-RestMethod -Method Patch -Uri $url -Headers @{'x-api-key'=$key} -ContentType 'application/json' -Body $body
              $success=@($resp.successAssetIds|ForEach-Object{[string]$_})
              $errors=@($resp.errors)
              if($success -contains [string]$env:HANGAR_MODEL_ASSET_ID -and $errors.Count -eq 0){$granted=$true;break}
              Write-Warning "Asset grant response did not confirm success: $($resp|ConvertTo-Json -Compress -Depth 8)"
            }catch{
              Write-Warning "Asset grant key attempt failed: $($_.Exception.Message)"
            }
          }
          if(-not $granted){throw "Unable to grant asset $env:HANGAR_MODEL_ASSET_ID Use permission to universe $env:LIVE_UNIVERSE_ID"}
          "HANGAR_ASSET_GRANT=UNIVERSE_USE_WITH_DEPENDENCIES" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_V13_PERMISSION_PASS asset=$env:HANGAR_MODEL_ASSET_ID universe=$env:LIVE_UNIVERSE_ID dependencies=true"

      - name: Inject universe-granted model asset
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='maps/aeroclub-hangar/server/visual-bootstrap-v1_3.server.lua'
          $text=Get-Content $path -Raw
          $pattern='local MODEL_ASSET_ID = \d+ -- HANGAR_V13_MODEL_ASSET_ID'
          if($text -notmatch $pattern){throw 'v1.3 asset injection marker missing'}
          $text=[regex]::Replace($text,$pattern,"local MODEL_ASSET_ID = $env:HANGAR_MODEL_ASSET_ID -- HANGAR_V13_MODEL_ASSET_ID")
          Set-Content -Path $path -Value $text -Encoding utf8
          Write-Host "HANGAR_V13_ASSET_INJECT_PASS asset=$env:HANGAR_MODEL_ASSET_ID"

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $d=Join-Path $env:RUNNER_TEMP 'hangar-v13-rojo';$z=Join-Path $env:RUNNER_TEMP 'hangar-v13-rojo.zip'
            if(Test-Path $d){Remove-Item $d -Recurse -Force}
            New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive -Path $z -DestinationPath $d -Force
            $e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1
            if(-not $e){throw 'rojo.exe missing'}
            $rojo=$e.FullName
          }
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build HANGAR v1.3 place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'hangar-v1-3-live.rbxlx'
          & $env:ROJO_EXE build 'maps/aeroclub-hangar/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 12000){throw "HANGAR place unexpectedly small: $bytes"}
          $xml=Get-Content $place -Raw
          foreach($m in @('HangarSpawnSafetyV1_1','HangarFullMeshV1_3',$env:HANGAR_MODEL_ASSET_ID,'V1_3_LIVE_CREATOR_FULL_MESH')){if($xml -notmatch [regex]::Escape([string]$m)){throw "Built place missing marker $m"}}
          if($xml -match 'VisibleFailsafeV1'){throw 'Visible fallback leaked into v1.3 place'}
          "HANGAR_PLACE_FILE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_SHA256=$((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_V13_BUILD_PASS bytes=$bytes"

      - name: Publish MAIN HANGAR with retry
        shell: powershell
        env:
          ROBLOX_PUBLISH_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_PUBLISH_KEY)){throw 'Publish key missing'}
          $url="https://apis.roblox.com/universes/v1/$env:LIVE_UNIVERSE_ID/places/$env:LIVE_PLACE_ID/versions?versionType=Published"
          $version=$null
          for($attempt=1;$attempt -le 6;$attempt++){
            try{
              $resp=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers @{'x-api-key'=$env:ROBLOX_PUBLISH_KEY} -ContentType 'application/xml' -InFile $env:HANGAR_PLACE_FILE
              if([int]$resp.StatusCode -ge 200 -and [int]$resp.StatusCode -lt 300){$version=[int](($resp.Content|ConvertFrom-Json).versionNumber);break}
            }catch{Write-Warning "Publish attempt $attempt failed: $($_.Exception.Message)"}
            Start-Sleep -Seconds ([math]::Min(30,3*$attempt))
          }
          if(-not $version){throw 'HANGAR publish failed after retries'}
          "HANGAR_LIVE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_V13_MAIN_PUBLISHED version=$version"

      - name: Restart MAIN HANGAR servers
        shell: powershell
        env:
          ROBLOX_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          $url="https://apis.roblox.com/cloud/v2/universes/$env:LIVE_UNIVERSE_ID`:restartServers"
          $resp=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers @{'x-api-key'=$env:ROBLOX_KEY} -ContentType 'application/json' -Body '{}'
          if([int]$resp.StatusCode -lt 200 -or [int]$resp.StatusCode -ge 300){throw "Restart HTTP $($resp.StatusCode)"}
          Write-Host "HANGAR_V13_RESTART_PASS status=$($resp.StatusCode)"

      - name: Persist HANGAR v1.3 receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=[ordered]@{
            status='LIVE_PUBLISHED';ok=$true;project='HANGAR';universeId=$env:LIVE_UNIVERSE_ID;placeId=$env:LIVE_PLACE_ID;
            sourceCommit=$env:GITHUB_SHA;mode='HANGAR_V13_FULL_MESH_UNIVERSE_GRANTED_NO_VISIBLE_FALLBACK';
            assetOwnerUserId=[int64]$env:ASSET_OWNER_USER_ID;staticModelAssetId=[int64]$env:HANGAR_MODEL_ASSET_ID;modelModeration=$env:HANGAR_MODEL_MODERATION;assetPermission=$env:HANGAR_ASSET_GRANT;
            robloxVersion=[int]$env:HANGAR_LIVE_VERSION;glbBytes=[int64]$env:HANGAR_GLB_BYTES;glbSha256=$env:HANGAR_GLB_SHA256;
            placeBytes=[int64]$env:HANGAR_PLACE_BYTES;placeSha256=$env:HANGAR_PLACE_SHA256;publishRun=[int64]$env:GITHUB_RUN_ID;
            spawn='FAR_OUTDOOR_FACE_CENTRAL_JET';visibleFallback='NONE';serversRestarted=$true;visualQC='PENDING_OWNER_IN_GAME'
          }
          $text=$receipt|ConvertTo-Json -Depth 6
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"))
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='HANGAR-V13'}
          $path='deploy-status/hangar-live.json'
          $enc=(($path.Split('/')|ForEach-Object{[Uri]::EscapeDataString($_)}) -join '/')
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$enc"
          $sha=$null
          try{$old=Invoke-RestMethod -Headers $headers -Uri ($url+'?ref='+[Uri]::EscapeDataString($env:GITHUB_REF_NAME));$sha=[string]$old.sha}catch{}
          $body=@{message='Record HANGAR v1.3 LIVE [skip ci]';content=$b64;branch=$env:GITHUB_REF_NAME};if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Uri $url -Body ($body|ConvertTo-Json -Depth 5)|Out-Null
          Write-Host "HANGAR_V13_RECEIPT_PASS version=$env:HANGAR_LIVE_VERSION asset=$env:HANGAR_MODEL_ASSET_ID"
