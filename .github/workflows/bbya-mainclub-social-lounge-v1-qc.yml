name: BBYA Main Club Social Lounge v1 QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/132-mainclub-social-lounge-v1.server.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-mainclub-social-lounge-v1-qc.yml'
  workflow_dispatch:

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-lounge-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-lounge-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Static lounge scope QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content 'maps/bbya-social-hub/132-mainclub-social-lounge-v1.server.lua' -Raw
          $project=Get-Content 'maps/bbya-social-hub/default.project.json' -Raw
          $null=$project | ConvertFrom-Json
          foreach($needle in @(
            'MAIN_CLUB_SOCIAL_LOUNGE_UPGRADE_V1',
            'ClubPurityMallStudiosV1',
            'MainClubFrontExtension',
            'ArrivalLounge1',
            'ArrivalLounge2',
            'ReusedExistingArchitecture',
            'PremiumLoungeBay',
            'FormerPhotoStudioLoungeUpgraded',
            'FormerSalonLoungeUpgraded',
            'OpenAccess',
            'VIPGateAdded',
            'MainClubSightlinePreserved',
            'GlobalLightingUntouched',
            'AudioUntouched',
            'DJUntouched',
            'MonetizationUntouched'
          )){if($src -notmatch [regex]::Escape($needle)){throw "Missing lounge marker: $needle"}}
          foreach($forbidden in @(
            'Lighting%.Brightness',
            'Lighting%.ClockTime',
            'SoundId%s*=',
            'GamePass',
            'PromptPurchase',
            'MarketplaceService'
          )){if($src -match $forbidden){throw "Forbidden lounge mutation: $forbidden"}}
          if($project -notmatch [regex]::Escape('132-mainclub-social-lounge-v1.server.lua')){throw 'Social lounge manifest mount missing'}
          Write-Host 'MAIN CLUB SOCIAL LOUNGE STATIC QC PASS'

      - name: Full BBYA Rojo build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mainclub-lounge-qc.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not (Test-Path $out)){throw 'RBXL output missing'}
          if((Get-Item $out).Length -lt 1024){throw 'RBXL output too small'}
          Write-Host "MAIN CLUB SOCIAL LOUNGE ROJO PASS bytes=$((Get-Item $out).Length)"
