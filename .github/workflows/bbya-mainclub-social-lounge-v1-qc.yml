name: BBYA Main Club Former Studio + Audio Coverage QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/132-mainclub-social-lounge-v1.server.lua'
      - 'maps/bbya-social-hub/104-venue-audio-router.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-mainclub-social-lounge-v1-qc.yml'
  workflow_dispatch:

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-mainclub-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-mainclub-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Static former-studio premium scope QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content 'maps/bbya-social-hub/132-mainclub-social-lounge-v1.server.lua' -Raw
          foreach($needle in @(
            'MAIN_CLUB_FORMER_STUDIO_PREMIUM_V4',
            'MainClubFinalAuthorityV2',
            'PureClubFrontExtension',
            'BuiltInVIPContinuation1',
            'BuiltInVIPContinuation2',
            'FormerStudioPremiumV4',
            'SmokedMirrorPanel',
            'AcousticFin_',
            'CeilingTrack',
            'ServiceConsole',
            'NoDuplicateSeating',
            'GlobalLightingUntouched',
            'DJUntouched',
            'StageUntouched',
            'MonetizationUntouched',
            'RestroomGeometryUntouched'
          )){if($src -notmatch [regex]::Escape($needle)){throw "Missing former-studio marker: $needle"}}
          foreach($forbidden in @(
            'Lighting\.Brightness',
            'Lighting\.ClockTime',
            'SoundId\s*=',
            'MarketplaceService',
            'PromptPurchase',
            'GamePass',
            'BBYABasementMaster',
            'DARK_UNDERGROUND'
          )){if($src -match $forbidden){throw "Forbidden former-studio mutation: $forbidden"}}
          Write-Host 'FORMER STUDIO PREMIUM STATIC QC PASS'

      - name: Static Main Club room-aware audio QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $audio=Get-Content 'maps/bbya-social-hub/104-venue-audio-router.client.lua' -Raw
          foreach($needle in @(
            'STRICT VENUE AUDIO ROUTER v5',
            'FORMER_STUDIO_LOUNGE=-3.0',
            'RESTROOM=-7.0',
            'BBYAAudioRoom',
            'BBYAMainTrimDb',
            'BBYAActiveTrimDb',
            'MainClubFinalAuthorityV2 / PureClubFrontExtension',
            'SharedRestroomV1 v2 architecture',
            'BBYABasementMaster',
            'BBYAFunkotMaster',
            'BBYARooftopMaster'
          )){if($audio -notmatch [regex]::Escape($needle)){throw "Missing audio routing marker: $needle"}}
          foreach($forbidden in @(
            'SoundId\s*=',
            'Lighting\.',
            'MarketplaceService',
            'PromptPurchase'
          )){if($audio -match $forbidden){throw "Forbidden audio-router mutation: $forbidden"}}
          Write-Host 'MAIN CLUB ROOM-AWARE AUDIO STATIC QC PASS'

      - name: Project mount QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Get-Content 'maps/bbya-social-hub/default.project.json' -Raw
          $null=$project | ConvertFrom-Json
          foreach($mount in @(
            '132-mainclub-social-lounge-v1.server.lua',
            '104-venue-audio-router.client.lua'
          )){if($project -notmatch [regex]::Escape($mount)){throw "Project mount missing: $mount"}}
          Write-Host 'MAIN CLUB PROJECT MOUNTS PASS'

      - name: Full BBYA Rojo build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mainclub-former-studio-audio-qc.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not (Test-Path $out)){throw 'RBXL output missing'}
          if((Get-Item $out).Length -lt 1024){throw 'RBXL output too small'}
          Write-Host "MAIN CLUB FORMER STUDIO + AUDIO ROJO PASS bytes=$((Get-Item $out).Length)"
