name: BBYA V7 Clean Reference CI

on:
  push:
    branches:
      - agent/bbya-v7-clean
    paths:
      - 'maps/a-club/rebuild/**'
      - 'maps/a-club/place.rbxlx'
      - 'scripts/assemble-bbya-v6-preview.js'
      - 'scripts/inspect-bbya-clean-preview.js'
      - 'scripts/validate-bbya-v7-reference.js'
      - '.github/workflows/bbya-v7-clean-ci.yml'
  pull_request:
    paths:
      - 'maps/a-club/rebuild/**'
      - 'maps/a-club/place.rbxlx'
      - 'scripts/assemble-bbya-v6-preview.js'
      - 'scripts/inspect-bbya-clean-preview.js'
      - 'scripts/validate-bbya-v7-reference.js'
      - '.github/workflows/bbya-v7-clean-ci.yml'
  workflow_dispatch:

concurrency:
  group: bbya-v7-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-assemble-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout BBYA V7 clean branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate V7 source contract
        run: node scripts/validate-bbya-v7-reference.js
      - name: Assemble deterministic BBYA preview
        run: node scripts/assemble-bbya-v6-preview.js a-club /tmp/bbya-v7-clean-preview.rbxlx
      - name: Inspect assembled preview
        run: node scripts/inspect-bbya-clean-preview.js /tmp/bbya-v7-clean-preview.rbxlx
      - name: Revalidate source contract
        run: node scripts/validate-bbya-v7-reference.js
      - name: Upload V7 preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbya-v7-clean-preview
          path: /tmp/bbya-v7-clean-preview.rbxlx
          if-no-files-found: error
          retention-days: 7
