name: BBYA Pro DJ RealMesh v2 - FIXED Isolated Test Publish

on:
  push:
    branches: ['feat/bbya-pro-dj-realmesh-v2-test']
    paths: ['.github/workflows/bbya-pro-dj-realmesh-v2-publish-fixed.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbya-pro-dj-realmesh-v2-fixed-test
  cancel-in-progress: true

env:
  TEST_UNIVERSE_ID: '10762005984'
  TEST_PLACE_ID: '124607344716828'
  LIVE_UNIVERSE_ID: '8116636513'
  LIVE_PLACE_ID: '131894120482837'
  CDJ_XZ: 'assets/bbya-pro-dj-realmesh-v2/BBYA_TEST_CDJ_OPT128.glb.xz'
  DJM_XZ: 'assets/bbya-pro-dj-realmesh-v2/BBYA_TEST_DJM_A9_OPT128.glb.xz'
  CDJ_GLB_SHA256: 'a963e611c75e0c808be2a5e9e1cc942e867b5ad7dc1d938eed544e6060346892'
  DJM_GLB_SHA256: 'aa74336ea95929b44d717d759f788afeb7c4165e0d4c5138ddeef65f5a7920a5'

jobs:
  publish-test:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 || secrets.AM_STUDIO }}
    steps:
      - uses: actions/checkout@v4

      - name: Hard test-only guard
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:TEST_UNIVERSE_ID -ne '10762005984' -or $env:TEST_PLACE_ID -ne '124607344716828'){ throw 'Unexpected test target' }
          if($env:TEST_UNIVERSE_ID -eq $env:LIVE_UNIVERSE_ID -or $env:TEST_PLACE_ID -eq $env:LIVE_PLACE_ID){ throw 'Target collides with BBYA LIVE' }
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){ throw 'Roblox key unavailable' }
          $src=Get-Content 'maps/bbya-social-hub/122-pro-dj-realmesh-test.server.lua' -Raw
          if($src -notmatch 'TEST_PLACE_ID = 124607344716828'){ throw 'Loader place guard missing' }
          if($src -notmatch 'BBYA_PRO_DJ_REALMESH_V2_TEST'){ throw 'Loader authority missing' }
          Write-Host 'BBYA_DJ_V2_FIXED_TARGET_GUARD_PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decompress and verify exact real-mesh assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'bbya-dj-v2-fixed'
          if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $cdj=Join-Path $dir 'BBYA_TEST_CDJ_OPT128.glb'
          $djm=Join-Path $dir 'BBYA_TEST_DJM_A9_OPT128.glb'
          $cdjSrc=Join-Path $env:GITHUB_WORKSPACE $env:CDJ_XZ
          $djmSrc=Join-Path $env:GITHUB_WORKSPACE $env:DJM_XZ
          python -c "import lzma,pathlib; pathlib.Path(r'$cdj').write_bytes(lzma.decompress(pathlib.Path(r'$cdjSrc').read_bytes()))"
          if($LASTEXITCODE -ne 0){throw 'CDJ decompress failed'}
          python -c "import lzma,pathlib; pathlib.Path(r'$djm').write_bytes(lzma.decompress(pathlib.Path(r'$djmSrc').read_bytes()))"
          if($LASTEXITCODE -ne 0){throw 'DJM decompress failed'}
          $cdjHash=(Get-FileHash $cdj -Algorithm SHA256).Hash.ToLowerInvariant()
          $djmHash=(Get-FileHash $djm -Algorithm SHA256).Hash.ToLowerInvariant()
          if($cdjHash -ne $env:CDJ_GLB_SHA256){throw "CDJ hash mismatch $cdjHash"}
          if($djmHash -ne $env:DJM_GLB_SHA256){throw "DJM hash mismatch $djmHash"}
          "BBYA_CDJ_GLB=$cdj" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BBYA_DJM_GLB=$djm" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_DJ_V2_BINARY_PASS cdj=$((Get-Item $cdj).Length) djm=$((Get-Item $djm).Length)"

      - name: Resolve test-universe creator
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $meta=Invoke-RestMethod -Method Get -Uri "https://games.roblox.com/v1/games?universeIds=$env:TEST_UNIVERSE_ID"
          if(-not $meta.data -or $meta.data.Count -lt 1){throw 'Creator lookup failed'}
          $c=$meta.data[0].creator
          $type=[string]$c.type; $id=[string]$c.id
          if($type -ieq 'Group'){ $field='groupId' } elseif($type -ieq 'User'){ $field='userId' } else { throw "Unsupported creator $type" }
          "BBYA_CREATOR_FIELD=$field" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BBYA_CREATOR_ID=$id" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_DJ_V2_CREATOR_PASS type=$type id=$id"

      - name: Upload both Roblox Model assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Upload-Model([string]$File,[string]$Name,[string]$Description){
            $creator=@{}; $creator[$env:BBYA_CREATOR_FIELD]=$env:BBYA_CREATOR_ID
            $request=@{assetType='Model';displayName=$Name;description=$Description;creationContext=@{creator=$creator}} | ConvertTo-Json -Depth 8 -Compress
            $rf=Join-Path $env:RUNNER_TEMP ("djv2-"+[guid]::NewGuid().ToString('N')+'.json')
            [IO.File]::WriteAllText($rf,$request,(New-Object Text.UTF8Encoding($false)))
            try {
              $raw=& curl.exe --silent --show-error --location --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --form "request=<$rf;type=application/json" --form "fileContent=@$File;type=model/gltf-binary" 'https://apis.roblox.com/assets/v1/assets'
            } finally { Remove-Item $rf -Force -ErrorAction SilentlyContinue }
            if($LASTEXITCODE -ne 0){throw "Upload curl failed $Name"}
            try{$created=$raw|ConvertFrom-Json}catch{throw "Invalid upload response $Name : $raw"}
            if(-not $created.path){throw "Upload rejected $Name : $raw"}
            $opid=([string]$created.path)-replace '^operations/',''
            for($i=0;$i -lt 90;$i++){
              Start-Sleep -Seconds 4
              $opraw=& curl.exe --silent --show-error --location --header "x-api-key: $env:ROBLOX_API_KEY" "https://apis.roblox.com/assets/v1/operations/$opid"
              if($LASTEXITCODE -ne 0){continue}
              try{$op=$opraw|ConvertFrom-Json}catch{continue}
              if($op.done){
                if($op.error){throw "Asset operation failed $Name : $($op.error|ConvertTo-Json -Depth 8 -Compress)"}
                $id=[string]$op.response.assetId
                if($id -notmatch '^\d+$'){throw "No assetId $Name : $opraw"}
                Write-Host "UPLOAD_DONE name=$Name asset=$id moderation=$($op.response.moderationResult.moderationState)"
                return $id
              }
            }
            throw "Asset operation timeout $Name"
          }
          $cdj=Upload-Model $env:BBYA_CDJ_GLB 'BBYA Pro DJ Deck Pair - Test' 'Test-only real-mesh DJ deck pair. Source MaxTht via Sketchfab, CC Attribution.'
          $djm=Upload-Model $env:BBYA_DJM_GLB 'BBYA Pro DJ Mixer - Test' 'Test-only real-mesh four-channel DJ mixer. Source MaxTht via Sketchfab, CC Attribution.'
          "BBYA_CDJ_ASSET_ID=$cdj" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BBYA_DJM_ASSET_ID=$djm" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_DJ_V2_ASSETS_PASS cdj=$cdj djm=$djm"

      - name: Inject asset IDs into guarded loader
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/122-pro-dj-realmesh-test.server.lua'
          $s=Get-Content $p -Raw
          $s=[regex]::Replace($s,'local CDJ_PAIR_ASSET_ID = \d+ -- BBYA_PRO_DJ_V2_CDJ_ASSET_ID',"local CDJ_PAIR_ASSET_ID = $env:BBYA_CDJ_ASSET_ID -- BBYA_PRO_DJ_V2_CDJ_ASSET_ID")
          $s=[regex]::Replace($s,'local DJM_A9_ASSET_ID = \d+ -- BBYA_PRO_DJ_V2_DJM_ASSET_ID',"local DJM_A9_ASSET_ID = $env:BBYA_DJM_ASSET_ID -- BBYA_PRO_DJ_V2_DJM_ASSET_ID")
          Set-Content $p $s -Encoding utf8
          Write-Host 'BBYA_DJ_V2_INJECT_PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'; $zip=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}; if(Test-Path $zip){Remove-Item $zip -Force}
            New-Item -ItemType Directory $dir -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive $zip $dir -Force
            $rojo=(Get-ChildItem $dir -Filter rojo.exe -Recurse|Select-Object -First 1).FullName
          }
          $ver=& $rojo --version
          if(($ver -join ' ') -notmatch '7\.7\.0'){throw "Wrong Rojo $ver"}
          "ROJO_EXE=$rojo"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ROJO_PASS $ver"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build test place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-pro-dj-realmesh-v2-fixed.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          "BBYA_TEST_PLACE_FILE=$place"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_DJ_V2_BUILD_PASS bytes=$((Get-Item $place).Length)"

      - name: Inject temporary test registry
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/registry.json'; $r=Get-Content $p -Raw|ConvertFrom-Json
          $target=[pscustomobject]@{name='BBYA Music UI Test - Pro DJ RealMesh v2';enabled=$true;universeId=$env:TEST_UNIVERSE_ID;placeId=$env:TEST_PLACE_ID;file='maps/bbya-social-hub/place.rbxlx'}
          $r.maps|Add-Member -NotePropertyName 'bbya-music-ui-test' -NotePropertyValue $target -Force
          $r|ConvertTo-Json -Depth 10|Set-Content $p -Encoding utf8
          Write-Host 'BBYA_DJ_V2_REGISTRY_PASS'

      - name: Publish Music UI test place only
        shell: powershell
        env:
          PUBLISH_RECEIPT_DIR: deploy-status-pro-dj-realmesh-v2-fixed
        run: |
          $ErrorActionPreference='Stop'
          $env:PLACE_FILE_OVERRIDE=$env:BBYA_TEST_PLACE_FILE
          node scripts/publish-map.js bbya-music-ui-test
          if($LASTEXITCODE -ne 0){throw 'Test publish failed'}

      - name: Verify receipt and version
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='deploy-status-pro-dj-realmesh-v2-fixed/bbya-music-ui-test.json'
          if(-not(Test-Path $p)){throw 'Receipt missing'}
          $r=Get-Content $p -Raw|ConvertFrom-Json
          if($r.status -ne 'PUBLISHED'){throw "status=$($r.status)"}
          if([string]$r.universeId -ne $env:TEST_UNIVERSE_ID -or [string]$r.placeId -ne $env:TEST_PLACE_ID){throw 'Receipt target mismatch'}
          if([string]$r.universeId -eq $env:LIVE_UNIVERSE_ID -or [string]$r.placeId -eq $env:LIVE_PLACE_ID){throw 'LIVE target detected'}
          if(-not $r.response.versionNumber){throw 'versionNumber missing'}
          Write-Host "BBYA_PRO_DJ_REALMESH_V2_PUBLISHED version=$($r.response.versionNumber) source=${{ github.sha }} cdj=$env:BBYA_CDJ_ASSET_ID djm=$env:BBYA_DJM_ASSET_ID"
