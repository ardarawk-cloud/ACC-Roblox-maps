name: BBYA Mall Selection Fix Temp

on:
  push:
    branches:
      - 'feat/bbya-mall-catalog-v8-reference-rebuild'
    paths:
      - '.github/workflows/bbya-mall-selection-fix-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/bbya-mall-catalog-v8-reference-rebuild
          fetch-depth: 0

      - name: Patch product selection action panel
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/133-mall-robux-commerce.client.lua'
          $s=Get-Content $p -Raw
          $old='local function selectItem(it)selected=it;selectedLabel.Text=nameOf(it);selectedPrice.Text=priceText(it)end'
          $new='local function selectItem(it)selected=it;selectedLabel.Text=nameOf(it);selectedPrice.Text=priceText(it);action.Visible=root.Visible and products.Visible end'
          if(-not $s.Contains($old)){ throw 'selectItem authority line not found; stop instead of broad edit' }
          $s=$s.Replace($old,$new)
          [System.IO.File]::WriteAllText((Resolve-Path $p),$s,(New-Object System.Text.UTF8Encoding($false)))
          if(-not (Select-String -Path $p -SimpleMatch 'action.Visible=root.Visible and products.Visible')){ throw 'selection action patch missing' }

      - name: Commit exact Mall UI fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ardarawk-cloud'
          git config user.email 'ardarawk@gmail.com'
          git add maps/bbya-social-hub/133-mall-robux-commerce.client.lua
          git diff --cached --quiet && exit 0
          git commit -m 'fix(test): show Mall TRY panel on product selection'
          git push origin HEAD:feat/bbya-mall-catalog-v8-reference-rebuild
