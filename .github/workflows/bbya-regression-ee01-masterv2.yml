name: BBYA Regression EE01 MASTER V2 Publish

on:
  push:
    branches:
      - deploy/bbya-regression-ee01-masterv2
    paths:
      - '.github/workflows/bbya-regression-ee01-masterv2.yml'

permissions:
  contents: read

jobs:
  publish-exact:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - name: Fetch exact production source without Git
        shell: powershell
        env:
          TARGET_SOURCE: ee01cca630a0030f6151e8990485897e3ae0941c
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP ("bbya-prod-"+$env:TARGET_SOURCE+".zip")
          $extract=Join-Path $env:RUNNER_TEMP ("bbya-prod-"+$env:TARGET_SOURCE)
          if(Test-Path $zip){Remove-Item $zip -Force}
          if(Test-Path $extract){Remove-Item $extract -Recurse -Force}
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri ("https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/"+$env:TARGET_SOURCE) -OutFile $zip
          if(-not (Test-Path $zip) -or (Get-Item $zip).Length -lt 1024){throw 'Exact source archive missing'}
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $root=Get-ChildItem $extract -Directory | Select-Object -First 1
          if(-not $root){throw 'Extracted source root missing'}
          Get-ChildItem $env:GITHUB_WORKSPACE -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $root.FullName -Force | ForEach-Object { Copy-Item $_.FullName -Destination $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "BBYA_PROD_EXACT_SOURCE_PASS source=$env:TARGET_SOURCE"

      - name: Verify production locks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $reg=Get-Content 'maps/registry.json' -Raw | ConvertFrom-Json
          $t=$reg.maps.'a-club'
          if(-not $t){throw 'a-club missing'}
          if([string]$t.universeId -ne '8116636513'){throw 'Unexpected production universe'}
          if([string]$t.placeId -ne '131894120482837'){throw 'Unexpected production place'}
          $legacy=Get-Content 'maps/bbya-social-hub/81-basement-audio-ui.client.lua' -Raw
          $router=Get-Content 'maps/bbya-social-hub/104-venue-audio-router.client.lua' -Raw
          $ug=Get-Content 'maps/bbya-social-hub/74-basement-premium-upgrade.server.lua' -Raw
          $dark=Get-Content 'maps/bbya-social-hub/87-basement-full-upgrade.server.lua' -Raw
          $cars=Get-Content 'maps/bbya-social-hub/77-entrance-car-cleanup.server.lua' -Raw
          $lighting=Get-Content 'maps/bbya-social-hub/28-lighting-ambience.server.lua' -Raw
          if($legacy -match '(?m)\.Volume\s*='){throw 'Legacy 81 still owns volume'}
          if($legacy -notmatch 'BBYALegacyVolumeWriterDisabled'){throw 'Legacy disable marker missing'}
          if($router -notmatch 'ROUTER_V9_EQ_ONLY'){throw 'Router v9 authority missing'}
          if($router -notmatch 'BBYAFunkotHardGateV9'){throw 'Funkot gate v9 missing'}
          if($ug -notmatch 'DARK_SAFE_V3'){throw 'Underground dark-safe builder missing'}
          if($ug -match 'GetService\("Lighting"\)'){throw 'Underground builder owns global Lighting'}
          if($dark -notmatch 'DARK_UNDERGROUND_V6_SLIGHT_LIFT'){throw 'Underground final dark lock missing'}
          if($cars -notmatch 'fallback red/blue entrance cars remain'){throw 'Entrance fallback retention missing'}
          if($cars -notmatch 'FallbackCarsRetained'){throw 'Entrance fallback marker missing'}
          if($lighting -notmatch 'GLOBAL_LIGHTING_AUTHORITY_V4'){throw 'Global Lighting authority missing'}
          Write-Host 'BBYA_PROD_LOCKS_PASS audio=router_v9 underground=dark_safe cars=transactional global_lighting=v4'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source} else {
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-prod-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-prod-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            if(Test-Path $zip){Remove-Item $zip -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact production RBXL
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:GITHUB_WORKSPACE 'BBYA-PROD-EE01.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not (Test-Path $place)){throw 'RBXL missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw 'RBXL unexpectedly small'}
          $hash=(Get-FileHash -Algorithm SHA256 $place).Hash.ToLower()
          "$hash  BBYA-PROD-EE01.rbxl" | Set-Content 'BBYA-PROD-EE01.sha256' -Encoding ascii
          "PLACE_FILE_OVERRIDE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_PROD_BUILD_PASS bytes=$bytes sha256=$hash"

      - name: Publish exact production source with MASTER V2
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PUBLISH_RECEIPT_DIR: deploy-status-masterv2
          TARGET_SOURCE: ee01cca630a0030f6151e8990485897e3ae0941c
        run: |
          $ErrorActionPreference='Stop'
          node -e "process.env.GITHUB_SHA=process.env.TARGET_SOURCE; process.argv[2]='a-club'; require('./scripts/publish-map.js')"
          if($LASTEXITCODE -ne 0){throw 'MASTER_V2 Roblox publish failed'}
          $receipt='deploy-status-masterv2/a-club.json'
          if(-not (Test-Path $receipt)){throw 'Receipt missing'}
          $r=Get-Content $receipt -Raw | ConvertFrom-Json
          if($r.status -ne 'PUBLISHED'){throw 'Receipt not PUBLISHED'}
          if($r.sourceCommit -ne $env:TARGET_SOURCE){throw 'Receipt source mismatch'}
          if([string]$r.universeId -ne '8116636513'){throw 'Receipt universe mismatch'}
          if([string]$r.placeId -ne '131894120482837'){throw 'Receipt place mismatch'}
          Get-Content $receipt
          Write-Host "BBYA_MASTER_V2_RECEIPT_PASS version=$($r.response.versionNumber) source=$($r.sourceCommit)"

      - name: Upload production proof
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-PROD-EE01-MASTER-V2
          path: |
            BBYA-PROD-EE01.rbxl
            BBYA-PROD-EE01.sha256
            deploy-status-masterv2/a-club.json
          retention-days: 14
