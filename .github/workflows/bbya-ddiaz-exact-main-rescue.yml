name: BBYA Ddiaz Exact Main Rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-ddiaz-exact-main-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbya-ddiaz-exact-main-rescue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: e351b24a67a2df4bb4c73d735b8b5bf4a5b6f1f9
    steps:
      - name: Checkout exact Ddiaz source
        uses: actions/checkout@v4
        with:
          ref: e351b24a67a2df4bb4c73d735b8b5bf4a5b6f1f9
          fetch-depth: 0

      - name: Verify exact source and Ddiaz authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          f='maps/bbya-social-hub/77-entrance-car-cleanup.server.lua'
          grep -Fq 'DDIAZ PREMIUM VALET ARRIVAL v8' "$f"
          grep -Fq '97052038046118' "$f"
          grep -Fq '91172120786409' "$f"
          grep -Fq 'Ddiaz Design' "$f"
          grep -Fq 'creator permission' "$f"
          echo "BBYA_DDIAZ_EXACT_SOURCE_PASS source=$SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Rojo
        id: rojo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}

      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked

      - name: Build exact BBYA source
        shell: bash
        run: |
          set -euo pipefail
          rojo --version
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-ddiaz-exact-main.rbxl
          test -s /tmp/bbya-ddiaz-exact-main.rbxl
          ls -lh /tmp/bbya-ddiaz-exact-main.rbxl

      - name: Publish exact source with alternate Open Cloud publisher
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PLACE_FILE_OVERRIDE: /tmp/bbya-ddiaz-exact-main.rbxl
          PUBLISH_RECEIPT_DIR: deploy-status-ddiaz-rescue
          GITHUB_SHA: e351b24a67a2df4bb4c73d735b8b5bf4a5b6f1f9
        run: |
          set -euo pipefail
          node scripts/publish-map.js a-club
          test -f deploy-status-ddiaz-rescue/a-club.json
          cat deploy-status-ddiaz-rescue/a-club.json

      - name: Upload immutable receipt
        uses: actions/upload-artifact@v4
        with:
          name: bbya-ddiaz-exact-main-receipt-e351b24
          path: deploy-status-ddiaz-rescue/a-club.json
          if-no-files-found: error
          retention-days: 30
