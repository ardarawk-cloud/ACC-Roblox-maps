name: After School City V1.3.5 Basketball Asset Upload

on:
  push:
    branches:
      - after-school-city/v135-basketball-asset
    paths:
      - '.github/workflows/after-school-city-v135-basketball-asset-upload.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LIVE_SOURCE: '4a5b0acd02299399b4118b707ea22ad8751537f1'
      LIVE_VERSION: '59'
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      DRIVE_FILE_ID: '1Ltt5fmpnBCN9pmS27Au8pSzqsKxBix3T'
      ZIP_BYTES: '62414902'
      ZIP_SHA256: 'c6058fc53b4a151f389174e4e18530e8d1e06a93fc41c1c87724b51fb5b349a0'
      GLB_BYTES: '28638376'
      GLB_SHA256: 'd8b69775782ed2388ae8650e8ca8eae16f70ab153f2c931922fa0d3d23c8fdc6'
      OPT_BYTES: '6527592'
      OPT_SHA256: 'e50cd035e2ce25abb60754ee2cfb9bb9c2bf406ea737ec9bcf983cd30b288844'
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production source and current LIVE receipt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git cat-file -e "$env:LIVE_SOURCE^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'LIVE source unavailable' }
          $prod = @(git diff --name-only $env:LIVE_SOURCE HEAD -- 'maps/after-school-city')
          if ($prod.Count -ne 0) { throw "Production map changed before basketball upload: $($prod -join ', ')" }
          git fetch origin main
          $paths = @(git ls-tree -r --name-only origin/main -- deploy-status | Where-Object { $_ -like 'deploy-status/after-school-city-*.json' })
          $maxVersion = -1
          $maxSource = ''
          foreach ($path in $paths) {
            try {
              $j = ((git show "origin/main:$path" | Out-String) | ConvertFrom-Json)
              if ($j.project -eq 'AFTER SCHOOL CITY' -and $j.status -eq 'LIVE_PUBLISHED' -and [string]$j.placeId -eq $env:PLACE_ID) {
                $v = [int]$j.versionNumber
                if ($v -gt $maxVersion) { $maxVersion = $v; $maxSource = [string]$j.sourceCommit }
              }
            } catch {}
          }
          if ($maxVersion -ne [int]$env:LIVE_VERSION -or $maxSource -ne $env:LIVE_SOURCE) { throw "LIVE changed: v$maxVersion source=$maxSource" }
          Write-Host "LIVE GATE PASS v$maxVersion source=$maxSource"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install tooling
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check --no-input 'Pillow==12.3.0' 'gdown==5.2.0'
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }

      - name: Download and optimize basketball GLB
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'asc-v135-basket'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip = Join-Path $dir 'basket.zip'
          python -m gdown $env:DRIVE_FILE_ID -O $zip
          if ($LASTEXITCODE -ne 0) { throw 'Drive download failed' }
          if ((Get-Item $zip).Length -ne [int64]$env:ZIP_BYTES) { throw 'ZIP bytes mismatch' }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA256) { throw 'ZIP SHA mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $dir 'unpacked') -Force
          $glb = Join-Path $dir 'unpacked/source/BasketBall_Court.glb'
          if ((Get-Item $glb).Length -ne [int64]$env:GLB_BYTES) { throw 'GLB bytes mismatch' }
          if ((Get-FileHash $glb -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GLB_SHA256) { throw 'GLB SHA mismatch' }
          $out = Join-Path $dir 'BasketBall_Court_roblox_mobile.glb'
          python '.github/scripts/asc_optimize_glb.py' $glb $out 1024
          if ($LASTEXITCODE -ne 0) { throw 'GLB optimization failed' }
          if ((Get-Item $out).Length -ne [int64]$env:OPT_BYTES) { throw 'Optimized GLB bytes mismatch' }
          if ((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:OPT_SHA256) { throw 'Optimized GLB SHA mismatch' }
          "ASC_BASKET_GLB=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BASKET PREP PASS bytes=$env:OPT_BYTES sha=$env:OPT_SHA256"

      - name: Resolve Roblox creator
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Invoke-RestMethod -Method Get -Uri "https://games.roblox.com/v1/games?universeIds=$env:UNIVERSE_ID"
          $creator = $meta.data[0].creator
          $type = [string]$creator.type
          $id = [string]$creator.id
          if ($id -notmatch '^\d+$') { throw 'Invalid creator id' }
          if ($type -ieq 'Group') { "ASC_CREATOR_FIELD=groupId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append }
          elseif ($type -ieq 'User') { "ASC_CREATOR_FIELD=userId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append }
          else { throw "Unsupported creator type: $type" }
          "ASC_CREATOR_ID=$id" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CREATOR PASS type=$type id=$id"

      - name: Upload basketball model to Roblox
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)) { throw 'Roblox API key unavailable' }
          $creator = @{}
          $creator[$env:ASC_CREATOR_FIELD] = $env:ASC_CREATOR_ID
          $payload = @{ assetType='Model'; displayName='ASC Basketball Court - Mobile'; description='Basketball court model for AFTER SCHOOL CITY, mobile texture optimization.'; creationContext=@{ creator=$creator } } | ConvertTo-Json -Depth 8 -Compress
          $requestFile = Join-Path $env:RUNNER_TEMP 'basket-request.json'
          [System.IO.File]::WriteAllText($requestFile, $payload, (New-Object System.Text.UTF8Encoding($false)))
          $raw = & curl.exe --silent --show-error --location --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --form "request=<$requestFile;type=application/json" --form "fileContent=@$env:ASC_BASKET_GLB;type=model/gltf-binary" 'https://apis.roblox.com/assets/v1/assets'
          if ($LASTEXITCODE -ne 0) { throw 'Roblox asset upload request failed' }
          $created = $raw | ConvertFrom-Json
          if (-not $created.path) { throw "Roblox upload rejected: $raw" }
          $operationId = ([string]$created.path) -replace '^operations/',''
          $assetId = ''
          $moderation = 'UNKNOWN'
          for ($i=0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 4
            $opRaw = & curl.exe --silent --show-error --location --header "x-api-key: $env:ROBLOX_API_KEY" "https://apis.roblox.com/assets/v1/operations/$operationId"
            try { $op = $opRaw | ConvertFrom-Json } catch { continue }
            if ($op.done) {
              if ($op.error) { throw "Roblox asset operation failed: $opRaw" }
              $assetId = [string]$op.response.assetId
              $moderation = [string]$op.response.moderationResult.moderationState
              break
            }
          }
          if ($assetId -notmatch '^\d+$') { throw 'Basket asset ID not returned' }
          Write-Host "ASC_BASKETBALL_ASSET_READY assetId=$assetId moderation=$moderation optBytes=$env:OPT_BYTES optSha=$env:OPT_SHA256"
          Write-Host 'PLACE_PUBLISH=NOT_PERFORMED'
