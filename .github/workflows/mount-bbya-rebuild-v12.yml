name: MOUNT BBYA Rebuild v1.2 Mobile Controls Hotfix

on:
  push:
    branches: [mount-bbya-rebuild-visual-lock-v1]
    paths:
      - 'maps/mount-bbya/mount-bbya.rebuild-v1.1.server.lua'
      - 'maps/mount-bbya/mount-bbya.config.json'
      - 'scripts/build-mount-bbya-rebuild-v12.js'
      - 'scripts/publish-mount-bbya-rebuild-v12.js'
      - '.github/workflows/mount-bbya-rebuild-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mount-bbya-rebuild-v12
  cancel-in-progress: false

jobs:
  build_validate_publish:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout exact v1.2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Preflight mobile controls hotfix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --version
          node --check scripts/build-mount-bbya-rebuild-v12.js
          node --check scripts/publish-mount-bbya-rebuild-v12.js
          $builder=Get-Content 'scripts/build-mount-bbya-rebuild-v12.js' -Raw
          foreach($required in @('MOUNT_BBYA_V12_Bootstrap','MOUNT_BBYA_V12_MobileCamera','mobile-control-hotfix-v1.2','Players.CharacterAutoLoads=true','Enum.CameraType.Custom')){
            if($builder -notmatch [regex]::Escape($required)){throw "Missing v1.2 control marker: $required"}
          }
          if($builder -match [regex]::Escape('Players.CharacterAutoLoads=false')){throw 'v1.2 builder still disables CharacterAutoLoads'}
          $cfg=Get-Content 'maps/mount-bbya/mount-bbya.config.json' -Raw | ConvertFrom-Json
          if($cfg.publishTarget.universeId -ne '4187755690' -or $cfg.publishTarget.placeId -ne '11832985967'){throw 'MOUNT BBYA target mismatch'}
          if($cfg.forbiddenTarget.universeId -ne '10744139279' -or $cfg.forbiddenTarget.placeId -ne '82661754996018'){throw 'Forbidden target lock missing'}
          Write-Host 'MOUNT_BBYA_V12_PREFLIGHT_PASS'

      - name: Build v1.2 RBXLX
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/build-mount-bbya-rebuild-v12.js
          $place='maps/mount-bbya/place.rbxlx'
          if(-not (Test-Path $place)){throw 'MOUNT BBYA place.rbxlx missing'}
          if((Get-Item $place).Length -lt 22000){throw 'MOUNT BBYA v1.2 place unexpectedly small'}
          $text=Get-Content $place -Raw
          try {[xml]$xml=$text}catch{throw "RBXLX XML parse failed: $($_.Exception.Message)"}
          foreach($required in @('MOUNT_BBYA_V12_Bootstrap','MOUNT_BBYA_V12_World','MOUNT_BBYA_V12_Release','MOUNT_BBYA_V12_QC','MOUNT_BBYA_V12_MobileCamera','mobile-control-hotfix-v1.2')){
            if($text -notmatch [regex]::Escape($required)){throw "Generated RBXLX missing: $required"}
          }
          if($text -match [regex]::Escape('Players.CharacterAutoLoads=false')){throw 'Generated RBXLX disables CharacterAutoLoads'}
          if($text -match 'ACC_MountainSocial'){throw 'Legacy Mountain Social root leaked into place'}
          $serverCount=([regex]::Matches($text,'<Item class="Script"')).Count
          $localCount=([regex]::Matches($text,'<Item class="LocalScript"')).Count
          if($serverCount -lt 4 -or $localCount -lt 1){throw "Expected >=4 server scripts and >=1 local script; got server=$serverCount local=$localCount"}
          Write-Host "MOUNT_BBYA_V12_BUILD_PASS bytes=$((Get-Item $place).Length) server=$serverCount local=$localCount"

      - name: Publish isolated MOUNT BBYA v1.2
        id: publish
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $log=Join-Path $env:RUNNER_TEMP 'mount-bbya-v12-publish.log'
          if(Test-Path $log){Remove-Item $log -Force}
          node scripts/publish-mount-bbya-rebuild-v12.js *> $log
          $code=$LASTEXITCODE
          if(Test-Path $log){Get-Content $log}
          "PUBLISH_EXIT_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if($code -ne 0){exit $code}

      - name: Persist v1.2 receipt
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'mount-bbya-v12-publish.log'
          $status=if($env:PUBLISH_EXIT_CODE -eq '0'){'PUBLISHED_CANDIDATE'}else{'FAILED'}
          $lines=@(
            "status=$status",
            'build=mobile-control-hotfix-v1.2',
            "sourceCommit=${{ github.sha }}",
            'branch=mount-bbya-rebuild-visual-lock-v1',
            'universeId=4187755690',
            'placeId=11832985967',
            'fix=character-autoload-plus-mobile-custom-camera',
            'runtimeVisualQC=PENDING',
            "publishExitCode=$env:PUBLISH_EXIT_CODE"
          )
          if(Test-Path $log){$lines += (Get-Content $log | Select-Object -Last 15 | ForEach-Object {"log=$_"})}
          $raw=($lines -join "`n")+"`n"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/mount-bbya-rebuild-v12.txt"
          $existingSha=$null
          try{$existing=Invoke-RestMethod -Headers $headers -Uri "$api`?ref=mount-bbya-rebuild-visual-lock-v1" -Method Get;$existingSha=$existing.sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $payload=@{message='Record MOUNT BBYA rebuild v1.2 candidate receipt [skip ci]';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($raw));branch='mount-bbya-rebuild-visual-lock-v1'}
          if($existingSha){$payload.sha=$existingSha}
          Invoke-RestMethod -Headers $headers -Uri $api -Method Put -ContentType 'application/json' -Body ($payload|ConvertTo-Json -Depth 5) | Out-Null
          Write-Host "MOUNT_BBYA_V12_RECEIPT_STATUS=$status"

      - name: Enforce v1.2 publish result
        if: always()
        shell: powershell
        run: |
          if($env:PUBLISH_EXIT_CODE -ne '0'){throw 'MOUNT BBYA v1.2 publish did not succeed'}
          Write-Host 'MOUNT_BBYA_V12_PUBLISH_PASS'
