name: Publish Hangar Exclusive Club v9 Static Full Mesh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hangar-exclusive-club-publish-v9.yml'
  workflow_dispatch:

concurrency:
  group: hangar-exclusive-club-v9-live-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  HANGAR_UNIVERSE_ID: '10745364913'
  HANGAR_PLACE_ID: '76001567401911'
  HANGAR_MODE: 'V9_STATIC_CLOUD_FULL_MESH'
  HANGAR_V9_MODEL_ASSET_ID: '81110796411770'

jobs:
  build-publish-verify:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 25
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject approved static cloud asset into build source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([int64]$env:HANGAR_V9_MODEL_ASSET_ID -le 0){throw 'Approved Hangar v9 asset ID is invalid'}
          $path='maps/hangar-exclusive-club/static-mesh-v9.server.lua'
          $runtime=Get-Content $path -Raw
          $pattern='local HANGAR_MODEL_ASSET_ID = \d+ -- HANGAR_STATIC_MODEL_ASSET_ID'
          if($runtime -notmatch $pattern){throw 'Hangar v9 static asset marker missing'}
          $runtime=[regex]::Replace($runtime,$pattern,"local HANGAR_MODEL_ASSET_ID = $env:HANGAR_V9_MODEL_ASSET_ID -- HANGAR_STATIC_MODEL_ASSET_ID")
          Set-Content -Path $path -Value $runtime -Encoding utf8
          if((Get-Content $path -Raw) -notmatch "local HANGAR_MODEL_ASSET_ID = $env:HANGAR_V9_MODEL_ASSET_ID"){throw 'Static asset injection failed'}
          Write-Host "HANGAR_V9_ASSET_INJECT_PASS asset=$env:HANGAR_V9_MODEL_ASSET_ID"

      - name: Hard gate static cloud mesh authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $runtime=Get-Content 'maps/hangar-exclusive-club/static-mesh-v9.server.lua' -Raw
          foreach($marker in @('STATIC CLOUD FULL MESH v9','HANGAR_STATIC_MODEL_ASSET_ID','InsertService.LoadAsset','V9_STATIC_CLOUD_FULL_MESH','STATIC_CLOUD_MESHPART_ONLY','HangarGalaxyRemoved','local WIDTH = 360','local DEPTH = 280','local CROWN_H = 126')){
            if($runtime -notmatch [regex]::Escape($marker)){throw "Missing v9 runtime marker: $marker"}
          }
          $m=[regex]::Match($runtime,'local HANGAR_MODEL_ASSET_ID = (\d+) -- HANGAR_STATIC_MODEL_ASSET_ID')
          if(-not $m.Success){throw 'Static model asset ID marker malformed'}
          $asset=[int64]$m.Groups[1].Value
          if($asset -ne [int64]$env:HANGAR_V9_MODEL_ASSET_ID){throw "Static model asset mismatch source=$asset expected=$env:HANGAR_V9_MODEL_ASSET_ID"}
          $project=Get-Content 'maps/hangar-exclusive-club/default.project.json' -Raw
          if($project -notmatch 'static-mesh-v9.server.lua'){throw 'v9 static runtime is not mounted'}
          if($project -match 'full-mesh-v8.server.lua'){throw 'runtime EditableMesh v8 must not be mounted'}
          Write-Host "HANGAR_V9_STATIC_SOURCE_GATE_PASS asset=$asset source=$env:GITHUB_SHA"

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $d=Join-Path $env:RUNNER_TEMP 'hangar-v9-rojo';$z=Join-Path $env:RUNNER_TEMP 'hangar-v9-rojo.zip'
            if(Test-Path $d){Remove-Item $d -Recurse -Force};New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive -Path $z -DestinationPath $d -Force
            $e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1;if(-not $e){throw 'rojo.exe missing'};$rojo=$e.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Hangar v9 place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'hangar-exclusive-club-v9-static.rbxlx'
          & $env:ROJO_EXE build 'maps/hangar-exclusive-club/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not(Test-Path $place) -or (Get-Item $place).Length -lt 30000){throw 'Invalid Hangar v9 RBXLX'}
          $hash=(Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          "HANGAR_PLACE_FILE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_BYTES=$((Get-Item $place).Length)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_V9_BUILD_PASS bytes=$((Get-Item $place).Length) sha256=$hash"

      - name: Publish to Roblox
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'ROBLOX_OPEN_CLOUD_MASTER_V2 secret missing'}
          $url="https://apis.roblox.com/universes/v1/$env:HANGAR_UNIVERSE_ID/places/$env:HANGAR_PLACE_ID/versions?versionType=Published"
          $headers=@{'x-api-key'=$env:ROBLOX_API_KEY}
          $resp=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers $headers -ContentType 'application/xml' -InFile $env:HANGAR_PLACE_FILE
          if([int]$resp.StatusCode -lt 200 -or [int]$resp.StatusCode -ge 300){throw "Roblox publish HTTP $($resp.StatusCode)"}
          $payload=$resp.Content|ConvertFrom-Json
          $version=[int]$payload.versionNumber
          if($version -le 8){throw "Expected Roblox version >8, got $version"}
          "HANGAR_ROBLOX_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_V9_PUBLISHED version=$version asset=$env:HANGAR_V9_MODEL_ASSET_ID"

      - name: Persist verified receipt through GitHub API
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=[ordered]@{
            status='LIVE_PUBLISHED'
            ok=$true
            universeId=$env:HANGAR_UNIVERSE_ID
            placeId=$env:HANGAR_PLACE_ID
            sourceCommit=$env:GITHUB_SHA
            mode=$env:HANGAR_MODE
            staticModelAssetId=[int64]$env:HANGAR_V9_MODEL_ASSET_ID
            staticModelModeration='Approved'
            robloxVersion=[int]$env:HANGAR_ROBLOX_VERSION
            placeBytes=[int64]$env:HANGAR_PLACE_BYTES
            sha256=$env:HANGAR_PLACE_SHA256
            publishRun=[int64]$env:GITHUB_RUN_ID
            publishedAt=(Get-Date).ToUniversalTime().ToString('o')
            runtimeVisualQC='PENDING_SCREENSHOT'
            runtimeEditableMesh='DISABLED_FROM_MOUNT'
            previewUrl='https://www.roblox.com/games/76001567401911'
          }
          $text=$receipt|ConvertTo-Json -Depth 5
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"))
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='Hangar-v9-publisher'}
          $path='deploy-status/hangar-exclusive-club.json'
          $enc=(($path.Split('/')|ForEach-Object{[Uri]::EscapeDataString($_)}) -join '/')
          $u="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$enc"
          $sha=$null
          try{$old=Invoke-RestMethod -Headers $h -Uri ($u+'?ref=main');$sha=[string]$old.sha}catch{if([int]$_.Exception.Response.StatusCode -ne 404){throw}}
          $body=@{message="Record Hangar v$env:HANGAR_ROBLOX_VERSION static full mesh live [skip ci]";content=$b64;branch='main'}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $u -Body ($body|ConvertTo-Json -Depth 4)|Out-Null
          Write-Host "HANGAR_V9_RECEIPT_PERSISTED version=$env:HANGAR_ROBLOX_VERSION asset=$env:HANGAR_V9_MODEL_ASSET_ID source=$env:GITHUB_SHA"

      - name: Enforce publish variables
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([int]$env:HANGAR_ROBLOX_VERSION -le 8){throw 'Hangar version did not increment'}
          if([int64]$env:HANGAR_V9_MODEL_ASSET_ID -le 0){throw 'Hangar static asset id invalid'}
          if([int64]$env:HANGAR_PLACE_BYTES -lt 30000){throw 'Hangar place bytes invalid'}
          if($env:HANGAR_PLACE_SHA256 -notmatch '^[0-9a-f]{64}$'){throw 'Hangar SHA256 invalid'}
          Write-Host "HANGAR_V9_LIVE_VERIFIED version=$env:HANGAR_ROBLOX_VERSION asset=$env:HANGAR_V9_MODEL_ASSET_ID source=$env:GITHUB_SHA"
