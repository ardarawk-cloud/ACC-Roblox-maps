name: BBYA Studio Visual Audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/worker-jobs/bbya-visual-trigger.txt'
      - '.github/workflows/bbya-studio-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on:
      - self-hosted
      - windows
      - x64
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Play BBYA and capture Studio view
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class NativeWin {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          }
          "@

          $proc = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proc) { throw 'Roblox Studio not found on cloud worker' }
          $hwnd = [IntPtr]$proc.MainWindowHandle
          [NativeWin]::ShowWindow($hwnd, 9) | Out-Null
          [NativeWin]::SetForegroundWindow($hwnd) | Out-Null
          Start-Sleep -Seconds 1

          # Start Play mode so LocalScripts and mobile-facing UI actually exist.
          [System.Windows.Forms.SendKeys]::SendWait('{F5}')
          Start-Sleep -Seconds 9

          # Use Studio Command Bar while Play is running: move the spawned player to the DJ wall.
          $root = [System.Windows.Automation.AutomationElement]::FromHandle($hwnd)
          $editCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'commandBarScriptEditor')
          $edit = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $editCondition)
          $runCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'multiLineRunButtonContainer.commandBarRunButton')
          $run = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $runCondition)
          if ($edit -and $run) {
            $lua = @'
          print("[BBYA_JOB_BEGIN:visual-audit-wall]")
          local Players=game:GetService("Players")
          local root=workspace:FindFirstChild("BBYA_ZERO_BUILD")
          print("ROOT="..tostring(root~=nil))
          local system=root and root:FindFirstChild("DJWallMessageSystem")
          local final=system and system:FindFirstChild("FinalMountedWall")
          local wall=final and final:FindFirstChild("PrestigeLED")
          print("SYSTEM="..tostring(system~=nil).."|FINAL="..tostring(final~=nil).."|WALL="..tostring(wall~=nil))
          if wall then
            print("WALLPOS="..tostring(wall.Position).."|SIZE="..tostring(wall.Size))
            for _,c in ipairs(wall:GetChildren()) do
              print("WALLCHILD="..c.Name.."|"..c.ClassName)
            end
          end
          local ps=Players:GetPlayers()
          print("PLAYERS="..tostring(#ps))
          local p=ps[1]
          if p and p.Character then
            local hrp=p.Character:FindFirstChild("HumanoidRootPart")
            if hrp then
              hrp.CFrame=CFrame.lookAt(Vector3.new(3,4,18),Vector3.new(3,8,47))
              print("TELEPORTED=true")
            end
          end
          print("[BBYA_JOB_END:visual-audit-wall]")
          '@
            $valuePattern = $edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
            $valuePattern.SetValue($lua)
            Start-Sleep -Milliseconds 300
            $invoke = $run.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $invoke.Invoke()
          }
          Start-Sleep -Seconds 4

          # Capture the real Roblox Studio window.
          $rect = New-Object NativeWin+RECT
          [NativeWin]::GetWindowRect($hwnd, [ref]$rect) | Out-Null
          $w = [Math]::Max(640, $rect.Right-$rect.Left)
          $h = [Math]::Max(360, $rect.Bottom-$rect.Top)
          $bmp = New-Object System.Drawing.Bitmap($w,$h)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($rect.Left,$rect.Top,0,0,(New-Object System.Drawing.Size($w,$h)))
          $targetW = 900
          $targetH = [int]($h * $targetW / $w)
          $small = New-Object System.Drawing.Bitmap($targetW,$targetH)
          $g2 = [System.Drawing.Graphics]::FromImage($small)
          $g2.DrawImage($bmp,0,0,$targetW,$targetH)
          $jpg = Join-Path $env:GITHUB_WORKSPACE 'bbya-studio-visual.jpg'
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object {$_.MimeType -eq 'image/jpeg'} | Select-Object -First 1
          $enc = New-Object System.Drawing.Imaging.EncoderParameters(1)
          $enc.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality,[long]65)
          $small.Save($jpg,$codec,$enc)
          $g.Dispose(); $g2.Dispose(); $bmp.Dispose(); $small.Dispose()

          # Gather marked Studio log output too.
          $marked = @()
          $logs = Get-ChildItem 'C:\Users\Administrator\AppData\Local\Roblox\logs' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 5
          foreach($log in $logs){
            $capture=$false
            foreach($line in (Get-Content $log.FullName -ErrorAction SilentlyContinue)){
              if($line -match '\[BBYA_JOB_BEGIN:visual-audit-wall\]'){ $capture=$true }
              if($capture){ $marked += $line }
              if($capture -and $line -match '\[BBYA_JOB_END:visual-audit-wall\]'){ $capture=$false }
            }
            if($marked.Count -gt 0){ break }
          }

          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28"; "User-Agent"="BBYA-Studio-Visual-Audit" }
          function Put-RepoFile($path,$bytes,$message){
            $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path"
            $sha=$null
            try { $sha=(Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha } catch { if($_.Exception.Response.StatusCode.value__ -ne 404){ throw } }
            $body=@{message=$message;content=[Convert]::ToBase64String($bytes);branch='main'}
            if($sha){$body.sha=$sha}
            Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body|ConvertTo-Json) -ContentType 'application/json' | Out-Null
          }
          Put-RepoFile 'deploy-status/bbya-studio-visual.jpg' ([IO.File]::ReadAllBytes($jpg)) 'Record BBYA Studio visual audit [skip ci]'
          $status = @{
            capturedAt=(Get-Date -Format o)
            runId=$env:GITHUB_RUN_ID
            windowWidth=$w
            windowHeight=$h
            log=($marked -join "`n")
          } | ConvertTo-Json -Depth 4
          Put-RepoFile 'deploy-status/bbya-studio-visual.json' ([Text.Encoding]::UTF8.GetBytes($status)) 'Record BBYA Studio visual audit status [skip ci]'

          # Stop Play mode so the paid cloud Studio is left clean.
          [NativeWin]::SetForegroundWindow($hwnd) | Out-Null
          [System.Windows.Forms.SendKeys]::SendWait('+{F5}')
          Start-Sleep -Seconds 2
