name: After School City V1.3.4 Skate Asset Upload

on:
  push:
    branches:
      - after-school-city/v134-sports-assets
    paths:
      - '.github/workflows/after-school-city-v134-skate-asset-upload.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: after-school-city-v134-skate-asset-upload
  cancel-in-progress: false

jobs:
  upload-lock:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LIVE_SOURCE: '735e7c22e36a4829b3b8838985c44cfc2774ba56'
      LIVE_VERSION: '58'
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      PREP_RUN_ID: '34305810070'
      PREP_ARTIFACT_NAME: 'asc-v134-skateboard-mobile-glb'
      PREP_ARTIFACT_ID: '10086603748'
      PREP_ARTIFACT_DIGEST: 'bb1138a320877be01229ee0482fa1f50095fc56935af9bdbc13af276d49acc00'
      OPT_BYTES: '7208740'
      OPT_SHA256: '8fd29c509eee478d5a06d2282536ed6e955790b68339fea746c47c896ba410c2'
      SOURCE_SHA256: 'f99dd0996291b5cf824f3aeb0475d89ad8d8b703da0962e89f61ff277281a130'
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}

    steps:
      - name: Checkout V1.3.4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh verify LIVE v58 authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git cat-file -e "$env:LIVE_SOURCE^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'LIVE source unavailable' }
          $mergeBase=(git merge-base $env:LIVE_SOURCE HEAD).Trim()
          if($mergeBase -ne $env:LIVE_SOURCE){ throw "Branch is not descended from exact LIVE source: $mergeBase" }
          git fetch origin main
          $paths=@(git ls-tree -r --name-only origin/main -- deploy-status | Where-Object { $_ -like 'deploy-status/after-school-city-*.json' })
          $maxVersion=-1; $maxSource=''; $maxPath=''
          foreach($path in $paths){
            try {
              $j=((git show "origin/main:$path" | Out-String) | ConvertFrom-Json)
              if($j.project -eq 'AFTER SCHOOL CITY' -and $j.status -eq 'LIVE_PUBLISHED' -and [string]$j.placeId -eq $env:PLACE_ID){
                $v=[int]$j.versionNumber
                if($v -gt $maxVersion){ $maxVersion=$v; $maxSource=[string]$j.sourceCommit; $maxPath=$path }
              }
            } catch {}
          }
          if($maxVersion -ne [int]$env:LIVE_VERSION){ throw "LIVE changed: latest v$maxVersion path=$maxPath" }
          if($maxSource -ne $env:LIVE_SOURCE){ throw "LIVE source changed: $maxSource" }
          Write-Host "LIVE AUTHORITY PASS v$maxVersion source=$maxSource"

      - name: Verify exact prep artifact metadata
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          $a=Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:PREP_ARTIFACT_ID" -Headers $headers
          if([string]$a.name -ne $env:PREP_ARTIFACT_NAME){ throw "Prep artifact name mismatch: $($a.name)" }
          if([bool]$a.expired){ throw 'Prep artifact is expired' }
          $digest=([string]$a.digest) -replace '^sha256:',''
          if($digest -ne $env:PREP_ARTIFACT_DIGEST){ throw "Prep artifact digest mismatch: $digest" }
          if([int64]$a.workflow_run.id -ne [int64]$env:PREP_RUN_ID){ throw "Prep run mismatch: $($a.workflow_run.id)" }
          Write-Host "PREP ARTIFACT META PASS id=$env:PREP_ARTIFACT_ID digest=$digest"

      - name: Download exact prepared GLB without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREP_ARTIFACT_NAME }}
          path: asset-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREP_RUN_ID }}

      - name: Verify exact GLB and prep receipt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem 'asset-input' -Filter '*.glb' -File -Recurse)
          if($files.Count -ne 1){ throw "Expected exactly one GLB; got $($files.Count)" }
          $glb=$files[0]
          $bytes=$glb.Length
          $hash=(Get-FileHash $glb.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($bytes -ne [int64]$env:OPT_BYTES){ throw "Prepared GLB bytes mismatch: $bytes" }
          if($hash -ne $env:OPT_SHA256){ throw "Prepared GLB SHA mismatch: $hash" }
          $receipt=Get-ChildItem 'asset-input' -Filter 'asset-prep-receipt.txt' -File -Recurse | Select-Object -First 1
          if(-not $receipt){ throw 'Prep receipt missing' }
          $text=Get-Content $receipt.FullName -Raw
          foreach($token in @(
            'STATUS=ASSET_PREP_PASSED',
            'PROJECT=AFTER_SCHOOL_CITY',
            'SCOPE=V134_SKATEBOARD_PROPS',
            "SOURCE_SHA256=$env:SOURCE_SHA256",
            "OPT_BYTES=$env:OPT_BYTES",
            "OPT_SHA256=$env:OPT_SHA256",
            'TEXTURE_MAX_DIM=1024',
            'LICENSE=CC-BY-4.0',
            'AUTHOR=Arsen_Ismailov',
            'BASKETBALL=LICENSE_HOLD',
            'PLACE_PUBLISH=NOT_PERFORMED'
          )){
            if($text -notmatch [regex]::Escape($token)){ throw "Prep receipt token missing: $token" }
          }
          "ASC_SKATE_GLB=$($glb.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXACT PREP GLB PASS bytes=$bytes sha256=$hash NO_REBUILD"

      - name: Resolve AFTER SCHOOL CITY Roblox creator
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $meta=Invoke-RestMethod -Method Get -Uri "https://games.roblox.com/v1/games?universeIds=$env:UNIVERSE_ID"
          if(-not $meta.data -or $meta.data.Count -lt 1){ throw 'Unable to resolve AFTER SCHOOL CITY creator' }
          $creator=$meta.data[0].creator
          $type=[string]$creator.type
          $id=[string]$creator.id
          if($id -notmatch '^\d+$'){ throw "Invalid creator id: $id" }
          if($type -ieq 'Group'){
            "ASC_CREATOR_FIELD=groupId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif($type -ieq 'User'){
            "ASC_CREATOR_FIELD=userId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            throw "Unsupported creator type: $type"
          }
          "ASC_CREATOR_ID=$id" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ASC CREATOR RESOLVED type=$type id=$id"

      - name: Upload prepared skateboard pack as Roblox Model asset
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){ throw 'ROBLOX_OPEN_CLOUD_MASTER_V2 unavailable' }
          $creator=@{}
          $creator[$env:ASC_CREATOR_FIELD]=$env:ASC_CREATOR_ID
          $request=@{
            assetType='Model'
            displayName='ASC Skateboarding Props Pack - Mobile'
            description='AFTER SCHOOL CITY skatepark props. Source: Skateboarding Props Pack by Arsen Ismailov, licensed CC BY 4.0. Textures optimized to 1024px for mobile.'
            creationContext=@{ creator=$creator }
          } | ConvertTo-Json -Depth 8 -Compress
          $requestFile=Join-Path $env:RUNNER_TEMP 'asc-v134-skate-request.json'
          [System.IO.File]::WriteAllText($requestFile,$request,(New-Object System.Text.UTF8Encoding($false)))
          try {
            $args=@(
              '--silent','--show-error','--location','--request','POST',
              '--header',"x-api-key: $env:ROBLOX_API_KEY",
              '--form',"request=<$requestFile;type=application/json",
              '--form',"fileContent=@$env:ASC_SKATE_GLB;type=model/gltf-binary",
              'https://apis.roblox.com/assets/v1/assets'
            )
            $raw=& curl.exe @args
          } finally {
            Remove-Item $requestFile -Force -ErrorAction SilentlyContinue
          }
          if($LASTEXITCODE -ne 0){ throw 'Roblox asset upload curl failed' }
          try { $created=$raw | ConvertFrom-Json } catch { throw "Invalid Roblox asset response: $raw" }
          if(-not $created.path){ throw "Roblox asset upload rejected: $raw" }
          $operationId=([string]$created.path) -replace '^operations/',''
          Write-Host "ASSET UPLOAD ACCEPTED operation=$operationId"

          $assetId=''; $moderation='UNKNOWN'
          for($i=0;$i -lt 90;$i++){
            Start-Sleep -Seconds 4
            $opRaw=& curl.exe --silent --show-error --location --header "x-api-key: $env:ROBLOX_API_KEY" "https://apis.roblox.com/assets/v1/operations/$operationId"
            if($LASTEXITCODE -ne 0){ continue }
            try { $op=$opRaw | ConvertFrom-Json } catch { continue }
            if($op.done){
              if($op.error){ throw "Roblox asset operation failed: $($op.error | ConvertTo-Json -Compress -Depth 8)" }
              $assetId=[string]$op.response.assetId
              if($assetId -notmatch '^\d+$'){ throw "Asset operation completed without assetId: $opRaw" }
              $moderation=[string]$op.response.moderationResult.moderationState
              break
            }
          }
          if($assetId -notmatch '^\d+$'){ throw 'Timed out waiting for Roblox skateboard asset operation' }
          "SKATEBOARD_ASSET_ID=$assetId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SKATEBOARD_MODERATION=$moderation" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ASSET UPLOAD DONE asset=$assetId moderation=$moderation"

      - name: Lock asset ID into isolated V1.3.4 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'After School City Asset Ingest'
          git config user.email 'actions@users.noreply.github.com'
          $path='maps/after-school-city/after-school-city.sports-assets-v134.server.lua'
          $text=Get-Content $path -Raw
          $marker='local SKATEBOARD_PACK_ASSET_ID = 0 -- ASC_WORKFLOW_SKATEBOARD_ASSET_ID'
          if($text -notmatch [regex]::Escape($marker)){ throw 'Expected zero skateboard asset marker missing; refusing duplicate lock' }
          $text=$text.Replace($marker,"local SKATEBOARD_PACK_ASSET_ID = $env:SKATEBOARD_ASSET_ID -- ASC_WORKFLOW_SKATEBOARD_ASSET_ID")
          Set-Content -Path $path -Value $text -Encoding utf8

          New-Item -ItemType Directory -Path 'asset-status' -Force | Out-Null
          $receipt=[ordered]@{
            status='ASSET_INGESTED_QC_PENDING'
            project='AFTER SCHOOL CITY'
            mode='V134_SPORTS_ASSETS'
            liveSource=$env:LIVE_SOURCE
            liveRobloxVersion=[int]$env:LIVE_VERSION
            prepRunId=[int64]$env:PREP_RUN_ID
            prepArtifactId=[int64]$env:PREP_ARTIFACT_ID
            prepArtifactDigest=$env:PREP_ARTIFACT_DIGEST
            optimizedBytes=[int64]$env:OPT_BYTES
            optimizedSha256=$env:OPT_SHA256
            robloxAssetId=[int64]$env:SKATEBOARD_ASSET_ID
            moderationState=$env:SKATEBOARD_MODERATION
            license='CC-BY-4.0'
            author='Arsen Ismailov'
            basketballStatus='LICENSE_HOLD'
            placePublished=$false
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content 'asset-status/after-school-city-v134-skateboard.json' -Encoding utf8
          git add $path 'asset-status/after-school-city-v134-skateboard.json'
          git diff --cached --check
          git commit -m 'ASC: lock V1.3.4 skateboard model asset ID [skip ci]'
          if($LASTEXITCODE -ne 0){ throw 'Asset lock commit failed' }
          git push origin HEAD:after-school-city/v134-sports-assets
          if($LASTEXITCODE -ne 0){ throw 'Asset lock push failed; Roblox asset exists but Place remains unchanged' }
          $source=(git rev-parse HEAD).Trim()
          Write-Host "ASSET ID LOCK PASS source=$source asset=$env:SKATEBOARD_ASSET_ID placePublish=NO"
