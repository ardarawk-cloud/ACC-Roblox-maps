name: HANGAR v2 LIVE OWNER

on:
  push:
    branches: [aeroclub-hangar-rebuild-v1-lab]
    paths:
      - '.github/workflows/hangar-v2-live-owner.yml'
      - 'scripts/hangar-v2-live-owner.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hangar-v2-live-owner
  cancel-in-progress: true

jobs:
  publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy HANGAR v2 realism as live creator
        shell: powershell
        env:
          ROBLOX_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: ./scripts/hangar-v2-live-owner.ps1
      - name: Save verified HANGAR v2 receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $obj=[ordered]@{
            status='LIVE_PUBLISHED';ok=$true;project='HANGAR';phase='PHASE_2_ENVIRONMENT_REALISM_REBUILD';
            universeId='10745364913';placeId='76001567401911';sourceCommit=$env:GITHUB_SHA;mode='HANGAR_V2_REALISM_LIVE_OWNER';
            staticModelAssetId=[int64]$env:HANGAR_MODEL_ASSET_ID;modelModeration=$env:HANGAR_MODEL_MODERATION;robloxVersion=[int]$env:HANGAR_LIVE_VERSION;
            glbBytes=[int64]$env:HANGAR_GLB_BYTES;glbSha256=$env:HANGAR_GLB_SHA256;placeBytes=[int64]$env:HANGAR_PLACE_BYTES;placeSha256=$env:HANGAR_PLACE_SHA256;
            spawn='ACTUAL_FRONT_PLUS_Z_FACE_CENTRAL_JET';wita='REALTIME_UTC_PLUS_8';lasers='DISABLED';visibleFallback='NONE';environmentDetail='V2_DETAILED_JET_VEHICLES_APRON_HANGAR_ZONES';serversRestarted=$true;visualQC='PENDING_OWNER_SCREENSHOT'
          }
          $text=$obj|ConvertTo-Json -Depth 8
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"))
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='HANGAR-V2'}
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/hangar-live.json";$sha=$null
          try{$old=Invoke-RestMethod -Headers $h -Uri ($url+'?ref='+$env:GITHUB_REF_NAME);$sha=[string]$old.sha}catch{}
          $body=@{message='Record HANGAR v2 realism LIVE [skip ci]';content=$b64;branch=$env:GITHUB_REF_NAME};if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $url -Body ($body|ConvertTo-Json -Depth 5)|Out-Null
