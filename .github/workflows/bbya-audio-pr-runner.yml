name: BBYA Audio Observable Runner — SAFETY HOLD

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: bbya-audio-observable-runner
  cancel-in-progress: true

jobs:
  safety_hold:
    if: startsWith(github.event.pull_request.title, 'RUN BBYA AUDIO')
    runs-on: ubuntu-latest
    steps:
      - name: Audio uploads disabled
        run: |
          echo 'SAFETY HOLD: Roblox audio uploads are disabled after account moderation action.'
          echo 'No Drive download, Create Asset request, routing publish, or retry is performed.'
