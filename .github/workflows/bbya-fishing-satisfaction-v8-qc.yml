# BBYA fishing-only canonical QC
name: BBYA Fishing Satisfaction v8 QC

on:
  push:
    branches: [bbya-fishing-satisfaction-v8-20260924-r3]
    paths:
      - 'maps/bbya-social-hub/158-fishing-satisfaction-v8.server.lua'
      - 'maps/bbya-social-hub/158-fishing-satisfaction-v8.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-fishing-satisfaction-v8-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/158-fishing-satisfaction-v8.server.lua'
      - 'maps/bbya-social-hub/158-fishing-satisfaction-v8.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-fishing-satisfaction-v8-qc.yml'

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - name: Checkout fishing satisfaction v8 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Static fishing-only checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Require([string]$text,[string]$pattern,[string]$message){if($text -notmatch $pattern){throw $message}}
          function Forbid([string]$text,[string]$pattern,[string]$message){if($text -match $pattern){throw $message}}

          $serverPath='maps/bbya-social-hub/158-fishing-satisfaction-v8.server.lua'
          $clientPath='maps/bbya-social-hub/158-fishing-satisfaction-v8.client.lua'
          $corePath='maps/bbya-social-hub/124-fishing-core.server.lua'
          $projectPath='maps/bbya-social-hub/default.project.json'
          foreach($p in @($serverPath,$clientPath,$corePath,$projectPath)){if(-not (Test-Path $p)){throw "Missing $p"}}

          $server=Get-Content $serverPath -Raw
          $client=Get-Content $clientPath -Raw
          $core=Get-Content $corePath -Raw
          $project=Get-Content $projectPath -Raw
          $null=$project | ConvertFrom-Json

          Require $server 'FishAnatomyPolishV8' 'V8 fish anatomy marker missing'
          Require $server 'RodConstructionV8' 'V8 rod construction marker missing'
          Require $server 'ChanceMathUntouchedV8' 'V8 chance hard-lock marker missing'
          Require $server 'EconomyUntouchedV8' 'V8 economy hard-lock marker missing'
          Require $server 'CatchTrophyPlateV8' 'V8 catch trophy plate missing'
          Require $client 'kind=="CatchEnhanced"' 'V8 client is not driven by existing progression event'
          Require $client 'CompactMobileRevealV8' 'V8 compact mobile reveal marker missing'
          Require $project '158-fishing-satisfaction-v8\.server\.lua' 'V8 server is not mounted'
          Require $project '158-fishing-satisfaction-v8\.client\.lua' 'V8 client is not mounted'

          Forbid $server 'math\.random' 'V8 must not own fishing RNG'
          Forbid $server 'DataStoreService' 'V8 must not own fishing persistence/economy'
          Forbid $server 'MarketplaceService' 'V8 must not own monetization'
          Forbid $server 'GetService\(["'']Lighting["'']\)' 'V8 must not own global Lighting'
          Forbid ($server+$client) 'Instance\.new\(["''](ImageLabel|ImageButton|Decal|Texture)["'']\)' 'V8 must remain 3D/UI-native with no image assets'

          # Existing core chance/economy values are protected and must remain exactly present.
          foreach($chance in @('chance=32','chance=29','chance=14','chance=12','chance=5.4','chance=4.4','chance=1.8','chance=1.45','chance=.48','chance=.34','chance=.075','chance=.035')){
            Require $core ([regex]::Escape($chance)) "Protected fishing probability missing/changed: $chance"
          }
          Require $core 'local VALUE_MULT=\{COMMON=1,UNCOMMON=1\.1,RARE=1\.25,EPIC=1\.45,LEGENDARY=1\.7,MYTHIC=2\.1\}' 'Protected fishing economy multipliers changed'
          Require $core 'GetDataStore\("BBYA_FISHING_V1"\)' 'Fishing datastore ownership changed'

          Write-Host 'Fishing Satisfaction v8 static QC PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojoExe=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-rojo-7.7.0-fishing-satisfaction-v8'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-rojo-7.7.0-fishing-satisfaction-v8.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojoExe=$exe.FullName
          }
          & $rojoExe --version
          if($LASTEXITCODE -ne 0){throw "Rojo version check failed: $LASTEXITCODE"}
          "ROJO_EXE=$rojoExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Full canonical BBYA build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-fishing-satisfaction-v8-qc.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
          if(-not (Test-Path $place)){throw 'Built place missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw "Built place unexpectedly small: $bytes bytes"}
          Write-Host "BBYA FISHING SATISFACTION V8 QC PASS - canonical build: $bytes bytes"
