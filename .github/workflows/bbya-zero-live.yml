name: BBYA Zero Live Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/**'
      - 'maps/registry.json'
      - '.github/workflows/bbya-zero-live.yml'
      - 'scripts/publish-map.js'

concurrency:
  group: bbya-zero-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Rojo binary
        id: rojo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}

      - name: Install canonical Roblox serializer
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked

      - name: Verify Rojo
        run: rojo --version

      - name: Build canonical BBYA preview place
        shell: bash
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-zero-live.rbxl
          test -s /tmp/bbya-zero-live.rbxl
          ls -lh /tmp/bbya-zero-live.rbxl

      - name: Publish BBYA preview live
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PUBLISH_RECEIPT_DIR: deploy-status
          PLACE_FILE_OVERRIDE: /tmp/bbya-zero-live.rbxl
        run: node scripts/publish-map.js a-club

      - name: Persist deploy receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy-status/a-club.json
          cp deploy-status/a-club.json /tmp/a-club-zero.json
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          mkdir -p deploy-status
          cp /tmp/a-club-zero.json deploy-status/a-club.json
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/a-club.json
          if ! git diff --cached --quiet; then
            git commit -m "Record BBYA zero preview deploy [skip ci]"
            git push origin HEAD:main
          fi

      - name: Sync BBYA Developer Products
        id: products
        continue-on-error: true
        uses: dig1t/rblxsync@0f9565d5397cd52ecb42fd96678c39969ca0a0cd
        with:
          api_key: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          command: run
          config: maps/bbya-social-hub/monetization/rblxsync.yml

      - name: Record Developer Products API status
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          SYNC_OUTCOME: ${{ steps.products.outcome }}
          UNIVERSE_ID: '8116636513'
        shell: bash
        run: |
          set +e
          mkdir -p deploy-status
          http=$(curl -sS -o /tmp/products.json -w '%{http_code}' \
            -H "x-api-key: $ROBLOX_API_KEY" \
            "https://apis.roblox.com/developer-products/v2/universes/$UNIVERSE_ID/developer-products/creator?pageSize=50")
          HTTP_CODE="$http" python3 - <<'PY'
          import json, os
          try:
              body=json.load(open('/tmp/products.json'))
          except Exception:
              body={"raw":open('/tmp/products.json').read()[:1200]}
          out={
            "sync_outcome": os.environ.get("SYNC_OUTCOME",""),
            "http": os.environ.get("HTTP_CODE",""),
            "api_ok": os.environ.get("HTTP_CODE","").startswith("2"),
            "body": body,
          }
          open('deploy-status/bbya-products-sync.json','w').write(json.dumps(out,indent=2))
          PY

      - name: Persist Developer Product IDs and status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add maps/bbya-social-hub/monetization/rblxsync.yml \
                  maps/bbya-social-hub/monetization/rblxsync-lock.yml \
                  maps/bbya-social-hub/monetization/products.luau \
                  deploy-status/bbya-products-sync.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update BBYA developer product IDs and status [skip ci]"
            git push origin HEAD:main
          fi
