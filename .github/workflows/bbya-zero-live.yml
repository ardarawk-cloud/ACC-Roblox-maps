name: BBYA Zero Live Publish

# Scope refresh trigger: 2026-08-21
# Audio publish retrigger: 2026-08-21T13:24+08:00
# AM STUDIO API ownership-transfer probe: 2026-08-22T23:38+08:00
# Resource-saver mode: 2026-08-23 — AM_STUDIO publish + conditional monetization sync
# Audio routing repair: 2026-08-23 — batch Progressive permission grant before publish
on:
  workflow_dispatch:
    inputs:
      sync_monetization:
        description: 'Also sync BBYA Game Passes and Developer Products'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/**'
      - 'maps/registry.json'
      - '.github/workflows/bbya-zero-live.yml'
      - '.github/scripts/bbya-progressive-permissions.py'
      - 'scripts/publish-map.js'
      - 'scripts/sync-bbya-products.py'
      - 'scripts/sync-bbya-gamepasses.py'

concurrency:
  group: bbya-zero-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether monetization sync is required
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MANUAL_SYNC: ${{ inputs.sync_monetization }}
        shell: bash
        run: |
          set -euo pipefail
          sync=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${MANUAL_SYNC:-false}" = "true" ]; then
            sync=true
          elif [ "$EVENT_NAME" = "push" ]; then
            before="${BEFORE_SHA:-}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              before="${CURRENT_SHA}^"
            fi

            changed="$(git diff --name-only "$before" "$CURRENT_SHA" || true)"
            printf '%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -Eq '^maps/bbya-social-hub/monetization/|^scripts/sync-bbya-(gamepasses|products)\.py$'; then
              sync=true
            fi
          fi

          echo "monetization=$sync" >> "$GITHUB_OUTPUT"
          echo "BBYA resource-saver: monetization_sync=$sync"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Rojo binary
        id: rojo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}

      - name: Install canonical Roblox serializer
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked

      - name: Verify Rojo
        run: rojo --version

      - name: Sync permanent BBYA Travel Game Passes
        if: steps.changes.outputs.monetization == 'true'
        id: gamepass_sync
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
          UNIVERSE_ID: '8116636513'
        shell: bash
        run: python3 scripts/sync-bbya-gamepasses.py

      - name: Persist Travel Game Pass IDs and diagnostics before build
        if: steps.changes.outputs.monetization == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f deploy-status/bbya-gamepasses-sync.json ]; then
            git add deploy-status/bbya-gamepasses-sync.json
          fi
          git add maps/bbya-social-hub/monetization/passes.luau
          if ! git diff --cached --quiet; then
            git commit -m "Update BBYA permanent travel pass IDs and diagnostics [skip ci]"
            git push origin HEAD:main
          fi

      - name: Report Game Pass scope warning
        if: steps.changes.outputs.monetization == 'true' && steps.gamepass_sync.outcome == 'failure'
        shell: bash
        run: |
          echo '::warning::BBYA Game Pass sync is incomplete. Map publish will continue. Check deploy-status/bbya-gamepasses-sync.json; AM_STUDIO may need game-pass write scope for universe 8116636513.'

      - name: Grant existing Progressive audio to BBYA Universe
        id: progressive_permission
        continue-on-error: true
        env:
          AUDIO_KEY: ${{ secrets.ROBLOX_AUDIO_API_KEY }}
          AM_STUDIO_KEY: ${{ secrets.AM_STUDIO }}
          UNIVERSE_ID: '8116636513'
        shell: bash
        run: python3 .github/scripts/bbya-progressive-permissions.py

      - name: Report Progressive permission warning
        if: steps.progressive_permission.outcome == 'failure'
        shell: bash
        run: |
          echo '::warning::Progressive audio permission repair is incomplete. Publish will continue and the receipt will preserve diagnostics.'

      - name: Build canonical BBYA preview place
        shell: bash
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-zero-live.rbxl
          test -s /tmp/bbya-zero-live.rbxl
          ls -lh /tmp/bbya-zero-live.rbxl

      - name: Publish BBYA preview live with AM STUDIO
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
          PUBLISH_RECEIPT_DIR: deploy-status
          PLACE_FILE_OVERRIDE: /tmp/bbya-zero-live.rbxl
        run: node scripts/publish-map.js a-club

      - name: Persist deploy receipt and Progressive diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy-status/a-club.json
          cp deploy-status/a-club.json /tmp/a-club-zero.json
          if [ -f deploy-status/bbya-progressive-permissions.json ]; then
            cp deploy-status/bbya-progressive-permissions.json /tmp/bbya-progressive-permissions.json
          fi
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          mkdir -p deploy-status
          cp /tmp/a-club-zero.json deploy-status/a-club.json
          if [ -f /tmp/bbya-progressive-permissions.json ]; then
            cp /tmp/bbya-progressive-permissions.json deploy-status/bbya-progressive-permissions.json
          fi
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/a-club.json
          if [ -f deploy-status/bbya-progressive-permissions.json ]; then
            git add deploy-status/bbya-progressive-permissions.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record BBYA AM STUDIO live deploy and audio diagnostics [skip ci]"
            git push origin HEAD:main
          fi

      - name: Sync BBYA repeatable Developer Products
        if: steps.changes.outputs.monetization == 'true'
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
          UNIVERSE_ID: '8116636513'
        shell: bash
        run: python3 scripts/sync-bbya-products.py

      - name: Persist Developer Product IDs and status
        if: steps.changes.outputs.monetization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maps/bbya-social-hub/monetization/products.luau deploy-status/bbya-products-sync.json
          if ! git diff --cached --quiet; then
            git commit -m "Update BBYA developer product IDs and status [skip ci]"
            git push origin HEAD:main
          fi
