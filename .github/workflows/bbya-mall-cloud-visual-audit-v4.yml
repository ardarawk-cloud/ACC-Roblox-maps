name: BBYA Mall Branch Runtime QC Temp

on:
  push:
    branches: ['fix/mall-visual-cleanup-v7']
    paths:
      - '.github/workflows/bbya-mall-cloud-visual-audit-v4.yml'
      - 'maps/bbya-social-hub/95-mall-live-upgrade.server.lua'
      - 'maps/bbya-social-hub/95-mall-live.client.lua'
      - 'maps/bbya-social-hub/116-looklab-avatar-editor.client.lua'
      - 'maps/bbya-social-hub/133-mall-robux-commerce.client.lua'

permissions:
  contents: read

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - name: Checkout branch authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-mall-v7-rojo'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-mall-v7-rojo.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          $ver=& $rojo --version
          Write-Host $ver
          if($ver -notmatch '7\.7\.0'){throw "Unexpected Rojo version: $ver"}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Static Mall v7 guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $server=Get-Content 'maps/bbya-social-hub/95-mall-live-upgrade.server.lua' -Raw
          foreach($needle in @('SCREENSHOT_DRIVEN_V7','DigitalBillboardsRemoved','MallPassportZones','GlobalLightingUntouched')){if($server -notmatch [regex]::Escape($needle)){throw "Missing Mall v7 marker: $needle"}}
          if($server -match 'Lighting\.(Brightness|Ambient|OutdoorAmbient|ClockTime|ExposureCompensation)'){throw 'Mall v7 touches global Lighting'}
          if($server -match 'DigitalSignageNetwork.*Instance\.new'){throw 'Mall v7 recreates giant digital signage'}
          $look=Get-Content 'maps/bbya-social-hub/116-looklab-avatar-editor.client.lua' -Raw
          $shop=Get-Content 'maps/bbya-social-hub/133-mall-robux-commerce.client.lua' -Raw
          foreach($text in @($look,$shop)){
            if($text -notmatch 'PromptAllowInventoryReadAccess'){throw 'Missing AvatarEditor access gate'}
            if($text -notmatch 'params\.Limit=10'){throw 'Catalog search does not use valid compact page size'}
            if($text -notmatch 'SearchCatalogAsync'){throw 'Missing async catalog search'}
          }
          Write-Host 'BBYA_MALL_V7_STATIC_GUARDS_PASS'

      - name: Build canonical BBYA place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-mall-v7-qc.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not (Test-Path $place)){throw 'Built place missing'}
          if((Get-Item $place).Length -lt 1024){throw 'Built place unexpectedly small'}
          Write-Host "BBYA_MALL_V7_CANONICAL_BUILD_PASS bytes=$((Get-Item $place).Length) sha=$env:GITHUB_SHA"
