name: BBYA Mall Branch Runtime QC Temp

on:
  push:
    branches:
      - fix/mall-runtime-compat-20260826
    paths:
      - '.github/workflows/bbya-mall-cloud-visual-audit-v4.yml'
      - 'maps/bbya-social-hub/94-mall.server.lua'
      - 'maps/bbya-social-hub/95-mall-live-upgrade.server.lua'

permissions:
  contents: read

jobs:
  mall-runtime-qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install canonical Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'bbya-rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $zip=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0-windows-x86_64.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $toolDir -Force
          }
          $ver=& $rojo --version
          Write-Host $ver
          if($ver -notmatch '7\.7\.0'){throw "Unexpected Rojo version: $ver"}
          "ROJO=$rojo" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Mall source compatibility guard
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='maps/bbya-social-hub/94-mall.server.lua'
          $live='maps/bbya-social-hub/95-mall-live-upgrade.server.lua'
          if(Select-String -Path $base -SimpleMatch 'Enum.Material.Tile' -Quiet){throw 'Deprecated Enum.Material.Tile still present in Mall base'}
          if(Select-String -Path $live -SimpleMatch 'local boards={}' -Quiet){throw 'Broken empty boards declaration still present'}
          if(-not (Select-String -Path $live -SimpleMatch 'local boards={' -Quiet)){throw 'Mall boards table declaration missing'}
          Write-Host 'Mall source compatibility guard PASS'

      - name: Full canonical BBYA Rojo build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project='maps/bbya-social-hub/default.project.json'
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mall-runtime-qc.rbxl'
          & $env:ROJO build $project -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Canonical BBYA Rojo build failed'}
          $size=(Get-Item $out).Length
          if($size -lt 100000){throw "Unexpectedly small build artifact: $size bytes"}
          Write-Host "Canonical build PASS: $out ($size bytes)"
