name: BBYA Validated Regression MASTER V2
# Registered trigger pass v2.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-regression-production-masterv2.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - name: Fetch exact source without Git
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP ("bbya-masterv2-"+$env:GITHUB_SHA+".zip")
          $extract=Join-Path $env:RUNNER_TEMP ("bbya-masterv2-"+$env:GITHUB_SHA)
          if(Test-Path $zip){Remove-Item $zip -Force}
          if(Test-Path $extract){Remove-Item $extract -Recurse -Force}
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri ("https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/"+$env:GITHUB_SHA) -OutFile $zip
          if(-not (Test-Path $zip) -or (Get-Item $zip).Length -lt 1024){throw 'Source archive missing'}
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $root=Get-ChildItem $extract -Directory | Select-Object -First 1
          if(-not $root){throw 'Extracted source root missing'}
          Get-ChildItem $env:GITHUB_WORKSPACE -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $root.FullName -Force | ForEach-Object { Copy-Item $_.FullName -Destination $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "BBYA_EXACT_SOURCE_PASS source=$env:GITHUB_SHA"

      - name: Verify validated runtime locks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $reg=Get-Content 'maps/registry.json' -Raw | ConvertFrom-Json
          $t=$reg.maps.'a-club'
          if([string]$t.universeId -ne '8116636513' -or [string]$t.placeId -ne '131894120482837'){throw 'Production target mismatch'}
          $legacy=Get-Content 'maps/bbya-social-hub/81-basement-audio-ui.client.lua' -Raw
          $router=Get-Content 'maps/bbya-social-hub/104-venue-audio-router.client.lua' -Raw
          $ug=Get-Content 'maps/bbya-social-hub/74-basement-premium-upgrade.server.lua' -Raw
          $dark=Get-Content 'maps/bbya-social-hub/87-basement-full-upgrade.server.lua' -Raw
          $cars=Get-Content 'maps/bbya-social-hub/77-entrance-car-cleanup.server.lua' -Raw
          $lighting=Get-Content 'maps/bbya-social-hub/28-lighting-ambience.server.lua' -Raw
          if($legacy -match '(?m)\.Volume\s*='){throw '81 volume ownership regression'}
          if($legacy -notmatch 'BBYALegacyVolumeWriterDisabled'){throw '81 disable marker missing'}
          if($router -notmatch 'ROUTER_V9_EQ_ONLY' -or $router -notmatch 'BBYAFunkotHardGateV9'){throw 'Router v9 lock missing'}
          if($ug -notmatch 'DARK_SAFE_V3'){throw 'Underground dark-safe marker missing'}
          if($ug -match 'GetService\("Lighting"\)'){throw 'Underground owns global Lighting'}
          if($dark -notmatch 'DARK_UNDERGROUND_V6_SLIGHT_LIFT'){throw 'Underground final dark lock missing'}
          if($cars -notmatch 'fallback red/blue entrance cars remain' -or $cars -notmatch 'FallbackCarsRetained'){throw 'Entrance car failsafe missing'}
          if($lighting -notmatch 'GLOBAL_LIGHTING_AUTHORITY_V4'){throw 'Global Lighting authority missing'}
          Write-Host 'BBYA_VALIDATED_RUNTIME_LOCKS_PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'bbya-masterv2-rojo'
          $zip=Join-Path $env:RUNNER_TEMP 'bbya-masterv2-rojo.zip'
          if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
          if(Test-Path $zip){Remove-Item $zip -Force}
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
          if(-not $exe){throw 'rojo.exe missing'}
          & $exe.FullName --version
          "ROJO_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build canonical BBYA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:GITHUB_WORKSPACE 'BBYA-VALIDATED-PROD.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw 'RBXL too small'}
          $hash=(Get-FileHash -Algorithm SHA256 $place).Hash.ToLower()
          "$hash  BBYA-VALIDATED-PROD.rbxl" | Set-Content 'BBYA-VALIDATED-PROD.sha256' -Encoding ascii
          "PLACE_FILE_OVERRIDE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_BUILD_PASS bytes=$bytes sha256=$hash"

      - name: Publish with ROBLOX_OPEN_CLOUD_MASTER_V2
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PUBLISH_RECEIPT_DIR: deploy-status-masterv2
        run: |
          $ErrorActionPreference='Stop'
          node scripts/publish-map.js a-club
          if($LASTEXITCODE -ne 0){throw 'MASTER_V2 publish failed'}
          $receipt='deploy-status-masterv2/a-club.json'
          $r=Get-Content $receipt -Raw | ConvertFrom-Json
          if($r.status -ne 'PUBLISHED'){throw 'Receipt not PUBLISHED'}
          if($r.sourceCommit -ne $env:GITHUB_SHA){throw 'Receipt source mismatch'}
          if([string]$r.universeId -ne '8116636513' -or [string]$r.placeId -ne '131894120482837'){throw 'Receipt target mismatch'}
          Get-Content $receipt
          Write-Host "BBYA_MASTER_V2_PASS version=$($r.response.versionNumber) source=$($r.sourceCommit)"

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-VALIDATED-PROD-MASTER-V2
          path: |
            BBYA-VALIDATED-PROD.rbxl
            BBYA-VALIDATED-PROD.sha256
            deploy-status-masterv2/a-club.json
          retention-days: 14
