name: BBYA Publish Audio Stability v6 Current Main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-publish-audio-stability-v6-live.yml'
  workflow_dispatch:

concurrency:
  group: bbya-publish-audio-stability-v6-current-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-current:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 25
    steps:
      - name: Checkout current main authority
        uses: actions/checkout@v4

      - name: Verify opening audio stability hard gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content 'maps/bbya-social-hub/109-music-catalog-reset.server.lua' -Raw
          foreach($needle in @(
            'OPENING STABILITY AUTHORITY v5',
            'ACTIVE_VENUES_OPENING_STABILITY_V5',
            'BBYAMainPlaylistEnabled",true',
            'BBYAUndergroundPlaylistEnabled",true',
            'BBYAFunkotPlaylistEnabled",true',
            'BBYASkateparkPlaylistEnabled",true',
            'BBYARooftopPlaylistEnabled",true',
            'BBYAMusicCatalogReset",false'
          )){if($src -notmatch [regex]::Escape($needle)){throw "Missing audio stability marker: $needle"}}
          foreach($forbidden in @(
            'BBYAMusicCatalogReset",true',
            'SoundService\.DescendantAdded',
            'scrubSound',
            's\.SoundId\s*=\s*""',
            'RESET_WITH_UNDERGROUND',
            'SetAttribute\("MusicCatalogState","RESET_EMPTY"\)',
            'disableOldAudioEngines'
          )){if($src -match $forbidden){throw "Destructive audio reset detected: $forbidden"}}

          $ui=Get-Content 'maps/bbya-social-hub/109-music-catalog-reset-ui.client.lua' -Raw
          foreach($needle in @('ACTIVE CATALOG UI RECOVERY v5','BBYASkateparkPlaylistCatalog','BBYARooftopPlaylistCatalog','RETIRED_BY_ACTIVE_V5')){
            if($ui -notmatch [regex]::Escape($needle)){throw "Missing active UI recovery marker: $needle"}
          }

          $funkot=Get-Content 'maps/bbya-social-hub/92-funkot-zone.client.lua' -Raw
          foreach($needle in @('FUNKOT DISKOTIK PREMIUM VISUAL ENHANCEMENT v3','FunkotVisualPremiumV3','SoundIdsUntouched','UndergroundUntouched')){
            if($funkot -notmatch [regex]::Escape($needle)){throw "Missing Funkot v3 marker: $needle"}
          }
          Write-Host "BBYA_AUDIO_STABILITY_V6_HARD_GATE_PASS source=$env:GITHUB_SHA"

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-audio-stability-v6-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-audio-stability-v6-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build current BBYA main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-audio-stability-v6-current-main-live.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo current-main build failed'}
          if(-not (Test-Path $place)){throw 'Current-main RBXL missing'}
          if((Get-Item $place).Length -lt 1024){throw 'Current-main RBXL unexpectedly small'}
          "BBYA_PLACE_FILE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_AUDIO_STABILITY_V6_BUILD_PASS bytes=$((Get-Item $place).Length) source=$env:GITHUB_SHA"

      - name: Publish current BBYA main
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'AM_STUDIO publish secret unavailable'}
          $env:PLACE_FILE_OVERRIDE=$env:BBYA_PLACE_FILE
          $env:PUBLISH_RECEIPT_DIR='deploy-status-audio-stability-v6-live'
          node scripts/publish-map.js a-club
          if($LASTEXITCODE -ne 0){throw 'Current-main Roblox publish failed'}

      - name: Verify PUBLISHED receipt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $receiptPath='deploy-status-audio-stability-v6-live/a-club.json'
          if(-not (Test-Path $receiptPath)){throw 'Audio stability v6 receipt missing'}
          $receipt=Get-Content $receiptPath -Raw | ConvertFrom-Json
          if($receipt.status -ne 'PUBLISHED'){throw "Receipt status is $($receipt.status), expected PUBLISHED"}
          if($receipt.sourceCommit -ne $env:GITHUB_SHA){throw "Receipt source mismatch: $($receipt.sourceCommit) != $env:GITHUB_SHA"}
          if([string]$receipt.universeId -ne '8116636513'){throw 'Receipt universe mismatch'}
          if([string]$receipt.placeId -ne '131894120482837'){throw 'Receipt place mismatch'}
          if(-not $receipt.response.versionNumber){throw 'Receipt versionNumber missing'}
          $tmp=Join-Path $env:RUNNER_TEMP 'a-club-audio-stability-v6-live-receipt.json'
          Copy-Item $receiptPath $tmp -Force
          "BBYA_RECEIPT_TMP=$tmp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BBYA_VERSION=$($receipt.response.versionNumber)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_AUDIO_STABILITY_V6_PUBLISHED version=$($receipt.response.versionNumber) source=$($receipt.sourceCommit)"

      - name: Upload immutable receipt
        uses: actions/upload-artifact@v4
        with:
          name: bbya-audio-stability-v6-live-receipt-${{ github.sha }}
          path: ${{ env.BBYA_RECEIPT_TMP }}
          if-no-files-found: error
          retention-days: 30

      - name: Persist receipt via GitHub API
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receiptText=Get-Content $env:BBYA_RECEIPT_TMP -Raw
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($receiptText))
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='BBYA-Audio-Stability-V6-Publisher'
          }
          $repo=$env:GITHUB_REPOSITORY
          $path='deploy-status/a-club-audio-stability-v6-live.json'
          $uri="https://api.github.com/repos/$repo/contents/$path"
          $existingSha=$null
          try {$existing=Invoke-RestMethod -Headers $headers -Uri ($uri+'?ref=main');$existingSha=[string]$existing.sha} catch {if([int]$_.Exception.Response.StatusCode -ne 404){throw}}
          $payload=@{message="Record BBYA audio stability v6 live deploy v$env:BBYA_VERSION [skip ci]";content=$content;branch='main'}
          if($existingSha){$payload.sha=$existingSha}
          Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Uri $uri -Body ($payload | ConvertTo-Json -Depth 5) | Out-Null
          Write-Host "BBYA_AUDIO_STABILITY_V6_RECEIPT_PERSISTED version=$env:BBYA_VERSION source=$env:GITHUB_SHA"

