name: HANGAR v1.4 PHASE 2 VISUAL POLISH LIVE

on:
  push:
    branches: [aeroclub-hangar-rebuild-v1-lab]
    paths:
      - '.github/workflows/hangar-v1_4-phase2-live.yml'
      - 'maps/aeroclub-hangar/default.project.json'
      - 'maps/aeroclub-hangar/server/spawn-safety.server.lua'
      - 'maps/aeroclub-hangar/server/visual-bootstrap-v1_4.server.lua'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hangar-v1-4-phase2-live
  cancel-in-progress: true

env:
  LIVE_UNIVERSE_ID: '10745364913'
  LIVE_PLACE_ID: '76001567401911'
  FIXED_MODEL_ASSET_ID: '99386261031802'

jobs:
  publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Phase 2 authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=[IO.File]::ReadAllText('maps/aeroclub-hangar/default.project.json')
          foreach($m in @('HangarSpawnSafetyV1_2','HangarPhase2VisualPolishV1_4','visual-bootstrap-v1_4.server.lua')){if($project -notmatch [regex]::Escape($m)){throw "project marker missing $m"}}
          $runtime='maps/aeroclub-hangar/server/visual-bootstrap-v1_4.server.lua'
          $bytes=[IO.File]::ReadAllBytes($runtime)
          if($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF){throw 'v1.4 runtime contains UTF8 BOM'}
          $text=[IO.File]::ReadAllText($runtime)
          foreach($m in @('V1_4_PHASE2_VISUAL_POLISH','Lighting.Brightness = 1.55','Lighting.ExposureCompensation = -0.18','DonorGateAndPedestalsMesh','JetPlaneMesh','READY_PHASE2_OWNER_SCREENSHOT')){if($text -notmatch [regex]::Escape($m)){throw "runtime marker missing $m"}}
          $spawn=[IO.File]::ReadAllText('maps/aeroclub-hangar/server/spawn-safety.server.lua')
          foreach($m in @('Vector3.new(0, 6, 325)','Vector3.new(0, 10, -58)','V1_2_GLTF_Z_ALIGNED_FRONT')){if($spawn -notmatch [regex]::Escape($m)){throw "spawn marker missing $m"}}
          Write-Host 'HANGAR_PHASE2_AUTHORITY_QC_PASS'

      - name: Prepare Rojo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $d=Join-Path $env:RUNNER_TEMP 'hangar-v14-rojo';$z=Join-Path $env:RUNNER_TEMP 'hangar-v14-rojo.zip'
            if(Test-Path $d){Remove-Item $d -Recurse -Force}
            New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive -Path $z -DestinationPath $d -Force
            $e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1
            if(-not $e){throw 'rojo.exe missing'}
            $rojo=$e.FullName
          }
          "ROJO_EXE=$rojo"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build HANGAR Phase 2 place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'hangar-v14-phase2.rbxlx'
          & $env:ROJO_EXE build 'maps/aeroclub-hangar/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          $xml=[IO.File]::ReadAllText($place)
          foreach($m in @('HangarSpawnSafetyV1_2','HangarPhase2VisualPolishV1_4',$env:FIXED_MODEL_ASSET_ID,'V1_4_PHASE2_VISUAL_POLISH','READY_PHASE2_OWNER_SCREENSHOT')){if($xml -notmatch [regex]::Escape([string]$m)){throw "built place missing $m"}}
          if($xml -match 'VisibleFailsafeV1'){throw 'visible fallback leaked into Phase 2'}
          "HANGAR_PLACE=$place"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_BYTES=$((Get-Item $place).Length)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_SHA256=$((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_PHASE2_BUILD_PASS bytes=$((Get-Item $place).Length)"

      - name: Publish MAIN HANGAR and restart
        shell: powershell
        env:
          ROBLOX_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_KEY)){throw 'Roblox key missing'}
          $url="https://apis.roblox.com/universes/v1/$env:LIVE_UNIVERSE_ID/places/$env:LIVE_PLACE_ID/versions?versionType=Published"
          $version=$null
          for($i=1;$i -le 6;$i++){
            try{
              $r=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers @{'x-api-key'=$env:ROBLOX_KEY} -ContentType 'application/xml' -InFile $env:HANGAR_PLACE
              $version=[int](($r.Content|ConvertFrom-Json).versionNumber)
              break
            }catch{Write-Warning "publish attempt $i failed: $($_.Exception.Message)";Start-Sleep -Seconds ([math]::Min(30,3*$i))}
          }
          if(-not $version){throw 'Phase 2 publish failed'}
          "HANGAR_LIVE_VERSION=$version"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $restart="https://apis.roblox.com/cloud/v2/universes/$env:LIVE_UNIVERSE_ID`:restartServers"
          $rr=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $restart -Headers @{'x-api-key'=$env:ROBLOX_KEY} -ContentType 'application/json' -Body '{}'
          if([int]$rr.StatusCode -lt 200 -or [int]$rr.StatusCode -ge 300){throw "restart failed HTTP $($rr.StatusCode)"}
          Write-Host "HANGAR_PHASE2_LIVE_OK version=$version"

      - name: Save Phase 2 receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $obj=[ordered]@{
            status='LIVE_PUBLISHED';ok=$true;project='HANGAR';phase='PHASE_2_ENVIRONMENT_VISUAL_POLISH';
            universeId=$env:LIVE_UNIVERSE_ID;placeId=$env:LIVE_PLACE_ID;sourceCommit=$env:GITHUB_SHA;
            mode='HANGAR_V14_PHASE2_VISUAL_POLISH';staticModelAssetId=[int64]$env:FIXED_MODEL_ASSET_ID;
            robloxVersion=[int]$env:HANGAR_LIVE_VERSION;spawn='ACTUAL_FRONT_PLUS_Z_FACE_CENTRAL_JET';
            visibleFallback='NONE';lasers='DISABLED';serversRestarted=$true;placeBytes=[int64]$env:HANGAR_PLACE_BYTES;
            placeSha256=$env:HANGAR_PLACE_SHA256;visualQC='PENDING_OWNER_SCREENSHOT'
          }
          $text=$obj|ConvertTo-Json -Depth 6
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"))
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='HANGAR-PHASE2'}
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/hangar-live.json";$sha=$null
          try{$old=Invoke-RestMethod -Headers $h -Uri ($url+'?ref='+$env:GITHUB_REF_NAME);$sha=[string]$old.sha}catch{}
          $body=@{message='Record HANGAR Phase 2 LIVE [skip ci]';content=$b64;branch=$env:GITHUB_REF_NAME};if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $url -Body ($body|ConvertTo-Json -Depth 5)|Out-Null
