name: Publish Mountain Closed Test

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Type MOUNTAIN-10744139279-82661754996018'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'maps/mountain-social/**'
      - 'scripts/inject-mountain.js'
      - 'scripts/publish-mountain-closed-test.js'
      - '.github/workflows/publish-mountain-closed-test.yml'

jobs:
  publish-mountain-closed-test:
    if: github.event_name == 'push' || inputs.confirm_target == 'MOUNTAIN-10744139279-82661754996018'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject isolated Mountain runtime
        id: inject
        continue-on-error: true
        run: node scripts/inject-mountain.js mountain-social > mountain-inject.log 2>&1

      - name: Validate target lock and package
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          grep -q '10744139279' maps/registry.json
          grep -q '82661754996018' maps/registry.json
          test -s maps/mountain-social/place.rbxlx
          grep -q 'ACC_Mountain_World' maps/mountain-social/place.rbxlx
          grep -q 'ACC_Mountain_QC' maps/mountain-social/place.rbxlx

      - name: Publish closed-test build
        id: publish
        if: steps.inject.outcome == 'success' && steps.validate.outcome == 'success'
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: node scripts/publish-mountain-closed-test.js > mountain-publish.log 2>&1

      - name: Record publish diagnostic receipt
        if: always()
        shell: bash
        run: |
          STATUS='FAILED'
          if [ '${{ steps.inject.outcome }}' = 'success' ] && [ '${{ steps.validate.outcome }}' = 'success' ] && [ '${{ steps.publish.outcome }}' = 'success' ]; then STATUS='SUCCESS'; fi
          {
            echo "$STATUS"
            echo 'Universe: 10744139279'
            echo 'Place: 82661754996018'
            echo "Source commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Inject: ${{ steps.inject.outcome }}"
            echo "Validate: ${{ steps.validate.outcome }}"
            echo "Publish: ${{ steps.publish.outcome }}"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '--- inject log ---'
            cat mountain-inject.log 2>/dev/null || true
            echo '--- publish log ---'
            cat mountain-publish.log 2>/dev/null || true
          } > maps/mountain-social/PUBLISH-STATUS.txt
          git config user.name 'ACC Mountain Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add maps/mountain-social/PUBLISH-STATUS.txt
          git commit -m 'Record Mountain publish diagnostic [skip ci]' || true
          git push

      - name: Fail run when publish failed
        if: steps.inject.outcome != 'success' || steps.validate.outcome != 'success' || steps.publish.outcome != 'success'
        run: exit 1
