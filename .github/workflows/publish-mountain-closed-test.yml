name: Wipe Mountain Place

on:
  push:
    branches: [main]
    paths:
      - 'maps/mountain-social/place.rbxlx'
      - 'scripts/publish-mountain-closed-test.js'
      - '.github/workflows/publish-mountain-closed-test.yml'
  workflow_dispatch:

jobs:
  wipe-mountain-place:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate empty Mountain package
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q '10744139279' maps/registry.json
          grep -q '82661754996018' maps/registry.json
          test -s maps/mountain-social/place.rbxlx
          grep -q 'ACC_MOUNTAIN_WIPED' maps/mountain-social/place.rbxlx
          ! grep -q 'ACC_Mountain_World' maps/mountain-social/place.rbxlx
          ! grep -q 'ACC_MountainCoreBundle' maps/mountain-social/place.rbxlx

      - name: Publish empty Mountain place
        id: publish
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: node scripts/publish-mountain-closed-test.js > mountain-wipe-publish.log 2>&1

      - name: Record wipe receipt
        if: always()
        shell: bash
        run: |
          STATUS='FAILED'
          if [ '${{ steps.validate.outcome }}' = 'success' ] && [ '${{ steps.publish.outcome }}' = 'success' ]; then STATUS='SUCCESS'; fi
          {
            echo "$STATUS"
            echo 'Action: MOUNTAIN PLACE WIPED'
            echo 'Universe: 10744139279'
            echo 'Place: 82661754996018'
            echo "Source commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Validate: ${{ steps.validate.outcome }}"
            echo "Publish: ${{ steps.publish.outcome }}"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '--- publish log ---'
            cat mountain-wipe-publish.log 2>/dev/null || true
          } > /tmp/mountain-wipe-status.txt

          git config user.name 'ACC Mountain Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B mountain-wipe-receipt origin/main
          cp /tmp/mountain-wipe-status.txt maps/mountain-social/PUBLISH-STATUS.txt
          git add maps/mountain-social/PUBLISH-STATUS.txt
          git commit -m 'Record Mountain wipe receipt [skip ci]' || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
