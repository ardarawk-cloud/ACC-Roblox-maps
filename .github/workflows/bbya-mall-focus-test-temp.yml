name: BBYA Mall Focus Mode Test

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bbya-mall-focus-test-temp.yml'
      - 'maps/bbya-social-hub/133-mall-robux-commerce.client.lua'
      - 'maps/bbya-social-hub/134-mall-catalog-focus-mode.client.lua'

permissions:
  contents: read

env:
  TARGET_SOURCE: ${{ github.event.pull_request.head.sha }}

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Fetch exact source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'mall-focus-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'mall-focus-source'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/$env:TARGET_SOURCE" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $repo=Get-ChildItem $dir -Directory | Select-Object -First 1
          if(-not $repo){throw 'Exact source missing'}
          Get-ChildItem $repo.FullName -Force | ForEach-Object { Copy-Item $_.FullName $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "EXACT_SOURCE=$env:TARGET_SOURCE"

      - name: Static focus QC
        shell: powershell
        run: |
          $a=Get-Content 'maps/bbya-social-hub/133-mall-robux-commerce.client.lua' -Raw
          $b=Get-Content 'maps/bbya-social-hub/134-mall-catalog-focus-mode.client.lua' -Raw
          foreach($m in @('MALL COMMERCE UI v7','SHOP / TRY / CART / SAVED')){if(-not $a.Contains($m)){throw "Missing V7 $m"}}
          foreach($m in @('MALL CATALOG FOCUS MODE v1','BBYAMallCatalogFocusMode','TOP_SAFE_TOUCH=118','CoreGui preserved')){if(-not $b.Contains($m)){throw "Missing focus $m"}}
          foreach($bad in @('GetService("Lighting")','SoundId','.Volume =')){if($b.Contains($bad)){throw "Forbidden focus marker $bad"}}
          Write-Host 'BBYA_MALL_FOCUS_QC_PASS'

      - name: Map focus client and enable third party sales in test build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/default.project.json'
          $obj=(Get-Content $p -Raw | ConvertFrom-Json)
          $focus=[pscustomobject]@{'$path'='134-mall-catalog-focus-mode.client.lua'}
          $scripts=$obj.tree.StarterPlayer.StarterPlayerScripts
          if($scripts.PSObject.Properties.Name -contains 'MallCatalogFocusModeV1'){
            $scripts.MallCatalogFocusModeV1=$focus
          } else {
            $scripts | Add-Member -NotePropertyName 'MallCatalogFocusModeV1' -NotePropertyValue $focus
          }
          $props=[pscustomobject]@{AllowThirdPartySales=$true}
          if($obj.tree.Workspace.PSObject.Properties.Name -contains '$properties'){
            $obj.tree.Workspace.'$properties'=$props
          } else {
            $obj.tree.Workspace | Add-Member -NotePropertyName '$properties' -NotePropertyValue $props
          }
          $json=$obj | ConvertTo-Json -Depth 100
          $utf8NoBom=New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $p),$json,$utf8NoBom)
          $check=Get-Content $p -Raw
          if(-not $check.Contains('MallCatalogFocusModeV1')){throw 'Focus mapping missing after write'}
          if(-not $check.Contains('AllowThirdPartySales')){throw 'Third-party sales missing after write'}
          Write-Host 'BBYA_TEST_FOCUS_MAPPING_ENABLED'

      - name: Build and publish test
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $z=Join-Path $env:RUNNER_TEMP 'rojo.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive $z -DestinationPath $toolDir -Force
          }
          if((& $rojo --version) -notmatch '7\.7\.0'){throw 'Rojo 7.7.0 required'}
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mall-focus-test.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Build failed'}
          $bytes=(Get-Item $out).Length
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -eq '882da9c516386ea4ab14f78ae5c5029969318fe9cd7f9b69c85c282d3007b118'){throw 'Focus client did not change build hash'}
          $url='https://apis.roblox.com/universes/v1/10762005984/places/124607344716828/versions?versionType=Published'
          $resp=& curl.exe --silent --show-error --fail-with-body --http1.1 --ipv4 --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --header 'Content-Type: application/octet-stream' --header 'Expect:' --data-binary "@$out" $url
          if($LASTEXITCODE -ne 0){throw 'Publish failed'}
          $r=$resp|ConvertFrom-Json
          if(-not $r.versionNumber){throw 'versionNumber missing'}
          Write-Host "BBYA_MALL_FOCUS_TEST_PUBLISHED version=$($r.versionNumber) bytes=$bytes sha256=$sha source=$env:TARGET_SOURCE"
