name: After School City V1.3.6 Skate Overlap Hotfix QC

on:
  push:
    branches:
      - after-school-city/v136-skate-overlap-hotfix
    paths:
      - '.github/workflows/after-school-city-v136-skate-overlap-hotfix-qc.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: after-school-city-v136-skate-overlap-hotfix-qc
  cancel-in-progress: false

jobs:
  qc:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LIVE_SOURCE: 'aaa477d85a2501d56f42824f5785a0a2f3aea5f4'
      LIVE_VERSION: '60'
      EXPECTED_SOURCE: 'c28b49ebb9a773f08f65fadec209f1480371730d'
      SKATEBOARD_ASSET_ID: '111060043204479'
      BASKETBALL_ASSET_ID: '119323680316690'
      PLACE_ID: '121603385909425'

    steps:
      - name: Checkout QC branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact source and fresh LIVE gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git cat-file -e "$env:EXPECTED_SOURCE^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'Expected V1.3.6 source unavailable' }
          $mergeBase=(git merge-base $env:EXPECTED_SOURCE HEAD).Trim()
          if($mergeBase -ne $env:EXPECTED_SOURCE){ throw "QC head is not descended from exact candidate: $mergeBase" }
          $after=@(git diff --name-only $env:EXPECTED_SOURCE HEAD -- 'maps/after-school-city')
          if($after.Count -ne 0){ throw "Production maps changed after exact candidate: $($after -join ', ')" }

          git fetch origin main
          $paths=@(git ls-tree -r --name-only origin/main -- deploy-status | Where-Object { $_ -like 'deploy-status/after-school-city-*.json' })
          $maxVersion=-1; $maxSource=''; $maxPath=''
          foreach($path in $paths){
            try {
              $j=((git show "origin/main:$path" | Out-String) | ConvertFrom-Json)
              if($j.project -eq 'AFTER SCHOOL CITY' -and $j.status -eq 'LIVE_PUBLISHED' -and [string]$j.placeId -eq $env:PLACE_ID){
                $v=[int]$j.versionNumber
                if($v -gt $maxVersion){ $maxVersion=$v; $maxSource=[string]$j.sourceCommit; $maxPath=$path }
              }
            } catch {}
          }
          if($maxVersion -ne [int]$env:LIVE_VERSION){ throw "LIVE changed: v$maxVersion path=$maxPath" }
          if($maxSource -ne $env:LIVE_SOURCE){ throw "LIVE source changed: $maxSource" }
          Write-Host "LIVE + EXACT SOURCE PASS live=v$maxVersion candidate=$env:EXPECTED_SOURCE"

      - name: Verify isolated hotfix scope and protected authorities
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $prod=@(git diff --name-only $env:LIVE_SOURCE $env:EXPECTED_SOURCE -- 'maps/after-school-city')
          $expected=@('maps/after-school-city/after-school-city.sports-assets-v134.server.lua')
          if($prod.Count -ne 1 -or $prod[0] -ne $expected[0]){ throw "Unexpected production delta: $($prod -join ', ')" }

          $protected=@(
            'maps/after-school-city/default.project.json',
            'maps/after-school-city/after-school-city.world.server.lua',
            'maps/after-school-city/after-school-city.activities.server.lua',
            'maps/after-school-city/after-school-city.skatepark-approach-micro-cleanup.server.lua',
            'maps/after-school-city/after-school-city.skatepark-light-clearance-v112.server.lua',
            'maps/after-school-city/after-school-city.gameplay-service.lua',
            'maps/after-school-city/after-school-city.gameplay-config.lua',
            'maps/after-school-city/after-school-city.economy-config.lua',
            'maps/after-school-city/after-school-city.economy-first-shop-v130.server.lua',
            'maps/after-school-city/after-school-city.gameplay-hud.client.lua',
            'maps/after-school-city/after-school-city.music-config.lua',
            'maps/after-school-city/after-school-city.music-player.client.lua',
            'maps/after-school-city/after-school-city.intro.client.lua'
          )
          foreach($p in $protected){
            git diff --quiet $env:LIVE_SOURCE $env:EXPECTED_SOURCE -- $p
            if($LASTEXITCODE -ne 0){ throw "Protected authority changed: $p" }
          }
          Write-Host 'SCOPE PASS one sports integration file only; protected authorities unchanged'

      - name: Verify overlap hotfix and basketball preservation contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=(git show "$env:EXPECTED_SOURCE`:maps/after-school-city/after-school-city.sports-assets-v134.server.lua" | Out-String)
          foreach($token in @(
            'local VERSION = "1.3.6-skate-overlap-hotfix-1"',
            "local SKATEBOARD_PACK_ASSET_ID = $env:SKATEBOARD_ASSET_ID -- ASC_WORKFLOW_SKATEBOARD_ASSET_ID",
            "local BASKETBALL_COURT_ASSET_ID = $env:BASKETBALL_ASSET_ID -- ASC_WORKFLOW_BASKETBALL_ASSET_ID",
            'overlapParams.FilterDescendantsInstances = {skate, skateLayer}',
            'Workspace:GetPartBoundsInBox',
            'ASC_ClearanceChecked',
            'ASC_SkatePlacementStrategy',
            'CLEARANCE_AWARE',
            'no clear deck position',
            'Longest = 15',
            'Longest = 12',
            'Longest = 10',
            'layer:SetAttribute("ASC_BasketballAssetStatus", "ENABLED")',
            'basketLayer.Name = "BasketballImportedCourt"',
            'basketLayer:ScaleTo(scale)',
            'root:SetAttribute("ASC_BasketballExternalAssetEnabled", basketballReady)',
            'ASC_ProtectedGeometryUnchanged',
            'ASC_SkateOverlapHotfix'
          )){
            if($src -notmatch [regex]::Escape($token)){ throw "Contract missing: $token" }
          }

          foreach($bad in @(
            'MarketplaceService',
            'PromptProductPurchase',
            'PromptGamePassPurchase'
          )){
            $base=(git show "$env:LIVE_SOURCE`:maps/after-school-city/after-school-city.sports-assets-v134.server.lua" | Out-String)
            if($src -match [regex]::Escape($bad) -and $base -notmatch [regex]::Escape($bad)){ throw "New monetization token introduced: $bad" }
          }
          Write-Host 'HOTFIX CONTRACT PASS clearance-aware smaller skate props; basketball integration retained'

      - name: Checkout exact candidate source for build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git checkout --detach $env:EXPECTED_SOURCE
          if($LASTEXITCODE -ne 0){ throw 'Unable to checkout exact candidate source' }
          if((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SOURCE){ throw 'Exact candidate checkout mismatch' }

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojoExe=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){ throw 'rojo.exe not found' }
            $rojoExe=$exe.FullName
          }
          $version=(& $rojoExe --version | Out-String).Trim()
          if($version -notmatch '7\.7\.0'){ throw "Unexpected Rojo version: $version" }
          "ROJO_EXE=$rojoExe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ROJO PASS version=$version"

      - name: Build exact V1.3.6 candidate and receipt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $outDir=Join-Path $env:RUNNER_TEMP 'asc-v136-skate-overlap-hotfix-qc'
          if(Test-Path $outDir){ Remove-Item $outDir -Recurse -Force }
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $place=Join-Path $outDir 'after-school-city-v136-skate-overlap-hotfix.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){ throw "Rojo build failed: $LASTEXITCODE" }
          if(-not (Test-Path $place)){ throw 'Generated RBXL missing' }
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){ throw "Generated RBXL suspiciously small: $bytes" }
          $hash=(Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'STATUS=SOURCE_BUILD_QC_PASSED',
            'PROJECT=AFTER_SCHOOL_CITY',
            'SCOPE=V136_SKATE_OVERLAP_HOTFIX',
            "LIVE_ROBLOX_VERSION=$env:LIVE_VERSION",
            "LIVE_SOURCE=$env:LIVE_SOURCE",
            "SOURCE_COMMIT=$env:EXPECTED_SOURCE",
            'ROJO_VERSION=7.7.0',
            "RBXL_BYTES=$bytes",
            "SHA256=$hash",
            "SKATEBOARD_ASSET_ID=$env:SKATEBOARD_ASSET_ID",
            "BASKETBALL_ASSET_ID=$env:BASKETBALL_ASSET_ID",
            'RUNTIME_EVIDENCE=V60_SCREENSHOTS_OVERLAP_CONFIRMED',
            'PLACEMENT=CLEARANCE_AWARE_MULTI_CANDIDATE',
            'SKATE_IMPORT_SCALE=REDUCED',
            'BASKETBALL_INTEGRATION=PRESERVED',
            'SKATE_LINE_AUTHORITY=UNCHANGED',
            'SPORTS_FIELD_BASE_GEOMETRY=UNCHANGED',
            'ECONOMY_DATA_BAG_MUSIC_DEDICATION=UNCHANGED',
            'PUBLISH=NOT_PERFORMED',
            'RUNTIME_STATUS=PENDING'
          ) | Set-Content (Join-Path $outDir 'qc-receipt.txt') -Encoding utf8
          "ARTIFACT_DIR=$outDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RBXL_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RBXL_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BUILD PASS source=$env:EXPECTED_SOURCE bytes=$bytes sha256=$hash"

      - name: Upload exact V1.3.6 QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v136-skate-overlap-hotfix-qc-${{ env.EXPECTED_SOURCE }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Final QC summary
        shell: powershell
        run: |
          Write-Host "V136 QC PASS source=$env:EXPECTED_SOURCE bytes=$env:RBXL_BYTES sha256=$env:RBXL_SHA256 publish=NO runtime=PENDING"
