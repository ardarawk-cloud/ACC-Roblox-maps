name: BBYA Developer Products Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-products-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe Developer Products API
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          UNIVERSE_ID: '8116636513'
        shell: bash
        run: |
          set +e
          mkdir -p deploy-status
          http=$(curl -sS -o /tmp/products.json -w '%{http_code}' \
            -H "x-api-key: $ROBLOX_API_KEY" \
            "https://apis.roblox.com/developer-products/v2/universes/$UNIVERSE_ID/developer-products/creator?pageSize=50")
          HTTP_CODE="$http" python3 - <<'PY'
          import json, os
          http=os.environ.get('HTTP_CODE','')
          try:
              body=json.load(open('/tmp/products.json'))
          except Exception:
              body={"raw":open('/tmp/products.json').read()[:1000]}
          safe={"http":http,"ok":str(http).startswith('2'),"body":body}
          open('deploy-status/bbya-products-probe.json','w').write(json.dumps(safe,indent=2))
          PY
      - name: Persist probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add deploy-status/bbya-products-probe.json
          git commit -m 'Update BBYA developer products probe' || exit 0
          git push
