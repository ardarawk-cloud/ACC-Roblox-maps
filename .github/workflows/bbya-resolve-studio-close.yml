name: BBYA Resolve Studio Close

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-resolve-studio-close.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect and resolve Studio close dialog
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $lines = @("timestamp=$(Get-Date -Format o)")
          $p = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -match 'BBYA|Pusat Sosial' } | Select-Object -First 1
          if (-not $p) {
            $lines += 'STUDIO_FOUND=false'
          } else {
            $lines += 'STUDIO_FOUND=true'
            $lines += "PID=$($p.Id) TITLE=$($p.MainWindowTitle)"
            $root = [System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$p.MainWindowHandle)
            $buttonCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
            $buttons = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $buttonCondition)
            $clicked = $false
            foreach ($b in $buttons) {
              $name = $b.Current.Name
              if ($name) { $lines += "BUTTON=$name" }
              if (-not $clicked -and $name -match "^(Don't Save|Discard|Don't save|No)$") {
                try {
                  $inv = $b.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
                  $inv.Invoke()
                  $lines += "DISCARD_CLICKED=$name"
                  $clicked = $true
                } catch {
                  $lines += "DISCARD_CLICK_ERROR=$($_.Exception.Message)"
                }
              }
            }
            Start-Sleep -Seconds 6
            $p.Refresh()
            $lines += "CLOSED=$($p.HasExited)"
          }

          $text = ($lines -join "`n") + "`n"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-studio-close-dialog.txt"
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28"; "User-Agent"="BBYA-Studio-Close" }
          $sha = $null
          try { $sha = (Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          $body = @{ message='Record BBYA Studio close dialog status [skip ci]'; content=$content; branch='main' }
          if ($sha) { $body.sha = $sha }
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body | ConvertTo-Json) -ContentType 'application/json' | Out-Null
