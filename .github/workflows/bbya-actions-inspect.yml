name: BBYA Actions Inspect

on:
  push:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/.actions-inspect-trigger'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect latest VIP extra batch run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          runs=$(curl -fsSL "${auth[@]}" "https://api.github.com/repos/$REPO/actions/workflows/bbya-vip-extra-folder-batch-test.yml/runs?per_page=10")
          run_id=$(echo "$runs" | jq -r '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            jq -n '{status:"NO_RUN_FOUND"}' > deploy-status/bbya-vip-extra-actions-inspect.json
          else
            run=$(echo "$runs" | jq '.workflow_runs[0] | {id,name,display_title,event,status,conclusion,head_sha,run_number,created_at,updated_at,html_url}')
            jobs=$(curl -fsSL "${auth[@]}" "https://api.github.com/repos/$REPO/actions/runs/$run_id/jobs?per_page=100")
            jq -n --argjson run "$run" --argjson jobs "$jobs" '{status:"INSPECTED",run:$run,jobs:[$jobs.jobs[]|{id,name,status,conclusion,started_at,completed_at,steps:[.steps[]|{number,name,status,conclusion}]}]}' > deploy-status/bbya-vip-extra-actions-inspect.json
          fi
          git config user.name 'ACC Roblox Actions Inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-vip-extra-actions-inspect.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record BBYA VIP batch Actions diagnostic [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
