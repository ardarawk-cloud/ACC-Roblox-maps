name: BBYA Main Club Slim Pillars v6 QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/121-mainclub-beauty-v5.server.lua'
      - '.github/workflows/bbya-mainclub-slim-pillars-v6-qc.yml'
  workflow_dispatch:

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-mainclub-pillars-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-mainclub-pillars-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Static slim pillar QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content 'maps/bbya-social-hub/121-mainclub-beauty-v5.server.lua' -Raw
          foreach($needle in @(
            'SlimPillarsV6',
            'MobileSightlineFix',
            'PortalL',
            'PortalR',
            'ColumnCore',
            'Vector3.new(.62,10.8,.92)',
            'Vector3.new(1.12,18.5,1.12)',
            'SlimPillarFinishingV6',
            'GlobalLightingUntouched',
            'AudioUntouched',
            'DJBoothUntouched'
          )){
            if($src -notmatch [regex]::Escape($needle)){throw "Missing slim-pillar marker: $needle"}
          }
          if($src -match 'Lighting%.Brightness|SoundId|ROBLOX_API_KEY|MarketplaceService|DataStoreService'){
            throw 'Out-of-scope mutation detected'
          }
          Write-Host 'MAIN CLUB SLIM PILLARS STATIC QC PASS'

      - name: Full BBYA Rojo build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mainclub-slim-pillars-v6.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not (Test-Path $out)){throw 'RBXL output missing'}
          if((Get-Item $out).Length -lt 1024){throw 'RBXL output too small'}
          Write-Host "MAIN CLUB SLIM PILLARS ROJO PASS bytes=$((Get-Item $out).Length)"
