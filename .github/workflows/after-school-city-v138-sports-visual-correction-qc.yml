name: After School City V1.3.8 Sports Visual Correction QC

on:
  push:
    branches:
      - after-school-city/v138-sports-visual-correction
    paths:
      - '.github/workflows/after-school-city-v138-sports-visual-correction-qc.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: after-school-city-v138-sports-visual-correction-qc
  cancel-in-progress: false

jobs:
  qc:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LIVE_SOURCE: '5e107062864b63559510f66e1497358f2a4eda64'
      LIVE_VERSION: '61'
      EXPECTED_SOURCE: '27661bd1c3eda0d78e6e63d9dcde2e7f99b7f21c'
      PLACE_ID: '121603385909425'

    steps:
      - name: Checkout QC branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact source and fresh LIVE gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git cat-file -e "$env:EXPECTED_SOURCE^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'Expected V1.3.8 source unavailable' }
          $mergeBase=(git merge-base $env:EXPECTED_SOURCE HEAD).Trim()
          if($mergeBase -ne $env:EXPECTED_SOURCE){ throw "QC head not descended from candidate: $mergeBase" }
          $after=@(git diff --name-only $env:EXPECTED_SOURCE HEAD -- 'maps/after-school-city')
          if($after.Count -ne 0){ throw "Production maps changed after candidate: $($after -join ', ')" }

          git fetch origin main
          $paths=@(git ls-tree -r --name-only origin/main -- deploy-status | Where-Object { $_ -like 'deploy-status/after-school-city-*.json' })
          $maxVersion=-1; $maxSource=''; $maxPath=''
          foreach($path in $paths){
            try {
              $j=((git show "origin/main:$path" | Out-String) | ConvertFrom-Json)
              if($j.project -eq 'AFTER SCHOOL CITY' -and $j.status -eq 'LIVE_PUBLISHED' -and [string]$j.placeId -eq $env:PLACE_ID){
                $v=[int]$j.versionNumber
                if($v -gt $maxVersion){ $maxVersion=$v; $maxSource=[string]$j.sourceCommit; $maxPath=$path }
              }
            } catch {}
          }
          if($maxVersion -ne [int]$env:LIVE_VERSION){ throw "LIVE changed: v$maxVersion path=$maxPath" }
          if($maxSource -ne $env:LIVE_SOURCE){ throw "LIVE source changed: $maxSource" }
          Write-Host "LIVE + EXACT SOURCE PASS live=v$maxVersion candidate=$env:EXPECTED_SOURCE"

      - name: Verify production scope
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $prod=@(git diff --name-only $env:LIVE_SOURCE $env:EXPECTED_SOURCE -- 'maps/after-school-city')
          $expected=@(
            'maps/after-school-city/after-school-city.runtime-correction-v138.server.lua',
            'maps/after-school-city/default.project.json'
          )
          $a=@($prod | Sort-Object); $b=@($expected | Sort-Object)
          if(($a -join '|') -ne ($b -join '|')){ throw "Unexpected production delta: $($prod -join ', ')" }

          $protected=@(
            'maps/after-school-city/after-school-city.world.server.lua',
            'maps/after-school-city/after-school-city.city-life.server.lua',
            'maps/after-school-city/after-school-city.sports-assets-v134.server.lua',
            'maps/after-school-city/after-school-city.runtime-cleanup-v137.server.lua',
            'maps/after-school-city/after-school-city.gameplay-service.lua',
            'maps/after-school-city/after-school-city.gameplay-config.lua',
            'maps/after-school-city/after-school-city.economy-config.lua',
            'maps/after-school-city/after-school-city.economy-first-shop-v130.server.lua',
            'maps/after-school-city/after-school-city.gameplay-hud.client.lua',
            'maps/after-school-city/after-school-city.music-config.lua',
            'maps/after-school-city/after-school-city.music-player.client.lua',
            'maps/after-school-city/after-school-city.intro.client.lua'
          )
          foreach($p in $protected){
            git diff --quiet $env:LIVE_SOURCE $env:EXPECTED_SOURCE -- $p
            if($LASTEXITCODE -ne 0){ throw "Protected authority changed: $p" }
          }
          Write-Host 'SCOPE PASS'

      - name: Verify screenshot correction contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $fix=(git show "$env:EXPECTED_SOURCE`:maps/after-school-city/after-school-city.runtime-correction-v138.server.lua" | Out-String)
          $project=(git show "$env:EXPECTED_SOURCE`:maps/after-school-city/default.project.json" | Out-String)
          foreach($token in @(
            '1.3.8-sports-visual-correction-1',
            'ASC_V137_GatePieceHidden',
            'ASC_V138_RestoredBasketFence',
            'sports:FindFirstChild("Bleachers")',
            'FenceNorth',
            'FenceSouth',
            'FenceRailNorth',
            'FenceRailSouth',
            'V03_SkateLife',
            'V03_SportsLife',
            'CFrame.Angles(0, math.rad(180), 0)',
            'ASC_V138_BenchFacingFixed'
          )){
            if($fix -notmatch [regex]::Escape($token)){ throw "V138 contract missing: $token" }
          }
          if($project -notmatch [regex]::Escape('"ASC_RuntimeCorrectionV138": {"$path": "after-school-city.runtime-correction-v138.server.lua"}')){ throw 'V138 project mapping missing' }
          foreach($bad in @('MarketplaceService','PromptProductPurchase','PromptGamePassPurchase')){
            if($fix -match [regex]::Escape($bad)){ throw "Forbidden monetization token: $bad" }
          }
          Write-Host 'V138 CONTRACT PASS restore chainlink + remove gray legacy fence/bleachers + fix bench facing'

      - name: Checkout exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git checkout --detach $env:EXPECTED_SOURCE
          if($LASTEXITCODE -ne 0 -or (git rev-parse HEAD).Trim() -ne $env:EXPECTED_SOURCE){ throw 'Exact candidate checkout failed' }

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){ $rojoExe=$cmd.Source } else {
            $dir=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){ throw 'rojo.exe not found' }
            $rojoExe=$exe.FullName
          }
          $version=(& $rojoExe --version | Out-String).Trim()
          if($version -notmatch '7\.7\.0'){ throw "Unexpected Rojo version: $version" }
          "ROJO_EXE=$rojoExe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact V1.3.8 candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $outDir=Join-Path $env:RUNNER_TEMP 'asc-v138-qc'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $place=Join-Path $outDir 'after-school-city-v138-sports-visual-correction.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $place)){ throw 'Rojo build failed' }
          $bytes=(Get-Item $place).Length
          $hash=(Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'STATUS=SOURCE_BUILD_QC_PASSED',
            'PROJECT=AFTER_SCHOOL_CITY',
            'SCOPE=V138_SPORTS_VISUAL_CORRECTION',
            "LIVE_ROBLOX_VERSION=$env:LIVE_VERSION",
            "LIVE_SOURCE=$env:LIVE_SOURCE",
            "SOURCE_COMMIT=$env:EXPECTED_SOURCE",
            'ROJO_VERSION=7.7.0',
            "RBXL_BYTES=$bytes",
            "SHA256=$hash",
            'RESTORE_IMPORTED_BASKET_FENCE=YES',
            'REMOVE_GRAY_NATIVE_SPORTS_OBSTRUCTION=YES',
            'REMOVE_PROTOTYPE_BLEACHERS=YES',
            'FIX_REVERSED_ACTIVITY_BENCHES=YES',
            'PROTECTED_AUTHORITIES=UNCHANGED',
            'PUBLISH=NOT_PERFORMED',
            'RUNTIME_STATUS=PENDING'
          ) | Set-Content (Join-Path $outDir 'qc-receipt.txt') -Encoding utf8
          "ARTIFACT_DIR=$outDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RBXL_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RBXL_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BUILD PASS source=$env:EXPECTED_SOURCE bytes=$bytes sha256=$hash"

      - name: Upload exact QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v138-sports-visual-correction-qc-${{ env.EXPECTED_SOURCE }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Final QC summary
        shell: powershell
        run: |
          Write-Host "V138 QC PASS source=$env:EXPECTED_SOURCE bytes=$env:RBXL_BYTES sha256=$env:RBXL_SHA256 publish=NO runtime=PENDING"
