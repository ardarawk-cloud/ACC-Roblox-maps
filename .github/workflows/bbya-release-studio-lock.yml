# release-trigger 2026-08-21T04:15+08:00
name: BBYA Release Studio Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-release-studio-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Gracefully close BBYA Roblox Studio session
        shell: powershell
        run: |
          $lines = @()
          $lines += "timestamp=$(Get-Date -Format o)"
          $targets = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -match 'BBYA|Pusat Sosial' }
          if (-not $targets) {
            $lines += 'STUDIO_TARGET_FOUND=false'
          } else {
            $lines += "STUDIO_TARGET_FOUND=true"
            foreach ($p in $targets) {
              $lines += "PID=$($p.Id) TITLE=$($p.MainWindowTitle)"
              try {
                $requested = $p.CloseMainWindow()
                $lines += "CLOSE_REQUESTED=$requested"
                Start-Sleep -Seconds 8
                $p.Refresh()
                if ($p.HasExited) {
                  $lines += 'CLOSED=true'
                } else {
                  $lines += 'CLOSED=false'
                  $lines += 'NOTE=Studio remained open after graceful close; no force kill was used.'
                }
              } catch {
                $lines += "ERROR=$($_.Exception.Message)"
              }
            }
          }

          $text = ($lines -join "`n") + "`n"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-studio-release.txt"
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28"; "User-Agent"="BBYA-Studio-Release" }
          $sha = $null
          try { $sha = (Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          $body = @{ message='Record BBYA Studio release status [skip ci]'; content=$content; branch='main' }
          if ($sha) { $body.sha = $sha }
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body | ConvertTo-Json) -ContentType 'application/json' | Out-Null
