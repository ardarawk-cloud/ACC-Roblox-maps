name: BBYA Mall Bottom Compact Patch Temp

on:
  push:
    branches:
      - 'feat/bbya-mall-catalog-v8-reference-rebuild'
    paths:
      - '.github/workflows/bbya-mall-bottom-compact-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/bbya-mall-catalog-v8-reference-rebuild
          fetch-depth: 0

      - name: Raise mobile-landscape bottom boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/133-mall-robux-commerce.client.lua'
          $s=Get-Content $p -Raw
          $old='local targetW=math.max(620,math.floor(vp.X*.82));local targetH=math.max(330,math.floor(vp.Y*.78));local baseH=math.min(rawH,targetH);local availW=math.min(rawW,targetW);local availH=math.max(300,baseH-50)'
          $new='local targetW=math.max(620,math.floor(vp.X*.82));local targetH=math.max(330,math.floor(vp.Y*.78));local baseH=math.min(rawH,targetH);local availW=math.min(rawW,targetW);local compactBottom=(UserInputService.TouchEnabled and vp.X>vp.Y) and 92 or 50;local availH=math.max(300,baseH-compactBottom)'
          if(-not $s.Contains($old)){ throw 'responsive height authority line not found; stop instead of broad edit' }
          $s=$s.Replace($old,$new)
          [System.IO.File]::WriteAllText((Resolve-Path $p),$s,(New-Object System.Text.UTF8Encoding($false)))
          if(-not (Select-String -Path $p -SimpleMatch 'compactBottom=(UserInputService.TouchEnabled and vp.X>vp.Y) and 92 or 50')){ throw 'compact bottom patch missing' }

      - name: Commit exact Mall compact-bottom fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ardarawk-cloud'
          git config user.email 'ardarawk@gmail.com'
          git add maps/bbya-social-hub/133-mall-robux-commerce.client.lua
          git diff --cached --quiet && exit 0
          git commit -m 'fix(test): raise Mall mobile bottom boundary'
          git push origin HEAD:feat/bbya-mall-catalog-v8-reference-rebuild
