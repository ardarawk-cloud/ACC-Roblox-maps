name: BBYA VIP Track 01 Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-vip-track01-diag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe uploader key
        continue-on-error: true
        env:
          AUDIO_KEY: ${{ secrets.AMSTUDIO_AUDIO_UPLOADER_01 }}
        shell: bash
        run: |
          mkdir -p deploy-status
          python3 - <<'PY'
          import json,os,pathlib,urllib.request,urllib.error
          out=pathlib.Path('deploy-status/bbya-vip-track01-diag-key.json')
          key=os.environ.get('AUDIO_KEY','').strip()
          r={'secretPresent':bool(key)}
          if key:
            req=urllib.request.Request('https://apis.roblox.com/api-keys/v1/introspect',data=json.dumps({'apiKey':key}).encode(),headers={'Content-Type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=30) as x:
                d=json.loads(x.read().decode()); r['http']=x.status
                r['keyName']=d.get('name'); r['authorizedUserId']=str(d.get('authorizedUserId')) if d.get('authorizedUserId') is not None else None
                r['enabled']=d.get('enabled'); r['expired']=d.get('expired')
                r['scopes']=[{'name':s.get('name'),'operations':s.get('operations') or []} for s in (d.get('scopes') or [])]
            except urllib.error.HTTPError as e:
              r['http']=e.code; r['error']=e.read().decode('utf-8','replace')[-1000:]
          out.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(r,ensure_ascii=False))
          PY

      - name: Probe Drive Track 01
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p deploy-status
          python3 -m pip install --quiet gdown
          set +e
          gdown 'https://drive.google.com/uc?id=1_E34wIMN6YNHyZmpyy8kybTD7bIbNDmO' -O /tmp/track01-probe.mp3
          code=$?
          set -e
          python3 - "$code" <<'PY'
          import json,pathlib,subprocess,sys
          p=pathlib.Path('/tmp/track01-probe.mp3')
          r={'gdownExit':int(sys.argv[1]),'exists':p.exists(),'bytes':p.stat().st_size if p.exists() else 0}
          if p.exists() and p.stat().st_size>1000:
            q=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(p)],text=True,capture_output=True)
            r['ffprobeExit']=q.returncode; r['duration']=q.stdout.strip(); r['ffprobeError']=q.stderr[-500:]
          pathlib.Path('deploy-status/bbya-vip-track01-diag-drive.json').write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r))
          PY

      - name: Persist diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-vip-track01-diag-key.json deploy-status/bbya-vip-track01-diag-drive.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record BBYA VIP Track 01 diagnostic [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
