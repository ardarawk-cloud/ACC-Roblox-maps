name: BBYA Music v1.3 Batch Dispatch Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  dispatch-batch:
    if: startsWith(github.event.issue.title, 'BBYA MUSIC BATCH V1.3 DISPATCH')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read batch and sharing request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
          field(){ printf '%s\n' "$BODY" | sed -n "s/^$1=//p" | head -n1; }
          BATCH_JSON="$(field batch_json)"
          PERMISSION_MODE="$(field permission_mode)"
          TARGET_PROJECTS="$(field target_projects)"
          UNIVERSE_IDS="$(field universe_ids)"
          [ -n "$BATCH_JSON" ] || { echo 'batch_json missing'; exit 10; }
          printf '%s' "$BATCH_JSON" | jq -e 'type == "array" and length >= 1 and length <= 100' >/dev/null
          [ -n "$PERMISSION_MODE" ] || PERMISSION_MODE='AM_STUDIO_SHARED'
          {
            echo 'batch_json<<EOF'; echo "$BATCH_JSON"; echo 'EOF'
            echo "permission_mode=$PERMISSION_MODE"
            echo "target_projects=$TARGET_PROJECTS"
            echo "universe_ids=$UNIVERSE_IDS"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch unified 1.75x batch uploader
        shell: bash
        env:
          BRIDGE_TOKEN: ${{ secrets.BALI_ENTERTAIMENT_TOKEN }}
          BATCH_JSON: ${{ steps.request.outputs.batch_json }}
          PERMISSION_MODE: ${{ steps.request.outputs.permission_mode }}
          TARGET_PROJECTS: ${{ steps.request.outputs.target_projects }}
          UNIVERSE_IDS: ${{ steps.request.outputs.universe_ids }}
        run: |
          set -euo pipefail
          [ -n "${BRIDGE_TOKEN:-}" ] || { echo 'BALI_ENTERTAIMENT_TOKEN missing'; exit 20; }
          PAYLOAD="$(jq -nc --arg ref main --arg batch "$BATCH_JSON" --arg mode "$PERMISSION_MODE" --arg projects "$TARGET_PROJECTS" --arg universes "$UNIVERSE_IDS" '{ref:$ref,inputs:{batch_json:$batch,permission_mode:$mode,target_projects:$projects,universe_ids:$universes}}')"
          HTTP="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $BRIDGE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' 'https://api.github.com/repos/balientertaiment-web/Roblox-backup-publish/actions/workflows/bbya-music-simple-upload-v13.yml/dispatches' -d "$PAYLOAD")"
          [ "$HTTP" = '204' ] || { echo "Batch dispatch failed HTTP=$HTTP"; cat /tmp/dispatch-response.txt || true; exit 21; }
          echo 'BBYA_MUSIC_V13_BATCH_DISPATCHED_175_PERMISSION_CONTRACT'

      - name: Mark dispatch success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'BBYA_MUSIC_V13_BATCH_DISPATCHED | 1.75x | permission contract enforced | No map publish.'});

      - name: Mark dispatch failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'BBYA_MUSIC_V13_BATCH_DISPATCH_FAILED | NOT READY FOR MAP USE | No map publish.'});
