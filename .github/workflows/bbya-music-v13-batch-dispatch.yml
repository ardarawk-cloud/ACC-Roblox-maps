name: BBYA Music v1.3 Batch Dispatch Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  dispatch-batch:
    if: startsWith(github.event.issue.title, 'BBYA MUSIC BATCH V1.3 DISPATCH')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read batch request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
          BATCH_JSON="$(printf '%s\n' "$BODY" | sed -n 's/^batch_json=//p' | head -n1)"
          [ -n "$BATCH_JSON" ] || { echo 'batch_json missing'; exit 10; }
          printf '%s' "$BATCH_JSON" | jq -e 'type == "array" and length >= 1 and length <= 100' >/dev/null
          {
            echo 'batch_json<<EOF'
            echo "$BATCH_JSON"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch v1.3 batch uploader
        shell: bash
        env:
          BRIDGE_TOKEN: ${{ secrets.BALI_ENTERTAIMENT_TOKEN }}
          BATCH_JSON: ${{ steps.request.outputs.batch_json }}
        run: |
          set -euo pipefail
          [ -n "${BRIDGE_TOKEN:-}" ] || { echo 'BALI_ENTERTAIMENT_TOKEN missing'; exit 20; }
          PAYLOAD="$(jq -nc --arg ref 'main' --arg batch "$BATCH_JSON" '{ref:$ref,inputs:{batch_json:$batch}}')"
          HTTP="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $BRIDGE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/balientertaiment-web/Roblox-backup-publish/actions/workflows/bbya-music-simple-upload-v13.yml/dispatches' \
            -d "$PAYLOAD")"
          if [ "$HTTP" != '204' ]; then
            echo "Batch dispatch failed HTTP=$HTTP"
            cat /tmp/dispatch-response.txt || true
            exit 21
          fi
          echo 'BBYA Music v1.3 batch dispatch accepted.'

      - name: Mark dispatch success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'BBYA_MUSIC_V13_BATCH_DISPATCHED | Target: balientertaiment-web/Roblox-backup-publish | No map/inject/publish attempted.'
            })

      - name: Mark dispatch failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'BBYA_MUSIC_V13_BATCH_DISPATCH_FAILED | Check workflow logs. No map/inject/publish attempted.'
            })
