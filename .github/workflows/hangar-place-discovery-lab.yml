name: HANGAR Place Discovery LAB

on:
  push:
    branches: [hangar-vehicle-manual-lock-lab]
    paths:
      - '.github/workflows/hangar-place-discovery-lab.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List existing HANGAR universe places (read only)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://develop.roblox.com/v1/universes/10745364913/places?limit=100&sortOrder=Asc' > hangar-places.json
          cat hangar-places.json
      - name: Upload discovery result
        uses: actions/upload-artifact@v4
        with:
          name: hangar-place-discovery
          path: hangar-places.json
          if-no-files-found: error
