name: BBYA VIP Playback Restart Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-vip-playback-restart-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      BBYA_UNIVERSE: '8116636513'
    steps:
      - name: Restart and persist receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          body=/tmp/restart.json
          http=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            "https://apis.roblox.com/cloud/v2/universes/${BBYA_UNIVERSE}:restartServers" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{}')
          now=$(date -u +%FT%TZ)
          receipt=$(jq -n --arg status "$([ "$http" = 200 ] && echo SUCCESS || echo FAILED)" --arg http "$http" --arg at "$now" --arg version '387' '{status:$status,restartHttp:$http,restartedAt:$at,hotfixVersion:($version|tonumber),note:"VIP REQUEST PREV NEXT wired to VIPMusic authority; no audio upload"}')
          encoded=$(printf '%s\n' "$receipt" | base64 -w0)
          api="https://api.github.com/repos/$REPO/contents/deploy-status/bbya-vip-playback-restart.json"
          oldsha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" | jq -r '.sha // empty')
          payload=$(jq -n --arg m 'Record VIP playback restart [skip ci]' --arg c "$encoded" --arg s "$oldsha" '{message:$m,content:$c,branch:"main"} + (if $s!="" then {sha:$s} else {} end)')
          curl -fsSL -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$payload" "$api" >/dev/null
          cat "$body" || true
          test "$http" = '200'
