name: BBYA Restart Live Servers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-restart-servers.yml'
      - '.github/worker-jobs/bbya-restart-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restart BBYA universe servers
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          url='https://apis.roblox.com/cloud/v2/universes/8116636513:restartServers'
          tmp=$(mktemp)
          http=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}' "$url" || true)
          body=$(cat "$tmp")
          requested=$(date -u +%FT%TZ)
          jq -n \
            --arg requestedAt "$requested" \
            --arg universeId '8116636513' \
            --arg http "$http" \
            --arg response "$body" \
            '{requestedAt:$requestedAt,universeId:$universeId,http:$http,ok:($http|startswith("2")),response:$response}' \
            > /tmp/bbya-restart.json
          cat /tmp/bbya-restart.json
          content=$(base64 -w0 /tmp/bbya-restart.json)
          api="https://api.github.com/repos/$REPO/contents/deploy-status/bbya-restart-servers.json"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json')
          sha=$(curl -sS "${headers[@]}" "$api" | jq -r '.sha // empty')
          if [ -n "$sha" ]; then
            payload=$(jq -n --arg c "$content" --arg s "$sha" '{message:"Record BBYA server restart [skip ci]",content:$c,branch:"main",sha:$s}')
          else
            payload=$(jq -n --arg c "$content" '{message:"Record BBYA server restart [skip ci]",content:$c,branch:"main"}')
          fi
          curl -fsSL -X PUT "${headers[@]}" -d "$payload" "$api" >/dev/null
