name: After School City V1.0 Gameplay Foundation QC

on:
  push:
    branches:
      - after-school-city/v100-gameplay-foundation
    paths:
      - 'maps/after-school-city/**'
      - '.github/workflows/after-school-city-v100-gameplay-foundation-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact v42 source and narrow diff gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'ab82f4f011adc270a104bb02d6b70521a90914fc'
          git cat-file -e "$base^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'V0.9.3 v42 LIVE source unavailable' }
          $mergeBase = (git merge-base $base $env:GITHUB_SHA).Trim()
          if($mergeBase -ne $base){ throw "Candidate is not based on exact v42 LIVE source: $mergeBase" }
          $allowed = @(
            '.github/workflows/after-school-city-v100-gameplay-foundation-qc.yml',
            'maps/after-school-city/after-school-city.gameplay-config.lua',
            'maps/after-school-city/after-school-city.gameplay-service.lua',
            'maps/after-school-city/after-school-city.gameplay-bootstrap.server.lua',
            'maps/after-school-city/after-school-city.gameplay-hud.client.lua',
            'maps/after-school-city/after-school-city.config.lua',
            'maps/after-school-city/default.project.json'
          )
          $changed = @(git diff --name-only $base $env:GITHUB_SHA)
          if($changed.Count -ne 7){ throw "Expected exactly 7 files, got $($changed.Count): $($changed -join ', ')" }
          foreach($path in $changed){ if($allowed -notcontains $path){ throw "Scope violation: $path" } }
          foreach($path in $allowed){ if($changed -notcontains $path){ throw "Missing required change: $path" } }
          Write-Host "V1.0 NARROW DIFF PASS source=$env:GITHUB_SHA"

      - name: Gameplay authority and persistence static checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $servicePath = 'maps/after-school-city/after-school-city.gameplay-service.lua'
          $gameConfigPath = 'maps/after-school-city/after-school-city.gameplay-config.lua'
          $hudPath = 'maps/after-school-city/after-school-city.gameplay-hud.client.lua'
          $projectPath = 'maps/after-school-city/default.project.json'
          $configPath = 'maps/after-school-city/after-school-city.config.lua'
          $service = Get-Content $servicePath -Raw
          $gameConfig = Get-Content $gameConfigPath -Raw
          $hud = Get-Content $hudPath -Raw
          $project = Get-Content $projectPath -Raw
          $config = Get-Content $configPath -Raw
          $null = $project | ConvertFrom-Json

          foreach($token in @(
            '1.0.0-gameplay-foundation-1',
            'DataStoreService',
            'GetDataStore',
            'GetAsync',
            'UpdateAsync',
            'ASC_ProfileReady',
            'ASC_ProfilePersistent',
            'ASC_Coins',
            'ASC_Rep',
            'ASC_Level',
            'CompletedQuests',
            'GameplayService.Award',
            'GameplayService.CanUseCooldown',
            'GameplayService.CompleteQuest',
            'GameplayService.ShowDialogue',
            'BindToClose',
            'ASC_GameplayFoundationReady'
          )){
            if($service -notmatch [regex]::Escape($token)){ throw "Missing gameplay-service marker: $token" }
          }

          foreach($token in @(
            'ASC_PlayerProfile_v1',
            'FIRST_STEPS_DOWNTOWN',
            'VISIT_SKATEPARK',
            'VISIT_CITY_PARK',
            'RewardCoins',
            'RewardRep',
            'AutosaveSeconds = 60',
            'LoadRetries = 3',
            'SaveRetries = 3'
          )){
            if($gameConfig -notmatch [regex]::Escape($token)){ throw "Missing gameplay-config marker: $token" }
          }

          foreach($token in @('ASCGameplayConfig','ASC_GameplayService','ASC_GameplayBootstrap','ASC_GameplayHUD','ASC_PersonalMusicPlayer','ASC_FinalEnvironmentPolishV093')){
            if($project -notmatch [regex]::Escape($token)){ throw "Missing Rojo mapping: $token" }
          }

          foreach($token in @('Version = "1.0.0-gameplay-foundation-1"','GameplayFoundationVersion = "1.0.0-gameplay-foundation-1"','EnableActivities = true','EnableEconomy = true','EnablePersistence = true','EnablePersonalRoom = false','EnableClubs = false')){
            if($config -notmatch [regex]::Escape($token)){ throw "Missing V1.0 config lock: $token" }
          }

          foreach($token in @('ASC_GameplayHUD','RequestState','StatePush','Toast','Dialogue','OBJECTIVE','SAVE ON','SESSION')){
            if($hud -notmatch [regex]::Escape($token)){ throw "Missing HUD marker: $token" }
          }

          foreach($forbidden in @('FireServer(','InvokeServer("Award','PromptProductPurchase','ProcessReceipt','MarketplaceService')){
            if($hud -match [regex]::Escape($forbidden)){ throw "Client authority/monetization violation: $forbidden" }
          }

          foreach($forbidden in @('MarketplaceService','PromptProductPurchase','ProcessReceipt','DeveloperProduct','GamePass')){
            if($service -match [regex]::Escape($forbidden)){ throw "Monetization authority introduced in V1.0: $forbidden" }
          }

          $intro = Get-Content 'maps/after-school-city/after-school-city.intro.client.lua' -Raw
          foreach($token in @('PUTU AZYA PUTRI','BINTANG HARDAJAYA','WITH LOVE, DAD','ENTER THE CITY')){
            if($intro -notmatch [regex]::Escape($token)){ throw "Dedication lock missing: $token" }
          }

          foreach($lockedPath in @(
            'maps/after-school-city/after-school-city.final-environment-v093.server.lua',
            'maps/after-school-city/after-school-city.signage-typography-v0923.server.lua',
            'maps/after-school-city/after-school-city.global-signage-readability-v0922.server.lua',
            'maps/after-school-city/after-school-city.precision-environment-v092.server.lua',
            'maps/after-school-city/after-school-city.premium-environment-v091.server.lua',
            'maps/after-school-city/after-school-city.premium-exterior.server.lua',
            'maps/after-school-city/after-school-city.swimmable-pool.server.lua',
            'maps/after-school-city/after-school-city.music-player.client.lua',
            'maps/after-school-city/after-school-city.intro.client.lua',
            'maps/after-school-city/after-school-city.world.server.lua'
          )){
            $diff = git diff --name-only 'ab82f4f011adc270a104bb02d6b70521a90914fc' $env:GITHUB_SHA -- $lockedPath
            if($diff){ throw "Protected source changed: $lockedPath" }
          }

          Write-Host 'V1.0 GAMEPLAY AUTHORITY STATIC QC PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
          $zip = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
          if(-not $exe){ throw 'rojo.exe missing' }
          $version = (& $exe.FullName --version | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $version -notmatch '7\.7\.0'){ throw "Unexpected Rojo version: $version" }
          "ROJO_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ROJO_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact V1.0 candidate and hash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'asc-v100-qc'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $place = Join-Path $out 'after-school-city-v100.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $place)){ throw 'Rojo build failed' }
          $bytes = (Get-Item $place).Length
          if($bytes -lt 1024){ throw "RBXL too small: $bytes" }
          $hash = (Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = @(
            'STATUS=QC_PASSED',
            'MODE=GAMEPLAY_FOUNDATION_V1_0_0',
            'BASE_LIVE_COMMIT=ab82f4f011adc270a104bb02d6b70521a90914fc',
            "SOURCE_COMMIT=$env:GITHUB_SHA",
            "ROJO=$env:ROJO_VERSION",
            "RBXL_BYTES=$bytes",
            "SHA256=$hash",
            'PROFILE=ASC_PLAYER_PROFILE_V1_FAIL_CLOSED',
            'ECONOMY=SERVER_AUTHORITATIVE_ASC_COINS_CITY_REP',
            'QUESTS=DOWNTOWN_SKATEPARK_CITY_PARK',
            'HUD=COMPACT_MOBILE',
            'MONETIZATION=UNCHANGED_NONE',
            'PROTECTED=ENVIRONMENT_ROADS_POOL_MUSIC_DEDICATION'
          )
          $receipt | Set-Content (Join-Path $out 'qc-receipt.txt') -Encoding ascii
          $receipt | ForEach-Object { Write-Host $_ }
          "QC_OUT_DIR=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exact V1.0 QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v100-qc-${{ github.sha }}
          path: ${{ env.QC_OUT_DIR }}
          if-no-files-found: error
          retention-days: 7
