name: HANGAR Full Owner Fleet v4 LIVE

on:
  push:
    branches: [aeroclub-hangar-rebuild-v1-lab]
    paths: ['.github/workflows/hangar-full-owner-fleet-v4-live.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hangar-full-owner-fleet-v4-live
  cancel-in-progress: true

env:
  UNIVERSE_ID: '10745364913'
  PLACE_ID: '76001567401911'
  CREATOR_ID: '4141352496'
  ENV_ASSET_ID: '76797254008026'
  JET_ASSET_ID: '135410789803386'
  PATROL_MCLAREN_ASSET_ID: '128438812070025'
  PATROL_PORSCHE_ASSET_ID: '108398505977253'

jobs:
  full-fleet:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90
    env:
      ASSET_KEY: ${{ secrets.AM_STUDIO }}
      MASTER_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify owner layout authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=[IO.File]::ReadAllText('maps/aeroclub-hangar/server/sketchfab-vehicles-v1.server.lua')
          foreach($m in @('OWNER VEHICLE LAYOUT v4.0','FULL_FLEET_2_PATROL_FRONT_11_JET_FLOOR','NOSE_TO_OUTDOOR_PLUS_Z','HANGAR_CAR11_DELOREAN')){
            if($src -notmatch [regex]::Escape($m)){throw "missing owner marker $m"}
          }
          if([string]::IsNullOrWhiteSpace($env:ASSET_KEY)){throw 'AM_STUDIO key missing'}
          Write-Host 'OWNER_LAYOUT_V4_AUTHORITY_PASS'

      - name: Download all remaining owner GLB cars in parallel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'hangar-full-fleet-v4'
          if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
          New-Item -ItemType Directory -Path $dir -Force|Out-Null

          $items=@(
            @{k='CAR01';id='1jqtOcoijz1Qp4T2M12ZWEjTIyKPD7J7R';n='Nissan R34 Brian'},
            @{k='CAR02';id='1K7NNquy3EapuqeyYrKZ2Ni09F7YleIpM';n='Dodge Charger RT 1970'},
            @{k='CAR03';id='1DJk0UyAXlYM-uxh2r62zUSXmMUcR0pfU';n='Toyota Supra MK IV'},
            @{k='CAR04';id='1jNz6HFW7zOU0qNYZ47N-LrrLXmUhV-kz';n='Lamborghini Murcielago'},
            @{k='CAR05';id='1I-o5DElsbimj-bjP5kgdidrZu-zOreoz';n='Mitsubishi Eclipse 1995'},
            @{k='CAR06';id='1uuiXGUbYhqMrAAll28CVJYDcKDg36kFx';n='Honda S2000'},
            @{k='CAR07';id='1kQBu4JSTye_qhPzB5GP1CXihFBq9k-NV';n='Mitsubishi Eclipse Spyder'},
            @{k='CAR08';id='1kxyEPKjCw7GwHrmGBLV01R0B14CPT3SZ';n='Subaru BRZ Rocket Bunny'},
            @{k='CAR09';id='1u5ZKaHSMxaBLMoY1xLnMDxZDoIxS8_T9';n='Nissan Skyline R34 C-West'},
            @{k='CAR10';id='1tFlfZz1L386UzkwIsL6zAklKnWtras1i';n='Chevy Camaro SS'},
            @{k='CAR11';id='1cRgNRI2RBUINnyJbkUfMeUv9OHW4KNiT';n='DeLorean DMC-12'}
          )

          $jobs=@()
          foreach($i in $items){
            $out=Join-Path $dir ($i.k.ToLowerInvariant()+'.glb')
            $jobs+=Start-Job -ArgumentList $i.k,$i.id,$out -ScriptBlock {
              param($k,$id,$out)
              $ErrorActionPreference='Stop'
              Invoke-WebRequest -UseBasicParsing -Uri "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" -OutFile $out -MaximumRedirection 12
              $b=[IO.File]::ReadAllBytes($out)
              if($b.Length -lt 100000 -or [Text.Encoding]::ASCII.GetString($b,0,4) -ne 'glTF'){throw "invalid GLB $k"}
              [pscustomobject]@{k=$k;path=$out;bytes=$b.Length;sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()}
            }
          }
          Wait-Job $jobs|Out-Null
          $results=@($jobs|Receive-Job)
          $bad=@($jobs|Where-Object State -ne 'Completed')
          $jobs|Remove-Job -Force
          if($bad.Count -gt 0){throw "download jobs failed count=$($bad.Count)"}
          if($results.Count -ne $items.Count){throw "download count mismatch got=$($results.Count) expected=$($items.Count)"}
          foreach($r in $results){
            "$($r.k)_GLB=$($r.path)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "GLB_OK $($r.k) bytes=$($r.bytes) sha=$($r.sha)"
          }

      - name: Start all Roblox uploads
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $items=@(
            @{k='CAR01';n='HANGAR Nissan R34 Brian'},
            @{k='CAR02';n='HANGAR Dodge Charger RT 1970'},
            @{k='CAR03';n='HANGAR Toyota Supra MK IV'},
            @{k='CAR04';n='HANGAR Lamborghini Murcielago'},
            @{k='CAR05';n='HANGAR Mitsubishi Eclipse 1995'},
            @{k='CAR06';n='HANGAR Honda S2000'},
            @{k='CAR07';n='HANGAR Mitsubishi Eclipse Spyder'},
            @{k='CAR08';n='HANGAR Subaru BRZ Rocket Bunny'},
            @{k='CAR09';n='HANGAR Nissan Skyline R34 C-West'},
            @{k='CAR10';n='HANGAR Chevy Camaro SS'},
            @{k='CAR11';n='HANGAR DeLorean DMC-12'}
          )
          $accepted=0
          foreach($i in $items){
            $file=[Environment]::GetEnvironmentVariable($i.k+'_GLB')
            if(-not $file -or -not (Test-Path $file)){throw "missing local file $($i.k)"}
            $req=@{assetType='Model';displayName=$i.n;description='Owner-supplied HANGAR vehicle model.';creationContext=@{creator=@{userId=[int64]$env:CREATOR_ID}}}|ConvertTo-Json -Depth 8 -Compress
            $rf=Join-Path $env:RUNNER_TEMP ("req-"+$i.k+'.json')
            [IO.File]::WriteAllText($rf,$req,(New-Object Text.UTF8Encoding($false)))
            $op=$null;$last=''
            for($attempt=1;$attempt -le 4;$attempt++){
              $raw=& curl.exe --silent --show-error --location --request POST --header "x-api-key: $env:ASSET_KEY" --form "request=<$rf;type=application/json" --form "fileContent=@$file;type=model/gltf-binary" 'https://apis.roblox.com/assets/v1/assets'
              $last=$raw
              if($LASTEXITCODE -eq 0){try{$o=$raw|ConvertFrom-Json}catch{$o=$null};if($o -and $o.path){$op=(([string]$o.path)-replace '^operations/','');break}}
              Start-Sleep -Seconds (3*$attempt)
            }
            if($op){"$($i.k)_OP=$op"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;$accepted++;Write-Host "UPLOAD_ACCEPTED $($i.k)"}
            else{"$($i.k)_OP="|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;Write-Warning "UPLOAD_SKIPPED $($i.k) response=$last"}
          }
          if($accepted -lt 8){throw "too few uploads accepted: $accepted/11"}
          Write-Host "UPLOAD_BATCH_ACCEPTED=$accepted/11"

      - name: Wait for moderation and collect asset IDs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Poll([string]$op,[string]$k){
            if([string]::IsNullOrWhiteSpace($op)){return $null}
            for($i=0;$i -lt 300;$i++){
              $raw=& curl.exe --silent --show-error --location --header "x-api-key: $env:ASSET_KEY" "https://apis.roblox.com/assets/v1/operations/$op"
              if($LASTEXITCODE -eq 0){try{$o=$raw|ConvertFrom-Json}catch{$o=$null};if($o -and $o.done){if($o.error){Write-Warning "$k moderation failed";return $null};$id=[string]$o.response.assetId;if($id -match '^\d+$'){return $id};return $null}}
              Start-Sleep -Seconds 3
            }
            return $null
          }
          $okCount=0
          foreach($k in 'CAR01','CAR02','CAR03','CAR04','CAR05','CAR06','CAR07','CAR08','CAR09','CAR10','CAR11'){
            $op=[Environment]::GetEnvironmentVariable($k+'_OP')
            $id=Poll $op $k
            if($id){$okCount++;Write-Host "$k READY asset=$id"}else{$id='0';Write-Warning "$k NOT_READY"}
            "$($k)_ASSET=$id"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if($okCount -lt 8){throw "too few approved assets $okCount/11"}
          "APPROVED_NEW_CARS=$okCount"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Grant every AM_STUDIO car to HANGAR universe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ids=@([int64]$env:PATROL_MCLAREN_ASSET_ID,[int64]$env:PATROL_PORSCHE_ASSET_ID)
          foreach($k in 'CAR01','CAR02','CAR03','CAR04','CAR05','CAR06','CAR07','CAR08','CAR09','CAR10','CAR11'){
            $v=[Environment]::GetEnvironmentVariable($k+'_ASSET');if($v -match '^\d+$' -and [int64]$v -gt 0){$ids+=[int64]$v}
          }
          $body=@{subjectType='Universe';subjectId=$env:UNIVERSE_ID;action='Use';requests=@($ids|ForEach-Object{@{assetId=$_;grantToDependencies=$true}})}|ConvertTo-Json -Depth 8 -Compress
          Invoke-RestMethod -Method Patch -Uri 'https://apis.roblox.com/asset-permissions-api/v1/assets/permissions' -Headers @{'x-api-key'=$env:ASSET_KEY} -ContentType 'application/json' -Body $body|Out-Null
          Write-Host "UNIVERSE_USE_GRANTED count=$($ids.Count)"

      - name: Lock asset IDs into owner runtime and build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='maps/aeroclub-hangar/server/sketchfab-vehicles-v1.server.lua'
          $t=[IO.File]::ReadAllText($src)
          $markers=@{
            CAR01='HANGAR_CAR01_NISSAN_R34_BRIAN';CAR02='HANGAR_CAR02_DODGE_CHARGER_1970';CAR03='HANGAR_CAR03_TOYOTA_SUPRA_MK4';CAR04='HANGAR_CAR04_LAMBORGHINI_MURCIELAGO';CAR05='HANGAR_CAR05_MITSUBISHI_ECLIPSE_1995';CAR06='HANGAR_CAR06_HONDA_S2000';CAR07='HANGAR_CAR07_ECLIPSE_SPYDER';CAR08='HANGAR_CAR08_SUBARU_BRZ';CAR09='HANGAR_CAR09_NISSAN_SKYLINE_CWEST';CAR10='HANGAR_CAR10_CHEVY_CAMARO';CAR11='HANGAR_CAR11_DELOREAN'
          }
          foreach($k in $markers.Keys){
            $id=[Environment]::GetEnvironmentVariable($k+'_ASSET');if(-not $id){$id='0'}
            $pattern="local $($k)_ASSET_ID = \d+ -- $($markers[$k])"
            if($t -notmatch $pattern){throw "runtime marker missing $($markers[$k])"}
            $t=[regex]::Replace($t,$pattern,"local $($k)_ASSET_ID = $id -- $($markers[$k])")
          }
          [IO.File]::WriteAllText($src,$t,(New-Object Text.UTF8Encoding($false)))

          $v='maps/aeroclub-hangar/server/visual-bootstrap-v2_0.server.lua'
          $x=[IO.File]::ReadAllText($v)
          $x=[regex]::Replace($x,'local MODEL_ASSET_ID = \d+ -- HANGAR_V20_REALISM_MODEL_ASSET_ID',"local MODEL_ASSET_ID = $env:ENV_ASSET_ID -- HANGAR_V20_REALISM_MODEL_ASSET_ID")
          [IO.File]::WriteAllText($v,$x,(New-Object Text.UTF8Encoding($false)))

          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $d=Join-Path $env:RUNNER_TEMP 'rojo-hangar-v4';$z=Join-Path $env:RUNNER_TEMP 'rojo-hangar-v4.zip';New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive $z $d -Force;$e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1;if(-not $e){throw 'rojo missing'};$rojo=$e.FullName
          }
          $place=Join-Path $env:RUNNER_TEMP 'hangar-full-owner-fleet-v4.rbxlx'
          & $rojo build 'maps/aeroclub-hangar/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          $xml=[IO.File]::ReadAllText($place)
          foreach($m in @('FULL_FLEET_2_PATROL_FRONT_11_JET_FLOOR','NOSE_TO_OUTDOOR_PLUS_Z',$env:PATROL_MCLAREN_ASSET_ID,$env:PATROL_PORSCHE_ASSET_ID,$env:JET_ASSET_ID,$env:ENV_ASSET_ID)){if($xml -notmatch [regex]::Escape([string]$m)){throw "built place missing $m"}}
          "PLACE_FILE=$place"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PLACE_BYTES=$((Get-Item $place).Length)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PLACE_SHA=$((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCKED_RUNTIME=$t"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish MAIN HANGAR and restart servers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url="https://apis.roblox.com/universes/v1/$env:UNIVERSE_ID/places/$env:PLACE_ID/versions?versionType=Published"
          $version=$null;$publisher=''
          foreach($entry in @(@('AM_STUDIO',$env:ASSET_KEY),@('MASTER_V2',$env:MASTER_KEY))){
            $name=$entry[0];$key=$entry[1];if([string]::IsNullOrWhiteSpace($key)){continue}
            try{$r=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers @{'x-api-key'=$key} -ContentType 'application/xml' -InFile $env:PLACE_FILE;$version=[int](($r.Content|ConvertFrom-Json).versionNumber);$publisher=$name;if($version){break}}catch{Write-Warning "$name publish failed: $($_.Exception.Message)"}
          }
          if(-not $version){throw 'MAIN HANGAR publish failed'}
          "LIVE_VERSION=$version"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLISHER=$publisher"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $restart="https://apis.roblox.com/cloud/v2/universes/$env:UNIVERSE_ID`:restartServers"
          foreach($key in @($env:ASSET_KEY,$env:MASTER_KEY)){if([string]::IsNullOrWhiteSpace($key)){continue};try{Invoke-RestMethod -Method Post -Uri $restart -Headers @{'x-api-key'=$key} -ContentType 'application/json' -Body '{}'|Out-Null;break}catch{}}
          Write-Host "HANGAR_FULL_FLEET_LIVE version=$version publisher=$publisher approvedNewCars=$env:APPROVED_NEW_CARS"

      - name: Persist locked asset IDs and LIVE receipt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='HANGAR-FULL-FLEET-V4'}
          $src='maps/aeroclub-hangar/server/sketchfab-vehicles-v1.server.lua'
          $content=[IO.File]::ReadAllText($src)
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$src"
          $old=Invoke-RestMethod -Headers $h -Uri ($url+'?ref='+$env:GITHUB_REF_NAME)
          $body=@{message='HANGAR: lock full owner fleet v4 asset ids [skip ci]';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($content));sha=[string]$old.sha;branch=$env:GITHUB_REF_NAME}|ConvertTo-Json -Depth 5
          $put=Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $url -Body $body
          $sourceCommit=[string]$put.commit.sha

          $receipt=[ordered]@{status='LIVE_PUBLISHED';ok=$true;project='HANGAR';phase='FULL_OWNER_FLEET_V4';universeId=$env:UNIVERSE_ID;placeId=$env:PLACE_ID;sourceCommit=$sourceCommit;robloxVersion=[int]$env:LIVE_VERSION;publisher=$env:PUBLISHER;jetAssetId=[int64]$env:JET_ASSET_ID;jetOrientation='NOSE_TO_OUTDOOR_PLUS_Z';jetTargetStuds=118;patrolMcLarenAssetId=[int64]$env:PATROL_MCLAREN_ASSET_ID;patrolPorscheAssetId=[int64]$env:PATROL_PORSCHE_ASSET_ID;approvedNewCars=[int]$env:APPROVED_NEW_CARS;requestedCars=13;oversizeDodgeFF8='SKIPPED_OWNER_APPROVED_API_50MB_LIMIT';layout='2_PATROL_DONOR_FRONT_PLUS_11_JET_FLOOR';furniture='NO_TABLE_SOFA_CHAIR';danceOnCars=$true;placeBytes=[int64]$env:PLACE_BYTES;placeSha256=$env:PLACE_SHA;visualQC='PENDING_OWNER_SCREENSHOT'}
          $json=$receipt|ConvertTo-Json -Depth 8
          $path='deploy-status/hangar-live.json';$rurl="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path";$rold=$null;try{$rold=Invoke-RestMethod -Headers $h -Uri ($rurl+'?ref='+$env:GITHUB_REF_NAME)}catch{}
          $rb=@{message='HANGAR: save full fleet v4 live receipt [skip ci]';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json));branch=$env:GITHUB_REF_NAME};if($rold){$rb.sha=[string]$rold.sha};Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $rurl -Body ($rb|ConvertTo-Json -Depth 5)|Out-Null
          Write-Host "LIVE_RECEIPT_SAVED version=$env:LIVE_VERSION source=$sourceCommit"
