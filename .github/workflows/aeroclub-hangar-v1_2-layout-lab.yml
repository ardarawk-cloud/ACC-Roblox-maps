name: AeroClub Hangar v1.2 Layout LAB

on:
  push:
    branches: [aeroclub-hangar-rebuild-v1-lab]
    paths:
      - '.github/workflows/aeroclub-hangar-v1_2-layout-lab.yml'
      - 'maps/aeroclub-hangar/default.project.json'
      - 'maps/aeroclub-hangar/server/visual-bootstrap-v1_2.server.lua'
      - 'scripts/aeroclub-hangar-v1_2-glb.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeroclub-hangar-v1-2-layout-lab
  cancel-in-progress: true

env:
  LAB_UNIVERSE_ID: '10762005984'
  LAB_PLACE_ID: '124607344716828'
  LIVE_UNIVERSE_ID: '10745364913'
  LIVE_PLACE_ID: '76001567401911'
  BRANCH_LOCK: 'aeroclub-hangar-rebuild-v1-lab'

jobs:
  build-upload-publish-layout-lab:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout v1.2 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Hard block LIVE target
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF_NAME -ne $env:BRANCH_LOCK){throw "Wrong branch: $env:GITHUB_REF_NAME"}
          if($env:LAB_UNIVERSE_ID -eq $env:LIVE_UNIVERSE_ID){throw 'LAB universe equals LIVE universe'}
          if($env:LAB_PLACE_ID -eq $env:LIVE_PLACE_ID){throw 'LAB place equals LIVE place'}
          Write-Host "AEROCLUB_V12_LIVE_BLOCK_PASS lab=$env:LAB_UNIVERSE_ID/$env:LAB_PLACE_ID"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Static layout QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/aeroclub-hangar-v1_2-glb.js
          if($LASTEXITCODE -ne 0){throw 'v1.2 GLB generator syntax failed'}
          $gen=Get-Content 'scripts/aeroclub-hangar-v1_2-glb.js' -Raw
          foreach($m in @('OutdoorApronMesh','DanceFloorMesh','JetGlassAndTrimMesh','BaggageClaimMesh','CornerShopMesh','AEROCLUB_V12_GLB_OK')){if($gen -notmatch [regex]::Escape($m)){throw "Missing generator marker $m"}}
          $runtime=Get-Content 'maps/aeroclub-hangar/server/visual-bootstrap-v1_2.server.lua' -Raw
          foreach($m in @('AEROCLUB_V12_MODEL_ASSET_ID','READY_FOR_LAYOUT_SCREENSHOT','OUTDOOR_TO_GATE_TO_DANCE_TO_JET','DISABLED_FOR_LAYOUT_PASS')){if($runtime -notmatch [regex]::Escape($m)){throw "Missing runtime marker $m"}}
          $project=Get-Content 'maps/aeroclub-hangar/default.project.json' -Raw
          if($project -notmatch 'visual-bootstrap-v1_2.server.lua'){throw 'v1.2 bootstrap not mounted'}
          if($project -match 'core.server.lua'){throw 'Core systems must stay isolated during layout QC'}
          Write-Host 'AEROCLUB_V12_STATIC_QC_PASS'

      - name: Build v1.2 static GLB
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'aeroclub-hangar-v1-2.glb'
          node scripts/aeroclub-hangar-v1_2-glb.js $out
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $out)){throw 'v1.2 GLB generation failed'}
          $bytes=(Get-Item $out).Length
          if($bytes -lt 300000){throw "v1.2 GLB unexpectedly small: $bytes"}
          "AEROCLUB_GLB=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "AEROCLUB_GLB_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "AEROCLUB_GLB_SHA256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AEROCLUB_V12_GLB_PASS bytes=$bytes"

      - name: Resolve Roblox creator
        shell: powershell
        env:
          ROBLOX_ASSET_KEY: ${{ secrets.AM_STUDIO }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_ASSET_KEY)){throw 'AM_STUDIO asset key missing'}
          $candidates=@($env:LAB_UNIVERSE_ID,'8116636513','10745349805')
          $resolved=$null
          foreach($u in $candidates){
            try{
              $meta=Invoke-RestMethod -Method Get -Uri "https://games.roblox.com/v1/games?universeIds=$u"
              if(-not $meta.data -or $meta.data.Count -lt 1){continue}
              $creator=$meta.data[0].creator;$type=[string]$creator.type;$id=[string]$creator.id
              if($id -notmatch '^\d+$' -or [int64]$id -le 0){continue}
              if($type -ieq 'Group'){$field='groupId'}elseif($type -ieq 'User'){$field='userId'}else{continue}
              $resolved=[pscustomobject]@{Id=$id;Field=$field;Type=$type;Universe=$u};break
            }catch{Write-Warning "Creator probe failed universe=$u"}
          }
          if(-not $resolved){throw 'Unable to resolve valid Roblox creator'}
          "AEROCLUB_CREATOR_ID=$($resolved.Id)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "AEROCLUB_CREATOR_FIELD=$($resolved.Field)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AEROCLUB_V12_CREATOR_PASS type=$($resolved.Type) id=$($resolved.Id)"

      - name: Upload v1.2 static Model asset
        shell: powershell
        env:
          ROBLOX_ASSET_KEY: ${{ secrets.AM_STUDIO }}
        run: |
          $ErrorActionPreference='Stop'
          $creator=@{};$creator[$env:AEROCLUB_CREATOR_FIELD]=[int64]$env:AEROCLUB_CREATOR_ID
          $request=@{assetType='Model';displayName='AeroClub Hangar v1.2 Layout LAB';description='LAB-only AeroClub Hangar layout-readability full-mesh candidate.';creationContext=@{creator=$creator}}|ConvertTo-Json -Depth 8 -Compress
          $requestFile=Join-Path $env:RUNNER_TEMP 'aeroclub-v12-asset-request.json'
          [System.IO.File]::WriteAllText($requestFile,$request,(New-Object System.Text.UTF8Encoding($false)))
          try{$args=@('--silent','--show-error','--location','--request','POST','--header',"x-api-key: $env:ROBLOX_ASSET_KEY",'--form',"request=<$requestFile;type=application/json",'--form',"fileContent=@$env:AEROCLUB_GLB;type=model/gltf-binary",'https://apis.roblox.com/assets/v1/assets');$raw=& curl.exe @args}finally{Remove-Item $requestFile -Force -ErrorAction SilentlyContinue}
          if($LASTEXITCODE -ne 0){throw 'Asset upload failed'}
          try{$created=$raw|ConvertFrom-Json}catch{throw "Invalid upload response: $raw"}
          if(-not $created.path){throw "Upload rejected: $raw"}
          $operationId=([string]$created.path)-replace '^operations/','';$assetId=$null;$moderation=$null
          for($i=0;$i -lt 90;$i++){Start-Sleep -Seconds 4;$opRaw=& curl.exe --silent --show-error --location --header "x-api-key: $env:ROBLOX_ASSET_KEY" "https://apis.roblox.com/assets/v1/operations/$operationId";if($LASTEXITCODE -ne 0){continue};try{$op=$opRaw|ConvertFrom-Json}catch{continue};if($op.done){if($op.error){throw "Asset operation failed: $($op.error|ConvertTo-Json -Compress -Depth 8)"};$assetId=[string]$op.response.assetId;$moderation=[string]$op.response.moderationResult.moderationState;break}}
          if($assetId -notmatch '^\d+$' -or [int64]$assetId -le 0){throw 'No valid model asset ID'}
          "AEROCLUB_MODEL_ASSET_ID=$assetId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "AEROCLUB_MODEL_MODERATION=$moderation" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AEROCLUB_V12_UPLOAD_PASS asset=$assetId moderation=$moderation"

      - name: Inject v1.2 model into visual bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='maps/aeroclub-hangar/server/visual-bootstrap-v1_2.server.lua';$text=Get-Content $path -Raw
          $pattern='local MODEL_ASSET_ID = \d+ -- AEROCLUB_V12_MODEL_ASSET_ID'
          if($text -notmatch $pattern){throw 'v1.2 asset injection marker missing'}
          $text=[regex]::Replace($text,$pattern,"local MODEL_ASSET_ID = $env:AEROCLUB_MODEL_ASSET_ID -- AEROCLUB_V12_MODEL_ASSET_ID")
          Set-Content -Path $path -Value $text -Encoding utf8
          Write-Host "AEROCLUB_V12_ASSET_INJECT_PASS asset=$env:AEROCLUB_MODEL_ASSET_ID"

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{$d=Join-Path $env:RUNNER_TEMP 'aeroclub-v12-rojo';$z=Join-Path $env:RUNNER_TEMP 'aeroclub-v12-rojo.zip';if(Test-Path $d){Remove-Item $d -Recurse -Force};New-Item -ItemType Directory -Path $d -Force|Out-Null;Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z;Expand-Archive -Path $z -DestinationPath $d -Force;$e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1;if(-not $e){throw 'rojo.exe missing'};$rojo=$e.FullName}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build v1.2 visual LAB place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'aeroclub-hangar-v1-2-layout-lab.rbxlx'
          & $env:ROJO_EXE build 'maps/aeroclub-hangar/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 8000){throw "v1.2 place unexpectedly small: $bytes"}
          $xml=Get-Content $place -Raw
          foreach($m in @('VisualBootstrapV1_2','AeroClubVisualBootstrap','OUTDOOR_TO_GATE_TO_DANCE_TO_JET')){if($xml -notmatch [regex]::Escape($m)){throw "Built place missing marker $m"}}
          "AEROCLUB_PLACE_FILE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "AEROCLUB_PLACE_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "AEROCLUB_PLACE_SHA256=$((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AEROCLUB_V12_BUILD_PASS bytes=$bytes"

      - name: Publish TEST LAB only
        shell: powershell
        env:
          ROBLOX_PUBLISH_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_PUBLISH_KEY)){throw 'Publish key missing'}
          if($env:LAB_UNIVERSE_ID -eq $env:LIVE_UNIVERSE_ID -or $env:LAB_PLACE_ID -eq $env:LIVE_PLACE_ID){throw 'LIVE publish blocked'}
          $url="https://apis.roblox.com/universes/v1/$env:LAB_UNIVERSE_ID/places/$env:LAB_PLACE_ID/versions?versionType=Published"
          $resp=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers @{'x-api-key'=$env:ROBLOX_PUBLISH_KEY} -ContentType 'application/xml' -InFile $env:AEROCLUB_PLACE_FILE
          if([int]$resp.StatusCode -lt 200 -or [int]$resp.StatusCode -ge 300){throw "LAB publish HTTP $($resp.StatusCode)"}
          $version=[int](($resp.Content|ConvertFrom-Json).versionNumber)
          "AEROCLUB_LAB_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AEROCLUB_V12_LAB_PUBLISHED version=$version"

      - name: Persist v1.2 LAB receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=[ordered]@{status='LAB_PUBLISHED';ok=$true;liveUntouched=$true;branch=$env:GITHUB_REF_NAME;sourceCommit=$env:GITHUB_SHA;universeId=$env:LAB_UNIVERSE_ID;placeId=$env:LAB_PLACE_ID;mode='AEROCLUB_V12_LAYOUT_READABILITY';staticModelAssetId=[int64]$env:AEROCLUB_MODEL_ASSET_ID;modelModeration=$env:AEROCLUB_MODEL_MODERATION;robloxVersion=[int]$env:AEROCLUB_LAB_VERSION;glbBytes=[int64]$env:AEROCLUB_GLB_BYTES;glbSha256=$env:AEROCLUB_GLB_SHA256;placeBytes=[int64]$env:AEROCLUB_PLACE_BYTES;placeSha256=$env:AEROCLUB_PLACE_SHA256;publishRun=[int64]$env:GITHUB_RUN_ID;visualQC='PENDING_OWNER_SCREENSHOT';spawnSequence='OUTDOOR_TO_GATE_TO_DANCE_TO_JET';laserQC='DISABLED_FOR_LAYOUT_PASS';requiredQC=@('OUTDOOR_SPAWN_ORIENTATION','ZONE_READABILITY','JET_FOCAL_POINT','NO_BOX_COCKPIT','BRIGHTER_MOBILE_LIGHTING','OUTDOOR_APRON_VISIBLE','DONOR_GATE_READABLE','NO_LEGACY_ARTIFACTS')}
          $text=$receipt|ConvertTo-Json -Depth 6;$b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"));$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='AeroClub-V12-Lab'};$path='deploy-status/aeroclub-hangar-v1_2-lab.json';$enc=(($path.Split('/')|ForEach-Object{[Uri]::EscapeDataString($_)}) -join '/');$url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$enc";$sha=$null;try{$old=Invoke-RestMethod -Headers $headers -Uri ($url+'?ref='+[Uri]::EscapeDataString($env:GITHUB_REF_NAME));$sha=[string]$old.sha}catch{};$body=@{message='Record AeroClub Hangar v1.2 LAB [skip ci]';content=$b64;branch=$env:GITHUB_REF_NAME};if($sha){$body.sha=$sha};Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Uri $url -Body ($body|ConvertTo-Json -Depth 5)|Out-Null
          Write-Host "AEROCLUB_V12_RECEIPT_PASS version=$env:AEROCLUB_LAB_VERSION"
