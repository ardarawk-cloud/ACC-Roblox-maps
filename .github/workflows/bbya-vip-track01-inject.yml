name: BBYA VIP Track 01 Direct Upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-vip-track01-inject.yml'
      - 'maps/bbya-social-hub/.vip-track01-inject-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbya-vip-track01-direct-upload
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIO_KEY: ${{ secrets.AMSTUDIO_AUDIO_UPLOADER_01 }}
      BBYA_UNIVERSE: '8116636513'
      AM_STUDIO_UNIVERSE: '4187755690'
      DRIVE_FILE_ID: '1_E34wIMN6YNHyZmpyy8kybTD7bIbNDmO'
      TRACK_TITLE: 'Wonder Girls - Nobody (ROOKIE Amapiano Edit)'
      AUDIO_PATH: '/tmp/bbya-vip-track01-ready.mp3'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark direct upload runner started
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          printf '{"status":"STARTED","workflow":"BBYA VIP Track 01 Direct Upload","triggerCommit":"%s"}\n' "$GITHUB_SHA" > deploy-status/bbya-vip-track01-run.json
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-vip-track01-run.json
          if ! git diff --cached --quiet; then
            git commit -m 'Mark BBYA VIP Track 01 direct upload started [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Download and prepare exact Track 01 from Drive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet gdown
          gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O /tmp/bbya-vip-track01-source.mp3
          test -s /tmp/bbya-vip-track01-source.mp3
          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/bbya-vip-track01-source.mp3 \
            -t 410 -vn -ac 2 -ar 44100 -b:a 128k -codec:a libmp3lame \
            "${AUDIO_PATH}"
          test -s "${AUDIO_PATH}"
          ffprobe -v error -show_entries format=duration,size -of json "${AUDIO_PATH}"

      - name: Upload, grant and patch VIP
        run: python3 scripts/bbya-vip-track01-direct.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Rojo
        id: rojo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}

      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked

      - name: Build and publish BBYA Social Hub
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PUBLISH_RECEIPT_DIR: deploy-status
        shell: bash
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-vip-track01.rbxl
          test -s /tmp/bbya-vip-track01.rbxl
          PLACE_FILE_OVERRIDE=/tmp/bbya-vip-track01.rbxl node scripts/publish-map.js a-club

      - name: Mark live result
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('deploy-status/bbya-vip-track01.json')
          d=json.loads(p.read_text())
          d['status']='LIVE_PUBLISHED'
          receipt=pathlib.Path('deploy-status/a-club.json')
          if receipt.exists():
              d['publishReceipt']=json.loads(receipt.read_text())
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Persist successful source and receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            maps/bbya-social-hub/109-music-catalog-reset.server.lua \
            maps/bbya-social-hub/109-music-catalog-reset-ui.client.lua \
            maps/bbya-social-hub/110-vip-track01.server.lua \
            maps/bbya-social-hub/default.project.json \
            deploy-status/bbya-vip-track01-key.json \
            deploy-status/bbya-vip-track01.json \
            deploy-status/a-club.json
          if ! git diff --cached --quiet; then
            git commit -m 'Upload Track 01 and publish BBYA VIP [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Persist failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-vip-track01-key.json deploy-status/bbya-vip-track01.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record BBYA VIP Track 01 failure diagnostics [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
