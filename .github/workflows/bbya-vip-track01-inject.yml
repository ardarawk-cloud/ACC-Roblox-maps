name: BBYA VIP Track 01 Inject

on:
  push:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/.vip-track01-inject-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbya-vip-track01-inject
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve owned Track 01, grant both universes, and patch VIP
        env:
          AUDIO_KEY: ${{ secrets.ROBLOX_AUDIO_API_KEY }}
          AM_STUDIO_KEY: ${{ secrets.AM_STUDIO }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.parse, urllib.request, urllib.error

          ROOT=pathlib.Path('.')
          MAP=ROOT/'maps'/'bbya-social-hub'
          REPORT=ROOT/'deploy-status'/'bbya-vip-track01.json'
          AUDIO_OWNER_USER_ID='8878884630'
          BBYA_UNIVERSE='8116636513'
          AM_STUDIO_UNIVERSE='4187755690'
          TRACK_TITLE='Wonder Girls - Nobody (ROOKIE Amapiano Edit)'

          def request_json(url, method='GET', payload=None, headers=None):
              body=None if payload is None else json.dumps(payload).encode('utf-8')
              h=dict(headers or {})
              if payload is not None and 'Content-Type' not in h:
                  h['Content-Type']='application/json'
              req=urllib.request.Request(url,data=body,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace')
                      return r.status, json.loads(raw) if raw.strip() else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: data=json.loads(raw) if raw.strip() else {}
                  except Exception: data={'raw':raw[-3000:]}
                  return e.code,data

          keys=[('ROBLOX_AUDIO_API_KEY',os.environ.get('AUDIO_KEY','').strip()),('AM_STUDIO',os.environ.get('AM_STUDIO_KEY','').strip())]
          query=urllib.parse.urlencode({
              'searchCategoryType':'Audio',
              'query':'Nobody',
              'userId':AUDIO_OWNER_USER_ID,
              'maxPageSize':'100',
              'searchView':'Full',
              'sortCategory':'UpdatedTime',
              'sortDirection':'Descending',
          })
          search_url='https://apis.roblox.com/toolbox-service/v2/assets:search?'+query
          searches=[]
          result=None
          for label,key in keys:
              if not key: continue
              code,data=request_json(search_url,headers={'x-api-key':key})
              searches.append({'key':label,'http':code})
              if code==200 and isinstance(data,dict):
                  result=data;break

          def collect(o,out):
              if isinstance(o,dict):
                  aid=o.get('assetId') or o.get('id')
                  name=o.get('name') or o.get('title') or o.get('displayName')
                  if aid is not None and name:
                      out.append({'id':str(aid),'name':str(name),'raw':o})
                  for v in o.values(): collect(v,out)
              elif isinstance(o,list):
                  for v in o: collect(v,out)

          candidates=[]
          if result: collect(result,candidates)
          unique={}
          for c in candidates:
              if c['id'].isdigit(): unique[c['id']]=c
          candidates=list(unique.values())

          def norm(s):
              return re.sub(r'[^a-z0-9]+',' ',s.casefold()).strip()
          def score(name):
              n=norm(name); sc=0
              if 'nobody' in n: sc+=100
              if 'wonder girls' in n or 'wondergirls' in n: sc+=40
              if 'rookie' in n: sc+=25
              if 'amapiano' in n: sc+=25
              if n==norm(TRACK_TITLE): sc+=200
              return sc
          candidates.sort(key=lambda c:(score(c['name']),c['id']),reverse=True)
          chosen=candidates[0] if candidates and score(candidates[0]['name'])>=100 else None

          report={
              'track':TRACK_TITLE,
              'audioOwnerUserId':AUDIO_OWNER_USER_ID,
              'searchAttempts':searches,
              'candidateCount':len(candidates),
              'topCandidates':[{'id':c['id'],'name':c['name'],'score':score(c['name'])} for c in candidates[:10]],
              'chosen':({'assetId':chosen['id'],'name':chosen['name']} if chosen else None),
              'permissions':{},
              'status':'ASSET_NOT_RESOLVED',
          }
          REPORT.parent.mkdir(parents=True,exist_ok=True)
          if not chosen:
              REPORT.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
              print(json.dumps(report,ensure_ascii=False))
              raise SystemExit(2)

          asset_id=chosen['id']
          def grant(universe):
              attempts=[]
              for label,key in keys:
                  if not key: continue
                  payload={'subjectType':'Universe','subjectId':universe,'action':'Use','requests':[{'assetId':int(asset_id)}]}
                  code,data=request_json(
                      'https://apis.roblox.com/asset-permissions-api/v1/assets/permissions',
                      'PATCH',payload,
                      {'x-api-key':key,'Content-Type':'application/json-patch+json'}
                  )
                  success=[str(x) for x in (data.get('successAssetIds') or [])] if isinstance(data,dict) else []
                  attempts.append({'key':label,'http':code,'successAssetIds':success,'response':data})
                  if asset_id in success or code in (200,201,204):
                      return True,attempts
              return False,attempts

          bbya_ok,bbya_attempts=grant(BBYA_UNIVERSE)
          am_ok,am_attempts=grant(AM_STUDIO_UNIVERSE)
          report['permissions']={
              'bbya':{'universeId':BBYA_UNIVERSE,'ok':bbya_ok,'attempts':bbya_attempts},
              'amStudioCreativeLab':{'universeId':AM_STUDIO_UNIVERSE,'ok':am_ok,'attempts':am_attempts},
          }
          if not (bbya_ok and am_ok):
              report['status']='PERMISSION_FAILED'
              REPORT.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
              print(json.dumps(report,ensure_ascii=False))
              raise SystemExit(3)

          reset_path=MAP/'109-music-catalog-reset.server.lua'
          reset=reset_path.read_text(encoding='utf-8')
          reset=reset.replace(
              ' local sg=s.SoundGroup\n return sg and groups[sg.Name]~=nil or false',
              ' local sg=s.SoundGroup\n if sg and sg.Name=="BBYAVIPMaster" and ReplicatedStorage:GetAttribute("BBYAVIPTrack01Enabled")==true then return false end\n return sg and groups[sg.Name]~=nil or false'
          )
          reset=reset.replace(
              'local function scrubWorkspaceVIP()\n local vipGroup=groups.BBYAVIPMaster',
              'local function scrubWorkspaceVIP()\n if ReplicatedStorage:GetAttribute("BBYAVIPTrack01Enabled")==true then return end\n local vipGroup=groups.BBYAVIPMaster'
          )
          reset_path.write_text(reset,encoding='utf-8')

          vip_script=f'''-- BBYA SOCIAL HUB — VIP TRACK 01 AUTHORITY v1\n-- Owner-selected single-track VIP test.\nlocal ReplicatedStorage=game:GetService("ReplicatedStorage")\nlocal SoundService=game:GetService("SoundService")\n\nlocal TRACK={{title={json.dumps(TRACK_TITLE)},assetId={json.dumps(asset_id)}}}\nReplicatedStorage:SetAttribute("BBYAVIPTrack01Enabled",true)\nReplicatedStorage:SetAttribute("BBYAVIPTrack01Title",TRACK.title)\nReplicatedStorage:SetAttribute("BBYAVIPTrack01AssetId",TRACK.assetId)\n\ntask.delay(9.25,function()\n local group=SoundService:FindFirstChild("BBYAVIPMaster")\n if not group or not group:IsA("SoundGroup") then\n  group=Instance.new("SoundGroup");group.Name="BBYAVIPMaster";group.Parent=SoundService\n end\n group.Volume=.62\n group:SetAttribute("Venue","VIP")\n group:SetAttribute("BBYALocalZoneOnly",true)\n group:SetAttribute("PlaylistReady",true)\n group:SetAttribute("PlaylistCount",1)\n group:SetAttribute("MusicCatalogState","VIP_TRACK01_ACTIVE")\n\n local old=SoundService:FindFirstChild("BBYAVIPTrack01")\n if old then old:Destroy() end\n local s=Instance.new("Sound")\n s.Name="BBYAVIPTrack01"\n s.SoundId="rbxassetid://"..TRACK.assetId\n s.Volume=.72\n s.Looped=true\n s.SoundGroup=group\n s:SetAttribute("Title",TRACK.title)\n s:SetAttribute("Venue","VIP")\n s:SetAttribute("PlaylistIndex",1)\n s.Parent=SoundService\n s:Play()\n print("[BBYA] VIP Track 01 active:",TRACK.title,TRACK.assetId)\nend)\n'''
          (MAP/'110-vip-track01.server.lua').write_text(vip_script,encoding='utf-8')

          project_path=MAP/'default.project.json'
          project=json.loads(project_path.read_text(encoding='utf-8'))
          sss=project['tree']['ServerScriptService']
          sss['VIPTrack01AuthorityV1']={'$path':'110-vip-track01.server.lua'}
          project_path.write_text(json.dumps(project,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          ui_path=MAP/'109-music-catalog-reset-ui.client.lua'
          ui=ui_path.read_text(encoding='utf-8')
          marker='local function enforce()\n if not resetActive() then return end'
          if marker in ui and 'BBYAVIPTrack01Enabled' not in ui:
              ui=ui.replace(marker,'''local function enforce()\n if not resetActive() then return end''')
              ui=ui.replace(
                  ' local v=currentVenue();local spec=VENUES[v] or VENUES.NONE\n local musicFrame=playerCard.Parent',
                  ' local v=currentVenue();local spec=VENUES[v] or VENUES.NONE\n local vipActive=v=="VIP" and ReplicatedStorage:GetAttribute("BBYAVIPTrack01Enabled")==true\n local vipTitle=tostring(ReplicatedStorage:GetAttribute("BBYAVIPTrack01Title") or "VIP Track 01")\n local musicFrame=playerCard.Parent'
              )
              ui=ui.replace(
                  ' if emptyTitle then emptyTitle.Text=spec.short.." PLAYLIST • 0 TRACKS" end\n if emptySub then emptySub.Text="Playlist dikosongkan. Susun ulang lagu untuk venue ini secara terpisah." end',
                  ' if emptyTitle then emptyTitle.Text=vipActive and "VIP PLAYLIST • 1 TRACK" or (spec.short.." PLAYLIST • 0 TRACKS") end\n if emptySub then emptySub.Text=vipActive and vipTitle or "Playlist dikosongkan. Susun ulang lagu untuk venue ini secara terpisah." end'
              )
              ui=ui.replace(
                  ' panel:SetAttribute("BBYAMusicPlaylistCount",0)',
                  ' panel:SetAttribute("BBYAMusicPlaylistCount",vipActive and 1 or 0)'
              )
              ui=ui.replace(
                  ' syncPlayerCard(playerCard,spec)\n syncVenueChip(musicFrame,spec)',
                  ' syncPlayerCard(playerCard,spec)\n if vipActive then\n  for _,d in ipairs(playerCard:GetDescendants()) do\n   if d:IsA("TextLabel") and d.TextSize>=16 and string.upper(d.Text or "")~="NOW PLAYING" then d.Text=vipTitle end\n  end\n end\n syncVenueChip(musicFrame,spec)'
              )
              ui_path.write_text(ui,encoding='utf-8')

          report['status']='READY_TO_PUBLISH'
          REPORT.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'status':report['status'],'assetId':asset_id,'title':TRACK_TITLE,'bbyaPermission':bbya_ok,'amStudioPermission':am_ok},ensure_ascii=False))
          PY

      - name: Persist resolved VIP Track 01 source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add maps/bbya-social-hub/109-music-catalog-reset.server.lua maps/bbya-social-hub/109-music-catalog-reset-ui.client.lua maps/bbya-social-hub/110-vip-track01.server.lua maps/bbya-social-hub/default.project.json deploy-status/bbya-vip-track01.json
          if ! git diff --cached --quiet; then
            git commit -m 'Inject Track 01 into BBYA VIP and grant AM Studio use [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Persist failed resolution report
        if: failure()
        shell: bash
        run: |
          if [ -f deploy-status/bbya-vip-track01.json ]; then
            git config user.name 'ACC Roblox Deploy Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add deploy-status/bbya-vip-track01.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record BBYA VIP Track 01 resolution result [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Setup Node
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Rojo
        if: success()
        id: rojo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}

      - name: Install Rojo
        if: success() && steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked

      - name: Build and publish BBYA Social Hub
        if: success()
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PUBLISH_RECEIPT_DIR: deploy-status
        shell: bash
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-vip-track01.rbxl
          test -s /tmp/bbya-vip-track01.rbxl
          PLACE_FILE_OVERRIDE=/tmp/bbya-vip-track01.rbxl node scripts/publish-map.js a-club

      - name: Persist publish receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy-status/a-club.json
          cp deploy-status/a-club.json /tmp/a-club-vip-track01.json
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          cp /tmp/a-club-vip-track01.json deploy-status/a-club.json
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/a-club.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record BBYA VIP Track 01 deploy [skip ci]'
            git push origin HEAD:main
          fi
