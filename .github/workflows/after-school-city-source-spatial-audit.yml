name: After School City Cloud Source Spatial Audit

on:
  push:
    branches: [after-school-city/scaffold-v1]
    paths:
      - 'maps/after-school-city/**'
      - '.github/scripts/after-school-city-spatial-audit.ps1'
      - '.github/workflows/after-school-city-source-spatial-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/after-school-city/**'
      - '.github/scripts/after-school-city-spatial-audit.ps1'
      - '.github/workflows/after-school-city-source-spatial-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-spatial-audit:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Run source AABB and clearance audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-spatial-audit.ps1'

      - name: Upload spatial audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-spatial-audit-${{ github.sha }}
          path: spatial-audit-after-school-city.json
          if-no-files-found: error
          retention-days: 14
