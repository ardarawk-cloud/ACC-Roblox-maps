name: Publish Roblox Map

on:
  workflow_dispatch:
    inputs:
      map_id:
        description: Map ID from maps/registry.json
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'maps/**'
      - '!maps/a-club/**'
      - '!maps/bbyavatar/**'
      - '!maps/becak-e-bike/**'
      - 'scripts/**'
      - '!scripts/build-becak-ebike.js'
      - '!scripts/publish-becak-direct.js'
      - '.github/workflows/publish-map.yml'

concurrency:
  group: roblox-map-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select map targets
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.map_id }}" in
              a-club|bbyavatar|becak-e-bike)
                echo "${{ inputs.map_id }} is owned exclusively by a dedicated publisher"
                echo "maps=" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            echo "maps=${{ inputs.map_id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          TARGETS=""
          for MAP_ID in $(node -e "const r=require('./maps/registry.json'); console.log(Object.keys(r.maps).filter(k=>!['a-club','bbyavatar','becak-e-bike'].includes(k)).join(' '))"); do
            if echo "$CHANGED" | grep -q "^maps/$MAP_ID/"; then
              TARGETS="$TARGETS $MAP_ID"
            fi
          done

          if echo "$CHANGED" | grep -q '^maps/registry.json$\|^.github/workflows/publish-map.yml$'; then
            TARGETS=$(node -e "const r=require('./maps/registry.json'); console.log(Object.entries(r.maps).filter(([k,v])=>!['a-club','bbyavatar','becak-e-bike'].includes(k) && v.enabled).map(([k])=>k).join(' '))")
          fi

          echo "maps=$(echo "$TARGETS" | xargs)" >> "$GITHUB_OUTPUT"

      - name: Refuse undefined generic assemblers
        if: steps.targets.outputs.maps != ''
        shell: bash
        run: |
          echo "Generic targets requested: ${{ steps.targets.outputs.maps }}"
          echo "No generic assembler is currently defined; dedicated project pipelines own production maps."
          exit 1

      - name: Nothing to publish
        if: steps.targets.outputs.maps == ''
        run: echo "No generic target changed. Dedicated pipelines own BBYA, BBYAVATAR and BECAK E-BIKE."
