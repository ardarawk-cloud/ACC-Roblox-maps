name: Publish Roblox Map

on:
  workflow_dispatch:
    inputs:
      map_id:
        description: Map ID from maps/registry.json
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'maps/**'
      - '!maps/a-club/**'
      - 'scripts/**'
      - '.github/workflows/publish-map.yml'

concurrency:
  group: roblox-map-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select map targets
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.map_id }}" = "a-club" ]; then
              echo "BBYA a-club is owned exclusively by bbya-direct-live.yml"
              echo "maps=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "maps=${{ inputs.map_id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          TARGETS=""
          for MAP_ID in $(node -e "const r=require('./maps/registry.json'); console.log(Object.keys(r.maps).filter(k=>k!=='a-club').join(' '))"); do
            if echo "$CHANGED" | grep -q "^maps/$MAP_ID/"; then
              TARGETS="$TARGETS $MAP_ID"
            fi
          done

          if echo "$CHANGED" | grep -q '^maps/registry.json$\|^scripts/\|^.github/workflows/publish-map.yml$'; then
            TARGETS=$(node -e "const r=require('./maps/registry.json'); console.log(Object.entries(r.maps).filter(([k,v])=>k!=='a-club' && v.enabled).map(([k])=>k).join(' '))")
          fi

          echo "maps=$(echo "$TARGETS" | xargs)" >> "$GITHUB_OUTPUT"

      - name: Validate, assemble and publish changed maps
        if: steps.targets.outputs.maps != ''
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PUBLISH_RECEIPT_DIR: deploy-status
        shell: bash
        run: |
          set -euo pipefail
          for MAP_ID in ${{ steps.targets.outputs.maps }}; do
            echo "=== PRE-PUBLISH VALIDATION: $MAP_ID ==="
            node scripts/validate-bbya-build.js "$MAP_ID"
            node scripts/validate-bbya-runtime-roots.js "$MAP_ID"

            echo "=== INJECT RUNTIME: $MAP_ID ==="
            node scripts/inject-bbya.js "$MAP_ID"

            echo "=== POST-INJECTION VALIDATION: $MAP_ID ==="
            node scripts/validate-bbya-build.js "$MAP_ID" --injected

            echo "=== PUBLISH: $MAP_ID ==="
            node scripts/publish-map.js "$MAP_ID"
          done

      - name: Persist deploy receipts
        if: steps.targets.outputs.maps != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d deploy-status ]; then
            echo "No deploy receipts produced."
            exit 1
          fi

          mkdir -p /tmp/bbya-deploy-status
          cp -a deploy-status/. /tmp/bbya-deploy-status/

          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main

          mkdir -p deploy-status
          cp -a /tmp/bbya-deploy-status/. deploy-status/

          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status

          if git diff --cached --quiet; then
            echo "Deploy receipt already current."
            exit 0
          fi

          git commit -m "Record Roblox deploy receipt [skip ci]"
          git push origin HEAD:main

      - name: Nothing to publish
        if: steps.targets.outputs.maps == ''
        run: echo "No generic map target changed. BBYA uses its dedicated direct-live pipeline."
