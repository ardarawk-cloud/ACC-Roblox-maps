name: BBYA Audio Single Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'bbya/audio-single-probe-20260826'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    env:
      AUDIO_KEY: ${{ secrets.AMSTUDIO_AUDIO_UPLOADER_01 }}
      DRIVE_FILE_ID: '1-c-ZwnR34ErkQCwcr-KU8F7kwigccLed'
      DISPLAY_NAME: 'Untungnya Hidup Harus Tetap Berjalan Pop Punk Cover'
    steps:
      - name: Download one track
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url="https://drive.usercontent.google.com/download?id=$env:DRIVE_FILE_ID&export=download&confirm=t"
          & curl.exe -fL --retry 2 --connect-timeout 20 -o source.mp3 $url
          if($LASTEXITCODE -ne 0){throw "DRIVE_DOWNLOAD_FAILED_$LASTEXITCODE"}
          $size=(Get-Item source.mp3).Length
          Write-Host "SOURCE_BYTES=$size"
          if($size -lt 1000000){throw "SOURCE_TOO_SMALL_$size"}

      - name: Resolve Roblox audio creator
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:AUDIO_KEY)){throw 'AUDIO_KEY_MISSING'}
          $payload=@{apiKey=$env:AUDIO_KEY} | ConvertTo-Json -Compress
          $d=Invoke-RestMethod -Method Post -Uri 'https://apis.roblox.com/api-keys/v1/introspect' -ContentType 'application/json' -Body $payload
          $uid=[string]$d.authorizedUserId
          Write-Host "KEY_NAME=$($d.name)"
          Write-Host "AUTHORIZED_USER_ID=$uid"
          Write-Host "ENABLED=$($d.enabled) EXPIRED=$($d.expired)"
          if([string]::IsNullOrWhiteSpace($uid)){throw 'NO_AUTHORIZED_USER_ID'}
          "CREATOR_USER_ID=$uid" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exactly one audio asset to Roblox
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $req=[ordered]@{
            assetType='Audio'
            displayName=$env:DISPLAY_NAME.Substring(0,[Math]::Min(50,$env:DISPLAY_NAME.Length))
            description='BBYA one-track upload probe 2026-08-26'
            creationContext=@{creator=@{userId=[string]$env:CREATOR_USER_ID}}
          } | ConvertTo-Json -Compress -Depth 6

          $boundary='----BBYA'+[Guid]::NewGuid().ToString('N')
          $ms=New-Object System.IO.MemoryStream
          function Write-Utf8([string]$s){
            $b=[Text.Encoding]::UTF8.GetBytes($s)
            $ms.Write($b,0,$b.Length)
          }
          Write-Utf8 ("--$boundary`r`nContent-Disposition: form-data; name=`"request`"`r`n`r`n$req`r`n")
          Write-Utf8 ("--$boundary`r`nContent-Disposition: form-data; name=`"fileContent`"; filename=`"source.mp3`"`r`nContent-Type: audio/mpeg`r`n`r`n")
          $audio=[IO.File]::ReadAllBytes((Resolve-Path 'source.mp3'))
          $ms.Write($audio,0,$audio.Length)
          Write-Utf8 ("`r`n--$boundary--`r`n")
          $multipart=$ms.ToArray()
          $ms.Dispose()

          $http=0
          $body=''
          try {
            $r=Invoke-WebRequest -UseBasicParsing -Method Post -Uri 'https://apis.roblox.com/assets/v1/assets' -Headers @{'x-api-key'=$env:AUDIO_KEY} -ContentType "multipart/form-data; boundary=$boundary" -Body $multipart
            $http=[int]$r.StatusCode
            $body=[string]$r.Content
          } catch {
            if($_.Exception.Response){
              $http=[int]$_.Exception.Response.StatusCode
              try {
                $reader=New-Object IO.StreamReader($_.Exception.Response.GetResponseStream())
                $body=$reader.ReadToEnd()
                $reader.Dispose()
              } catch {}
            }
            if([string]::IsNullOrWhiteSpace($body)){try{$body=[string]$_.ErrorDetails.Message}catch{}}
          }
          Write-Host "ROBLOX_UPLOAD_HTTP=$http"
          Write-Host $body
          Add-Content $env:GITHUB_STEP_SUMMARY "### BBYA Audio Single Probe"
          Add-Content $env:GITHUB_STEP_SUMMARY "- HTTP: $http"
          Add-Content $env:GITHUB_STEP_SUMMARY '```json'
          Add-Content $env:GITHUB_STEP_SUMMARY $body
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          if(($http -lt 200) -or ($http -ge 300)){throw "ROBLOX_UPLOAD_FAILED_HTTP_$http"}
