name: BBYA Audio Asset Status

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  status:
    if: github.head_ref == 'bbya/audio-single-probe-20260826'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      AUDIO_KEY: ${{ secrets.ROBLOX_AUDIO_API_KEY }}
      ASSET_ID: '134928414278364'
      OPERATION_ID: '8e9af8d0-607f-43d1-8d77-1879665d3ab7'
    steps:
      - name: Read current asset status only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{'x-api-key'=$env:AUDIO_KEY}
          $op=Invoke-RestMethod -Method Get -Uri "https://apis.roblox.com/assets/v1/operations/$env:OPERATION_ID" -Headers $headers
          Write-Host 'OPERATION:'
          Write-Host ($op | ConvertTo-Json -Depth 20)
          try {
            $meta=Invoke-RestMethod -Method Get -Uri "https://apis.roblox.com/assets/v1/assets/$env:ASSET_ID" -Headers $headers
            Write-Host 'ASSET_METADATA:'
            Write-Host ($meta | ConvertTo-Json -Depth 20)
          } catch {
            Write-Host "ASSET_GET_HTTP_ERROR=$($_.Exception.Message)"
          }
