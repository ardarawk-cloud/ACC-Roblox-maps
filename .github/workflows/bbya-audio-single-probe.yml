name: BBYA Audio Single Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'bbya/audio-single-probe-20260826'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    env:
      AUDIO_KEY: ${{ secrets.AMSTUDIO_AUDIO_UPLOADER_01 }}
      DRIVE_FILE_ID: '1-c-ZwnR34ErkQCwcr-KU8F7kwigccLed'
      DISPLAY_NAME: 'Untungnya Hidup Harus Tetap Berjalan Pop Punk Cover'
    steps:
      - name: Download one track
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --quiet gdown==6.1.0
          python -m gdown "https://drive.google.com/uc?id=$env:DRIVE_FILE_ID" -O source.mp3 --quiet
          $size=(Get-Item source.mp3).Length
          Write-Host "SOURCE_BYTES=$size"
          if($size -lt 1000){throw 'SOURCE_TOO_SMALL'}

      - name: Resolve Roblox audio creator
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:AUDIO_KEY)){throw 'AUDIO_KEY_MISSING'}
          $payload=@{apiKey=$env:AUDIO_KEY} | ConvertTo-Json -Compress
          $d=Invoke-RestMethod -Method Post -Uri 'https://apis.roblox.com/api-keys/v1/introspect' -ContentType 'application/json' -Body $payload
          $uid=[string]$d.authorizedUserId
          Write-Host "KEY_NAME=$($d.name)"
          Write-Host "AUTHORIZED_USER_ID=$uid"
          Write-Host "ENABLED=$($d.enabled) EXPIRED=$($d.expired)"
          if([string]::IsNullOrWhiteSpace($uid)){throw 'NO_AUTHORIZED_USER_ID'}
          "CREATOR_USER_ID=$uid" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exactly one audio asset to Roblox
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $req=[ordered]@{
            assetType='Audio'
            displayName=$env:DISPLAY_NAME.Substring(0,[Math]::Min(50,$env:DISPLAY_NAME.Length))
            description='BBYA one-track upload probe 2026-08-26'
            creationContext=@{creator=@{userId=[string]$env:CREATOR_USER_ID}}
          } | ConvertTo-Json -Compress -Depth 6
          $req | Set-Content request.json -Encoding utf8
          $args=@(
            '-sS','--location','https://apis.roblox.com/assets/v1/assets',
            '--header',"x-api-key: $env:AUDIO_KEY",
            '--form-string',"request=$req",
            '--form','fileContent=@source.mp3;type=audio/mpeg',
            '--output','upload-response.json',
            '--write-out','%{http_code}'
          )
          $http=& curl.exe @args
          Write-Host "ROBLOX_UPLOAD_HTTP=$http"
          $body=Get-Content upload-response.json -Raw
          Write-Host $body
          Add-Content $env:GITHUB_STEP_SUMMARY "### BBYA Audio Single Probe"
          Add-Content $env:GITHUB_STEP_SUMMARY "- HTTP: $http"
          Add-Content $env:GITHUB_STEP_SUMMARY '```json'
          Add-Content $env:GITHUB_STEP_SUMMARY $body
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          if(([int]$http -lt 200) -or ([int]$http -ge 300)){throw "ROBLOX_UPLOAD_FAILED_HTTP_$http"}
