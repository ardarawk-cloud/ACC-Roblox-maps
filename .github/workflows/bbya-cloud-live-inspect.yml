name: BBYA Open Cloud Live Inspector

# mainclub authority inspect trigger: 2026-08-23
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-cloud-live-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
      UNIVERSE_ID: '8116636513'
      PLACE_ID: '131894120482837'
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published Main Club scripts through Open Cloud Instance API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          key=os.environ.get('ROBLOX_API_KEY','');U=os.environ['UNIVERSE_ID'];P=os.environ['PLACE_ID']
          out={'universeId':U,'placeId':P,'api':'Open Cloud Instance API','ok':False,'serverScriptService':[],'targets':{},'errors':[]}
          headers={'x-api-key':key,'Accept':'application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status,json.loads(r.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')[:4000]
                  try:data=json.loads(body)
                  except:data={'raw':body}
                  return e.code,data
          def poll(op):
              path=op.get('path') if isinstance(op,dict) else None
              if not path:return op
              last={}
              for _ in range(15):
                  st,last=get('https://apis.roblox.com/cloud/v2/'+path)
                  if st>=400:return {'http':st,'error':last}
                  if last.get('done'):return last
                  time.sleep(.7)
              return {'error':'operation timeout','last':last}
          def children(iid):
              st,data=get(f'https://apis.roblox.com/cloud/v2/universes/{U}/places/{P}/instances/{iid}:listChildren')
              if st>=400:return st,[],data
              done=poll(data);return st,((done.get('response') or {}).get('instances') or []),done
          def instance(iid):
              st,data=get(f'https://apis.roblox.com/cloud/v2/universes/{U}/places/{P}/instances/{iid}')
              if st>=400:return st,data
              done=poll(data);return st,(done.get('response') or done)
          def source_from(details):
              if not isinstance(details,dict):return ''
              for k in ('Source','source'):
                  if isinstance(details.get(k),str):return details[k]
              for v in details.values():
                  if isinstance(v,dict):
                      s=source_from(v)
                      if s:return s
              return ''
          st,root,raw=children('root')
          if st>=400:
              out['errors'].append({'stage':'root','http':st,'body':raw})
          else:
              sss=next((r for r in root if (r.get('engineInstance') or {}).get('Name')=='ServerScriptService'),None)
              if not sss:
                  out['errors'].append({'stage':'find','name':'ServerScriptService'})
              else:
                  st2,scripts,raw2=children(sss['engineInstance']['Id'])
                  out['server_http']=st2
                  wanted={'PhotoStudioLightingUpgrade','ClubPurityMallStudiosV1','MainClubInteractionCleanupV1','LookLabAvatarEditorV1','MainClubRealism','Floor1FrontPremium','Floor1LuxuryFinish','Floor1UltraPremium'}
                  for r in scripts:
                      e=r.get('engineInstance') or {};name=e.get('Name');iid=e.get('Id')
                      out['serverScriptService'].append({'name':name,'id':iid,'hasChildren':r.get('hasChildren')})
                      if name not in wanted:continue
                      st3,inst=instance(iid)
                      eng=(inst.get('engineInstance') or inst) if isinstance(inst,dict) else {}
                      source=source_from(eng.get('Details') or {})
                      hits=[]
                      for n,line in enumerate(source.splitlines(),1):
                          if any(tok in line for tok in ['MAIN CLUB FINAL AUTHORITY','purgeLegacy','PhotoAreaPremium','SalonLookStudioPremium','RearSocialRail','DJBoothGroundedBase','PureClubFrontExtension','GLOW LAB','Tenant_glow']):
                              hits.append({'line':n,'text':line.strip()[:300]})
                      out['targets'][name]={'http':st3,'id':iid,'sourceAvailable':bool(source),'sourceLength':len(source),'sourceHits':hits[:80]}
                  out['ok']=not out['errors'] and 'PhotoStudioLightingUpgrade' in out['targets'] and 'ClubPurityMallStudiosV1' in out['targets']
          os.makedirs('deploy-status',exist_ok=True)
          open('deploy-status/bbya-cloud-live-inspect.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Persist cloud inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ACC Roblox Cloud Inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-cloud-live-inspect.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record BBYA Open Cloud live inspection [skip ci]'
            git push origin HEAD:main
          fi
