name: BBYA TalonTheAngel BBYA Moderation Recheck

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  check:
    if: github.event.issue.title == 'BBYA TALONTHEANGEL BBYA MODERATION RECHECK'
    runs-on: ubuntu-latest
    env:
      AUDIO_KEY: ${{ secrets.TALONTHEANGEL_AUDIO_PUBLISHER }}
    steps:
      - name: Read moderation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          key=os.environ["AUDIO_KEY"]
          aid="121061545685176"
          r=urllib.request.Request(
              f"https://apis.roblox.com/assets/v1/assets/{aid}?readMask=moderationResult,state,displayName",
              headers={"x-api-key":key}
          )
          with urllib.request.urlopen(r,timeout=30) as x:
              b=json.loads(x.read().decode() or "{}")
          print(json.dumps({
              "assetId":aid,
              "displayName":b.get("displayName"),
              "moderationState":(b.get("moderationResult") or {}).get("moderationState","")
          }),flush=True)
          PY
