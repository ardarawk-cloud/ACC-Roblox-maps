name: HANGAR Drive Showcase Fleet Rocket LIVE

on:
  push:
    branches: [aeroclub-hangar-rebuild-v1-lab]
    paths:
      - '.github/workflows/hangar-sketchfab-vehicles-v3-resume-live.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hangar-drive-showcase-fleet-rocket-live
  cancel-in-progress: false

env:
  LIVE_UNIVERSE_ID: '10745364913'
  LIVE_PLACE_ID: '76001567401911'
  ROCKET_USERNAME: 'rocket_racoon111'
  STABLE_ENV_ASSET_ID: '76797254008026'
  JET_ASSET_FIXED: '135410789803386'

  CAR01_DRIVE_ID: '1jqtOcoijz1Qp4T2M12ZWEjTIyKPD7J7R'
  CAR02_DRIVE_ID: '1K7NNquy3EapuqeyYrKZ2Ni09F7YleIpM'
  CAR03_DRIVE_ID: '1DJk0UyAXlYM-uxh2r62zUSXmMUcR0pfU'
  CAR04_DRIVE_ID: '1jNz6HFW7zOU0qNYZ47N-LrrLXmUhV-kz'
  CAR05_DRIVE_ID: '1I-o5DElsbimj-bjP5kgdidrZu-zOreoz'
  CAR06_DRIVE_ID: '1uuiXGUbYhqMrAAll28CVJYDcKDg36kFx'
  CAR07_DRIVE_ID: '1kQBu4JSTye_qhPzB5GP1CXihFBq9k-NV'
  CAR08_DRIVE_ID: '1kxyEPKjCw7GwHrmGBLV01R0B14CPT3SZ'
  CAR09_DRIVE_ID: '1u5ZKaHSMxaBLMoY1xLnMDxZDoIxS8_T9'
  CAR10_DRIVE_ID: '1xVA8-L-38kIInq0p82DRQLhbVAZrc2rz'

jobs:
  upload-build-publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90
    env:
      ROBLOX_ROCKET_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH || secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      ROBLOX_MASTER_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify showcase fleet authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=[IO.File]::ReadAllText('maps/aeroclub-hangar/server/sketchfab-vehicles-v1.server.lua')
          foreach($m in @('SHOWCASE FLEET v2.0','DONOR_FRONT_6_PLUS_JET_FLOOR_4','HANGAR_SHOWCASE_CAR01_ASSET_ID','HANGAR_SHOWCASE_CAR10_ASSET_ID')){
            if($src -notmatch [regex]::Escape($m)){throw "missing runtime marker $m"}
          }
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_ROCKET_KEY)){throw 'RocketRacoon Roblox key unavailable'}
          Write-Host 'HANGAR_SHOWCASE_FLEET_AUTHORITY_PASS'

      - name: Resolve RocketRacoon creator
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $body=@{usernames=@($env:ROCKET_USERNAME);excludeBannedUsers=$false}|ConvertTo-Json -Compress
          $r=Invoke-RestMethod -Method Post -Uri 'https://users.roblox.com/v1/usernames/users' -ContentType 'application/json' -Body $body
          if(-not $r.data -or $r.data.Count -lt 1){throw "RocketRacoon username not found: $env:ROCKET_USERNAME"}
          $id=[string]$r.data[0].id
          if($id -notmatch '^\d+$' -or [int64]$id -le 0){throw "invalid RocketRacoon user id: $id"}
          "ROCKET_USER_ID=$id"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ROCKET_RACOON_CREATOR_OK username=$($r.data[0].name) id=$id"

      - name: Download all ten GLB cars from owner Drive
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'hangar-showcase-fleet'
          if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
          New-Item -ItemType Directory -Path $dir -Force|Out-Null

          function GetGlb([string]$Label,[string]$Id){
            $out=Join-Path $dir ($Label.ToLowerInvariant()+'.glb')
            Invoke-WebRequest -UseBasicParsing -Uri "https://drive.usercontent.google.com/download?id=$Id&export=download&confirm=t" -OutFile $out -MaximumRedirection 12
            $bytes=[IO.File]::ReadAllBytes($out)
            if($bytes.Length -lt 100000 -or [Text.Encoding]::ASCII.GetString($bytes,0,4) -ne 'glTF'){throw "invalid GLB $Label id=$Id"}
            $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "GLB_OK label=$Label id=$Id bytes=$($bytes.Length) sha256=$sha"
            "$($Label)_GLB=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }

          1..10 | ForEach-Object {
            $label=('CAR{0:D2}' -f $_)
            $id=[Environment]::GetEnvironmentVariable($label+'_DRIVE_ID')
            if([string]::IsNullOrWhiteSpace($id)){throw "Drive id missing for $label"}
            GetGlb $label $id
          }

      - name: Upload ten showcase cars as RocketRacoon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'

          $names=@{
            CAR01='HANGAR Nissan R34 Brian'
            CAR02='HANGAR Dodge Charger RT 1970'
            CAR03='HANGAR Toyota Supra MK IV'
            CAR04='HANGAR Lamborghini Murcielago'
            CAR05='HANGAR Mitsubishi Eclipse 1995'
            CAR06='HANGAR Honda S2000'
            CAR07='HANGAR Mitsubishi Eclipse Spyder'
            CAR08='HANGAR Subaru BRZ Rocket Bunny'
            CAR09='HANGAR Nissan Skyline R34 C-West'
            CAR10='HANGAR Dodge Charger FF8'
          }

          function StartUpload([string]$File,[string]$Name){
            $request=@{assetType='Model';displayName=$Name;description='Owner-supplied HANGAR showcase vehicle model.';creationContext=@{creator=@{userId=[int64]$env:ROCKET_USER_ID}}}|ConvertTo-Json -Depth 8 -Compress
            $rf=Join-Path $env:RUNNER_TEMP ("fleet-req-"+[guid]::NewGuid().ToString('N')+'.json')
            [IO.File]::WriteAllText($rf,$request,(New-Object Text.UTF8Encoding($false)))
            try{
              for($attempt=1;$attempt -le 6;$attempt++){
                $raw=& curl.exe --silent --show-error --location --request POST --header "x-api-key: $env:ROBLOX_ROCKET_KEY" --form "request=<$rf;type=application/json" --form "fileContent=@$File;type=model/gltf-binary" 'https://apis.roblox.com/assets/v1/assets'
                if($LASTEXITCODE -eq 0){
                  try{$created=$raw|ConvertFrom-Json}catch{$created=$null}
                  if($created -and $created.path){
                    return (([string]$created.path)-replace '^operations/','')
                  }
                  if($raw -match 'User is moderated'){throw "Roblox rejected $Name : User is moderated"}
                }
                if($attempt -lt 6){Start-Sleep -Seconds (4*$attempt)}
              }
              throw "upload rejected $Name : $raw"
            } finally {
              Remove-Item $rf -Force -ErrorAction SilentlyContinue
            }
          }

          foreach($i in 1..10){
            $label=('CAR{0:D2}' -f $i)
            $file=[Environment]::GetEnvironmentVariable($label+'_GLB')
            if(-not(Test-Path $file)){throw "GLB path missing for $label"}
            $op=StartUpload $file $names[$label]
            "$($label)_OP=$op"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "UPLOAD_ACCEPTED label=$label operation=$op name=$($names[$label])"
            Start-Sleep -Seconds 2
          }

      - name: Wait for all showcase assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'

          function Probe([string]$Op,[string]$Label){
            $raw=& curl.exe --silent --show-error --location --header "x-api-key: $env:ROBLOX_ROCKET_KEY" "https://apis.roblox.com/assets/v1/operations/$Op"
            if($LASTEXITCODE -ne 0){return $null}
            try{$o=$raw|ConvertFrom-Json}catch{return $null}
            if(-not $o.done){return $null}
            if($o.error){throw "$Label failed: $($o.error|ConvertTo-Json -Compress -Depth 8)"}
            $id=[string]$o.response.assetId
            if($id -notmatch '^\d+$'){throw "$Label completed without assetId"}
            Write-Host "$Label READY asset=$id moderation=$($o.response.moderationResult.moderationState)"
            return $id
          }

          $ids=@{}
          for($poll=0;$poll -lt 1200;$poll++){
            foreach($i in 1..10){
              $label=('CAR{0:D2}' -f $i)
              if(-not $ids.ContainsKey($label)){
                $op=[Environment]::GetEnvironmentVariable($label+'_OP')
                $id=Probe $op $label
                if($id){$ids[$label]=$id}
              }
            }
            if($ids.Count -eq 10){break}
            Start-Sleep -Seconds 3
          }
          if($ids.Count -ne 10){throw "asset moderation timeout approved=$($ids.Count)/10"}
          foreach($i in 1..10){
            $label=('CAR{0:D2}' -f $i)
            "$($label)_ASSET=$($ids[$label])"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Best effort HANGAR universe asset permission
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $ids=@()
          foreach($i in 1..10){$label=('CAR{0:D2}' -f $i);$ids += [int64][Environment]::GetEnvironmentVariable($label+'_ASSET')}
          $body=@{subjectType='Universe';subjectId=$env:LIVE_UNIVERSE_ID;action='Use';requests=@($ids|ForEach-Object{@{assetId=$_;grantToDependencies=$true}})}|ConvertTo-Json -Depth 8 -Compress
          $url='https://apis.roblox.com/asset-permissions-api/v1/assets/permissions'
          $r=Invoke-RestMethod -Method Patch -Uri $url -Headers @{'x-api-key'=$env:ROBLOX_ROCKET_KEY} -ContentType 'application/json' -Body $body
          Write-Host "HANGAR_FLEET_PERMISSION_RESULT $($r|ConvertTo-Json -Compress -Depth 8)"

      - name: Lock fleet assets into HANGAR runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='maps/aeroclub-hangar/server/sketchfab-vehicles-v1.server.lua'
          $text=[IO.File]::ReadAllText($path)
          foreach($i in 1..10){
            $label=('CAR{0:D2}' -f $i)
            $asset=[Environment]::GetEnvironmentVariable($label+'_ASSET')
            $marker='HANGAR_SHOWCASE_'+$label+'_ASSET_ID'
            $pattern="local $($label)_ASSET_ID = \d+ -- $marker"
            if($text -notmatch $pattern){throw "runtime marker missing $marker"}
            $text=[regex]::Replace($text,$pattern,"local $($label)_ASSET_ID = $asset -- $marker")
          }
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))

          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='HANGAR-SHOWCASE-FLEET'}
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path"
          $old=Invoke-RestMethod -Headers $h -Uri ($url+'?ref='+$env:GITHUB_REF_NAME)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $body=@{message='HANGAR: lock 10-car Drive showcase fleet [skip ci]';content=$b64;sha=[string]$old.sha;branch=$env:GITHUB_REF_NAME}|ConvertTo-Json -Depth 5
          $put=Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $url -Body $body
          $source=[string]$put.commit.sha
          "CANONICAL_SOURCE=$source"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_FLEET_ASSET_LOCK_PASS source=$source"

      - name: Build HANGAR showcase fleet
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='maps/aeroclub-hangar/server/visual-bootstrap-v2_0.server.lua'
          $text=[IO.File]::ReadAllText($path)
          $pattern='local MODEL_ASSET_ID = \d+ -- HANGAR_V20_REALISM_MODEL_ASSET_ID'
          if($text -notmatch $pattern){throw 'environment marker missing'}
          $text=[regex]::Replace($text,$pattern,"local MODEL_ASSET_ID = $env:STABLE_ENV_ASSET_ID -- HANGAR_V20_REALISM_MODEL_ASSET_ID")
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))

          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $d=Join-Path $env:RUNNER_TEMP 'rojo-fleet';$z=Join-Path $env:RUNNER_TEMP 'rojo-fleet.zip'
            New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive $z $d -Force
            $e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1
            if(-not $e){throw 'rojo missing'}
            $rojo=$e.FullName
          }

          $place=Join-Path $env:RUNNER_TEMP 'hangar-showcase-fleet.rbxlx'
          & $rojo build 'maps/aeroclub-hangar/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          $xml=[IO.File]::ReadAllText($place)
          foreach($m in @('HangarSketchfabVehiclesV1','SHOWCASE FLEET v2.0','DONOR_FRONT_6_PLUS_JET_FLOOR_4',$env:JET_ASSET_FIXED,$env:STABLE_ENV_ASSET_ID)){
            if($xml -notmatch [regex]::Escape([string]$m)){throw "built place missing $m"}
          }
          foreach($i in 1..10){
            $label=('CAR{0:D2}' -f $i);$asset=[Environment]::GetEnvironmentVariable($label+'_ASSET')
            if($xml -notmatch [regex]::Escape([string]$asset)){throw "built place missing $label asset=$asset"}
          }
          "PLACE_FILE=$place"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PLACE_BYTES=$((Get-Item $place).Length)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PLACE_SHA=$((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_SHOWCASE_FLEET_BUILD_PASS bytes=$((Get-Item $place).Length)"

      - name: Publish MAIN HANGAR and restart servers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url="https://apis.roblox.com/universes/v1/$env:LIVE_UNIVERSE_ID/places/$env:LIVE_PLACE_ID/versions?versionType=Published"
          $version=$null
          foreach($key in @($env:ROBLOX_ROCKET_KEY,$env:ROBLOX_MASTER_KEY)){
            if([string]::IsNullOrWhiteSpace($key)){continue}
            try{
              $r=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers @{'x-api-key'=$key} -ContentType 'application/xml' -InFile $env:PLACE_FILE
              $version=[int](($r.Content|ConvertFrom-Json).versionNumber)
              if($version){break}
            }catch{Write-Warning $_.Exception.Message}
          }
          if(-not $version){throw 'MAIN HANGAR publish failed'}
          "LIVE_VERSION=$version"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $restart="https://apis.roblox.com/cloud/v2/universes/$env:LIVE_UNIVERSE_ID`:restartServers"
          $restarted=$false
          foreach($key in @($env:ROBLOX_ROCKET_KEY,$env:ROBLOX_MASTER_KEY)){
            if([string]::IsNullOrWhiteSpace($key)){continue}
            try{Invoke-WebRequest -UseBasicParsing -Method Post -Uri $restart -Headers @{'x-api-key'=$key} -ContentType 'application/json' -Body '{}'|Out-Null;$restarted=$true;break}catch{Write-Warning $_.Exception.Message}
          }
          if(-not $restarted){throw 'server restart failed'}
          Write-Host "HANGAR_SHOWCASE_FLEET_LIVE version=$version"

      - name: Save LIVE receipt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $assets=[ordered]@{}
          foreach($i in 1..10){$label=('CAR{0:D2}' -f $i);$assets[$label]=[int64][Environment]::GetEnvironmentVariable($label+'_ASSET')}
          $obj=[ordered]@{
            status='LIVE_PUBLISHED';ok=$true;project='HANGAR';phase='DRIVE_SHOWCASE_FLEET_V2';
            universeId=$env:LIVE_UNIVERSE_ID;placeId=$env:LIVE_PLACE_ID;sourceCommit=$env:CANONICAL_SOURCE;
            robloxVersion=[int]$env:LIVE_VERSION;assetOwnerUsername=$env:ROCKET_USERNAME;assetOwnerUserId=[int64]$env:ROCKET_USER_ID;
            jetAssetId=[int64]$env:JET_ASSET_FIXED;carAssets=$assets;realCarCount=10;realVehicleCount=11;
            layout='DONOR_FRONT_6_PLUS_JET_FLOOR_4';environmentAssetId=[int64]$env:STABLE_ENV_ASSET_ID;
            placeBytes=[int64]$env:PLACE_BYTES;placeSha256=$env:PLACE_SHA;serversRestarted=$true;visualQC='PENDING_OWNER_SCREENSHOT'
          }
          $text=$obj|ConvertTo-Json -Depth 10
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"))
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='HANGAR-SHOWCASE-FLEET'}
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/hangar-live.json"
          $old=Invoke-RestMethod -Headers $h -Uri ($url+'?ref='+$env:GITHUB_REF_NAME)
          $body=@{message='Record HANGAR 10-car showcase fleet LIVE [skip ci]';content=$b64;sha=[string]$old.sha;branch=$env:GITHUB_REF_NAME}|ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $url -Body $body|Out-Null
