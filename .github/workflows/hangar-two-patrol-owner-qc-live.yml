name: HANGAR Two Patrol Owner QC LIVE
on:
  push:
    branches: [aeroclub-hangar-rebuild-v1-lab]
    paths: ['.github/workflows/hangar-two-patrol-owner-qc-live.yml']
  workflow_dispatch:

jobs:
  publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 25
    env:
      ASSET_KEY: ${{ secrets.AM_STUDIO }}
      MASTER_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      UNIVERSE_ID: '10745364913'
      PLACE_ID: '76001567401911'
      ENV_ASSET_ID: '76797254008026'
      MCLAREN_ASSET_ID: '128438812070025'
      PORSCHE_ASSET_ID: '108398505977253'
    steps:
      - uses: actions/checkout@v4

      - name: Grant patrol assets to HANGAR universe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ASSET_KEY)){throw 'AM_STUDIO asset key missing'}
          $ids=@([int64]$env:MCLAREN_ASSET_ID,[int64]$env:PORSCHE_ASSET_ID)
          $body=@{
            subjectType='Universe'
            subjectId=$env:UNIVERSE_ID
            action='Use'
            requests=@($ids|ForEach-Object{@{assetId=$_;grantToDependencies=$true}})
          }|ConvertTo-Json -Depth 8 -Compress
          Invoke-RestMethod -Method Patch -Uri 'https://apis.roblox.com/asset-permissions-api/v1/assets/permissions' -Headers @{'x-api-key'=$env:ASSET_KEY} -ContentType 'application/json' -Body $body|Out-Null
          Write-Host "HANGAR_PATROL_USE_GRANTED mclaren=$env:MCLAREN_ASSET_ID porsche=$env:PORSCHE_ASSET_ID universe=$env:UNIVERSE_ID"

      - name: Build two patrol HANGAR
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='maps/aeroclub-hangar/server/sketchfab-vehicles-v1.server.lua'
          $t=[IO.File]::ReadAllText($src)
          foreach($needle in @($env:MCLAREN_ASSET_ID,$env:PORSCHE_ASSET_ID,'PATROL_FRONT_2_ONLY','HangarJetTargetStuds')){
            if($t -notmatch [regex]::Escape([string]$needle)){throw "runtime missing $needle"}
          }
          $v='maps/aeroclub-hangar/server/visual-bootstrap-v2_0.server.lua'
          $x=[IO.File]::ReadAllText($v)
          $x=[regex]::Replace($x,'local MODEL_ASSET_ID = \d+ -- HANGAR_V20_REALISM_MODEL_ASSET_ID',"local MODEL_ASSET_ID = $env:ENV_ASSET_ID -- HANGAR_V20_REALISM_MODEL_ASSET_ID")
          [IO.File]::WriteAllText($v,$x,(New-Object Text.UTF8Encoding($false)))

          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'rojo-hangar-fast'
            $zip=Join-Path $env:RUNNER_TEMP 'rojo-hangar-fast.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive $zip $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse|Select-Object -First 1
            if(-not $exe){throw 'rojo download failed'}
            $rojo=$exe.FullName
          }

          $place=Join-Path $env:RUNNER_TEMP 'hangar-two-patrol.rbxlx'
          & $rojo build 'maps/aeroclub-hangar/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'rojo build failed'}
          $xml=[IO.File]::ReadAllText($place)
          foreach($needle in @($env:MCLAREN_ASSET_ID,$env:PORSCHE_ASSET_ID,$env:ENV_ASSET_ID,'PATROL_FRONT_2_ONLY')){
            if($xml -notmatch [regex]::Escape([string]$needle)){throw "built place missing $needle"}
          }
          "PLACE_FILE=$place"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish MAIN HANGAR
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url="https://apis.roblox.com/universes/v1/$env:UNIVERSE_ID/places/$env:PLACE_ID/versions?versionType=Published"
          $version=$null;$publisher=''
          foreach($entry in @(@('AM_STUDIO',$env:ASSET_KEY),@('MASTER_V2',$env:MASTER_KEY))){
            $name=$entry[0];$key=$entry[1]
            if([string]::IsNullOrWhiteSpace($key)){continue}
            try{
              $r=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers @{'x-api-key'=$key} -ContentType 'application/xml' -InFile $env:PLACE_FILE
              $version=[int](($r.Content|ConvertFrom-Json).versionNumber);$publisher=$name
              if($version){break}
            }catch{Write-Warning "$name publish failed: $($_.Exception.Message)"}
          }
          if(-not $version){throw 'publish failed'}
          Write-Host "HANGAR_TWO_PATROL_LIVE version=$version publisher=$publisher"
          $restart="https://apis.roblox.com/cloud/v2/universes/$env:UNIVERSE_ID`:restartServers"
          foreach($key in @($env:ASSET_KEY,$env:MASTER_KEY)){
            if([string]::IsNullOrWhiteSpace($key)){continue}
            try{Invoke-RestMethod -Method Post -Uri $restart -Headers @{'x-api-key'=$key} -ContentType 'application/json' -Body '{}'|Out-Null;break}catch{}
          }
