name: BBYA Actions Inspect Issue

on:
  push:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/.actions-inspect-issue-trigger'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest VIP extra batch run and open diagnostic issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/workflows/bbya-vip-extra-folder-batch.yml/runs?per_page=10")
          run_id=$(echo "$runs" | jq -r '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            body='No VIP extra batch run found.'
          else
            jobs=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs/$run_id/jobs?per_page=100")
            summary=$(echo "$jobs" | jq -r '[.jobs[] | .name as $j | .steps[] | select(.conclusion=="failure") | "job="+$j+" step="+.name] | if length==0 then "No failed step returned" else join("\n") end')
            run_url=$(echo "$runs" | jq -r '.workflow_runs[0].html_url // ""')
            conclusion=$(echo "$runs" | jq -r '.workflow_runs[0].conclusion // ""')
            body=$(printf 'run_id=%s\nconclusion=%s\nurl=%s\nfailed_steps:\n%s\n' "$run_id" "$conclusion" "$run_url" "$summary")
          fi
          payload=$(jq -n --arg title "BBYA VIP batch diagnostic" --arg body "$body" '{title:$title,body:$body}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "https://api.github.com/repos/$REPO/issues" -d "$payload" >/dev/null
