name: BBYA UI Authority Cleanup QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/56-dock-stability.client.lua'
      - 'maps/bbya-social-hub/91-owner-ui.client.lua'
      - 'maps/bbya-social-hub/111-compact-secondary-panels.client.lua'
      - 'maps/bbya-social-hub/93-dashboard-structural.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-ui-authority-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: rojo-cache
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}
      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked
      - name: Build BBYA place
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-ui-authority.rbxl
          test -s /tmp/bbya-ui-authority.rbxl
      - name: Validate single compact UI authority
        shell: bash
        run: |
          set -euo pipefail
          menu='maps/bbya-social-hub/56-dock-stability.client.lua'
          owner='maps/bbya-social-hub/91-owner-ui.client.lua'
          secondary='maps/bbya-social-hub/111-compact-secondary-panels.client.lua'
          dash='maps/bbya-social-hub/93-dashboard-structural.client.lua'

          grep -q 'COMMAND MENU AUTHORITY v7' "$menu"
          grep -q 'V7_SINGLE_COMPACT_AUTHORITY' "$menu"
          grep -q 'BBYASinglePanelMode",true' "$menu"
          grep -q 'SIDE_RIGHT_OFFSET=96' "$menu"
          grep -q 'SIDE_TOP=8' "$menu"
          grep -q 'drawer.AnchorPoint=Vector2.new(1,0)' "$menu"
          grep -q 'drawer.Position=UDim2.new(1,-SIDE_RIGHT_OFFSET,0,SIDE_TOP)' "$menu"
          grep -q 'hideCompetingPanels' "$menu"
          grep -q 'bindSinglePanelVisibility' "$menu"
          grep -q 'LEFT_OF_MENU_V2_PRECISE' "$menu"
          grep -q 'DancePanel' "$menu"
          grep -q 'CarryPanel' "$menu"
          grep -q 'DJWallComposerPanel' "$menu"
          grep -q 'RolePanel' "$menu"
          grep -q '{"FREECAM",9' "$menu"
          if grep -q 'drawer.AnchorPoint=Vector2.new(.5,0)' "$menu"; then echo 'Command drawer must not be centered.' >&2; exit 1; fi
          if grep -q 'drawer.Position=UDim2.new(.5,0,0,54)' "$menu"; then echo 'Command drawer must stay beside MENU.' >&2; exit 1; fi
          if grep -q 'task.wait(.18)' "$menu"; then echo 'Command menu must remain event-driven.' >&2; exit 1; fi
          if grep -q 'while menuGui.Parent' "$menu"; then echo 'Command menu polling loop still present.' >&2; exit 1; fi

          grep -q 'OWNER UI COMPATIBILITY + ROLE PANEL v8' "$owner"
          grep -q 'COMMAND_MENU_V7' "$owner"
          if grep -q 'p.AnchorPoint=Vector2.new(.5,.5)' "$owner"; then echo 'Owner UI must not recenter feature panels.' >&2; exit 1; fi
          if grep -q 'p.Position=UDim2.fromScale(.5,.55)' "$owner"; then echo 'Dance/Carry center write must stay removed.' >&2; exit 1; fi
          if grep -q 'p.Position=UDim2.fromScale(.5,.54)' "$owner"; then echo 'Community center write must stay removed.' >&2; exit 1; fi

          grep -q 'COMPACT SECONDARY PANELS v3' "$secondary"
          grep -q 'COMMAND_MENU_V7' "$secondary"
          grep -q 'V3_CONTENT_ONLY' "$secondary"
          if grep -q 'hub.AnchorPoint=' "$secondary"; then echo 'Secondary layout must not own HubPanel anchor.' >&2; exit 1; fi
          if grep -q 'hub.Position=' "$secondary"; then echo 'Secondary layout must not own HubPanel position.' >&2; exit 1; fi
          if grep -q 'panel.AnchorPoint=' "$secondary"; then echo 'Secondary layout must not own message anchor.' >&2; exit 1; fi
          if grep -q 'panel.Position=' "$secondary"; then echo 'Secondary layout must not own message position.' >&2; exit 1; fi

          grep -q 'LEGACY DASHBOARD RETIREMENT v6' "$dash"
          grep -q 'V6_RETIRED_FOR_COMPACT_UI' "$dash"
          if grep -q 'dock.Position=' "$dash"; then echo 'Structural dashboard must not fight Command Menu dock authority.' >&2; exit 1; fi
          if grep -q 'while task.wait' "$dash"; then echo 'Structural dashboard polling loop still present.' >&2; exit 1; fi

          echo 'BBYA single compact UI authority QC passed.'
