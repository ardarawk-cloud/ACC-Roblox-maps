name: BBYA Studio Worker Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-studio-worker-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect and report EC2 worker session
        shell: powershell
        run: |
          $lines = @()
          $lines += "timestamp=$(Get-Date -Format o)"
          $lines += "whoami=$(whoami)"
          $lines += "USERPROFILE=$env:USERPROFILE"

          $studio = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue
          if ($studio) {
            foreach ($p in $studio) {
              $lines += "ROBLOX_STUDIO_VISIBLE=true"
              $lines += "ROBLOX_STUDIO_PID=$($p.Id)"
              $lines += "ROBLOX_STUDIO_SESSION=$($p.SessionId)"
            }
          } else {
            $lines += "ROBLOX_STUDIO_VISIBLE=false"
          }

          $codexPath = 'C:\Users\Administrator\AppData\Roaming\npm\codex.cmd'
          $lines += "CODEX_PATH_EXISTS=$(Test-Path $codexPath)"
          if (Test-Path $codexPath) {
            try {
              $version = (& $codexPath --version 2>&1 | Out-String).Trim()
              $lines += "CODEX_VERSION=$version"
            } catch {
              $lines += "CODEX_VERSION_ERROR=$($_.Exception.Message)"
            }
            try {
              $env:USERPROFILE = 'C:\Users\Administrator'
              $env:HOME = 'C:\Users\Administrator'
              $env:PATH = 'C:\Users\Administrator\AppData\Roaming\npm;' + $env:PATH
              $mcp = (& $codexPath mcp list 2>&1 | Out-String).Trim()
              $lines += "CODEX_MCP_LIST_BEGIN"
              $lines += $mcp
              $lines += "CODEX_MCP_LIST_END"
            } catch {
              $lines += "CODEX_MCP_LIST_ERROR=$($_.Exception.Message)"
            }
          }

          $text = ($lines -join "`n") + "`n"
          $bytes = [Text.Encoding]::UTF8.GetBytes($text)
          $content = [Convert]::ToBase64String($bytes)
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-studio-worker.txt"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "BBYA-Studio-Worker"
          }
          $existing = Invoke-RestMethod -Method Get -Uri $api -Headers $headers
          $body = @{
            message = "Record BBYA Studio worker diagnostic [skip ci]"
            content = $content
            branch = "main"
            sha = $existing.sha
          }
          $json = $body | ConvertTo-Json
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body $json -ContentType "application/json"
