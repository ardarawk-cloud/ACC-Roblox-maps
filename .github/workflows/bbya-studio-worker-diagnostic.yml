name: BBYA Studio Worker Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-studio-worker-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect and report EC2 worker session
        shell: powershell
        run: |
          $lines = @()
          $lines += "timestamp=$(Get-Date -Format o)"
          $lines += "whoami=$(whoami)"
          $lines += "SESSIONNAME=$env:SESSIONNAME"
          $lines += "USERNAME=$env:USERNAME"
          $lines += "USERPROFILE=$env:USERPROFILE"

          $studio = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue
          if ($studio) {
            foreach ($p in $studio) {
              $lines += "ROBLOX_STUDIO_VISIBLE=true"
              $lines += "ROBLOX_STUDIO_PID=$($p.Id)"
              $lines += "ROBLOX_STUDIO_SESSION=$($p.SessionId)"
            }
          } else {
            $lines += "ROBLOX_STUDIO_VISIBLE=false"
          }

          $codex = Get-Command codex -ErrorAction SilentlyContinue
          if ($codex) {
            $lines += "CODEX_VISIBLE=true"
            $lines += "CODEX_PATH=$($codex.Source)"
          } else {
            $lines += "CODEX_VISIBLE=false"
          }

          $node = Get-Command node -ErrorAction SilentlyContinue
          if ($node) {
            $lines += "NODE_VISIBLE=true"
            $lines += "NODE_PATH=$($node.Source)"
          } else {
            $lines += "NODE_VISIBLE=false"
          }

          $q = (quser 2>$null | Out-String).Trim()
          $lines += "QUSER_BEGIN"
          $lines += $q
          $lines += "QUSER_END"

          $text = ($lines -join "`n") + "`n"
          $bytes = [Text.Encoding]::UTF8.GetBytes($text)
          $content = [Convert]::ToBase64String($bytes)
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-studio-worker.txt"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "BBYA-Studio-Worker"
          }

          $sha = $null
          try {
            $existing = Invoke-RestMethod -Method Get -Uri $api -Headers $headers
            $sha = $existing.sha
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }

          $body = @{
            message = "Record BBYA Studio worker diagnostic [skip ci]"
            content = $content
            branch = "main"
          }
          if ($sha) { $body.sha = $sha }
          $json = $body | ConvertTo-Json
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body $json -ContentType "application/json"
