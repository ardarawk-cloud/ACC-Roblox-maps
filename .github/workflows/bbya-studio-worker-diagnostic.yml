# live runner state probe: 2026-08-26T19:35+08:00
name: BBYA Studio Worker Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-studio-worker-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe and attempt console reattach
        shell: powershell
        run: |
          $lines=New-Object System.Collections.Generic.List[string]
          $lines.Add("timestamp=$(Get-Date -Format o)")
          $lines.Add("whoami=$(whoami)")
          $sid=[System.Diagnostics.Process]::GetCurrentProcess().SessionId
          $lines.Add("current_session=$sid")
          $lines.Add('BEFORE_QUSER_BEGIN');try{$lines.Add(((quser 2>&1|Out-String).Trim()))}catch{$lines.Add($_.Exception.Message)};$lines.Add('BEFORE_QUSER_END')
          $lines.Add('BEFORE_QWINSTA_BEGIN');try{$lines.Add(((qwinsta 2>&1|Out-String).Trim()))}catch{$lines.Add($_.Exception.Message)};$lines.Add('BEFORE_QWINSTA_END')
          $tscon=(Get-Command tscon.exe -ErrorAction SilentlyContinue)
          if($tscon){
            try{
              $out=& $tscon.Source $sid /dest:console 2>&1
              $lines.Add("TSCON_EXIT=$LASTEXITCODE")
              if($out){$lines.Add(($out|Out-String).Trim())}
            }catch{$lines.Add("TSCON_ERROR=$($_.Exception.Message)")}
          }else{$lines.Add('TSCON_MISSING=true')}
          Start-Sleep -Seconds 3
          $lines.Add('AFTER_QUSER_BEGIN');try{$lines.Add(((quser 2>&1|Out-String).Trim()))}catch{$lines.Add($_.Exception.Message)};$lines.Add('AFTER_QUSER_END')
          $lines.Add('AFTER_QWINSTA_BEGIN');try{$lines.Add(((qwinsta 2>&1|Out-String).Trim()))}catch{$lines.Add($_.Exception.Message)};$lines.Add('AFTER_QWINSTA_END')
          $lines.Add('PROCESSES_BEGIN')
          Get-Process explorer,RobloxStudioBeta -ErrorAction SilentlyContinue | ForEach-Object {$lines.Add("PROC|$($_.ProcessName)|pid=$($_.Id)|session=$($_.SessionId)|hwnd=$($_.MainWindowHandle)")}
          $lines.Add('PROCESSES_END')
          $text=($lines -join "`n")+"`n"
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-studio-worker.txt"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28";"User-Agent"="BBYA-Studio-Worker"}
          $sha=$null
          try{$sha=(Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $body=@{message='Record BBYA console reattach diagnostic [skip ci]';content=$content;branch='main'}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body|ConvertTo-Json) -ContentType 'application/json' | Out-Null
