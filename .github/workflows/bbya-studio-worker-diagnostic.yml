name: BBYA Studio Worker Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-studio-worker-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect Codex execution mode
        shell: powershell
        run: |
          $env:USERPROFILE = 'C:\Users\Administrator'
          $env:HOME = 'C:\Users\Administrator'
          $env:PATH = 'C:\Users\Administrator\AppData\Roaming\npm;' + $env:PATH
          $codexPath = 'C:\Users\Administrator\AppData\Roaming\npm\codex.cmd'
          $lines = @()
          $lines += "timestamp=$(Get-Date -Format o)"
          $lines += "whoami=$(whoami)"
          $lines += "ROBLOX_STUDIO_VISIBLE=$([bool](Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue))"
          $lines += "CODEX_VERSION=$((& $codexPath --version 2>&1 | Out-String).Trim())"
          $lines += "CODEX_EXEC_HELP_BEGIN"
          $lines += ((& $codexPath exec --help 2>&1 | Out-String).Trim())
          $lines += "CODEX_EXEC_HELP_END"

          $text = ($lines -join "`n") + "`n"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-studio-worker.txt"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "BBYA-Studio-Worker"
          }
          $existing = Invoke-RestMethod -Method Get -Uri $api -Headers $headers
          $body = @{
            message = "Record BBYA Studio worker diagnostic [skip ci]"
            content = $content
            branch = "main"
            sha = $existing.sha
          } | ConvertTo-Json
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body $body -ContentType "application/json"
