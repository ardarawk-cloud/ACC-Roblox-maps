name: After School City Publish V0.8.2 Source Rescue

on:
  push:
    branches: [main]
    paths: ['.github/workflows/after-school-city-publish-v082-source-rescue.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 398f80859527a09d65eae59474342895fef31949
      BASE_LIVE_SHA: efa281ac26f847f683e002b6085b49d196c05421
      QC_RUN_ID: '33303659588'
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      EXPECTED_BYTES: '111920'
      EXPECTED_SHA256: '6f12286e4e9b77bb237124d67349bc4543da683bbcb5c4184afa14a0a3746852'
      ROBLOX_API_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH }}
    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public rescue QC receipt
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/ardarawk-cloud/ACC-Builder-Apk/main/deploy-status/after-school-city-v082-public-rescue-qc.json' -o "$RUNNER_TEMP/qc.json"
          [[ "$(jq -r '.status' "$RUNNER_TEMP/qc.json")" == 'QC_PASS' ]] || { echo 'QC is not PASS'; exit 9; }
          [[ "$(jq -r '.sourceCommit' "$RUNNER_TEMP/qc.json")" == "$SOURCE_SHA" ]] || { echo 'QC source mismatch'; exit 10; }
          [[ "$(jq -r '.baseLiveCommit' "$RUNNER_TEMP/qc.json")" == "$BASE_LIVE_SHA" ]] || { echo 'QC base mismatch'; exit 11; }
          [[ "$(jq -r '.runId' "$RUNNER_TEMP/qc.json")" == "$QC_RUN_ID" ]] || { echo 'QC run mismatch'; exit 12; }
          [[ "$(jq -r '.placeBytes' "$RUNNER_TEMP/qc.json")" == "$EXPECTED_BYTES" ]] || { echo 'QC bytes mismatch'; exit 13; }
          [[ "$(jq -r '.placeSha256' "$RUNNER_TEMP/qc.json")" == "$EXPECTED_SHA256" ]] || { echo 'QC hash mismatch'; exit 14; }
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROCKET_RACOON_PUBLISH missing'; exit 15; }
          echo "QC AUTHORITY PASS run=$QC_RUN_ID source=$SOURCE_SHA"

      - name: Checkout exact V0.8.2 source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 398f80859527a09d65eae59474342895fef31949
          path: asc-source
          fetch-depth: 0

      - name: Verify exact source and 3-file delta
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 20; }
          git -C asc-source cat-file -e "${BASE_LIVE_SHA}^{commit}"
          mapfile -t files < <(git -C asc-source diff --name-only "$BASE_LIVE_SHA" "$SOURCE_SHA")
          [[ ${#files[@]} -eq 3 ]] || { printf '%s\n' "${files[@]}"; echo "Unexpected delta count ${#files[@]}"; exit 21; }
          expected=(
            'maps/after-school-city/after-school-city.config.lua'
            'maps/after-school-city/after-school-city.road-sidewalk-intersection-cleanup.server.lua'
            'maps/after-school-city/default.project.json'
          )
          for f in "${expected[@]}"; do printf '%s\n' "${files[@]}" | grep -Fxq "$f" || { echo "Missing expected delta $f"; exit 22; }; done
          grep -Fq 'return -part.CFrame.LookVector' asc-source/maps/after-school-city/after-school-city.road-sidewalk-intersection-cleanup.server.lua
          grep -Fq 'ASC_RoadSidewalkIntersectionCleanupPass' asc-source/maps/after-school-city/after-school-city.road-sidewalk-intersection-cleanup.server.lua
          grep -Fq 'PUTU AZYA PUTRI' asc-source/maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'BINTANG HARDAJAYA' asc-source/maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'WITH LOVE, DAD' asc-source/maps/after-school-city/after-school-city.intro.client.lua
          echo "SOURCE LOCK PASS source=$actual delta=3-files"

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || exit 30
          chmod +x "$rojo"
          version=$("$rojo" --version)
          [[ "$version" == *'7.7.0'* ]] || { echo "Wrong Rojo: $version"; exit 31; }
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build and verify exact V0.8.2 place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v082.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          sha=$(sha256sum "$place" | awk '{print $1}')
          [[ "$bytes" == "$EXPECTED_BYTES" ]] || { echo "Byte mismatch: $bytes expected=$EXPECTED_BYTES"; exit 32; }
          [[ "$sha" == "$EXPECTED_SHA256" ]] || { echo "SHA256 mismatch: $sha expected=$EXPECTED_SHA256"; exit 33; }
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD EXACT PASS bytes=$bytes sha256=$sha"

      - name: Publish V0.8.2 LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/asc-publish-response.json" -w '%{http_code}' -X POST "$url" -H "x-api-key: $ROBLOX_API_KEY" -H 'Content-Type: application/octet-stream' --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/asc-publish-response.json")
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "HTTP $http: $body"; exit 40; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/asc-publish-response.json")
          [[ -n "$version" ]] || { echo "Missing versionNumber: $body"; exit 41; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'ROAD_SIDEWALK_INTERSECTION_CLEANUP_V0_8_2' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg baseLiveCommit "$BASE_LIVE_SHA" \
            --arg qcRunId "$QC_RUN_ID" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,baseLiveCommit:$baseLiveCommit,qcRunId:$qcRunId,universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"V0.8.2 exact QC-locked sidewalk/asphalt intersection cleanup; long legacy sidewalks segmented at perpendicular asphalt crossings; asphalt road geometry unchanged; dedication unchanged."}' > deploy-status/after-school-city-publish-road-sidewalk-intersection-v0-8-2.json
          cat deploy-status/after-school-city-publish-road-sidewalk-intersection-v0-8-2.json
          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- deploy-status/after-school-city-publish-road-sidewalk-intersection-v0-8-2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record After School City V0.8.2 LIVE publish [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
