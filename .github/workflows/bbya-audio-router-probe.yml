name: BBYA Audio Router Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-audio-router-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist runner marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          printf '{"status":"STARTED","workflow":"BBYA Audio Router Probe","triggerCommit":"%s","routing":"PROGRESIVE_MAIN_OTHERS_BASEMENT","probe":"2026-08-24"}\n' "$GITHUB_SHA" > deploy-status/bbya-audio-run-start.json
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/bbya-audio-run-start.json
          git commit -m "Mark BBYA audio router runner active [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
