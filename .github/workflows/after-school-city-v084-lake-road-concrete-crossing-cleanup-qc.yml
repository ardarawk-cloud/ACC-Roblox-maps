name: After School City V0.8.4 Lake Road Concrete Crossing Cleanup QC

on:
  push:
    branches:
      - after-school-city/v084-lake-road-concrete-crossing-cleanup
    paths:
      - 'maps/after-school-city/**'
      - '.github/workflows/after-school-city-v084-lake-road-concrete-crossing-cleanup-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact-source narrow diff gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'dda124b235dc3e165e9062926cb9b300d6c65c02'
          git cat-file -e "$base^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'V0.8.3 LIVE base commit unavailable' }
          $mergeBase = (git merge-base $base $env:GITHUB_SHA).Trim()
          if($mergeBase -ne $base){ throw "Candidate is not based on exact V0.8.3 LIVE source: merge-base=$mergeBase" }

          $allowed = @(
            '.github/workflows/after-school-city-v084-lake-road-concrete-crossing-cleanup-qc.yml',
            'maps/after-school-city/after-school-city.lake-road-concrete-crossing-cleanup.server.lua',
            'maps/after-school-city/default.project.json'
          )
          $changed = @(git diff --name-only $base $env:GITHUB_SHA)
          if(-not $changed){ throw 'No V0.8.4 candidate changes detected' }
          foreach($path in $changed){
            if($allowed -notcontains $path){ throw "V0.8.4 scope violation: $path" }
          }
          foreach($required in $allowed){
            if($changed -notcontains $required){ throw "Required V0.8.4 change missing: $required" }
          }
          Write-Host "V0.8.4 NARROW DIFF PASS: $($changed -join ', ')"

      - name: V0.8.4 static hard-lock checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'dda124b235dc3e165e9062926cb9b300d6c65c02'
          $scriptPath = 'maps/after-school-city/after-school-city.lake-road-concrete-crossing-cleanup.server.lua'
          $projectPath = 'maps/after-school-city/default.project.json'
          $cityLifePath = 'maps/after-school-city/after-school-city.city-life.server.lua'
          $script = Get-Content $scriptPath -Raw
          $project = Get-Content $projectPath -Raw
          $cityLife = Get-Content $cityLifePath -Raw
          $null = $project | ConvertFrom-Json

          foreach($token in @(
            '0.8.4-lake-road-concrete-crossing-final-cleanup-1',
            'ASC_SouthRoadConcreteCleanupPass',
            'ASC_LakeRoadConcreteCrossingCleanupPass',
            'V03_ParkLife',
            'NorthSouthRoad',
            'PathNorth',
            'PathSouth',
            'ROAD_CLEAR_MARGIN = 1.5',
            'ASC_V084RoadUnchanged',
            'ASC_V084Split'
          )){
            if($script -notmatch [regex]::Escape($token)){ throw "V0.8.4 marker missing: $token" }
          }

          foreach($token in @(
            'ASC_LakeRoadConcreteCrossingCleanup',
            'after-school-city.lake-road-concrete-crossing-cleanup.server.lua'
          )){
            if($project -notmatch [regex]::Escape($token)){ throw "Rojo V0.8.4 marker missing: $token" }
          }

          # Prove the screenshot defect source still comes from the locked V03 Park loop.
          foreach($token in @('V03_ParkLife', 'PathNorth', 'PathSouth', 'Vector3.new(130, 0.4, 8)')){
            if($cityLife -notmatch [regex]::Escape($token)){ throw "Locked Park loop source marker missing: $token" }
          }

          foreach($forbidden in @(
            'EastWestRoad',
            'SchoolSportsRoad',
            'SideStreet',
            'CrossStreet',
            'MarketplaceService',
            'DataStoreService',
            'PromptProductPurchase',
            'ProcessReceipt',
            'WalkingPath',
            'LakeBorderN',
            'LakeBorderS'
          )){
            if($script -match [regex]::Escape($forbidden)){ throw "Forbidden V0.8.4 authority found: $forbidden" }
          }

          if($script -match '(?m)^\s*road\.(?:Size|CFrame|Position|Parent|Transparency|Material|Color|CanCollide)\s*=(?!=)'){
            throw 'NorthSouthRoad property assignment forbidden in V0.8.4'
          }
          if($script -match 'road\s*:\s*Destroy\s*\('){
            throw 'NorthSouthRoad destroy forbidden in V0.8.4'
          }

          foreach($lockedPath in @(
            'maps/after-school-city/after-school-city.orientation-correction.server.lua',
            'maps/after-school-city/after-school-city.road-centerline-clearance.server.lua',
            'maps/after-school-city/after-school-city.intro.client.lua',
            'maps/after-school-city/after-school-city.south-road-concrete-cleanup.server.lua',
            'maps/after-school-city/after-school-city.city-life.server.lua'
          )){
            $lockedDiff = git diff --name-only $base $env:GITHUB_SHA -- $lockedPath
            if($lockedDiff){ throw "Protected source changed in V0.8.4: $lockedPath" }
          }

          $intro = Get-Content 'maps/after-school-city/after-school-city.intro.client.lua' -Raw
          foreach($token in @('PUTU AZYA PUTRI', 'BINTANG HARDAJAYA', 'WITH LOVE, DAD', 'ENTER THE CITY.')){
            if($intro -notmatch [regex]::Escape($token)){ throw "Dedication text lock missing: $token" }
          }

          Write-Host 'AFTER SCHOOL CITY V0.8.4 STATIC HARD-LOCK QC PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
          $zip = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
          if(-not $exe){ throw 'rojo.exe not found' }
          $version = (& $exe.FullName --version | Out-String).Trim()
          if($LASTEXITCODE -ne 0){ throw 'Rojo version check failed' }
          if($version -notmatch '7\.7\.0'){ throw "Unexpected Rojo version: $version" }
          "ROJO_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROJO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ROJO LOCK PASS: $version"

      - name: Build exact candidate and hash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'asc-v084-qc'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $place = Join-Path $outDir 'after-school-city-v084.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){ throw "Rojo build failed: $LASTEXITCODE" }
          if(-not (Test-Path $place)){ throw 'Generated RBXL missing' }
          $bytes = (Get-Item $place).Length
          if($bytes -lt 1024){ throw "Generated RBXL suspiciously small: $bytes bytes" }
          $hash = (Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = @(
            "STATUS=QC_PASSED",
            "MODE=LAKE_ROAD_CONCRETE_CROSSING_FINAL_CLEANUP_V0_8_4",
            "BASE_LIVE_COMMIT=dda124b235dc3e165e9062926cb9b300d6c65c02",
            "SOURCE_COMMIT=$env:GITHUB_SHA",
            "ROJO=$env:ROJO_VERSION",
            "RBXL_BYTES=$bytes",
            "SHA256=$hash"
          )
          $receiptPath = Join-Path $outDir 'qc-receipt.txt'
          $receipt | Set-Content $receiptPath -Encoding ascii
          $receipt | ForEach-Object { Write-Host $_ }
          "QC_OUT_DIR=$outDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exact QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v084-qc-${{ github.sha }}
          path: ${{ env.QC_OUT_DIR }}
          if-no-files-found: error
          retention-days: 7
