name: BBYA Fishing Satisfaction v6 QC

on:
  push:
    branches: [feature/bbya-fishing-v6-satisfaction2]
    paths:
      - 'maps/bbya-social-hub/130-fishing-satisfaction-v6.server.lua'
      - 'maps/bbya-social-hub/130-fishing-gate-v6.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-fishing-v6-satisfaction-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/130-fishing-satisfaction-v6.server.lua'
      - 'maps/bbya-social-hub/130-fishing-gate-v6.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-fishing-v6-satisfaction-qc.yml'

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - name: Checkout v6 satisfaction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Static fishing satisfaction checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Require([string]$text,[string]$pattern,[string]$message){if($text -notmatch $pattern){throw $message}}
          function Forbid([string]$text,[string]$pattern,[string]$message){if($text -match $pattern){throw $message}}

          $serverPath='maps/bbya-social-hub/130-fishing-satisfaction-v6.server.lua'
          $clientPath='maps/bbya-social-hub/130-fishing-gate-v6.client.lua'
          $projectPath='maps/bbya-social-hub/default.project.json'
          foreach($p in @($serverPath,$clientPath,$projectPath)){if(-not (Test-Path $p)){throw "Missing $p"}}

          $server=Get-Content $serverPath -Raw
          $client=Get-Content $clientPath -Raw
          $project=Get-Content $projectPath -Raw
          $null=$project | ConvertFrom-Json

          Require $server 'FishingSatisfactionPass",\s*"V6"' 'V6 server marker missing'
          Require $server 'GATE_Z\s*=\s*687\.5' 'Strict lake gate Z missing on server'
          Require $server 'GateSideRodAuthorityV6' 'Gate-side rod authority missing'
          Require $server 'RodPremiumV6' 'Premium rod geometry folder missing'
          Require $server 'GripWrap' 'Rod grip wraps missing'
          Require $server 'ReelFace' 'Rod reel face detail missing'
          Require $server 'GuideEye' 'Rod guide eye detail missing'
          Require $server 'FishAnatomyV6' 'Fish anatomy pass missing'
          Require $server 'KoiBarbel' 'Koi anatomy detail missing'
          Require $server 'GouramiFeeler' 'Gourami anatomy detail missing'
          Require $server 'CatBarbelLong' 'Catfish anatomy detail missing'
          Require $server 'ArowanaBarbel' 'Arowana anatomy detail missing'
          Require $server 'RayStinger' 'Ray anatomy detail missing'
          Require $server 'LeviathanJaw' 'Leviathan anatomy detail missing'
          Require $server 'LeviathanTooth' 'Leviathan trophy detail missing'

          Require $client 'GATE_Z\s*=\s*687\.5' 'Client gate threshold missing'
          Require $client 'BindToRenderStep\("BBYAFishingGateAuthorityV6"' 'Final UI gate authority missing'
          Require $client 'MarketSideUIBlockedV6' 'Market-side UI block marker missing'
          Require $client 'NoNewPermanentPanelV6' 'Simple UI safety marker missing'
          Require $client 'kind == "Bite"' 'Bite satisfaction feedback missing'
          Require $client 'kind == "Catch"' 'Catch satisfaction feedback missing'

          Require $project '130-fishing-satisfaction-v6\.server\.lua' 'V6 server not mounted'
          Require $project '130-fishing-gate-v6\.client\.lua' 'V6 client not mounted'

          # This pass must not rebalance fishing probability/progression or global lighting.
          Forbid $server 'chance\s*=' 'V6 must not modify fish chance values'
          Forbid $server 'DataStoreService' 'V6 must not create another fishing datastore'
          Forbid $server 'Lighting\.' 'V6 must not modify global Lighting'
          Forbid $client 'Lighting\.' 'V6 client must not modify global Lighting'

          Write-Host 'Fishing Satisfaction v6 static QC PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojoExe=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-rojo-7.7.0-fishing-v6'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-rojo-7.7.0-fishing-v6.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found after download'}
            $rojoExe=$exe.FullName
          }
          & $rojoExe --version
          if($LASTEXITCODE -ne 0){throw "Rojo version check failed: $LASTEXITCODE"}
          "ROJO_EXE=$rojoExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Full canonical BBYA build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-fishing-v6-qc.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
          if(-not (Test-Path $place)){throw 'Built place file missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw "Built place unexpectedly small: $bytes bytes"}
          Write-Host "BBYA FISHING SATISFACTION V6 QC PASS - canonical build: $bytes bytes"
