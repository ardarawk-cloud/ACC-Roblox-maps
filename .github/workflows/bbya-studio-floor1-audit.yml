name: BBYA Floor 1 Live Studio Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-studio-floor1-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Audit Main Club v377 through Codex and Roblox Studio MCP
        shell: powershell
        run: |
          $env:USERPROFILE = 'C:\Users\Administrator'
          $env:HOME = 'C:\Users\Administrator'
          $env:PATH = 'C:\Users\Administrator\AppData\Roaming\npm;' + $env:PATH
          $codex = 'C:\Users\Administrator\AppData\Roaming\npm\codex.cmd'
          $outFile = Join-Path $env:RUNNER_TEMP 'bbya-floor1-audit.txt'
          $promptFile = Join-Path $env:RUNNER_TEMP 'bbya-floor1-prompt.txt'
          @'
Inspect the currently open BBYA Social Hub place in Roblox Studio using the enabled Roblox_Studio MCP server. LIVE 3D AUDIT ONLY; DO NOT MODIFY ANYTHING. Focus specifically on the currently published Main Club after v377. Read actual Studio hierarchy, object names, positions, CFrames, sizes, and visible layout rather than repository intent.

Verify all of the following:
1. Whether Floor1FrontPremium still contains PhotoAreaPremium or SalonLookStudioPremium or any shelves/product displays/softboxes/mirrors that visually belong to the old Salon/Photo Studio.
2. Whether Floor1LuxuryFinish still contains EditorialPhotoRoom, LookLab, RearSocialRail, cocktail tables, stools, seats, or any other loose furniture around the DJ/stage-front footprint.
3. Whether Floor1UltraPremium still contains EditorialPhotoRefinement or LookLabRefinement.
4. Whether MainClubFinalAuthorityV1 exists at runtime and list its direct children.
5. Inspect the DJ booth from the dance-floor side. Identify every table/chair/stool/seat/stand in X=-22..28, Z=27..45, Y<13 and whether the booth/platform visually touches a grounded base or appears floating.
6. Inspect the former Salon/Photo footprint X=-52..-27, Z=-36..7, Y<15 and identify any remaining legacy retail/studio geometry by full object path.
7. Confirm whether BBYAMall/Tenant_glow exists and is the new Look Lab + Photo Studio destination.

Give concise findings with exact full object paths and transforms for anything wrong. End with AUDIT_STATUS=VERIFIED if live MCP inspection succeeds, otherwise AUDIT_STATUS=FAILED with the reason.
'@ | Set-Content -Encoding UTF8 $promptFile

          $stream = Get-Content $promptFile -Raw | & $codex exec --full-auto --skip-git-repo-check -o $outFile - 2>&1 | Out-String
          $exit = $LASTEXITCODE
          $lines = @("timestamp=$(Get-Date -Format o)", "exit_code=$exit")
          if (Test-Path $outFile) { $lines += 'CODEX_LAST_MESSAGE_BEGIN'; $lines += Get-Content $outFile -Raw; $lines += 'CODEX_LAST_MESSAGE_END' }
          $lines += 'CODEX_STREAM_BEGIN'; $lines += $stream; $lines += 'CODEX_STREAM_END'
          $text = ($lines -join "`n") + "`n"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-floor1-live-audit.txt"
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28"; "User-Agent"="BBYA-Studio-Worker" }
          $sha = $null
          try { $sha = (Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          $body = @{ message='Record BBYA Floor 1 live Studio audit [skip ci]'; content=$content; branch='main' }
          if ($sha) { $body.sha = $sha }
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body | ConvertTo-Json) -ContentType 'application/json'
