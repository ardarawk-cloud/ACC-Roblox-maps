name: BBYA Floor 1 Live Studio Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-studio-floor1-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Audit Floor 1 through Codex and Roblox Studio MCP
        shell: powershell
        run: |
          $env:USERPROFILE = 'C:\Users\Administrator'
          $env:HOME = 'C:\Users\Administrator'
          $env:PATH = 'C:\Users\Administrator\AppData\Roaming\npm;' + $env:PATH
          $codex = 'C:\Users\Administrator\AppData\Roaming\npm\codex.cmd'
          $outFile = Join-Path $env:RUNNER_TEMP 'bbya-floor1-audit.txt'
          $promptFile = Join-Path $env:RUNNER_TEMP 'bbya-floor1-prompt.txt'
          @'
Inspect the currently open BBYA Social Hub place in Roblox Studio using the enabled Roblox_Studio MCP server. LIVE 3D AUDIT ONLY; do not modify anything. Focus only Floor 1: Main Club, Photo Area, and Salon/Look Studio. Read the actual Studio hierarchy and transforms, not repository scripts. Identify duplicates or legacy objects, overlapping or badly placed seating/tables, DJ booth versus background depth/sightline issues, Photo Area composition/spacing issues, Salon station/chair spacing issues, and list the important object paths with Position/CFrame/Size values needed for corrections. End with AUDIT_STATUS=VERIFIED if MCP inspection succeeds, otherwise AUDIT_STATUS=FAILED with the reason.
'@ | Set-Content -Encoding UTF8 $promptFile

          $stream = Get-Content $promptFile -Raw | & $codex exec --full-auto --skip-git-repo-check -o $outFile - 2>&1 | Out-String
          $exit = $LASTEXITCODE
          $lines = @("timestamp=$(Get-Date -Format o)", "exit_code=$exit")
          if (Test-Path $outFile) { $lines += 'CODEX_LAST_MESSAGE_BEGIN'; $lines += Get-Content $outFile -Raw; $lines += 'CODEX_LAST_MESSAGE_END' }
          $lines += 'CODEX_STREAM_BEGIN'; $lines += $stream; $lines += 'CODEX_STREAM_END'
          $text = ($lines -join "`n") + "`n"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-floor1-live-audit.txt"
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28"; "User-Agent"="BBYA-Studio-Worker" }
          $sha = $null
          try { $sha = (Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          $body = @{ message='Record BBYA Floor 1 live Studio audit [skip ci]'; content=$content; branch='main' }
          if ($sha) { $body.sha = $sha }
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body | ConvertTo-Json) -ContentType 'application/json'
