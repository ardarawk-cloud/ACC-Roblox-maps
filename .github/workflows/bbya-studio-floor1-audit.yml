name: BBYA Floor 1 Live Studio Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-studio-floor1-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Audit Floor 1 through Codex and Roblox Studio MCP
        shell: powershell
        run: |
          $env:USERPROFILE = 'C:\Users\Administrator'
          $env:HOME = 'C:\Users\Administrator'
          $env:PATH = 'C:\Users\Administrator\AppData\Roaming\npm;' + $env:PATH
          $codex = 'C:\Users\Administrator\AppData\Roaming\npm\codex.cmd'
          $outFile = Join-Path $env:RUNNER_TEMP 'bbya-floor1-audit.txt'
          $prompt = @'
You are operating on the currently open BBYA Social Hub place in Roblox Studio through the enabled MCP server named Roblox_Studio.

TASK: LIVE 3D AUDIT ONLY. Do not modify anything yet.
Focus ONLY Floor 1 and these three zones:
1) Main Club: dance floor, DJ booth, DJ/stage background, lounge seating, bar and player sightlines.
2) Photo Area.
3) Salon / Look Studio.

Use Roblox_Studio MCP tools to inspect the actual live Studio hierarchy and real object transforms. Do not infer positions from repository scripts. Read the scene that is open in Studio.

Report:
- exact models/folders/parts responsible for each zone;
- obvious duplicates/legacy objects still present;
- badly placed or overlapping chairs/sofas/tables;
- DJ booth/background depth and collision/sightline problems;
- Photo Area spacing/composition problems;
- Salon chair/station spacing/composition problems;
- key Position/CFrame/Size values needed to fix them;
- recommended concrete edits, but DO NOT APPLY edits in this audit.

Keep the response factual and concise. End with AUDIT_STATUS=VERIFIED if MCP inspection succeeded, otherwise AUDIT_STATUS=FAILED and state why.
'@
          $stdout = Join-Path $env:RUNNER_TEMP 'bbya-codex-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'bbya-codex-stderr.txt'
          $args = @('exec','--full-auto','--skip-git-repo-check','-o',$outFile,$prompt)
          $p = Start-Process -FilePath $codex -ArgumentList $args -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $lines = @()
          $lines += "timestamp=$(Get-Date -Format o)"
          $lines += "exit_code=$($p.ExitCode)"
          if (Test-Path $outFile) {
            $lines += 'CODEX_LAST_MESSAGE_BEGIN'
            $lines += Get-Content $outFile -Raw
            $lines += 'CODEX_LAST_MESSAGE_END'
          }
          if (Test-Path $stdout) {
            $lines += 'STDOUT_BEGIN'
            $lines += Get-Content $stdout -Raw
            $lines += 'STDOUT_END'
          }
          if (Test-Path $stderr) {
            $lines += 'STDERR_BEGIN'
            $lines += Get-Content $stderr -Raw
            $lines += 'STDERR_END'
          }
          $text = ($lines -join "`n") + "`n"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-floor1-live-audit.txt"
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28"; "User-Agent"="BBYA-Studio-Worker" }
          $sha = $null
          try { $sha = (Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          $body = @{ message='Record BBYA Floor 1 live Studio audit [skip ci]'; content=$content; branch='main' }
          if ($sha) { $body.sha = $sha }
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body | ConvertTo-Json) -ContentType 'application/json'
