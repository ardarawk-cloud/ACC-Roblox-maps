name: Publish BBYAVATAR

on:
  push:
    branches: [main]
    paths:
      - 'maps/bbyavatar/**'
      - 'maps/registry.json'
      - 'scripts/build-bbyavatar.js'
      - 'scripts/publish-bbyavatar-direct.js'
      - '.github/workflows/publish-bbyavatar.yml'
  workflow_dispatch:

concurrency:
  group: bbyavatar-live-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate target lock
        shell: bash
        run: |
          node - <<'NODE'
          const r=require('./maps/registry.json');
          const t=r.maps.bbyavatar;
          if(!t) throw new Error('Missing bbyavatar registry target');
          if(String(t.universeId)!=='10744157359') throw new Error('Wrong Universe ID');
          if(String(t.placeId)!=='85866320744490') throw new Error('Wrong Place ID');
          if(!t.enabled) throw new Error('BBYAVATAR target is disabled');
          console.log('Target lock PASS');
          NODE

      - name: Build place
        run: node scripts/build-bbyavatar.js

      - name: Validate generated place
        shell: bash
        run: |
          test -s maps/bbyavatar/place.rbxlx
          grep -q 'BBYAVATAR_Runtime' maps/bbyavatar/place.rbxlx
          grep -q 'BBYAVATAR_Client' maps/bbyavatar/place.rbxlx
          echo 'Generated place validation PASS'

      - name: Publish BBYAVATAR to Roblox
        id: publish
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: node scripts/publish-bbyavatar-direct.js

      - name: Persist BBYAVATAR publish result
        if: always()
        shell: bash
        run: |
          if [ ! -s deploy-status/bbyavatar-direct.json ]; then
            mkdir -p deploy-status
            printf '{"ok":false,"httpStatus":"NO_RESULT","at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy-status/bbyavatar-direct.json
          fi
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/bbyavatar-direct.json
          if ! git diff --cached --quiet; then
            git commit -m "Record BBYAVATAR direct publish result [skip ci]"
            git push origin HEAD:main
          fi

      - name: Enforce publish success
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='deploy-status/bbyavatar-direct.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!r.ok) {
            console.error('BBYAVATAR publish did not succeed:', r);
            process.exit(1);
          }
          console.log('BBYAVATAR publish verified:', r.payload);
          NODE
