name: After School City Publish V1.1.2 Skatepark Light Clearance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-publish-v112-skatepark-light-clearance.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 0df86eebafec37054a26db434b5d46c37e2fee2c
      BASE_LIVE_SHA: 2636e7affbb33b7e6ae97caebf87f9d1aa797f04
      QC_RUN_ID: '33645100853'
      QC_ARTIFACT_ID: '9852438793'
      QC_ARTIFACT_NAME: after-school-city-v112-qc-0df86eebafec37054a26db434b5d46c37e2fee2c
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      EXPECTED_BYTES: '181023'
      EXPECTED_SHA256: 0fb6061d595904d04ca1a85eb63dab6d7036f8059892f9d456a38b85e8b6ac2c
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify previous LIVE authority
        shell: bash
        run: |
          set -euo pipefail
          receipt='deploy-status/after-school-city-publish-streetlight-geometry-hotfix-v1-1-1.json'
          [[ -f "$receipt" ]] || { echo 'V1.1.1 LIVE receipt missing'; exit 7; }
          [[ "$(jq -r '.status' "$receipt")" == 'LIVE_PUBLISHED' ]] || { echo 'Previous receipt is not LIVE_PUBLISHED'; exit 8; }
          [[ "$(jq -r '.sourceCommit' "$receipt")" == "$BASE_LIVE_SHA" ]] || { echo 'Previous LIVE source mismatch'; exit 9; }
          [[ "$(jq -r '.versionNumber' "$receipt")" == '47' ]] || { echo 'Previous LIVE version is not v47'; exit 10; }
          echo 'PREVIOUS LIVE AUTHORITY PASS v47'

      - name: Verify exact QC run and artifact authority
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROBLOX_OPEN_CLOUD_MASTER_V2 is unavailable'; exit 11; }
          api='https://api.github.com/repos/ardarawk-cloud/ACC-Roblox-maps'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$QC_RUN_ID" -o "$RUNNER_TEMP/qc-run.json"
          [[ "$(jq -r '.status' "$RUNNER_TEMP/qc-run.json")" == 'completed' ]] || { echo 'QC run is not completed'; exit 12; }
          [[ "$(jq -r '.conclusion' "$RUNNER_TEMP/qc-run.json")" == 'success' ]] || { echo 'QC run is not SUCCESS'; exit 13; }
          [[ "$(jq -r '.head_sha' "$RUNNER_TEMP/qc-run.json")" == "$SOURCE_SHA" ]] || { echo 'QC source SHA mismatch'; exit 14; }
          [[ "$(jq -r '.path' "$RUNNER_TEMP/qc-run.json")" == '.github/workflows/after-school-city-v112-skatepark-light-clearance-qc.yml' ]] || { echo 'Unexpected QC workflow'; exit 15; }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$QC_RUN_ID/artifacts" -o "$RUNNER_TEMP/qc-artifacts.json"
          count=$(jq --argjson id "$QC_ARTIFACT_ID" --arg n "$QC_ARTIFACT_NAME" --arg s "$SOURCE_SHA" '[.artifacts[] | select(.id == $id and .name == $n and .expired == false and .workflow_run.head_sha == $s)] | length' "$RUNNER_TEMP/qc-artifacts.json")
          [[ "$count" == '1' ]] || { cat "$RUNNER_TEMP/qc-artifacts.json"; echo 'Exact QC artifact authority not found'; exit 16; }
          echo "QC AUTHORITY PASS run=$QC_RUN_ID artifact=$QC_ARTIFACT_ID source=$SOURCE_SHA"

      - name: Checkout exact V1.1.2 source for lock verification
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 0df86eebafec37054a26db434b5d46c37e2fee2c
          path: asc-source
          fetch-depth: 0

      - name: Verify exact source and narrow V1.1.2 delta
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 20; }
          git -C asc-source cat-file -e "${BASE_LIVE_SHA}^{commit}"
          mapfile -t files < <(git -C asc-source diff --name-only "$BASE_LIVE_SHA" "$SOURCE_SHA")
          [[ ${#files[@]} -eq 3 ]] || { printf '%s\n' "${files[@]}"; echo "Unexpected delta count ${#files[@]}"; exit 21; }
          expected=(
            '.github/workflows/after-school-city-v112-skatepark-light-clearance-qc.yml'
            'maps/after-school-city/after-school-city.skatepark-light-clearance-v112.server.lua'
            'maps/after-school-city/default.project.json'
          )
          for f in "${expected[@]}"; do printf '%s\n' "${files[@]}" | grep -Fxq "$f" || { echo "Missing expected delta $f"; exit 22; }; done
          hotfix='asc-source/maps/after-school-city/after-school-city.skatepark-light-clearance-v112.server.lua'
          project='asc-source/maps/after-school-city/default.project.json'
          grep -Fq '1.1.2-skatepark-light-clearance-1' "$hotfix"
          grep -Fq 'EXPECTED_RELOCATIONS = 4' "$hotfix"
          grep -Fq 'CLEARANCE = 12' "$hotfix"
          grep -Fq 'PointToObjectSpace' "$hotfix"
          grep -Fq 'PointToWorldSpace' "$hotfix"
          grep -Fq 'ASC_SkateparkLightClearanceV112' "$project"
          [[ -z "$(git -C asc-source diff --name-only "$BASE_LIVE_SHA" "$SOURCE_SHA" -- maps/after-school-city/after-school-city.world.server.lua maps/after-school-city/after-school-city.streetlight-geometry-hotfix-v111.server.lua maps/after-school-city/after-school-city.gameplay-service.lua maps/after-school-city/after-school-city.gameplay-config.lua maps/after-school-city/after-school-city.gameplay-bootstrap.server.lua maps/after-school-city/after-school-city.gameplay-hud.client.lua maps/after-school-city/after-school-city.ui-glass-v102.client.lua maps/after-school-city/after-school-city.activity-config.lua maps/after-school-city/after-school-city.activities.server.lua maps/after-school-city/after-school-city.activities.client.lua maps/after-school-city/after-school-city.music-player.client.lua maps/after-school-city/after-school-city.music-config.lua maps/after-school-city/after-school-city.intro.client.lua maps/after-school-city/after-school-city.swimmable-pool.server.lua)" ]] || { echo 'Protected source changed'; exit 23; }
          echo "SOURCE LOCK PASS source=$actual delta=3-files scope=skatepark-light-clearance"

      - name: Download exact QC-locked artifact
        uses: actions/download-artifact@v4
        with:
          name: after-school-city-v112-qc-0df86eebafec37054a26db434b5d46c37e2fee2c
          path: ${{ runner.temp }}/asc-v112-qc
          github-token: ${{ github.token }}
          repository: ardarawk-cloud/ACC-Roblox-maps
          run-id: 33645100853

      - name: Verify QC receipt and exact RBXL bytes/SHA256
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/asc-v112-qc/qc-receipt.txt"
          normalized="$RUNNER_TEMP/asc-v112-qc/qc-receipt-normalized.txt"
          [[ -f "$receipt" ]] || { find "$RUNNER_TEMP/asc-v112-qc" -maxdepth 3 -type f -print; echo 'QC receipt missing'; exit 29; }
          tr -d '\r' < "$receipt" > "$normalized"
          grep -Fxq 'STATUS=QC_PASSED' "$normalized"
          grep -Fxq 'MODE=SKATEPARK_LIGHT_CLEARANCE_V1_1_2' "$normalized"
          grep -Fxq "BASE_LIVE_COMMIT=$BASE_LIVE_SHA" "$normalized"
          grep -Fxq "SOURCE_COMMIT=$SOURCE_SHA" "$normalized"
          grep -Fxq "RBXL_BYTES=$EXPECTED_BYTES" "$normalized"
          grep -Fxq "SHA256=$EXPECTED_SHA256" "$normalized"
          grep -Fxq 'SKATEGROUND=RUNTIME_BOUNDS_DRIVEN' "$normalized"
          grep -Fxq 'EXPECTED_RELOCATIONS=4' "$normalized"
          grep -Fxq 'PERIMETER_CLEARANCE_STUDS=12' "$normalized"
          grep -Fxq 'GAMEPLAY=UNCHANGED' "$normalized"
          grep -Fxq 'UI=UNCHANGED' "$normalized"
          grep -Fxq 'MUSIC=UNCHANGED' "$normalized"
          grep -Fxq 'ROADS_POOL_DEDICATION=UNCHANGED' "$normalized"
          mapfile -t places < <(find "$RUNNER_TEMP/asc-v112-qc" -type f -name '*.rbxl' -print)
          [[ ${#places[@]} -eq 1 ]] || { find "$RUNNER_TEMP/asc-v112-qc" -maxdepth 3 -type f -print; echo "Expected exactly one RBXL, found ${#places[@]}"; exit 30; }
          place="${places[0]}"
          bytes=$(stat -c%s "$place")
          sha=$(sha256sum "$place" | awk '{print $1}')
          [[ "$bytes" == "$EXPECTED_BYTES" ]] || { echo "Byte mismatch: $bytes expected=$EXPECTED_BYTES"; exit 31; }
          [[ "$sha" == "$EXPECTED_SHA256" ]] || { echo "SHA256 mismatch: $sha expected=$EXPECTED_SHA256"; exit 32; }
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "EXACT QC ARTIFACT PASS bytes=$bytes sha256=$sha"

      - name: Publish V1.1.2 LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          success=0
          for attempt in 1 2 3 4; do
            response="$RUNNER_TEMP/asc-publish-response-$attempt.json"
            http=$(curl -sS --http1.1 --location --connect-timeout 30 --max-time 180 -o "$response" -w '%{http_code}' -X POST "$url" -H "x-api-key: $ROBLOX_API_KEY" -H 'Content-Type: application/octet-stream' --data-binary "@$PLACE_FILE" || true)
            body=$(cat "$response" 2>/dev/null || true)
            if [[ "$http" =~ ^2[0-9][0-9]$ ]]; then
              cp "$response" "$RUNNER_TEMP/asc-publish-response.json"
              echo "ROBLOX UPLOAD PASS attempt=$attempt http=$http"
              success=1
              break
            fi
            echo "ROBLOX UPLOAD attempt=$attempt HTTP $http: $body"
            if [[ "$body" != *'Request upload was interrupted before completion.'* ]]; then
              echo 'Non-transient Roblox publish error; stopping retries'
              exit 40
            fi
            sleep $((attempt * 3))
          done
          [[ "$success" == '1' ]] || { echo 'Roblox upload interrupted on all retry attempts'; exit 42; }
          body=$(cat "$RUNNER_TEMP/asc-publish-response.json")
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/asc-publish-response.json")
          [[ -n "$version" && "$version" =~ ^[0-9]+$ ]] || { echo "Missing/invalid versionNumber: $body"; exit 41; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist V1.1.2 LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          receipt='deploy-status/after-school-city-publish-skatepark-light-clearance-v1-1-2.json'
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'SKATEPARK_LIGHT_CLEARANCE_V1_1_2' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg baseLiveCommit "$BASE_LIVE_SHA" \
            --arg qcRunId "$QC_RUN_ID" \
            --arg qcArtifactId "$QC_ARTIFACT_ID" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,baseLiveCommit:$baseLiveCommit,qcRunId:$qcRunId,qcArtifactId:($qcArtifactId|tonumber),universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"V1.1.2 exact QC-locked Skatepark Light Clearance hotfix. Relocates the four legacy streetlights detected inside the runtime SkateGround footprint to outside the play perimeter with 12-stud clearance. V1.1 gameplay, UI, music, roads, pool and dedication remain unchanged."}' > "$receipt"
          cat "$receipt"
          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "$receipt"
          git commit -m 'Record After School City V1.1.2 LIVE publish [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; }
            if git push origin HEAD:main; then
              echo "Receipt push succeeded attempt=$attempt"
              exit 0
            fi
            echo "Receipt push retry attempt=$attempt"
            sleep $((attempt * 2))
          done
          echo 'Failed to persist V1.1.2 LIVE receipt after retries'
          exit 50
