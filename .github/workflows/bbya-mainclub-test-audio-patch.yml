name: BBYA Main Club Test Audio Patch

on:
  push:
    branches:
      - bbya/mainclub-test-audio-134928414278364
    paths:
      - '.github/workflows/bbya-mainclub-test-audio-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: bbya/mainclub-test-audio-134928414278364
    steps:
      - uses: actions/checkout@v4

      - name: Patch and commit exactly one approved Main Club track via Contents API
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='maps/bbya-social-hub/30-club-systems.server.lua'
          $asset='134928414278364'
          $line=' {title="Untungnya Hidup Harus Tetap Berjalan (Pop Punk Cover)",id="134928414278364",style="pop-punk"},'
          $marker='-- MAIN_PROGRESSIVE_UPLOAD_END'
          $text=Get-Content $path -Raw
          if($text -notmatch [regex]::Escape($asset)){
            $count=([regex]::Matches($text,[regex]::Escape($marker))).Count
            if($count -ne 1){throw "EXPECTED_ONE_PLAYLIST_MARKER_FOUND_$count"}
            $text=$text.Replace($marker,"$line`r`n$marker")
          }
          $assetCount=([regex]::Matches($text,[regex]::Escape($asset))).Count
          if($assetCount -ne 1){throw "EXPECTED_ONE_TEST_ASSET_FOUND_$assetCount"}
          if($text -notmatch 'MAIN_PROGRESSIVE_DUAL_DECK_V8'){throw 'MAIN_AUDIO_AUTHORITY_MARKER_MISSING'}

          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          $encodedPath=[uri]::EscapeDataString($path).Replace('%2F','/')
          $metaUri="https://api.github.com/repos/$env:REPO/contents/$encodedPath?ref=$([uri]::EscapeDataString($env:BRANCH))"
          $meta=Invoke-RestMethod -Method Get -Uri $metaUri -Headers $headers
          $bytes=[Text.Encoding]::UTF8.GetBytes($text)
          $b64=[Convert]::ToBase64String($bytes)
          $body=@{
            message='Add approved one-track Main Club playback test [skip ci]'
            content=$b64
            sha=[string]$meta.sha
            branch=$env:BRANCH
          } | ConvertTo-Json -Compress
          $putUri="https://api.github.com/repos/$env:REPO/contents/$encodedPath"
          $result=Invoke-RestMethod -Method Put -Uri $putUri -Headers $headers -ContentType 'application/json' -Body $body
          Write-Host "SOURCE_COMMIT=$($result.commit.sha)"
          Write-Host "CONTENT_SHA=$($result.content.sha)"
          Write-Host "ASSET_PATCHED_ONCE=$asset"
