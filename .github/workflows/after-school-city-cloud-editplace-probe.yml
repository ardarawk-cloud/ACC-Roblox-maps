name: After School City Cloud EditPlace Auth Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-cloud-editplace-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    steps:
      - name: Open live ASC through Studio EditPlace
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class ASCProbeWin {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd,int nCmdShow);
          }
          "@
          $before=@(Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue|Select-Object -ExpandProperty Id)
          $roots=@((Join-Path $env:LOCALAPPDATA 'Roblox\Versions'),'C:\Program Files\Roblox\Versions','C:\Program Files (x86)\Roblox\Versions')
          $exe=$null
          foreach($r in $roots){
            if(-not (Test-Path $r)){continue}
            $c=Get-ChildItem $r -Filter RobloxStudioBeta.exe -File -Recurse -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 1
            if($c){$exe=$c.FullName;break}
          }
          if(-not $exe){throw 'RobloxStudioBeta.exe not found'}
          Start-Process -FilePath $exe -ArgumentList '--task','EditPlace','--placeId','121603385909425','--universeId','10745359869'|Out-Null
          $deadline=(Get-Date).AddSeconds(60)
          $proc=$null
          do{
            Start-Sleep -Seconds 2
            $proc=Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue|Where-Object {$before -notcontains $_.Id -and $_.MainWindowHandle -ne 0}|Sort-Object StartTime -Descending|Select-Object -First 1
          }while(-not $proc -and (Get-Date)-lt $deadline)
          if(-not $proc){throw 'EditPlace Studio window did not appear'}
          [ASCProbeWin]::ShowWindow([IntPtr]$proc.MainWindowHandle,9)|Out-Null
          [ASCProbeWin]::SetForegroundWindow([IntPtr]$proc.MainWindowHandle)|Out-Null
          Start-Sleep -Seconds 20
          $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp=New-Object System.Drawing.Bitmap($b.Width,$b.Height)
          $g=[System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
          $path=Join-Path $env:GITHUB_WORKSPACE 'asc-editplace-probe.png'
          $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose();$bmp.Dispose()
          "ASC_PROBE_PID=$($proc.Id)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload EditPlace probe screenshot
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-editplace-auth-probe
          path: asc-editplace-probe.png
          if-no-files-found: error
          retention-days: 2

      - name: Close probe Studio
        if: always()
        shell: powershell
        run: |
          if($env:ASC_PROBE_PID){try{Stop-Process -Id ([int]$env:ASC_PROBE_PID) -Force -ErrorAction SilentlyContinue}catch{}}
