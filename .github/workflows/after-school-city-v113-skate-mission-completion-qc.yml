name: After School City V1.1.3 Skate Mission Completion QC

on:
  push:
    branches: [after-school-city/v113-skate-mission-completion]
    paths:
      - '.github/workflows/after-school-city-v113-skate-mission-completion-qc.yml'
      - 'maps/after-school-city/after-school-city.activity-config.lua'
      - 'maps/after-school-city/after-school-city.activities.server.lua'
      - 'maps/after-school-city/after-school-city.activities.client.lua'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact v48 source and narrow diff gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '0df86eebafec37054a26db434b5d46c37e2fee2c'
          git cat-file -e "$base^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'V1.1.2 v48 LIVE source unavailable' }
          $mergeBase = (git merge-base $base $env:GITHUB_SHA).Trim()
          if($mergeBase -ne $base){ throw "Candidate is not based on exact v48 LIVE source: $mergeBase" }
          $allowed = @(
            '.github/workflows/after-school-city-v113-skate-mission-completion-qc.yml',
            'maps/after-school-city/after-school-city.activity-config.lua',
            'maps/after-school-city/after-school-city.activities.server.lua',
            'maps/after-school-city/after-school-city.activities.client.lua'
          )
          $changed = @(git diff --name-only $base $env:GITHUB_SHA)
          if($changed.Count -ne 4){ throw "Expected exactly 4 files, got $($changed.Count): $($changed -join ', ')" }
          foreach($path in $changed){ if($allowed -notcontains $path){ throw "Scope violation: $path" } }
          foreach($path in $allowed){ if($changed -notcontains $path){ throw "Missing required change: $path" } }
          Write-Host "V1.1.3 NARROW DIFF PASS source=$env:GITHUB_SHA"

      - name: Skate mission static checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content 'maps/after-school-city/after-school-city.activity-config.lua' -Raw
          $server = Get-Content 'maps/after-school-city/after-school-city.activities.server.lua' -Raw
          $client = Get-Content 'maps/after-school-city/after-school-city.activities.client.lua' -Raw
          foreach($token in @(
            '1.1.3-skate-mission-completion-1',
            'RequireSkateboard = true',
            'createBoardModel',
            'SkateboardDisplay',
            'ASC_SkateboardActive',
            'ASC_Skateboard',
            'SkateboardActive = cfg.RequireSkateboard == true',
            'Target = checkpoints[1]',
            'Target = session.Checkpoints[session.Step]',
            'ASC_ActiveSkateCheckpoint_Local',
            'showCheckpointMarker',
            'typeof(target) ~= "Vector3"',
            'clearCheckpointMarker()'
          )){
            if(($cfg + $server + $client) -notmatch [regex]::Escape($token)){ throw "Missing V1.1.3 marker: $token" }
          }
          if($server -match 'DataStoreService|MarketplaceService'){ throw 'V1.1.3 may not add persistence/monetization authority' }
          if($client -match 'MarketplaceService'){ throw 'V1.1.3 may not add monetization authority' }
          Write-Host 'V1.1.3 SKATE MISSION STATIC QC PASS'

      - name: Pool and delivery regression guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '0df86eebafec37054a26db434b5d46c37e2fee2c'
          $diff = git diff --unified=0 $base $env:GITHUB_SHA -- `
            'maps/after-school-city/after-school-city.activity-config.lua' `
            'maps/after-school-city/after-school-city.activities.server.lua' `
            'maps/after-school-city/after-school-city.activities.client.lua'
          $changedLines = @($diff -split "`n" | Where-Object { ($_ -match '^[+-][^+-]') })
          foreach($line in $changedLines){
            if($line -match 'POOL_LAPS|CITY_DELIVERY|poolPoints|deliveryTarget|poolPrompt|deliveryPrompt|RequireSwimming|Pool Laps|City Delivery'){
              throw "Pool/Delivery scope violation: $line"
            }
          }
          Write-Host 'V1.1.3 POOL/DELIVERY UNCHANGED GUARD PASS'

      - name: Protected authority unchanged
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '0df86eebafec37054a26db434b5d46c37e2fee2c'
          foreach($lockedPath in @(
            'maps/after-school-city/default.project.json',
            'maps/after-school-city/after-school-city.world.server.lua',
            'maps/after-school-city/after-school-city.streetlight-geometry-hotfix-v111.server.lua',
            'maps/after-school-city/after-school-city.skatepark-light-clearance-v112.server.lua',
            'maps/after-school-city/after-school-city.gameplay-service.lua',
            'maps/after-school-city/after-school-city.gameplay-config.lua',
            'maps/after-school-city/after-school-city.gameplay-bootstrap.server.lua',
            'maps/after-school-city/after-school-city.gameplay-hud.client.lua',
            'maps/after-school-city/after-school-city.ui-glass-v102.client.lua',
            'maps/after-school-city/after-school-city.music-player.client.lua',
            'maps/after-school-city/after-school-city.music-config.lua',
            'maps/after-school-city/after-school-city.intro.client.lua',
            'maps/after-school-city/after-school-city.swimmable-pool.server.lua'
          )){
            $pathDiff = git diff --name-only $base $env:GITHUB_SHA -- $lockedPath
            if($pathDiff){ throw "Protected source changed: $lockedPath" }
          }
          Write-Host 'V1.1.3 PROTECTED AUTHORITY PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
          $zip = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
          if(-not $exe){ throw 'rojo.exe missing' }
          $version = (& $exe.FullName --version | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $version -notmatch '7\.7\.0'){ throw "Unexpected Rojo version: $version" }
          "ROJO_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ROJO_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact V1.1.3 candidate and hash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'asc-v113-qc'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $place = Join-Path $out 'after-school-city-v113.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $place)){ throw 'Rojo build failed' }
          $bytes = (Get-Item $place).Length
          if($bytes -lt 1024){ throw "RBXL too small: $bytes" }
          $hash = (Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = @(
            'STATUS=QC_PASSED',
            'MODE=SKATE_MISSION_COMPLETION_V1_1_3',
            'BASE_LIVE_COMMIT=0df86eebafec37054a26db434b5d46c37e2fee2c',
            "SOURCE_COMMIT=$env:GITHUB_SHA",
            "ROJO=$env:ROJO_VERSION",
            "RBXL_BYTES=$bytes",
            "SHA256=$hash",
            'SKATEBOARD=SERVER_OWNED_AUTOMOUNT',
            'SKATE_VALIDATION=SERVER_REQUIRED',
            'CHECKPOINT_GUIDANCE=LOCAL_ACTIVE_ONLY',
            'CHECKPOINT_COUNT=3',
            'POOL_DELIVERY=UNCHANGED',
            'PERSISTENCE=UNCHANGED',
            'MUSIC=UNCHANGED',
            'MAP_LIGHTING_ROADS_DEDICATION=UNCHANGED'
          )
          $receipt | Set-Content (Join-Path $out 'qc-receipt.txt') -Encoding ascii
          $receipt | ForEach-Object { Write-Host $_ }
          "QC_OUT_DIR=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exact V1.1.3 QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v113-qc-${{ github.sha }}
          path: ${{ env.QC_OUT_DIR }}
          if-no-files-found: error
          retention-days: 7
