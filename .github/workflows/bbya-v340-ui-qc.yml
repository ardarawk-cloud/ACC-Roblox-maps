name: BBYA v343 UI Input QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/**'
      - '.github/workflows/bbya-v340-ui-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/cache@v4
        id: rojo-cache
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}
      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked
      - name: Build BBYA place
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-v343-ui.rbxl
          test -s /tmp/bbya-v343-ui.rbxl
      - name: Validate UI input fixes
        shell: bash
        run: |
          set -euo pipefail
          travel='maps/bbya-social-hub/76-travel-ui-patch.client.lua'
          owner='maps/bbya-social-hub/91-owner-ui.client.lua'
          freecam='maps/bbya-social-hub/92-freecam.client.lua'
          dock='maps/bbya-social-hub/56-dock-stability.client.lua'
          dash='maps/bbya-social-hub/93-dashboard-structural.client.lua'

          grep -q 'TRAVEL UI PATCH v9' "$travel"
          grep -q 'SetCoreGuiEnabled(Enum.CoreGuiType.Backpack,false)' "$travel"
          grep -q 'SetCoreGuiEnabled(Enum.CoreGuiType.Backpack,backpackRestore)' "$travel"
          grep -q 'safeBottom=phone and 96 or 12' "$travel"
          grep -q 'go.Active=true' "$travel"
          grep -q 'go.ZIndex=20' "$travel"
          grep -q 'AutomaticCanvasSize=Enum.AutomaticSize.None' "$travel"
          grep -q 'CanvasPosition' "$travel"
          if grep -q 'panel.Size=' "$travel"; then
            echo 'Travel must not resize HubPanel' >&2
            exit 1
          fi

          grep -q 'OWNER STABLE UI v5' "$owner"
          grep -q 'FREE CAMERA v2' "$freecam"
          grep -q 'topY=UserInputService.TouchEnabled and 36 or 14' "$dock"
          grep -q 'topY=touch and 36 or 14' "$owner"
          grep -q 'dockY=touch and 36 or 14' "$dash"
