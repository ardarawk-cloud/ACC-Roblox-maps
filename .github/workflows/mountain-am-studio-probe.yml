name: Mountain AM STUDIO Publish
# trigger: mountain-v6.2-phase1-spawn-safety-20260829

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mountain-am-studio-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mountain-v62-phase1-publish
  cancel-in-progress: false

jobs:
  selfhosted_probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Prove Windows self-hosted runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "MOUNTAIN_SELF_HOSTED_OK"
          Write-Host "computer=$env:COMPUTERNAME sha=$env:GITHUB_SHA"
          node --version

  publish:
    needs: selfhosted_probe
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout exact v6.2 mountain source without git
        uses: actions/checkout@v4
        with:
          ref: agent/mountain-master-v3
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve exact source commit through GitHub REST
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/branches/agent/mountain-master-v3"
          $branch=Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
          if(-not $branch.commit.sha){throw 'Mountain source commit resolution failed'}
          "MOUNTAIN_SOURCE_COMMIT=$($branch.commit.sha)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MOUNTAIN_SOURCE_COMMIT=$($branch.commit.sha)"

      - name: Build CLEAN v6.2 Phase1 RBXLX
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/inject-mountain.js mountain-social
          if($LASTEXITCODE -ne 0){throw 'Mountain v6.2 injection failed'}
          $place='maps/mountain-social/place.rbxlx'
          if(-not (Test-Path $place)){throw 'v6.2 place missing'}
          if((Get-Item $place).Length -lt 4096){throw 'v6.2 place unexpectedly small'}
          $text=Get-Content $place -Raw
          foreach($required in @(
            'ACC_Mountain_V62_Phase1',
            'v6.2-phase1-spawn-safety',
            'ACC_BootstrapSpawn',
            'ACC_BootstrapPad',
            'ACC_SpawnGate',
            'ACC_SpawnRescueActive',
            'v6.2-static-bootstrap',
            'TERRAIN_FIRST_SINGLE_SOURCE',
            'CompositionPassVersion',
            'DENSE_VILLAGE_ROAD',
            'VehicleRoadEndsBeforeTrail',
            'TrailBranchesFromRoad',
            'SPAWN_TO_CP1_ONLY',
            'mobile-tuned-v6.1'
          )){
            if($text -notmatch [regex]::Escape($required)){throw "Missing v6.2 marker: $required"}
          }
          foreach($forbidden in @('ApproachRoad_','LowlandMasterV52','LowlandRouteV54','ExpeditionV43','UpperScenicV45')){
            if($text -match [regex]::Escape($forbidden)){throw "LEGACY_GEOMETRY_BLOCKED: $forbidden"}
          }
          Write-Host "MOUNTAIN_V62_BUILD_PASS bytes=$((Get-Item $place).Length)"

      - name: Publish mountain with AM STUDIO
        id: publish
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $log=Join-Path $env:RUNNER_TEMP 'mountain-v62-publish.log'
          $receipt=Join-Path $env:RUNNER_TEMP 'mountain-am-studio.txt'
          node scripts/publish-mountain-closed-test.js *> $log
          $code=$LASTEXITCODE
          $status=if($code -eq 0){'PUBLISHED'}else{'FAILED'}
          $lines=@(
            "status=$status",
            'secret=AM_STUDIO',
            'build=v6.2-phase1-spawn-safety',
            "sourceCommit=$env:MOUNTAIN_SOURCE_COMMIT",
            'universeId=4187755690',
            'placeId=11832985967',
            "exitCode=$code"
          )
          if(Test-Path $log){$lines += (Get-Content $log | Select-Object -Last 12 | ForEach-Object {"log=$_"})}
          $lines | Set-Content -Path $receipt -Encoding utf8
          if(Test-Path $log){Get-Content $log}
          if($code -ne 0){exit $code}

      - name: Persist publish receipt to main through GitHub REST
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Join-Path $env:RUNNER_TEMP 'mountain-am-studio.txt'
          if(-not (Test-Path $receipt)){
            @(
              'status=NO_RESULT',
              'secret=AM_STUDIO',
              'build=v6.2-phase1-spawn-safety',
              "sourceCommit=$env:MOUNTAIN_SOURCE_COMMIT",
              'universeId=4187755690',
              'placeId=11832985967'
            ) | Set-Content -Path $receipt -Encoding utf8
          }
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/mountain-am-studio.txt"
          $sha=$null
          try {
            $existing=Invoke-RestMethod -Headers $headers -Uri "$api`?ref=main" -Method Get
            $sha=$existing.sha
          } catch {
            $statusCode=$_.Exception.Response.StatusCode.value__
            if($statusCode -ne 404){throw}
          }
          $raw=Get-Content $receipt -Raw
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($raw))
          $payload=@{
            message='Record AM STUDIO mountain publish receipt [skip ci]'
            content=$b64
            branch='main'
          }
          if($sha){$payload.sha=$sha}
          $body=$payload | ConvertTo-Json -Depth 5
          $result=Invoke-RestMethod -Headers $headers -Uri $api -Method Put -ContentType 'application/json' -Body $body
          Write-Host "MOUNTAIN_RECEIPT_COMMIT=$($result.commit.sha)"

      - name: Enforce publish success
        if: always()
        shell: powershell
        run: |
          $receipt=Join-Path $env:RUNNER_TEMP 'mountain-am-studio.txt'
          if(-not (Test-Path $receipt)){throw 'Mountain receipt missing'}
          $text=Get-Content $receipt -Raw
          if($text -notmatch '(?m)^status=PUBLISHED\s*$'){throw 'Mountain v6.2 publish not PUBLISHED'}
          if($text -notmatch '(?m)^build=v6\.2-phase1-spawn-safety\s*$'){throw 'Mountain v6.2 receipt build mismatch'}
          Write-Host 'MOUNTAIN_V62_PUBLISH_PASS'
