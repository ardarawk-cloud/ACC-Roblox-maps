name: Mountain AM STUDIO Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mountain-am-studio-probe.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load complete mountain source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/mountain-master-v3
          git checkout origin/agent/mountain-master-v3 -- maps/mountain-social maps/registry.json scripts/inject-mountain.js scripts/publish-mountain-closed-test.js

      - name: Retarget and build mountain RBXLX
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/10744139279/4187755690/g; s/82661754996018/11832985967/g' scripts/inject-mountain.js
          node scripts/inject-mountain.js mountain-social
          test -s maps/mountain-social/place.rbxlx
          grep -q '<roblox' maps/mountain-social/place.rbxlx
          grep -q 'ACC_Mountain_World' maps/mountain-social/place.rbxlx
          echo "RBXLX bytes: $(wc -c < maps/mountain-social/place.rbxlx)"

      - name: Publish mountain with AM STUDIO
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          node scripts/publish-mountain-closed-test.js
