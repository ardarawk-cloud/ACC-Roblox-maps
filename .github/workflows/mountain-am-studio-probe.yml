name: Mountain AM STUDIO Publish Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mountain-am-studio-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load mountain source
        shell: bash
        run: |
          git fetch origin agent/mountain-master-v3
          git checkout origin/agent/mountain-master-v3 -- maps/mountain-social/place.rbxlx maps/registry.json scripts/publish-mountain-closed-test.js

      - name: Publish mountain with current key
        id: publish
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        shell: bash
        run: |
          set +e
          node scripts/publish-mountain-closed-test.js > /tmp/mountain-publish.log 2>&1
          code=$?
          set -e
          mkdir -p deploy-status
          if [ "$code" -eq 0 ]; then
            printf 'status=PUBLISHED\nuniverseId=4187755690\nplaceId=11832985967\n' > deploy-status/mountain-am-studio-probe.txt
          else
            printf 'status=FAILED\nuniverseId=4187755690\nplaceId=11832985967\nexitCode=%s\n' "$code" > deploy-status/mountain-am-studio-probe.txt
            tail -n 8 /tmp/mountain-publish.log | sed 's/^/log=/' >> deploy-status/mountain-am-studio-probe.txt
          fi
          cat /tmp/mountain-publish.log || true
          exit "$code"

      - name: Persist probe result
        if: always()
        shell: bash
        run: |
          git reset
          git add deploy-status/mountain-am-studio-probe.txt
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record mountain AM STUDIO probe [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce publish success
        if: always()
        shell: bash
        run: grep -q '^status=PUBLISHED$' deploy-status/mountain-am-studio-probe.txt
