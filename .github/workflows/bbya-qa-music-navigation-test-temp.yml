name: BBYA QA Music Navigation TEST

on:
  push:
    branches:
      - 'bbya/ui/music-navigation-visibility-fix'
    paths:
      - '.github/workflows/bbya-qa-music-navigation-test-temp.yml'

permissions:
  contents: read

env:
  TARGET_SOURCE: 650a622c9a6b317e2432eb0d707f4d34566dfad3
  TEST_UNIVERSE: '10762005984'
  TEST_PLACE: '124607344716828'

jobs:
  qa-test-publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'bbya-qa-music-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'bbya-qa-music-source'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/$env:TARGET_SOURCE" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $repo=Get-ChildItem $dir -Directory | Select-Object -First 1
          if(-not $repo){throw 'Exact candidate source missing'}
          Get-ChildItem $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $repo.FullName -Force | ForEach-Object { Copy-Item $_.FullName $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "EXACT_CANDIDATE_SOURCE=$env:TARGET_SOURCE"

      - name: Static QA candidate checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/111-compact-secondary-panels.client.lua'
          $a=Get-Content $p -Raw
          foreach($m in @('BBYAMusicSuiteAdapterV3','Slot_MUSIC','GetDescendants','BBYAMusicSuiteV1')){
            if(-not $a.Contains($m)){throw "Missing MUSIC navigation marker: $m"}
          }
          foreach($bad in @('SoundId','.Volume =','SoundGroup','PlaybackSpeed')){
            if($a.Contains($bad)){throw "Forbidden audio mutation marker in UI candidate: $bad"}
          }
          $project=Get-Content 'maps/bbya-social-hub/default.project.json' -Raw
          if(-not $project.Contains('111-compact-secondary-panels.client.lua')){throw 'Candidate UI file is not Rojo-mapped'}
          Write-Host 'BBYA_QA_MUSIC_NAV_STATIC_PASS'

      - name: Build exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $z=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive $z -DestinationPath $toolDir -Force
          }
          $version=& $rojo --version
          if($version -notmatch '7\.7\.0'){throw 'Rojo 7.7.0 required'}
          $out=Join-Path $env:RUNNER_TEMP 'bbya-qa-music-navigation-test.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Build failed'}
          $bytes=(Get-Item $out).Length
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "BBYA_QA_BUILD=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BBYA_QA_BYTES=$bytes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BBYA_QA_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "BBYA_QA_BUILD_PASS bytes=$bytes sha256=$sha"

      - name: Publish TEST place only
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ROBLOX_API_KEY){throw 'ROBLOX_OPEN_CLOUD_MASTER_V2 missing'}
          $url="https://apis.roblox.com/universes/v1/$env:TEST_UNIVERSE/places/$env:TEST_PLACE/versions?versionType=Published"
          $resp=& curl.exe --silent --show-error --fail-with-body --http1.1 --ipv4 --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --header 'Content-Type: application/octet-stream' --header 'Expect:' --data-binary "@$env:BBYA_QA_BUILD" $url
          if($LASTEXITCODE -ne 0){throw 'TEST publish failed'}
          $r=$resp|ConvertFrom-Json
          if(-not $r.versionNumber){throw 'TEST versionNumber missing'}
          Write-Host "BBYA_QA_MUSIC_TEST_PUBLISHED version=$($r.versionNumber) bytes=$env:BBYA_QA_BYTES sha256=$env:BBYA_QA_SHA256 candidate=$env:TARGET_SOURCE universe=$env:TEST_UNIVERSE place=$env:TEST_PLACE"
