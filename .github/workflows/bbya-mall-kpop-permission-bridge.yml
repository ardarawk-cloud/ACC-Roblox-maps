name: BBYA Mall KPOP Permission Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  permission-bridge:
    if: startsWith(github.event.issue.title, 'BBYA MALL KPOP PERMISSION')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy proven KPOP permission workflow for BBYA and dispatch
        shell: bash
        env:
          BRIDGE_TOKEN: ${{ secrets.BALI_ENTERTAIMENT_TOKEN }}
        run: |
          set -euo pipefail
          TEMPLATE='https://api.github.com/repos/balientertaiment-web/Roblox-backup-publish/contents/.github/workflows/asc-kpop-permission.yml'
          TARGET='https://api.github.com/repos/balientertaiment-web/Roblox-backup-publish/contents/.github/workflows/bbya-mall-kpop-permission.yml'
          curl -fsSL -H "Authorization: Bearer $BRIDGE_TOKEN" -H 'Accept: application/vnd.github+json' "$TEMPLATE?ref=main" > /tmp/template.json
          jq -r '.content' /tmp/template.json | tr -d '\n' | base64 -d > /tmp/workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/workflow.yml')
          s=p.read_text()
          replacements=[
            ('name: ASC KPOP Audio Permission','name: BBYA Mall KPOP Audio Permission'),
            ("UNIVERSE_ID: '10745359869'","UNIVERSE_ID: '8116636513'"),
            ('Grant KPOP bank audio use to After School City','Grant KPOP bank audio use to BBYA Social Hub Mall'),
            ('asc-kpop-permission-result.json','bbya-mall-kpop-permission-result.json'),
            ('asc-kpop-permission-result','bbya-mall-kpop-permission-result'),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('TEMPLATE_TOKEN_NOT_FOUND:'+old)
              s=s.replace(old,new)
          p.write_text(s)
          PY
          GET_CODE="$(curl -sS -o /tmp/current.json -w '%{http_code}' -H "Authorization: Bearer $BRIDGE_TOKEN" -H 'Accept: application/vnd.github+json' "$TARGET?ref=main")"
          SHA=''
          if [ "$GET_CODE" = '200' ]; then SHA="$(jq -r '.sha' /tmp/current.json)"; elif [ "$GET_CODE" != '404' ]; then cat /tmp/current.json; exit 20; fi
          CONTENT="$(base64 -w0 /tmp/workflow.yml)"
          if [ -n "$SHA" ]; then
            PAYLOAD="$(jq -nc --arg msg 'Configure BBYA Mall KPOP permission' --arg content "$CONTENT" --arg branch 'main' --arg sha "$SHA" '{message:$msg,content:$content,branch:$branch,sha:$sha}')"
          else
            PAYLOAD="$(jq -nc --arg msg 'Configure BBYA Mall KPOP permission' --arg content "$CONTENT" --arg branch 'main' '{message:$msg,content:$content,branch:$branch}')"
          fi
          PUT_CODE="$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $BRIDGE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$TARGET" -d "$PAYLOAD")"
          if [ "$PUT_CODE" != '200' ] && [ "$PUT_CODE" != '201' ]; then cat /tmp/put.json; exit 21; fi
          sleep 2
          DISPATCH_CODE="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST -H "Authorization: Bearer $BRIDGE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' 'https://api.github.com/repos/balientertaiment-web/Roblox-backup-publish/actions/workflows/bbya-mall-kpop-permission.yml/dispatches' -d '{"ref":"main"}')"
          [ "$DISPATCH_CODE" = '204' ] || { cat /tmp/dispatch.json; exit 22; }
          echo 'BBYA_MALL_KPOP_PERMISSION_DISPATCHED'

      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body: ok ? 'BBYA_MALL_KPOP_PERMISSION_DISPATCHED | publish=false' : 'BBYA_MALL_KPOP_PERMISSION_BRIDGE_FAILED | publish=false'});
