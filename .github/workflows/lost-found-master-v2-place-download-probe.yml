name: LOST FOUND MASTER V2 Place Download Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lost-found-master-v2-place-download-probe.yml'
      - '.lost-found-master-v2-place-download-probe-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      PLACE_ID: '93699016600671'
      BASE_VERSION: '59'
    steps:
      - name: Validate MASTER V2 and probe exact live place download
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROBLOX_OPEN_CLOUD_MASTER_V2 missing'; exit 10; }

          introspect="$RUNNER_TEMP/introspect.json"
          code=$(curl -sS -o "$introspect" -w '%{http_code}' -X POST \
            'https://apis.roblox.com/api-keys/v1/introspect' \
            -H 'Content-Type: application/json' \
            --data "{\"apiKey\":\"$ROBLOX_API_KEY\"}")
          [[ "$code" == 200 ]] || { echo "INTROSPECT_HTTP_$code"; exit 11; }
          owner=$(jq -r '.authorizedUserId // empty' "$introspect")
          [[ -n "$owner" ]] || { echo 'KEY_OWNER_MISSING'; exit 12; }
          echo "MASTER_V2_KEY_PASS owner=$owner"
          echo 'MASTER_V2_SCOPES:'
          jq -r '.scopes[]? | "  \(.name):\((.operations // [])|join(","))"' "$introspect"

          out="$RUNNER_TEMP/lost-found-v59.rbxl"
          success=''

          try_delivery() {
            local label="$1" url="$2" header_mode="$3"
            local tmp="$RUNNER_TEMP/${label}.response"
            local code
            if [[ "$header_mode" == key ]]; then
              code=$(curl -sS --location -o "$tmp" -w '%{http_code}' -H "x-api-key: $ROBLOX_API_KEY" "$url")
            else
              code=$(curl -sS --location -o "$tmp" -w '%{http_code}' "$url")
            fi
            echo "${label}_HTTP=$code"
            [[ "$code" == 200 ]] || return 1

            if jq -e . "$tmp" >/dev/null 2>&1; then
              local location
              location=$(jq -r '.location // .locations[0].location // .locations[0].url // empty' "$tmp")
              [[ -n "$location" ]] || { echo "${label}_LOCATION_MISSING"; jq -c 'keys' "$tmp"; return 1; }
              local host
              host=$(python3 - "$location" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.urlparse(sys.argv[1]).netloc)
          PY
              )
              echo "${label}_SIGNED_HOST=$host"
              curl -fsSL "$location" -o "$out" || return 1
            else
              cp "$tmp" "$out"
            fi
            local bytes
            bytes=$(stat -c%s "$out")
            (( bytes > 10000 )) || { echo "${label}_PLACE_TOO_SMALL=$bytes"; return 1; }
            success="$label"
            return 0
          }

          try_delivery OPEN_CLOUD_KEY \
            "https://apis.roblox.com/asset-delivery-api/v1/assetId/${PLACE_ID}/version/${BASE_VERSION}" key || true

          if [[ -z "$success" ]]; then
            try_delivery DIRECT_V2 \
              "https://assetdelivery.roblox.com/v2/assetId/${PLACE_ID}/version/${BASE_VERSION}" none || true
          fi

          if [[ -z "$success" ]]; then
            try_delivery DIRECT_V1 \
              "https://assetdelivery.roblox.com/v1/assetId/${PLACE_ID}/version/${BASE_VERSION}" none || true
          fi

          [[ -n "$success" ]] || { echo 'ALL_PLACE_DELIVERY_ROUTES_FAILED'; exit 20; }
          place_bytes=$(stat -c%s "$out")
          sha=$(sha256sum "$out" | awk '{print $1}')
          prefix=$(xxd -p -l 16 "$out" | tr -d '\n')
          echo "LIVE_V59_DOWNLOAD_PASS route=$success bytes=$place_bytes sha256=$sha prefix=$prefix"
