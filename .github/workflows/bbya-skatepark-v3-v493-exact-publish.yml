name: BBYA Skateboard V4 Exact V497 Publish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bbya-skatepark-v3-v493-exact-publish.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-skatepark-v3-v493-exact-publish.yml'
  workflow_dispatch:

concurrency:
  group: bbya-skateboard-v4-v497-exact-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  BBYA_V497_BASE_SHA: 32b4c3775b48832b1a216366c6a1c685ac3af0ef
  BBYA_SKATE_V4_SOURCE_SHA: de0eac79a96284c27b7dbd7cebcd32d6859a63f7

jobs:
  exact-skateboard-v4:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout publisher authority
        uses: actions/checkout@v4

      - name: Prove source is exact v497 plus only Skateboard v4 files
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='BBYA-Skateboard-V4-Publisher'}
          $repo=$env:GITHUB_REPOSITORY
          $base=$env:BBYA_V497_BASE_SHA
          $source=$env:BBYA_SKATE_V4_SOURCE_SHA
          foreach($sha in @($base,$source)){
            if($sha -notmatch '^[0-9a-f]{40}$'){throw "Invalid SHA: $sha"}
            $c=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/commits/$sha"
            if([string]$c.sha -ne $sha){throw "Commit unavailable: $sha"}
          }
          $cmp=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/compare/$base...$source"
          if([string]$cmp.merge_base_commit.sha -ne $base){throw 'Skateboard v4 source is not based on exact live v497 source'}
          $files=@($cmp.files | ForEach-Object {[string]$_.filename} | Sort-Object)
          $expected=@(
            'maps/bbya-social-hub/135-skateboard-controls.client.lua',
            'maps/bbya-social-hub/79-skatepark-upgrade.server.lua',
            'maps/bbya-social-hub/default.project.json'
          ) | Sort-Object
          if($files.Count -ne 3){throw "Expected exactly 3 changed files, got $($files.Count): $($files -join ', ')"}
          if(($files -join '|') -ne ($expected -join '|')){throw "Unexpected v4 source diff: $($files -join ', ')"}
          Write-Host "BBYA_SKATE_V4_DIFF_PASS base=$base source=$source files=$($files -join ',')"

      - name: Download exact v497-safe Skateboard v4 source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='BBYA-Skateboard-V4-Publisher'}
          $dir=Join-Path $env:RUNNER_TEMP 'bbya-skateboard-v4-v497-exact'
          $archive=Join-Path $env:RUNNER_TEMP 'bbya-skateboard-v4-v497-exact.tar.gz'
          if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
          if(Test-Path $archive){Remove-Item $archive -Force}
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/tarball/$env:BBYA_SKATE_V4_SOURCE_SHA" -OutFile $archive
          $tar=Get-Command tar.exe -ErrorAction SilentlyContinue
          if(-not $tar){$tar=Get-Command tar -ErrorAction SilentlyContinue}
          if(-not $tar){throw 'Windows tar unavailable'}
          & $tar.Source -xzf $archive -C $dir --strip-components=1
          if($LASTEXITCODE -ne 0){throw "tar extraction failed: $LASTEXITCODE"}
          if(-not (Test-Path (Join-Path $dir 'maps/bbya-social-hub/default.project.json'))){throw 'Exact BBYA project missing'}
          "BBYA_SOURCE_DIR=$dir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_SKATE_V4_SOURCE_READY source=$env:BBYA_SKATE_V4_SOURCE_SHA"

      - name: Hard gate audio stability and Skateboard v4
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $map=Join-Path $env:BBYA_SOURCE_DIR 'maps/bbya-social-hub'
          $audio=Get-Content (Join-Path $map '109-music-catalog-reset.server.lua') -Raw
          foreach($needle in @(
            'OPENING STABILITY AUTHORITY v5',
            'ACTIVE_VENUES_OPENING_STABILITY_V5',
            'BBYAMainPlaylistEnabled",true',
            'BBYAUndergroundPlaylistEnabled",true',
            'BBYAFunkotPlaylistEnabled",true',
            'BBYASkateparkPlaylistEnabled",true',
            'BBYARooftopPlaylistEnabled",true',
            'BBYAMusicCatalogReset",false'
          )){if($audio -notmatch [regex]::Escape($needle)){throw "Missing audio stability marker: $needle"}}
          foreach($forbidden in @('BBYAMusicCatalogReset",true','SoundService\.DescendantAdded','scrubSound','RESET_WITH_UNDERGROUND','disableOldAudioEngines')){
            if($audio -match $forbidden){throw "Destructive audio reset detected: $forbidden"}
          }
          $gameplay=Get-Content (Join-Path $map '79-skatepark-upgrade.server.lua') -Raw
          foreach($needle in @(
            'SKATEPARK UPGRADE v4',
            'V4_MOBILE_PROPER_BOARD',
            'BBYASkateControlV4',
            'ProperDeckSilhouette',
            'TAPERED_KICKTAIL_V4',
            'RIDEABLE_SKATEBOARD_V4_MOBILE',
            'seat.MaxSpeed=BOARD_SPEED'
          )){if($gameplay -notmatch [regex]::Escape($needle)){throw "Missing Skateboard v4 marker: $needle"}}
          if($gameplay -match 'SoundId|SoundGroup'){throw 'Skateboard v4 server unexpectedly contains audio authority mutation'}
          $client=Get-Content (Join-Path $map '135-skateboard-controls.client.lua') -Raw
          foreach($needle in @('SKATEBOARD MOBILE CONTROL BRIDGE v4','BBYASkateControlV4','ThrottleFloat','SteerFloat','FireServer')){
            if($client -notmatch [regex]::Escape($needle)){throw "Missing mobile control marker: $needle"}
          }
          $project=Get-Content (Join-Path $map 'default.project.json') -Raw
          if($project -notmatch [regex]::Escape('"SkateboardControlsV4"')){throw 'SkateboardControlsV4 project mount missing'}
          if($project -notmatch [regex]::Escape('135-skateboard-controls.client.lua')){throw 'Skateboard v4 client path not mounted'}
          Write-Host 'BBYA_SKATE_V4_AUDIO_MOBILE_SHAPE_GATE_PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-skate-v4-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-skate-v4-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact Skateboard v4 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-skateboard-v4-v497-safe.rbxl'
          Push-Location $env:BBYA_SOURCE_DIR
          try {
            & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
            if($LASTEXITCODE -ne 0){throw 'Rojo exact Skateboard v4 build failed'}
          } finally {Pop-Location}
          if(-not (Test-Path $place)){throw 'Skateboard v4 RBXL missing'}
          if((Get-Item $place).Length -lt 1024){throw 'Skateboard v4 RBXL unexpectedly small'}
          "BBYA_PLACE_FILE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_SKATE_V4_BUILD_PASS bytes=$((Get-Item $place).Length) source=$env:BBYA_SKATE_V4_SOURCE_SHA"

      - name: Publish exact Skateboard v4 source
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'AM_STUDIO publish secret unavailable'}
          Push-Location $env:BBYA_SOURCE_DIR
          try {
            $env:PLACE_FILE_OVERRIDE=$env:BBYA_PLACE_FILE
            $env:PUBLISH_RECEIPT_DIR='deploy-status-skateboard-v4-v497'
            $env:GITHUB_SHA=$env:BBYA_SKATE_V4_SOURCE_SHA
            node scripts/publish-map.js a-club
            if($LASTEXITCODE -ne 0){throw 'Roblox Skateboard v4 publish failed'}
          } finally {Pop-Location}

      - name: Verify PUBLISHED receipt
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=Join-Path $env:BBYA_SOURCE_DIR 'deploy-status-skateboard-v4-v497/a-club.json'
          if(-not (Test-Path $path)){throw 'Skateboard v4 receipt missing'}
          $r=Get-Content $path -Raw | ConvertFrom-Json
          if($r.status -ne 'PUBLISHED'){throw "Receipt status=$($r.status)"}
          if($r.sourceCommit -ne $env:BBYA_SKATE_V4_SOURCE_SHA){throw "Receipt source mismatch: $($r.sourceCommit)"}
          if([string]$r.universeId -ne '8116636513'){throw 'Universe mismatch'}
          if([string]$r.placeId -ne '131894120482837'){throw 'Place mismatch'}
          if(-not $r.response.versionNumber){throw 'versionNumber missing'}
          if([int]$r.response.versionNumber -le 497){throw "Expected version newer than v497, got v$($r.response.versionNumber)"}
          $tmp=Join-Path $env:RUNNER_TEMP 'bbya-skateboard-v4-v497-receipt.json'
          Copy-Item $path $tmp -Force
          "BBYA_RECEIPT_TMP=$tmp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BBYA_VERSION=$($r.response.versionNumber)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_SKATE_V4_PUBLISHED version=$($r.response.versionNumber) source=$($r.sourceCommit)"

      - name: Upload immutable receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bbya-skateboard-v4-v497-receipt-${{ env.BBYA_SKATE_V4_SOURCE_SHA }}
          path: ${{ env.BBYA_RECEIPT_TMP }}
          if-no-files-found: error
          retention-days: 30

      - name: Persist exact Skateboard v4 receipt
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $text=Get-Content $env:BBYA_RECEIPT_TMP -Raw
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='BBYA-Skateboard-V4-Publisher'}
          $repo=$env:GITHUB_REPOSITORY
          function Upsert([string]$path){
            $encoded=(($path.Split('/') | ForEach-Object {[Uri]::EscapeDataString($_)}) -join '/')
            $uri="https://api.github.com/repos/$repo/contents/$encoded"
            $sha=$null
            try {$existing=Invoke-RestMethod -Headers $headers -Uri ($uri+'?ref=main');$sha=[string]$existing.sha} catch {if([int]$_.Exception.Response.StatusCode -ne 404){throw}}
            $body=@{message="Record BBYA Skateboard v4 exact deploy v$env:BBYA_VERSION [skip ci]";content=$content;branch='main'}
            if($sha){$body.sha=$sha}
            Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Uri $uri -Body ($body|ConvertTo-Json -Depth 5)|Out-Null
          }
          Upsert 'deploy-status/a-club.json'
          Upsert 'deploy-status/a-club-skateboard-v4-v497.json'
          Write-Host "BBYA_SKATE_V4_RECEIPT_PERSISTED version=$env:BBYA_VERSION source=$env:BBYA_SKATE_V4_SOURCE_SHA"
