name: After School City Publish V0.8.6 Remaining Road Intrusion Cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/after-school-city-publish-v086-remaining-road-intrusion-cleanup.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 9bd0ac9f18ecd2f71c564ddea754a6521846e2b2
      BASE_LIVE_SHA: 93f69856b1e694cfd4d7e1708f08aaa2b6762d8e
      QC_RUN_ID: '33372894699'
      QC_ARTIFACT_ID: '9750745355'
      QC_ARTIFACT_NAME: after-school-city-v086-qc-9bd0ac9f18ecd2f71c564ddea754a6521846e2b2
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      EXPECTED_BYTES: '123257'
      EXPECTED_SHA256: e3f4d6e3757ee01f36f087b06dc3fd79a3ac3022057a9659beba63b9f4f74294
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify previous LIVE authority
        shell: bash
        run: |
          set -euo pipefail
          receipt='deploy-status/after-school-city-publish-lake-road-water-v0-8-5.json'
          [[ -f "$receipt" ]] || { echo 'V0.8.5 LIVE receipt missing'; exit 5; }
          [[ "$(jq -r '.status' "$receipt")" == 'LIVE_PUBLISHED' ]] || { echo 'Previous LIVE status mismatch'; exit 6; }
          [[ "$(jq -r '.sourceCommit' "$receipt")" == "$BASE_LIVE_SHA" ]] || { echo 'Previous LIVE source mismatch'; exit 7; }
          [[ "$(jq -r '.universeId' "$receipt")" == "$UNIVERSE_ID" ]] || { echo 'Universe authority mismatch'; exit 8; }
          [[ "$(jq -r '.placeId' "$receipt")" == "$PLACE_ID" ]] || { echo 'Place authority mismatch'; exit 9; }
          [[ "$(jq -r '.versionNumber' "$receipt")" == '32' ]] || { echo 'Expected current LIVE v32 authority missing'; exit 10; }
          echo "PREVIOUS LIVE AUTHORITY PASS source=$BASE_LIVE_SHA version=32"

      - name: Verify exact QC run and artifact authority
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROBLOX_OPEN_CLOUD_MASTER_V2 is unavailable'; exit 11; }
          api='https://api.github.com/repos/ardarawk-cloud/ACC-Roblox-maps'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$QC_RUN_ID" -o "$RUNNER_TEMP/qc-run.json"
          [[ "$(jq -r '.status' "$RUNNER_TEMP/qc-run.json")" == 'completed' ]] || { echo 'QC run is not completed'; exit 12; }
          [[ "$(jq -r '.conclusion' "$RUNNER_TEMP/qc-run.json")" == 'success' ]] || { echo 'QC run is not SUCCESS'; exit 13; }
          [[ "$(jq -r '.head_sha' "$RUNNER_TEMP/qc-run.json")" == "$SOURCE_SHA" ]] || { echo 'QC source SHA mismatch'; exit 14; }
          [[ "$(jq -r '.path' "$RUNNER_TEMP/qc-run.json")" == '.github/workflows/after-school-city-v086-remaining-road-intrusion-cleanup-qc.yml' ]] || { echo 'Unexpected QC workflow'; exit 15; }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$QC_RUN_ID/artifacts" -o "$RUNNER_TEMP/qc-artifacts.json"
          count=$(jq --argjson id "$QC_ARTIFACT_ID" --arg n "$QC_ARTIFACT_NAME" '[.artifacts[] | select(.id == $id and .name == $n and .expired == false and .workflow_run.head_sha == env.SOURCE_SHA)] | length' "$RUNNER_TEMP/qc-artifacts.json")
          [[ "$count" == '1' ]] || { cat "$RUNNER_TEMP/qc-artifacts.json"; echo 'Exact QC artifact authority not found'; exit 16; }
          echo "QC AUTHORITY PASS run=$QC_RUN_ID artifact=$QC_ARTIFACT_ID source=$SOURCE_SHA"

      - name: Checkout exact V0.8.6 source for lock verification
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 9bd0ac9f18ecd2f71c564ddea754a6521846e2b2
          path: asc-source
          fetch-depth: 0

      - name: Verify exact source and narrow V0.8.6 delta
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 20; }
          git -C asc-source cat-file -e "${BASE_LIVE_SHA}^{commit}"
          mapfile -t files < <(git -C asc-source diff --name-only "$BASE_LIVE_SHA" "$SOURCE_SHA")
          [[ ${#files[@]} -eq 3 ]] || { printf '%s\n' "${files[@]}"; echo "Unexpected delta count ${#files[@]}"; exit 21; }
          expected=(
            '.github/workflows/after-school-city-v086-remaining-road-intrusion-cleanup-qc.yml'
            'maps/after-school-city/after-school-city.remaining-road-intrusion-cleanup.server.lua'
            'maps/after-school-city/default.project.json'
          )
          for f in "${expected[@]}"; do printf '%s\n' "${files[@]}" | grep -Fxq "$f" || { echo "Missing expected delta $f"; exit 22; }; done
          script='asc-source/maps/after-school-city/after-school-city.remaining-road-intrusion-cleanup.server.lua'
          grep -Fq 'PUTU AZYA PUTRI' asc-source/maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'BINTANG HARDAJAYA' asc-source/maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'WITH LOVE, DAD' asc-source/maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq '0.8.6-remaining-road-intrusion-cleanup-1' "$script"
          grep -Fq 'V04_DowntownBackAlley' "$script"
          grep -Fq 'ServiceWalk' "$script"
          grep -Fq 'ServiceWalkWest' "$script"
          grep -Fq 'ServiceWalkEast' "$script"
          grep -Fq 'LoadingPad' "$script"
          grep -Fq 'V060_ParkExterior' "$script"
          grep -Fq 'LakeEdgeWest' "$script"
          grep -Fq 'NorthSouthRoad' "$script"
          grep -Fq 'ROAD_CLEAR_MARGIN = 1.5' "$script"
          echo "SOURCE LOCK PASS source=$actual delta=3-files"

      - name: Download exact QC-locked artifact
        uses: actions/download-artifact@v4
        with:
          name: after-school-city-v086-qc-9bd0ac9f18ecd2f71c564ddea754a6521846e2b2
          path: ${{ runner.temp }}/asc-v086-qc
          github-token: ${{ github.token }}
          repository: ardarawk-cloud/ACC-Roblox-maps
          run-id: 33372894699

      - name: Verify exact QC RBXL bytes and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t places < <(find "$RUNNER_TEMP/asc-v086-qc" -type f -name '*.rbxl' -print)
          [[ ${#places[@]} -eq 1 ]] || { find "$RUNNER_TEMP/asc-v086-qc" -maxdepth 3 -type f -print; echo "Expected exactly one RBXL, found ${#places[@]}"; exit 30; }
          place="${places[0]}"
          bytes=$(stat -c%s "$place")
          sha=$(sha256sum "$place" | awk '{print $1}')
          [[ "$bytes" == "$EXPECTED_BYTES" ]] || { echo "Byte mismatch: $bytes expected=$EXPECTED_BYTES"; exit 31; }
          [[ "$sha" == "$EXPECTED_SHA256" ]] || { echo "SHA256 mismatch: $sha expected=$EXPECTED_SHA256"; exit 32; }
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "EXACT QC ARTIFACT PASS bytes=$bytes sha256=$sha"

      - name: Publish V0.8.6 LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/asc-publish-response.json" -w '%{http_code}' -X POST "$url" -H "x-api-key: $ROBLOX_API_KEY" -H 'Content-Type: application/octet-stream' --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/asc-publish-response.json")
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "HTTP $http: $body"; exit 40; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/asc-publish-response.json")
          [[ -n "$version" && "$version" =~ ^[0-9]+$ ]] || { echo "Missing/invalid versionNumber: $body"; exit 41; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist V0.8.6 LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'REMAINING_ROAD_INTRUSION_CLEANUP_V0_8_6' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg baseLiveCommit "$BASE_LIVE_SHA" \
            --arg qcRunId "$QC_RUN_ID" \
            --arg qcArtifactId "$QC_ARTIFACT_ID" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,baseLiveCommit:$baseLiveCommit,qcRunId:$qcRunId,qcArtifactId:($qcArtifactId|tonumber),universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"V0.8.6 exact QC-locked artifact; splits legacy Downtown ServiceWalk around NorthSouthRoad, removes only the centered LoadingPad intruding into asphalt, and removes obsolete V060 Park LakeEdgeWest; protected asphalt road geometry, central intersection, V0.4.7 orientation, V0.5.3 centerline, gameplay systems, lake/path authority, and dedication unchanged."}' > deploy-status/after-school-city-publish-remaining-road-intrusion-v0-8-6.json
          cat deploy-status/after-school-city-publish-remaining-road-intrusion-v0-8-6.json
          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- deploy-status/after-school-city-publish-remaining-road-intrusion-v0-8-6.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record After School City V0.8.6 LIVE publish [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              echo "Receipt push retry $attempt"
              sleep $((attempt * 2))
            done
            echo 'Failed to persist LIVE receipt after retries'
            exit 50
          fi
