name: After School City V1.1.4 Delivery Guidance QC

on:
  push:
    branches: [after-school-city/v114-delivery-guidance]
    paths:
      - '.github/workflows/after-school-city-v114-delivery-guidance-qc.yml'
      - 'maps/after-school-city/after-school-city.activities.client.lua'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact v49 source and narrow diff gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '35ad050a3561121bca1f97310c51c282e893fd11'
          git cat-file -e "$base^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'V1.1.3 v49 LIVE source unavailable' }
          $mergeBase = (git merge-base $base $env:GITHUB_SHA).Trim()
          if($mergeBase -ne $base){ throw "Candidate is not based on exact v49 LIVE source: $mergeBase" }
          $allowed = @(
            '.github/workflows/after-school-city-v114-delivery-guidance-qc.yml',
            'maps/after-school-city/after-school-city.activities.client.lua'
          )
          $changed = @(git diff --name-only $base $env:GITHUB_SHA)
          if($changed.Count -ne 2){ throw "Expected exactly 2 files, got $($changed.Count): $($changed -join ', ')" }
          foreach($path in $changed){ if($allowed -notcontains $path){ throw "Scope violation: $path" } }
          foreach($path in $allowed){ if($changed -notcontains $path){ throw "Missing required change: $path" } }
          Write-Host "V1.1.4 NARROW DIFF PASS source=$env:GITHUB_SHA"

      - name: Delivery guidance static checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $client = Get-Content 'maps/after-school-city/after-school-city.activities.client.lua' -Raw
          foreach($token in @(
            '1.1.4-delivery-guidance-1',
            'PACKAGE DELIVERY',
            'ANTAR PAKET',
            'MAILBOX',
            'KOTAK SURAT',
            'FOLLOW MARKER',
            'IKUTI MARKER',
            'ASC_ActiveDeliveryTarget_Local',
            'showDeliveryMarker(data.Target)',
            'billboard.MaxDistance = 2048',
            'deliveryLabel.Text = string.format("▼ %s • %d STUD"'
          )){
            if($client -notmatch [regex]::Escape($token)){ throw "Missing V1.1.4 marker: $token" }
          }
          if($client -match 'DataStoreService|MarketplaceService|RemoteFunction|FireServer|InvokeServer'){
            throw 'V1.1.4 scope/authority violation'
          }
          Write-Host 'V1.1.4 DELIVERY GUIDANCE STATIC QC PASS'

      - name: Locked Skate and server authority unchanged
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '35ad050a3561121bca1f97310c51c282e893fd11'
          foreach($lockedPath in @(
            'maps/after-school-city/after-school-city.activities.server.lua',
            'maps/after-school-city/after-school-city.activity-config.lua',
            'maps/after-school-city/default.project.json',
            'maps/after-school-city/after-school-city.gameplay-service.lua',
            'maps/after-school-city/after-school-city.gameplay-config.lua',
            'maps/after-school-city/after-school-city.gameplay-bootstrap.server.lua',
            'maps/after-school-city/after-school-city.gameplay-hud.client.lua',
            'maps/after-school-city/after-school-city.ui-glass-v102.client.lua',
            'maps/after-school-city/after-school-city.music-player.client.lua',
            'maps/after-school-city/after-school-city.music-config.lua',
            'maps/after-school-city/after-school-city.intro.client.lua',
            'maps/after-school-city/after-school-city.world.server.lua',
            'maps/after-school-city/after-school-city.skatepark-light-clearance-v112.server.lua',
            'maps/after-school-city/after-school-city.streetlight-geometry-hotfix-v111.server.lua',
            'maps/after-school-city/after-school-city.swimmable-pool.server.lua'
          )){
            $pathDiff = git diff --name-only $base $env:GITHUB_SHA -- $lockedPath
            if($pathDiff){ throw "Protected source changed: $lockedPath" }
          }
          Write-Host 'V1.1.4 PROTECTED AUTHORITY PASS'

      - name: Verify V1.1.3 Skate marker code retained
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $client = Get-Content 'maps/after-school-city/after-school-city.activities.client.lua' -Raw
          foreach($token in @(
            'ASC_ActiveSkateCheckpoint_Local',
            'showCheckpointMarker(data.Target, data.Step, data.Total)',
            'SKATEBOARD LEPAS',
            'SKATEBOARD LOST',
            'markerLabel.Text = string.format("▼ %s %d/%d"'
          )){
            if($client -notmatch [regex]::Escape($token)){ throw "V1.1.3 Skate marker regression: $token" }
          }
          Write-Host 'V1.1.3 SKATE PRESENTATION RETAINED'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
          $zip = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
          if(-not $exe){ throw 'rojo.exe missing' }
          $version = (& $exe.FullName --version | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $version -notmatch '7\.7\.0'){ throw "Unexpected Rojo version: $version" }
          "ROJO_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ROJO_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact V1.1.4 candidate and hash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'asc-v114-qc'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $place = Join-Path $out 'after-school-city-v114.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $place)){ throw 'Rojo build failed' }
          $bytes = (Get-Item $place).Length
          if($bytes -lt 1024){ throw "RBXL too small: $bytes" }
          $hash = (Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = @(
            'STATUS=QC_PASSED',
            'MODE=DELIVERY_GUIDANCE_V1_1_4',
            'BASE_LIVE_COMMIT=35ad050a3561121bca1f97310c51c282e893fd11',
            "SOURCE_COMMIT=$env:GITHUB_SHA",
            "ROJO=$env:ROJO_VERSION",
            "RBXL_BYTES=$bytes",
            "SHA256=$hash",
            'DELIVERY_TITLE=PACKAGE_DELIVERY_ANTAR_PAKET',
            'DELIVERY_GUIDANCE=LOCAL_TARGET_MARKER',
            'DELIVERY_TARGET=SERVER_EXISTING_COORDINATE',
            'DELIVERY_DISTANCE=VISIBLE',
            'SKATE=UNCHANGED',
            'POOL=UNCHANGED',
            'SERVER_GAMEPLAY=UNCHANGED',
            'PERSISTENCE_MUSIC_MAP_UI=UNCHANGED'
          )
          $receipt | Set-Content (Join-Path $out 'qc-receipt.txt') -Encoding ascii
          $receipt | ForEach-Object { Write-Host $_ }
          "QC_OUT_DIR=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exact V1.1.4 QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v114-qc-${{ github.sha }}
          path: ${{ env.QC_OUT_DIR }}
          if-no-files-found: error
          retention-days: 7
