name: BBYA Basement Audio Inject

on:
  push:
    branches:
      - 'kai/bbya-basement-adxl-inject-v1'
    paths:
      - 'maps/bbya-social-hub/audio-staging/**'
      - 'scripts/upload-bbya-basement-audio.py'
      - '.github/workflows/bbya-basement-audio-inject.yml'
  workflow_dispatch:

concurrency:
  group: bbya-basement-audio-inject-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload owner audio to Roblox
        id: inject
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          UNIVERSE_ID: '8116636513'
        run: python3 scripts/upload-bbya-basement-audio.py

      - name: Persist audio IDs and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f deploy-status/bbya-basement-audio-inject.json ]; then
            git add deploy-status/bbya-basement-audio-inject.json
          fi
          git add maps/bbya-social-hub/85-basement-autodj.server.lua
          if python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('deploy-status/bbya-basement-audio-inject.json')
          ok=p.exists() and json.loads(p.read_text()).get('complete') is True
          raise SystemExit(0 if ok else 1)
          PY
          then
            git rm -r --ignore-unmatch maps/bbya-social-hub/audio-staging
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Inject owner ADXL audio into BBYA Basement [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Report missing asset permission
        if: steps.inject.outcome == 'failure'
        run: |
          echo '::warning::BBYA Basement audio injection is incomplete. Check deploy-status/bbya-basement-audio-inject.json. The Open Cloud key may need Assets Read + Write permission for the BBYA creator.'
          exit 1
