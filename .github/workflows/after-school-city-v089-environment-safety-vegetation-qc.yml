name: After School City V0.8.9 Environment Safety Vegetation QC

on:
  push:
    branches:
      - after-school-city/v089-environment-safety-vegetation-grounding
    paths:
      - 'maps/after-school-city/**'
      - '.github/workflows/after-school-city-v089-environment-safety-vegetation-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact-source narrow diff gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '0fc72f121f945f6f2b4281481f77318ab82c9893'
          git cat-file -e "$base^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'V0.8.8 LIVE base commit unavailable' }
          $mergeBase = (git merge-base $base $env:GITHUB_SHA).Trim()
          if($mergeBase -ne $base){ throw "Candidate is not based on exact V0.8.8 LIVE source: merge-base=$mergeBase" }

          $allowed = @(
            '.github/workflows/after-school-city-v089-environment-safety-vegetation-qc.yml',
            'maps/after-school-city/after-school-city.environment-safety-vegetation.server.lua',
            'maps/after-school-city/default.project.json'
          )
          $changed = @(git diff --name-only $base $env:GITHUB_SHA)
          if($changed.Count -ne 3){ throw "Expected exactly 3 V0.8.9 files, got $($changed.Count): $($changed -join ', ')" }
          foreach($path in $changed){ if($allowed -notcontains $path){ throw "V0.8.9 scope violation: $path" } }
          foreach($required in $allowed){ if($changed -notcontains $required){ throw "Required V0.8.9 change missing: $required" } }
          Write-Host "V0.8.9 NARROW DIFF PASS: $($changed -join ', ')"

      - name: Environment safety static checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = 'maps/after-school-city/after-school-city.environment-safety-vegetation.server.lua'
          $projectPath = 'maps/after-school-city/default.project.json'
          $script = Get-Content $scriptPath -Raw
          $project = Get-Content $projectPath -Raw
          $null = $project | ConvertFrom-Json

          foreach($token in @(
            '0.8.9-environment-safety-vegetation-1',
            'ASC_SwimmablePoolPass',
            'V088_SwimmablePool',
            'PoolWallWest',
            'POOL_LAMP_CLEARANCE = 3.0',
            'StreetLight',
            'ASC_V089PoolSafe',
            'Workspace:Raycast',
            'ASC_V089Grounded',
            'CrownAccentA',
            'CrownAccentB',
            'ASC_EnvironmentSafetyVegetationPass'
          )){
            if($script -notmatch [regex]::Escape($token)){ throw "V0.8.9 marker missing: $token" }
          }

          foreach($token in @('ASC_EnvironmentSafetyVegetation','after-school-city.environment-safety-vegetation.server.lua')){
            if($project -notmatch [regex]::Escape($token)){ throw "Rojo V0.8.9 marker missing: $token" }
          }

          foreach($forbidden in @('MarketplaceService','DataStoreService','PromptProductPurchase','ProcessReceipt','terrain:FillBlock')){
            if($script -match [regex]::Escape($forbidden)){ throw "Forbidden V0.8.9 authority found: $forbidden" }
          }

          $intro = Get-Content 'maps/after-school-city/after-school-city.intro.client.lua' -Raw
          foreach($token in @('PUTU AZYA PUTRI','BINTANG HARDAJAYA','WITH LOVE, DAD','ENTER THE CITY')){
            if($intro -notmatch [regex]::Escape($token)){ throw "Dedication lock missing: $token" }
          }
          Write-Host 'AFTER SCHOOL CITY V0.8.9 STATIC QC PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
          $zip = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
          if(-not $exe){ throw 'rojo.exe not found' }
          $version = (& $exe.FullName --version | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $version -notmatch '7\.7\.0'){ throw "Unexpected Rojo version: $version" }
          "ROJO_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROJO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact candidate and hash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'asc-v089-qc'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $place = Join-Path $outDir 'after-school-city-v089.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $place)){ throw 'Rojo build failed or RBXL missing' }
          $bytes = (Get-Item $place).Length
          if($bytes -lt 1024){ throw "Generated RBXL suspiciously small: $bytes bytes" }
          $hash = (Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = @(
            'STATUS=QC_PASSED',
            'MODE=ENVIRONMENT_SAFETY_VEGETATION_V0_8_9',
            'BASE_LIVE_COMMIT=0fc72f121f945f6f2b4281481f77318ab82c9893',
            "SOURCE_COMMIT=$env:GITHUB_SHA",
            "ROJO=$env:ROJO_VERSION",
            "RBXL_BYTES=$bytes",
            "SHA256=$hash"
          )
          $receipt | Set-Content (Join-Path $outDir 'qc-receipt.txt') -Encoding ascii
          $receipt | ForEach-Object { Write-Host $_ }
          "QC_OUT_DIR=$outDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exact QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v089-qc-${{ github.sha }}
          path: ${{ env.QC_OUT_DIR }}
          if-no-files-found: error
          retention-days: 7
