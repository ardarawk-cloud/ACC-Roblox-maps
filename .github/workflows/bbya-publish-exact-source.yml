name: BBYA Publish Exact Source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bbya-publish-exact-source.yml'
      - 'deploy-requests/bbya-exact-source.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-publish-exact-source.yml'
      - 'deploy-requests/bbya-exact-source.json'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact BBYA source commit SHA to build and publish'
        required: true
        type: string

concurrency:
  group: bbya-publish-exact-source
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  exact-source:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 25
    steps:
      - name: Checkout publisher authority
        uses: actions/checkout@v4

      - name: Resolve and validate exact source via GitHub API
        id: source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $headSha=if('${{ github.event_name }}' -eq 'pull_request'){$env:PR_HEAD_SHA}else{'${{ github.sha }}'}
          if($headSha -notmatch '^[0-9a-fA-F]{40}$'){throw "Invalid workflow head SHA: $headSha"}

          if('${{ github.event_name }}' -eq 'workflow_dispatch'){
            $requested='${{ inputs.source_sha }}'.Trim()
          } else {
            $request=Get-Content 'deploy-requests/bbya-exact-source.json' -Raw | ConvertFrom-Json
            $requested=([string]$request.source_sha).Trim()
          }
          if($requested -eq 'SELF'){
            $sourceSha=$headSha
          } else {
            $sourceSha=$requested
            if($sourceSha -notmatch '^[0-9a-fA-F]{40}$'){throw "Invalid source SHA: $sourceSha"}
          }

          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='BBYA-Exact-Source-Publisher'
          }
          $repo=$env:GITHUB_REPOSITORY
          $source=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/commits/$sourceSha"
          if([string]$source.sha -ne $sourceSha){throw "Source commit unavailable: $sourceSha"}

          $compare=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/compare/$sourceSha...$headSha"
          if([string]$compare.merge_base_commit.sha -ne $sourceSha){throw "Requested source is not an ancestor of workflow head: $sourceSha"}
          $changed=@($compare.files | ForEach-Object {$_.filename})
          $unexpected=@($changed | Where-Object {
            $_ -notmatch '^deploy-status/' -and
            $_ -ne 'deploy-requests/bbya-exact-source.json' -and
            $_ -ne '.github/workflows/bbya-publish-exact-source.yml'
          })
          if($unexpected.Count -gt 0){throw "Refusing rollback; gameplay/infrastructure changed after source: $($unexpected -join ', ')"}

          "source_sha=$sourceSha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "BBYA_SOURCE_SHA=$sourceSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_EXACT_SOURCE_SAFE requested=$requested source=$sourceSha head=$headSha changed_after_source=$($changed.Count)"

      - name: Checkout exact source archive
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: exact-source

      - name: Register exact source path
        shell: powershell
        run: |
          $sourceDir=Join-Path $env:GITHUB_WORKSPACE 'exact-source'
          if(-not (Test-Path $sourceDir)){throw 'Exact-source checkout missing'}
          "BBYA_SOURCE_DIR=$sourceDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify PR 183 feature markers at exact source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $visual=Get-Content (Join-Path $env:BBYA_SOURCE_DIR 'maps/bbya-social-hub/132-mainclub-social-lounge-v1.server.lua') -Raw
          foreach($needle in @(
            'MAIN_CLUB_FORMER_STUDIO_PREMIUM_V4',
            'FormerStudioPremiumV4',
            'SmokedMirrorPanel',
            'AcousticFin_',
            'CeilingTrack',
            'ServiceConsole',
            'GlobalLightingUntouched',
            'DJUntouched',
            'RestroomGeometryUntouched'
          )){if($visual -notmatch [regex]::Escape($needle)){throw "Missing exact-source visual marker: $needle"}}
          if($visual -match 'Lighting\.(Brightness|Ambient|OutdoorAmbient|ClockTime|ExposureCompensation)'){throw 'Exact-source visual pass touches global Lighting'}

          $audio=Get-Content (Join-Path $env:BBYA_SOURCE_DIR 'maps/bbya-social-hub/104-venue-audio-router.client.lua') -Raw
          foreach($needle in @(
            'STRICT VENUE AUDIO ROUTER v5',
            'FORMER_STUDIO_LOUNGE=-3.0',
            'RESTROOM=-7.0',
            'BBYAAudioRoom',
            'BBYAMainTrimDb'
          )){if($audio -notmatch [regex]::Escape($needle)){throw "Missing exact-source audio marker: $needle"}}
          if($audio -match 'SoundId\s*='){throw 'Exact-source router mutates SoundId'}
          Write-Host 'BBYA_PR183_EXACT_SOURCE_MARKERS_PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-exact-source-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-exact-source-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact BBYA source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-pr184-exact-source.rbxl'
          Push-Location $env:BBYA_SOURCE_DIR
          try {
            & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
            if($LASTEXITCODE -ne 0){throw 'Rojo exact-source build failed'}
          } finally { Pop-Location }
          if(-not (Test-Path $place)){throw 'Exact-source RBXL missing'}
          if((Get-Item $place).Length -lt 1024){throw 'Exact-source RBXL unexpectedly small'}
          "BBYA_PLACE_FILE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_EXACT_SOURCE_BUILD_PASS bytes=$((Get-Item $place).Length) source=$env:BBYA_SOURCE_SHA"

      - name: Publish exact source
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'AM_STUDIO publish secret unavailable'}
          Push-Location $env:BBYA_SOURCE_DIR
          try {
            $env:PLACE_FILE_OVERRIDE=$env:BBYA_PLACE_FILE
            $env:PUBLISH_RECEIPT_DIR='deploy-status-exact'
            $env:GITHUB_SHA=$env:BBYA_SOURCE_SHA
            node scripts/publish-map.js a-club
            if($LASTEXITCODE -ne 0){throw 'Exact-source Roblox publish failed'}
          } finally { Pop-Location }

      - name: Verify exact PUBLISHED receipt
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $receiptPath=Join-Path $env:BBYA_SOURCE_DIR 'deploy-status-exact/a-club.json'
          if(-not (Test-Path $receiptPath)){throw 'Exact-source receipt missing'}
          $receipt=Get-Content $receiptPath -Raw | ConvertFrom-Json
          if($receipt.status -ne 'PUBLISHED'){throw "Receipt status is $($receipt.status), expected PUBLISHED"}
          if($receipt.sourceCommit -ne $env:BBYA_SOURCE_SHA){throw "Receipt source mismatch: $($receipt.sourceCommit) != $env:BBYA_SOURCE_SHA"}
          if([string]$receipt.universeId -ne '8116636513'){throw 'Receipt universe mismatch'}
          if([string]$receipt.placeId -ne '131894120482837'){throw 'Receipt place mismatch'}
          if(-not $receipt.response.versionNumber){throw 'Receipt versionNumber missing'}
          $tmp=Join-Path $env:RUNNER_TEMP 'a-club-exact-source-receipt.json'
          Copy-Item $receiptPath $tmp -Force
          "BBYA_RECEIPT_TMP=$tmp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BBYA_VERSION=$($receipt.response.versionNumber)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_EXACT_SOURCE_PUBLISHED version=$($receipt.response.versionNumber) source=$($receipt.sourceCommit)"

      - name: Upload immutable exact-source receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bbya-exact-source-receipt-${{ steps.source.outputs.source_sha }}
          path: ${{ env.BBYA_RECEIPT_TMP }}
          if-no-files-found: error
          retention-days: 30

      - name: Persist exact-source receipt via GitHub API
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receiptText=Get-Content $env:BBYA_RECEIPT_TMP -Raw
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($receiptText))
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='BBYA-Exact-Source-Publisher'
          }
          $repo=$env:GITHUB_REPOSITORY

          function Upsert-Receipt([string]$path){
            $segments=$path.Split('/') | ForEach-Object {[Uri]::EscapeDataString($_)}
            $encoded=($segments -join '/')
            $uri="https://api.github.com/repos/$repo/contents/$encoded"
            for($attempt=1;$attempt -le 4;$attempt++){
              $existingSha=$null
              try {
                $existing=Invoke-RestMethod -Headers $headers -Uri ($uri+'?ref=main')
                $existingSha=[string]$existing.sha
              } catch {
                $status=[int]$_.Exception.Response.StatusCode
                if($status -ne 404){throw}
              }
              $payload=@{
                message="Record BBYA exact-source deploy v$env:BBYA_VERSION [skip ci]"
                content=$content
                branch='main'
              }
              if($existingSha){$payload.sha=$existingSha}
              try {
                Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Uri $uri -Body ($payload | ConvertTo-Json -Depth 5) | Out-Null
                Write-Host "Receipt persisted: $path"
                return
              } catch {
                $status=[int]$_.Exception.Response.StatusCode
                if(($status -ne 409 -and $status -ne 422) -or $attempt -eq 4){throw}
                Start-Sleep -Seconds 2
              }
            }
          }

          Upsert-Receipt 'deploy-status/a-club.json'
          Upsert-Receipt 'deploy-status/a-club-exact-source.json'
          Write-Host "BBYA_EXACT_SOURCE_RECEIPT_PERSISTED version=$env:BBYA_VERSION source=$env:BBYA_SOURCE_SHA"
