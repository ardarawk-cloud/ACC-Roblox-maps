name: BBYA Car Static Bake Probe

on:
  push:
    branches: [fix/bbya-car-static-bake-v1]
    paths:
      - '.github/workflows/bbya-car-static-bake-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AM_STUDIO_KEY: ${{ secrets.AM_STUDIO }}
      MASTER_V2_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      CAR01_ASSET_ID: '97052038046118'
      CAR02_ASSET_ID: '91172120786409'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve approved models and download exact CDN payloads
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AM_STUDIO_KEY"
          mkdir -p /tmp/bbya-car-bake

          probe() {
            local slot="$1" id="$2"
            echo "=== BBYA CAR $slot asset=$id ==="

            meta="/tmp/bbya-car-bake/meta-${slot}.json"
            code=$(curl --silent --show-error --location \
              --header "x-api-key: $AM_STUDIO_KEY" \
              --write-out '%{http_code}' --output "$meta" \
              "https://apis.roblox.com/assets/v1/assets/$id" || true)
            echo "METADATA_${slot}_HTTP=$code"
            test "$code" = "200"
            cat "$meta"; echo
            python3 - "$meta" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          assert m.get('assetType')=='Model', m
          assert m.get('moderationResult',{}).get('moderationState')=='Approved', m
          assert m.get('state')=='Active', m
          print('ASSET_APPROVED_ACTIVE')
          PY

            manifest="/tmp/bbya-car-bake/public-${slot}.json"
            code=$(curl --silent --show-error --location \
              --write-out '%{http_code}' --output "$manifest" \
              "https://assetdelivery.roblox.com/v2/assetId/$id" || true)
            echo "PUBLIC_MANIFEST_${slot}_HTTP=$code"
            test "$code" = "200"
            cat "$manifest"; echo

            cdn=$(python3 - "$manifest" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          locs=d.get('locations') or []
          if not locs: raise SystemExit('asset delivery manifest has no locations')
          print(locs[0]['location'])
          PY
            )
            test -n "$cdn"
            out="/tmp/bbya-car-bake/BBYA-Car-${slot}.rbxm"
            code=$(curl --silent --show-error --location \
              --write-out '%{http_code}' --output "$out" "$cdn" || true)
            echo "CDN_DELIVERY_${slot}_HTTP=$code"
            test "$code" = "200"
            test -s "$out"
            echo "DELIVERY_${slot}_PASS bytes=$(stat -c%s "$out") sha256=$(sha256sum "$out" | awk '{print $1}')"
            file "$out" || true
            echo "FIRST32_${slot}=$(xxd -p -l 32 "$out" | tr -d '\n')"
          }

          probe 01 "$CAR01_ASSET_ID"
          probe 02 "$CAR02_ASSET_ID"

      - name: Verify both delivered binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for slot in ('01','02'):
              p=Path(f'/tmp/bbya-car-bake/BBYA-Car-{slot}.rbxm')
              b=p.read_bytes()
              if len(b) < 1024: raise SystemExit(f'{p.name}: too small')
              lead=b[:128].lstrip()
              if lead.startswith((b'{',b'[',b'<!DOCTYPE',b'<html')):
                  raise SystemExit(f'{p.name}: text/error payload {lead[:80]!r}')
              print(f'{p.name}: binary payload accepted, bytes={len(b)}')
          PY

      - name: Upload immutable delivered model binaries
        uses: actions/upload-artifact@v4
        with:
          name: bbya-car-static-bake-source-models
          path: |
            /tmp/bbya-car-bake/BBYA-Car-01.rbxm
            /tmp/bbya-car-bake/BBYA-Car-02.rbxm
          if-no-files-found: error
          retention-days: 7
