name: BBYA Car Static Bake Probe

on:
  push:
    branches: [fix/bbya-car-static-bake-v1]
    paths:
      - '.github/workflows/bbya-car-static-bake-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AM_STUDIO_KEY: ${{ secrets.AM_STUDIO }}
      MASTER_V2_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      CAR01_ASSET_ID: '97052038046118'
      CAR02_ASSET_ID: '91172120786409'
    steps:
      - uses: actions/checkout@v4

      - name: Probe asset metadata and all supported delivery routes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AM_STUDIO_KEY"
          mkdir -p /tmp/bbya-car-bake

          probe() {
            local slot="$1" id="$2"
            echo "=== BBYA CAR $slot asset=$id ==="

            for spec in "AM:$AM_STUDIO_KEY" "MASTER:$MASTER_V2_KEY"; do
              label="${spec%%:*}"; key="${spec#*:}"
              [ -n "$key" ] || continue
              meta="/tmp/bbya-car-bake/meta-${slot}-${label}.json"
              code=$(curl --silent --show-error --location \
                --header "x-api-key: $key" \
                --write-out '%{http_code}' \
                --output "$meta" \
                "https://apis.roblox.com/assets/v1/assets/$id" || true)
              echo "METADATA_${slot}_${label}_HTTP=$code"
              if [ "$code" = "200" ]; then cat "$meta"; echo; fi

              out="/tmp/bbya-car-bake/BBYA-Car-${slot}-${label}.rbxm"
              code=$(curl --silent --show-error --location \
                --header "x-api-key: $key" \
                --write-out '%{http_code}' \
                --output "$out" \
                "https://apis.roblox.com/asset-delivery-api/v1/assetId/$id" || true)
              echo "OPENCLOUD_DELIVERY_${slot}_${label}_HTTP=$code"
              if [ "$code" != "200" ]; then rm -f "$out"; fi
            done

            out="/tmp/bbya-car-bake/BBYA-Car-${slot}-PUBLIC.rbxm"
            code=$(curl --silent --show-error --location \
              --write-out '%{http_code}' \
              --output "$out" \
              "https://assetdelivery.roblox.com/v2/assetId/$id" || true)
            echo "PUBLIC_DELIVERY_${slot}_HTTP=$code"
            if [ "$code" != "200" ]; then rm -f "$out"; fi

            chosen=$(find /tmp/bbya-car-bake -maxdepth 1 -type f -name "BBYA-Car-${slot}-*.rbxm" -size +1024c | head -n 1 || true)
            if [ -n "$chosen" ]; then
              cp "$chosen" "/tmp/bbya-car-bake/BBYA-Car-${slot}.rbxm"
              echo "DELIVERY_${slot}_PASS source=$(basename "$chosen") bytes=$(stat -c%s "$chosen") sha256=$(sha256sum "$chosen" | awk '{print $1}')"
              file "$chosen" || true
              echo "FIRST32_${slot}=$(xxd -p -l 32 "$chosen" | tr -d '\n')"
            else
              echo "DELIVERY_${slot}_FAIL no binary model route succeeded"
            fi
          }

          probe 01 "$CAR01_ASSET_ID"
          probe 02 "$CAR02_ASSET_ID"

      - name: Verify both delivered binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for slot in ('01','02'):
              p=Path(f'/tmp/bbya-car-bake/BBYA-Car-{slot}.rbxm')
              if not p.exists(): raise SystemExit(f'{p.name}: missing')
              b=p.read_bytes()
              if len(b) < 1024: raise SystemExit(f'{p.name}: too small')
              lead=b[:128].lstrip()
              if lead.startswith((b'{',b'[',b'<!DOCTYPE',b'<html')):
                  raise SystemExit(f'{p.name}: text/error payload {lead[:80]!r}')
              print(f'{p.name}: binary payload accepted, bytes={len(b)}')
          PY

      - name: Upload immutable delivered model binaries
        uses: actions/upload-artifact@v4
        with:
          name: bbya-car-static-bake-source-models
          path: |
            /tmp/bbya-car-bake/BBYA-Car-01.rbxm
            /tmp/bbya-car-bake/BBYA-Car-02.rbxm
          if-no-files-found: error
          retention-days: 7
