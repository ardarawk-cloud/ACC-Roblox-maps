name: BBYA Baked Ddiaz Cars Main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-ddiaz-baked-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbya-baked-ddiaz-cars-main
  cancel-in-progress: false

jobs:
  bake-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAR_01_ASSET_ID: '97052038046118'
      CAR_02_ASSET_ID: '91172120786409'
      MAIN_UNIVERSE_ID: '8116636513'
      MAIN_PLACE_ID: '131894120482837'
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source authority before packaging
        shell: bash
        run: |
          set -euo pipefail
          echo "EXACT_SOURCE=$(git rev-parse HEAD)"
          f='maps/bbya-social-hub/77-entrance-car-cleanup.server.lua'
          street='maps/bbya-social-hub/69-entrance-street-icons.server.lua'
          grep -Fq 'BAKED DDIAZ CAR PAIR v10' "$f"
          grep -Fq 'BBYABakedCarsSourceV10' "$f"
          grep -Fq 'No cloud asset loading. No procedural/fake-car fallback.' "$f"
          grep -Fq 'ProceduralCarFallbackRetired' "$street"
          if grep -Fq 'sportCar("CloudCarSlot_Red"' "$street"; then
            echo 'Old procedural red car authority still active' >&2
            exit 1
          fi
          if grep -Fq 'sportCar("CloudCarSlot_Blue"' "$street"; then
            echo 'Old procedural blue car authority still active' >&2
            exit 1
          fi
          echo 'BBYA_DDIAZ_BAKED_SOURCE_QC_PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go for rbxmk
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Cache Rojo
        id: rojo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}

      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install rojo --version 7.7.0 --locked

      - name: Install rbxmk
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/anaminus/rbxmk/rbxmk@v0.9.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          rojo --version
          "$HOME/go/bin/rbxmk" version

      - name: Build current BBYA place
        shell: bash
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-before-car-bake.rbxl
          test -s /tmp/bbya-before-car-bake.rbxl
          echo "BBYA_PREBAKE_BYTES=$(stat -c%s /tmp/bbya-before-car-bake.rbxl)"

      - name: Download approved Roblox Model assets
        shell: bash
        env:
          ROBLOX_ASSET_KEY_PRIMARY: ${{ secrets.AM_STUDIO }}
          ROBLOX_ASSET_KEY_MASTER: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          set -euo pipefail
          test -n "${ROBLOX_ASSET_KEY_PRIMARY:-}"
          test -n "${ROBLOX_ASSET_KEY_MASTER:-}"

          request_location(){
            local id="$1"
            local key="$2"
            local label="$3"
            local meta="/tmp/asset-${id}-${label}.json"
            local code
            code="$(curl --silent --show-error --location -o "$meta" -w '%{http_code}' \
              -H "x-api-key: ${key}" \
              "https://apis.roblox.com/asset-delivery-api/v1/assetId/${id}" || true)"
            if [ "$code" != "200" ]; then
              echo "ASSET_DELIVERY_KEY_REJECTED id=${id} key=${label} http=${code}"
              return 1
            fi
            node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!j.location)process.exit(2);process.stdout.write(j.location)' "$meta"
          }

          download_asset(){
            local id="$1"
            local out="$2"
            local location=''
            if location="$(request_location "$id" "$ROBLOX_ASSET_KEY_PRIMARY" primary)"; then
              echo "ASSET_DELIVERY_AUTH_PASS id=${id} key=primary"
            elif location="$(request_location "$id" "$ROBLOX_ASSET_KEY_MASTER" master)"; then
              echo "ASSET_DELIVERY_AUTH_PASS id=${id} key=master"
            else
              echo "No configured Open Cloud key can read Roblox Model asset ${id}" >&2
              exit 1
            fi
            test -n "$location"
            curl --fail --silent --show-error --location "$location" -o "$out"
            test -s "$out"
            if [ "$(stat -c%s "$out")" -lt 1000 ]; then
              echo "Downloaded Roblox Model asset ${id} is unexpectedly small" >&2
              exit 1
            fi
            echo "ASSET_DOWNLOAD_PASS id=${id} bytes=$(stat -c%s "$out") sha256=$(sha256sum "$out" | awk '{print $1}')"
          }

          download_asset "$CAR_01_ASSET_ID" /tmp/bbya-car-01.rbxm
          download_asset "$CAR_02_ASSET_ID" /tmp/bbya-car-02.rbxm

      - name: Bake real car Models into ServerStorage
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/bake-bbya-cars.rbxmk.lua <<'LUA'
          local placePath, car01Path, car02Path, outPath = ...
          local rbxl = {Format="rbxl", DescMode="Preserve"}
          local rbxm = {Format="rbxm", DescMode="Preserve"}
          local place = fs.read(placePath, rbxl)
          local storage = place:GetService("ServerStorage")

          local old = storage:FindFirstChild("BBYABakedCarsSourceV10")
          if old then old.Parent = nil end

          local source = Instance.new("Model")
          source.Name = "BBYABakedCarsSourceV10"
          source:SetAttribute("PackageAuthority", "BAKED_DDIAZ_CARS_V10")
          source:SetAttribute("DisplayOnly", true)
          source:SetAttribute("Creator", "Ddiaz Design")
          source:SetAttribute("CreatorPermission", true)
          source:SetAttribute("AttributionRequired", true)

          local function importCar(pathName, displayName, assetId, sourceUrl)
            local dm = fs.read(pathName, rbxm)
            local car = Instance.new("Model")
            car.Name = displayName
            car:SetAttribute("RobloxAssetId", assetId)
            car:SetAttribute("Creator", "Ddiaz Design")
            car:SetAttribute("SourceUrl", sourceUrl)
            car:SetAttribute("License", "CC BY-NC-SA 4.0")
            car:SetAttribute("CreatorPermission", true)
            car:SetAttribute("BakedIntoPlace", true)
            for _, child in ipairs(dm:GetChildren()) do
              child.Parent = car
            end
            local baseParts = 0
            local meshParts = 0
            for _, d in ipairs(car:GetDescendants()) do
              if d:IsA("BasePart") then baseParts = baseParts + 1 end
              if d.ClassName == "MeshPart" then meshParts = meshParts + 1 end
            end
            if baseParts < 1 or meshParts < 1 then
              error(string.format("%s invalid baked package: baseParts=%d meshParts=%d", displayName, baseParts, meshParts), 0)
            end
            car:SetAttribute("BakedBasePartCount", baseParts)
            car:SetAttribute("BakedMeshPartCount", meshParts)
            car.Parent = source
            print(string.format("BAKED_CAR_PACKAGE_PASS name=%s asset=%s baseParts=%d meshParts=%d", displayName, tostring(assetId), baseParts, meshParts))
          end

          importCar(car01Path, "BBYA Car 01", 97052038046118, "https://skfb.ly/pFsG9")
          importCar(car02Path, "BBYA Car 02", 91172120786409, "https://skfb.ly/pKzpM")
          source.Parent = storage
          fs.write(outPath, place, rbxl)
          print("BBYA_DDIAZ_BAKE_WRITE_PASS " .. outPath)
          LUA

          "$HOME/go/bin/rbxmk" run /tmp/bake-bbya-cars.rbxmk.lua \
            /tmp/bbya-before-car-bake.rbxl \
            /tmp/bbya-car-01.rbxm \
            /tmp/bbya-car-02.rbxm \
            /tmp/bbya-ddiaz-baked-main.rbxl
          test -s /tmp/bbya-ddiaz-baked-main.rbxl
          echo "BBYA_BAKED_PLACE_BYTES=$(stat -c%s /tmp/bbya-ddiaz-baked-main.rbxl)"

      - name: Re-open baked place and verify immutable package
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-bbya-cars.rbxmk.lua <<'LUA'
          local placePath = ...
          local place = fs.read(placePath, {Format="rbxl", DescMode="Preserve"})
          local storage = place:GetService("ServerStorage")
          local source = storage:FindFirstChild("BBYABakedCarsSourceV10")
          if not source then error("BBYABakedCarsSourceV10 missing after write", 0) end
          local a = source:FindFirstChild("BBYA Car 01")
          local b = source:FindFirstChild("BBYA Car 02")
          if not a or not b then error("Baked car pair missing after write", 0) end
          local function counts(car)
            local baseParts, meshParts = 0, 0
            for _, d in ipairs(car:GetDescendants()) do
              if d:IsA("BasePart") then baseParts = baseParts + 1 end
              if d.ClassName == "MeshPart" then meshParts = meshParts + 1 end
            end
            return baseParts, meshParts
          end
          local ab, am = counts(a)
          local bb, bm = counts(b)
          if ab < 1 or am < 1 or bb < 1 or bm < 1 then error("Baked geometry verification failed", 0) end
          print(string.format("BBYA_DDIAZ_BAKED_PACKAGE_VERIFIED car01_base=%d car01_mesh=%d car02_base=%d car02_mesh=%d", ab, am, bb, bm))
          LUA
          "$HOME/go/bin/rbxmk" run /tmp/verify-bbya-cars.rbxmk.lua /tmp/bbya-ddiaz-baked-main.rbxl

      - name: Publish baked place directly to MAIN
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PLACE_FILE_OVERRIDE: /tmp/bbya-ddiaz-baked-main.rbxl
          PUBLISH_RECEIPT_DIR: deploy-status-ddiaz-baked-main
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${ROBLOX_API_KEY:-}"
          node scripts/publish-map.js a-club
          test -f deploy-status-ddiaz-baked-main/a-club.json
          cat deploy-status-ddiaz-baked-main/a-club.json

      - name: Upload immutable MAIN receipt
        uses: actions/upload-artifact@v4
        with:
          name: bbya-ddiaz-baked-main-receipt-${{ github.sha }}
          path: deploy-status-ddiaz-baked-main/a-club.json
          if-no-files-found: error
          retention-days: 30
