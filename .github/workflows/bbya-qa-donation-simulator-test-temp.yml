name: BBYA QA Donation Simulator TEST

on:
  push:
    branches:
      - 'bbya/qa/donation-notification-integrated-test-v1'
    paths:
      - '.github/workflows/bbya-qa-donation-simulator-test-temp.yml'

permissions:
  contents: read

env:
  TARGET_SOURCE: 5c3b1709964113c1554498d045917e82f4f25bf0
  TEST_UNIVERSE: '10762005984'
  TEST_PLACE: '124607344716828'

jobs:
  qa-test-publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Fetch exact simulator source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'bbya-qa-donation-sim-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'bbya-qa-donation-sim-source'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/$env:TARGET_SOURCE" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $repo=Get-ChildItem $dir -Directory | Select-Object -First 1
          if(-not $repo){throw 'Exact simulator source missing'}
          Get-ChildItem $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $repo.FullName -Force | ForEach-Object { Copy-Item $_.FullName $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "EXACT_SIMULATOR_SOURCE=$env:TARGET_SOURCE"

      - name: Static QA simulator checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $backend='maps/bbya-social-hub/50-dj-wall-message.server.lua'
          $ui='maps/bbya-social-hub/119-support-purchase.client.lua'
          $sfx='maps/bbya-social-hub/137-donation-notification-sfx.client.lua'
          $simServer='maps/bbya-social-hub/34-support-dashboard.server.lua'
          foreach($p in @($backend,$ui,$sfx,$simServer)){if(-not (Test-Path $p)){throw "Missing required file: $p"}}

          $a=Get-Content $backend -Raw
          foreach($m in @('DonationNotification','BBYA_MonetizationReceipts_v1','BBYA_MonetizationUsers_v1','PurchaseId')){if(-not $a.Contains($m)){throw "Missing backend marker: $m"}}
          $receiptCount=([regex]::Matches($a,'MarketplaceService\.ProcessReceipt\s*=')).Count
          if($receiptCount -ne 1){throw "Expected one ProcessReceipt assignment, found $receiptCount"}

          $u=Get-Content $ui -Raw
          foreach($m in @('BBYADonationNotificationUI','BBYAQADonationSimulatorUI','QA DONATE','TEST ONLY · 0 ROBUX','BBYAQADonationSimulatorV1')){if(-not $u.Contains($m)){throw "Missing simulator UI marker: $m"}}

          $ss=Get-Content $simServer -Raw
          foreach($m in @('BBYAQADonationSimulatorV1','TEST_UNIVERSE=10762005984','TEST_PLACE=124607344716828','DonationNotification','NO_MSG_10','WITH_MSG_10','BURST')){if(-not $ss.Contains($m)){throw "Missing simulator server marker: $m"}}
          foreach($bad in @('ProcessReceipt','PromptProductPurchase','DataStoreService')){if($ss.Contains($bad)){throw "Forbidden monetization mutation in simulator server: $bad"}}

          $s=Get-Content $sfx -Raw
          foreach($m in @('DonationNotification','rbxassetid://1319346243','SoundService')){if(-not $s.Contains($m)){throw "Missing SFX marker: $m"}}

          Write-Host 'BBYA_QA_DONATION_SIM_STATIC_PASS'

      - name: Build exact simulator source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $z=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive $z -DestinationPath $toolDir -Force
          }
          $version=& $rojo --version
          if($version -notmatch '7\.7\.0'){throw 'Rojo 7.7.0 required'}
          $out=Join-Path $env:RUNNER_TEMP 'bbya-qa-donation-simulator-test.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Build failed'}
          $bytes=(Get-Item $out).Length
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "BBYA_QA_BUILD=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BBYA_QA_BYTES=$bytes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BBYA_QA_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "BBYA_QA_DONATION_SIM_BUILD_PASS bytes=$bytes sha256=$sha"

      - name: Publish TEST place only
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ROBLOX_API_KEY){throw 'ROBLOX_OPEN_CLOUD_MASTER_V2 missing'}
          $url="https://apis.roblox.com/universes/v1/$env:TEST_UNIVERSE/places/$env:TEST_PLACE/versions?versionType=Published"
          $resp=& curl.exe --silent --show-error --fail-with-body --http1.1 --ipv4 --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --header 'Content-Type: application/octet-stream' --header 'Expect:' --data-binary "@$env:BBYA_QA_BUILD" $url
          if($LASTEXITCODE -ne 0){throw 'TEST publish failed'}
          $r=$resp|ConvertFrom-Json
          if(-not $r.versionNumber){throw 'TEST versionNumber missing'}
          Write-Host "BBYA_QA_DONATION_SIM_TEST_PUBLISHED version=$($r.versionNumber) bytes=$env:BBYA_QA_BYTES sha256=$env:BBYA_QA_SHA256 candidate=$env:TARGET_SOURCE universe=$env:TEST_UNIVERSE place=$env:TEST_PLACE"
