name: After School City V0.7 School Interior QC

on:
  push:
    branches: [after-school-city/scaffold-v1]
    paths:
      - 'maps/after-school-city/**'
      - '.github/scripts/after-school-city-school-interior-audit.ps1'
      - '.github/scripts/after-school-city-v070-prior-gates.ps1'
      - '.github/workflows/after-school-city-v070-school-interior-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/after-school-city/**'
      - '.github/scripts/after-school-city-school-interior-audit.ps1'
      - '.github/scripts/after-school-city-v070-prior-gates.ps1'
      - '.github/workflows/after-school-city-v070-school-interior-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact branch source
        shell: powershell
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $expected=$env:EXPECTED_SOURCE_SHA.Trim()
          $event=Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if($event.pull_request){
            $eventSource=[string]$event.pull_request.head.sha
          } else {
            $eventSource=[string]$env:GITHUB_SHA
          }
          $eventSource=$eventSource.Trim()
          Write-Host "V0.7 checked-out ref=$expected event-source=$eventSource"
          if($eventSource -ne $expected){throw "Exact-source event mismatch: event=$eventSource expected=$expected"}
          if(-not (Test-Path 'maps/after-school-city/after-school-city.school-interior.server.lua')){throw 'V0.7 source file missing after exact-ref checkout'}
          "ASC_SOURCE_SHA=$expected"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PASS: actions/checkout resolved exact V0.7 source $expected without requiring local git executable"

      - name: Prior spatial and circulation gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-v070-prior-gates.ps1'

      - name: School interior audit V1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-school-interior-audit.ps1'

      - name: V0.7 authority, V0.6 preservation and dedication locks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $registry=Get-Content 'maps/registry.json' -Raw|ConvertFrom-Json
          $target=$registry.maps.'after-school-city'
          if(-not $target){throw 'after-school-city registry target missing'}
          if([string]$target.universeId -ne '10745359869'){throw "Wrong Universe ID: $($target.universeId)"}
          if([string]$target.placeId -ne '121603385909425'){throw "Wrong Place ID: $($target.placeId)"}
          if($target.enabled -ne $false){throw 'Development target must remain registry enabled=false'}

          $config=Get-Content 'maps/after-school-city/after-school-city.config.lua' -Raw
          $project=Get-Content 'maps/after-school-city/default.project.json' -Raw
          $premium=Get-Content 'maps/after-school-city/after-school-city.premium-exterior.server.lua' -Raw
          $interior=Get-Content 'maps/after-school-city/after-school-city.school-interior.server.lua' -Raw
          $intro=Get-Content 'maps/after-school-city/after-school-city.intro.client.lua' -Raw
          $null=$project|ConvertFrom-Json

          foreach($token in @('Version = "0.7.0-school-interior-1"','PremiumExteriorVersion = "0.6.0-premium-exterior-1"','SchoolInteriorVersion = "0.7.0-school-interior-1"','EnablePremiumExteriorPass = true','EnableSchoolInteriorPass = true','EnableActivities = false','EnableEconomy = false','EnablePersistence = false','EnablePersonalRoom = false','EnableClubs = false')){if($config -notmatch [regex]::Escape($token)){throw "Config lock missing: $token"}}
          foreach($token in @('ASC_RoadCenterlineClearance','ASC_PremiumExterior','ASC_SchoolInterior','after-school-city.road-centerline-clearance.server.lua','after-school-city.premium-exterior.server.lua','after-school-city.school-interior.server.lua')){if($project -notmatch [regex]::Escape($token)){throw "Project lock missing: $token"}}
          foreach($token in @('V060_PremiumExterior','ASC_SchoolPremiumExterior','ASC_StreetPremiumMarkings')){if($premium -notmatch [regex]::Escape($token)){throw "V0.6 preservation lock missing: $token"}}
          foreach($token in @('V070_SchoolInterior','ASC_SchoolInteriorAccessible','ASC_SchoolExteriorEnvelopePreserved')){if($interior -notmatch [regex]::Escape($token)){throw "V0.7 lock missing: $token"}}
          foreach($token in @('PUTU AZYA PUTRI','BINTANG HARDAJAYA','WITH LOVE, DAD','ENTER THE CITY')){if($intro -notmatch [regex]::Escape($token)){throw "Dedication lock missing: $token"}}
          if($interior -match 'MarketplaceService|PromptProductPurchase|ProcessReceipt|DataStoreService|BillboardGui'){throw 'V0.7 interior contains forbidden authority/debug marker'}
          Write-Host 'AFTER SCHOOL CITY v0.7 authority + preservation + dedication locks PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojoExe=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0-v070'
            $zip=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0-v070.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse|Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojoExe=$exe.FullName
          }
          $version=& $rojoExe --version
          if(($version -join ' ') -notmatch '7\.7\.0'){throw "Expected Rojo 7.7.0, got $version"}
          "ROJO_EXE=$rojoExe"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact V0.7 map
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'after-school-city-v070.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
          if(-not (Test-Path $place)){throw 'Generated RBXL missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw "Generated RBXL suspiciously small: $bytes bytes"}
          $sha=(Get-FileHash -Algorithm SHA256 $place).Hash.ToLowerInvariant()
          Write-Host "AFTER SCHOOL CITY V0.7 ROJO BUILD PASS - source=$env:ASC_SOURCE_SHA - $bytes bytes - sha256=$sha"
