name: After School City Publish V0.9.2.3 Signage Typography Boost

on:
  push:
    branches: [main]
    paths: ['.github/workflows/after-school-city-publish-v0922-global-signage-readability.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 0d930f955522d36f16b0d363f74d962105eefcdc
      BASE_LIVE_SHA: 76362800d3133ffc01ca776ee5efe16f51e3a49a
      QC_RUN_ID: '33531359049'
      QC_ARTIFACT_ID: '9809857234'
      QC_ARTIFACT_NAME: after-school-city-v0923-qc-0d930f955522d36f16b0d363f74d962105eefcdc
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      EXPECTED_BYTES: '154906'
      EXPECTED_SHA256: 14a1c57aa9b3fc67047082f04a95f479452da7c1c0228797f8db309cf70d7fd9
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify previous LIVE authority
        shell: bash
        run: |
          set -euo pipefail
          receipt='deploy-status/after-school-city-publish-global-signage-readability-v0-9-2-2.json'
          [[ -f "$receipt" ]]
          [[ "$(jq -r '.status' "$receipt")" == 'LIVE_PUBLISHED' ]]
          [[ "$(jq -r '.sourceCommit' "$receipt")" == "$BASE_LIVE_SHA" ]]
          [[ "$(jq -r '.versionNumber' "$receipt")" == '40' ]]
          echo 'PREVIOUS LIVE AUTHORITY PASS v40'

      - name: Verify exact QC run and artifact authority
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]]
          api='https://api.github.com/repos/ardarawk-cloud/ACC-Roblox-maps'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$QC_RUN_ID" -o "$RUNNER_TEMP/qc-run.json"
          [[ "$(jq -r '.status' "$RUNNER_TEMP/qc-run.json")" == 'completed' ]]
          [[ "$(jq -r '.conclusion' "$RUNNER_TEMP/qc-run.json")" == 'success' ]]
          [[ "$(jq -r '.head_sha' "$RUNNER_TEMP/qc-run.json")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r '.path' "$RUNNER_TEMP/qc-run.json")" == '.github/workflows/after-school-city-v0923-signage-typography-qc.yml' ]]
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$QC_RUN_ID/artifacts" -o "$RUNNER_TEMP/qc-artifacts.json"
          count=$(jq --argjson id "$QC_ARTIFACT_ID" --arg n "$QC_ARTIFACT_NAME" --arg s "$SOURCE_SHA" '[.artifacts[] | select(.id == $id and .name == $n and .expired == false and .workflow_run.head_sha == $s)] | length' "$RUNNER_TEMP/qc-artifacts.json")
          [[ "$count" == '1' ]]
          echo "QC AUTHORITY PASS run=$QC_RUN_ID artifact=$QC_ARTIFACT_ID source=$SOURCE_SHA"

      - name: Checkout exact V0.9.2.3 source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 0d930f955522d36f16b0d363f74d962105eefcdc
          path: asc-source
          fetch-depth: 0

      - name: Verify narrow source lock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C asc-source rev-parse HEAD)" == "$SOURCE_SHA" ]]
          mapfile -t files < <(git -C asc-source diff --name-only "$BASE_LIVE_SHA" "$SOURCE_SHA")
          [[ ${#files[@]} -eq 3 ]]
          expected=(
            '.github/workflows/after-school-city-v0923-signage-typography-qc.yml'
            'maps/after-school-city/after-school-city.signage-typography-v0923.server.lua'
            'maps/after-school-city/default.project.json'
          )
          for f in "${expected[@]}"; do printf '%s\n' "${files[@]}" | grep -Fxq "$f"; done
          script='asc-source/maps/after-school-city/after-school-city.signage-typography-v0923.server.lua'
          grep -Fq '0.9.2.3-signage-typography-boost-1' "$script"
          grep -Fq 'root:GetDescendants()' "$script"
          grep -Fq 'obj:IsA("SurfaceGui")' "$script"
          grep -Fq 'TextService:GetTextSize' "$script"
          grep -Fq 'TextSize = fitted' "$script"
          grep -Fq 'Enum.Font.GothamBlack' "$script"
          grep -Fq 'UDim2.fromScale(0.95, 0.85)' "$script"
          grep -Fq 'ASC_SignageTypographyBoostPass' "$script"
          grep -Fq 'PUTU AZYA PUTRI' asc-source/maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'BINTANG HARDAJAYA' asc-source/maps/after-school-city/after-school-city.intro.client.lua
          echo 'SOURCE LOCK PASS'

      - name: Download exact QC artifact
        uses: actions/download-artifact@v4
        with:
          name: after-school-city-v0923-qc-0d930f955522d36f16b0d363f74d962105eefcdc
          path: ${{ runner.temp }}/asc-v0923-qc
          github-token: ${{ github.token }}
          repository: ardarawk-cloud/ACC-Roblox-maps
          run-id: 33531359049

      - name: Verify exact RBXL
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/asc-v0923-qc/qc-receipt.txt"
          tr -d '\r' < "$receipt" > "$RUNNER_TEMP/qc-receipt-normalized.txt"
          normalized="$RUNNER_TEMP/qc-receipt-normalized.txt"
          grep -Fxq 'STATUS=QC_PASSED' "$normalized"
          grep -Fxq 'MODE=SIGNAGE_TYPOGRAPHY_BOOST_V0_9_2_3' "$normalized"
          grep -Fxq "BASE_LIVE_COMMIT=$BASE_LIVE_SHA" "$normalized"
          grep -Fxq "SOURCE_COMMIT=$SOURCE_SHA" "$normalized"
          grep -Fxq "RBXL_BYTES=$EXPECTED_BYTES" "$normalized"
          grep -Fxq "SHA256=$EXPECTED_SHA256" "$normalized"
          grep -Fxq 'SIGNAGE_SCOPE=ALL_WORLD_SURFACEGUI_TEXT_EXPLICIT_FIT' "$normalized"
          grep -Fxq 'BOARD_GEOMETRY=UNCHANGED' "$normalized"
          mapfile -t places < <(find "$RUNNER_TEMP/asc-v0923-qc" -type f -name '*.rbxl' -print)
          [[ ${#places[@]} -eq 1 ]]
          place="${places[0]}"
          bytes=$(stat -c%s "$place")
          sha=$(sha256sum "$place" | awk '{print $1}')
          [[ "$bytes" == "$EXPECTED_BYTES" ]]
          [[ "$sha" == "$EXPECTED_SHA256" ]]
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "EXACT ARTIFACT PASS bytes=$bytes sha=$sha"

      - name: Publish V0.9.2.3 to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/publish.json" -w '%{http_code}' -X POST "$url" -H "x-api-key: $ROBLOX_API_KEY" -H 'Content-Type: application/octet-stream' --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/publish.json")
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "HTTP $http: $body"; exit 40; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/publish.json")
          [[ "$version" =~ ^[0-9]+$ ]]
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist V0.9.2.3 LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt='deploy-status/after-school-city-publish-signage-typography-v0-9-2-3.json'
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'SIGNAGE_TYPOGRAPHY_BOOST_V0_9_2_3' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg baseLiveCommit "$BASE_LIVE_SHA" \
            --arg qcRunId "$QC_RUN_ID" \
            --arg qcArtifactId "$QC_ARTIFACT_ID" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,baseLiveCommit:$baseLiveCommit,qcRunId:$qcRunId,qcArtifactId:($qcArtifactId|tonumber),universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:"7.7.0",placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"V0.9.2.3 exact QC-locked global signage typography boost. All world SurfaceGui sign text is enlarged and explicitly fitted while physical sign geometry stays unchanged. Roads, pool, gameplay, music and dedication remain unchanged."}' > "$receipt"
          cat "$receipt"
          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "$receipt"
          git commit -m 'Record After School City V0.9.2.3 LIVE publish [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
