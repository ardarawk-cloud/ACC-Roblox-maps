name: BBYA Direct StudioMCP Tool Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-mcp-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Discover StudioMCP tools
        shell: powershell
        run: |
          $env:USERPROFILE='C:\Users\Administrator'
          $env:HOME='C:\Users\Administrator'
          $env:LOCALAPPDATA='C:\Users\Administrator\AppData\Local'
          $mcpBat=Join-Path $env:LOCALAPPDATA 'Roblox\mcp.bat'
          $psi=New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName='cmd.exe'
          $psi.Arguments='/d /s /c ""'+$mcpBat+'""'
          $psi.UseShellExecute=$false
          $psi.RedirectStandardInput=$true
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $psi.CreateNoWindow=$true
          $p=New-Object System.Diagnostics.Process
          $p.StartInfo=$psi
          [void]$p.Start()

          function Send-Mcp($obj){
            $json=$obj|ConvertTo-Json -Compress -Depth 20
            $p.StandardInput.WriteLine($json)
            $p.StandardInput.Flush()
          }
          function Read-LineTimeout([int]$ms){
            $task=$p.StandardOutput.ReadLineAsync()
            if($task.Wait($ms)){return $task.Result}
            return '__TIMEOUT__'
          }

          $lines=@()
          $lines += "timestamp=$(Get-Date -Format o)"
          $lines += "studio_visible=$([bool](Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue))"
          try{
            Send-Mcp @{jsonrpc='2.0';id=1;method='initialize';params=@{protocolVersion='2025-06-18';capabilities=@{};clientInfo=@{name='bbya-direct-worker';version='1.0.0'}}}
            $r1=Read-LineTimeout 8000
            $lines += 'INITIALIZE_RESPONSE_BEGIN';$lines += $r1;$lines += 'INITIALIZE_RESPONSE_END'
            Send-Mcp @{jsonrpc='2.0';method='notifications/initialized';params=@{}}
            Send-Mcp @{jsonrpc='2.0';id=2;method='tools/list';params=@{}}
            $r2=Read-LineTimeout 8000
            $lines += 'TOOLS_RESPONSE_BEGIN';$lines += $r2;$lines += 'TOOLS_RESPONSE_END'
          }catch{
            $lines += "ERROR=$($_.Exception.Message)"
          }
          try{$p.StandardInput.Close()}catch{}
          if(-not $p.HasExited){try{$p.Kill()}catch{}}
          try{$err=$p.StandardError.ReadToEnd();if($err){$lines+='STDERR_BEGIN';$lines+=$err;$lines+='STDERR_END'}}catch{}

          $text=($lines-join "`n")+"`n"
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-mcp-tools.txt"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28";"User-Agent"="BBYA-Studio-Worker"}
          $sha=$null
          try{$sha=(Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $body=@{message='Record BBYA StudioMCP tools [skip ci]';content=$content;branch='main'}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body|ConvertTo-Json) -ContentType 'application/json'
