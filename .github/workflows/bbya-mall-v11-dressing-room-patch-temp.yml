name: BBYA Mall V11 Dressing Room Patch TEMP

on:
  push:
    branches:
      - 'feat/bbya-mall-catalog-v8-reference-rebuild'
    paths:
      - '.github/workflows/bbya-mall-v11-dressing-room-patch-temp.yml'

permissions:
  contents: write

env:
  BRANCH_NAME: feat/bbya-mall-catalog-v8-reference-rebuild
  TARGET_FILE: maps/bbya-social-hub/133-mall-robux-commerce.client.lua

jobs:
  patch-build-publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - name: Checkout TEST branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0

      - name: Patch V11 precise layout and dressing room
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=$env:TARGET_FILE
          $s=Get-Content $p -Raw
          if(-not $s.Contains('MALL CATALOG UI v8 / V10 TENANT EXPERIENCE')){ throw 'Unexpected 133 authority; aborting instead of overwriting concurrent work' }

          function Replace-Once([string]$old,[string]$new,[string]$label){
            if(-not $script:s.Contains($old)){ throw "Missing patch anchor: $label" }
            $script:s=$script:s.Replace($old,$new)
          }

          Replace-Once 'local UserInputService=game:GetService("UserInputService")' @'
local UserInputService=game:GetService("UserInputService")
local GuiService=game:GetService("GuiService")
'@ 'GuiService'

          Replace-Once 'local storeBtn=btn(top,"Toko",UDim2.fromOffset(224,0),UDim2.fromOffset(208,44),Color3.fromRGB(55,74,84));storeBtn.TextSize=20' @'
local storeBtn=btn(top,"Toko",UDim2.fromOffset(224,0),UDim2.fromOffset(208,44),Color3.fromRGB(55,74,84));storeBtn.TextSize=20
local roomBack=btn(root,"‹ KATALOG",UDim2.new(),UDim2.fromOffset(118,44),C.panel2);roomBack.TextColor3=C.cyan;roomBack.Visible=false
local roomTitle=txt(root,"RUANG GANTI • DRAG AVATAR = ROTATE 360°",UDim2.new(),UDim2.new(),Enum.Font.GothamBold,13,C.white,Enum.TextXAlignment.Center);roomTitle.Visible=false
'@ 'dressing header'

          Replace-Once 'local resetTool=btn(avatarTools,"RESET",UDim2.new(),UDim2.new(.24,-4,1,0),C.panel2);resetTool.TextSize=8' @'
local resetTool=btn(avatarTools,"RESET",UDim2.new(),UDim2.new(.24,-4,1,0),C.panel2);resetTool.TextSize=8
local rotateLeft=btn(avatarTools,"↶",UDim2.new(),UDim2.fromOffset(50,25),C.panel2);rotateLeft.TextSize=15;rotateLeft.Visible=false
local rotateRight=btn(avatarTools,"↷",UDim2.new(),UDim2.fromOffset(50,25),C.panel2);rotateRight.TextSize=15;rotateRight.Visible=false
local zoomOut=btn(avatarTools,"−",UDim2.new(),UDim2.fromOffset(50,25),C.panel2);zoomOut.TextSize=15;zoomOut.Visible=false
local zoomIn=btn(avatarTools,"+",UDim2.new(),UDim2.fromOffset(50,25),C.panel2);zoomIn.TextSize=15;zoomIn.Visible=false
local orbitHint=txt(avatar,"DRAG = ROTATE • ↶ ↷ = STEP • − + = ZOOM",UDim2.new(),UDim2.new(),Enum.Font.GothamMedium,9,C.muted,Enum.TextXAlignment.Center);orbitHint.Visible=false
'@ 'orbit controls'

          Replace-Once 'local host=Instance.new("Frame");host.Name="ModuleHost";host.BackgroundTransparency=1;host.Parent=root' 'local host=Instance.new("Frame");host.Name="ModuleHost";host.BackgroundColor3=C.panel;host.BackgroundTransparency=.03;host.BorderSizePixel=0;host.Parent=root;corner(host,12);stroke(host,C.line,.18)' 'host panel'

          Replace-Once @'
local focusSaved={}
local focusConn=nil
local camera=workspace.CurrentCamera
'@ @'
local focusSaved={}
local focusConn=nil
local camera=workspace.CurrentCamera
local dressingMode=false
local setDressing=nil
local orbitTarget=Vector3.zero
local orbitDistance=11
local orbitYaw=0
local orbitPitch=0
local orbitBaseYaw=0
local orbitModel=nil
local dragInput=nil
local lastDrag=nil
'@ 'dressing state'

          Replace-Once 'local function closeCatalog()root.Visible=false;restoreUI();player:SetAttribute("BBYAMallCatalogFocusMode",false)end' 'local function closeCatalog()if setDressing then setDressing(false)else dressingMode=false end;root.Visible=false;restoreUI();player:SetAttribute("BBYAMallCatalogFocusMode",false)end' 'close catalog'

          $pattern='local function framePreviewModel\(m\).*?\r?\nend\r?\nlocal function render\(desc\)'
          $replacement=@'
local function updateOrbitCamera()
 if not orbitModel then return end
 local yaw=orbitBaseYaw+orbitYaw
 local cp=math.cos(orbitPitch)
 local dir=Vector3.new(math.sin(yaw)*cp,math.sin(orbitPitch),math.cos(yaw)*cp)
 vcam.FieldOfView=dressingMode and 31 or 34
 vcam.CFrame=CFrame.lookAt(orbitTarget+dir*orbitDistance,orbitTarget,Vector3.yAxis)
end
local function framePreviewModel(m)
 if not m then return false end
 local incoming=m.Parent~=world
 cleanModel(m)
 local center,size=bodyBounds(m)
 if not center or not size then if incoming then m:Destroy()end;return false end
 if incoming then world:ClearAllChildren();m.Parent=world end
 orbitModel=m;orbitTarget=center
 local rp=m:FindFirstChild("HumanoidRootPart",true)
 local forward=rp and rp.CFrame.LookVector or Vector3.new(0,0,-1)
 forward=Vector3.new(forward.X,0,forward.Z)
 if forward.Magnitude<.01 then forward=Vector3.new(0,0,-1)else forward=forward.Unit end
 orbitBaseYaw=math.atan2(forward.X,forward.Z)
 local h=math.clamp(size.Y,4.5,8.5);local w=math.clamp(math.max(size.X,size.Z),2.5,6)
 orbitDistance=math.max(h*(dressingMode and 1.35 or 1.72),w*(dressingMode and 1.55 or 1.95))
 orbitYaw=0;orbitPitch=0
 updateOrbitCamera()
 return true
end
local function render(desc)
'@
          $rx=[regex]::new($pattern,[System.Text.RegularExpressions.RegexOptions]::Singleline)
          if($rx.Matches($s).Count -ne 1){ throw 'framePreviewModel patch anchor count mismatch' }
          $s=$rx.Replace($s,$replacement,1)

          $pattern='local function responsive\(\).*?\r?\nend\r?\n\r?\nlocal function openStore\(key\).*?\r?\nend'
          $replacement=@'
local function safeInsets()
 local ok,a,b=pcall(function()return GuiService:GetGuiInset()end)
 if ok and a then return a,b or Vector2.zero end
 return Vector2.zero,Vector2.zero
end
local function setToolMode(room)
 homeTool.Visible=not room;cartTool.Visible=not room;saveTool.Visible=not room;resetTool.Visible=not room
 rotateLeft.Visible=room;rotateRight.Visible=room;zoomOut.Visible=room;zoomIn.Visible=room;orbitHint.Visible=room
 top.Visible=not room;roomBack.Visible=room;roomTitle.Visible=room
end
local function responsive()
 camera=workspace.CurrentCamera or camera
 local vp=camera and camera.ViewportSize or Vector2.new(1280,720)
 local insetTL,insetBR=safeInsets()
 local outer=math.clamp(math.floor(math.min(vp.X,vp.Y)*.025),14,28)
 local x0=outer+insetTL.X;local y0=outer+insetTL.Y
 local availW=math.max(640,vp.X-x0-outer-insetBR.X)
 local availH=math.max(360,vp.Y-y0-outer-insetBR.Y)
 local bodyY=y0+54;local totalH=math.max(280,availH-54);local gap=dressingMode and 16 or 18
 local leftW,rightW,hostX
 if dressingMode then
  leftW=math.floor((availW-gap)*.62);rightW=availW-leftW-gap;hostX=x0+leftW+gap
  roomBack.Position=UDim2.fromOffset(x0,y0);roomBack.Size=UDim2.fromOffset(118,44)
  roomTitle.Position=UDim2.fromOffset(x0+128,y0);roomTitle.Size=UDim2.fromOffset(math.max(160,availW-188),44)
  avatar.Position=UDim2.fromOffset(x0,bodyY);avatar.Size=UDim2.fromOffset(leftW,totalH)
  host.Position=UDim2.fromOffset(hostX,bodyY);host.Size=UDim2.fromOffset(rightW,totalH)
  viewport.Position=UDim2.fromOffset(8,8);viewport.Size=UDim2.new(1,-16,1,-91)
  selectedLabel.Position=UDim2.new(0,12,1,-80);selectedLabel.Size=UDim2.new(1,-24,0,22)
  selectedPrice.Position=UDim2.new(0,12,1,-58);selectedPrice.Size=UDim2.new(1,-24,0,18)
  orbitHint.Position=UDim2.new(0,12,1,-39);orbitHint.Size=UDim2.new(1,-24,0,16)
  avatarTools.Position=UDim2.new(.5,-110,1,-31);avatarTools.Size=UDim2.fromOffset(220,25)
 else
  leftW=math.clamp(math.floor((availW-gap)*.30),250,360);rightW=availW-leftW-gap;hostX=x0+leftW+gap
  local navReserve=58;local navW=math.min(440,math.max(300,rightW-navReserve));local navGap=12;local bw=math.floor((navW-navGap)/2)
  top.Position=UDim2.fromOffset(hostX,y0);top.Size=UDim2.fromOffset(navW,46)
  catBtn.Position=UDim2.fromOffset(0,0);catBtn.Size=UDim2.fromOffset(bw,44)
  storeBtn.Position=UDim2.fromOffset(bw+navGap,0);storeBtn.Size=UDim2.fromOffset(bw,44)
  avatar.Position=UDim2.fromOffset(x0,bodyY);avatar.Size=UDim2.fromOffset(leftW,totalH)
  host.Position=UDim2.fromOffset(hostX,bodyY);host.Size=UDim2.fromOffset(rightW,totalH)
  viewport.Position=UDim2.fromOffset(7,7);viewport.Size=UDim2.new(1,-14,1,-83)
  selectedLabel.Position=UDim2.new(0,10,1,-74);selectedLabel.Size=UDim2.new(1,-20,0,22)
  selectedPrice.Position=UDim2.new(0,10,1,-52);selectedPrice.Size=UDim2.new(1,-20,0,18)
  avatarTools.Position=UDim2.new(0,7,1,-31);avatarTools.Size=UDim2.new(1,-14,0,25)
 end
 local exit=root:FindFirstChild("ExitButton");if exit then exit.Position=UDim2.fromOffset(x0+availW-44,y0)end
 action.Position=UDim2.fromOffset(hostX+math.floor(rightW/2),y0+availH);action.Size=UDim2.fromOffset(math.min(382,rightW),50)
 local searchW=math.clamp(math.floor(rightW*.26),130,220);local goW=52;local searchX=rightW-searchW-goW-10
 backProducts.Visible=not dressingMode;backProducts.Position=UDim2.fromOffset(0,0);backProducts.Size=UDim2.fromOffset(118,34)
 productTitle.Position=UDim2.fromOffset(dressingMode and 0 or 130,0);productTitle.Size=UDim2.fromOffset(math.max(80,searchX-(dressingMode and 8 or 138)),34);productTitle.TextSize=rightW<540 and 14 or 17
 search.Position=UDim2.fromOffset(searchX,0);search.Size=UDim2.fromOffset(searchW,34);go.Position=UDim2.fromOffset(rightW-goW,0);go.Size=UDim2.fromOffset(goW,34)
 status.Position=UDim2.fromOffset(0,44);status.Size=UDim2.new(1,-90,0,22);retry.Position=UDim2.fromOffset(rightW-78,42);retry.Size=UDim2.fromOffset(78,26)
 productList.Position=UDim2.fromOffset(0,76);productList.Size=UDim2.new(1,0,1,-76)
 local cols=rightW<430 and 2 or(rightW<700 and 3 or 4)
 grid.CellSize=UDim2.new(1/cols,-8,0,178);sl.CellSize=UDim2.new(1/cols,-8,0,160);sg.CellSize=UDim2.new(rightW<500 and 1 or .49,-6,0,dressingMode and 62 or 72)
 task.defer(function()local m=world:FindFirstChildOfClass("Model");if m then framePreviewModel(m)end end)
end
setDressing=function(on)
 dressingMode=on and true or false
 root.BackgroundColor3=C.dark;root.BackgroundTransparency=dressingMode and .02 or .30
 setToolMode(dressingMode)
 if dressingMode then showModule("PRODUCTS")end
 responsive();syncAction()
end

local function openStore(key)
 if not STORE[key]then return end
 activeStore=key;local d=STORE[key];storeBtn.Text=d.title;selected=nil
 setDressing(false);resetPreview();hideOtherUI();root.Visible=true;player:SetAttribute("BBYAMallCatalogFocusMode",true);openProducts();responsive();syncAction()
end
'@
          $rx=[regex]::new($pattern,[System.Text.RegularExpressions.RegexOptions]::Singleline)
          if($rx.Matches($s).Count -ne 1){ throw 'responsive/openStore patch anchor count mismatch' }
          $s=$rx.Replace($s,$replacement,1)

          Replace-Once 'tryB.Activated:Connect(function()if selected then local ok=applyItem(selected);if ok then status.Text="TRY aktif • lihat avatar di kiri";status.TextColor3=C.green else status.Text="Item ini belum bisa dipreview.";status.TextColor3=C.red end end end)' 'tryB.Activated:Connect(function()if selected then local ok=applyItem(selected);if ok then status.Text="TRY aktif • mode ruang ganti 360°";status.TextColor3=C.green;setDressing(true)else status.Text="Item ini belum bisa dipreview.";status.TextColor3=C.red end end end)' 'TRY dressing transition'

          Replace-Once 'saveCurrent.Activated:Connect(function()if previewDescription then pcall(function()AvatarEditorService:PromptSaveAvatar(previewDescription,Enum.HumanoidRigType.R15)end)end end)' @'
saveCurrent.Activated:Connect(function()if previewDescription then pcall(function()AvatarEditorService:PromptSaveAvatar(previewDescription,Enum.HumanoidRigType.R15)end)end end)
roomBack.Activated:Connect(function()setDressing(false)end)
rotateLeft.Activated:Connect(function()orbitYaw-=math.rad(20);updateOrbitCamera()end)
rotateRight.Activated:Connect(function()orbitYaw+=math.rad(20);updateOrbitCamera()end)
zoomOut.Activated:Connect(function()orbitDistance=math.clamp(orbitDistance*1.12,4,28);updateOrbitCamera()end)
zoomIn.Activated:Connect(function()orbitDistance=math.clamp(orbitDistance*.88,4,28);updateOrbitCamera()end)
viewport.InputBegan:Connect(function(input)
 if not dressingMode then return end
 if input.UserInputType==Enum.UserInputType.MouseButton1 or input.UserInputType==Enum.UserInputType.Touch then dragInput=input;lastDrag=Vector2.new(input.Position.X,input.Position.Y)end
end)
UserInputService.InputChanged:Connect(function(input)
 if not dressingMode then return end
 if input.UserInputType==Enum.UserInputType.MouseWheel then orbitDistance=math.clamp(orbitDistance-input.Position.Z*.8,4,28);updateOrbitCamera();return end
 if not dragInput then return end
 if input.UserInputType==Enum.UserInputType.MouseMovement or input==dragInput then local now=Vector2.new(input.Position.X,input.Position.Y);local d=now-(lastDrag or now);lastDrag=now;orbitYaw-=d.X*.009;orbitPitch=math.clamp(orbitPitch-d.Y*.006,math.rad(-35),math.rad(35));updateOrbitCamera()end
end)
UserInputService.InputEnded:Connect(function(input)if input==dragInput or input.UserInputType==Enum.UserInputType.MouseButton1 then dragInput=nil;lastDrag=nil end end)
'@ 'dressing inputs'

          $s=$s.Replace('MALL CATALOG UI v8 / V10 TENANT EXPERIENCE','MALL CATALOG UI v8 / V11 DRESSING ROOM')
          $s=$s.Replace('gui:SetAttribute("BBYAMallCatalogAuthority","V10_TENANT_EXPERIENCE")','gui:SetAttribute("BBYAMallCatalogAuthority","V11_DRESSING_ROOM")')
          $s=$s.Replace('[BBYA] Mall Catalog V10 online: 12 retail tenant kiosks + 18-destination teleport directory + direct live Marketplace','[BBYA] Mall Catalog V11 online: precise safe-area shell + full dressing room 360 orbit + live Marketplace')

          foreach($m in @('MALL CATALOG UI v8 / V11 DRESSING ROOM','V11_DRESSING_ROOM','GuiService:GetGuiInset','RUANG GANTI','updateOrbitCamera','setDressing(true)','BBYAMallCatalogFocusMode','Keranjang Belanja')){ if(-not $s.Contains($m)){throw "Missing V11 marker: $m"} }
          foreach($bad in @('shiftX=touch and -91','rightSafe=touch and 150')){ if($s.Contains($bad)){throw "Old imprecise mobile offset still present: $bad"} }
          $utf8=New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $p),$s,$utf8)
          Write-Host 'BBYA_MALL_V11_PATCH_QC_PASS precise-safe-area dressing-room orbit360'

      - name: Commit exact TEST source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'bbya-deploy-bot'
          git config user.email 'bbya-deploy-bot@users.noreply.github.com'
          git rm '.github/workflows/bbya-mall-v11-dressing-room-patch-temp.yml'
          git add $env:TARGET_FILE
          git commit -m 'test(bbya): precise catalog and 360 dressing room'
          git push origin "HEAD:$env:BRANCH_NAME"
          $sha=(git rev-parse HEAD).Trim()
          "PATCHED_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PATCHED_SOURCE=$sha"

      - name: Static V11 source QC
        shell: powershell
        run: |
          $a=Get-Content $env:TARGET_FILE -Raw
          foreach($m in @('MALL CATALOG UI v8','CatalogLauncher','CATEGORIES','STORES','PRODUCTS','Keranjang Belanja','BBYAMallCatalogFocusMode','V11_DRESSING_ROOM','updateOrbitCamera','RUANG GANTI')){ if(-not $a.Contains($m)){throw "Missing marker: $m"} }
          foreach($bad in @('GetService("Lighting")','SoundId','.Volume =','shiftX=touch and -91','rightSafe=touch and 150')){ if($a.Contains($bad)){throw "Forbidden marker: $bad"} }
          Write-Host 'BBYA_MALL_V11_STATIC_QC_PASS'

      - name: Enable third party sales in test build only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/default.project.json'
          $obj=(Get-Content $p -Raw | ConvertFrom-Json)
          if(-not ($obj.tree.Workspace.PSObject.Properties.Name -contains '$properties')){ $obj.tree.Workspace | Add-Member -NotePropertyName '$properties' -NotePropertyValue ([pscustomobject]@{}) }
          $props=$obj.tree.Workspace.'$properties'
          if($props.PSObject.Properties.Name -contains 'AllowThirdPartySales'){ $props.AllowThirdPartySales=$true } else { $props | Add-Member -NotePropertyName 'AllowThirdPartySales' -NotePropertyValue $true }
          $json=$obj | ConvertTo-Json -Depth 100
          $utf8=New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $p),$json,$utf8)

      - name: Build and publish V11 TEST
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $z=Join-Path $env:RUNNER_TEMP 'rojo.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive $z -DestinationPath $toolDir -Force
          }
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mall-v11-test.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Build failed'}
          $bytes=(Get-Item $out).Length
          $sha256=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $url='https://apis.roblox.com/universes/v1/10762005984/places/124607344716828/versions?versionType=Published'
          $resp=& curl.exe --silent --show-error --fail-with-body --http1.1 --ipv4 --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --header 'Content-Type: application/octet-stream' --header 'Expect:' --data-binary "@$out" $url
          if($LASTEXITCODE -ne 0){throw 'Publish failed'}
          $r=$resp|ConvertFrom-Json
          if(-not $r.versionNumber){throw 'versionNumber missing'}
          Write-Host "BBYA_MALL_V11_TEST_PUBLISHED version=$($r.versionNumber) bytes=$bytes sha256=$sha256 source=$env:PATCHED_SHA universe=10762005984 place=124607344716828"
