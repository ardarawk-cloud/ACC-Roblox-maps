name: BBYA Studio Screenshot Thumbnail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-studio-thumb.yml'
      - '.github/worker-jobs/bbya-thumb-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lightweight audit thumbnail
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
from PIL import Image
p='deploy-status/bbya-studio-view.jpg'
im=Image.open(p).convert('RGB')
w=320
h=max(1,round(im.height*w/im.width))
im=im.resize((w,h))
im.save('deploy-status/bbya-studio-thumb.jpg','JPEG',quality=28,optimize=True)
print(im.size)
PY
      - name: Persist thumbnail
        run: |
          git config user.name "ACC Roblox Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/bbya-studio-thumb.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Record BBYA Studio thumbnail [skip ci]"
            git push origin HEAD:main
          fi
