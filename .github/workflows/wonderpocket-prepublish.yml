name: WONDERPOCKET Closed-Test Build

on:
  workflow_dispatch:
    inputs:
      publish_closed_test:
        description: Publish the verified build to the locked WONDERPOCKET Place for private closed testing
        required: true
        default: false
        type: boolean
      confirm_target:
        description: Type WONDERPOCKET:8805231520:124843214013484 to allow closed-test publish
        required: false
        type: string
  push:
    branches: [agent/wonderpocket-target]
    paths:
      - 'maps/wonderpocket/**'
      - 'scripts/build-wonderpocket.js'
      - 'scripts/qc-wonderpocket.js'
      - 'scripts/publish-wonderpocket-closed-test.js'
      - '.github/workflows/wonderpocket-prepublish.yml'

jobs:
  build-qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify WONDERPOCKET branch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF_NAME -ne 'agent/wonderpocket-target'){throw "Wrong branch: $env:GITHUB_REF_NAME"}

      - name: Build WONDERPOCKET place
        shell: powershell
        env:
          WONDERPOCKET_BUILD_MODE: closed-test
        run: |
          $ErrorActionPreference='Stop'
          node scripts/build-wonderpocket.js
          if($LASTEXITCODE -ne 0){throw 'WONDERPOCKET build failed'}

      - name: Run WONDERPOCKET QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/qc-wonderpocket.js
          if($LASTEXITCODE -ne 0){throw 'WONDERPOCKET QC failed'}

      - name: Upload closed-test place artifact
        uses: actions/upload-artifact@v4
        with:
          name: wonderpocket-v1.3-closed-test-place
          path: maps/wonderpocket/place.rbxlx
          retention-days: 7

      - name: Detect one-time push publish request
        id: push_request
        if: github.event_name == 'push'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $marker='maps/wonderpocket/CLOSED_TEST_PUBLISH_REQUEST'
          $expected='WONDERPOCKET:8805231520:124843214013484'
          $before='${{ github.event.before }}'
          $changed=$false
          if($before -and $before -notmatch '^0+$'){
            $names = git diff --name-only $before $env:GITHUB_SHA
            if($names -contains $marker){$changed=$true}
          } else {
            $names = git show --pretty='' --name-only $env:GITHUB_SHA
            if($names -contains $marker){$changed=$true}
          }
          $token=''
          if(Test-Path $marker){$token=(Get-Content $marker -Raw).Trim()}
          if($changed -and $token -eq $expected){
            'publish=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'One-time locked WONDERPOCKET publish request accepted.'
          } else {
            'publish=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'No valid one-time push publish request in this commit.'
          }

      - name: Verify explicit dispatch target confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.publish_closed_test == true
        shell: powershell
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:CONFIRM_TARGET -ne 'WONDERPOCKET:8805231520:124843214013484'){throw 'Closed-test target confirmation mismatch.'}
          Write-Host 'Locked WONDERPOCKET target confirmed. This does not change Roblox public visibility/access.'

      - name: Publish WONDERPOCKET closed-test from dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_closed_test == true
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          WONDERPOCKET_CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          $ErrorActionPreference='Stop'
          node scripts/publish-wonderpocket-closed-test.js
          if($LASTEXITCODE -ne 0){throw 'WONDERPOCKET closed-test publish failed'}

      - name: Publish WONDERPOCKET closed-test from one-time push request
        id: push_publish
        if: github.event_name == 'push' && steps.push_request.outputs.publish == 'true'
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          WONDERPOCKET_CONFIRM_TARGET: WONDERPOCKET:8805231520:124843214013484
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'wonderpocket-publish.log'
          node scripts/publish-wonderpocket-closed-test.js *> $log
          $code=$LASTEXITCODE
          Get-Content $log
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Record WONDERPOCKET publish diagnostic
        if: github.event_name == 'push' && steps.push_request.outputs.publish == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'wonderpocket-publish.log'
          New-Item -ItemType Directory -Force -Path '.diagnostics' | Out-Null
          $lines=@(
            "commit=$env:GITHUB_SHA",
            "workflow=$env:GITHUB_WORKFLOW",
            "run_id=$env:GITHUB_RUN_ID",
            "exit_code=${{ steps.push_publish.outputs.exit_code }}",
            "utc=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))",
            '--- publisher output ---'
          )
          $lines | Set-Content '.diagnostics/wonderpocket-last-publish.log' -Encoding utf8
          if(Test-Path $log){Get-Content $log | Add-Content '.diagnostics/wonderpocket-last-publish.log' -Encoding utf8}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '.diagnostics/wonderpocket-last-publish.log'
          git commit -m 'Record WONDERPOCKET publish diagnostic [skip ci]'
          if($LASTEXITCODE -ne 0){Write-Host 'No diagnostic delta to commit.'}
          git pull --rebase origin agent/wonderpocket-target
          if($LASTEXITCODE -ne 0){throw 'Failed to rebase diagnostic commit'}
          git push origin HEAD:agent/wonderpocket-target
          if($LASTEXITCODE -ne 0){throw 'Failed to push diagnostic commit'}

      - name: Fail workflow if WONDERPOCKET publish failed
        if: github.event_name == 'push' && steps.push_request.outputs.publish == 'true' && steps.push_publish.outputs.exit_code != '0'
        shell: powershell
        run: |
          throw 'WONDERPOCKET closed-test publish failed; diagnostic committed to .diagnostics/wonderpocket-last-publish.log'
