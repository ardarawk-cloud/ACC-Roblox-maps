name: WONDERPOCKET Closed-Test Build

on:
  workflow_dispatch:
    inputs:
      publish_closed_test:
        description: Publish the verified build to the locked WONDERPOCKET Place for private closed testing
        required: true
        default: false
        type: boolean
      confirm_target:
        description: Type WONDERPOCKET:8805231520:124843214013484 to allow closed-test publish
        required: false
        type: string
  push:
    branches: [agent/wonderpocket-target]
    paths:
      - 'maps/wonderpocket/**'
      - 'scripts/build-wonderpocket.js'
      - 'scripts/qc-wonderpocket.js'
      - 'scripts/publish-wonderpocket-closed-test.js'
      - '.github/workflows/wonderpocket-prepublish.yml'

jobs:
  build-qc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify WONDERPOCKET branch
        run: |
          test "$GITHUB_REF_NAME" = "agent/wonderpocket-target" || { echo "Wrong branch: $GITHUB_REF_NAME"; exit 1; }

      - name: Build WONDERPOCKET place
        run: node scripts/build-wonderpocket.js

      - name: Run WONDERPOCKET QC
        run: node scripts/qc-wonderpocket.js

      - name: Upload closed-test place artifact
        uses: actions/upload-artifact@v4
        with:
          name: wonderpocket-v1.1-closed-test-place
          path: maps/wonderpocket/place.rbxlx
          retention-days: 7

      - name: Verify explicit closed-test target confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.publish_closed_test == true
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          test "$CONFIRM_TARGET" = "WONDERPOCKET:8805231520:124843214013484" || { echo "Closed-test target confirmation mismatch."; exit 1; }
          echo "Locked WONDERPOCKET target confirmed. This does not change Roblox public visibility/access."

      - name: Publish WONDERPOCKET closed-test place version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_closed_test == true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          WONDERPOCKET_CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: node scripts/publish-wonderpocket-closed-test.js
