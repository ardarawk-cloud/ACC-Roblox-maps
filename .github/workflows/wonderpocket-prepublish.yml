name: WONDERPOCKET Closed-Test Build

on:
  workflow_dispatch:
    inputs:
      publish_closed_test:
        description: Publish the verified build to the locked WONDERPOCKET Place for private closed testing
        required: true
        default: false
        type: boolean
      confirm_target:
        description: Type WONDERPOCKET:8805231520:124843214013484 to allow closed-test publish
        required: false
        type: string
  push:
    branches: [agent/wonderpocket-target]
    paths:
      - 'maps/wonderpocket/**'
      - 'scripts/build-wonderpocket.js'
      - 'scripts/qc-wonderpocket.js'
      - 'scripts/publish-wonderpocket-closed-test.js'
      - '.github/workflows/wonderpocket-prepublish.yml'

jobs:
  build-qc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify WONDERPOCKET branch
        run: |
          test "$GITHUB_REF_NAME" = "agent/wonderpocket-target" || { echo "Wrong branch: $GITHUB_REF_NAME"; exit 1; }

      - name: Build WONDERPOCKET place
        env:
          WONDERPOCKET_BUILD_MODE: closed-test
        run: node scripts/build-wonderpocket.js

      - name: Run WONDERPOCKET QC
        run: node scripts/qc-wonderpocket.js

      - name: Upload closed-test place artifact
        uses: actions/upload-artifact@v4
        with:
          name: wonderpocket-v1.3-closed-test-place
          path: maps/wonderpocket/place.rbxlx
          retention-days: 7

      - name: Detect one-time push publish request
        id: push_request
        if: github.event_name == 'push'
        shell: bash
        run: |
          MARKER='maps/wonderpocket/CLOSED_TEST_PUBLISH_REQUEST'
          EXPECTED='WONDERPOCKET:8805231520:124843214013484'
          BEFORE='${{ github.event.before }}'
          CHANGED='false'
          if [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -Eq '^0+$'; then
            if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Fxq "$MARKER"; then CHANGED='true'; fi
          else
            if git show --pretty='' --name-only "$GITHUB_SHA" | grep -Fxq "$MARKER"; then CHANGED='true'; fi
          fi
          if [ "$CHANGED" = 'true' ] && [ -f "$MARKER" ] && [ "$(tr -d '\r\n' < "$MARKER")" = "$EXPECTED" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'One-time locked WONDERPOCKET publish request accepted.'
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'No valid one-time push publish request in this commit.'
          fi

      - name: Verify explicit dispatch target confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.publish_closed_test == true
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          test "$CONFIRM_TARGET" = "WONDERPOCKET:8805231520:124843214013484" || { echo "Closed-test target confirmation mismatch."; exit 1; }
          echo "Locked WONDERPOCKET target confirmed. This does not change Roblox public visibility/access."

      - name: Publish WONDERPOCKET closed-test from dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_closed_test == true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          WONDERPOCKET_CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: node scripts/publish-wonderpocket-closed-test.js

      - name: Publish WONDERPOCKET closed-test from one-time push request
        id: push_publish
        if: github.event_name == 'push' && steps.push_request.outputs.publish == 'true'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          WONDERPOCKET_CONFIRM_TARGET: WONDERPOCKET:8805231520:124843214013484
        shell: bash
        run: |
          set +e
          node scripts/publish-wonderpocket-closed-test.js > /tmp/wonderpocket-publish.log 2>&1
          CODE=$?
          cat /tmp/wonderpocket-publish.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record WONDERPOCKET publish diagnostic
        if: github.event_name == 'push' && steps.push_request.outputs.publish == 'true'
        shell: bash
        run: |
          mkdir -p .diagnostics
          {
            echo "commit=$GITHUB_SHA"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "exit_code=${{ steps.push_publish.outputs.exit_code }}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "--- publisher output ---"
            cat /tmp/wonderpocket-publish.log
          } > .diagnostics/wonderpocket-last-publish.log
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/wonderpocket-last-publish.log
          git commit -m "Record WONDERPOCKET publish diagnostic [skip ci]" || true
          git push origin HEAD:agent/wonderpocket-target

      - name: Fail workflow if WONDERPOCKET publish failed
        if: github.event_name == 'push' && steps.push_request.outputs.publish == 'true' && steps.push_publish.outputs.exit_code != '0'
        run: |
          echo "WONDERPOCKET closed-test publish failed; diagnostic committed to .diagnostics/wonderpocket-last-publish.log"
          exit 1
