name: After School City Studio Visual Audit

on:
  push:
    branches: [after-school-city/scaffold-v1]
    paths:
      - '.github/workflows/after-school-city-visual-audit.yml'
      - 'scripts/after-school-city-visual-audit.py'
      - 'maps/after-school-city/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-audit:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Checkout scaffold branch
        uses: actions/checkout@v4
        with:
          ref: after-school-city/scaffold-v1
          fetch-depth: 0

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojoExe=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'asc-visual-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'asc-visual-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojoExe=$exe.FullName
          }
          & $rojoExe --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojoExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build isolated visual place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'after-school-city-visual.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
          if(-not (Test-Path $place)){throw 'Visual RBXL missing'}
          if((Get-Item $place).Length -lt 1024){throw 'Visual RBXL suspiciously small'}
          "ASC_VISUAL_PLACE=$place" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare visual automation dependencies
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --quiet --disable-pip-version-check pillow pywinauto
          python -c "import PIL, pywinauto; print('Studio visual dependencies PASS')"

      - name: Capture seven real Roblox Studio views
        id: capture
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/after-school-city-visual-audit.py

      - name: Upload visual diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-visual-${{ github.run_id }}
          path: deploy-status/after-school-city-visual
          if-no-files-found: warn
          retention-days: 7

      - name: Persist visual evidence or failure diagnostic
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='deploy-status/after-school-city-visual'
          if(-not (Test-Path $dir)){New-Item -ItemType Directory -Force -Path $dir | Out-Null}
          if(-not (Test-Path "$dir/audit.json") -and -not (Test-Path "$dir/error.json")){
            $fallback=@{
              status='FAILED'
              stage='workflow-fallback'
              sourceCommit=$env:GITHUB_SHA
              runId=$env:GITHUB_RUN_ID
              error='Capture step produced neither audit.json nor error.json'
              publishPerformed=$false
            } | ConvertTo-Json -Depth 4
            Set-Content -Path "$dir/error.json" -Value $fallback -Encoding utf8
          }
          git config user.name 'ACC After School City Visual Auditor'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/after-school-city-visual
          if(-not (git diff --cached --quiet)){git commit -m 'Record After School City Studio visual audit evidence [skip ci]'}
          git pull --rebase origin after-school-city/scaffold-v1
          git push origin HEAD:after-school-city/scaffold-v1

      - name: Enforce visual capture success
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='deploy-status/after-school-city-visual'
          if('${{ steps.capture.outcome }}' -ne 'success'){
            if(Test-Path "$dir/error.json"){
              Write-Host '--- persisted visual error ---'
              Get-Content "$dir/error.json" -Raw
            }
            throw 'Studio visual capture failed; diagnostic persisted.'
          }
          if(-not (Test-Path "$dir/audit.json")){throw 'audit.json missing'}
          $audit=Get-Content "$dir/audit.json" -Raw | ConvertFrom-Json
          if($audit.status -ne 'CAPTURED'){throw 'Visual status is not CAPTURED'}
          if($audit.publishPerformed -ne $false){throw 'Visual audit must never publish'}
          if([int]$audit.imageCount -ne 7){throw "Expected 7 images, got $($audit.imageCount)"}
          foreach($n in @('01-school-spawn','02-downtown','03-skate-park','04-city-park','05-residential','06-sports-field','07-city-overview')){
            $p="$dir/$n.jpg"
            if(-not (Test-Path $p)){throw "Missing $p"}
            if((Get-Item $p).Length -lt 5000){throw "Screenshot suspiciously small: $p"}
          }
          Write-Host 'AFTER SCHOOL CITY STUDIO VISUAL CAPTURE PASS'
