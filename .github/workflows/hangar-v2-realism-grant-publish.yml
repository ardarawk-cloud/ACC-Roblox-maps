name: HANGAR v2 REALISM GRANT PUBLISH

on:
  push:
    branches: [aeroclub-hangar-rebuild-v1-lab]
    paths:
      - '.github/workflows/hangar-v2-realism-grant-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hangar-v2-realism-grant-publish
  cancel-in-progress: true

env:
  LIVE_UNIVERSE_ID: '10745364913'
  LIVE_PLACE_ID: '76001567401911'
  REALISM_ASSET_ID: '139052271482898'
  REALISM_GLB_BYTES: '917260'
  REALISM_GLB_SHA256: 'f9f0102ecace34a1ce09b5dd1f998ca2451feb5506bfbddd448c39cd8a7b475e'

jobs:
  grant-publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify approved realism source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=[IO.File]::ReadAllText('maps/aeroclub-hangar/default.project.json')
          foreach($m in @('HangarEnvironmentRealismV2_0','HangarRealtimeWITAV1_1')){if($project -notmatch [regex]::Escape($m)){throw "project marker missing $m"}}
          $runtime=[IO.File]::ReadAllText('maps/aeroclub-hangar/server/visual-bootstrap-v2_0.server.lua')
          foreach($m in @('HANGAR_V20_REALISM_MODEL_ASSET_ID','V2_0_ENVIRONMENT_REALISM_REBUILD')){if($runtime -notmatch [regex]::Escape($m)){throw "runtime marker missing $m"}}
          Write-Host "HANGAR_V2_APPROVED_ASSET=$env:REALISM_ASSET_ID"

      - name: Grant approved realism asset with propagation retry
        shell: powershell
        env:
          ROBLOX_ASSET_KEY: ${{ secrets.AM_STUDIO }}
          ROBLOX_MASTER_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          $body=@{subjectType='Universe';subjectId=$env:LIVE_UNIVERSE_ID;action='Use';requests=@(@{assetId=[int64]$env:REALISM_ASSET_ID;grantToDependencies=$true})}|ConvertTo-Json -Depth 8 -Compress
          $url='https://apis.roblox.com/asset-permissions-api/v1/assets/permissions'
          $granted=$false
          for($attempt=1;$attempt -le 8 -and -not $granted;$attempt++){
            foreach($keyName in @('ASSET','MASTER')){
              $key=if($keyName -eq 'ASSET'){$env:ROBLOX_ASSET_KEY}else{$env:ROBLOX_MASTER_KEY}
              if([string]::IsNullOrWhiteSpace($key)){continue}
              try{
                $resp=Invoke-RestMethod -Method Patch -Uri $url -Headers @{'x-api-key'=$key} -ContentType 'application/json' -Body $body
                $success=@($resp.successAssetIds|ForEach-Object{[string]$_})
                $errors=@($resp.errors)
                Write-Host "grant attempt=$attempt key=$keyName success=$($success -join ',') errors=$($errors.Count)"
                if($success -contains [string]$env:REALISM_ASSET_ID){$granted=$true;break}
              }catch{
                Write-Warning "grant attempt=$attempt key=$keyName failed: $($_.Exception.Message)"
              }
            }
            if(-not $granted){Start-Sleep -Seconds ([math]::Min(30,5*$attempt))}
          }
          if(-not $granted){throw "unable to grant approved realism asset $env:REALISM_ASSET_ID"}
          Write-Host 'HANGAR_V2_REALISM_GRANT_CONFIRMED'

      - name: Inject fixed approved realism asset
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='maps/aeroclub-hangar/server/visual-bootstrap-v2_0.server.lua'
          $text=[IO.File]::ReadAllText($path)
          $pattern='local MODEL_ASSET_ID = \d+ -- HANGAR_V20_REALISM_MODEL_ASSET_ID'
          if($text -notmatch $pattern){throw 'asset injection marker missing'}
          $text=[regex]::Replace($text,$pattern,"local MODEL_ASSET_ID = $env:REALISM_ASSET_ID -- HANGAR_V20_REALISM_MODEL_ASSET_ID")
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))

      - name: Prepare Rojo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $d=Join-Path $env:RUNNER_TEMP 'hangar-v2-rescue-rojo';$z=Join-Path $env:RUNNER_TEMP 'hangar-v2-rescue-rojo.zip'
            if(Test-Path $d){Remove-Item $d -Recurse -Force}
            New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive -Path $z -DestinationPath $d -Force
            $e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1
            if(-not $e){throw 'rojo missing'}
            $rojo=$e.FullName
          }
          "ROJO_EXE=$rojo"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build HANGAR v2 realism place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'hangar-v2-realism-fixed.rbxlx'
          & $env:ROJO_EXE build 'maps/aeroclub-hangar/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          $xml=[IO.File]::ReadAllText($place)
          foreach($m in @('HangarEnvironmentRealismV2_0','HangarRealtimeWITAV1_1',$env:REALISM_ASSET_ID,'READY_V2_REALISM_OWNER_QC')){if($xml -notmatch [regex]::Escape([string]$m)){throw "built place missing $m"}}
          "HANGAR_PLACE=$place"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_BYTES=$((Get-Item $place).Length)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_SHA256=$((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish MAIN HANGAR and restart
        shell: powershell
        env:
          ROBLOX_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          $url="https://apis.roblox.com/universes/v1/$env:LIVE_UNIVERSE_ID/places/$env:LIVE_PLACE_ID/versions?versionType=Published"
          $version=$null
          for($i=1;$i -le 6;$i++){
            try{
              $r=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers @{'x-api-key'=$env:ROBLOX_KEY} -ContentType 'application/xml' -InFile $env:HANGAR_PLACE
              $version=[int](($r.Content|ConvertFrom-Json).versionNumber)
              break
            }catch{Write-Warning "publish attempt $i failed: $($_.Exception.Message)";Start-Sleep -Seconds ([math]::Min(30,3*$i))}
          }
          if(-not $version){throw 'v2 realism publish failed'}
          "HANGAR_LIVE_VERSION=$version"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $restart="https://apis.roblox.com/cloud/v2/universes/$env:LIVE_UNIVERSE_ID`:restartServers"
          $rr=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $restart -Headers @{'x-api-key'=$env:ROBLOX_KEY} -ContentType 'application/json' -Body '{}'
          if([int]$rr.StatusCode -lt 200 -or [int]$rr.StatusCode -ge 300){throw "restart HTTP $($rr.StatusCode)"}
          Write-Host "HANGAR_V2_REALISM_LIVE version=$version"

      - name: Save HANGAR v2 receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $obj=[ordered]@{status='LIVE_PUBLISHED';ok=$true;project='HANGAR';phase='PHASE_2_ENVIRONMENT_REALISM_REBUILD';universeId=$env:LIVE_UNIVERSE_ID;placeId=$env:LIVE_PLACE_ID;sourceCommit=$env:GITHUB_SHA;mode='HANGAR_V2_ENVIRONMENT_REALISM';staticModelAssetId=[int64]$env:REALISM_ASSET_ID;modelModeration='Approved';robloxVersion=[int]$env:HANGAR_LIVE_VERSION;glbBytes=[int64]$env:REALISM_GLB_BYTES;glbSha256=$env:REALISM_GLB_SHA256;placeBytes=[int64]$env:HANGAR_PLACE_BYTES;placeSha256=$env:HANGAR_PLACE_SHA256;spawn='ACTUAL_FRONT_PLUS_Z_FACE_CENTRAL_JET';wita='REALTIME_UTC_PLUS_8';lasers='DISABLED';visibleFallback='NONE';environmentDetail='V2_DETAILED_JET_VEHICLES_APRON_HANGAR_ZONES';serversRestarted=$true;visualQC='PENDING_OWNER_SCREENSHOT'}
          $text=$obj|ConvertTo-Json -Depth 8
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"))
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='HANGAR-V2'}
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/hangar-live.json";$sha=$null
          try{$old=Invoke-RestMethod -Headers $h -Uri ($url+'?ref='+$env:GITHUB_REF_NAME);$sha=[string]$old.sha}catch{}
          $body=@{message='Record HANGAR v2 realism LIVE [skip ci]';content=$b64;branch=$env:GITHUB_REF_NAME};if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $url -Body ($body|ConvertTo-Json -Depth 5)|Out-Null
