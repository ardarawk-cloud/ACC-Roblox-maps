name: BBYA Skatepark Talon Permission Bridge v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-skatepark-talon-permission-bridge-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy proven Talon permission workflow and dispatch
        shell: bash
        env:
          BRIDGE_TOKEN: ${{ secrets.BALI_ENTERTAIMENT_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${BRIDGE_TOKEN:-}" ] || { echo 'BALI_ENTERTAIMENT_TOKEN missing'; exit 20; }
          TEMPLATE='https://api.github.com/repos/balientertaiment-web/Roblox-backup-publish/contents/.github/workflows/asc-kpop-permission.yml'
          TARGET='https://api.github.com/repos/balientertaiment-web/Roblox-backup-publish/contents/.github/workflows/bbya-skatepark-permission.yml'
          curl -fsSL -H "Authorization: Bearer $BRIDGE_TOKEN" -H 'Accept: application/vnd.github+json' "$TEMPLATE?ref=main" > /tmp/template.json
          jq -r '.content' /tmp/template.json | tr -d '\n' | base64 -d > /tmp/workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/workflow.yml')
          s=p.read_text()
          old_ids='ids = [130787669922537,128649936033154,87125114946473,138472779676021,115164716109234,106731979070100,82573111697282,84541295288456,112025968048348,102724403050017,101221026959656,102729376941557,130045741934771,94909694876329,128638509475237,115814496839320,134192777315026,85568242991971]'
          new_ids='ids = [101433831748471,73111765506214,134467357340949,94716486418996,137855682924521,100571973862831,76764826294674,73605786993749,122266407959894,120903123891114,85284576958779,114950574110478,77600449290121,106253638699689]'
          replacements=[
            ('name: ASC KPOP Audio Permission','name: BBYA Skatepark Audio Permission'),
            ("UNIVERSE_ID: '10745359869'","UNIVERSE_ID: '8116636513'"),
            ('Grant KPOP bank audio use to After School City','Grant Skatepark audio use to BBYA Social Hub'),
            (old_ids,new_ids),
            ("report={'bank':'KPOP'","report={'bank':'SKATEPARK'"),
            ('asc-kpop-permission-result.json','bbya-skatepark-permission-result.json'),
            ('asc-kpop-permission-result','bbya-skatepark-permission-result'),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('TEMPLATE_TOKEN_NOT_FOUND:'+old)
              s=s.replace(old,new)
          p.write_text(s)
          PY
          GET_CODE="$(curl -sS -o /tmp/current.json -w '%{http_code}' -H "Authorization: Bearer $BRIDGE_TOKEN" -H 'Accept: application/vnd.github+json' "$TARGET?ref=main")"
          SHA=''
          if [ "$GET_CODE" = '200' ]; then SHA="$(jq -r '.sha' /tmp/current.json)"; elif [ "$GET_CODE" != '404' ]; then cat /tmp/current.json; exit 21; fi
          CONTENT="$(base64 -w0 /tmp/workflow.yml)"
          if [ -n "$SHA" ]; then
            PAYLOAD="$(jq -nc --arg msg 'Configure BBYA Skatepark Talon permission' --arg content "$CONTENT" --arg branch 'main' --arg sha "$SHA" '{message:$msg,content:$content,branch:$branch,sha:$sha}')"
          else
            PAYLOAD="$(jq -nc --arg msg 'Configure BBYA Skatepark Talon permission' --arg content "$CONTENT" --arg branch 'main' '{message:$msg,content:$content,branch:$branch}')"
          fi
          PUT_CODE="$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $BRIDGE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$TARGET" -d "$PAYLOAD")"
          if [ "$PUT_CODE" != '200' ] && [ "$PUT_CODE" != '201' ]; then cat /tmp/put.json; exit 22; fi
          sleep 2
          DISPATCH_CODE="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST -H "Authorization: Bearer $BRIDGE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' 'https://api.github.com/repos/balientertaiment-web/Roblox-backup-publish/actions/workflows/bbya-skatepark-permission.yml/dispatches' -d '{"ref":"main"}')"
          [ "$DISPATCH_CODE" = '204' ] || { cat /tmp/dispatch.json; exit 23; }
          echo 'BBYA_SKATEPARK_TALON_PERMISSION_DISPATCHED'
