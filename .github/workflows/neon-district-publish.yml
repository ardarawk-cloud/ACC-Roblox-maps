name: Publish NEON DISTRICT V0.1

on:
  push:
    branches: [main]
    paths:
      - 'maps/neon-district/**'
      - '.github/workflows/neon-district-publish.yml'
  workflow_dispatch:

concurrency:
  group: neon-district-live-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  NEON_UNIVERSE_ID: '10745364913'
  NEON_PLACE_ID: '76001567401911'
  NEON_MODE: 'NEON_DISTRICT_STATIC_V01'

jobs:
  build-publish-verify:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Source gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project='maps/neon-district/default.project.json'
          if(-not(Test-Path $project)){throw 'NEON DISTRICT project missing'}
          $src=Get-Content $project -Raw
          foreach($marker in @('NeonDistrict','NEON_DISTRICT','05_ClubOmega','03_ChromeMarket','06_PowerSector','07_StackResidence','08_RooftopNetwork')){
            if($src -notmatch [regex]::Escape($marker)){throw "Missing marker: $marker"}
          }
          if($src -match 'visual-rescue-v7.server.lua' -or $src -match 'full-mesh-v8.server.lua' -or $src -match 'static-mesh-v9.server.lua'){
            throw 'Retired HANGAR visual generator reference detected'
          }
          Write-Host 'NEON_DISTRICT_SOURCE_GATE_PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojo=$cmd.Source
          } else {
            $d=Join-Path $env:RUNNER_TEMP 'neon-rojo'
            $z=Join-Path $env:RUNNER_TEMP 'neon-rojo.zip'
            if(Test-Path $d){Remove-Item $d -Recurse -Force}
            New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive -Path $z -DestinationPath $d -Force
            $e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1
            if(-not $e){throw 'rojo.exe missing'}
            $rojo=$e.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo failed'}
          "ROJO_EXE=$rojo"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build NEON DISTRICT place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'neon-district-v01.rbxlx'
          & $env:ROJO_EXE build 'maps/neon-district/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not(Test-Path $place)){throw 'NEON DISTRICT RBXLX missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 10000){throw "NEON DISTRICT RBXLX unexpectedly small: $bytes bytes"}
          $hash=(Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          "NEON_PLACE_FILE=$place"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NEON_PLACE_BYTES=$bytes"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NEON_PLACE_SHA256=$hash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "NEON_DISTRICT_BUILD_PASS bytes=$bytes sha256=$hash"

      - name: Publish to former HANGAR Roblox place
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'ROBLOX_OPEN_CLOUD_MASTER_V2 secret missing'}
          $url="https://apis.roblox.com/universes/v1/$env:NEON_UNIVERSE_ID/places/$env:NEON_PLACE_ID/versions?versionType=Published"
          $headers=@{'x-api-key'=$env:ROBLOX_API_KEY}
          $resp=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers $headers -ContentType 'application/xml' -InFile $env:NEON_PLACE_FILE
          if([int]$resp.StatusCode -lt 200 -or [int]$resp.StatusCode -ge 300){throw "Roblox publish HTTP $($resp.StatusCode)"}
          $payload=$resp.Content|ConvertFrom-Json
          $version=[int]$payload.versionNumber
          if($version -le 0){throw "Invalid Roblox version: $version"}
          "NEON_ROBLOX_VERSION=$version"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "NEON_DISTRICT_PUBLISHED version=$version"

      - name: Persist publish receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=[ordered]@{
            status='LIVE_PUBLISHED'
            ok=$true
            universeId=$env:NEON_UNIVERSE_ID
            placeId=$env:NEON_PLACE_ID
            sourceCommit=$env:GITHUB_SHA
            mode=$env:NEON_MODE
            robloxVersion=[int]$env:NEON_ROBLOX_VERSION
            placeBytes=[int64]$env:NEON_PLACE_BYTES
            sha256=$env:NEON_PLACE_SHA256
            publishRun=[int64]$env:GITHUB_RUN_ID
            publishedAt=(Get-Date).ToUniversalTime().ToString('o')
            previewUrl='https://www.roblox.com/games/76001567401911'
          }
          $text=$receipt|ConvertTo-Json -Depth 5
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"\n"))
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='Neon-District-publisher'}
          $path='deploy-status/neon-district.json'
          $enc=(($path.Split('/')|ForEach-Object{[Uri]::EscapeDataString($_)}) -join '/')
          $u="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$enc"
          $sha=$null
          try{$old=Invoke-RestMethod -Headers $h -Uri ($u+'?ref=main');$sha=[string]$old.sha}catch{if([int]$_.Exception.Response.StatusCode -ne 404){throw}}
          $body=@{message="Record NEON DISTRICT v$env:NEON_ROBLOX_VERSION live [skip ci]";content=$b64;branch='main'}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $u -Body ($body|ConvertTo-Json -Depth 4)|Out-Null
          Write-Host "NEON_DISTRICT_RECEIPT_PERSISTED version=$env:NEON_ROBLOX_VERSION source=$env:GITHUB_SHA"
