name: Publish NEON DISTRICT V0.1

on:
  push:
    branches: [main]
    paths:
      - 'maps/neon-district/**'
      - '.github/workflows/neon-district-publish.yml'
  workflow_dispatch:

concurrency:
  group: neon-district-live-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  NEON_UNIVERSE_ID: '10745364913'
  NEON_PLACE_ID: '76001567401911'
  NEON_MODE: 'NEON_DISTRICT_STATIC_V01'

jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Source gate
        shell: bash
        run: |
          set -euo pipefail
          project='maps/neon-district/default.project.json'
          test -f "$project"
          for marker in NeonDistrict NEON_DISTRICT 05_ClubOmega 03_ChromeMarket 06_PowerSector 07_StackResidence 08_RooftopNetwork; do
            grep -Fq "$marker" "$project" || { echo "Missing marker: $marker"; exit 1; }
          done
          if grep -Eq 'visual-rescue-v7\.server\.lua|full-mesh-v8\.server\.lua|static-mesh-v9\.server\.lua' "$project"; then
            echo 'Retired HANGAR visual generator reference detected'
            exit 1
          fi
          echo 'NEON_DISTRICT_SOURCE_GATE_PASS'

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/neon-rojo"
          z="$RUNNER_TEMP/neon-rojo.zip"
          rm -rf "$d"
          mkdir -p "$d"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$z"
          unzip -q "$z" -d "$d"
          rojo="$(find "$d" -type f -name rojo | head -n 1)"
          test -n "$rojo"
          chmod +x "$rojo"
          "$rojo" --version
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build NEON DISTRICT place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/neon-district-v01.rbxlx"
          "$ROJO_EXE" build 'maps/neon-district/default.project.json' -o "$place"
          test -f "$place"
          bytes="$(stat -c%s "$place")"
          if [ "$bytes" -lt 10000 ]; then
            echo "NEON DISTRICT RBXLX unexpectedly small: $bytes bytes"
            exit 1
          fi
          hash="$(sha256sum "$place" | awk '{print $1}')"
          echo "NEON_PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "NEON_PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "NEON_PLACE_SHA256=$hash" >> "$GITHUB_ENV"
          echo "NEON_DISTRICT_BUILD_PASS bytes=$bytes sha256=$hash"

      - name: Publish to former HANGAR Roblox place
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          set -euo pipefail
          test -n "${ROBLOX_API_KEY:-}"
          url="https://apis.roblox.com/universes/v1/$NEON_UNIVERSE_ID/places/$NEON_PLACE_ID/versions?versionType=Published"
          response="$RUNNER_TEMP/neon-publish.json"
          code="$(curl -sS -o "$response" -w '%{http_code}' -X POST             -H "x-api-key: $ROBLOX_API_KEY"             -H 'Content-Type: application/xml'             --data-binary @"$NEON_PLACE_FILE"             "$url")"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat "$response"
            echo "Roblox publish HTTP $code"
            exit 1
          fi
          version="$(python3 - "$response" <<'PY'
import json,sys
with open(sys.argv[1], encoding='utf-8') as f:
    data=json.load(f)
print(int(data.get('versionNumber', 0)))
PY
)"
          if [ "$version" -le 0 ]; then
            cat "$response"
            echo "Invalid Roblox version: $version"
            exit 1
          fi
          echo "NEON_ROBLOX_VERSION=$version" >> "$GITHUB_ENV"
          echo "NEON_DISTRICT_PUBLISHED version=$version"

      - name: Persist publish receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/neon-receipt.json"
          python3 - "$receipt" <<'PY'
import json, os, sys
from datetime import datetime, timezone

payload = {
    "status": "LIVE_PUBLISHED",
    "ok": True,
    "universeId": os.environ["NEON_UNIVERSE_ID"],
    "placeId": os.environ["NEON_PLACE_ID"],
    "sourceCommit": os.environ["GITHUB_SHA"],
    "mode": os.environ["NEON_MODE"],
    "robloxVersion": int(os.environ["NEON_ROBLOX_VERSION"]),
    "placeBytes": int(os.environ["NEON_PLACE_BYTES"]),
    "sha256": os.environ["NEON_PLACE_SHA256"],
    "publishRun": int(os.environ["GITHUB_RUN_ID"]),
    "publishedAt": datetime.now(timezone.utc).isoformat(),
    "previewUrl": "https://www.roblox.com/games/76001567401911"
}
with open(sys.argv[1], "w", encoding="utf-8") as f:
    json.dump(payload, f, indent=2)
    f.write("\n")
PY
          b64="$(base64 -w0 "$receipt")"
          api="repos/$GITHUB_REPOSITORY/contents/deploy-status/neon-district.json"
          sha="$(gh api "$api?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "$api" -f message="Record NEON DISTRICT v$NEON_ROBLOX_VERSION live [skip ci]" -f content="$b64" -f branch=main)
          if [ -n "$sha" ]; then
            args+=(-f sha="$sha")
          fi
          gh api "${args[@]}" >/dev/null
          echo "NEON_DISTRICT_RECEIPT_PERSISTED version=$NEON_ROBLOX_VERSION source=$GITHUB_SHA"
