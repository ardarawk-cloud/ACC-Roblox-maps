name: After School City V0.9.2.3 Exact Publish

on:
  push:
    branches:
      - after-school-city/v0923-signage-typography-boost-2
    paths:
      - '.github/workflows/after-school-city-v0923-signage-typography-qc.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 0d930f955522d36f16b0d363f74d962105eefcdc
      BASE_LIVE_SHA: 76362800d3133ffc01ca776ee5efe16f51e3a49a
      QC_RUN_ID: '33531359049'
      QC_ARTIFACT_ID: '9809857234'
      QC_ARTIFACT_NAME: after-school-city-v0923-qc-0d930f955522d36f16b0d363f74d962105eefcdc
      EXPECTED_BYTES: '154906'
      EXPECTED_SHA256: 14a1c57aa9b3fc67047082f04a95f479452da7c1c0228797f8db309cf70d7fd9
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      GH_TOKEN: ${{ github.token }}
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
    steps:
      - name: Verify LIVE v40 authority
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/ardarawk-cloud/ACC-Roblox-maps/main/deploy-status/after-school-city-publish-global-signage-readability-v0-9-2-2.json' -o "$RUNNER_TEMP/live.json"
          [[ "$(jq -r '.status' "$RUNNER_TEMP/live.json")" == 'LIVE_PUBLISHED' ]]
          [[ "$(jq -r '.sourceCommit' "$RUNNER_TEMP/live.json")" == "$BASE_LIVE_SHA" ]]
          [[ "$(jq -r '.versionNumber' "$RUNNER_TEMP/live.json")" == '40' ]]
          echo 'LIVE AUTHORITY PASS v40'

      - name: Verify exact QC authority
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]]
          api='https://api.github.com/repos/ardarawk-cloud/ACC-Roblox-maps'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$QC_RUN_ID" -o "$RUNNER_TEMP/qc-run.json"
          [[ "$(jq -r '.status' "$RUNNER_TEMP/qc-run.json")" == 'completed' ]]
          [[ "$(jq -r '.conclusion' "$RUNNER_TEMP/qc-run.json")" == 'success' ]]
          [[ "$(jq -r '.head_sha' "$RUNNER_TEMP/qc-run.json")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r '.path' "$RUNNER_TEMP/qc-run.json")" == '.github/workflows/after-school-city-v0923-signage-typography-qc.yml' ]]
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$QC_RUN_ID/artifacts" -o "$RUNNER_TEMP/artifacts.json"
          count=$(jq --argjson id "$QC_ARTIFACT_ID" --arg n "$QC_ARTIFACT_NAME" --arg s "$SOURCE_SHA" '[.artifacts[] | select(.id == $id and .name == $n and .expired == false and .workflow_run.head_sha == $s)] | length' "$RUNNER_TEMP/artifacts.json")
          [[ "$count" == '1' ]]
          echo "QC AUTHORITY PASS run=$QC_RUN_ID artifact=$QC_ARTIFACT_ID"

      - name: Download exact QC artifact
        uses: actions/download-artifact@v4
        with:
          name: after-school-city-v0923-qc-0d930f955522d36f16b0d363f74d962105eefcdc
          path: ${{ runner.temp }}/asc-v0923-qc
          github-token: ${{ github.token }}
          repository: ardarawk-cloud/ACC-Roblox-maps
          run-id: 33531359049

      - name: Verify exact RBXL bytes and SHA256
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/asc-v0923-qc/qc-receipt.txt"
          tr -d '\r' < "$receipt" > "$RUNNER_TEMP/receipt.txt"
          grep -Fxq 'STATUS=QC_PASSED' "$RUNNER_TEMP/receipt.txt"
          grep -Fxq 'MODE=SIGNAGE_TYPOGRAPHY_BOOST_V0_9_2_3' "$RUNNER_TEMP/receipt.txt"
          grep -Fxq "SOURCE_COMMIT=$SOURCE_SHA" "$RUNNER_TEMP/receipt.txt"
          grep -Fxq "RBXL_BYTES=$EXPECTED_BYTES" "$RUNNER_TEMP/receipt.txt"
          grep -Fxq "SHA256=$EXPECTED_SHA256" "$RUNNER_TEMP/receipt.txt"
          grep -Fxq 'SIGNAGE_SCOPE=ALL_WORLD_SURFACEGUI_TEXT_EXPLICIT_FIT' "$RUNNER_TEMP/receipt.txt"
          grep -Fxq 'BOARD_GEOMETRY=UNCHANGED' "$RUNNER_TEMP/receipt.txt"
          mapfile -t places < <(find "$RUNNER_TEMP/asc-v0923-qc" -type f -name '*.rbxl' -print)
          [[ ${#places[@]} -eq 1 ]]
          place="${places[0]}"
          bytes=$(stat -c%s "$place")
          sha=$(sha256sum "$place" | awk '{print $1}')
          [[ "$bytes" == "$EXPECTED_BYTES" ]]
          [[ "$sha" == "$EXPECTED_SHA256" ]]
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "EXACT ARTIFACT PASS bytes=$bytes sha=$sha"

      - name: Publish exact V0.9.2.3 artifact to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/publish.json" -w '%{http_code}' -X POST "$url" -H "x-api-key: $ROBLOX_API_KEY" -H 'Content-Type: application/octet-stream' --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/publish.json")
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "HTTP $http: $body"; exit 40; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/publish.json")
          [[ "$version" =~ ^[0-9]+$ ]]
          echo "ROBLOX_PUBLISHED_VERSION=$version"
          echo "ROBLOX_PUBLISH_PASS source=$SOURCE_SHA artifact=$QC_ARTIFACT_ID version=$version bytes=$EXPECTED_BYTES sha256=$EXPECTED_SHA256"
