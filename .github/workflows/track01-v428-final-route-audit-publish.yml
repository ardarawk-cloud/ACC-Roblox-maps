name: Publish TRACK 01 v4.2.8 Final Route Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/track01-v428-final-route-audit-publish.yml'
  workflow_dispatch:

concurrency:
  group: track01-live-publish
  cancel-in-progress: false

env:
  TRACK01_SOURCE_SHA: 9715906d6b096c6d66c8e33f004e96700dac22e2
  TRACK01_VERSION: 4.2.8
  TRACK01_UNIVERSE_ID: '10745349805'
  TRACK01_PLACE_ID: '79748872921213'
  TRACK01_MODE: FINAL_END_TO_END_ROUTE_AUDIT_V18
  TRACK01_AUDIO_BLOB: 0fe84fe6a0f553f3d4cf0ee4726e6081584e580f
  TRACK01_TICKET_BLOB: 02f830d9a33486c0078626c5e66bc2e76b0ff914
  TRACK01_BOARDING_BLOB: f6974c03f55a8f7eb6d9ab8e0ba8cec12f9224bc
  TRACK01_CAR01_CAR02_BLOB: 9efa86ea20d5fe07f374af7a69c193a7f95cfb6e
  TRACK01_CAR02_CAR03_BLOB: 47991761ecec913995bf1acff85faef6ce6e84ac
  TRACK01_CAR03_CAR04_BLOB: 2523c77b0dab0730030a1850348a44956a94a1e8
  TRACK01_CAR04_YARD_BLOB: 5cf204ead33ef2502689c00e353e5dd5130ac27a
  TRACK01_FINAL_QC_CLIENT_BLOB: 96c232a48b2c9e72e9bddc11f5b2a731cb16d470

jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout receipt branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact TRACK 01 v4.2.8 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TRACK01_SOURCE_SHA }}
          path: source
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate exact source and preserved v39 systems
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "$TRACK01_SOURCE_SHA"
          test "$(git -C source hash-object maps/track-01/music-runtime-v422.server.lua)" = "$TRACK01_AUDIO_BLOB"
          test "$(git -C source hash-object maps/track-01/ticket-flow-hotfix-v11.server.lua)" = "$TRACK01_TICKET_BLOB"
          test "$(git -C source hash-object maps/track-01/car01-boarding-flow-v13.server.lua)" = "$TRACK01_BOARDING_BLOB"
          test "$(git -C source hash-object maps/track-01/car01-car02-flow-v14.server.lua)" = "$TRACK01_CAR01_CAR02_BLOB"
          test "$(git -C source hash-object maps/track-01/car02-car03-flow-v15.server.lua)" = "$TRACK01_CAR02_CAR03_BLOB"
          test "$(git -C source hash-object maps/track-01/car03-car04-flow-v16.server.lua)" = "$TRACK01_CAR03_CAR04_BLOB"
          test "$(git -C source hash-object maps/track-01/car04-yard-final-v17.server.lua)" = "$TRACK01_CAR04_YARD_BLOB"
          test "$(git -C source hash-object maps/track-01/final-qc.client.lua)" = "$TRACK01_FINAL_QC_CLIENT_BLOB"

          node - <<'NODE'
          const fs=require('fs');
          const c=require('./source/maps/track-01/track01.config.json');
          if(String(c.universeId)!==process.env.TRACK01_UNIVERSE_ID) throw new Error('Wrong Universe ID');
          if(String(c.placeId)!==process.env.TRACK01_PLACE_ID) throw new Error('Wrong Place ID');
          if(String(c.version)!==process.env.TRACK01_VERSION) throw new Error('Wrong TRACK 01 version');
          if(!c.enabled) throw new Error('TRACK 01 target disabled');

          const audit=fs.readFileSync('./source/maps/track-01/final-route-audit-v18.server.lua','utf8');
          for(const marker of [
            'TRACK01_FinalRouteAudit_v18',
            'READY_FOR_RUNTIME_QC',
            'TRACK01_FINAL_ROUTE_COMPLETE',
            'RUNTIME_PASS_RECORDED',
            'ACC_TRACK01_FINAL_ROUTE_AUDIT_READY',
            'ACC_TRACK01_RUNTIME_ROUTE_PASS'
          ]) if(!audit.includes(marker)) throw new Error('Missing audit marker: '+marker);

          const client=fs.readFileSync('./source/maps/track-01/final-qc.client.lua','utf8');
          for(const marker of [
            'TRACK01_REACHED_ENDLINE',
            'TRACK01_FINAL_ROUTE_COMPLETE',
            'END OF LINE',
            'ROUTE COMPLETE',
            'END-TO-END RUNTIME PASS RECORDED'
          ]) if(!client.includes(marker)) throw new Error('Missing final-QC feedback marker: '+marker);

          const builder=fs.readFileSync('./source/scripts/build-track01-v42.js','utf8');
          if(!builder.includes('TRACK01_FinalRouteAuditV18') || !builder.includes('final-route-audit-v18.server.lua')) throw new Error('v1.8 audit not embedded by builder');

          const audio=fs.readFileSync('./source/maps/track-01/music-runtime-v422.server.lua','utf8');
          if(!audio.includes('local VERSION="4.2.2"') || !audio.includes('PRELOAD_EQUAL_POWER_RECOVERY')) throw new Error('Audio baseline changed');
          if(audio.includes('Z_OFFSETS') || audio.includes('Emitter_%02d')) throw new Error('Legacy multi-emitter topology leaked');

          console.log('TRACK 01 v4.2.8 source validation PASS');
          NODE

      - name: Build exact TRACK 01 v4.2.8 place
        working-directory: source
        run: node scripts/build-track01-v42.js

      - name: Validate built place
        shell: bash
        run: |
          set -euo pipefail
          place='source/maps/track-01/place.rbxlx'
          test -s "$place"
          test "$(wc -c < "$place")" -gt 220000
          grep -q 'TRACK01_MusicAutoDJ' "$place"
          grep -q 'TRACK01_TicketFlowHotfixV11' "$place"
          grep -q 'TRACK01_Car01BoardingFlowV13' "$place"
          grep -q 'TRACK01_Car01Car02FlowV14' "$place"
          grep -q 'TRACK01_Car02Car03FlowV15' "$place"
          grep -q 'TRACK01_Car03Car04FlowV16' "$place"
          grep -q 'TRACK01_Car04YardFinalV17' "$place"
          grep -q 'TRACK01_FinalRouteAuditV18' "$place"
          grep -q 'READY_FOR_RUNTIME_QC' "$place"
          grep -q 'RUNTIME_PASS_RECORDED' "$place"
          grep -q 'END-TO-END RUNTIME PASS RECORDED' "$place"
          if grep -q 'Z_OFFSETS' "$place"; then echo 'Legacy Z_OFFSETS leaked into place' >&2; exit 1; fi
          if grep -q 'Emitter_%02d' "$place"; then echo 'Legacy numbered emitter fan-out leaked into place' >&2; exit 1; fi
          echo 'TRACK 01 v4.2.8 built-place validation PASS'

      - name: Record place metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          place='source/maps/track-01/place.rbxlx'
          echo "bytes=$(wc -c < "$place" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$place" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish exact v4.2.8 source to Roblox
        id: publish
        continue-on-error: true
        working-directory: source
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: node scripts/publish-track01-direct.js

      - name: Build v4.2.8 publish receipt
        if: always()
        env:
          PLACE_BYTES: ${{ steps.meta.outputs.bytes }}
          PLACE_SHA256: ${{ steps.meta.outputs.sha256 }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          node - <<'NODE'
          const fs=require('fs');
          const path='source/deploy-status/track01-direct.json';
          let raw={ok:false,httpStatus:'NO_RESULT',payload:null,at:new Date().toISOString()};
          if(fs.existsSync(path)) raw=JSON.parse(fs.readFileSync(path,'utf8'));
          const robloxVersion=Number(raw?.payload?.versionNumber);
          const idsOk=String(raw.universeId)===process.env.TRACK01_UNIVERSE_ID && String(raw.placeId)===process.env.TRACK01_PLACE_ID;
          const versionOk=Number.isInteger(robloxVersion) && robloxVersion>39;
          const success=raw.ok===true && Number(raw.httpStatus)>=200 && Number(raw.httpStatus)<300 && idsOk && versionOk;
          const receipt={
            status: success?'LIVE_PUBLISHED':'PUBLISH_FAILED',
            ok: success,
            httpStatus: raw.httpStatus,
            universeId: process.env.TRACK01_UNIVERSE_ID,
            placeId: process.env.TRACK01_PLACE_ID,
            trackVersion: process.env.TRACK01_VERSION,
            sourceCommit: process.env.TRACK01_SOURCE_SHA,
            mode: process.env.TRACK01_MODE,
            robloxVersion: Number.isInteger(robloxVersion)?robloxVersion:null,
            placeBytes: Number(process.env.PLACE_BYTES)||null,
            sha256: process.env.PLACE_SHA256||null,
            publishRun: Number(process.env.RUN_ID)||null,
            publishedAt: raw.at||new Date().toISOString(),
            previewUrl: 'https://www.roblox.com/games/79748872921213',
            payload: raw.payload??null
          };
          fs.writeFileSync('deploy-status/track01-v428-final-route-audit-attempt.json',JSON.stringify(receipt,null,2)+'\n');
          if(success) fs.writeFileSync('deploy-status/track01-v428-final-route-audit.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(receipt);
          NODE

      - name: Persist v4.2.8 publish receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/track01-v428-final-route-audit-attempt.json
          if [ -f deploy-status/track01-v428-final-route-audit.json ]; then git add deploy-status/track01-v428-final-route-audit.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record TRACK 01 v4.2.8 final route audit publish receipt [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce verified LIVE v4.2.8 receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('deploy-status/track01-v428-final-route-audit-attempt.json','utf8'));
          if(r.status!=='LIVE_PUBLISHED' || !r.ok) throw new Error('TRACK 01 v4.2.8 publish did not verify LIVE');
          if(r.sourceCommit!==process.env.TRACK01_SOURCE_SHA) throw new Error('Source SHA receipt mismatch');
          if(r.trackVersion!==process.env.TRACK01_VERSION) throw new Error('Version receipt mismatch');
          if(String(r.universeId)!==process.env.TRACK01_UNIVERSE_ID || String(r.placeId)!==process.env.TRACK01_PLACE_ID) throw new Error('Target receipt mismatch');
          if(!Number.isInteger(r.robloxVersion) || r.robloxVersion<=39) throw new Error('Roblox version did not increment beyond v39');
          if(!Number.isInteger(r.placeBytes) || r.placeBytes<=220000) throw new Error('Place bytes receipt invalid');
          if(!/^[0-9a-f]{64}$/.test(String(r.sha256))) throw new Error('Place SHA256 receipt invalid');
          console.log('TRACK 01 v4.2.8 FINAL ROUTE AUDIT LIVE VERIFIED',r);
          NODE
