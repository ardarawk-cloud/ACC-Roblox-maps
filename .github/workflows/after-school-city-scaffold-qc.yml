name: After School City Scaffold QC

on:
  push:
    branches: [after-school-city/scaffold-v1]
    paths:
      - 'maps/after-school-city/**'
      - 'maps/registry.json'
      - '.github/scripts/after-school-city-spatial-audit.ps1'
      - '.github/workflows/after-school-city-scaffold-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/after-school-city/**'
      - 'maps/registry.json'
      - '.github/scripts/after-school-city-spatial-audit.ps1'
      - '.github/workflows/after-school-city-scaffold-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Cloud source spatial audit gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-spatial-audit.ps1'

      - name: Static project lock checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $registry = Get-Content 'maps/registry.json' -Raw | ConvertFrom-Json
          $target = $registry.maps.'after-school-city'
          if(-not $target){ throw 'after-school-city registry target missing' }
          if([string]$target.universeId -ne '10745359869'){ throw "Wrong Universe ID: $($target.universeId)" }
          if([string]$target.placeId -ne '121603385909425'){ throw "Wrong Place ID: $($target.placeId)" }
          if($target.enabled -ne $false){ throw 'Development target must remain registry enabled=false' }

          $world = Get-Content 'maps/after-school-city/after-school-city.world.server.lua' -Raw
          $school = Get-Content 'maps/after-school-city/after-school-city.school-life.server.lua' -Raw
          $downtown = Get-Content 'maps/after-school-city/after-school-city.downtown-life.server.lua' -Raw
          $city = Get-Content 'maps/after-school-city/after-school-city.city-life.server.lua' -Raw
          $street = Get-Content 'maps/after-school-city/after-school-city.street-life.server.lua' -Raw
          $cleanup = Get-Content 'maps/after-school-city/after-school-city.spatial-cleanup.server.lua' -Raw
          $realign = Get-Content 'maps/after-school-city/after-school-city.structural-realignment.server.lua' -Raw
          $layout = Get-Content 'maps/after-school-city/after-school-city.layout-correction.server.lua' -Raw
          $circulation = Get-Content 'maps/after-school-city/after-school-city.circulation-sanitize.server.lua' -Raw
          $clearance = Get-Content 'maps/after-school-city/after-school-city.clearance-sanitize.server.lua' -Raw
          $sourceFix = Get-Content 'maps/after-school-city/after-school-city.source-spatial-fix.server.lua' -Raw
          $config = Get-Content 'maps/after-school-city/after-school-city.config.lua' -Raw
          $project = Get-Content 'maps/after-school-city/default.project.json' -Raw
          $null = $project | ConvertFrom-Json

          foreach($token in @('AfterSchoolCity','SchoolDistrict','Downtown','SkatePark','Park','Residential','SportsField','AfterSchoolSpawn','ASC_DistrictCount')){
            if($world -notmatch [regex]::Escape($token)){ throw "World marker missing: $token" }
          }
          foreach($token in @('V03_SchoolLife','LockerBreezeway','StudentCanteen','ClubHub','BikeParking')){
            if($school -notmatch [regex]::Escape($token)){ throw "School life marker missing: $token" }
          }
          foreach($token in @('V03_DowntownLife','ASC_Enterable','ARCADE','CAFE','STYLE','MUSIC','HOBBY')){
            if($downtown -notmatch [regex]::Escape($token)){ throw "Downtown life marker missing: $token" }
          }
          foreach($token in @('V03_CityLife','SchoolDowntownCorridor','V03_ParkLife','V03_SkateLife','V03_SportsLife','V03_ResidentialLife')){
            if($city -notmatch [regex]::Escape($token)){ throw "City life marker missing: $token" }
          }
          foreach($token in @('V04_StreetLife','SecondaryStreetGrid','StudentRowInfill','V04_DowntownBackAlley','PARKED_VEHICLE','SchoolBusParked')){
            if($street -notmatch [regex]::Escape($token)){ throw "Street marker missing: $token" }
          }
          foreach($token in @('V041_SpatialCleanup','ASC_ClearanceChecked','V041_SchoolDowntownCorridor')){
            if($cleanup -notmatch [regex]::Escape($token)){ throw "Spatial marker missing: $token" }
          }
          foreach($token in @('V042_StructuralRealignment','ASC_RoadBuildingOverlapFixed','ASC_ClubSportsClearanceFixed','ASC_EndsBeforeSchool','ASC_StopsAtEntrance','ClubHub')){
            if($realign -notmatch [regex]::Escape($token)){ throw "Realignment marker missing: $token" }
          }
          foreach($token in @('V043_LayoutCorrection','ASC_ResidentialRoadHouseCollisionFixed','ASC_YouthStudioSportsCollisionFixed')){
            if($layout -notmatch [regex]::Escape($token)){ throw "Layout marker missing: $token" }
          }
          foreach($token in @('V044_CirculationSanitize','ClubHubV044','ASC_SchoolFrontTreeFree','ASC_ClubHubRebuiltForClearance')){
            if($circulation -notmatch [regex]::Escape($token)){ throw "Circulation marker missing: $token" }
          }
          foreach($token in @('V045_ClearanceSanitize','ASC_SchoolDoorTreeClearanceFixed','ASC_ResidentialRoadHedgeClearanceFixed','0.4.5-door-road-clearance-1')){
            if($clearance -notmatch [regex]::Escape($token)){ throw "Clearance marker missing: $token" }
          }
          foreach($token in @('V046_SourceSpatialFix','SOURCE_SPATIAL_FIX','SHOP_LAYOUT','PARK_TREE_RELOCATIONS','BUS_TARGET_X = -90','ASC_DowntownRoadClearanceFixed','ASC_ParkPathTreeClearanceFixed','ASC_BusTreeClearanceFixed')){
            if($sourceFix -notmatch [regex]::Escape($token)){ throw "Source spatial fix marker missing: $token" }
          }
          foreach($token in @('10745359869','121603385909425','0.4.6-source-spatial-audit-fix-1','EnableSpatialCleanupPass = true','EnableStructuralRealignmentPass = true','EnableLayoutCorrectionPass = true','EnableCirculationSanitizePass = true','EnableClearanceSanitizePass = true','EnableSourceSpatialFixPass = true','EnableActivities = false','EnableEconomy = false')){
            if($config -notmatch [regex]::Escape($token)){ throw "Config marker missing: $token" }
          }
          foreach($token in @('ASCConfig','ASC_World','ASC_SchoolLife','ASC_DowntownLife','ASC_CityLife','ASC_StreetLife','ASC_SpatialCleanup','ASC_StructuralRealignment','ASC_LayoutCorrection','ASC_CirculationSanitize','ASC_ClearanceSanitize','ASC_SourceSpatialFix','after-school-city.source-spatial-fix.server.lua')){
            if($project -notmatch [regex]::Escape($token)){ throw "Rojo project marker missing: $token" }
          }

          $allSource = $world + "`n" + $school + "`n" + $downtown + "`n" + $city + "`n" + $street + "`n" + $cleanup + "`n" + $realign + "`n" + $layout + "`n" + $circulation + "`n" + $clearance + "`n" + $sourceFix
          if($allSource -match 'MarketplaceService|PromptProductPurchase|ProcessReceipt'){ throw 'ASC map source must not contain monetization authority' }
          if($allSource -match 'DataStoreService'){ throw 'ASC map source must not enable persistence yet' }
          if($allSource -match 'BillboardGui'){ throw 'Production map source must not reintroduce giant debug BillboardGui labels' }
          Write-Host 'AFTER SCHOOL CITY v0.4.6 source spatial static QC PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojoExe=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojoExe=$exe.FullName
          }
          & $rojoExe --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojoExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build isolated map
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'after-school-city-v046.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
          if(-not (Test-Path $place)){throw 'Generated RBXL missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw "Generated RBXL suspiciously small: $bytes bytes"}
          Write-Host "AFTER SCHOOL CITY V0.4.6 ROJO BUILD PASS - $bytes bytes"
