name: After School City Scaffold QC

on:
  push:
    branches: [after-school-city/scaffold-v1]
    paths:
      - 'maps/after-school-city/**'
      - 'maps/registry.json'
      - '.github/workflows/after-school-city-scaffold-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/after-school-city/**'
      - 'maps/registry.json'
      - '.github/workflows/after-school-city-scaffold-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Static project lock checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $registry = Get-Content 'maps/registry.json' -Raw | ConvertFrom-Json
          $target = $registry.maps.'after-school-city'
          if(-not $target){ throw 'after-school-city registry target missing' }
          if([string]$target.universeId -ne '10745359869'){ throw "Wrong Universe ID: $($target.universeId)" }
          if([string]$target.placeId -ne '121603385909425'){ throw "Wrong Place ID: $($target.placeId)" }
          if($target.enabled -ne $false){ throw 'Scaffold phase must remain registry enabled=false' }

          $world = Get-Content 'maps/after-school-city/after-school-city.world.server.lua' -Raw
          $config = Get-Content 'maps/after-school-city/after-school-city.config.lua' -Raw
          $project = Get-Content 'maps/after-school-city/default.project.json' -Raw
          $null = $project | ConvertFrom-Json

          foreach($token in @('AfterSchoolCity','SchoolDistrict','Downtown','SkatePark','Park','Residential','SportsField','AfterSchoolSpawn','ASC_DistrictCount')){
            if($world -notmatch [regex]::Escape($token)){ throw "World marker missing: $token" }
          }
          foreach($token in @('10745359869','121603385909425','EnableBlockoutScaffold = true','EnableActivities = false','EnableEconomy = false')){
            if($config -notmatch [regex]::Escape($token)){ throw "Config marker missing: $token" }
          }
          foreach($token in @('ASCConfig','ASC_World','after-school-city.config.lua','after-school-city.world.server.lua')){
            if($project -notmatch [regex]::Escape($token)){ throw "Rojo project marker missing: $token" }
          }
          if($world -match 'MarketplaceService|PromptProductPurchase|ProcessReceipt'){ throw 'Scaffold must not contain monetization authority' }
          if($world -match 'DataStoreService'){ throw 'Scaffold must not enable persistence yet' }
          Write-Host 'AFTER SCHOOL CITY static scaffold QC PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojoExe=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojoExe=$exe.FullName
          }
          & $rojoExe --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojoExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build isolated scaffold
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'after-school-city-scaffold.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
          if(-not (Test-Path $place)){throw 'Generated RBXL missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw "Generated RBXL suspiciously small: $bytes bytes"}
          Write-Host "AFTER SCHOOL CITY ROJO BUILD PASS - $bytes bytes"
