name: BBYA MCP List Studios

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-mcp-list-studios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List connected Studio instances
        shell: powershell
        run: |
          $env:USERPROFILE='C:\Users\Administrator'
          $env:HOME='C:\Users\Administrator'
          $env:LOCALAPPDATA='C:\Users\Administrator\AppData\Local'
          $mcpBat=Join-Path $env:LOCALAPPDATA 'Roblox\mcp.bat'
          $psi=New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName='cmd.exe'
          $psi.Arguments='/d /s /c ""'+$mcpBat+'""'
          $psi.UseShellExecute=$false
          $psi.RedirectStandardInput=$true
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $psi.CreateNoWindow=$true
          $p=New-Object System.Diagnostics.Process
          $p.StartInfo=$psi
          [void]$p.Start()
          function Send-Mcp($obj){$p.StandardInput.WriteLine(($obj|ConvertTo-Json -Compress -Depth 30));$p.StandardInput.Flush()}
          function Read-Mcp([int]$ms){$task=$p.StandardOutput.ReadLineAsync();if($task.Wait($ms)){return $task.Result};return '{"jsonrpc":"2.0","error":{"code":-32000,"message":"TIMEOUT"}}'}
          $lines=@("timestamp=$(Get-Date -Format o)")
          Send-Mcp @{jsonrpc='2.0';id=1;method='initialize';params=@{protocolVersion='2025-06-18';capabilities=@{};clientInfo=@{name='bbya-worker';version='1.0.0'}}}
          $lines+='INIT_BEGIN';$lines+=Read-Mcp 8000;$lines+='INIT_END'
          Send-Mcp @{jsonrpc='2.0';method='notifications/initialized';params=@{}}
          Send-Mcp @{jsonrpc='2.0';id=2;method='tools/call';params=@{name='list_roblox_studios';arguments=@{}}}
          $lines+='LIST_STUDIOS_BEGIN';$lines+=Read-Mcp 12000;$lines+='LIST_STUDIOS_END'
          try{$p.StandardInput.Close()}catch{};if(-not $p.HasExited){try{$p.Kill()}catch{}}
          try{$e=$p.StandardError.ReadToEnd();if($e){$lines+='STDERR_BEGIN';$lines+=$e;$lines+='STDERR_END'}}catch{}
          $text=($lines-join "`n")+"`n"
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-list-studios.txt"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28";"User-Agent"="BBYA-Studio-Worker"}
          $sha=$null
          try{$sha=(Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $body=@{message='Record BBYA Studio list [skip ci]';content=$content;branch='main'}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body|ConvertTo-Json) -ContentType 'application/json'
