name: BBYA TalonTheAngel Progressive One

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  upload-matamu:
    if: startsWith(github.event.issue.title, 'BBYA TALONTHEANGEL PROGRESSIVE ONE')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIO_KEY: ${{ secrets.TALONTHEANGEL_AUDIO_PUBLISHER }}
      MAX_MODERATION_WAIT_SECONDS: '0'
    steps:
      - name: Checkout uploader source
        uses: actions/checkout@v4

      - name: Verify TalonTheAngel secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUDIO_KEY:-}" ]]; then
            echo 'TALONTHEANGEL_SECRET_MISSING'
            exit 10
          fi
          echo 'TALONTHEANGEL_SECRET_PRESENT=YES'

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python3 -m pip install --quiet 'gdown==6.1.0'

      - name: Prepare single Progressive request
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/bbya-progressive-one.json" <<'JSON'
          [{"drive_file_id":"1Vi-1xNoL-IsanBEGJNkSrqgCHVBCgtp7","title":"Matamu"}]
          JSON

      - name: Upload Matamu only at 1.75x
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bbya-music-simple-upload-v13.py \
            --batch "$RUNNER_TEMP/bbya-progressive-one.json" \
            --result talontheangel-matamu-result.json \
            --moderation-wait-seconds 0

      - name: Preserve result
        if: always() && hashFiles('talontheangel-matamu-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: talontheangel-progressive-matamu-${{ github.run_id }}
          path: talontheangel-matamu-result.json
          if-no-files-found: error
          retention-days: 30
