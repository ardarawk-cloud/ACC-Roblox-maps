name: BBYA Live Rescue Windows

# Rescue v8: canonical self-hosted publish lane with permanent audio + lighting + local floor-surface + skatepark hard gates.
# Deploy trigger: BBYA stability authority + entrance-car + skatepark + venue-audio-router + local floor-surface exact-source publish.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bbya-live-rescue-windows.yml'
      - 'maps/bbya-social-hub/73-skatepark.server.lua'
      - 'maps/bbya-social-hub/77-entrance-car-cleanup.server.lua'
      - 'maps/bbya-social-hub/91-owner-geometry-fixes.server.lua'
      - 'maps/bbya-social-hub/104-venue-audio-router.client.lua'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-live-rescue-windows.yml'
      - 'maps/bbya-social-hub/73-skatepark.server.lua'
      - 'maps/bbya-social-hub/77-entrance-car-cleanup.server.lua'
      - 'maps/bbya-social-hub/91-owner-geometry-fixes.server.lua'
      - 'maps/bbya-social-hub/104-venue-audio-router.client.lua'
  workflow_dispatch:

concurrency:
  group: bbya-live-rescue-windows-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  selfhosted_probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Prove self-hosted runner allocation
        shell: powershell
        run: |
          Write-Host "BBYA_SELF_HOSTED_OK"
          Write-Host "computer=$env:COMPUTERNAME event=$env:GITHUB_EVENT_NAME sha=$env:GITHUB_SHA"

  publish:
    if: github.event_name != 'pull_request'
    needs: selfhosted_probe
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout exact rescue source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojo=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify final BBYA source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $checks=@{
            'maps/bbya-social-hub/56-dock-stability.client.lua'=@('COMMAND MENU AUTHORITY v7','V7_SINGLE_COMPACT_AUTHORITY','LEFT_OF_MENU_V2_PRECISE');
            'maps/bbya-social-hub/111-compact-secondary-panels.client.lua'=@('COMMAND_MENU_V7');
            'maps/bbya-social-hub/91-owner-ui.client.lua'=@('ROLE PANEL v8');
            'maps/bbya-social-hub/91-owner-geometry-fixes.server.lua'=@('FLOOR SURFACE FIXES v3','DAYTIME FLOOR REFLECTION GUARD','V1_LOCAL_THREE_VENUES');
            'maps/bbya-social-hub/92-player-progression.server.lua'=@('BBYA_MANAGED_ROLES_V1','RolePanelSnapshot','RolePanelAction','nadmo97');
            'maps/bbya-social-hub/32-teleport.server.lua'=@('BBYAVIPBypass','BBYARooftopBypass','BBYASecretRoomBypass');
            'maps/bbya-social-hub/108-party-stuff-menu.client.lua'=@('SIMPAN / PUT AWAY');
            'maps/bbya-social-hub/121-mainclub-beauty-v5.server.lua'=@('MAIN CLUB BEAUTY v5');
            'maps/bbya-social-hub/73-skatepark.server.lua'=@('PREMIUM SKATE PLAZA v4','PREMIUM_SKATE_PLAZA_V4','TeleportCenterClear",true','MobileLightweight",true','GlobalLightingWrites",false','BoardRackEastSideReserved",true');
            'maps/bbya-social-hub/104-venue-audio-groups.server.lua'=@('BBYASkateparkMasterSound','BBYASkateparkPlaylistCatalog','134928414278364','ROBLOX_CREATOR_STORE_APM_PLUS_CUSTOM_APPROVED');
            'maps/bbya-social-hub/104-venue-audio-router.client.lua'=@('STRICT VENUE AUDIO ROUTER v9','ROUTER_V9_EQ_ONLY','FUNKOT_HARD_LEAK_GUARD_V9','BBYAFunkotHardGateV9','BBYAAudioIsolationAuthority');
            'maps/bbya-social-hub/28-lighting-ambience.server.lua'=@('GLOBAL LIGHTING AUTHORITY v4','GLOBAL_LIGHTING_AUTHORITY_V4','28_LIGHTING_AMBIENCE_V4');
            'maps/bbya-social-hub/37-underground-furnish-mainclub-light.server.lua'=@('BBYAGlobalLightingWrites",false','DEFER_TO_28_GLOBAL_AUTHORITY');
            'maps/bbya-social-hub/109-music-catalog-reset.server.lua'=@('OPENING STABILITY AUTHORITY v5','ACTIVE_VENUES_OPENING_STABILITY_V5','BBYAMusicCatalogReset",false','BBYAMainPlaylistEnabled",true','BBYAFunkotPlaylistEnabled",true','BBYASkateparkPlaylistEnabled",true','BBYARooftopPlaylistEnabled",true')
          }
          foreach($path in $checks.Keys){
            $text=Get-Content $path -Raw
            foreach($needle in $checks[$path]){
              if($text -notmatch [regex]::Escape($needle)){throw "Missing $needle in $path"}
            }
          }
          $audio=Get-Content 'maps/bbya-social-hub/109-music-catalog-reset.server.lua' -Raw
          foreach($forbidden in @(
            'BBYAMusicCatalogReset",true',
            'RESET_WITH_UNDERGROUND',
            'SoundService\.DescendantAdded',
            'scrubSound',
            'disableOldAudioEngines',
            'SetAttribute\("MusicCatalogState","RESET_EMPTY"\)'
          )){
            if($audio -match $forbidden){throw "DESTRUCTIVE_AUDIO_RESET_BLOCKED: $forbidden"}
          }
          $router=Get-Content 'maps/bbya-social-hub/104-venue-audio-router.client.lua' -Raw
          if($router -match 'forceNeutralVolumes'){throw 'AUDIO_V9_REGRESSION: forceNeutralVolumes returned'}
          if($router -match 'g\.Volume\s*='){throw 'AUDIO_V9_REGRESSION: router mutates SoundGroup.Volume'}
          if($router -match 'sound\.Volume\s*='){throw 'AUDIO_V9_REGRESSION: router mutates Sound.Volume'}
          $ug=Get-Content 'maps/bbya-social-hub/37-underground-furnish-mainclub-light.server.lua' -Raw
          if($ug -match 'Lighting\.(Brightness|ExposureCompensation|Ambient|OutdoorAmbient|ClockTime|EnvironmentDiffuseScale|EnvironmentSpecularScale|ShadowSoftness)\s*='){throw 'LIGHTING_AUTHORITY_REGRESSION: underground pass touches global Lighting'}
          $beauty=Get-Content 'maps/bbya-social-hub/121-mainclub-beauty-v5.server.lua' -Raw
          if($beauty -match 'Lighting\.(Brightness|ExposureCompensation|Ambient|OutdoorAmbient|ClockTime)'){throw 'Beauty v5 touches global Lighting'}
          $surface=Get-Content 'maps/bbya-social-hub/91-owner-geometry-fixes.server.lua' -Raw
          if($surface -match 'EnvironmentSpecularScale\s*='){throw 'FLOOR_REFLECTION_REGRESSION: local guard must not change global EnvironmentSpecularScale'}
          $skate=Get-Content 'maps/bbya-social-hub/73-skatepark.server.lua' -Raw
          if($skate -match 'game:GetService\("Lighting"\)'){throw 'SKATEPARK_LIGHTING_REGRESSION: skatepark pass must not own global Lighting'}
          if($skate -match 'Lighting\.(Brightness|ExposureCompensation|Ambient|OutdoorAmbient|ClockTime|EnvironmentDiffuseScale|EnvironmentSpecularScale|ShadowSoftness)\s*='){throw 'SKATEPARK_LIGHTING_REGRESSION: skatepark pass touches global Lighting'}
          Write-Host 'BBYA_FINAL_SOURCE_QC_PASS_STABILITY_AUDIO_V9_LIGHTING_V4_FLOOR_GUARD_V1_SKATE_V4'

      - name: Build canonical BBYA place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-live-rescue-selfhosted.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not (Test-Path $place)){throw 'Built place missing'}
          if((Get-Item $place).Length -lt 1024){throw 'Built place unexpectedly small'}
          "PLACE_FILE_OVERRIDE=$place" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_BUILD_PASS bytes=$((Get-Item $place).Length)"

      - name: Publish BBYA
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
          PUBLISH_RECEIPT_DIR: deploy-status
        run: |
          $ErrorActionPreference='Stop'
          node scripts/publish-map.js a-club
          if($LASTEXITCODE -ne 0){throw 'Roblox publish failed'}

      - name: Verify published receipt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path 'deploy-status/a-club.json')){throw 'Receipt missing'}
          $receipt=Get-Content 'deploy-status/a-club.json' -Raw | ConvertFrom-Json
          if($receipt.status -ne 'PUBLISHED'){throw 'Receipt not PUBLISHED'}
          if($receipt.sourceCommit -ne $env:GITHUB_SHA){throw "Receipt source mismatch: $($receipt.sourceCommit) != $env:GITHUB_SHA"}
          Write-Host "BBYA_LIVE_RESCUE_PASS version=$($receipt.response.versionNumber) source=$($receipt.sourceCommit)"
