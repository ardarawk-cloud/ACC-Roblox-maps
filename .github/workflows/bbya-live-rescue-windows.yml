name: BBYA Live Rescue Windows

# Rescue v3: canonical self-hosted publish lane with protected audio hard gate.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bbya-live-rescue-windows.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-live-rescue-windows.yml'
  workflow_dispatch:

concurrency:
  group: bbya-live-rescue-windows-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  selfhosted_probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Prove self-hosted runner allocation
        shell: powershell
        run: |
          Write-Host "BBYA_SELF_HOSTED_OK"
          Write-Host "computer=$env:COMPUTERNAME event=$env:GITHUB_EVENT_NAME sha=$env:GITHUB_SHA"

  publish:
    if: github.event_name != 'pull_request'
    needs: selfhosted_probe
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout exact rescue source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: HARD GATE protected venue audio authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Require([string]$text,[string]$needle,[string]$message){if($text -notmatch [regex]::Escape($needle)){throw $message}}
          function Forbid([string]$text,[string]$pattern,[string]$message){if($text -match $pattern){throw $message}}
          $reset=Get-Content 'maps/bbya-social-hub/109-music-catalog-reset.server.lua' -Raw
          foreach($needle in @(
            'OPENING STABILITY AUTHORITY v5',
            'ACTIVE_VENUES_OPENING_STABILITY_V5',
            'BBYAMusicCatalogReset",false',
            'BBYAMainPlaylistEnabled",true',
            'BBYAUndergroundPlaylistEnabled",true',
            'BBYAFunkotPlaylistEnabled",true',
            'BBYASkateparkPlaylistEnabled",true',
            'BBYARooftopPlaylistEnabled",true'
          )){Require $reset $needle "Protected audio marker missing: $needle"}
          foreach($pattern in @(
            'BBYAMusicCatalogReset",true',
            'RESET_WITH_UNDERGROUND',
            'SoundService\.DescendantAdded',
            'scrubSound',
            'disableOldAudioEngines',
            'SetAttribute\("MusicCatalogState","RESET_EMPTY"\)',
            's\.SoundId=""'
          )){Forbid $reset $pattern "DESTRUCTIVE AUDIO RESET BLOCKED: $pattern"}
          Write-Host "BBYA_RESCUE_AUDIO_HARD_GATE_PASS source=$env:GITHUB_SHA"

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojo=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify final BBYA source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $checks=@{
            'maps/bbya-social-hub/56-dock-stability.client.lua'=@('COMMAND MENU AUTHORITY v7','V7_SINGLE_COMPACT_AUTHORITY','LEFT_OF_MENU_V2_PRECISE');
            'maps/bbya-social-hub/111-compact-secondary-panels.client.lua'=@('COMMAND_MENU_V7');
            'maps/bbya-social-hub/91-owner-ui.client.lua'=@('ROLE PANEL v8');
            'maps/bbya-social-hub/92-player-progression.server.lua'=@('BBYA_MANAGED_ROLES_V1','RolePanelSnapshot','RolePanelAction','nadmo97');
            'maps/bbya-social-hub/32-teleport.server.lua'=@('BBYAVIPBypass','BBYARooftopBypass','BBYASecretRoomBypass');
            'maps/bbya-social-hub/108-party-stuff-menu.client.lua'=@('SIMPAN / PUT AWAY');
            'maps/bbya-social-hub/121-mainclub-beauty-v5.server.lua'=@('MAIN CLUB BEAUTY v5');
            'maps/bbya-social-hub/104-venue-audio-groups.server.lua'=@('BBYASkateparkMasterSound','BBYASkateparkPlaylistCatalog','134928414278364','ROBLOX_CREATOR_STORE_APM_PLUS_CUSTOM_APPROVED')
          }
          foreach($path in $checks.Keys){
            $text=Get-Content $path -Raw
            foreach($needle in $checks[$path]){
              if($text -notmatch [regex]::Escape($needle)){throw "Missing $needle in $path"}
            }
          }
          $beauty=Get-Content 'maps/bbya-social-hub/121-mainclub-beauty-v5.server.lua' -Raw
          if($beauty -match 'Lighting\.(Brightness|ExposureCompensation|Ambient|OutdoorAmbient|ClockTime)'){throw 'Beauty v5 touches global Lighting'}
          Write-Host 'BBYA_FINAL_SOURCE_QC_PASS'

      - name: Build canonical BBYA place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-live-rescue-selfhosted.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not (Test-Path $place)){throw 'Built place missing'}
          if((Get-Item $place).Length -lt 1024){throw 'Built place unexpectedly small'}
          "PLACE_FILE_OVERRIDE=$place" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_BUILD_PASS bytes=$((Get-Item $place).Length)"

      - name: Publish BBYA
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
          PUBLISH_RECEIPT_DIR: deploy-status
        run: |
          $ErrorActionPreference='Stop'
          node scripts/publish-map.js a-club
          if($LASTEXITCODE -ne 0){throw 'Roblox publish failed'}

      - name: Verify published receipt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path 'deploy-status/a-club.json')){throw 'Receipt missing'}
          $receipt=Get-Content 'deploy-status/a-club.json' -Raw | ConvertFrom-Json
          if($receipt.status -ne 'PUBLISHED'){throw 'Receipt not PUBLISHED'}
          if($receipt.sourceCommit -ne $env:GITHUB_SHA){throw "Receipt source mismatch: $($receipt.sourceCommit) != $env:GITHUB_SHA"}
          Write-Host "BBYA_LIVE_RESCUE_PASS version=$($receipt.response.versionNumber) source=$($receipt.sourceCommit)"
