name: After School City V1.3 Economy First Shop QC

on:
  push:
    branches: [after-school-city/v130-economy-first-shop]
    paths:
      - '.github/workflows/after-school-city-v130-economy-first-shop-qc.yml'
      - 'maps/after-school-city/after-school-city.config.lua'
      - 'maps/after-school-city/after-school-city.gameplay-config.lua'
      - 'maps/after-school-city/after-school-city.gameplay-service.lua'
      - 'maps/after-school-city/after-school-city.economy-config.lua'
      - 'maps/after-school-city/after-school-city.economy-first-shop-v130.server.lua'
      - 'maps/after-school-city/default.project.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact V1.3 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact LIVE v53 base and narrow diff gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '21c622b190a85f3ecf935aa46a2a06be34f67c84'
          git cat-file -e "$base^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'LIVE v53 source unavailable' }
          $mergeBase = (git merge-base $base $env:GITHUB_SHA).Trim()
          if($mergeBase -ne $base){ throw "Candidate is not based on exact LIVE v53 source: $mergeBase" }
          $allowed = @(
            '.github/workflows/after-school-city-v130-economy-first-shop-qc.yml',
            'maps/after-school-city/after-school-city.config.lua',
            'maps/after-school-city/after-school-city.gameplay-config.lua',
            'maps/after-school-city/after-school-city.gameplay-service.lua',
            'maps/after-school-city/after-school-city.economy-config.lua',
            'maps/after-school-city/after-school-city.economy-first-shop-v130.server.lua',
            'maps/after-school-city/default.project.json'
          )
          $changed = @(git diff --name-only $base $env:GITHUB_SHA)
          if($changed.Count -ne 7){ throw "Expected exactly 7 files, got $($changed.Count): $($changed -join ', ')" }
          foreach($path in $changed){ if($allowed -notcontains $path){ throw "Scope violation: $path" } }
          foreach($path in $allowed){ if($changed -notcontains $path){ throw "Missing required change: $path" } }
          Write-Host "V1.3 NARROW DIFF PASS source=$env:GITHUB_SHA"

      - name: Verify persistent profile migration preserves V1.2 progress
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content 'maps/after-school-city/after-school-city.gameplay-config.lua' -Raw
          $service = Get-Content 'maps/after-school-city/after-school-city.gameplay-service.lua' -Raw
          foreach($token in @(
            'Version = "1.3.0-economy-first-shop-1"',
            'DataStoreName = "ASC_PlayerProfile_v1"',
            'SchemaVersion = 2',
            '"SCHOOL_MEET_TEACHER"',
            '"SCHOOL_HELP_CANTEEN"',
            '"SCHOOL_JOIN_CLUB"'
          )){ if($cfg -notmatch [regex]::Escape($token)){ throw "Gameplay migration lock missing: $token" } }
          foreach($token in @(
            'Inventory = {}',
            'type(raw.Inventory) == "table"',
            'Inventory = clone(profile.Inventory)',
            'function GameplayService.GetInventoryCount',
            'function GameplayService.PurchaseItem',
            'profile.Coins -= price',
            'profile.Inventory[itemId] = current + 1',
            'entry.Dirty = true',
            'syncPlayer(player)'
          )){ if($service -notmatch [regex]::Escape($token)){ throw "Persistent economy authority missing: $token" } }
          if($service -notmatch [regex]::Escape('DataStoreService:GetDataStore(GameplayConfig.DataStoreName)')){ throw 'Central DataStore authority missing' }
          Write-Host 'V1.3 PROFILE MIGRATION + INVENTORY AUTHORITY PASS'

      - name: Verify first shop catalog and prices
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content 'maps/after-school-city/after-school-city.economy-config.lua' -Raw
          foreach($token in @(
            'Version = "1.3.0-economy-first-shop-1"',
            'Id = "STUDENT_MINI_MART"',
            'ModelName = "StudentMiniMart"',
            'Id = "CAMPUS_NOTEBOOK"',
            'Price = 60',
            'Id = "CITY_STICKER_PACK"',
            'Price = 85',
            'Id = "ASC_KEYCHAIN"',
            'Price = 110',
            'Id = "STUDENT_TOTE"',
            'Price = 140'
          )){ if($cfg -notmatch [regex]::Escape($token)){ throw "First shop catalog lock missing: $token" } }
          $ownedCaps = ([regex]::Matches($cfg, 'MaxOwned\s*=\s*1')).Count
          if($ownedCaps -ne 4){ throw "Expected 4 one-time collectible caps; got $ownedCaps" }
          Write-Host 'V1.3 FIRST SHOP CATALOG PASS'

      - name: Verify server-authoritative purchase flow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Get-Content 'maps/after-school-city/after-school-city.economy-first-shop-v130.server.lua' -Raw
          foreach($token in @(
            'ASC_StudentRowShopInteriorsPass',
            'StudentRowInfill',
            'V080_Interior',
            'CounterTop',
            'ProximityPrompt',
            'GameplayService.GetState',
            'state.Persistent',
            'GameplayService.CanUseCooldown',
            'GameplayService.PurchaseItem',
            'SAVE AKTIF',
            'ASC_V130PurchaseAuthority',
            'ASC_EconomyReady'
          )){ if($server -notmatch [regex]::Escape($token)){ throw "First shop server authority missing: $token" } }
          if($server -match 'DataStoreService|MarketplaceService|RemoteEvent|RemoteFunction|OnServerEvent|OnServerInvoke'){
            throw 'Economy server scope violation: direct datastore/marketplace/client-command authority detected'
          }
          Write-Host 'V1.3 SERVER-AUTHORITATIVE PURCHASE FLOW PASS'

      - name: Verify project mapping and economy enable flag
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-Content 'maps/after-school-city/default.project.json' -Raw
          $asc = Get-Content 'maps/after-school-city/after-school-city.config.lua' -Raw
          foreach($token in @(
            'ASCEconomyConfig',
            'after-school-city.economy-config.lua',
            'ASC_EconomyV130',
            'after-school-city.economy-first-shop-v130.server.lua'
          )){ if($project -notmatch [regex]::Escape($token)){ throw "Project mapping missing: $token" } }
          foreach($token in @(
            'Version = "1.3.0-economy-first-shop-1"',
            'EconomyVersion = "1.3.0-economy-first-shop-1"',
            'EnableEconomy = true',
            'SchoolLifeGameplayVersion = "1.2.0-school-life-foundation-1"'
          )){ if($asc -notmatch [regex]::Escape($token)){ throw "ASC config lock missing: $token" } }
          Write-Host 'V1.3 PROJECT MAPPING PASS'

      - name: Verify protected LIVE v53 authorities unchanged
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '21c622b190a85f3ecf935aa46a2a06be34f67c84'
          foreach($path in @(
            'maps/after-school-city/after-school-city.intro.client.lua',
            'maps/after-school-city/after-school-city.music-config.lua',
            'maps/after-school-city/after-school-city.music-player.client.lua',
            'maps/after-school-city/after-school-city.school-life-config.lua',
            'maps/after-school-city/after-school-city.school-life-gameplay-v120.server.lua',
            'maps/after-school-city/after-school-city.school-life-v120.client.lua',
            'maps/after-school-city/after-school-city.activities.server.lua',
            'maps/after-school-city/after-school-city.activities.client.lua',
            'maps/after-school-city/after-school-city.student-row-shop-interiors.server.lua'
          )){
            git diff --quiet $base $env:GITHUB_SHA -- $path
            if($LASTEXITCODE -ne 0){ throw "Protected LIVE v53 authority changed: $path" }
          }
          $intro = Get-Content 'maps/after-school-city/after-school-city.intro.client.lua' -Raw
          foreach($token in @(
            'PUTU AZYA PUTRI\nBINTANG HARDAJAYA',
            'WITH LOVE, DAD',
            'ENTER THE CITY'
          )){ if($intro -notmatch [regex]::Escape($token)){ throw "Dedication lock missing: $token" } }
          if($intro -match 'local\s+backdrop\s*=|backdrop\.Name\s*=\s*"Backdrop"'){ throw 'LIVE v53 no-backdrop lock regressed' }
          Write-Host 'LIVE V53 DEDICATION + SCHOOL + MUSIC + ACTIVITY AUTHORITIES UNCHANGED'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
          $zip = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
          if(-not $exe){ throw 'rojo.exe missing' }
          $version = (& $exe.FullName --version | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $version -notmatch '7\.7\.0'){ throw "Unexpected Rojo version: $version" }
          "ROJO_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ROJO_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact V1.3 candidate and hash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'asc-v130-economy-first-shop-qc'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $place = Join-Path $out 'after-school-city-v130-economy-first-shop.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $place)){ throw 'Rojo build failed' }
          $bytes = (Get-Item $place).Length
          if($bytes -lt 1024){ throw "RBXL too small: $bytes" }
          $hash = (Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = @(
            'STATUS=QC_PASSED',
            'MODE=V130_ECONOMY_FIRST_SHOP',
            'BASE_LIVE_SOURCE=21c622b190a85f3ecf935aa46a2a06be34f67c84',
            'BASE_LIVE_ROBLOX_VERSION=53',
            "SOURCE_COMMIT=$env:GITHUB_SHA",
            "ROJO=$env:ROJO_VERSION",
            "RBXL_BYTES=$bytes",
            "SHA256=$hash",
            'DATASTORE=ASC_PlayerProfile_v1',
            'SCHEMA=2_BACKWARD_RECONCILE',
            'FIRST_SHOP=STUDENT_MINI_MART',
            'ITEMS=4_PERSISTENT_COLLECTIBLES',
            'PURCHASE_AUTHORITY=SERVER_ONLY',
            'MARKETPLACE_ROBUX=NONE',
            'LIVE_V53_AUTHORITIES=PRESERVED'
          )
          $receipt | Set-Content (Join-Path $out 'qc-receipt.txt') -Encoding ascii
          $receipt | ForEach-Object { Write-Host $_ }
          "QC_OUT_DIR=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exact V1.3 QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v130-economy-first-shop-qc-${{ github.sha }}
          path: ${{ env.QC_OUT_DIR }}
          if-no-files-found: error
          retention-days: 7
