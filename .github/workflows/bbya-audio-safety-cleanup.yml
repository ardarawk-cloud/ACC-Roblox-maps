name: BBYA Audio Safety Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-audio-safety-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quarantine Drive/API audio from playlists
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          main=root/'maps/bbya-social-hub/30-club-systems.server.lua'
          basement=root/'maps/bbya-social-hub/85-basement-autodj.server.lua'

          def empty_block(path, begin, end):
              s=path.read_text(encoding='utf-8')
              pattern=re.compile(re.escape(begin)+r'.*?'+re.escape(end), re.S)
              replacement=begin+'\n'+end
              ns,n=pattern.subn(replacement,s,count=1)
              if n:
                  path.write_text(ns,encoding='utf-8')
              return n

          empty_block(main,'-- MAIN_PROGRESSIVE_UPLOAD_BEGIN','-- MAIN_PROGRESSIVE_UPLOAD_END')
          empty_block(basement,'-- DRIVE_LIBRARY_UPLOAD_BEGIN','-- DRIVE_LIBRARY_UPLOAD_END')
          empty_block(basement,'-- ADXL_OWNER_UPLOAD_BEGIN','-- ADXL_OWNER_UPLOAD_END')

          violations={
              '112832967036966': {'reason':'Dating','asset':'Dodox Rmx - Ketahuan [ AYEP MACAN ]'},
              '139912119687420': {'reason':'Sexual Content','asset':'1A - 127 - 03. Diego Miranda feat. Liliana - Ibiza'},
              '82224703787534': {'reason':'Disruptive Audio','asset':'Dian Peceng - Mehabur Kasih Menuai Perih New'},
              '75731218112000': {'reason':'Disruptive Audio','asset':'Ayyy ( D Bagindas )'},
              '132591734808945': {'reason':'Dangerous Content/Behavior','asset':'GARAM CINA NEW HARD - DENNIE RMX 2025'},
          }
          hold={
              'status':'SAFETY_HOLD',
              'reason':'Roblox account received a 1-day suspension after clustered audio moderation actions on 2026-08-21.',
              'policy':{
                  'newAudioUploads':False,
                  'retryRejectedAudio':False,
                  'reuploadModifiedRejectedAudio':False,
                  'publishDriveAudioToMap':False,
                  'allowedNextStep':'Owner review/appeal only; resume only after explicit owner decision and account restoration.'
              },
              'moderationViolationAssetIds':violations,
              'playlistAction':'All Drive/API-created audio blocks quarantined from Main Club and Basement source.',
          }
          out=root/'deploy-status/bbya-audio-safety-hold.json'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(hold,ensure_ascii=False,indent=2),encoding='utf-8')

          registry=root/'deploy-status/bbya-basement-drive-registry.json'
          if registry.exists():
              try:
                  d=json.loads(registry.read_text(encoding='utf-8'))
                  for item in (d.get('items') or {}).values():
                      if item.get('assetId'):
                          item['quarantined']=True
                          item['eligibleForPlaylist']=False
                          item['quarantineReason']='ACCOUNT_SAFETY_HOLD_2026_08_21'
                          aid=str(item.get('assetId'))
                          if aid in violations:
                              item['moderationAction']=violations[aid]
                  d['safetyHold']=True
                  d['safetyHoldReason']='ACCOUNT_SUSPENSION_AUDIO_MODERATION_2026_08_21'
                  registry.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
              except Exception as exc:
                  print('Registry quarantine warning:',exc)
          PY

      - name: Persist quarantine without triggering deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ACC Roblox Safety Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            maps/bbya-social-hub/30-club-systems.server.lua \
            maps/bbya-social-hub/85-basement-autodj.server.lua \
            deploy-status/bbya-audio-safety-hold.json
          if [ -f deploy-status/bbya-basement-drive-registry.json ]; then
            git add -- deploy-status/bbya-basement-drive-registry.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Quarantine BBYA Drive audio after moderation action [skip ci]'
            git push origin HEAD:main
          fi
