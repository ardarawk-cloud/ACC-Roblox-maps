name: BBYA Drive Audio Router

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-basement-drive-inject.yml'
      - 'scripts/inject-bbya-basement-from-drive.py'
      - 'scripts/route-bbya-drive-audio.py'
  workflow_dispatch:

concurrency:
  group: bbya-basement-drive-full-library
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio and Drive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip 'gdown>=6.1.0'

      - name: Prioritize Progressive for Main Club first
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/inject-bbya-basement-from-drive.py')
          s=p.read_text(encoding='utf-8')
          old='''    {"name": "FUNKOT", "id": "1YB4xGNjTPk9f01D38NfQ4590DB8rBADS", "style": "funkot"},\n    {"name": "BREAKBEAT CAMPUR", "id": "1Dfng7YAgz7kcH0Qz3hyeXdwHzqYOR0Hs", "style": "breakbeat"},\n    {"name": "TEMBAK LANGIT REMIX", "id": "1rwTIqIKdgai3EbU4AFhUGTIaZkwxkBwE", "style": "tembak-langit"},\n    {"name": "PROGRESIVE", "id": "1WdYH8ICus8WHPuVDvX0b4LOa9LbbBSCd", "style": "progressive"},'''
          new='''    {"name": "PROGRESIVE", "id": "1WdYH8ICus8WHPuVDvX0b4LOa9LbbBSCd", "style": "progressive"},\n    {"name": "FUNKOT", "id": "1YB4xGNjTPk9f01D38NfQ4590DB8rBADS", "style": "funkot"},\n    {"name": "BREAKBEAT CAMPUR", "id": "1Dfng7YAgz7kcH0Qz3hyeXdwHzqYOR0Hs", "style": "breakbeat"},\n    {"name": "TEMBAK LANGIT REMIX", "id": "1rwTIqIKdgai3EbU4AFhUGTIaZkwxkBwE", "style": "tembak-langit"},'''
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('PROGRESIVE promoted to source priority 1')
          elif new in s:
              print('PROGRESIVE already source priority 1')
          else:
              raise SystemExit('Source priority block not found')
          PY

      - name: Upload and checkpoint routed audio batches
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_AUDIO_API_KEY || secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          UNIVERSE_ID: '8116636513'
          AUDIO_UPLOAD_WORKERS: '5'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"

          for batch in $(seq 1 30); do
            echo "=== BBYA AUDIO CHECKPOINT BATCH ${batch} ==="
            export MAX_NEW_AUDIO_UPLOADS=20

            python3 scripts/inject-bbya-basement-from-drive.py
            python3 scripts/route-bbya-drive-audio.py

            git add \
              scripts/inject-bbya-basement-from-drive.py \
              maps/bbya-social-hub/30-club-systems.server.lua \
              maps/bbya-social-hub/85-basement-autodj.server.lua \
              deploy-status/bbya-basement-drive-inject.json \
              deploy-status/bbya-basement-drive-registry.json \
              deploy-status/bbya-audio-routing.json

            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint BBYA Drive audio batch ${batch}: Progressive Main, others Basement [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi

            remaining="$(python3 - <<'PY'
          import json
          d=json.load(open('deploy-status/bbya-basement-drive-inject.json',encoding='utf-8'))
          print(int(d.get('remainingCount',0) or 0))
          PY
          )"
            quota="$(python3 - <<'PY'
          import json
          d=json.load(open('deploy-status/bbya-basement-drive-inject.json',encoding='utf-8'))
          print('1' if d.get('quotaOrRateLimitSeen') else '0')
          PY
          )"
            echo "Remaining after batch ${batch}: ${remaining}; quota/rate-limit=${quota}"

            if [ "$remaining" -eq 0 ]; then
              echo "All discovered Drive audio has an Asset ID."
              break
            fi
            if [ "$quota" -eq 1 ]; then
              echo "Roblox quota/rate limit encountered; checkpoint is safely persisted."
              break
            fi
          done

      - name: Verify final routing policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/route-bbya-drive-audio.py
          python3 - <<'PY'
          import json
          r=json.load(open('deploy-status/bbya-audio-routing.json',encoding='utf-8'))
          if not r.get('valid'):
              raise SystemExit('BBYA audio routing invalid')
          print('PROGRESIVE -> MAIN_CLUB:', r.get('mainProgressiveCount'))
          print('ALL OTHER DRIVE -> BASEMENT:', r.get('basementDriveCount'))
          PY

      - name: Persist final routing state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/inject-bbya-basement-from-drive.py \
            maps/bbya-social-hub/30-club-systems.server.lua \
            maps/bbya-social-hub/85-basement-autodj.server.lua \
            deploy-status/bbya-basement-drive-inject.json \
            deploy-status/bbya-basement-drive-registry.json \
            deploy-status/bbya-audio-routing.json
          if ! git diff --cached --quiet; then
            git commit -m "Finalize BBYA Drive audio routing [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Report injection and routing state
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          i=json.load(open('deploy-status/bbya-basement-drive-inject.json',encoding='utf-8'))
          r=json.load(open('deploy-status/bbya-audio-routing.json',encoding='utf-8'))
          print('Discovered:', i.get('discoveredCount'))
          print('Registered:', i.get('registeredDiscoveredCount'))
          print('New uploads this checkpoint:', i.get('newlyUploadedCount'))
          print('Deduplicated:', i.get('deduplicatedCount'))
          print('Failed:', i.get('failedCount'))
          print('Remaining:', i.get('remainingCount', 0))
          print('Main Progressive:', r.get('mainProgressiveCount'))
          print('Basement Drive:', r.get('basementDriveCount'))
          print('Routing valid:', r.get('valid'))
          PY

      - name: Cache Rojo binary
        id: rojo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}

      - name: Install canonical Roblox serializer
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked

      - name: Build BBYA with routed audio libraries
        shell: bash
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-routed-audio.rbxl
          test -s /tmp/bbya-routed-audio.rbxl
          ls -lh /tmp/bbya-routed-audio.rbxl

      - name: Publish BBYA routed audio live
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PUBLISH_RECEIPT_DIR: deploy-status
          PLACE_FILE_OVERRIDE: /tmp/bbya-routed-audio.rbxl
        run: node scripts/publish-map.js a-club

      - name: Persist deploy receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy-status/a-club.json
          cp deploy-status/a-club.json /tmp/a-club-routed-audio.json
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          mkdir -p deploy-status
          cp /tmp/a-club-routed-audio.json deploy-status/a-club.json
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/a-club.json
          if ! git diff --cached --quiet; then
            git commit -m "Record BBYA routed audio deploy [skip ci]"
            git push origin HEAD:main
          fi
