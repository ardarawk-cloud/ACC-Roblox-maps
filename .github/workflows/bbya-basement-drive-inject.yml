name: BBYA Drive Audio Router — SAFETY HOLD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbya-basement-drive-full-library
  cancel-in-progress: true

jobs:
  safety_hold:
    runs-on: ubuntu-latest
    steps:
      - name: Audio uploads disabled
        run: |
          echo 'SAFETY HOLD: Roblox audio uploads are disabled after account moderation action.'
          echo 'Do not create, retry, or re-upload audio assets from Drive.'
