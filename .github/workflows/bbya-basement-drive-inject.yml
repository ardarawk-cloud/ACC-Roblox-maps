name: BBYA Basement Drive Audio Inject

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-basement-drive-inject.yml'
      - 'scripts/inject-bbya-basement-from-drive.py'
  workflow_dispatch:

concurrency:
  group: bbya-basement-drive-inject
  cancel-in-progress: false

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio and Drive tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip gdown

      - name: Pull owner Drive audio and upload to Roblox
        id: inject
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_AUDIO_API_KEY || secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          UNIVERSE_ID: '8116636513'
        shell: bash
        run: |
          set +e
          python3 scripts/inject-bbya-basement-from-drive.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ ! -f deploy-status/bbya-basement-drive-inject.json ]; then
            mkdir -p deploy-status
            printf '{"complete":false,"error":"injector exited before writing status","exitCode":%s}\n' "$code" > deploy-status/bbya-basement-drive-inject.json
          fi
          exit 0

      - name: Persist injector result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/bbya-basement-drive-inject.json
          if [ -f maps/bbya-social-hub/85-basement-autodj.server.lua ]; then
            git add maps/bbya-social-hub/85-basement-autodj.server.lua
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record BBYA Basement Drive audio injection"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Require completed injection
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p='deploy-status/bbya-basement-drive-inject.json'
          d=json.load(open(p,encoding='utf-8'))
          if not d.get('complete'):
              raise SystemExit('Basement audio injection incomplete: '+str(d.get('error') or d.get('tracks')))
          print('Basement audio injection complete:', d.get('injectedCount'))
          PY

