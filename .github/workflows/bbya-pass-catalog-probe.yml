name: BBYA Pass Catalog Probe

on:
  push:
    branches: ['feat/bbya-pass-icons-v1']
    paths:
      - '.github/workflows/bbya-pass-catalog-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
    steps:
      - name: List BBYA game passes and icon metadata
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $universe='8116636513'
          $headers=@{'x-api-key'=$env:ROBLOX_OPEN_CLOUD_API_KEY}
          $uri="https://apis.roblox.com/game-passes/v1/universes/$universe/game-passes/creator?pageSize=100"
          $r=Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          Write-Host "BBYA_PASS_CATALOG_JSON=$(($r | ConvertTo-Json -Depth 20 -Compress))"
          foreach($p in $r.gamePasses){
            Write-Host ("BBYA_PASS gamePassId={0} name={1} iconAssetId={2}" -f $p.gamePassId,$p.name,$p.iconAssetId)
            $iconUri="https://apis.roblox.com/legacy-game-internationalization/v1/game-passes/$($p.gamePassId)/icons"
            try {
              $icons=Invoke-RestMethod -Method Get -Uri $iconUri -Headers $headers
              Write-Host ("BBYA_PASS_ICONS gamePassId={0} json={1}" -f $p.gamePassId,(($icons | ConvertTo-Json -Depth 12 -Compress)))
            } catch {
              Write-Host ("BBYA_PASS_ICONS_FAIL gamePassId={0} error={1}" -f $p.gamePassId,$_.Exception.Message)
            }
          }
          Write-Host "BBYA_PASS_ICON_METADATA_PASS count=$($r.gamePasses.Count)"
