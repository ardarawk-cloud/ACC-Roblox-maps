name: BBYA Ddiaz Cars Test Ingest

on:
  push:
    branches: [feat/bbya-mall-catalog-v8-reference-rebuild]
    paths:
      - '.github/workflows/bbya-ddiaz-cars-test-ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
      UNIVERSE_ID: '10762005984'
      HURACAN_DRIVE_ID: '1i12dTW47U465DMmJI85B76wCfTkCBmke'
      RX8_DRIVE_ID: '1rt20cc9ggokbsET4oFSZDTeHDQr2frT8'
    steps:
      - name: Resolve BBYA creator
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ROBLOX_API_KEY){ throw 'AM_STUDIO / ROBLOX_API_KEY missing' }
          $meta=Invoke-RestMethod -Method Get -Uri "https://games.roblox.com/v1/games?universeIds=$env:UNIVERSE_ID"
          if(-not $meta.data -or $meta.data.Count -lt 1){ throw 'Unable to resolve BBYA creator' }
          $creator=$meta.data[0].creator
          $type=[string]$creator.type
          $id=[string]$creator.id
          if($id -notmatch '^\d+$'){ throw "Invalid creator id: $id" }
          if($type -ieq 'Group'){$field='groupId'}elseif($type -ieq 'User'){$field='userId'}else{throw "Unsupported creator type: $type"}
          "BBYA_CREATOR_FIELD=$field" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BBYA_CREATOR_ID=$id" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_CREATOR_RESOLVED type=$type id=$id"

      - name: Download exact Drive GLBs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'bbya-ddiaz-cars'
          if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $huracan=Join-Path $dir '2021_vorsteiner_lamborghini_huracan_evo_2wd.glb'
          $rx8=Join-Path $dir '2004_veilside_d1-gt_mazda_rx-8_tokyo_drift.glb'
          $hurl="https://drive.usercontent.google.com/download?id=$env:HURACAN_DRIVE_ID&export=download&confirm=t"
          $rurl="https://drive.usercontent.google.com/download?id=$env:RX8_DRIVE_ID&export=download&confirm=t"
          Invoke-WebRequest -UseBasicParsing -Uri $hurl -OutFile $huracan
          Invoke-WebRequest -UseBasicParsing -Uri $rurl -OutFile $rx8
          if((Get-Item $huracan).Length -lt 15000000){throw 'Huracan download unexpectedly small'}
          if((Get-Item $rx8).Length -lt 10000000){throw 'RX8 download unexpectedly small'}
          "HURACAN_GLB=$huracan" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RX8_GLB=$rx8" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HURACAN_BYTES=$((Get-Item $huracan).Length) SHA256=$((Get-FileHash $huracan -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "RX8_BYTES=$((Get-Item $rx8).Length) SHA256=$((Get-FileHash $rx8 -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Upload both permitted display models to Roblox
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function UploadModel([string]$File,[string]$Name,[string]$Description){
            $creator=@{}; $creator[$env:BBYA_CREATOR_FIELD]=$env:BBYA_CREATOR_ID
            $request=@{assetType='Model';displayName=$Name;description=$Description;creationContext=@{creator=$creator}} | ConvertTo-Json -Depth 8 -Compress
            $requestFile=Join-Path $env:RUNNER_TEMP ("bbya-ddiaz-"+[guid]::NewGuid().ToString('N')+'.json')
            [System.IO.File]::WriteAllText($requestFile,$request,(New-Object System.Text.UTF8Encoding($false)))
            try{
              $args=@('--silent','--show-error','--location','--request','POST','--header',"x-api-key: $env:ROBLOX_API_KEY",'--form',"request=<$requestFile;type=application/json",'--form',"fileContent=@$File;type=model/gltf-binary",'https://apis.roblox.com/assets/v1/assets')
              $raw=& curl.exe @args
            }finally{Remove-Item $requestFile -Force -ErrorAction SilentlyContinue}
            if($LASTEXITCODE -ne 0){throw "Upload curl failed for $Name"}
            try{$created=$raw|ConvertFrom-Json}catch{throw "Invalid create response for $Name : $raw"}
            if(-not $created.path){throw "Roblox rejected $Name : $raw"}
            $opId=([string]$created.path)-replace '^operations/',''
            Write-Host "UPLOAD_ACCEPTED name=$Name operation=$opId"
            for($i=0;$i -lt 120;$i++){
              Start-Sleep -Seconds 4
              $opRaw=& curl.exe --silent --show-error --location --header "x-api-key: $env:ROBLOX_API_KEY" "https://apis.roblox.com/assets/v1/operations/$opId"
              if($LASTEXITCODE -ne 0){continue}
              try{$op=$opRaw|ConvertFrom-Json}catch{continue}
              if($op.done){
                if($op.error){throw "Asset operation failed for $Name : $($op.error|ConvertTo-Json -Compress -Depth 8)"}
                $assetId=[string]$op.response.assetId
                if($assetId -notmatch '^\d+$'){throw "No assetId for $Name : $opRaw"}
                Write-Host "UPLOAD_DONE name=$Name asset=$assetId moderation=$([string]$op.response.moderationResult.moderationState)"
                return $assetId
              }
            }
            throw "Timeout waiting for $Name"
          }

          $hCredit='2021 Vorsteiner Lamborghini Huracan EVO 2WD by Ddiaz Design. Source: https://skfb.ly/pFsG9 . CC BY-NC-SA 4.0. Used in BBYA Social Hub with creator permission.'
          $rCredit='2004 VeilSide D1-GT Mazda RX-8 Tokyo Drift by Ddiaz Design. Source: https://skfb.ly/pKzpM . CC BY-NC-SA 4.0. Used in BBYA Social Hub with creator permission.'
          $huracanId=UploadModel $env:HURACAN_GLB 'BBYA Ddiaz Huracan EVO Display' $hCredit
          $rx8Id=UploadModel $env:RX8_GLB 'BBYA Ddiaz VeilSide RX-8 Display' $rCredit
          Write-Host "BBYA_DDIAZ_INGEST_PASS HURACAN_ASSET_ID=$huracanId RX8_ASSET_ID=$rx8Id"
