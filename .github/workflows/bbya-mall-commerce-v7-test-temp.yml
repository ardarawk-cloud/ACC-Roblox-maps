name: BBYA Mall Commerce V7 Test

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bbya-mall-commerce-v7-test-temp.yml'
      - 'maps/bbya-social-hub/133-mall-robux-commerce.client.lua'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Fetch exact source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'mall-v7-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'mall-v7-source'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/$env:TARGET_SOURCE" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $repo=Get-ChildItem $dir -Directory | Select-Object -First 1
          if(-not $repo){throw 'Exact source missing'}
          Get-ChildItem $repo.FullName -Force | ForEach-Object { Copy-Item $_.FullName $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "EXACT_SOURCE=$env:TARGET_SOURCE"

      - name: Static Mall V7 QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/133-mall-robux-commerce.client.lua'
          $s=Get-Content $p -Raw
          foreach($m in @('MALL COMMERCE UI v7','SHOP / TRY / CART / SAVED','ProductCarousel','CreateHumanoidModelFromDescription','PromptSaveAvatar','PromptPurchase(player,id,true,Enum.CurrencyType.Default)','DisplayOrder=94')){
            if(-not $s.Contains($m)){throw "Missing V7 marker: $m"}
          }
          foreach($bad in @('GetService("Lighting")','GetService("InsertService")','SoundId','.Volume =','PromptProductPurchase','PromptGamePassPurchase')){
            if($s.Contains($bad)){throw "Forbidden in Mall V7 client: $bad"}
          }
          Write-Host 'BBYA_MALL_COMMERCE_V7_STATIC_QC_PASS'

      - name: Enable third party sales in test build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/default.project.json'
          $s=Get-Content $p -Raw
          $pattern='"Workspace"\s*:\s*\{\s*"\$className"\s*:\s*"Workspace"\s*\}'
          $replacement='"Workspace": {"$className":"Workspace","$properties":{"AllowThirdPartySales":true}}'
          $patched=[regex]::Replace($s,$pattern,$replacement,1)
          if($patched -eq $s){throw 'Workspace project block not patched'}
          $utf8NoBom=New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $p),$patched,$utf8NoBom)
          if(-not ((Get-Content $p -Raw).Contains('"AllowThirdPartySales":true'))){throw 'AllowThirdPartySales missing'}
          Write-Host 'BBYA_TEST_THIRD_PARTY_SALES_ENABLED'

      - name: Build test candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $z=Join-Path $env:RUNNER_TEMP 'rojo.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive $z -DestinationPath $toolDir -Force
          }
          if((& $rojo --version) -notmatch '7\.7\.0'){throw 'Rojo 7.7.0 required'}
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mall-commerce-v7-test.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Build failed'}
          $bytes=(Get-Item $out).Length
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "PLACE_FILE=$out" | Out-File $env:GITHUB_ENV -Append
          "BUILD_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Append
          "BUILD_SHA=$sha" | Out-File $env:GITHUB_ENV -Append
          Write-Host "BBYA_MALL_COMMERCE_V7_BUILD_PASS bytes=$bytes sha256=$sha source=$env:TARGET_SOURCE"

      - name: Publish test place only
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'MASTER_V2 missing'}
          $url='https://apis.roblox.com/universes/v1/10762005984/places/124607344716828/versions?versionType=Published'
          $resp=& curl.exe --silent --show-error --fail-with-body --http1.1 --ipv4 --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --header 'Content-Type: application/octet-stream' --header 'Expect:' --data-binary "@$env:PLACE_FILE" $url
          if($LASTEXITCODE -ne 0){throw 'Test publish failed'}
          $r=$resp | ConvertFrom-Json
          if(-not $r.versionNumber){throw 'versionNumber missing'}
          $receipt=[ordered]@{status='PUBLISHED';sourceCommit=$env:TARGET_SOURCE;buildSha256=$env:BUILD_SHA;buildBytes=[int64]$env:BUILD_BYTES;universeId='10762005984';placeId='124607344716828';versionNumber=$r.versionNumber;thirdPartySales=$true;publishedAt=(Get-Date).ToUniversalTime().ToString('o')}
          $proof=Join-Path $env:RUNNER_TEMP 'BBYA-MALL-COMMERCE-V7-TEST-RECEIPT.json'
          $receipt | ConvertTo-Json -Depth 4 | Set-Content $proof
          "PROOF_FILE=$proof" | Out-File $env:GITHUB_ENV -Append
          Write-Host "BBYA_MALL_COMMERCE_V7_TEST_PUBLISHED version=$($r.versionNumber) source=$env:TARGET_SOURCE build=$env:BUILD_SHA"

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-MALL-COMMERCE-V7-TEST
          path: ${{ env.PROOF_FILE }}
          if-no-files-found: error
