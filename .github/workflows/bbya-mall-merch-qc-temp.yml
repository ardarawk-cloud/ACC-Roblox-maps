name: BBYA Mall Merchandise Candidate QC

on:
  push:
    branches: [feat/bbya-mall-product-population-v1]
    paths:
      - '.github/workflows/bbya-mall-merch-qc-temp.yml'
      - 'maps/bbya-social-hub/97-mall-safe-security-override.server.lua'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - name: Fetch exact source without Git
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'bbya-mall-merch-source.zip'
          $extract=Join-Path $env:RUNNER_TEMP 'bbya-mall-merch-source'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/$env:GITHUB_SHA" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $repo=Get-ChildItem $extract -Directory | Select-Object -First 1
          if(-not $repo){throw 'Exact-SHA archive missing'}
          Get-ChildItem $repo.FullName -Force | ForEach-Object { Copy-Item $_.FullName $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "EXACT_SOURCE=$env:GITHUB_SHA"

      - name: Static Mall merchandise hard-lock QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/97-mall-safe-security-override.server.lua'
          $s=Get-Content $p -Raw
          foreach($marker in @('MALL_PREMIUM_GALLERY_AUTHORITY_V6','MALL_NATIVE_MERCH_V1','MallNativeMerchStoreCount','MallMerchPartCount','addMerchandise')){
            if($s -notmatch [regex]::Escape($marker)){throw "Missing marker: $marker"}
          }
          foreach($forbidden in @('GetService("Lighting")','GetService("InsertService")','SoundId','.Volume =','Enum.Material.Leather')){
            if($s.Contains($forbidden)){throw "Forbidden regression token: $forbidden"}
          }
          $kinds=@('fashion','shoes','tech','market','home','beauty','books','sport')
          foreach($k in $kinds){if($s -notmatch ('kind=="'+$k+'"')){throw "Missing merch kind: $k"}}
          Write-Host 'BBYA_MALL_MERCH_STATIC_QC_PASS authority=MALL_NATIVE_MERCH_V1 scope=mall_only'

      - name: Rojo 7.7.0 canonical build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $zip=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0-windows-x86_64.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $toolDir -Force
          }
          if((& $rojo --version) -notmatch '7\.7\.0'){throw 'Rojo 7.7.0 required'}
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mall-merch-candidate.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Canonical build failed'}
          $len=(Get-Item $out).Length
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "BBYA_MALL_MERCH_BUILD_PASS bytes=$len sha256=$sha source=$env:GITHUB_SHA"
          "BUILD_FILE=$out" | Out-File $env:GITHUB_ENV -Append

      - name: Upload candidate build
        uses: actions/upload-artifact@v4
        with:
          name: bbya-mall-merch-candidate
          path: ${{ env.BUILD_FILE }}
          if-no-files-found: error
          retention-days: 7