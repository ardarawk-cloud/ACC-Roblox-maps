name: BBYA Approved Audio Permission Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-approved-audio-permission-repair.yml'
      - 'maps/bbya-social-hub/104-venue-audio-groups.server.lua'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbya-approved-audio-permission-repair
  cancel-in-progress: true

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant approved Skatepark custom audio to BBYA Universe
        env:
          UPLOADER_KEY: ${{ secrets.AMSTUDIO_AUDIO_UPLOADER_01 }}
          AM_STUDIO_KEY: ${{ secrets.AM_STUDIO }}
          AUDIO_KEY: ${{ secrets.ROBLOX_AUDIO_API_KEY }}
          UNIVERSE_ID: '8116636513'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request, urllib.error

          root=pathlib.Path('.')
          src=(root/'maps/bbya-social-hub/104-venue-audio-groups.server.lua').read_text(encoding='utf-8')
          block=src.split('local SKATE_PLAYLIST={',1)[1].split('local NIGHT_MARKET_PLAYLIST=',1)[0]
          assets=[]
          seen=set()
          for title, asset_id, tail in re.findall(r'\{title="([^"]+)",assetId="(\d+)"([^}]*)\}', block):
              if 'approvalState="APPROVED"' in tail and asset_id not in seen:
                  seen.add(asset_id)
                  assets.append({'title':title,'assetId':asset_id})

          universe=os.environ['UNIVERSE_ID']

          def request(url, method='GET', payload=None, headers=None):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              h=dict(headers or {})
              if payload is not None and 'Content-Type' not in h:
                  h['Content-Type']='application/json'
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace')
                      try: body=json.loads(raw) if raw.strip() else {}
                      except Exception: body={'raw':raw[-2000:]}
                      return r.status, body
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw) if raw.strip() else {}
                  except Exception: body={'raw':raw[-2000:]}
                  return e.code, body

          def introspect(key):
              if not key: return {'present':False}
              code,data=request('https://apis.roblox.com/api-keys/v1/introspect','POST',{'apiKey':key})
              scopes=[]
              for scope in data.get('scopes') or []:
                  scopes.append({'name':scope.get('name'),'operations':scope.get('operations') or []})
              return {
                  'present':True,'http':code,'name':data.get('name'),
                  'authorizedUserId':str(data.get('authorizedUserId')) if data.get('authorizedUserId') is not None else None,
                  'enabled':data.get('enabled'),'expired':data.get('expired'),'scopes':scopes,
              }

          keys=[
              ('AMSTUDIO_AUDIO_UPLOADER_01',os.environ.get('UPLOADER_KEY','').strip()),
              ('AM_STUDIO',os.environ.get('AM_STUDIO_KEY','').strip()),
              ('ROBLOX_AUDIO_API_KEY',os.environ.get('AUDIO_KEY','').strip()),
          ]
          key_info={label:introspect(key) for label,key in keys}
          report={
              'status':'STARTED',
              'universeId':universe,
              'source':'SKATE_PLAYLIST approvalState=APPROVED',
              'assets':assets,
              'assetCount':len(assets),
              'keyDiagnostics':key_info,
              'results':[],
          }

          granted=[]
          for asset in assets:
              aid=asset['assetId']
              result={'title':asset['title'],'assetId':aid,'granted':False,'attempts':[]}
              for label,key in keys:
                  if not key:
                      result['attempts'].append({'key':label,'attempted':False,'result':'KEY_UNAVAILABLE'})
                      continue
                  info=key_info[label]
                  if info.get('http')!=200 or info.get('enabled') is False or info.get('expired') is True:
                      result['attempts'].append({'key':label,'attempted':False,'result':'KEY_NOT_USABLE','keyInfo':info})
                      continue
                  payload={
                      'subjectType':'Universe','subjectId':universe,'action':'Use',
                      'requests':[{'assetId':int(aid)}],
                  }
                  code,data=request(
                      'https://apis.roblox.com/asset-permissions-api/v1/assets/permissions',
                      'PATCH',payload,{'x-api-key':key,'Content-Type':'application/json-patch+json'}
                  )
                  success_ids=[str(x) for x in (data.get('successAssetIds') or [])] if isinstance(data,dict) else []
                  ok=(aid in success_ids) or (code in (200,201,204) and not (data.get('errors') if isinstance(data,dict) else None))
                  result['attempts'].append({'key':label,'attempted':True,'http':code,'successAssetIds':success_ids,'response':data,'ok':ok})
                  if ok:
                      result['granted']=True
                      result['grantedBy']=label
                      granted.append(aid)
                      break
              report['results'].append(result)

          report['grantedAssetIds']=granted
          report['grantedCount']=len(granted)
          report['missingAssetIds']=[a['assetId'] for a in assets if a['assetId'] not in granted]
          report['status']='GRANTED_ALL' if assets and len(granted)==len(assets) else 'PARTIAL_OR_FAILED'
          out=root/'deploy-status/bbya-approved-audio-permissions.json'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'status':report['status'],'assets':len(assets),'granted':len(granted),'missing':report['missingAssetIds']}))
          PY

      - name: Persist permission result safely
        shell: bash
        run: |
          set -euo pipefail
          cp deploy-status/bbya-approved-audio-permissions.json /tmp/bbya-approved-audio-permissions.json
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p deploy-status
            cp /tmp/bbya-approved-audio-permissions.json deploy-status/bbya-approved-audio-permissions.json
            git add deploy-status/bbya-approved-audio-permissions.json
            if git diff --cached --quiet; then
              echo 'Permission report already current.'
              exit 0
            fi
            git commit -m 'Record BBYA Skatepark audio permission result [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with main; retry $attempt/3"
            sleep 2
          done
          echo 'Failed to persist permission report after retries.' >&2
          exit 1
