name: BBYA Approved Audio Permission Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-approved-audio-permission-repair.yml'
      - 'maps/bbya-social-hub/104-venue-audio-groups.server.lua'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbya-approved-audio-permission-repair
  cancel-in-progress: true

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant approved custom audio to BBYA Universe
        env:
          AUDIO_KEY: ${{ secrets.ROBLOX_AUDIO_API_KEY }}
          AM_STUDIO_KEY: ${{ secrets.AM_STUDIO }}
          UNIVERSE_ID: '8116636513'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request, urllib.error

          root=pathlib.Path('.')
          src=(root/'maps/bbya-social-hub/104-venue-audio-groups.server.lua').read_text(encoding='utf-8')
          block=src.split('local SKATE_PLAYLIST={',1)[1].split('local NIGHT_MARKET_PLAYLIST=',1)[0]
          rows=[]
          for entry in re.findall(r'\{title="([^"]+)",assetId="(\d+)"([^}]*)\}', block):
              title, asset_id, tail = entry
              if 'approvalState="APPROVED"' in tail:
                  rows.append({'title':title,'assetId':asset_id})

          seen=set(); approved=[]
          for row in rows:
              if row['assetId'] not in seen:
                  seen.add(row['assetId']); approved.append(row)

          universe=os.environ['UNIVERSE_ID']
          report={
              'status':'STARTED',
              'universeId':universe,
              'source':'maps/bbya-social-hub/104-venue-audio-groups.server.lua::SKATE_PLAYLIST approvalState=APPROVED',
              'assets':approved,
              'assetCount':len(approved),
              'attempts':[],
          }

          def request(url, method='GET', payload=None, headers=None):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              h=dict(headers or {})
              if payload is not None and 'Content-Type' not in h:
                  h['Content-Type']='application/json'
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace')
                      return r.status, json.loads(raw) if raw.strip() else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw) if raw.strip() else {}
                  except Exception: body={'raw':raw[-2000:]}
                  return e.code, body

          def introspect(key):
              if not key: return {'present':False}
              code,data=request('https://apis.roblox.com/api-keys/v1/introspect','POST',{'apiKey':key})
              scopes=[]
              for scope in data.get('scopes') or []:
                  scopes.append({'name':scope.get('name'),'operations':scope.get('operations') or []})
              return {
                  'present':True,'http':code,'name':data.get('name'),
                  'authorizedUserId':str(data.get('authorizedUserId')) if data.get('authorizedUserId') is not None else None,
                  'enabled':data.get('enabled'),'expired':data.get('expired'),'scopes':scopes,
              }

          def can_write(info):
              if not info.get('present') or info.get('http')!=200 or info.get('enabled') is False or info.get('expired') is True:
                  return False
              return any(s.get('name')=='asset-permissions:write' for s in info.get('scopes',[]))

          wanted=[r['assetId'] for r in approved]
          granted=set()
          for label,key in [('ROBLOX_AUDIO_API_KEY',os.environ.get('AUDIO_KEY','').strip()),('AM_STUDIO',os.environ.get('AM_STUDIO_KEY','').strip())]:
              info=introspect(key)
              attempt={'key':label,'keyInfo':info,'permissionAttempted':False}
              if not can_write(info):
                  attempt['result']='NO_PERMISSION_SCOPE_OR_KEY_UNAVAILABLE';report['attempts'].append(attempt);continue
              remaining=[x for x in wanted if x not in granted]
              if not remaining:
                  attempt['result']='NOT_NEEDED';report['attempts'].append(attempt);continue
              payload={
                  'subjectType':'Universe','subjectId':universe,'action':'Use',
                  'requests':[{'assetId':int(x)} for x in remaining],
              }
              code,data=request(
                  'https://apis.roblox.com/asset-permissions-api/v1/assets/permissions',
                  'PATCH',payload,{'x-api-key':key,'Content-Type':'application/json-patch+json'}
              )
              attempt['permissionAttempted']=True;attempt['http']=code;attempt['response']=data
              success=[str(x) for x in (data.get('successAssetIds') or [])] if isinstance(data,dict) else []
              granted.update(success);attempt['successCount']=len(success)
              attempt['result']='SUCCESS' if code in (200,201,204) else 'FAILED'
              report['attempts'].append(attempt)
              if len(granted)==len(wanted): break

          report['grantedAssetIds']=sorted(granted,key=int)
          report['grantedCount']=len(granted)
          report['missingAssetIds']=[x for x in wanted if x not in granted]
          report['status']='GRANTED_ALL' if wanted and len(granted)==len(wanted) else 'PARTIAL_OR_FAILED'
          out=root/'deploy-status/bbya-approved-audio-permissions.json'
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'status':report['status'],'assets':len(wanted),'granted':len(granted),'missing':report['missingAssetIds']}))
          PY

      - name: Persist permission result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-approved-audio-permissions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record BBYA approved audio permission repair [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
