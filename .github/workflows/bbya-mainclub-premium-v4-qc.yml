name: BBYA Main Club Premium v4 QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/120-mainclub-premium-v4.server.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-mainclub-premium-v4-qc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/bin/rojo
          key: rojo-7.7.0-linux
      - name: Install Rojo
        run: |
          if [ ! -x "$HOME/.local/bin/rojo" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -L --fail -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
            unzip -o /tmp/rojo.zip -d "$HOME/.local/bin"
            chmod +x "$HOME/.local/bin/rojo"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Full Rojo build
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-mainclub-premium-v4.rbxl
          test -s /tmp/bbya-mainclub-premium-v4.rbxl
      - name: Validate Main Club premium pass
        shell: bash
        run: |
          set -euo pipefail
          f='maps/bbya-social-hub/120-mainclub-premium-v4.server.lua'
          p='maps/bbya-social-hub/default.project.json'
          grep -q 'MAIN CLUB PREMIUM v4' "$f"
          grep -q 'MainClubEntranceReveal' "$f"
          grep -q 'MainBarServiceFinish' "$f"
          grep -q 'DanceFloorMovingHeads' "$f"
          grep -q 'MovingHeadFixtures",8' "$f"
          grep -q 'RearCocktailPockets",4' "$f"
          grep -q 'StageSideCocktailPockets' "$f"
          grep -q 'NoGlobalLightingChanges",true' "$f"
          grep -q 'AudioUntouched",true' "$f"
          grep -q 'DJBoothUntouched",true' "$f"
          grep -q 'MainClubPremiumV4' "$p"
          grep -q '120-mainclub-premium-v4.server.lua' "$p"
          ! grep -Eq 'Lighting\.(Brightness|ExposureCompensation|Ambient|OutdoorAmbient|ClockTime)' "$f"
          ! grep -Eq 'SoundId|SoundGroup|MarketplaceService|TeleportService' "$f"
