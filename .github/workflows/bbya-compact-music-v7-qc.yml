name: BBYA Music Suite v1 QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/103-music-ui-final.client.lua'
      - 'maps/bbya-social-hub/104-venue-audio-router.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-compact-music-v7-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: rojo-cache
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}
      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked
      - name: Build BBYA place
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-music-suite-v1.rbxl
          test -s /tmp/bbya-music-suite-v1.rbxl
      - name: Validate premium music suite authority
        shell: bash
        run: |
          set -euo pipefail
          ui='maps/bbya-social-hub/103-music-ui-final.client.lua'
          router='maps/bbya-social-hub/104-venue-audio-router.client.lua'

          grep -q 'BBYA MUSIC SUITE v1' "$ui"
          grep -q 'BBYAMusicSuiteV1' "$ui"
          grep -q 'LIBRARY' "$ui"
          grep -q 'NOW PLAYING' "$ui"
          grep -q 'QUEUE' "$ui"
          grep -q 'Search songs' "$ui"
          grep -q 'Slot_MUSIC' "$ui"
          grep -q 'music:FireServer("request"' "$ui"
          grep -q 'music:FireServer("list"' "$ui"
          grep -q 'BBYAMusicMuted' "$ui"
          grep -q 'PlaybackLoudness' "$ui"
          grep -q 'vp.X<900' "$ui"
          grep -q 'UNDERGROUND' "$ui"
          grep -q 'MAIN CLUB' "$ui"
          grep -q 'admin Prev/Next' "$ui"

          grep -q 'player:GetAttribute("BBYAMusicMuted")' "$router"

          if grep -q 'Size=UDim2.fromOffset(760' "$ui"; then
            echo 'Legacy fixed oversized music dashboard returned.' >&2
            exit 1
          fi

          echo 'BBYA Music Suite v1 QC passed.'
