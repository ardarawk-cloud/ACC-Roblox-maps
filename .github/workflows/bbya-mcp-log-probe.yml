name: BBYA MCP Log Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-mcp-log-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect recent Studio logs and settings
        shell: powershell
        run: |
          $base='C:\Users\Administrator\AppData\Local\Roblox'
          $lines=New-Object System.Collections.Generic.List[string]
          $lines.Add("timestamp=$(Get-Date -Format o)")
          $lines.Add('REG_BEGIN')
          try { (Get-ItemProperty 'HKCU:\Software\Roblox\RobloxStudio' | Out-String).Split("`n") | ForEach-Object { $lines.Add($_) } } catch { $lines.Add($_.Exception.Message) }
          $lines.Add('REG_END')
          $settings=Join-Path $base 'GlobalBasicSettings_13_Studio.xml'
          $lines.Add('SETTINGS_BEGIN')
          if(Test-Path $settings){ (Get-Content $settings -Raw).Split("`n") | ForEach-Object { $lines.Add($_) } }
          $lines.Add('SETTINGS_END')
          $lines.Add('LOG_MATCH_BEGIN')
          $logs=Get-ChildItem (Join-Path $base 'logs') -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 8
          foreach($log in $logs){
            $lines.Add("FILE=$($log.FullName)")
            $matches=Select-String -Path $log.FullName -Pattern 'MCP','StudioMCP','Model Context','Assistant' -SimpleMatch -ErrorAction SilentlyContinue | Select-Object -First 80
            foreach($m in $matches){$lines.Add("$($m.LineNumber):$($m.Line)")}
          }
          $lines.Add('LOG_MATCH_END')
          $text=($lines -join "`n")+"`n"
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-mcp-log-probe.txt"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28";"User-Agent"="BBYA-Studio-Worker"}
          $sha=$null
          try{$sha=(Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $body=@{message='Record BBYA MCP log probe [skip ci]';content=$content;branch='main'}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body|ConvertTo-Json) -ContentType 'application/json'
