name: BBYA Direct Live Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-direct-live.yml'
      - 'maps/a-club/rebuild/**'
      - 'maps/registry.json'
      - 'scripts/prepare-bbya-rojo-live.js'
      - 'scripts/resolve-bbya-commerce.js'
      - 'scripts/validate-bbya-v7-reference.js'
      - 'scripts/publish-map.js'

concurrency:
  group: bbya-direct-live-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  publish-bbya:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install canonical Roblox serializer
        run: cargo install rojo --version 7.7.0 --locked

      - name: Validate BBYA V7 clean source
        run: node scripts/validate-bbya-v7-reference.js

      - name: Resolve existing BBYA commerce IDs
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          BBYA_UNIVERSE_ID: '8116636513'
          BBYA_COMMERCE_JSON: /tmp/bbya-commerce.json
        run: node scripts/resolve-bbya-commerce.js

      - name: Prepare V7 clean Rojo live tree
        env:
          BBYA_COMMERCE_JSON: /tmp/bbya-commerce.json
        run: node scripts/prepare-bbya-rojo-live.js /tmp/bbya-rojo-live

      - name: Build canonical V7 Roblox place
        shell: bash
        run: |
          set -euo pipefail
          rojo build /tmp/bbya-rojo-live/default.project.json -o /tmp/bbya-live.rbxl
          test -s /tmp/bbya-live.rbxl
          ls -lh /tmp/bbya-live.rbxl

      - name: Publish BBYA V7 directly to Roblox
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PUBLISH_RECEIPT_DIR: deploy-status
          PLACE_FILE_OVERRIDE: /tmp/bbya-live.rbxl
        run: node scripts/publish-map.js a-club

      - name: Persist direct publish receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy-status/a-club.json
          test -f /tmp/bbya-commerce.json
          cp deploy-status/a-club.json /tmp/a-club-direct.json
          cp /tmp/bbya-commerce.json /tmp/a-club-commerce.json

          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main

          mkdir -p deploy-status
          cp /tmp/a-club-direct.json deploy-status/a-club.json
          cp /tmp/a-club-commerce.json deploy-status/a-club-commerce.json
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/a-club.json deploy-status/a-club-commerce.json

          if git diff --cached --quiet; then
            echo "Direct publish receipt already current."
            exit 0
          fi

          git commit -m "Record BBYA V7 direct live publish [skip ci]"
          git push origin HEAD:main
