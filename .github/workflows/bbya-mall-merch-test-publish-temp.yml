name: BBYA Mall Merchandise Test Publish

on:
  push:
    branches: [feat/bbya-mall-product-population-v1]
    paths:
      - '.github/workflows/bbya-mall-merch-test-publish-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-test:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Fetch exact source without Git
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'bbya-mall-test-source.zip'
          $extract=Join-Path $env:RUNNER_TEMP 'bbya-mall-test-source'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/$env:GITHUB_SHA" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $repo=Get-ChildItem $extract -Directory | Select-Object -First 1
          if(-not $repo){throw 'Exact-SHA archive missing'}
          Get-ChildItem $repo.FullName -Force | ForEach-Object { Copy-Item $_.FullName $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "EXACT_SOURCE=$env:GITHUB_SHA"

      - name: Verify exact test target and Mall locks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $registry=Get-Content 'maps/registry.json' -Raw | ConvertFrom-Json
          $t=$registry.maps.'bbya-music-test'
          if(-not $t){throw 'bbya-music-test missing'}
          if([string]$t.universeId -ne '10762005984'){throw "Wrong Universe: $($t.universeId)"}
          if([string]$t.placeId -ne '124607344716828'){throw "Wrong Place: $($t.placeId)"}
          $s=Get-Content 'maps/bbya-social-hub/97-mall-safe-security-override.server.lua' -Raw
          foreach($marker in @('MALL_PREMIUM_GALLERY_AUTHORITY_V6','MALL_NATIVE_MERCH_V1','MallNativeMerchStoreCount','MallMerchPartCount')){
            if(-not $s.Contains($marker)){throw "Missing marker $marker"}
          }
          foreach($forbidden in @('GetService("Lighting")','GetService("InsertService")','SoundId','.Volume =','Enum.Material.Leather')){
            if($s.Contains($forbidden)){throw "Forbidden token $forbidden"}
          }
          Write-Host 'BBYA_MALL_TEST_TARGET_QC_PASS universe=10762005984 place=124607344716828'

      - name: Build exact Mall candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $zip=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0-windows-x86_64.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $toolDir -Force
          }
          if((& $rojo --version) -notmatch '7\.7\.0'){throw 'Rojo 7.7.0 required'}
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mall-merch-test.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Build failed'}
          $len=(Get-Item $out).Length
          $hash=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "BBYA_MALL_TEST_BUILD_PASS bytes=$len sha256=$hash source=$env:GITHUB_SHA"
          "PLACE_FILE=$out" | Out-File $env:GITHUB_ENV -Append
          "BUILD_BYTES=$len" | Out-File $env:GITHUB_ENV -Append
          "BUILD_SHA=$hash" | Out-File $env:GITHUB_ENV -Append

      - name: Publish only to BBYA test place
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PLACE_FILE_OVERRIDE: ${{ env.PLACE_FILE }}
          PUBLISH_RECEIPT_DIR: .tmp/bbya-mall-test-receipt
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'ROBLOX_OPEN_CLOUD_MASTER_V2 missing'}
          node scripts/publish-map.js bbya-music-test
          if($LASTEXITCODE -ne 0){throw 'Publisher failed'}
          $receipt=Join-Path $env:GITHUB_WORKSPACE '.tmp\bbya-mall-test-receipt\bbya-music-test.json'
          if(-not (Test-Path $receipt)){throw 'Receipt missing'}
          $r=Get-Content $receipt -Raw | ConvertFrom-Json
          if($r.status -ne 'PUBLISHED'){throw "Receipt status $($r.status)"}
          if($r.sourceCommit -ne $env:GITHUB_SHA){throw "Source mismatch $($r.sourceCommit) != $env:GITHUB_SHA"}
          if([string]$r.universeId -ne '10762005984' -or [string]$r.placeId -ne '124607344716828'){throw 'Receipt target mismatch'}
          $version=$r.response.versionNumber
          if(-not $version){throw 'Roblox versionNumber missing'}
          Write-Host "BBYA_MALL_TEST_PUBLISHED version=$version source=$($r.sourceCommit) bytes=$env:BUILD_BYTES sha256=$env:BUILD_SHA"
          "RECEIPT_FILE=$receipt" | Out-File $env:GITHUB_ENV -Append

      - name: Upload test receipt and build
        uses: actions/upload-artifact@v4
        with:
          name: bbya-mall-merch-test-proof
          path: |
            ${{ env.RECEIPT_FILE }}
            ${{ env.PLACE_FILE }}
          if-no-files-found: error
          retention-days: 7