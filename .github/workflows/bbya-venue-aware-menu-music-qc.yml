name: BBYA Venue-aware Menu Music QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/104-venue-audio-groups.server.lua'
      - 'maps/bbya-social-hub/114-venue-aware-menu-music.client.lua'
      - 'maps/bbya-social-hub/134-rooftop-playlist.server.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-venue-aware-menu-music-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: rojo-cache
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}
      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked
      - name: Build BBYA place
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-venue-aware-menu.rbxl
          test -s /tmp/bbya-venue-aware-menu.rbxl
      - name: Validate all-venue premium Music Suite bridge
        shell: bash
        run: |
          set -euo pipefail
          f='maps/bbya-social-hub/114-venue-aware-menu-music.client.lua'
          skate='maps/bbya-social-hub/104-venue-audio-groups.server.lua'
          roof='maps/bbya-social-hub/134-rooftop-playlist.server.lua'
          project='maps/bbya-social-hub/default.project.json'

          grep -q 'VENUE-AWARE MENU MUSIC v4' "$f"
          grep -q 'MAIN="CLUB"' "$f"
          grep -q 'UNDERGROUND="UNDERGROUND"' "$f"
          grep -q 'VIP="VIP"' "$f"
          grep -q 'FUNKOT="FUNKOT"' "$f"
          grep -q 'SKATEPARK="SKATEPARK"' "$f"
          grep -q 'ROOFTOP="ROOFTOP"' "$f"
          grep -q 'BBYAAudioVenue' "$f"
          grep -q 'BBYACommandMenuId' "$f"
          grep -q 'BBYAMobileControlsGuard' "$f"
          grep -q 'BBYAAllVenueMusicSuiteBridge' "$f"
          grep -q 'BBYASkateparkPlaylistCatalog' "$f"
          grep -q 'BBYARooftopPlaylistCatalog' "$f"
          grep -q 'VIPMusic' "$f"
          grep -q 'FunkotMusic' "$f"
          grep -q 'BBYASkateparkMusicControl' "$f"
          grep -q 'BBYARooftopMusicControl' "$f"
          grep -q 'sendRequest' "$f"
          grep -q 'sendTransport' "$f"

          grep -q 'VENUE AUDIO MASTERS v4.5' "$skate"
          grep -q 'BBYASkateparkMusicControl' "$skate"
          grep -q '101433831748471' "$skate"
          grep -q 'playbackSpeed=0.8' "$skate"
          ! grep -q '134928414278364' "$skate"

          grep -q 'ROOFTOP TROPICAL PLAYLIST AUTHORITY v7' "$roof"
          grep -q 'BBYARooftopMusicControl' "$roof"
          grep -q 'action=="request"' "$roof"
          grep -q 'action=="next"' "$roof"
          grep -q 'action=="prev"' "$roof"
          grep -q 'BBYARooftopQueueCount' "$roof"

          grep -q '"VenueAwareMenuMusicV1"' "$project"
          grep -q '"$path": "114-venue-aware-menu-music.client.lua"' "$project"
          grep -q '"RooftopPlaylistAuthorityV1"' "$project"
          grep -q '"$path": "134-rooftop-playlist.server.lua"' "$project"

          echo 'BBYA venue-aware premium Music Suite v4 all-venue QC passed.'
