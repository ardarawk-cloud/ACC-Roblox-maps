name: BBYA Venue-aware Menu Music QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/114-venue-aware-menu-music.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-venue-aware-menu-music-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: rojo-cache
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}
      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked
      - name: Build BBYA place
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-venue-aware-menu.rbxl
          test -s /tmp/bbya-venue-aware-menu.rbxl
      - name: Validate venue-aware menu music label and mobile guard
        shell: bash
        run: |
          set -euo pipefail
          f='maps/bbya-social-hub/114-venue-aware-menu-music.client.lua'
          project='maps/bbya-social-hub/default.project.json'
          grep -q 'VENUE-AWARE MENU MUSIC v2' "$f"
          grep -q 'MAIN="CLUB"' "$f"
          grep -q 'UNDERGROUND="UNDERGROUND"' "$f"
          grep -q 'VIP="VIP"' "$f"
          grep -q 'FUNKOT="FUNKOT"' "$f"
          grep -q 'SKATEPARK="SKATEPARK"' "$f"
          grep -q 'ROOFTOP="ROOFTOP"' "$f"
          grep -q 'BBYAAudioVenue' "$f"
          grep -q 'BBYACommandMenuId' "$f"
          grep -q 'updateMusicLabel' "$f"
          grep -q 'BBYAMobileControlsGuard' "$f"
          grep -q 'AdminNextV7' "$f"
          grep -q 'maxRight=cw-pad' "$f"
          grep -q '"VenueAwareMenuMusicV1"' "$project"
          grep -q '"$path": "114-venue-aware-menu-music.client.lua"' "$project"
          ! grep -q 'FireServer' "$f"
          echo 'BBYA venue-aware menu music v2 QC passed.'
