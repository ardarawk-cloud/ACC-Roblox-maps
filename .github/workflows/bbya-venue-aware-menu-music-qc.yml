name: BBYA Venue-aware Menu Music QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/104-venue-audio-groups.server.lua'
      - 'maps/bbya-social-hub/114-venue-aware-menu-music.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-venue-aware-menu-music-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: rojo-cache
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}
      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked
      - name: Build BBYA place
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-venue-aware-menu.rbxl
          test -s /tmp/bbya-venue-aware-menu.rbxl
      - name: Validate venue-aware menu + Skatepark Music Suite bridge
        shell: bash
        run: |
          set -euo pipefail
          f='maps/bbya-social-hub/114-venue-aware-menu-music.client.lua'
          masters='maps/bbya-social-hub/104-venue-audio-groups.server.lua'
          project='maps/bbya-social-hub/default.project.json'

          grep -q 'VENUE-AWARE MENU MUSIC v3' "$f"
          grep -q 'MAIN="CLUB"' "$f"
          grep -q 'UNDERGROUND="UNDERGROUND"' "$f"
          grep -q 'VIP="VIP"' "$f"
          grep -q 'FUNKOT="FUNKOT"' "$f"
          grep -q 'SKATEPARK="SKATEPARK"' "$f"
          grep -q 'ROOFTOP="ROOFTOP"' "$f"
          grep -q 'BBYAAudioVenue' "$f"
          grep -q 'BBYACommandMenuId' "$f"
          grep -q 'updateMusicLabel' "$f"
          grep -q 'BBYAMobileControlsGuard' "$f"
          grep -q 'AdminNextV7' "$f"
          grep -q 'maxRight=cw-pad' "$f"

          grep -q 'SKATEPARK MUSIC SUITE BRIDGE v1' "$f"
          grep -q 'BBYASkateparkPlaylistCatalog' "$f"
          grep -q 'BBYASkateparkMusicControl' "$f"
          grep -q 'BBYASkateparkCurrentIndex' "$f"
          grep -q 'BBYASkateparkCurrentTitle' "$f"
          grep -q 'BBYASkateparkQueueCount' "$f"
          grep -q 'skateControl:FireServer("next")\|skateControl:FireServer(action)' "$f"
          grep -q 'skateControl:FireServer("request",i)' "$f"
          grep -q 'BBYASkateparkMusicSuiteBridge' "$f"

          grep -q 'VENUE AUDIO MASTERS v4.4' "$masters"
          grep -q 'BBYASkateparkMusicControl' "$masters"
          grep -q 'skateControl.OnServerEvent' "$masters"
          grep -q 'action=="next"' "$masters"
          grep -q 'action=="prev"' "$masters"
          grep -q 'action=="request"' "$masters"
          grep -q 'BBYASkateparkQueueCount' "$masters"
          grep -q '101433831748471' "$masters"
          grep -q 'playbackSpeed=0.8' "$masters"

          grep -q '"VenueAwareMenuMusicV1"' "$project"
          grep -q '"$path": "114-venue-aware-menu-music.client.lua"' "$project"

          # v3 may write only through the dedicated Skatepark control remote.
          bad=$(grep -n 'FireServer' "$f" | grep -v 'skateControl:FireServer' || true)
          test -z "$bad"

          echo 'BBYA venue-aware menu music v3 + Skatepark bridge QC passed.'
