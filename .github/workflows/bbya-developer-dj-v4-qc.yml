name: BBYA Developer DJ Live v4 QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/129-developer-dj-performance-v4.server.lua'
      - 'maps/bbya-social-hub/129-developer-dj-performance-v4.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-developer-dj-v4-qc.yml'
  workflow_dispatch:

jobs:
  qc:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-dj-v4-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-dj-v4-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Static DJ v4 performance QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $server=Get-Content 'maps/bbya-social-hub/129-developer-dj-performance-v4.server.lua' -Raw
          $client=Get-Content 'maps/bbya-social-hub/129-developer-dj-performance-v4.client.lua' -Raw
          $project=Get-Content 'maps/bbya-social-hub/default.project.json' -Raw
          $null=$project | ConvertFrom-Json

          foreach($needle in @(
            'AM_STUDIO_USERNAME="arda_moron123"',
            'player.UserId==game.CreatorId',
            'V4_TOUCH_VINYL_HOTCUE',
            'HotCueSlotsPerDeck',
            'v4_hotcue_set',
            'v4_hotcue_play',
            'v4_seek_ratio',
            'v4_nudge',
            'BBYADJHotCue'
          )){if($server -notmatch [regex]::Escape($needle)){throw "Missing v4 server marker: $needle"}}

          foreach($forbidden in @('nadmo97','styxraasoraaa','HttpService','drive%.google','google%.com','file://')){
            if($server -match $forbidden){throw "Forbidden v4 server marker: $forbidden"}
          }

          foreach($needle in @(
            'V4_TOUCH_VINYL_HOTCUE',
            'PlaylistSearchV4',
            'HotCueRailV4',
            'VinylJogSurfaceV4',
            'WaveSeekSurfaceV4',
            'TOUCH JOG',
            'v4_hotcue_set',
            'v4_hotcue_play',
            'v4_seek_ratio',
            'v4_nudge',
            'PlaylistSearch'
          )){if($client -notmatch [regex]::Escape($needle)){throw "Missing v4 client marker: $needle"}}

          foreach($forbidden in @('LOW 0','MID 0','HI 0','LOAD TO A','LOAD TO B','nadmo97','styxraasoraaa')){
            if($client -match [regex]::Escape($forbidden)){throw "Forbidden v4 client marker: $forbidden"}
          }

          foreach($needle in @('129-developer-dj-performance-v4.server.lua','129-developer-dj-performance-v4.client.lua')){
            if($project -notmatch [regex]::Escape($needle)){throw "Manifest mount missing: $needle"}
          }
          Write-Host 'DJ LIVE V4 STATIC QC PASS'

      - name: Full BBYA Rojo build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'bbya-dj-live-v4-qc.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not (Test-Path $out)){throw 'RBXL output missing'}
          if((Get-Item $out).Length -lt 1024){throw 'RBXL output too small'}
          Write-Host "DJ LIVE V4 ROJO PASS bytes=$((Get-Item $out).Length)"
