name: BBYA Live Self Heal — RETIRED

# RETIRED 2026-08-26.
# This workflow previously auto-published every BBYA Lua change from main and could
# overwrite an exact-safe live source with stale destructive audio authorities.
# It is intentionally manual-only and contains no Roblox publish step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 2
    steps:
      - name: Block retired publisher
        shell: powershell
        run: |
          Write-Host 'BBYA_LIVE_SELF_HEAL_RETIRED'
          Write-Host 'Use a scoped guarded publisher with an exact source receipt.'
