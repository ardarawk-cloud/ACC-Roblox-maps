name: BBYA Live Self Heal

# v2: self-hosted fallback for GitHub-hosted runner outages + Roblox transient publish conflicts.
# Premium Fishing District live retrigger: 2026-08-24
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-live-self-heal.yml'
  workflow_dispatch:

concurrency:
  group: bbya-live-self-heal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Rojo 7.7.0 on self-hosted runner
        id: rojo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'bbya-rojo.log'
          try {
            $cmd=Get-Command rojo -ErrorAction SilentlyContinue
            if($cmd){
              $rojoExe=$cmd.Source
            } else {
              $dir=Join-Path $env:RUNNER_TEMP 'bbya-rojo-7.7.0'
              $zip=Join-Path $env:RUNNER_TEMP 'bbya-rojo-7.7.0.zip'
              if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
              New-Item -ItemType Directory -Path $dir -Force | Out-Null
              Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
              Expand-Archive -Path $zip -DestinationPath $dir -Force
              $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
              if(-not $exe){throw 'rojo.exe not found after download'}
              $rojoExe=$exe.FullName
            }
            & $rojoExe --version 2>&1 | Tee-Object -FilePath $log
            if($LASTEXITCODE -ne 0){throw "Rojo version check failed: $LASTEXITCODE"}
            "ROJO_EXE=$rojoExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'exit_code=0' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } catch {
            $_ | Out-String | Tee-Object -FilePath $log -Append | Write-Host
            'exit_code=1' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            throw
          }

      - name: Full Rojo build
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'bbya-build.log'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-zero-live-selfhosted.rbxl'
          try {
            & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place 2>&1 | Tee-Object -FilePath $log
            if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
            if(-not (Test-Path $place)){throw 'Built place file missing'}
            if((Get-Item $place).Length -lt 1024){throw 'Built place file is unexpectedly small'}
            "PLACE_FILE_OVERRIDE=$place" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'exit_code=0' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Built $place ($((Get-Item $place).Length) bytes)"
          } catch {
            $_ | Out-String | Tee-Object -FilePath $log -Append | Write-Host
            'exit_code=1' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            throw
          }

      - name: Validate final UI and Main Club scope
        id: scope
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Require([string]$text,[string]$pattern,[string]$message){if($text -notmatch $pattern){throw $message}}
          function Forbid([string]$text,[string]$pattern,[string]$message){if($text -match $pattern){throw $message}}
          $menu=Get-Content 'maps/bbya-social-hub/56-dock-stability.client.lua' -Raw
          $secondary=Get-Content 'maps/bbya-social-hub/111-compact-secondary-panels.client.lua' -Raw
          $owner=Get-Content 'maps/bbya-social-hub/91-owner-ui.client.lua' -Raw
          $beauty=Get-Content 'maps/bbya-social-hub/121-mainclub-beauty-v5.server.lua' -Raw
          $brand=Get-Content 'maps/bbya-social-hub/121-mainclub-brand-cleanup.client.lua' -Raw
          $project=Get-Content 'maps/bbya-social-hub/default.project.json' -Raw

          Require $menu 'COMMAND MENU AUTHORITY v7' 'Command Menu v7 authority missing'
          Require $menu 'V7_SINGLE_COMPACT_AUTHORITY' 'Single-panel authority marker missing'
          Require $menu 'hideCompetingPanels' 'Single-panel arbiter missing'
          Require $menu 'LEFT_OF_MENU_V2_PRECISE' 'Precise left-of-menu docking missing'
          Require $secondary 'COMPACT SECONDARY PANELS v3' 'Secondary UI v3 missing'
          Require $secondary 'COMMAND_MENU_V7' 'Secondary UI does not defer to Command Menu v7'
          Forbid $secondary 'hub\.Position\s*=' 'Secondary UI still owns HubPanel position'
          Forbid $secondary 'panel\.Position\s*=' 'Secondary UI still owns message position'
          Require $owner 'ROLE PANEL v8' 'Owner UI v8 compatibility marker missing'
          Forbid $owner 'p\.Position=UDim2\.fromScale\(\.5,\.55\)' 'Owner UI still recenters Dance/Carry'
          Forbid $owner 'p\.Position=UDim2\.fromScale\(\.5,\.54\)' 'Owner UI still recenters Community'

          Require $beauty 'MAIN CLUB BEAUTY v5' 'Main Club Beauty v5 missing'
          Require $beauty 'LocalBrightnessOnly",true' 'Local-only brightness marker missing'
          Require $beauty 'GlobalLightingUntouched",true' 'Global Lighting safety marker missing'
          Require $beauty 'CeilingFillCount",6' 'Expected six ceiling fills missing'
          Require $beauty 'BarPendantCount",3' 'Expected three bar pendants missing'
          Forbid $beauty 'Lighting\.(Brightness|ExposureCompensation|Ambient|OutdoorAmbient|ClockTime)' 'Beauty pass touches global Lighting'
          Forbid $beauty 'SoundId|SoundGroup|MarketplaceService|TeleportService' 'Beauty pass touches protected systems'
          Require $brand 'MAIN CLUB BRAND CLEANUP v1' 'Brand cleanup missing'
          Require $brand 'label\.Text="BBYA"' 'Single BBYA wall label missing'
          Require $project '121-mainclub-beauty-v5\.server\.lua' 'Beauty v5 is not mounted'
          Require $project '121-mainclub-brand-cleanup\.client\.lua' 'Brand cleanup is not mounted'

          'exit_code=0' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'BBYA self-hosted scope QC PASS'

      - name: Publish with retry for transient Roblox conflicts
        id: publish
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
          PUBLISH_RECEIPT_DIR: deploy-status
        run: |
          $ErrorActionPreference='Continue'
          $log=Join-Path $env:RUNNER_TEMP 'bbya-publish.log'
          if(Test-Path $log){Remove-Item $log -Force}
          $success=$false
          $maxAttempts=7
          for($attempt=1;$attempt -le $maxAttempts;$attempt++){
            "=== publish attempt $attempt/$maxAttempts $(Get-Date -Format o) ===" | Tee-Object -FilePath $log -Append | Write-Host
            $output=& node scripts/publish-map.js a-club 2>&1
            $code=$LASTEXITCODE
            $output | Tee-Object -FilePath $log -Append | Write-Host
            if($code -eq 0){$success=$true;break}
            $text=($output | Out-String)
            $transient=($text -match '409|Conflict|Server is busy|try again|\b5\d\d\b|ECONNRESET|ETIMEDOUT|timeout')
            if(-not $transient){break}
            if($attempt -lt $maxAttempts){
              $delay=[Math]::Min(90,15+($attempt*15))
              "Transient Roblox publish error; retrying in $delay seconds." | Tee-Object -FilePath $log -Append | Write-Host
              Start-Sleep -Seconds $delay
            }
          }
          if($success){
            'exit_code=0' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            'exit_code=1' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            throw 'BBYA publish did not succeed after retry policy'
          }

      - name: Persist deploy receipt and diagnostics
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'bbya-selfheal-persist'
          if(Test-Path $tmp){Remove-Item $tmp -Recurse -Force}
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          $receipt='deploy-status/a-club.json'
          if(Test-Path $receipt){Copy-Item $receipt (Join-Path $tmp 'a-club.json') -Force}
          $diag=Join-Path $tmp 'a-club-self-heal.txt'
          @(
            "source_commit=$env:GITHUB_SHA",
            "run_id=$env:GITHUB_RUN_ID",
            "runner=self-hosted/windows/x64",
            "rojo_exit=${{ steps.rojo.outputs.exit_code }}",
            "build_exit=${{ steps.build.outputs.exit_code }}",
            "scope_exit=${{ steps.scope.outputs.exit_code }}",
            "publish_exit=${{ steps.publish.outputs.exit_code }}",
            '--- rojo tail ---'
          ) | Set-Content $diag
          Get-Content (Join-Path $env:RUNNER_TEMP 'bbya-rojo.log') -Tail 40 -ErrorAction SilentlyContinue | Add-Content $diag
          '--- build tail ---' | Add-Content $diag
          Get-Content (Join-Path $env:RUNNER_TEMP 'bbya-build.log') -Tail 60 -ErrorAction SilentlyContinue | Add-Content $diag
          '--- publish tail ---' | Add-Content $diag
          Get-Content (Join-Path $env:RUNNER_TEMP 'bbya-publish.log') -Tail 120 -ErrorAction SilentlyContinue | Add-Content $diag

          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          New-Item -ItemType Directory -Path 'deploy-status' -Force | Out-Null
          Copy-Item $diag 'deploy-status/a-club-self-heal.txt' -Force
          if(Test-Path (Join-Path $tmp 'a-club.json')){Copy-Item (Join-Path $tmp 'a-club.json') 'deploy-status/a-club.json' -Force}
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/a-club-self-heal.txt
          if(Test-Path 'deploy-status/a-club.json'){git add deploy-status/a-club.json}
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m 'Record BBYA self-hosted live repair diagnostics [skip ci]'
            git push origin HEAD:main
            if($LASTEXITCODE -ne 0){throw 'Failed to persist BBYA live receipt'}
          }

      - name: Final gate
        if: always()
        shell: powershell
        run: |
          if('${{ steps.rojo.outputs.exit_code }}' -ne '0'){throw 'Rojo preparation failed'}
          if('${{ steps.build.outputs.exit_code }}' -ne '0'){throw 'Full Rojo build failed'}
          if('${{ steps.scope.outputs.exit_code }}' -ne '0'){throw 'Scope QC failed'}
          if('${{ steps.publish.outputs.exit_code }}' -ne '0'){throw 'Publish failed'}
          Write-Host 'BBYA LIVE SELF-HEAL PASS'
