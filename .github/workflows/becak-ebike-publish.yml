name: Publish Becak E-Bike

on:
  push:
    branches: [main]
    paths:
      - 'maps/becak-e-bike/**'
      - 'maps/registry.json'
      - 'scripts/build-becak-ebike.js'
      - 'scripts/publish-becak-direct.js'
      - '.github/workflows/becak-ebike-publish.yml'
  workflow_dispatch:

concurrency:
  group: becak-ebike-live-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate target lock
        shell: bash
        run: |
          node - <<'NODE'
          const r=require('./maps/registry.json');
          const t=r.maps['becak-e-bike'];
          if(!t) throw new Error('Missing becak-e-bike registry target');
          if(String(t.universeId)!=='10745325613') throw new Error('Wrong Universe ID');
          if(String(t.placeId)!=='80994730522893') throw new Error('Wrong Place ID');
          if(!t.enabled) throw new Error('BECAK E-BIKE target is disabled');
          console.log('Target lock PASS');
          NODE

      - name: Build final masterplan place
        run: node scripts/build-becak-ebike.js

      - name: Validate final generated place
        shell: bash
        run: |
          set -euo pipefail
          test -s maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_Runtime' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_Client' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_CityDetails' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_Masterplan' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_CityEvents' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_TrafficNPC' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_ChargingNetwork' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_DailyContracts' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_StoryProgression' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_ReputationCargo' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_ReputationPassenger' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_Achievements' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_DailyContractsUI' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_MasterplanClient' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_DriverPhone' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_MobileSafeArea' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_DriverNavigation' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_WorldQC' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_RoadAccess' maps/becak-e-bike/place.rbxlx
          grep -q 'EconomyTransaction' maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakRuntime\",\"v1.22" maps/becak-e-bike/place.rbxlx
          grep -q 'BecakPassengerFareTelemetry' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakLastTripBaseReward' maps/becak-e-bike/place.rbxlx
          grep -q 'ACC_BecakCityDetails' maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakMasterplanSystems','v1.3" maps/becak-e-bike/place.rbxlx
          grep -q "BecakLegacyTrafficDisabled','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakSystemsTickHz',5" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakCityEvents','v1.10" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakTrafficNPC','v1.14" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakChargingNetwork','v1.16" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakDailyContracts','v1.17" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakStoryProgression','v1.21" maps/becak-e-bike/place.rbxlx
          grep -q "BecakStoryChapterCount',#CHAPTERS" maps/becak-e-bike/place.rbxlx
          grep -q "BecakReputationSystem','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakReputationCargoTiers','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakReputationPassengerTiers','ON" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakReputationCargo','v1.20" maps/becak-e-bike/place.rbxlx
          grep -q "BecakReputationCargoBonusMaxPct',25" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakReputationPassenger','v1.21" maps/becak-e-bike/place.rbxlx
          grep -q "BecakReputationPassengerBonusMaxPct',15" maps/becak-e-bike/place.rbxlx
          grep -q "BecakReputationPassengerUsesActualFare','ON" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakAchievements','v1.22" maps/becak-e-bike/place.rbxlx
          grep -q "BecakAchievementCount',#ACHIEVEMENTS" maps/becak-e-bike/place.rbxlx
          grep -q "BecakAchievementsPersistent','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakAchievementRewardGuard','PERSIST_BEFORE_PAYOUT" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakDailyContractsUI','v1.19" maps/becak-e-bike/place.rbxlx
          grep -q "BecakMissionUIPhoneIntegrated','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakStoryUIIntegrated','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakDailyContractCount',3" maps/becak-e-bike/place.rbxlx
          grep -q "BecakDailyContractsPersistent','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakChargingStationCount',#stations" maps/becak-e-bike/place.rbxlx
          grep -q "BecakEmergencyCharging','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakChargingPricePerUnit',PRICE_PER_UNIT" maps/becak-e-bike/place.rbxlx
          grep -q "BecakTrafficPlayerYield','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakTrafficVehicleYield','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakTrafficHeadway','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakTrafficBrakeLights','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakTrafficIntersectionPacing','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakTrafficAdaptiveTick','ON" maps/becak-e-bike/place.rbxlx
          grep -q 'BecakTrafficVehicleCount' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakPedestrianCount' maps/becak-e-bike/place.rbxlx
          grep -q 'ACC_BecakDriverNavigation' maps/becak-e-bike/place.rbxlx
          grep -q 'ACC_BecakWorldQC' maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakRoadAccess','v1.9" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakSidewalkCollision','OFF" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakMobileSafeArea','v1.8-left" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakUILocation','LEFT" maps/becak-e-bike/place.rbxlx
          grep -q 'BecakVersion","1.22.0' maps/becak-e-bike/place.rbxlx
          echo 'Final Becak E-Bike v1.22 validation PASS'

      - name: Reset publish evidence
        shell: bash
        run: |
          rm -f deploy-status/becak-e-bike-direct.json
          mkdir -p deploy-status

      - name: Publish Becak E-Bike to Roblox
        id: publish
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: node scripts/publish-becak-direct.js

      - name: Persist final Becak E-Bike publish result
        if: always()
        shell: bash
        run: |
          if [ ! -s deploy-status/becak-e-bike-direct.json ]; then
            mkdir -p deploy-status
            printf '{"ok":false,"httpStatus":"NO_RESULT","universeId":"10745325613","placeId":"80994730522893","at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy-status/becak-e-bike-direct.json
          fi
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/becak-e-bike-direct.json maps/becak-e-bike/place.rbxlx
          if ! git diff --cached --quiet; then
            git commit -m "Record Becak E-Bike v1.22 publish [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce publish success
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('deploy-status/becak-e-bike-direct.json','utf8'));
          if(!r.ok || String(r.universeId)!=='10745325613' || String(r.placeId)!=='80994730522893') {
            console.error('BECAK E-BIKE final publish did not succeed:',r);
            process.exit(1);
          }
          const ageMs=Date.now()-Date.parse(r.at);
          if(!Number.isFinite(ageMs) || ageMs<0 || ageMs>20*60*1000) {
            console.error('BECAK E-BIKE publish evidence is stale:',r.at);
            process.exit(1);
          }
          console.log('BECAK E-BIKE FINAL PUBLISH VERIFIED:',r.payload);
          NODE
