name: Publish Becak E-Bike

on:
  push:
    branches: [main]
    paths:
      - 'maps/becak-e-bike/**'
      - 'maps/registry.json'
      - 'scripts/patch-becak-v3-place.js'
      - 'scripts/publish-becak-direct.js'
      - '.github/workflows/becak-ebike-publish.yml'
  workflow_dispatch:

concurrency:
  group: becak-ebike-live-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate dedicated Becak target
        run: |
          node - <<'NODE'
          const r=require('./maps/registry.json');
          const t=r.maps['becak-e-bike'];
          if(!t) throw new Error('Missing becak-e-bike registry target');
          if(String(t.universeId)!=='10745325613') throw new Error('Wrong Universe ID');
          if(String(t.placeId)!=='80994730522893') throw new Error('Wrong Place ID');
          if(!t.enabled) throw new Error('Becak target disabled');
          console.log('BECAK TARGET LOCK PASS');
          NODE

      - name: Patch proven live place with Nusakarya V3
        run: node scripts/patch-becak-v3-place.js

      - name: Validate V3 generated place
        shell: bash
        run: |
          set -euo pipefail
          test -s maps/becak-e-bike/place.rbxlx
          test "$(wc -c < maps/becak-e-bike/place.rbxlx)" -gt 100000
          grep -q 'BecakEBike_Runtime' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_Client' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_DriverPhone' maps/becak-e-bike/place.rbxlx
          grep -q 'ACC_BecakWorldV3' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakWorldV3VisualAuthority' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakWorldV3LegacyVisibleShells' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_VehicleRealism' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_VehicleGeometryRealism' maps/becak-e-bike/place.rbxlx
          echo 'BECAK V3 PLACE VALIDATION PASS'

      - name: Reset publish evidence
        run: |
          mkdir -p deploy-status
          rm -f deploy-status/becak-e-bike-direct.json

      - name: Publish Becak E-Bike V3 to Roblox
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: node scripts/publish-becak-direct.js

      - name: Verify fresh Roblox receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='deploy-status/becak-e-bike-direct.json';
          if(!fs.existsSync(p)) throw new Error('Missing publish receipt');
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!r.ok || Number(r.httpStatus)!==200) throw new Error('Publish receipt not successful: '+JSON.stringify(r));
          if(String(r.universeId)!=='10745325613' || String(r.placeId)!=='80994730522893') throw new Error('Receipt target mismatch');
          const age=Date.now()-Date.parse(r.at);
          if(!Number.isFinite(age) || age<0 || age>20*60*1000) throw new Error('Receipt stale: '+r.at);
          console.log('BECAK V3 ROBLOX RECEIPT PASS',r.payload);
          NODE

      - name: Persist V3 place and receipt
        run: |
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add maps/becak-e-bike/place.rbxlx deploy-status/becak-e-bike-direct.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Becak E-Bike Nusakarya V3 publish [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
