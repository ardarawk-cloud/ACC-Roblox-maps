name: Publish Becak E-Bike

on:
  push:
    branches: [main]
    paths:
      - 'maps/becak-e-bike/**'
      - 'maps/registry.json'
      - 'scripts/build-becak-ebike.js'
      - 'scripts/publish-becak-direct.js'
      - '.github/workflows/becak-ebike-publish.yml'
  workflow_dispatch:

concurrency:
  group: becak-ebike-live-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate target lock
        shell: bash
        run: |
          node - <<'NODE'
          const r=require('./maps/registry.json');
          const t=r.maps['becak-e-bike'];
          if(!t) throw new Error('Missing becak-e-bike registry target');
          if(String(t.universeId)!=='10745325613') throw new Error('Wrong Universe ID');
          if(String(t.placeId)!=='80994730522893') throw new Error('Wrong Place ID');
          if(!t.enabled) throw new Error('BECAK E-BIKE target is disabled');
          console.log('Target lock PASS');
          NODE

      - name: Build final masterplan place
        run: node scripts/build-becak-ebike.js

      - name: Validate final generated place
        shell: bash
        run: |
          set -euo pipefail
          test -s maps/becak-e-bike/place.rbxlx

          # Isolation + core runtime
          grep -q 'BecakEBike_Runtime' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakEBike_Client' maps/becak-e-bike/place.rbxlx
          grep -q 'EconomyTransaction' maps/becak-e-bike/place.rbxlx
          grep -q 'ACC_BecakRuntime\",\"v1.31' maps/becak-e-bike/place.rbxlx
          grep -q 'ACC_BecakStartupGuard\", \"v1.31' maps/becak-e-bike/place.rbxlx
          grep -q 'ACC_BecakRuntimeOwned\", true' maps/becak-e-bike/place.rbxlx
          grep -q 'Refusing to destroy pre-existing unowned Workspace/BecakEBike root' maps/becak-e-bike/place.rbxlx
          grep -q 'BecakVersion\",\"1.31.0' maps/becak-e-bike/place.rbxlx

          # Gameplay systems
          for marker in \
            BecakEBike_CityDetails \
            BecakEBike_Masterplan \
            BecakEBike_CargoVisual \
            BecakEBike_CityEvents \
            BecakEBike_TrafficNPC \
            BecakEBike_VehicleRecovery \
            BecakEBike_GroundContact \
            BecakEBike_ChargingNetwork \
            BecakEBike_DailyContracts \
            BecakEBike_StoryProgression \
            BecakEBike_ReputationCargo \
            BecakEBike_ReputationPassenger \
            BecakEBike_Achievements \
            BecakEBike_DailyContractsUI \
            BecakEBike_MasterplanClient \
            BecakEBike_DriverPhone \
            BecakEBike_MobileSafeArea \
            BecakEBike_DriverNavigation \
            BecakEBike_WorldQC \
            BecakEBike_RoadAccess; do
              grep -q "$marker" maps/becak-e-bike/place.rbxlx
          done

          # Vehicle safety + ground contact + road access
          grep -q "ACC_BecakVehicleRecovery','v1.35" maps/becak-e-bike/place.rbxlx
          grep -q "BecakSelfRighting','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakMultiProbeCurbAssist','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakReverseCurbAssist','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakFastCurbAssist','ON" maps/becak-e-bike/place.rbxlx
          grep -q 'BecakCurbAssistHoldSeconds' maps/becak-e-bike/place.rbxlx
          grep -q "BecakHillStartAssist','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakHighSpeedStabilityAssist','ON" maps/becak-e-bike/place.rbxlx
          grep -q 'BecakStabilityMinSpeed' maps/becak-e-bike/place.rbxlx
          grep -q 'LastStabilityAssistSpeed' maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakGroundContact','v1.36" maps/becak-e-bike/place.rbxlx
          grep -q "BecakChassisCollision','OFF" maps/becak-e-bike/place.rbxlx
          grep -q "BecakGroundContactPods',#PODS" maps/becak-e-bike/place.rbxlx
          grep -q "BecakGroundContactShape','BALL" maps/becak-e-bike/place.rbxlx
          grep -q 'GroundContactFrontLeft' maps/becak-e-bike/place.rbxlx
          grep -q 'GroundContactFrontRight' maps/becak-e-bike/place.rbxlx
          grep -q 'GroundContactRear' maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakRoadAccess','v1.34" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakSidewalkCollision','OFF" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakGenericCurbCollision','OFF" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakRoadEdgeAudit','ON" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakRoadEdgeAncestorAudit','ON" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakRoadEdgeAliasAudit','ON" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakRoadEdgeCachedAudit','ON" maps/becak-e-bike/place.rbxlx
          grep -q 'BecakRoadEdgeRegistrySize' maps/becak-e-bike/place.rbxlx
          grep -q "BecakRoadEdgeAuditHz',2" maps/becak-e-bike/place.rbxlx

          # Mobile UX lock: phone remains on left safe area
          grep -q "ACC_BecakMobileSafeArea','v1.8-left" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakMobileSafeAreaAdaptive','v1.29" maps/becak-e-bike/place.rbxlx
          grep -q "BecakMobileCoreGuiAware','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakPhoneLeftPin','ON" maps/becak-e-bike/place.rbxlx
          grep -q "ACC_BecakUILocation','LEFT" maps/becak-e-bike/place.rbxlx

          # Progression/economy safeguards
          grep -q 'BecakPassengerFareTelemetry' maps/becak-e-bike/place.rbxlx
          grep -q "BecakLegacyTrafficDisabled','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakTrafficAdaptiveTick','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakEmergencyCharging','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakDailyContractsPersistent','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakAchievementsPersistent','ON" maps/becak-e-bike/place.rbxlx
          grep -q "BecakAchievementRewardGuard','PERSIST_BEFORE_PAYOUT" maps/becak-e-bike/place.rbxlx

          echo 'Final Becak E-Bike v1.31 + VehicleRecovery v1.35 + GroundContact v1.36 + RoadAccess v1.34 validation PASS'

      - name: Reset publish evidence
        shell: bash
        run: |
          rm -f deploy-status/becak-e-bike-direct.json
          mkdir -p deploy-status

      - name: Publish Becak E-Bike to Roblox
        id: publish
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: node scripts/publish-becak-direct.js

      - name: Persist final Becak E-Bike publish result
        if: always()
        shell: bash
        run: |
          if [ ! -s deploy-status/becak-e-bike-direct.json ]; then
            mkdir -p deploy-status
            printf '{"ok":false,"httpStatus":"NO_RESULT","universeId":"10745325613","placeId":"80994730522893","at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy-status/becak-e-bike-direct.json
          fi
          git config user.name "ACC Roblox Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status/becak-e-bike-direct.json maps/becak-e-bike/place.rbxlx
          if ! git diff --cached --quiet; then
            git commit -m "Record Becak E-Bike v1.31 recovery v1.35 ground-contact v1.36 road-access v1.34 publish [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce publish success
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('deploy-status/becak-e-bike-direct.json','utf8'));
          if(!r.ok || String(r.universeId)!=='10745325613' || String(r.placeId)!=='80994730522893') {
            console.error('BECAK E-BIKE final publish did not succeed:',r);
            process.exit(1);
          }
          const ageMs=Date.now()-Date.parse(r.at);
          if(!Number.isFinite(ageMs) || ageMs<0 || ageMs>20*60*1000) {
            console.error('BECAK E-BIKE publish evidence is stale:',r.at);
            process.exit(1);
          }
          console.log('BECAK E-BIKE FINAL PUBLISH VERIFIED:',r.payload);
          NODE