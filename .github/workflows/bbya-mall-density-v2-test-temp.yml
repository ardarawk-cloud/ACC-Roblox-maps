name: BBYA Mall Density V2 Test

on:
  push:
    branches: [feat/bbya-mall-retail-density-v2-main]
    paths:
      - '.github/workflows/bbya-mall-density-v2-test-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Fetch exact source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'mall-v2-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'mall-v2-source'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/$env:GITHUB_SHA" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $repo=Get-ChildItem $dir -Directory | Select-Object -First 1
          Get-ChildItem $repo.FullName -Force | ForEach-Object { Copy-Item $_.FullName $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "EXACT_SOURCE=$env:GITHUB_SHA"

      - name: Static Mall lock QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/137-mall-retail-density-v2.server.lua'
          $s=Get-Content $p -Raw
          foreach($m in @('MALL_RETAIL_DENSITY_V2','MallRetailDensityAuthority','MallRetailPopUpKiosks','MallPremiumGalleryV6')){if(-not $s.Contains($m)){throw "Missing $m"}}
          foreach($x in @('GetService("Lighting")','GetService("InsertService")','SoundId','.Volume =')){if($s.Contains($x)){throw "Forbidden $x"}}
          $project=Get-Content 'maps/bbya-social-hub/default.project.json' -Raw
          if(-not $project.Contains('137-mall-retail-density-v2.server.lua')){throw 'Project mapping missing'}
          Write-Host 'BBYA_MALL_DENSITY_V2_STATIC_QC_PASS'

      - name: Build canonical candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0';New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){$z=Join-Path $env:RUNNER_TEMP 'rojo.zip';Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z;Expand-Archive $z -DestinationPath $toolDir -Force}
          if((& $rojo --version) -notmatch '7\.7\.0'){throw 'Rojo 7.7.0 required'}
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mall-density-v2.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Build failed'}
          $bytes=(Get-Item $out).Length;$sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "PLACE_FILE=$out" | Out-File $env:GITHUB_ENV -Append
          "BUILD_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Append
          "BUILD_SHA=$sha" | Out-File $env:GITHUB_ENV -Append
          Write-Host "BBYA_MALL_DENSITY_V2_BUILD_PASS bytes=$bytes sha256=$sha source=$env:GITHUB_SHA"

      - name: Publish test place only
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'MASTER_V2 missing'}
          $url='https://apis.roblox.com/universes/v1/10762005984/places/124607344716828/versions?versionType=Published'
          $resp=& curl.exe --silent --show-error --fail-with-body --http1.1 --ipv4 --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --header 'Content-Type: application/octet-stream' --header 'Expect:' --data-binary "@$env:PLACE_FILE" $url
          if($LASTEXITCODE -ne 0){throw 'Test publish failed'}
          $r=$resp | ConvertFrom-Json
          if(-not $r.versionNumber){throw 'versionNumber missing'}
          $receipt=Join-Path $env:RUNNER_TEMP 'bbya-mall-density-v2-test.json'
          [ordered]@{status='PUBLISHED';sourceCommit=$env:GITHUB_SHA;universeId='10762005984';placeId='124607344716828';versionNumber=$r.versionNumber;buildBytes=[int64]$env:BUILD_BYTES;buildSha256=$env:BUILD_SHA} | ConvertTo-Json | Set-Content $receipt
          "RECEIPT=$receipt" | Out-File $env:GITHUB_ENV -Append
          Write-Host "BBYA_MALL_DENSITY_V2_TEST_PUBLISHED version=$($r.versionNumber) source=$env:GITHUB_SHA"

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: bbya-mall-density-v2-test-proof
          path: |
            ${{ env.PLACE_FILE }}
            ${{ env.RECEIPT }}
          if-no-files-found: error
          retention-days: 7
