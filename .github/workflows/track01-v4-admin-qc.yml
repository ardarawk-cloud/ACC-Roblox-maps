name: QC TRACK 01 v4.2.1 Audio Balance Phase Hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/track-01/**'
      - 'scripts/build-track01.js'
      - 'scripts/build-track01-v42.js'
      - '.github/workflows/track01-v4-admin-qc.yml'
  workflow_dispatch:

concurrency:
  group: track01-v421-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate target and v4.2.1 source lock
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=require('./maps/track-01/track01.config.json');
          if(String(c.universeId)!=='10745349805') throw new Error('Wrong Universe ID');
          if(String(c.placeId)!=='79748872921213') throw new Error('Wrong Place ID');
          if(String(c.version)!=='4.2.1') throw new Error('Wrong TRACK 01 version');
          if(!c.enabled) throw new Error('TRACK 01 target disabled');
          const src=fs.readFileSync('maps/track-01/music-runtime.server.lua','utf8');
          const rows=[...src.matchAll(/\{id="(\d+)",source="(PROGRESSIVE|UNDERGROUND|FUNKOT|ROOFTOP)"\}/g)];
          if(rows.length!==62) throw new Error(`Music catalog must contain exactly 62 permissioned BBYA tracks, got ${rows.length}`);
          if(new Set(rows.map(x=>x[1])).size!==62) throw new Error('Duplicate music asset ID');
          const skate=['1837057495','1841242625','9040318014','9043707741','9042632936','1840009708','101433831748471','73111765506214'];
          const unmanageable=['117476404561871','139454814636865','94631926635772','103410156771684','97696234195316'];
          for(const id of [...skate,...unmanageable]) if(src.includes(`id="${id}"`)) throw new Error(`Excluded asset leaked into TRACK 01: ${id}`);
          if(src.includes('Z_OFFSETS')) throw new Error('Legacy three-emitter-per-car layout still present');
          if(src.includes('Emitter_%02d')) throw new Error('Legacy numbered emitters still present');
          if(!src.includes('p.Name="EmitterCenter"')) throw new Error('Centered emitter missing');
          if(!src.includes('assert(#decks.A==4 and #decks.B==4')) throw new Error('Single-emitter-per-car deck lock missing');
          if(!src.includes('ROLLOFF_MIN=18') || !src.includes('ROLLOFF_MAX=26')) throw new Error('Balanced rolloff lock missing');
          console.log('TRACK 01 v4.2.1 source/catalog/audio topology lock PASS');
          NODE

      - name: Build canonical TRACK 01 v4.2.1 place
        run: node scripts/build-track01-v42.js

      - name: Validate retained feature-complete runtime
        shell: bash
        run: |
          set -euo pipefail
          place='maps/track-01/place.rbxlx'
          test -s "$place"
          test "$(wc -c < "$place")" -gt 220000
          grep -q 'TRACK01_NightVisibilityHotfix' "$place"
          grep -q 'ACC_TRACK01_NIGHT_VISIBILITY_READY' "$place"
          grep -q 'TRACK01_FinalQC' "$place"
          grep -q 'ACC_TRACK01_FEATURE_COMPLETE' "$place"
          grep -q 'TRACK01_TicketAccessVestibule' "$place"
          grep -q 'TRACK01_SocialInteractions' "$place"
          grep -q 'TRACK01_EndOfLineHero' "$place"
          grep -q 'Car01BlinkArrowMount' "$place"
          echo 'TRACK 01 retained-runtime QC PASS'

      - name: Validate compact mobile operator panel
        shell: bash
        run: |
          set -euo pipefail
          place='maps/track-01/place.rbxlx'
          grep -q 'TRACK01_AdminPanelServer' "$place"
          grep -q 'TRACK01_AdminPanelClient' "$place"
          grep -q 'TRACK01_AdminPAClient' "$place"
          grep -q 'ACC_TRACK01_ADMIN_PANEL_READY' "$place"
          grep -q 'DeviceSafeInsets' "$place"
          grep -q 'ClipToDeviceSafeArea' "$place"
          grep -q 'ScrollingFrame' "$place"
          grep -Eqi 'NO KICK BUTTON|No kick button' "$place"
          grep -qi 'ridhoomaukamu' "$place"
          echo 'TRACK 01 compact operator panel QC PASS'

      - name: Validate v4.2.1 phase-safe AutoDJ automix
        shell: bash
        run: |
          set -euo pipefail
          place='maps/track-01/place.rbxlx'
          grep -q 'TRACK01_MusicAutoDJ' "$place"
          grep -q 'ACC_TRACK01_MUSIC_READY' "$place"
          grep -q 'TRACK01_MUSIC_AUTO' "$place"
          grep -q 'TRACK01_MUSIC_AUTOMIX' "$place"
          grep -q 'TRACK01_MUSIC_SPATIAL_CARS_ONLY' "$place"
          grep -q 'TRACK01_MUSIC_SKATEPARK_EXCLUDED' "$place"
          grep -q 'TRACK01_MUSIC_TRACK_COUNT' "$place"
          grep -q 'TRACK01_MUSIC_EMITTERS_PER_CAR' "$place"
          grep -q 'TRACK01_MUSIC_PHASE_SAFE' "$place"
          grep -q 'TRACK01_MUSIC_ROLLOFF_MIN' "$place"
          grep -q 'TRACK01_MUSIC_ROLLOFF_MAX' "$place"
          grep -q '62-track permissioned pool' "$place"
          grep -q 'CROSSFADE=7' "$place"
          grep -q 'EmitterCenter' "$place"
          grep -q 'ROLLOFF_MIN=18' "$place"
          grep -q 'ROLLOFF_MAX=26' "$place"
          grep -q 'CAR_01' "$place"
          grep -q 'CAR_02' "$place"
          grep -q 'CAR_03' "$place"
          grep -q 'CAR_04' "$place"
          grep -q 'phase-safe single centered emitter per car' "$place"
          grep -q 'random 24/7' "$place"
          grep -q 'Skatepark excluded' "$place"
          grep -q 'MUSIC_PLAY' "$place"
          grep -q 'MUSIC_PAUSE' "$place"
          grep -q 'MUSIC_RESTART' "$place"
          grep -q 'MUSIC_VOLUME' "$place"
          if grep -q 'Z_OFFSETS' "$place"; then echo 'Legacy Z_OFFSETS emitter fan-out leaked into place' >&2; exit 1; fi
          if grep -q 'Emitter_%02d' "$place"; then echo 'Legacy numbered emitter fan-out leaked into place' >&2; exit 1; fi
          for id in 1837057495 1841242625 9040318014 9043707741 9042632936 1840009708 101433831748471 73111765506214 117476404561871 139454814636865 94631926635772 103410156771684 97696234195316; do
            if grep -q "id=\"$id\"" "$place"; then echo "Excluded asset leak: $id" >&2; exit 1; fi
          done
          echo 'TRACK 01 v4.2.1 phase-safe single-emitter AutoDJ QC PASS'

      - name: Validate coordinated event operations
        shell: bash
        run: |
          set -euo pipefail
          place='maps/track-01/place.rbxlx'
          grep -q 'EVENT_PRESET' "$place"
          grep -q 'OPS_RESET' "$place"
          grep -q 'NORMAL NIGHT' "$place"
          grep -q 'BOARDING HOLD' "$place"
          grep -q 'END OF LINE' "$place"
          grep -q 'LAST TRAIN' "$place"
          grep -q 'CLOSING' "$place"
          grep -q 'operatorName' "$place"
          echo 'TRACK 01 event operations retained PASS'

      - name: Confirm build-only workflow
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ev '^[[:space:]]*if grep ' .github/workflows/track01-v4-admin-qc.yml | grep -Eq 'ROBLOX_API_KEY|ROCKET_RACOON_PUBLISH|ROBLOX_OPEN_CLOUD_MASTER_V2|publish-track01'; then
            echo 'QC workflow must remain build-only and contain no publisher references.' >&2
            exit 1
          fi
          echo 'Build-only isolation PASS'
