name: Publish Hangar Exclusive Club v6 Visual Rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hangar-exclusive-club-publish.yml'
  workflow_dispatch:

concurrency:
  group: hangar-exclusive-club-live-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  HANGAR_UNIVERSE_ID: '10745364913'
  HANGAR_PLACE_ID: '76001567401911'
  HANGAR_MODE: 'V6_VISUAL_RESCUE_FULL_MESH_OR_XL_FALLBACK'

jobs:
  build-publish-verify:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Hard gate Hangar v6 visual rescue
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $mesh=Get-Content 'maps/hangar-exclusive-club/full-mesh.server.lua' -Raw
          foreach($marker in @('FULL MESH authority v2.0','local WIDTH = 360','local DEPTH = 280','local WALL_H = 88','local CROWN_H = 126','HangarFullMeshReady','AIRCRAFT_HANGAR_XL','CreateEditableMesh','CreateMeshPartAsync')){
            if($mesh -notmatch [regex]::Escape($marker)){throw "Missing Full Mesh marker: $marker"}
          }
          $rescue=Get-Content 'maps/hangar-exclusive-club/visual-rescue.server.lua' -Raw
          foreach($marker in @('VISUAL RESCUE v1.0','Lighting.Brightness = 3.2','Lighting.ExposureCompensation = 0.72','XL_STRUCTURAL_FALLBACK_MESH_API_BLOCKED','HangarRuntimeVisualMode','HangarFloor_XL','MainStage_XL','Jet_A_XL_Fallback','Jet_B_XL_Fallback')){
            if($rescue -notmatch [regex]::Escape($marker)){throw "Missing rescue marker: $marker"}
          }
          $project=Get-Content 'maps/hangar-exclusive-club/default.project.json' -Raw
          if($project -notmatch 'full-mesh.server.lua' -or $project -notmatch 'visual-rescue.server.lua'){throw 'Hangar authorities are not both mounted'}
          Write-Host 'HANGAR_V6_VISUAL_RESCUE_SOURCE_GATE_PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $d=Join-Path $env:RUNNER_TEMP 'hangar-v6-rojo';$z=Join-Path $env:RUNNER_TEMP 'hangar-v6-rojo.zip'
            if(Test-Path $d){Remove-Item $d -Recurse -Force};New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive -Path $z -DestinationPath $d -Force
            $e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1;if(-not $e){throw 'rojo.exe missing'};$rojo=$e.FullName
          }
          & $rojo --version;if($LASTEXITCODE -ne 0){throw 'Rojo failed'}
          "ROJO_EXE=$rojo"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Hangar place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'hangar-exclusive-club-v6.rbxlx'
          & $env:ROJO_EXE build 'maps/hangar-exclusive-club/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not(Test-Path $place) -or (Get-Item $place).Length -lt 20000){throw 'Invalid Hangar RBXLX'}
          $hash=(Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          "HANGAR_PLACE_FILE=$place"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_BYTES=$((Get-Item $place).Length)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_SHA256=$hash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_V6_BUILD_PASS bytes=$((Get-Item $place).Length) sha256=$hash"

      - name: Publish to Roblox
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'ROBLOX_OPEN_CLOUD_MASTER_V2 secret missing'}
          $url="https://apis.roblox.com/universes/v1/$env:HANGAR_UNIVERSE_ID/places/$env:HANGAR_PLACE_ID/versions?versionType=Published"
          $headers=@{'x-api-key'=$env:ROBLOX_API_KEY}
          $resp=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers $headers -ContentType 'application/xml' -InFile $env:HANGAR_PLACE_FILE
          if([int]$resp.StatusCode -lt 200 -or [int]$resp.StatusCode -ge 300){throw "Roblox publish HTTP $($resp.StatusCode)"}
          $payload=$resp.Content|ConvertFrom-Json
          $version=[int]$payload.versionNumber
          if($version -le 5){throw "Expected Roblox version >5, got $version"}
          "HANGAR_ROBLOX_VERSION=$version"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_V6_PUBLISHED version=$version"

      - name: Persist verified receipt through GitHub API
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=[ordered]@{
            status='LIVE_PUBLISHED'
            ok=$true
            universeId=$env:HANGAR_UNIVERSE_ID
            placeId=$env:HANGAR_PLACE_ID
            sourceCommit=$env:GITHUB_SHA
            mode=$env:HANGAR_MODE
            robloxVersion=[int]$env:HANGAR_ROBLOX_VERSION
            placeBytes=[int64]$env:HANGAR_PLACE_BYTES
            sha256=$env:HANGAR_PLACE_SHA256
            publishRun=[int64]$env:GITHUB_RUN_ID
            publishedAt=(Get-Date).ToUniversalTime().ToString('o')
            previewUrl='https://www.roblox.com/games/76001567401911'
          }
          $text=$receipt|ConvertTo-Json -Depth 5
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"))
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='Hangar-v6-publisher'}
          $path='deploy-status/hangar-exclusive-club.json'
          $enc=(($path.Split('/')|ForEach-Object{[Uri]::EscapeDataString($_)}) -join '/')
          $u="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$enc"
          $sha=$null
          try{$old=Invoke-RestMethod -Headers $h -Uri ($u+'?ref=main');$sha=[string]$old.sha}catch{if([int]$_.Exception.Response.StatusCode -ne 404){throw}}
          $body=@{message="Record Hangar v$env:HANGAR_ROBLOX_VERSION visual rescue live [skip ci]";content=$b64;branch='main'}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $u -Body ($body|ConvertTo-Json -Depth 4)|Out-Null
          Write-Host "HANGAR_V6_RECEIPT_PERSISTED version=$env:HANGAR_ROBLOX_VERSION source=$env:GITHUB_SHA"

      - name: Enforce live publish variables
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([int]$env:HANGAR_ROBLOX_VERSION -le 5){throw 'Hangar version did not increment'}
          if([int64]$env:HANGAR_PLACE_BYTES -lt 20000){throw 'Hangar place bytes invalid'}
          if($env:HANGAR_PLACE_SHA256 -notmatch '^[0-9a-f]{64}$'){throw 'Hangar SHA256 invalid'}
          Write-Host "HANGAR_V6_LIVE_VERIFIED version=$env:HANGAR_ROBLOX_VERSION source=$env:GITHUB_SHA"
