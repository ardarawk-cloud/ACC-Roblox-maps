name: BBYA VIP Playback Restart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-vip-playback-restart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      BBYA_UNIVERSE: '8116636513'
    steps:
      - name: Restart all BBYA servers onto VIP playback hotfix
        shell: bash
        run: |
          set -euo pipefail
          body=/tmp/restart-vip-playback.txt
          http=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            "https://apis.roblox.com/cloud/v2/universes/${BBYA_UNIVERSE}:restartServers" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "restart HTTP $http"
          cat "$body" || true
          test "$http" = '200'
