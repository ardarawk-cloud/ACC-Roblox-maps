name: After School City V0.6 Premium Exterior QC (Archived)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc-v060-archive:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 18
    steps:
      - name: Checkout exact verified V0.6 source
        uses: actions/checkout@v4
        with:
          ref: 39cddd7c9401ca0a80d5c35699fcea9854a7d5f2

      - name: Verify exact archived source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          if($sha -ne '39cddd7c9401ca0a80d5c35699fcea9854a7d5f2'){throw "Wrong archived V0.6 source: $sha"}
          & '.github/scripts/after-school-city-spatial-audit.ps1'
          & '.github/scripts/after-school-city-orientation-audit.ps1'
          & '.github/scripts/after-school-city-visual-fidelity-audit.ps1'
          & '.github/scripts/after-school-city-runtime-reconcile-audit.ps1'
          & '.github/scripts/after-school-city-runtime-hard-cleanup-audit.ps1'
          & '.github/scripts/after-school-city-road-centerline-clearance-audit.ps1'
          & '.github/scripts/after-school-city-premium-exterior-audit.ps1'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojoExe=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0-v060-archive'
            $zip=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0-v060-archive.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse|Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojoExe=$exe.FullName
          }
          $version=& $rojoExe --version
          if(($version -join ' ') -notmatch '7\.7\.0'){throw "Expected Rojo 7.7.0, got $version"}
          "ROJO_EXE=$rojoExe"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build archived V0.6 map
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'after-school-city-v060-archive.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
          $bytes=(Get-Item $place).Length
          $sha=(Get-FileHash -Algorithm SHA256 $place).Hash.ToLowerInvariant()
          Write-Host "ARCHIVED V0.6 BUILD PASS - $bytes bytes - sha256=$sha"
