name: BBYA Audio Safe Batch — gudangpet88

on:
  push:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/.audio-safe-batch-trigger'
      - 'maps/bbya-social-hub/audio-rights-confirmation.json'
  workflow_dispatch:
    inputs:
      permission_mode:
        description: AM_STUDIO_SHARED, TARGET_PROJECT, or CUSTOM
        required: false
        default: AM_STUDIO_SHARED
        type: string
      target_projects:
        description: Comma-separated registry project keys
        required: false
        default: ''
        type: string
      universe_ids:
        description: Explicit registered Universe IDs for CUSTOM
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bbya-audio-safe-batch-gudangpet88
  cancel-in-progress: false

jobs:
  upload_audio_only:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      AUDIO_KEY: ${{ secrets.AMSTUDIO_AUDIO_UPLOADER_01 }}
      AUDIO_KEY_SECRET_NAME: AMSTUDIO_AUDIO_UPLOADER_01
      EXPECTED_AUDIO_USERNAME: gudangpet88
      DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1WdYH8ICus8WHPuVDvX0b4LOa9LbbBSCd
      MAX_MODERATION_WAIT_SECONDS: '14400'
      PERMISSION_MODE: ${{ inputs.permission_mode || 'AM_STUDIO_SHARED' }}
      TARGET_PROJECTS: ${{ inputs.target_projects || '' }}
      CUSTOM_UNIVERSE_IDS: ${{ inputs.universe_ids || '' }}

    steps:
      - name: Checkout canonical audio infrastructure
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require explicit legal-rights confirmation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          folder='1WdYH8ICus8WHPuVDvX0b4LOa9LbbBSCd'
          p=pathlib.Path('maps/bbya-social-hub/audio-rights-confirmation.json')
          if not p.exists(): raise SystemExit('BLOCKED_RIGHTS_UNVERIFIED')
          d=json.loads(p.read_text(encoding='utf-8'))
          if not (d.get('confirmed') is True and d.get('driveFolderId')==folder and d.get('scope')=='ALL_AUDIO_IN_FOLDER'):
              raise SystemExit('BLOCKED_RIGHTS_UNVERIFIED')
          print('Audio rights confirmation verified for exact Drive folder.')
          PY

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python3 -m pip install --quiet 'gdown==6.1.0'

      - name: Unified 1.75x upload and permission contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/am-studio-audio-pipeline.py \
            --drive-folder-url "$DRIVE_FOLDER_URL" \
            --registry config/am-studio-roblox-universes.json \
            --result upload-result.json

      - name: Preserve machine-readable receipt
        if: always() && hashFiles('upload-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gudangpet88-am-studio-audio-${{ github.run_id }}
          path: upload-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce no map mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f upload-result.json ]; then
            jq -e '.mapInjected == false and .mapPublished == false and .bankUpdated == false and .uploadedSpeed == 1.75 and .playbackSpeed == 0.5714285714' upload-result.json >/dev/null
          fi
          git diff --exit-code -- maps/bbya-social-hub || { echo 'MAP_MUTATION_FORBIDDEN'; exit 40; }
