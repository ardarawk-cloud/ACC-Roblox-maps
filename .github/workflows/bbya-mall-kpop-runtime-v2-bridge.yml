name: BBYA Mall KPOP Runtime V2 Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: startsWith(github.event.issue.title, 'BBYA MALL KPOP RUNTIME V2')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbya/mall-kpop-runtime-v2
          fetch-depth: 0

      - name: Patch core Music Suite
        run: python3 scripts/bbya-mall-kpop-runtime-v2-patch.py

      - name: QC
        run: |
          set -euo pipefail
          grep -q 'MALL = {label = "MALL"' maps/bbya-social-hub/103-music-ui-final.client.lua
          grep -q 'BBYAMallMasterSound' maps/bbya-social-hub/103-music-ui-final.client.lua
          grep -q 'BBYAMallPlaylistCatalog' maps/bbya-social-hub/103-music-ui-final.client.lua
          grep -q 'MALL KPOP PLAYLIST AUTHORITY v2' maps/bbya-social-hub/121-funkot-playlist.server.lua
          grep -q 'RANDOM_NO_REPEAT_CYCLE' maps/bbya-social-hub/121-funkot-playlist.server.lua
          grep -q 'ContentProvider:PreloadAsync' maps/bbya-social-hub/121-funkot-playlist.server.lua

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'BBYA Mall KPOP Runtime V2'
          git config user.email 'actions@users.noreply.github.com'
          git add maps/bbya-social-hub/103-music-ui-final.client.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Mall Music Suite native KPOP binding'
          git push origin HEAD:bbya/mall-kpop-runtime-v2

      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = ok ? 'BBYA_MALL_KPOP_RUNTIME_V2_PATCHED | branch=bbya/mall-kpop-runtime-v2 | publish=false' : 'BBYA_MALL_KPOP_RUNTIME_V2_PATCH_FAILED | publish=false';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
