name: BBYA Restart Servers Selfhosted

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-restart-servers-selfhosted.yml'
      - '.github/worker-jobs/bbya-restart-selfhosted-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restart:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      BBYA_UNIVERSE: '8116636513'
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restart BBYA live servers with master Open Cloud key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'Missing ROBLOX_OPEN_CLOUD_MASTER_V2'}
          $uri="https://apis.roblox.com/cloud/v2/universes/$($env:BBYA_UNIVERSE):restartServers"
          $status='RESTART_REQUEST_FAILED';$http='';$response=''
          try {
            $r=Invoke-WebRequest -Method Post -Uri $uri -Headers @{'x-api-key'=$env:ROBLOX_API_KEY} -ContentType 'application/json' -Body '{}'
            $http=[string][int]$r.StatusCode
            $response=[string]$r.Content
            if([int]$r.StatusCode -ge 200 -and [int]$r.StatusCode -lt 300){$status='RESTART_REQUEST_ACCEPTED'}
          } catch {
            if($_.Exception.Response){$http=[string][int]$_.Exception.Response.StatusCode}
            try{$response=$_.ErrorDetails.Message}catch{}
          }
          New-Item -ItemType Directory -Force -Path deploy-status|Out-Null
          [ordered]@{status=$status;http=$http;universeId=$env:BBYA_UNIVERSE;response=$response;recordedAt=(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')} | ConvertTo-Json | Set-Content deploy-status/bbya-restart-servers-selfhosted.json -Encoding UTF8
          Get-Content deploy-status/bbya-restart-servers-selfhosted.json
          git config user.name 'BBYA Selfhosted Restart'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-restart-servers-selfhosted.json
          if(-not (git diff --cached --quiet)){git commit -m 'Record BBYA self-hosted server restart [skip ci]'}
          git pull --rebase origin main
          git push origin HEAD:main
          if($status -ne 'RESTART_REQUEST_ACCEPTED'){throw "Restart failed HTTP=$http response=$response"}
