name: HANGAR v2.1 REALISM SOLID COLLISION LIVE

on:
  push:
    branches: [aeroclub-hangar-rebuild-v1-lab]
    paths:
      - '.github/workflows/hangar-v2-realism-live.yml'
      - 'scripts/hangar-v2-realism-glb.js'
      - 'maps/aeroclub-hangar/default.project.json'
      - 'maps/aeroclub-hangar/server/visual-bootstrap-v2_0.server.lua'
      - 'maps/aeroclub-hangar/server/spawn-safety.server.lua'
      - 'maps/aeroclub-hangar/server/wita-time.server.lua'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hangar-v2-realism-live
  cancel-in-progress: true

env:
  LIVE_UNIVERSE_ID: '10745364913'
  LIVE_PLACE_ID: '76001567401911'
  BRANCH_LOCK: 'aeroclub-hangar-rebuild-v1-lab'
  ASSET_OWNER_USER_ID: '4141352496'

jobs:
  build-upload-publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify HANGAR v2.1 authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF_NAME -ne $env:BRANCH_LOCK){throw "Wrong branch $env:GITHUB_REF_NAME"}
          $project=[IO.File]::ReadAllText('maps/aeroclub-hangar/default.project.json')
          foreach($m in @('HangarEnvironmentRealismV2_0','HangarRealtimeWITAV1_1','visual-bootstrap-v2_0.server.lua')){if($project -notmatch [regex]::Escape($m)){throw "project marker missing $m"}}
          $runtime=[IO.File]::ReadAllText('maps/aeroclub-hangar/server/visual-bootstrap-v2_0.server.lua')
          foreach($m in @('V2_1_ENVIRONMENT_REALISM_SOLID_COLLISION','HANGAR_V20_REALISM_MODEL_ASSET_ID','READY_V2_1_SOLID_COLLISION_OWNER_QC','V2_1_SOLID_COLLISION_GDD_ZONES','SERVICE_EQUIPMENT_HIDDEN')){if($runtime -notmatch [regex]::Escape($m)){throw "runtime marker missing $m"}}
          node --check scripts/hangar-v2-realism-glb.js
          if($LASTEXITCODE -ne 0){throw 'v2 realism generator syntax failed'}
          Write-Host 'HANGAR_V21_AUTHORITY_PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build HANGAR v2 realism GLB
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'hangar-v2-realism.glb'
          node scripts/hangar-v2-realism-glb.js $out
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $out)){throw 'v2 realism GLB generation failed'}
          $bytes=(Get-Item $out).Length
          if($bytes -lt 450000){throw "v2 realism GLB unexpectedly small: $bytes"}
          "HANGAR_GLB=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_GLB_BYTES=$bytes"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_GLB_SHA256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload realism model
        shell: powershell
        env:
          ROBLOX_ASSET_KEY: ${{ secrets.AM_STUDIO }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_ASSET_KEY)){throw 'asset key missing'}
          $request=@{assetType='Model';displayName='HANGAR v2.1 Environment Realism';description='HANGAR realism mesh used with v2.1 solid collision runtime.';creationContext=@{creator=@{userId=[int64]$env:ASSET_OWNER_USER_ID}}}|ConvertTo-Json -Depth 8 -Compress
          $requestFile=Join-Path $env:RUNNER_TEMP 'hangar-v21-request.json'
          [IO.File]::WriteAllText($requestFile,$request,(New-Object Text.UTF8Encoding($false)))
          try{
            $args=@('--silent','--show-error','--location','--request','POST','--header',"x-api-key: $env:ROBLOX_ASSET_KEY",'--form',"request=<$requestFile;type=application/json",'--form',"fileContent=@$env:HANGAR_GLB;type=model/gltf-binary",'https://apis.roblox.com/assets/v1/assets')
            $raw=& curl.exe @args
          }finally{Remove-Item $requestFile -Force -ErrorAction SilentlyContinue}
          if($LASTEXITCODE -ne 0){throw 'asset upload request failed'}
          try{$created=$raw|ConvertFrom-Json}catch{throw "invalid upload response: $raw"}
          if(-not $created.path){throw "upload rejected: $raw"}
          $operationId=([string]$created.path)-replace '^operations/',''
          $assetId=$null;$moderation=$null
          for($i=0;$i -lt 100;$i++){
            Start-Sleep -Seconds 4
            $opRaw=& curl.exe --silent --show-error --location --header "x-api-key: $env:ROBLOX_ASSET_KEY" "https://apis.roblox.com/assets/v1/operations/$operationId"
            if($LASTEXITCODE -ne 0){continue}
            try{$op=$opRaw|ConvertFrom-Json}catch{continue}
            if($op.done){
              if($op.error){throw "asset operation failed: $($op.error|ConvertTo-Json -Compress -Depth 8)"}
              $assetId=[string]$op.response.assetId
              $moderation=[string]$op.response.moderationResult.moderationState
              break
            }
          }
          if($assetId -notmatch '^\d+$'){throw 'no valid realism asset id'}
          "HANGAR_MODEL_ASSET_ID=$assetId"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_MODEL_MODERATION=$moderation"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Grant realism asset to HANGAR universe
        shell: powershell
        env:
          ROBLOX_ASSET_KEY: ${{ secrets.AM_STUDIO }}
          ROBLOX_MASTER_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          $body=@{subjectType='Universe';subjectId=$env:LIVE_UNIVERSE_ID;action='Use';requests=@(@{assetId=[int64]$env:HANGAR_MODEL_ASSET_ID;grantToDependencies=$true})}|ConvertTo-Json -Depth 8 -Compress
          $url='https://apis.roblox.com/asset-permissions-api/v1/assets/permissions'
          $granted=$false
          foreach($key in @($env:ROBLOX_ASSET_KEY,$env:ROBLOX_MASTER_KEY)){
            if([string]::IsNullOrWhiteSpace($key)){continue}
            try{
              $resp=Invoke-RestMethod -Method Patch -Uri $url -Headers @{'x-api-key'=$key} -ContentType 'application/json' -Body $body
              $success=@($resp.successAssetIds|ForEach-Object{[string]$_})
              if($success -contains [string]$env:HANGAR_MODEL_ASSET_ID -and @($resp.errors).Count -eq 0){$granted=$true;break}
            }catch{Write-Warning $_.Exception.Message}
          }
          if(-not $granted){throw 'unable to grant realism asset to live universe'}

      - name: Inject uploaded realism asset into runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='maps/aeroclub-hangar/server/visual-bootstrap-v2_0.server.lua'
          $text=[IO.File]::ReadAllText($path)
          $pattern='local MODEL_ASSET_ID = \d+ -- HANGAR_V20_REALISM_MODEL_ASSET_ID'
          if($text -notmatch $pattern){throw 'asset injection marker missing'}
          $text=[regex]::Replace($text,$pattern,"local MODEL_ASSET_ID = $env:HANGAR_MODEL_ASSET_ID -- HANGAR_V20_REALISM_MODEL_ASSET_ID")
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))

      - name: Prepare Rojo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $d=Join-Path $env:RUNNER_TEMP 'hangar-v21-rojo';$z=Join-Path $env:RUNNER_TEMP 'hangar-v21-rojo.zip'
            if(Test-Path $d){Remove-Item $d -Recurse -Force}
            New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive -Path $z -DestinationPath $d -Force
            $e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1
            if(-not $e){throw 'rojo missing'}
            $rojo=$e.FullName
          }
          "ROJO_EXE=$rojo"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact HANGAR v2.1 place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'hangar-v21-realism.rbxlx'
          & $env:ROJO_EXE build 'maps/aeroclub-hangar/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          $xml=[IO.File]::ReadAllText($place)
          foreach($m in @('HangarEnvironmentRealismV2_0','HangarRealtimeWITAV1_1',$env:HANGAR_MODEL_ASSET_ID,'V2_1_ENVIRONMENT_REALISM_SOLID_COLLISION','READY_V2_1_SOLID_COLLISION_OWNER_QC','V2_1_SOLID_COLLISION_GDD_ZONES')){if($xml -notmatch [regex]::Escape([string]$m)){throw "built place missing $m"}}
          if($xml -match 'VisibleFailsafeV1'){throw 'visible fallback leaked'}
          "HANGAR_PLACE=$place"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_BYTES=$((Get-Item $place).Length)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_PLACE_SHA256=$((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish MAIN HANGAR and restart servers
        shell: powershell
        env:
          ROBLOX_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          $url="https://apis.roblox.com/universes/v1/$env:LIVE_UNIVERSE_ID/places/$env:LIVE_PLACE_ID/versions?versionType=Published"
          $version=$null
          for($i=1;$i -le 6;$i++){
            try{
              $r=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers @{'x-api-key'=$env:ROBLOX_KEY} -ContentType 'application/xml' -InFile $env:HANGAR_PLACE
              $version=[int](($r.Content|ConvertFrom-Json).versionNumber)
              break
            }catch{Write-Warning "publish attempt $i failed: $($_.Exception.Message)";Start-Sleep -Seconds ([math]::Min(30,3*$i))}
          }
          if(-not $version){throw 'HANGAR v2.1 publish failed'}
          "HANGAR_LIVE_VERSION=$version"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $restart="https://apis.roblox.com/cloud/v2/universes/$env:LIVE_UNIVERSE_ID`:restartServers"
          $rr=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $restart -Headers @{'x-api-key'=$env:ROBLOX_KEY} -ContentType 'application/json' -Body '{}'
          if([int]$rr.StatusCode -lt 200 -or [int]$rr.StatusCode -ge 300){throw "restart failed HTTP $($rr.StatusCode)"}

      - name: Save v2.1 receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $obj=[ordered]@{
            status='LIVE_PUBLISHED';ok=$true;project='HANGAR';phase='PHASE_2_ENVIRONMENT_REALISM_REBUILD';
            universeId=$env:LIVE_UNIVERSE_ID;placeId=$env:LIVE_PLACE_ID;sourceCommit=$env:GITHUB_SHA;
            mode='HANGAR_V21_SOLID_COLLISION_REALISM';staticModelAssetId=[int64]$env:HANGAR_MODEL_ASSET_ID;modelModeration=$env:HANGAR_MODEL_MODERATION;
            robloxVersion=[int]$env:HANGAR_LIVE_VERSION;glbBytes=[int64]$env:HANGAR_GLB_BYTES;glbSha256=$env:HANGAR_GLB_SHA256;
            placeBytes=[int64]$env:HANGAR_PLACE_BYTES;placeSha256=$env:HANGAR_PLACE_SHA256;spawn='ACTUAL_FRONT_PLUS_Z_FACE_CENTRAL_JET';
            wita='REALTIME_UTC_PLUS_8';lasers='DISABLED';visibleFallback='NONE';environmentDetail='V2_1_SOLID_COLLISION_GDD_ZONES';
            collision='CARS_JET_BAGGAGE_SHOP_PHOTOBOOTH_DONOR_SOLID';nonGDDClutter='SERVICE_EQUIPMENT_HIDDEN';serversRestarted=$true;visualQC='PENDING_OWNER_SCREENSHOT'
          }
          $text=$obj|ConvertTo-Json -Depth 8
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"))
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='HANGAR-V21'}
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/hangar-live.json";$sha=$null
          try{$old=Invoke-RestMethod -Headers $h -Uri ($url+'?ref='+$env:GITHUB_REF_NAME);$sha=[string]$old.sha}catch{}
          $body=@{message='Record HANGAR v2.1 solid collision LIVE [skip ci]';content=$b64;branch=$env:GITHUB_REF_NAME};if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Headers $h -ContentType 'application/json' -Uri $url -Body ($body|ConvertTo-Json -Depth 5)|Out-Null
