name: AeroClub Hangar v1.2 LIVE

on:
  push:
    branches: [aeroclub-hangar-rebuild-v1-lab]
    paths:
      - '.github/workflows/aeroclub-hangar-v1_2-live.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeroclub-hangar-v1-2-live
  cancel-in-progress: false

env:
  LIVE_UNIVERSE_ID: '10745364913'
  LIVE_PLACE_ID: '76001567401911'
  BRANCH_LOCK: 'aeroclub-hangar-rebuild-v1-lab'
  MODEL_ASSET_ID: '89579886424411'

jobs:
  build-publish-live:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - name: Checkout AeroClub v1.2
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Hard lock main Hangar target
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF_NAME -ne $env:BRANCH_LOCK){throw "Wrong branch: $env:GITHUB_REF_NAME"}
          if($env:LIVE_UNIVERSE_ID -ne '10745364913'){throw 'Wrong LIVE universe'}
          if($env:LIVE_PLACE_ID -ne '76001567401911'){throw 'Wrong LIVE place'}
          if($env:MODEL_ASSET_ID -ne '89579886424411'){throw 'Unexpected model asset'}
          Write-Host "AEROCLUB_LIVE_TARGET_PASS $env:LIVE_UNIVERSE_ID/$env:LIVE_PLACE_ID"

      - name: Static source QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Get-Content 'maps/aeroclub-hangar/default.project.json' -Raw
          if($project -notmatch 'visual-bootstrap-v1_2.server.lua'){throw 'v1.2 bootstrap not mounted'}
          if($project -match 'core.server.lua'){throw 'Core systems must remain isolated for this visual promotion'}
          $runtime=Get-Content 'maps/aeroclub-hangar/server/visual-bootstrap-v1_2.server.lua' -Raw
          foreach($m in @('OUTDOOR_TO_GATE_TO_DANCE_TO_JET','READY_FOR_LAYOUT_SCREENSHOT','AEROCLUB_V12_MODEL_ASSET_ID')){if($runtime -notmatch [regex]::Escape($m)){throw "Missing source marker $m"}}
          Write-Host 'AEROCLUB_LIVE_STATIC_QC_PASS'

      - name: Inject approved v1.2 model asset
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='maps/aeroclub-hangar/server/visual-bootstrap-v1_2.server.lua'
          $text=Get-Content $path -Raw
          $pattern='local MODEL_ASSET_ID = \d+ -- AEROCLUB_V12_MODEL_ASSET_ID'
          if($text -notmatch $pattern){throw 'Asset injection marker missing'}
          $text=[regex]::Replace($text,$pattern,"local MODEL_ASSET_ID = $env:MODEL_ASSET_ID -- AEROCLUB_V12_MODEL_ASSET_ID")
          Set-Content -Path $path -Value $text -Encoding utf8
          Write-Host "AEROCLUB_LIVE_ASSET_INJECT_PASS asset=$env:MODEL_ASSET_ID"

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $d=Join-Path $env:RUNNER_TEMP 'aeroclub-live-rojo';$z=Join-Path $env:RUNNER_TEMP 'aeroclub-live-rojo.zip'
            if(Test-Path $d){Remove-Item $d -Recurse -Force}
            New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive -Path $z -DestinationPath $d -Force
            $e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1
            if(-not $e){throw 'rojo.exe missing'}
            $rojo=$e.FullName
          }
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build main Hangar place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'aeroclub-hangar-v1-2-live.rbxlx'
          & $env:ROJO_EXE build 'maps/aeroclub-hangar/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 8000){throw "Place unexpectedly small: $bytes"}
          $xml=Get-Content $place -Raw
          foreach($m in @('VisualBootstrapV1_2','89579886424411','OUTDOOR_TO_GATE_TO_DANCE_TO_JET')){if($xml -notmatch [regex]::Escape($m)){throw "Built place missing marker $m"}}
          "AEROCLUB_LIVE_PLACE_FILE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "AEROCLUB_LIVE_PLACE_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "AEROCLUB_LIVE_PLACE_SHA256=$((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AEROCLUB_LIVE_BUILD_PASS bytes=$bytes"

      - name: Publish MAIN HANGAR
        shell: powershell
        env:
          ROBLOX_PUBLISH_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_PUBLISH_KEY)){throw 'Publish key missing'}
          $url="https://apis.roblox.com/universes/v1/$env:LIVE_UNIVERSE_ID/places/$env:LIVE_PLACE_ID/versions?versionType=Published"
          $resp=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers @{'x-api-key'=$env:ROBLOX_PUBLISH_KEY} -ContentType 'application/xml' -InFile $env:AEROCLUB_LIVE_PLACE_FILE
          if([int]$resp.StatusCode -lt 200 -or [int]$resp.StatusCode -ge 300){throw "LIVE publish HTTP $($resp.StatusCode)"}
          $version=[int](($resp.Content|ConvertFrom-Json).versionNumber)
          "AEROCLUB_LIVE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AEROCLUB_MAIN_HANGAR_PUBLISHED version=$version"

      - name: Persist LIVE receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=[ordered]@{status='LIVE_PUBLISHED';ok=$true;universeId=$env:LIVE_UNIVERSE_ID;placeId=$env:LIVE_PLACE_ID;sourceCommit=$env:GITHUB_SHA;mode='AEROCLUB_V12_LAYOUT_READABILITY_MAIN_HANGAR';staticModelAssetId=[int64]$env:MODEL_ASSET_ID;robloxVersion=[int]$env:AEROCLUB_LIVE_VERSION;placeBytes=[int64]$env:AEROCLUB_LIVE_PLACE_BYTES;placeSha256=$env:AEROCLUB_LIVE_PLACE_SHA256;publishRun=[int64]$env:GITHUB_RUN_ID;ownerDirective='USE_MAIN_HANGAR_NO_MORE_TEST';visualQC='PENDING_OWNER_IN_GAME'}
          $text=$receipt|ConvertTo-Json -Depth 5;$b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"));$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='AeroClub-Live'};$path='deploy-status/aeroclub-hangar-live.json';$enc=(($path.Split('/')|ForEach-Object{[Uri]::EscapeDataString($_)}) -join '/');$url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$enc";$sha=$null;try{$old=Invoke-RestMethod -Headers $headers -Uri ($url+'?ref='+[Uri]::EscapeDataString($env:GITHUB_REF_NAME));$sha=[string]$old.sha}catch{};$body=@{message='Record AeroClub Hangar LIVE [skip ci]';content=$b64;branch=$env:GITHUB_REF_NAME};if($sha){$body.sha=$sha};Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Uri $url -Body ($body|ConvertTo-Json -Depth 5)|Out-Null
          Write-Host "AEROCLUB_LIVE_RECEIPT_PASS version=$env:AEROCLUB_LIVE_VERSION"
