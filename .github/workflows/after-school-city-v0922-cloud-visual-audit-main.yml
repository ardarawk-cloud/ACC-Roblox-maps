name: After School City V0.9.2.2 Cloud Studio Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-v0922-cloud-visual-audit-main.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: '76362800d3133ffc01ca776ee5efe16f51e3a49a'
      QC_ARTIFACT_ID: '9778112640'
      QC_BYTES: '152275'
      QC_SHA: '7cae13389e82524aae6c2a235327ae80f5b5e03d97e62e3413cd85912063c29f'
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: 76362800d3133ffc01ca776ee5efe16f51e3a49a
          path: candidate

      - name: Verify exact QC artifact
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='ASC-Cloud-Audit'}
          $zip=Join-Path $env:RUNNER_TEMP 'asc-v0922-qc.zip'
          $out=Join-Path $env:RUNNER_TEMP 'asc-v0922-qc'
          if(Test-Path $out){Remove-Item $out -Recurse -Force}
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:QC_ARTIFACT_ID/zip" -MaximumRedirection 10 -OutFile $zip
          Expand-Archive $zip $out -Force
          $p=@(Get-ChildItem $out -Filter '*.rbxl' -File -Recurse)
          if($p.Count -ne 1){throw "Expected one RBXL, got $($p.Count)"}
          $bytes=$p[0].Length
          $hash=(Get-FileHash $p[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($bytes -ne [int64]$env:QC_BYTES){throw "Byte mismatch $bytes"}
          if($hash -ne $env:QC_SHA){throw "SHA mismatch $hash"}
          Write-Host "EXACT_QC_ARTIFACT_OK source=$env:SOURCE_COMMIT artifact=$env:QC_ARTIFACT_ID bytes=$bytes sha=$hash"

      - name: Open ASC v39 in cloud Studio and start Play
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class StudioWin {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd,int nCmdShow);
          }
          "@
          $before=@(Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue|Select-Object -ExpandProperty Id)
          $roots=@((Join-Path $env:LOCALAPPDATA 'Roblox\Versions'),'C:\Program Files\Roblox\Versions','C:\Program Files (x86)\Roblox\Versions')
          $exe=$null
          foreach($r in $roots){
            if(-not (Test-Path $r)){continue}
            $c=Get-ChildItem $r -Filter RobloxStudioBeta.exe -File -Recurse -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 1
            if($c){$exe=$c.FullName;break}
          }
          if(-not $exe){throw 'RobloxStudioBeta.exe not found'}
          Start-Process -FilePath $exe -ArgumentList '--task','EditPlace','--placeId','121603385909425','--universeId','10745359869'|Out-Null
          $deadline=(Get-Date).AddSeconds(65)
          $proc=$null
          do{
            Start-Sleep -Seconds 2
            $proc=Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue|Where-Object {$before -notcontains $_.Id -and $_.MainWindowHandle -ne 0}|Sort-Object StartTime -Descending|Select-Object -First 1
          }while(-not $proc -and (Get-Date)-lt $deadline)
          if(-not $proc){throw 'ASC Studio window did not appear'}
          "ASC_STUDIO_PID=$($proc.Id)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [StudioWin]::ShowWindow([IntPtr]$proc.MainWindowHandle,9)|Out-Null
          [StudioWin]::SetForegroundWindow([IntPtr]$proc.MainWindowHandle)|Out-Null
          Start-Sleep -Seconds 10
          [System.Windows.Forms.SendKeys]::SendWait('{F5}')
          Start-Sleep -Seconds 12

      - name: Apply exact V0.9.2.2 signage source in Play preview
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $proc=Get-Process -Id ([int]$env:ASC_STUDIO_PID) -ErrorAction Stop
          $code=Get-Content 'candidate/maps/after-school-city/after-school-city.global-signage-readability-v0922.server.lua' -Raw
          $code += "`r`nprint('[ASC_PREVIEW_APPLIED]'..tostring(workspace:GetAttribute('ASC_GlobalSignageReadabilityPass')))"
          $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
          $edit=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'commandBarScriptEditor'))
          $run=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'multiLineRunButtonContainer.commandBarRunButton'))
          if(-not $edit -or -not $run){throw 'Studio command bar controls not found'}
          $edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($code)
          Start-Sleep -Milliseconds 350
          $run.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep -Milliseconds 900
          $buttons=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::Button)))
          foreach($b in $buttons){if($b.Current.Name -match 'Run Anyway|Execute|Continue|Allow|Yes|OK'){try{$b.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke();Start-Sleep -Milliseconds 400}catch{}}}
          Start-Sleep -Seconds 5

      - name: Aim CITY PARK
        shell: powershell
        env:
          ASC_TARGET_TEXT: CITY PARK
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $proc=Get-Process -Id ([int]$env:ASC_STUDIO_PID) -ErrorAction Stop
          $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
          $edit=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'commandBarScriptEditor'))
          $run=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'multiLineRunButtonContainer.commandBarRunButton'))
          $t=$env:ASC_TARGET_TEXT
          $code="local P=game:GetService('Players'):GetPlayers()[1];local r=workspace:FindFirstChild('AfterSchoolCity');local p,g;for _,x in ipairs(r:GetDescendants()) do if x:IsA('SurfaceGui') then for _,y in ipairs(x:GetDescendants()) do if y:IsA('TextLabel') and string.find(string.upper(y.Text or ''),string.upper('$t'),1,true) then local q=x.Adornee or x.Parent;if q and q:IsA('BasePart') then p=q;g=x;break end end end end;if p then break end end;if p and P and P.Character then local h=P.Character:FindFirstChild('HumanoidRootPart');if h then local n=p.CFrame:VectorToWorldSpace(Vector3.new(0,0,-1));h.CFrame=CFrame.lookAt(p.Position+n*20+Vector3.new(0,-1.5,0),p.Position) end end;print('[ASC_AIM] $t '..tostring(p~=nil))"
          $edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($code);Start-Sleep -Milliseconds 250;$run.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke();Start-Sleep -Seconds 3

      - name: Capture CITY PARK
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp=New-Object System.Drawing.Bitmap($b.Width,$b.Height);$g=[System.Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size);$bmp.Save((Join-Path $env:GITHUB_WORKSPACE 'asc-city-park.png'));$g.Dispose();$bmp.Dispose()

      - name: Aim SCHOOL
        shell: powershell
        env:
          ASC_TARGET_TEXT: AFTER SCHOOL ACADEMY
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $proc=Get-Process -Id ([int]$env:ASC_STUDIO_PID) -ErrorAction Stop;$root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle);$edit=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'commandBarScriptEditor'));$run=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'multiLineRunButtonContainer.commandBarRunButton'));$t=$env:ASC_TARGET_TEXT;$code="local P=game:GetService('Players'):GetPlayers()[1];local r=workspace:FindFirstChild('AfterSchoolCity');local p;for _,x in ipairs(r:GetDescendants()) do if x:IsA('SurfaceGui') then for _,y in ipairs(x:GetDescendants()) do if y:IsA('TextLabel') and string.find(string.upper(y.Text or ''),string.upper('$t'),1,true) then local q=x.Adornee or x.Parent;if q and q:IsA('BasePart') then p=q;break end end end end;if p then break end end;if p and P and P.Character then local h=P.Character:FindFirstChild('HumanoidRootPart');if h then local n=p.CFrame:VectorToWorldSpace(Vector3.new(0,0,-1));h.CFrame=CFrame.lookAt(p.Position+n*22+Vector3.new(0,-3,0),p.Position) end end";$edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($code);Start-Sleep -Milliseconds 250;$run.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke();Start-Sleep -Seconds 3

      - name: Capture SCHOOL
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms;Add-Type -AssemblyName System.Drawing;$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds;$bmp=New-Object System.Drawing.Bitmap($b.Width,$b.Height);$g=[System.Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size);$bmp.Save((Join-Path $env:GITHUB_WORKSPACE 'asc-school.png'));$g.Dispose();$bmp.Dispose()

      - name: Aim CANTEEN
        shell: powershell
        env:
          ASC_TARGET_TEXT: STUDENT CANTEEN
        run: |
          Add-Type -AssemblyName UIAutomationClient;Add-Type -AssemblyName UIAutomationTypes;$proc=Get-Process -Id ([int]$env:ASC_STUDIO_PID) -ErrorAction Stop;$root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle);$edit=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'commandBarScriptEditor'));$run=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'multiLineRunButtonContainer.commandBarRunButton'));$t=$env:ASC_TARGET_TEXT;$code="local P=game:GetService('Players'):GetPlayers()[1];local r=workspace:FindFirstChild('AfterSchoolCity');local p;for _,x in ipairs(r:GetDescendants()) do if x:IsA('SurfaceGui') then for _,y in ipairs(x:GetDescendants()) do if y:IsA('TextLabel') and string.find(string.upper(y.Text or ''),string.upper('$t'),1,true) then local q=x.Adornee or x.Parent;if q and q:IsA('BasePart') then p=q;break end end end end;if p then break end end;if p and P and P.Character then local h=P.Character:FindFirstChild('HumanoidRootPart');if h then local n=p.CFrame:VectorToWorldSpace(Vector3.new(0,0,-1));h.CFrame=CFrame.lookAt(p.Position+n*20+Vector3.new(0,-2,0),p.Position) end end";$edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($code);Start-Sleep -Milliseconds 250;$run.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke();Start-Sleep -Seconds 3

      - name: Capture CANTEEN
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms;Add-Type -AssemblyName System.Drawing;$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds;$bmp=New-Object System.Drawing.Bitmap($b.Width,$b.Height);$g=[System.Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size);$bmp.Save((Join-Path $env:GITHUB_WORKSPACE 'asc-canteen.png'));$g.Dispose();$bmp.Dispose()

      - name: Aim SKATE
        shell: powershell
        env:
          ASC_TARGET_TEXT: SKATE
        run: |
          Add-Type -AssemblyName UIAutomationClient;Add-Type -AssemblyName UIAutomationTypes;$proc=Get-Process -Id ([int]$env:ASC_STUDIO_PID) -ErrorAction Stop;$root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle);$edit=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'commandBarScriptEditor'));$run=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'multiLineRunButtonContainer.commandBarRunButton'));$t=$env:ASC_TARGET_TEXT;$code="local P=game:GetService('Players'):GetPlayers()[1];local r=workspace:FindFirstChild('AfterSchoolCity');local p;for _,x in ipairs(r:GetDescendants()) do if x:IsA('SurfaceGui') then for _,y in ipairs(x:GetDescendants()) do if y:IsA('TextLabel') and string.find(string.upper(y.Text or ''),string.upper('$t'),1,true) then local q=x.Adornee or x.Parent;if q and q:IsA('BasePart') then p=q;break end end end end;if p then break end end;if p and P and P.Character then local h=P.Character:FindFirstChild('HumanoidRootPart');if h then local n=p.CFrame:VectorToWorldSpace(Vector3.new(0,0,-1));h.CFrame=CFrame.lookAt(p.Position+n*22+Vector3.new(0,-2,0),p.Position) end end";$edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($code);Start-Sleep -Milliseconds 250;$run.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke();Start-Sleep -Seconds 3

      - name: Capture SKATE
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms;Add-Type -AssemblyName System.Drawing;$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds;$bmp=New-Object System.Drawing.Bitmap($b.Width,$b.Height);$g=[System.Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size);$bmp.Save((Join-Path $env:GITHUB_WORKSPACE 'asc-skate.png'));$g.Dispose();$bmp.Dispose()

      - name: Upload real Studio captures
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v0922-cloud-visual-${{ env.SOURCE_COMMIT }}
          path: |
            asc-city-park.png
            asc-school.png
            asc-canteen.png
            asc-skate.png
          if-no-files-found: error
          retention-days: 7

      - name: Stop ASC Studio preview
        if: always()
        shell: powershell
        run: |
          if($env:ASC_STUDIO_PID){try{Stop-Process -Id ([int]$env:ASC_STUDIO_PID) -Force -ErrorAction SilentlyContinue}catch{}}
