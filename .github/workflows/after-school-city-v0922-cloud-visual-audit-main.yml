name: After School City V0.9.2.2 Exact Artifact Cloud Visual Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-v0922-cloud-visual-audit-main.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify exact V0.9.2.2 QC artifact
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $artifactId='9778112640'
          $expectedBytes=152275
          $expectedSha='7cae13389e82524aae6c2a235327ae80f5b5e03d97e62e3413cd85912063c29f'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='ASC-Cloud-Audit'}
          $zip=Join-Path $env:RUNNER_TEMP 'asc-v0922-qc.zip'
          $out=Join-Path $env:RUNNER_TEMP 'asc-v0922-qc'
          if(Test-Path $out){Remove-Item $out -Recurse -Force}
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip" -MaximumRedirection 10 -OutFile $zip
          Expand-Archive $zip $out -Force
          $places=@(Get-ChildItem $out -Filter '*.rbxl' -File -Recurse)
          if($places.Count -ne 1){throw "Expected one RBXL, got $($places.Count)"}
          $p=$places[0]
          $bytes=$p.Length
          $hash=(Get-FileHash $p.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($bytes -ne $expectedBytes){throw "RBXL byte mismatch $bytes"}
          if($hash -ne $expectedSha){throw "RBXL SHA mismatch $hash"}
          "ASC_PLACE=$($p.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXACT_QC_ARTIFACT_OK id=$artifactId bytes=$bytes sha=$hash"

      - name: Open exact RBXL in cloud Studio and capture representative signs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class ASCWin {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd,int nCmdShow);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd,out RECT rect);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          }
          "@

          $roots=@((Join-Path $env:LOCALAPPDATA 'Roblox\Versions'),'C:\Program Files\Roblox\Versions','C:\Program Files (x86)\Roblox\Versions')
          $exe=$null
          foreach($r in $roots){
            if(-not (Test-Path $r)){continue}
            $c=Get-ChildItem $r -Filter RobloxStudioBeta.exe -File -Recurse -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 1
            if($c){$exe=$c.FullName;break}
          }
          if(-not $exe){throw 'RobloxStudioBeta.exe not found on cloud worker'}
          Start-Process -FilePath $exe -ArgumentList @("`"$env:ASC_PLACE`"")
          Start-Sleep -Seconds 20
          $proc=Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue|Where-Object {$_.MainWindowHandle -ne 0}|Sort-Object StartTime -Descending|Select-Object -First 1
          if(-not $proc){throw 'Roblox Studio window unavailable'}
          $hwnd=[IntPtr]$proc.MainWindowHandle
          [ASCWin]::ShowWindow($hwnd,9)|Out-Null
          [ASCWin]::SetForegroundWindow($hwnd)|Out-Null
          Start-Sleep -Seconds 2
          [System.Windows.Forms.SendKeys]::SendWait('+{F5}')
          Start-Sleep -Seconds 2
          [ASCWin]::SetForegroundWindow($hwnd)|Out-Null
          [System.Windows.Forms.SendKeys]::SendWait('{F5}')
          Start-Sleep -Seconds 12

          $rootUI=[System.Windows.Automation.AutomationElement]::FromHandle($hwnd)
          $editCondition=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'commandBarScriptEditor')
          $runCondition=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'multiLineRunButtonContainer.commandBarRunButton')
          $edit=$rootUI.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$editCondition)
          $run=$rootUI.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$runCondition)
          if(-not $edit -or -not $run){throw 'Studio command bar controls not found'}
          $vp=$edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
          $ip=$run.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)

          function Aim-Sign([string]$needle){
            $lua=@"
          print('[ASC_JOB_BEGIN:cloud-sign]')
          local Players=game:GetService('Players')
          local root=workspace:FindFirstChild('AfterSchoolCity')
          local plate=nil
          local sg=nil
          if root then
            for _,g in ipairs(root:GetDescendants()) do
              if g:IsA('SurfaceGui') then
                for _,o in ipairs(g:GetDescendants()) do
                  if o:IsA('TextLabel') and string.find(string.upper(o.Text or ''),string.upper('$needle'),1,true) then
                    local p=g.Adornee or g.Parent
                    if p and p:IsA('BasePart') then plate=p;sg=g;break end
                  end
                end
              end
              if plate then break end
            end
          end
          print('TARGET=$needle|ROOT='..tostring(root~=nil)..'|FOUND='..tostring(plate~=nil)..'|PART='..tostring(plate and plate:GetFullName() or 'nil'))
          local plr=Players:GetPlayers()[1]
          if plate and plr and plr.Character then
            local hrp=plr.Character:FindFirstChild('HumanoidRootPart')
            if hrp then
              local normals={[Enum.NormalId.Front]=Vector3.new(0,0,-1),[Enum.NormalId.Back]=Vector3.new(0,0,1),[Enum.NormalId.Right]=Vector3.new(1,0,0),[Enum.NormalId.Left]=Vector3.new(-1,0,0),[Enum.NormalId.Top]=Vector3.new(0,1,0),[Enum.NormalId.Bottom]=Vector3.new(0,-1,0)}
              local n=plate.CFrame:VectorToWorldSpace(normals[sg.Face] or Vector3.new(0,0,-1)).Unit
              local pos=plate.Position+n*20+Vector3.new(0,-1.5,0)
              hrp.CFrame=CFrame.lookAt(pos,plate.Position)
              print('TELEPORTED=true')
            end
          end
          print('[ASC_JOB_END:cloud-sign]')
          "@
            $vp.SetValue($lua)
            Start-Sleep -Milliseconds 300
            $ip.Invoke()
            Start-Sleep -Milliseconds 850
            $buttons=$rootUI.FindAll([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::Button)))
            foreach($b in $buttons){if($b.Current.Name -match 'Run Anyway|Run|Execute|Continue|Allow|Yes|OK'){try{$bp=$b.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern);$bp.Invoke();Start-Sleep -Milliseconds 300}catch{}}}
            Start-Sleep -Seconds 3
          }

          function Capture-Sign([string]$key){
            $r=New-Object ASCWin+RECT
            [ASCWin]::GetWindowRect($hwnd,[ref]$r)|Out-Null
            $w=$r.Right-$r.Left;$h=$r.Bottom-$r.Top
            if($w -lt 300 -or $h -lt 200){throw "Invalid Studio window size $w x $h"}
            $bmp=New-Object System.Drawing.Bitmap($w,$h)
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.Left,$r.Top,0,0,(New-Object System.Drawing.Size($w,$h)))
            $tw=1100;$th=[int]($h*$tw/$w)
            $small=New-Object System.Drawing.Bitmap($tw,$th)
            $g2=[System.Drawing.Graphics]::FromImage($small)
            $g2.DrawImage($bmp,0,0,$tw,$th)
            $jpg=Join-Path $env:GITHUB_WORKSPACE "asc-v0922-cloud-$key.jpg"
            $codec=[System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders()|Where-Object {$_.MimeType -eq 'image/jpeg'}|Select-Object -First 1
            $ep=New-Object System.Drawing.Imaging.EncoderParameters(1)
            $ep.Param[0]=New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality,[long]72)
            $small.Save($jpg,$codec,$ep)
            $g.Dispose();$g2.Dispose();$bmp.Dispose();$small.Dispose()
            return $jpg
          }

          $captures=@{}
          foreach($t in @(
            @{Key='city-park';Text='CITY PARK'},
            @{Key='school';Text='AFTER SCHOOL ACADEMY'},
            @{Key='canteen';Text='STUDENT CANTEEN'},
            @{Key='skate';Text='SKATE'}
          )){
            [ASCWin]::SetForegroundWindow($hwnd)|Out-Null
            Aim-Sign $t.Text
            $captures[$t.Key]=Capture-Sign $t.Key
          }

          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='ASC-Cloud-Audit'}
          function Put-RepoFile($path,$bytes,$message){
            $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path"
            $sha=$null
            try{$sha=(Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
            $body=@{message=$message;content=[Convert]::ToBase64String($bytes);branch='main'}
            if($sha){$body.sha=$sha}
            Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body|ConvertTo-Json) -ContentType 'application/json'|Out-Null
          }
          foreach($key in $captures.Keys){Put-RepoFile "deploy-status/asc-v0922-cloud-$key.jpg" ([IO.File]::ReadAllBytes($captures[$key])) "Record ASC V0.9.2.2 cloud $key [skip ci]"}
          $status=@{status='CLOUD_STUDIO_CAPTURED';sourceCommit='76362800d3133ffc01ca776ee5efe16f51e3a49a';qcArtifactId=9778112640;rbxlBytes=152275;rbxlSha256='7cae13389e82524aae6c2a235327ae80f5b5e03d97e62e3413cd85912063c29f';capturedAt=(Get-Date -Format o);targets=@('CITY PARK','AFTER SCHOOL ACADEMY','STUDENT CANTEEN','SKATE')}|ConvertTo-Json -Depth 4
          Put-RepoFile 'deploy-status/asc-v0922-cloud-visual.json' ([Text.Encoding]::UTF8.GetBytes($status)) 'Record ASC V0.9.2.2 cloud visual status [skip ci]'

          [ASCWin]::SetForegroundWindow($hwnd)|Out-Null
          [System.Windows.Forms.SendKeys]::SendWait('+{F5}')
          Start-Sleep -Seconds 2
