name: After School City V0.9.2.2 Cloud Harness Visual Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-v0922-cloud-visual-audit-main.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_CANDIDATE: '76362800d3133ffc01ca776ee5efe16f51e3a49a'
      HARNESS_ARTIFACT_ID: '9787052484'
      HARNESS_BYTES: '154219'
      HARNESS_SHA: '726dd614e2263fa566bb3337e9af1a4f9d918c8f900a7d9a8fd3206217592f35'
    steps:
      - name: Download and verify non-publish cloud harness
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='ASC-Cloud-Harness-Audit'}
          $zip=Join-Path $env:RUNNER_TEMP 'asc-v0922-harness.zip'
          $out=Join-Path $env:RUNNER_TEMP 'asc-v0922-harness'
          if(Test-Path $out){Remove-Item $out -Recurse -Force}
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:HARNESS_ARTIFACT_ID/zip" -MaximumRedirection 10 -OutFile $zip
          Expand-Archive $zip $out -Force
          $places=@(Get-ChildItem $out -Filter '*.rbxl' -File -Recurse)
          if($places.Count -ne 1){throw "Expected one harness RBXL, got $($places.Count)"}
          $place=$places[0]
          $bytes=$place.Length
          $hash=(Get-FileHash $place.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($bytes -ne [int64]$env:HARNESS_BYTES){throw "Harness byte mismatch expected=$env:HARNESS_BYTES actual=$bytes"}
          if($hash -ne $env:HARNESS_SHA){throw "Harness SHA mismatch expected=$env:HARNESS_SHA actual=$hash"}
          "ASC_HARNESS_PLACE=$($place.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HARNESS_VERIFIED=true publishable=false base=$env:BASE_CANDIDATE artifact=$env:HARNESS_ARTIFACT_ID bytes=$bytes sha=$hash"

      - name: Open harness in real Roblox Studio and start Play
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class ASCCloudWin {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd,int nCmdShow);
          }
          "@
          $before=@(Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue|Select-Object -ExpandProperty Id)
          $roots=@((Join-Path $env:LOCALAPPDATA 'Roblox\Versions'),'C:\Program Files\Roblox\Versions','C:\Program Files (x86)\Roblox\Versions')
          $exe=$null
          foreach($r in $roots){
            if(-not (Test-Path $r)){continue}
            $candidate=Get-ChildItem $r -Filter RobloxStudioBeta.exe -File -Recurse -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 1
            if($candidate){$exe=$candidate.FullName;break}
          }
          if(-not $exe){throw 'RobloxStudioBeta.exe not found on cloud worker'}
          Start-Process -FilePath $exe -ArgumentList @("`"$env:ASC_HARNESS_PLACE`"")|Out-Null
          $deadline=(Get-Date).AddSeconds(60)
          $proc=$null
          do{
            Start-Sleep -Seconds 2
            $proc=Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue|Where-Object {$before -notcontains $_.Id -and $_.MainWindowHandle -ne 0}|Sort-Object StartTime -Descending|Select-Object -First 1
          }while(-not $proc -and (Get-Date)-lt $deadline)
          if(-not $proc){throw 'Harness Studio window did not appear'}
          "ASC_STUDIO_PID=$($proc.Id)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [ASCCloudWin]::ShowWindow([IntPtr]$proc.MainWindowHandle,9)|Out-Null
          [ASCCloudWin]::SetForegroundWindow([IntPtr]$proc.MainWindowHandle)|Out-Null
          Start-Sleep -Seconds 8
          [System.Windows.Forms.SendKeys]::SendWait('{F5}')
          Start-Sleep -Seconds 24
          Write-Host "REAL_STUDIO_PLAY_STARTED=true pid=$($proc.Id)"

      - name: Capture cycling signage views from real Studio
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class ASCCloudFocus {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd,int nCmdShow);
          }
          "@
          $proc=Get-Process -Id ([int]$env:ASC_STUDIO_PID) -ErrorAction Stop
          [ASCCloudFocus]::ShowWindow([IntPtr]$proc.MainWindowHandle,9)|Out-Null
          $captureDir=Join-Path $env:GITHUB_WORKSPACE 'asc-cloud-frames'
          New-Item -ItemType Directory -Path $captureDir -Force|Out-Null
          for($i=1;$i -le 10;$i++){
            [ASCCloudFocus]::SetForegroundWindow([IntPtr]$proc.MainWindowHandle)|Out-Null
            Start-Sleep -Milliseconds 500
            $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object System.Drawing.Bitmap($bounds.Width,$bounds.Height)
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
            $path=Join-Path $captureDir ('frame-{0:D2}.png' -f $i)
            $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose();$bmp.Dispose()
            Write-Host "CAPTURED=$path"
            Start-Sleep -Seconds 4
          }
          "ASC_CAPTURE_DIR=$captureDir"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Collect harness and signage runtime markers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $markers=New-Object System.Collections.Generic.List[string]
          $logs=Get-ChildItem 'C:\Users\Administrator\AppData\Local\Roblox\logs' -File -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 12
          foreach($log in $logs){
            foreach($line in (Get-Content $log.FullName -ErrorAction SilentlyContinue)){
              if($line -match 'ASC CLOUD HARNESS|V0\.9\.2\.2 global signage readability|ASC_GlobalSignageReadabilityPass'){
                $markers.Add($line)
              }
            }
            if($markers.Count -ge 4){break}
          }
          $logPath=Join-Path $env:GITHUB_WORKSPACE 'asc-cloud-runtime-markers.txt'
          $markers|Set-Content $logPath -Encoding utf8
          $markers|ForEach-Object {Write-Host $_}
          if($markers.Count -eq 0){Write-Warning 'No runtime markers found; screenshots remain valid visual evidence from harness Play session'}

      - name: Upload real Studio cloud evidence
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v0922-real-studio-cloud-${{ env.BASE_CANDIDATE }}
          path: |
            asc-cloud-frames/*.png
            asc-cloud-runtime-markers.txt
          if-no-files-found: error
          retention-days: 7

      - name: Close harness Studio
        if: always()
        shell: powershell
        run: |
          if($env:ASC_STUDIO_PID){try{Stop-Process -Id ([int]$env:ASC_STUDIO_PID) -Force -ErrorAction SilentlyContinue}catch{}}
