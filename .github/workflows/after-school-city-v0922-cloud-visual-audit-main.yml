name: After School City V0.9.2.2 Exact Artifact Cloud Visual Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-v0922-cloud-visual-audit-main.yml'
      - '.github/worker-jobs/after-school-city-v0922-cloud-visual-audit.ps1'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Run exact ASC cloud visual audit
        shell: powershell
        run: .github/worker-jobs/after-school-city-v0922-cloud-visual-audit.ps1
