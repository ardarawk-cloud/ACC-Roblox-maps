name: BBYA Mall Bottom Compact Publish Temp

on:
  push:
    branches:
      - 'feat/bbya-mall-catalog-v8-reference-rebuild'
    paths:
      - '.github/workflows/bbya-mall-bottom-compact-publish-temp.yml'

permissions:
  contents: read

env:
  TARGET_SOURCE: ${{ github.sha }}

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Fetch exact source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'mall-compact-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'mall-compact-source'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/$env:TARGET_SOURCE" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $repo=Get-ChildItem $dir -Directory | Select-Object -First 1
          if(-not $repo){throw 'Exact source missing'}
          Get-ChildItem $repo.FullName -Force | ForEach-Object { Copy-Item $_.FullName $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "EXACT_SOURCE=$env:TARGET_SOURCE"

      - name: Static Mall compact QC
        shell: powershell
        run: |
          $a=Get-Content 'maps/bbya-social-hub/133-mall-robux-commerce.client.lua' -Raw
          foreach($m in @('MALL CATALOG UI v8','CatalogLauncher','CATEGORIES','STORES','PRODUCTS','Keranjang Belanja','BBYAMallCatalogFocusMode','action.Visible=root.Visible and products.Visible','compactBottom=(UserInputService.TouchEnabled and vp.X>vp.Y) and 92 or 50')){
            if(-not $a.Contains($m)){throw "Missing Mall compact marker: $m"}
          }
          foreach($bad in @('GetService("Lighting")','SoundId','.Volume =')){
            if($a.Contains($bad)){throw "Forbidden Mall UI marker: $bad"}
          }
          $v=Get-Content 'maps/bbya-social-hub/136-mall-cinema-lift-v12.server.lua' -Raw
          foreach($m in @('MALL VERTICAL SPACING 20 + CINEMA v16','local LEVELS={1,21,41,61}','FloorSpacingStuds",20','VerticalAuthority","V16_20_STUD')){
            if(-not $v.Contains($m)){throw "Missing vertical marker: $m"}
          }
          $g=Get-Content 'maps/bbya-social-hub/97-mall-safe-security-override.server.lua' -Raw
          foreach($m in @('FloorSpacing20DecorAligned','MallDecor20StudAligned','19.35,39.35,59.35,79.35')){
            if(-not $g.Contains($m)){throw "Missing decor marker: $m"}
          }
          Write-Host 'BBYA_MALL_COMPACT_STATIC_QC_PASS bottomReserveLandscape=92 oldReserve=50 raise=42'

      - name: Enable third party sales in test build only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/default.project.json'
          $obj=(Get-Content $p -Raw | ConvertFrom-Json)
          if(-not ($obj.tree.Workspace.PSObject.Properties.Name -contains '$properties')){
            $obj.tree.Workspace | Add-Member -NotePropertyName '$properties' -NotePropertyValue ([pscustomobject]@{})
          }
          $props=$obj.tree.Workspace.'$properties'
          if($props.PSObject.Properties.Name -contains 'AllowThirdPartySales'){$props.AllowThirdPartySales=$true}else{$props | Add-Member -NotePropertyName 'AllowThirdPartySales' -NotePropertyValue $true}
          $json=$obj | ConvertTo-Json -Depth 100
          [System.IO.File]::WriteAllText((Resolve-Path $p),$json,(New-Object System.Text.UTF8Encoding($false)))
          Write-Host 'BBYA_TEST_THIRD_PARTY_SALES_ENABLED'

      - name: Build and publish compact Mall test
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $z=Join-Path $env:RUNNER_TEMP 'rojo.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive $z -DestinationPath $toolDir -Force
          }
          $version=& $rojo --version
          if($version -notmatch '7\.7\.0'){throw 'Rojo 7.7.0 required'}
          $out=Join-Path $env:RUNNER_TEMP 'bbya-mall-bottom-compact-test.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Build failed'}
          $bytes=(Get-Item $out).Length
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $url='https://apis.roblox.com/universes/v1/10762005984/places/124607344716828/versions?versionType=Published'
          $resp=& curl.exe --silent --show-error --fail-with-body --http1.1 --ipv4 --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --header 'Content-Type: application/octet-stream' --header 'Expect:' --data-binary "@$out" $url
          if($LASTEXITCODE -ne 0){throw 'Publish failed'}
          $r=$resp|ConvertFrom-Json
          if(-not $r.versionNumber){throw 'versionNumber missing'}
          Write-Host "BBYA_MALL_COMPACT_TEST_PUBLISHED version=$($r.versionNumber) bytes=$bytes sha256=$sha source=$env:TARGET_SOURCE universe=10762005984 place=124607344716828"
