name: After School City Publish V0.9.0 Personal Music Player

on:
  push:
    branches: [main]
    paths: ['.github/workflows/after-school-city-publish-v090-personal-music-player.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 16f9eb7823f2dfd0d5f41683b5a2d04707e72198
      BASE_LIVE_SHA: f2584421b92426fca12930aa8559a0e3ce4a5106
      QC_RUN_ID: '33422008577'
      QC_ARTIFACT_ID: '9769271192'
      QC_ARTIFACT_NAME: after-school-city-v090-qc-16f9eb7823f2dfd0d5f41683b5a2d04707e72198
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      EXPECTED_BYTES: '139780'
      EXPECTED_SHA256: 0b4e15eec6997e065b52628a7e83e8a15d3b9011345e2405cf975e19dae85f88
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact QC run and artifact authority
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROBLOX_OPEN_CLOUD_MASTER_V2 is unavailable'; exit 9; }
          api='https://api.github.com/repos/ardarawk-cloud/ACC-Roblox-maps'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$QC_RUN_ID" -o "$RUNNER_TEMP/qc-run.json"
          [[ "$(jq -r '.status' "$RUNNER_TEMP/qc-run.json")" == 'completed' ]] || { echo 'QC run is not completed'; exit 10; }
          [[ "$(jq -r '.conclusion' "$RUNNER_TEMP/qc-run.json")" == 'success' ]] || { echo 'QC run is not SUCCESS'; exit 11; }
          [[ "$(jq -r '.head_sha' "$RUNNER_TEMP/qc-run.json")" == "$SOURCE_SHA" ]] || { echo 'QC source SHA mismatch'; exit 12; }
          [[ "$(jq -r '.path' "$RUNNER_TEMP/qc-run.json")" == '.github/workflows/after-school-city-v090-personal-music-player-qc.yml' ]] || { echo 'Unexpected QC workflow'; exit 13; }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$QC_RUN_ID/artifacts" -o "$RUNNER_TEMP/qc-artifacts.json"
          count=$(jq --argjson id "$QC_ARTIFACT_ID" --arg n "$QC_ARTIFACT_NAME" '[.artifacts[] | select(.id == $id and .name == $n and .expired == false and .workflow_run.head_sha == env.SOURCE_SHA)] | length' "$RUNNER_TEMP/qc-artifacts.json")
          [[ "$count" == '1' ]] || { cat "$RUNNER_TEMP/qc-artifacts.json"; echo 'Exact QC artifact authority not found'; exit 14; }
          echo "QC AUTHORITY PASS run=$QC_RUN_ID artifact=$QC_ARTIFACT_ID source=$SOURCE_SHA"

      - name: Checkout exact V0.9.0 source for lock verification
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 16f9eb7823f2dfd0d5f41683b5a2d04707e72198
          path: asc-source
          fetch-depth: 0

      - name: Verify exact source and narrow V0.9.0 delta
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 20; }
          git -C asc-source cat-file -e "${BASE_LIVE_SHA}^{commit}"
          mapfile -t files < <(git -C asc-source diff --name-only "$BASE_LIVE_SHA" "$SOURCE_SHA")
          [[ ${#files[@]} -eq 4 ]] || { printf '%s\n' "${files[@]}"; echo "Unexpected delta count ${#files[@]}"; exit 21; }
          expected=(
            '.github/workflows/after-school-city-v090-personal-music-player-qc.yml'
            'maps/after-school-city/after-school-city.music-config.lua'
            'maps/after-school-city/after-school-city.music-player.client.lua'
            'maps/after-school-city/default.project.json'
          )
          for f in "${expected[@]}"; do printf '%s\n' "${files[@]}" | grep -Fxq "$f" || { echo "Missing expected delta $f"; exit 22; }; done
          grep -Fq 'PUTU AZYA PUTRI' asc-source/maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'BINTANG HARDAJAYA' asc-source/maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'Personal Music Player v0.9.0' asc-source/maps/after-school-city/after-school-city.music-player.client.lua
          grep -Fq 'Players.LocalPlayer' asc-source/maps/after-school-city/after-school-city.music-player.client.lua
          grep -Fq 'ASC_PersonalMusicSound' asc-source/maps/after-school-city/after-school-city.music-player.client.lua
          grep -Fq 'sound.PlaybackSpeed = 1.0' asc-source/maps/after-school-city/after-school-city.music-player.client.lua
          grep -Fq 'Tracks = {}' asc-source/maps/after-school-city/after-school-city.music-config.lua
          grep -Fq 'ASCMusicConfig' asc-source/maps/after-school-city/default.project.json
          grep -Fq 'ASC_PersonalMusicPlayer' asc-source/maps/after-school-city/default.project.json
          echo "SOURCE LOCK PASS source=$actual delta=4-files"

      - name: Download exact QC-locked artifact
        uses: actions/download-artifact@v4
        with:
          name: after-school-city-v090-qc-16f9eb7823f2dfd0d5f41683b5a2d04707e72198
          path: ${{ runner.temp }}/asc-v090-qc
          github-token: ${{ github.token }}
          repository: ardarawk-cloud/ACC-Roblox-maps
          run-id: 33422008577

      - name: Verify QC receipt and exact RBXL bytes/SHA256
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/asc-v090-qc/qc-receipt.txt"
          normalized="$RUNNER_TEMP/asc-v090-qc/qc-receipt-normalized.txt"
          [[ -f "$receipt" ]] || { find "$RUNNER_TEMP/asc-v090-qc" -maxdepth 3 -type f -print; echo 'QC receipt missing'; exit 29; }
          tr -d '\r' < "$receipt" > "$normalized"
          grep -Fxq 'STATUS=QC_PASSED' "$normalized"
          grep -Fxq 'MODE=PERSONAL_MUSIC_PLAYER_V0_9_0' "$normalized"
          grep -Fxq "SOURCE_COMMIT=$SOURCE_SHA" "$normalized"
          grep -Fxq "RBXL_BYTES=$EXPECTED_BYTES" "$normalized"
          grep -Fxq "SHA256=$EXPECTED_SHA256" "$normalized"
          grep -Fxq 'PLAYBACK_SCOPE=LOCAL_PLAYER_ONLY' "$normalized"
          grep -Fxq 'PLAYBACK_SPEED=1.0' "$normalized"
          mapfile -t places < <(find "$RUNNER_TEMP/asc-v090-qc" -type f -name '*.rbxl' -print)
          [[ ${#places[@]} -eq 1 ]] || { find "$RUNNER_TEMP/asc-v090-qc" -maxdepth 3 -type f -print; echo "Expected exactly one RBXL, found ${#places[@]}"; exit 30; }
          place="${places[0]}"
          bytes=$(stat -c%s "$place")
          sha=$(sha256sum "$place" | awk '{print $1}')
          [[ "$bytes" == "$EXPECTED_BYTES" ]] || { echo "Byte mismatch: $bytes expected=$EXPECTED_BYTES"; exit 31; }
          [[ "$sha" == "$EXPECTED_SHA256" ]] || { echo "SHA256 mismatch: $sha expected=$EXPECTED_SHA256"; exit 32; }
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "EXACT QC ARTIFACT PASS bytes=$bytes sha256=$sha"

      - name: Publish V0.9.0 LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/asc-publish-response.json" -w '%{http_code}' -X POST "$url" -H "x-api-key: $ROBLOX_API_KEY" -H 'Content-Type: application/octet-stream' --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/asc-publish-response.json")
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "HTTP $http: $body"; exit 40; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/asc-publish-response.json")
          [[ -n "$version" && "$version" =~ ^[0-9]+$ ]] || { echo "Missing/invalid versionNumber: $body"; exit 41; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist V0.9.0 LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'PERSONAL_MUSIC_PLAYER_V0_9_0' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg baseLiveCommit "$BASE_LIVE_SHA" \
            --arg qcRunId "$QC_RUN_ID" \
            --arg qcArtifactId "$QC_ARTIFACT_ID" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,baseLiveCommit:$baseLiveCommit,qcRunId:$qcRunId,qcArtifactId:($qcArtifactId|tonumber),universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"V0.9.0 exact QC-locked artifact; adds compact local-player-only personal music UI with play/pause, previous/next, seek, volume and normalized 1.0x playback. Playlist is intentionally empty pending exact authorized Roblox audio asset IDs. V0.8.9 environment safety/vegetation, pool, roads, gameplay/economy/persistence/monetization and dedication remain unchanged."}' > deploy-status/after-school-city-publish-personal-music-player-v0-9-0.json
          cat deploy-status/after-school-city-publish-personal-music-player-v0-9-0.json
          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- deploy-status/after-school-city-publish-personal-music-player-v0-9-0.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record After School City V0.9.0 LIVE publish [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
