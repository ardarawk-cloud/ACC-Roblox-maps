name: BBYA Admin NEXT + Editor Hotfix QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/107-admin-next-editor-hotfix.server.lua'
      - 'maps/bbya-social-hub/22-editor.server.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-next-editor-hotfix-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: rojo-cache
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}
      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked
      - name: Build BBYA place
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-next-editor.rbxl
          test -s /tmp/bbya-next-editor.rbxl
      - name: Validate NEXT and hidden editor behavior
        shell: bash
        run: |
          set -euo pipefail
          f='maps/bbya-social-hub/107-admin-next-editor-hotfix.server.lua'
          e='maps/bbya-social-hub/22-editor.server.lua'
          p='maps/bbya-social-hub/default.project.json'
          grep -q 'ADMIN NEXT + EDITOR HOTFIX v2' "$f"
          grep -q 'action~="next"' "$f"
          grep -q 'BBYAMainPublicFallbackV4' "$f"
          grep -q 'BBYAUndergroundBreakbeatFallbackV4' "$f"
          grep -q 'fallback:Stop()' "$f"
          grep -q 'internalMusic:Fire("next",player)' "$f"
          grep -q 'basementMusic:Fire("next",player)' "$f"
          grep -q 'BBYAEditorVisible",false' "$f"
          ! grep -q 'BBYAEditorVisible",true' "$f"
          grep -q 'BBYAEditorVisible",false' "$e"
          grep -q '/bbyaedit' "$e"
          grep -q 'AdminNextEditorHotfixV1' "$p"
          echo 'BBYA NEXT preserved + editor hidden-by-default QC passed.'
