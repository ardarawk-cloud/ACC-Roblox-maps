name: MOUNT BBYA Rebuild v1.1 Candidate

on:
  push:
    branches: [mount-bbya-rebuild-visual-lock-v1]
    paths:
      - 'maps/mount-bbya/mount-bbya.rebuild-v1.1.server.lua'
      - 'maps/mount-bbya/mount-bbya.config.json'
      - 'scripts/build-mount-bbya-rebuild-v11.js'
      - 'scripts/publish-mount-bbya-rebuild-v1.js'
      - '.github/workflows/mount-bbya-rebuild-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mount-bbya-rebuild-v11
  cancel-in-progress: false

jobs:
  build_validate_publish:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout exact rebuild candidate
        uses: actions/checkout@v4
        with:
          ref: mount-bbya-rebuild-visual-lock-v1
          persist-credentials: false

      - name: Runtime and target preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --version
          node --check scripts/build-mount-bbya-rebuild-v11.js
          node --check scripts/publish-mount-bbya-rebuild-v1.js
          $runtime=Get-Content 'maps/mount-bbya/mount-bbya.rebuild-v1.1.server.lua' -Raw
          foreach($required in @(
            'MOUNT_BBYA_REBUILD_V11',
            'visual-lock-rebuild-v1.1',
            'FOUNDATION_CARVE_SUBGRADE_TRAIL',
            'SELAMAT DATANG DI MOUNT BBYA',
            'LEMBAH & SUNGAI',
            'POS 3 / HIGH CAMP',
            'MOUNT BBYA\nPUNCAK',
            'MinimumCheckpointSpacing'
          )){
            if($runtime -notmatch [regex]::Escape($required)){throw "Missing runtime marker: $required"}
          }
          foreach($forbidden in @('ACC_MountainSocial','10744139279','82661754996018','"Trail_%02d".format')){
            if($runtime -match [regex]::Escape($forbidden)){throw "Forbidden runtime marker: $forbidden"}
          }
          $cfg=Get-Content 'maps/mount-bbya/mount-bbya.config.json' -Raw | ConvertFrom-Json
          if($cfg.publishTarget.universeId -ne '4187755690' -or $cfg.publishTarget.placeId -ne '11832985967'){throw 'MOUNT BBYA target mismatch'}
          if($cfg.forbiddenTarget.universeId -ne '10744139279' -or $cfg.forbiddenTarget.placeId -ne '82661754996018'){throw 'Forbidden target lock missing'}
          Write-Host 'MOUNT_BBYA_PREFLIGHT_PASS'

      - name: Build clean RBXLX candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/build-mount-bbya-rebuild-v11.js
          $place='maps/mount-bbya/place.rbxlx'
          if(-not (Test-Path $place)){throw 'MOUNT BBYA place.rbxlx missing'}
          if((Get-Item $place).Length -lt 20000){throw 'MOUNT BBYA place.rbxlx unexpectedly small'}
          $text=Get-Content $place -Raw
          try {[xml]$xml=$text}catch{throw "RBXLX XML parse failed: $($_.Exception.Message)"}
          foreach($required in @('MOUNT_BBYA_V11_Bootstrap','MOUNT_BBYA_V11_World','MOUNT_BBYA_V11_Release','MOUNT_BBYA_V11_QC','visual-lock-rebuild-v1.1')){
            if($text -notmatch [regex]::Escape($required)){throw "Generated RBXLX missing: $required"}
          }
          if($text -match 'ACC_MountainSocial'){throw 'Legacy Mountain Social root leaked into place'}
          $scriptCount=([regex]::Matches($text,'<Item class="Script"')).Count
          if($scriptCount -lt 4){throw "Expected >=4 server scripts; got $scriptCount"}
          Write-Host "MOUNT_BBYA_BUILD_PASS bytes=$((Get-Item $place).Length) scripts=$scriptCount"

      - name: Publish isolated MOUNT BBYA candidate
        id: publish
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $log=Join-Path $env:RUNNER_TEMP 'mount-bbya-v11-publish.log'
          node scripts/publish-mount-bbya-rebuild-v1.js *> $log
          $code=$LASTEXITCODE
          if(Test-Path $log){Get-Content $log}
          "PUBLISH_EXIT_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if($code -ne 0){exit $code}

      - name: Persist rebuild candidate receipt
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'mount-bbya-v11-publish.log'
          $status=if($env:PUBLISH_EXIT_CODE -eq '0'){'PUBLISHED_CANDIDATE'}else{'FAILED'}
          $lines=@(
            "status=$status",
            'build=visual-lock-rebuild-v1.1',
            "sourceCommit=${{ github.sha }}",
            'branch=mount-bbya-rebuild-visual-lock-v1',
            'universeId=4187755690',
            'placeId=11832985967',
            'runtimeVisualQC=PENDING',
            "publishExitCode=$env:PUBLISH_EXIT_CODE"
          )
          if(Test-Path $log){$lines += (Get-Content $log | Select-Object -Last 15 | ForEach-Object {"log=$_"})}
          $raw=($lines -join "`n")+"`n"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/mount-bbya-rebuild-v11.txt"
          $existingSha=$null
          try{$existing=Invoke-RestMethod -Headers $headers -Uri "$api`?ref=mount-bbya-rebuild-visual-lock-v1" -Method Get;$existingSha=$existing.sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $payload=@{message='Record MOUNT BBYA rebuild v1.1 candidate receipt [skip ci]';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($raw));branch='mount-bbya-rebuild-visual-lock-v1'}
          if($existingSha){$payload.sha=$existingSha}
          Invoke-RestMethod -Headers $headers -Uri $api -Method Put -ContentType 'application/json' -Body ($payload|ConvertTo-Json -Depth 5) | Out-Null
          Write-Host "MOUNT_BBYA_RECEIPT_STATUS=$status"

      - name: Enforce candidate publish result
        if: always()
        shell: powershell
        run: |
          if($env:PUBLISH_EXIT_CODE -ne '0'){throw 'MOUNT BBYA candidate publish did not succeed'}
          Write-Host 'MOUNT_BBYA_PUBLISH_CANDIDATE_PASS'
