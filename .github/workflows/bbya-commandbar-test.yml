name: BBYA Pro DJ Rig v1 — ISOLATED TEST PUBLISH
# Git is not installed on this self-hosted runner; checkout exact verified prototype SHA via REST archive.
# Temporary registry is written as UTF-8 without BOM for Node JSON parsing.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-commandbar-test.yml'

permissions:
  contents: read

concurrency:
  group: bbya-pro-dj-rig-isolated-test-publish
  cancel-in-progress: false

env:
  PROTOTYPE_SHA: 'ad79393e387cbb763a08126ff297c5fc6d098351'
  TEST_UNIVERSE_ID: '10762005984'
  TEST_PLACE_ID: '124607344716828'

jobs:
  publish_test:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout exact isolated prototype
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROTOTYPE_SHA }}

      - name: Hard safety guard
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:PROTOTYPE_SHA -ne 'ad79393e387cbb763a08126ff297c5fc6d098351'){throw 'Prototype SHA mismatch'}
          if($env:TEST_UNIVERSE_ID -ne '10762005984'){throw 'Unexpected test universe'}
          if($env:TEST_PLACE_ID -ne '124607344716828'){throw 'Unexpected test place'}
          if($env:TEST_UNIVERSE_ID -eq '8116636513' -or $env:TEST_PLACE_ID -eq '131894120482837'){throw 'LIVE TARGET BLOCKED'}
          Write-Host "TARGET_GUARD_PASS source=$env:PROTOTYPE_SHA universe=$env:TEST_UNIVERSE_ID place=$env:TEST_PLACE_ID"

      - name: Verify visual-only prototype source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $s=Get-Content 'maps/bbya-social-hub/41-mesh-assets.server.lua' -Raw
          foreach($needle in @('BBYA_PRO_DJ_RIG_V1_NATIVE_PROTOTYPE','VisualOnly", true','AudioWrites", false','GlobalLightingWrites", false','2_MEDIA_PLAYERS_PLUS_4CH_MIXER')){
            if($s -notmatch [regex]::Escape($needle)){throw "Missing safety marker: $needle"}
          }
          if($s -match 'forceNeutralVolumes'){throw 'Audio mutation helper forbidden'}
          if($s -match 'SoundGroup\.Volume\s*='){throw 'SoundGroup volume mutation forbidden'}
          if($s -match 'Lighting\.(Brightness|ExposureCompensation|Ambient|OutdoorAmbient|ClockTime)\s*='){throw 'Global Lighting mutation forbidden'}
          Write-Host 'VISUAL_ONLY_FIREWALL_PASS'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-pro-dj-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-pro-dj-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            if(Test-Path $zip){Remove-Item $zip -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          $ver=& $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo check failed'}
          if(($ver -join ' ') -notmatch '7\.7\.0'){throw "Expected Rojo 7.7.0, got $ver"}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ROJO_PASS $ver"

      - name: Build prototype place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-pro-dj-rig-v1-test.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          if(-not (Test-Path $place)){throw 'RBXL missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw "RBXL too small: $bytes"}
          "TEST_PLACE_FILE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BUILD_PASS bytes=$bytes source=$env:PROTOTYPE_SHA"

      - name: Create temporary test registry target in runner only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='maps/registry.json'
          $r=Get-Content $path -Raw | ConvertFrom-Json
          $target=[pscustomobject]@{
            name='BBYA Music UI Test - Pro DJ Rig v1'
            enabled=$true
            universeId=$env:TEST_UNIVERSE_ID
            placeId=$env:TEST_PLACE_ID
            file='maps/bbya-social-hub/place.rbxlx'
          }
          $r.maps | Add-Member -NotePropertyName 'bbya-music-ui-test' -NotePropertyValue $target -Force
          $json=$r | ConvertTo-Json -Depth 10
          $utf8NoBom=New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $path),$json,$utf8NoBom)
          $t=(Get-Content $path -Raw | ConvertFrom-Json).maps.'bbya-music-ui-test'
          if([string]$t.universeId -ne '10762005984' -or [string]$t.placeId -ne '124607344716828'){throw 'Temporary target verification failed'}
          Write-Host 'TEMP_TARGET_PASS'

      - name: Publish ONLY to Music UI test place
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
          PUBLISH_RECEIPT_DIR: deploy-status-pro-dj-test
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'AM_STUDIO secret unavailable'}
          $env:PLACE_FILE_OVERRIDE=$env:TEST_PLACE_FILE
          $env:GITHUB_SHA=$env:PROTOTYPE_SHA
          node scripts/publish-map.js bbya-music-ui-test
          if($LASTEXITCODE -ne 0){throw 'Roblox test publish failed'}

      - name: Verify exact test receipt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='deploy-status-pro-dj-test/bbya-music-ui-test.json'
          if(-not (Test-Path $p)){throw 'Test receipt missing'}
          $r=Get-Content $p -Raw | ConvertFrom-Json
          if($r.status -ne 'PUBLISHED'){throw "Receipt status=$($r.status)"}
          if([string]$r.universeId -ne '10762005984'){throw "Wrong universe: $($r.universeId)"}
          if([string]$r.placeId -ne '124607344716828'){throw "Wrong place: $($r.placeId)"}
          if($r.sourceCommit -ne $env:PROTOTYPE_SHA){throw "Wrong source: $($r.sourceCommit)"}
          if(-not $r.response.versionNumber){throw 'Roblox versionNumber missing'}
          Write-Host "PRO_DJ_TEST_PUBLISHED version=$($r.response.versionNumber) source=$($r.sourceCommit)"
