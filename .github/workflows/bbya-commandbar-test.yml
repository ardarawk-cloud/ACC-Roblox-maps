name: BBYA Studio Command Bar Bridge Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-commandbar-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Execute harmless Studio command
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
using System;
using System.Runtime.InteropServices;
public static class FocusNative {
  [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
}
'@
          $lines=New-Object System.Collections.Generic.List[string]
          $proc=Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $proc){$lines.Add('STUDIO_NOT_FOUND')} else {
            [FocusNative]::SetForegroundWindow([IntPtr]$proc.MainWindowHandle)|Out-Null
            Start-Sleep -Milliseconds 400
            $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
            $cond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'commandBarScriptEditor')
            $edit=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$cond)
            $runCond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'multiLineRunButtonContainer.commandBarRunButton')
            $run=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$runCond)
            $lines.Add("EDIT_FOUND=$([bool]$edit)")
            $lines.Add("RUN_FOUND=$([bool]$run)")
            if($edit){
              try{
                $vp=$edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
                $lines.Add('VALUE_PATTERN=true')
                $vp.SetValue('print("[BBYA_UI_BRIDGE_TEST_20260820]")')
                Start-Sleep -Milliseconds 300
              }catch{$lines.Add("SET_VALUE_ERROR=$($_.Exception.Message)")}
            }
            if($run){
              try{
                $ip=$run.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
                $ip.Invoke()
                $lines.Add('RUN_INVOKED=true')
              }catch{$lines.Add("RUN_ERROR=$($_.Exception.Message)")}
            }
            Start-Sleep -Seconds 2
            $logs=Get-ChildItem 'C:\Users\Administrator\AppData\Local\Roblox\logs' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 8
            foreach($log in $logs){
              $m=Select-String -Path $log.FullName -Pattern 'BBYA_UI_BRIDGE_TEST_20260820' -SimpleMatch -ErrorAction SilentlyContinue | Select-Object -Last 3
              foreach($x in $m){$lines.Add("LOG_MATCH=$($log.Name):$($x.LineNumber):$($x.Line)")}
            }
          }
          $text=($lines-join "`n")+"`n"
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-commandbar-test.txt"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28";"User-Agent"="BBYA-Studio-Worker"}
          $sha=$null
          try{$sha=(Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $body=@{message='Record BBYA command bar test [skip ci]';content=$content;branch='main'}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body|ConvertTo-Json) -ContentType 'application/json'
