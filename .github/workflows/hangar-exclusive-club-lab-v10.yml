name: Hangar Exclusive Club LAB v10 Reference Lock

on:
  push:
    branches: [hangar-exclusive-club/lab-reference-lock-v10]
    paths:
      - '.github/workflows/hangar-exclusive-club-lab-v10.yml'
      - 'scripts/hangar-reference-lock-v10-glb.js'
      - 'maps/hangar-exclusive-club/default.project.json'
      - 'maps/hangar-exclusive-club/lab-reference-lock-v10.server.lua'
      - 'maps/hangar-exclusive-club/club.server.lua'
      - 'maps/hangar-exclusive-club/club.client.lua'
      - 'maps/hangar-exclusive-club/ui-compact.client.lua'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hangar-exclusive-club-lab-v10
  cancel-in-progress: true

env:
  LAB_UNIVERSE_ID: '10762005984'
  LAB_PLACE_ID: '124607344716828'
  LIVE_UNIVERSE_ID: '10745364913'
  LIVE_PLACE_ID: '76001567401911'
  LAB_MODE: 'V10_REFERENCE_LOCK_FULL_MESH_LAB'

jobs:
  build-upload-publish-lab:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout LAB candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Hard block LIVE target
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:LAB_UNIVERSE_ID -eq $env:LIVE_UNIVERSE_ID){throw 'LAB universe equals LIVE universe'}
          if($env:LAB_PLACE_ID -eq $env:LIVE_PLACE_ID){throw 'LAB place equals LIVE place'}
          if($env:GITHUB_REF_NAME -ne 'hangar-exclusive-club/lab-reference-lock-v10'){throw "Wrong branch: $env:GITHUB_REF_NAME"}
          Write-Host "HANGAR_LAB_TARGET_LOCK_PASS universe=$env:LAB_UNIVERSE_ID place=$env:LAB_PLACE_ID"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Static source QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/hangar-reference-lock-v10-glb.js
          if($LASTEXITCODE -ne 0){throw 'v10 GLB generator syntax failed'}
          $runtime=Get-Content 'maps/hangar-exclusive-club/lab-reference-lock-v10.server.lua' -Raw
          foreach($m in @('SUPPLIED_IMAGE_NO_IMPROVISATION','MovingLaserRigV10','HANGAR_LAB_V10_MODEL_ASSET_ID','REFERENCE_FLANKING_STAGE','HangarLabRogueBlocksRemoved','HangarLabRigidNeonRemoved')){
            if($runtime -notmatch [regex]::Escape($m)){throw "Missing runtime marker: $m"}
          }
          $project=Get-Content 'maps/hangar-exclusive-club/default.project.json' -Raw
          if($project -match 'visual-rescue-v7.server.lua'){throw 'LAB must not mount v7 fallback'}
          if($project -match 'static-mesh-v9.server.lua'){throw 'LAB must not mount v9 runtime'}
          if($project -notmatch 'lab-reference-lock-v10.server.lua'){throw 'v10 LAB runtime not mounted'}
          Write-Host 'HANGAR_LAB_V10_STATIC_QC_PASS'

      - name: Build reference-locked v10 GLB
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'hangar-reference-lock-v10.glb'
          node scripts/hangar-reference-lock-v10-glb.js $out
          if($LASTEXITCODE -ne 0){throw 'v10 GLB generation failed'}
          if(-not(Test-Path $out)){throw 'v10 GLB missing'}
          $bytes=(Get-Item $out).Length
          if($bytes -lt 50000){throw "v10 GLB unexpectedly small: $bytes"}
          "HANGAR_LAB_GLB=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_LAB_GLB_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_LAB_GLB_SHA256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_LAB_V10_GLB_PASS bytes=$bytes"

      - name: Resolve Roblox creator for asset upload
        shell: powershell
        env:
          ROBLOX_ASSET_KEY: ${{ secrets.AM_STUDIO }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_ASSET_KEY)){throw 'AM_STUDIO asset key missing'}
          $candidates=@($env:LAB_UNIVERSE_ID,'8116636513','10745349805')
          $resolved=$null
          foreach($u in $candidates){
            try{
              $meta=Invoke-RestMethod -Method Get -Uri "https://games.roblox.com/v1/games?universeIds=$u"
              if(-not $meta.data -or $meta.data.Count -lt 1){continue}
              $creator=$meta.data[0].creator
              $type=[string]$creator.type;$id=[string]$creator.id
              if($id -notmatch '^\d+$' -or [int64]$id -le 0){continue}
              if($type -ieq 'Group'){$field='groupId'}elseif($type -ieq 'User'){$field='userId'}else{continue}
              $resolved=[pscustomobject]@{Id=$id;Field=$field;Type=$type;Universe=$u};break
            }catch{Write-Warning "Creator probe failed universe=$u"}
          }
          if(-not $resolved){throw 'Unable to resolve valid Roblox creator'}
          "HANGAR_CREATOR_ID=$($resolved.Id)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_CREATOR_FIELD=$($resolved.Field)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_LAB_CREATOR_RESOLVED type=$($resolved.Type) id=$($resolved.Id) sourceUniverse=$($resolved.Universe)"

      - name: Upload v10 static Model asset
        shell: powershell
        env:
          ROBLOX_ASSET_KEY: ${{ secrets.AM_STUDIO }}
        run: |
          $ErrorActionPreference='Stop'
          $creator=@{};$creator[$env:HANGAR_CREATOR_FIELD]=[int64]$env:HANGAR_CREATOR_ID
          $request=@{
            assetType='Model'
            displayName='Hangar Exclusive Club LAB - Reference Lock v10'
            description='LAB-only aircraft-scale Hangar reference-lock candidate. No improvisation; moving lasers are runtime Beam objects.'
            creationContext=@{creator=$creator}
          }|ConvertTo-Json -Depth 8 -Compress
          $requestFile=Join-Path $env:RUNNER_TEMP 'hangar-lab-v10-asset-request.json'
          [System.IO.File]::WriteAllText($requestFile,$request,(New-Object System.Text.UTF8Encoding($false)))
          try{
            $args=@('--silent','--show-error','--location','--request','POST','--header',"x-api-key: $env:ROBLOX_ASSET_KEY",'--form',"request=<$requestFile;type=application/json",'--form',"fileContent=@$env:HANGAR_LAB_GLB;type=model/gltf-binary",'https://apis.roblox.com/assets/v1/assets')
            $raw=& curl.exe @args
          }finally{Remove-Item $requestFile -Force -ErrorAction SilentlyContinue}
          if($LASTEXITCODE -ne 0){throw 'Roblox asset upload failed'}
          try{$created=$raw|ConvertFrom-Json}catch{throw "Invalid upload response: $raw"}
          if(-not $created.path){throw "Upload rejected: $raw"}
          $operationId=([string]$created.path)-replace '^operations/',''
          $assetId=$null;$moderation=$null
          for($i=0;$i -lt 90;$i++){
            Start-Sleep -Seconds 4
            $opRaw=& curl.exe --silent --show-error --location --header "x-api-key: $env:ROBLOX_ASSET_KEY" "https://apis.roblox.com/assets/v1/operations/$operationId"
            if($LASTEXITCODE -ne 0){continue}
            try{$op=$opRaw|ConvertFrom-Json}catch{continue}
            if($op.done){
              if($op.error){throw "Asset operation failed: $($op.error|ConvertTo-Json -Compress -Depth 8)"}
              $assetId=[string]$op.response.assetId
              $moderation=[string]$op.response.moderationResult.moderationState
              break
            }
          }
          if($assetId -notmatch '^\d+$' -or [int64]$assetId -le 0){throw 'No valid v10 model asset ID'}
          "HANGAR_LAB_MODEL_ASSET_ID=$assetId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_LAB_MODEL_MODERATION=$moderation" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_LAB_V10_UPLOAD_DONE asset=$assetId moderation=$moderation"

      - name: Inject LAB model asset into build workspace
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='maps/hangar-exclusive-club/lab-reference-lock-v10.server.lua'
          $text=Get-Content $path -Raw
          $pattern='local HANGAR_LAB_MODEL_ASSET_ID = \d+ -- HANGAR_LAB_V10_MODEL_ASSET_ID'
          if($text -notmatch $pattern){throw 'v10 LAB asset marker missing'}
          $text=[regex]::Replace($text,$pattern,"local HANGAR_LAB_MODEL_ASSET_ID = $env:HANGAR_LAB_MODEL_ASSET_ID -- HANGAR_LAB_V10_MODEL_ASSET_ID")
          Set-Content -Path $path -Value $text -Encoding utf8
          Write-Host "HANGAR_LAB_V10_ASSET_INJECT_PASS asset=$env:HANGAR_LAB_MODEL_ASSET_ID"

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $d=Join-Path $env:RUNNER_TEMP 'hangar-lab-v10-rojo';$z=Join-Path $env:RUNNER_TEMP 'hangar-lab-v10-rojo.zip'
            if(Test-Path $d){Remove-Item $d -Recurse -Force};New-Item -ItemType Directory -Path $d -Force|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive -Path $z -DestinationPath $d -Force
            $e=Get-ChildItem $d -Filter rojo.exe -File -Recurse|Select-Object -First 1;if(-not $e){throw 'rojo.exe missing'};$rojo=$e.FullName
          }
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build LAB place
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'hangar-reference-lock-v10-lab.rbxlx'
          & $env:ROJO_EXE build 'maps/hangar-exclusive-club/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo LAB build failed'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 35000){throw "LAB place unexpectedly small: $bytes"}
          "HANGAR_LAB_PLACE_FILE=$place" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_LAB_PLACE_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HANGAR_LAB_PLACE_SHA256=$((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_LAB_V10_BUILD_PASS bytes=$bytes"

      - name: Publish to TEST LAB only
        shell: powershell
        env:
          ROBLOX_PUBLISH_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_PUBLISH_KEY)){throw 'Roblox publish key missing'}
          if($env:LAB_UNIVERSE_ID -eq $env:LIVE_UNIVERSE_ID -or $env:LAB_PLACE_ID -eq $env:LIVE_PLACE_ID){throw 'LIVE publish blocked'}
          $url="https://apis.roblox.com/universes/v1/$env:LAB_UNIVERSE_ID/places/$env:LAB_PLACE_ID/versions?versionType=Published"
          $headers=@{'x-api-key'=$env:ROBLOX_PUBLISH_KEY}
          $resp=Invoke-WebRequest -UseBasicParsing -Method Post -Uri $url -Headers $headers -ContentType 'application/xml' -InFile $env:HANGAR_LAB_PLACE_FILE
          if([int]$resp.StatusCode -lt 200 -or [int]$resp.StatusCode -ge 300){throw "LAB publish HTTP $($resp.StatusCode)"}
          $payload=$resp.Content|ConvertFrom-Json
          $version=[int]$payload.versionNumber
          "HANGAR_LAB_ROBLOX_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HANGAR_LAB_V10_PUBLISHED version=$version universe=$env:LAB_UNIVERSE_ID place=$env:LAB_PLACE_ID"

      - name: Persist LAB receipt on LAB branch
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=[ordered]@{
            status='LAB_PUBLISHED'
            ok=$true
            liveUntouched=$true
            branch=$env:GITHUB_REF_NAME
            sourceCommit=$env:GITHUB_SHA
            universeId=$env:LAB_UNIVERSE_ID
            placeId=$env:LAB_PLACE_ID
            mode=$env:LAB_MODE
            staticModelAssetId=[int64]$env:HANGAR_LAB_MODEL_ASSET_ID
            modelModeration=$env:HANGAR_LAB_MODEL_MODERATION
            robloxVersion=[int]$env:HANGAR_LAB_ROBLOX_VERSION
            glbBytes=[int64]$env:HANGAR_LAB_GLB_BYTES
            glbSha256=$env:HANGAR_LAB_GLB_SHA256
            placeBytes=[int64]$env:HANGAR_LAB_PLACE_BYTES
            placeSha256=$env:HANGAR_LAB_PLACE_SHA256
            publishRun=[int64]$env:GITHUB_RUN_ID
            visualQC='PENDING_SCREENSHOT'
            requiredQC=@('NO_GALAXY','NO_ROGUE_BLACK_BLOCKS','NO_CYAN_SPAWN','NO_RIGID_NEON_RODS','MOVING_BEAM_LASERS','TWO_JETS_FLANK_STAGE','REFERENCE_SCALE_LAYOUT','COMPACT_UI')
          }
          $text=$receipt|ConvertTo-Json -Depth 6
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text+"`n"))
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='Hangar-Lab-v10'}
          $path='deploy-status/hangar-exclusive-club-lab-v10.json'
          $enc=(($path.Split('/')|ForEach-Object{[Uri]::EscapeDataString($_)}) -join '/')
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$enc"
          $sha=$null
          try{$old=Invoke-RestMethod -Headers $headers -Uri ($url+'?ref='+[Uri]::EscapeDataString($env:GITHUB_REF_NAME));$sha=[string]$old.sha}catch{}
          $body=@{message="Hangar LAB v10 receipt [skip ci]";content=$b64;branch=$env:GITHUB_REF_NAME}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Uri $url -Body ($body|ConvertTo-Json -Depth 5)|Out-Null
          Write-Host "HANGAR_LAB_V10_RECEIPT_PASS version=$env:HANGAR_LAB_ROBLOX_VERSION"
