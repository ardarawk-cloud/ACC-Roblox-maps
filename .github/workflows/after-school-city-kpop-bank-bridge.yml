name: After School City KPOP Bank Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  inject:
    if: startsWith(github.event.issue.title, 'ASC KPOP BANK INJECT')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated ASC KPOP branch
        uses: actions/checkout@v4
        with:
          ref: after-school-city/kpop-bank
          fetch-depth: 0

      - name: Inject KPOP bank and playback authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cfg = Path('maps/after-school-city/after-school-city.music-config.lua')
          player = Path('maps/after-school-city/after-school-city.music-player.client.lua')
          tracks = [
              ('HANTU', 130787669922537),('MALU BANGET', 128649936033154),('STRATEGI KU', 87125114946473),
              ('DI JATUHKAN', 138472779676021),('MEMULAI SEBELAHMU', 115164716109234),('TOPIK', 106731979070100),
              ('MERAH MUDA', 82573111697282),('YA TUHAN', 84541295288456),('MALAM YANG SEMPURNA', 112025968048348),
              ('KEREN', 102724403050017),('SEPERTI GILA', 101221026959656),('TERKENAL', 102729376941557),
              ('AKU', 130045741934771),('EMAS', 94909694876329),('DITOK', 128638509475237),
              ('AKU DAN KAMU', 115814496839320),('BUNGA', 134192777315026),('SATU ATAU DELAPAN', 85568242991971),
          ]
          lines = [
              '-- AFTER SCHOOL CITY — Personal Music Player KPOP Bank',
              '-- 18 Roblox-moderation-approved assets prepared at 1.75x.',
              '-- PlaybackSpeed 0.5714285714 restores intended listening speed.',
              '', 'return {', '    Version = "0.9.0-kpop-bank-1",', '    BankName = "KPOP",',
              '    DefaultVolume = 0.45,', '    PlaybackSpeed = 0.5714285714,', '    AutoPlay = false,',
              '    LoopPlaylist = true,', '', '    Tracks = {'
          ]
          for title, asset_id in tracks:
              lines.append(f'        {{Title = "{title}", Artist = "KPOP", AssetId = {asset_id}}},')
          lines += ['    },', '}', '']
          cfg.write_text('\n'.join(lines), encoding='utf-8')

          text = player.read_text(encoding='utf-8')
          old = '''local defaultVolume = math.clamp(tonumber(Config.DefaultVolume) or 0.45, 0, 1)\nlocal playbackSpeed = tonumber(Config.PlaybackSpeed) or 1.0\n-- Panel playback is intentionally normalized even if source preparation used another speed.\nplaybackSpeed = math.clamp(playbackSpeed, 0.5, 2.0)\nif math.abs(playbackSpeed - 1.0) > 0.001 then\n    warn("[ASC Music] config PlaybackSpeed overridden to normal 1.0")\n    playbackSpeed = 1.0\nend\n'''
          new = '''local defaultVolume = math.clamp(tonumber(Config.DefaultVolume) or 0.45, 0, 1)\nlocal playbackSpeed = math.clamp(tonumber(Config.PlaybackSpeed) or 1.0, 0.5, 2.0)\nlocal bankName = tostring(Config.BankName or "MUSIC")\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'local bankName = tostring(Config.BankName or "MUSIC")' not in text:
              raise SystemExit('PLAYBACK_AUTHORITY_BLOCK_UNEXPECTED')

          text = text.replace('sound.PlaybackSpeed = 1.0', 'sound.PlaybackSpeed = playbackSpeed')
          old_header = 'local titleHeader = label(header, "HeaderTitle", "AFTER SCHOOL CITY  ·  MUSIC", UDim2.new(1, -48, 1, 0), UDim2.fromOffset(14, 0), 12, palette.gold)'
          new_header = 'local titleHeader = label(header, "HeaderTitle", "AFTER SCHOOL CITY  ·  " .. bankName, UDim2.new(1, -48, 1, 0), UDim2.fromOffset(14, 0), 12, palette.gold)'
          if old_header in text:
              text = text.replace(old_header, new_header, 1)
          elif new_header not in text:
              raise SystemExit('MUSIC_HEADER_UNEXPECTED')
          player.write_text(text, encoding='utf-8')
          PY

      - name: QC isolated music injection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          cfg = Path('maps/after-school-city/after-school-city.music-config.lua').read_text(encoding='utf-8')
          player = Path('maps/after-school-city/after-school-city.music-player.client.lua').read_text(encoding='utf-8')
          ids = re.findall(r'AssetId = (\d+)', cfg)
          assert len(ids) == 18 and len(set(ids)) == 18
          assert 'BankName = "KPOP"' in cfg
          assert 'PlaybackSpeed = 0.5714285714' in cfg
          assert player.count('sound.PlaybackSpeed = playbackSpeed') == 2
          assert 'overridden to normal 1.0' not in player
          assert '"AFTER SCHOOL CITY  ·  " .. bankName' in player
          print('ASC_KPOP_BANK_QC_PASS tracks=18 speed=0.5714285714')
          PY

      - name: Commit KPOP injection branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ACC Roblox Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add maps/after-school-city/after-school-city.music-config.lua maps/after-school-city/after-school-city.music-player.client.lua
          if ! git diff --cached --quiet; then
            git commit -m 'Inject KPOP music bank into After School City [skip ci]'
            git push origin HEAD:after-school-city/kpop-bank
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        env:
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `ASC_KPOP_BANK_INJECTED | tracks=18 | bank=KPOP | playbackSpeed=0.5714285714 | branch=after-school-city/kpop-bank | source=${process.env.SOURCE_COMMIT} | NOT_PUBLISHED`})

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'ASC_KPOP_BANK_INJECTION_FAILED | No publish attempted.'})
