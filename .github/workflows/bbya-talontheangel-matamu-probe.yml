name: BBYA TalonTheAngel Matamu Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  upload-matamu:
    if: github.event.issue.title == 'BBYA TALONTHEANGEL MATAMU PROBE RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUDIO_KEY: ${{ secrets.TALONTHEANGEL_AUDIO_PUBLISHER }}
      MAX_MODERATION_WAIT_SECONDS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUDIO_KEY:-}" || { echo 'TALONTHEANGEL_SECRET_MISSING'; exit 10; }
          echo 'TALONTHEANGEL_SECRET_PRESENT=YES'

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python3 -m pip install --quiet 'gdown==6.1.0'

      - name: Prepare request
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/matamu.json" <<'JSON'
          [{"drive_file_id":"1Vi-1xNoL-IsanBEGJNkSrqgCHVBCgtp7","title":"Matamu"}]
          JSON

      - name: Upload Matamu 1.75x only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bbya-music-simple-upload-v13.py \
            --batch "$RUNNER_TEMP/matamu.json" \
            --result talontheangel-matamu-result.json \
            --moderation-wait-seconds 0

      - name: Preserve result
        if: always() && hashFiles('talontheangel-matamu-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: talontheangel-matamu-${{ github.run_id }}
          path: talontheangel-matamu-result.json
          retention-days: 30
