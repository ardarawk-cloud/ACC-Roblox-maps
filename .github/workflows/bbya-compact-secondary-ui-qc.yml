name: BBYA Compact Secondary UI QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/111-compact-secondary-panels.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-compact-secondary-ui-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: rojo-cache
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}
      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked
      - name: Build BBYA place
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-compact-secondary-ui.rbxl
          test -s /tmp/bbya-compact-secondary-ui.rbxl
      - name: Validate menu-sized support travel message authority
        shell: bash
        run: |
          set -euo pipefail
          ui='maps/bbya-social-hub/111-compact-secondary-panels.client.lua'
          manifest='maps/bbya-social-hub/default.project.json'

          grep -q 'COMPACT SECONDARY PANELS v2' "$ui"
          grep -q 'FeatureDrawer' "$ui"
          grep -q 'SUPPORT_MENU_SIZE' "$ui"
          grep -q 'TRAVEL_MENU_SIZE' "$ui"
          grep -q 'V2_MENU_SIZE' "$ui"
          grep -q 'math.clamp(math.floor(vp.X\*.30),296,330)' "$ui"
          grep -q 'math.clamp(math.floor(vp.X\*.25),304,340)' "$ui"
          grep -q 'local h=(vp.Y<620) and 286 or 308' "$ui"
          grep -q 'hub.AnchorPoint=Vector2.new(.5,0)' "$ui"
          grep -q 'hub.BackgroundTransparency=.34' "$ui"
          grep -q 'grid.FillDirectionMaxCells=2' "$ui"
          grep -q 'panel.AnchorPoint=Vector2.new(.5,0)' "$ui"
          grep -q 'panel.BackgroundTransparency=.34' "$ui"
          grep -q 'shade.BackgroundTransparency=.70' "$ui"
          grep -q 'CompactSecondaryPanelsV1' "$manifest"
          grep -q '111-compact-secondary-panels.client.lua' "$manifest"

          if grep -q 'FireServer' "$ui"; then
            echo 'Compact secondary authority must not own purchase/teleport/message remotes.' >&2
            exit 1
          fi
          if grep -q '420,560\|360,470\|320,380' "$ui"; then
            echo 'Old oversized secondary panel sizing returned.' >&2
            exit 1
          fi

          echo 'BBYA menu-sized secondary UI QC passed.'
