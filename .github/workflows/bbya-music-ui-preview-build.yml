name: BBYA Music UI Preview Build V3

on:
  pull_request:
    branches:
      - bbya-music-test-preview-base-v3
    paths:
      - 'maps/bbya-social-hub/**'
      - 'maps/registry.json'
      - '.github/workflows/bbya-music-ui-preview-build.yml'

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    env:
      PREVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_SOURCE_SHA }}

      - name: Verify target and main-safe authorities
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:PREVIEW_SOURCE_SHA)){throw 'PREVIEW_SOURCE_SHA missing'}
          $reg=Get-Content 'maps/registry.json' -Raw | ConvertFrom-Json
          $target=$reg.maps.'bbya-music-test'
          if(-not $target){throw 'bbya-music-test missing'}
          if([string]$target.universeId -ne '10762005984'){throw 'Unexpected test universe'}
          if([string]$target.placeId -ne '124607344716828'){throw 'Unexpected test place'}
          $bridge=Get-Content 'maps/bbya-social-hub/93-venue-music-ui.client.lua' -Raw
          $legacy=Get-Content 'maps/bbya-social-hub/81-basement-audio-ui.client.lua' -Raw
          $suite=Get-Content 'maps/bbya-social-hub/103-music-ui-final.client.lua' -Raw
          $integrity=Get-Content 'maps/bbya-social-hub/105-music-ui-integrity.client.lua' -Raw
          $router=Get-Content 'maps/bbya-social-hub/104-venue-audio-router.client.lua' -Raw
          $danceShell=Get-Content 'maps/bbya-social-hub/63-social-hangout.client.lua' -Raw
          $danceCatalog=Get-Content 'maps/bbya-social-hub/92-freecam.client.lua' -Raw
          if($bridge -notmatch 'MUSIC SUITE VENUE BRIDGE v6 MAIN-SAFE'){throw 'Main-safe bridge missing'}
          if($bridge -match '\.Volume\s*='){throw 'Bridge mutates audio volume'}
          foreach($needle in @('FUNKOT','VIP','SKATEPARK','ROOFTOP','VIPMusic')){if($bridge -notmatch [regex]::Escape($needle)){throw "Bridge contract missing: $needle"}}
          if($legacy -notmatch 'MUSIC SUITE SAFETY'){throw 'Legacy compatibility missing'}
          if($suite -notmatch 'BBYAMusicSuiteV1'){throw 'Music Suite missing'}
          if($integrity -notmatch 'PREMIUM PHASE 3'){throw 'Integrity layer missing'}
          foreach($needle in @('STRICT VENUE AUDIO ROUTER v9','ROUTER_V9_EQ_ONLY','BBYAFunkotHardGateV9')){if($router -notmatch [regex]::Escape($needle)){throw "Router lock missing: $needle"}}
          if($danceShell -notmatch 'SOCIAL HANGOUT SHELL v4'){throw '212 dance shell missing'}
          if($danceShell -match '9 dances \+ standard emotes'){throw 'Legacy 9-dance shell detected'}
          if($danceCatalog -notmatch 'DANCE CATALOG 212 OVERLAY v1'){throw '212 dance catalog missing'}
          if($danceCatalog -notmatch 'BBYADanceCatalogCount'){throw '212 dance catalog marker missing'}
          Write-Host "BBYA_MUSIC_V3_AUTHORITY_PASS source=$env:PREVIEW_SOURCE_SHA dance=212 router_blob_verified_externally=615ba63ba6ef99237ce6cb7221ad7a370c391344"

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojo=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-preview-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-preview-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build preview RBXL
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:GITHUB_WORKSPACE 'BBYA-MUSIC-UI-PREVIEW-V3.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo build failed'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw 'RBXL too small'}
          $hash=(Get-FileHash -Algorithm SHA256 $place).Hash.ToLower()
          "$hash  BBYA-MUSIC-UI-PREVIEW-V3.rbxl" | Set-Content 'BBYA-MUSIC-UI-PREVIEW-V3.sha256' -Encoding ascii
          Write-Host "BBYA_MUSIC_V3_BUILD_PASS bytes=$bytes sha256=$hash candidate=$env:PREVIEW_SOURCE_SHA"

      - name: Publish isolated test via MASTER V2
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PUBLISH_RECEIPT_DIR: deploy-status-test
          PLACE_FILE_OVERRIDE: ${{ github.workspace }}\BBYA-MUSIC-UI-PREVIEW-V3.rbxl
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_API_KEY)){throw 'ROBLOX_OPEN_CLOUD_MASTER_V2 unavailable'}
          if([string]::IsNullOrWhiteSpace($env:PREVIEW_SOURCE_SHA)){throw 'PREVIEW_SOURCE_SHA unavailable'}
          $env:GITHUB_SHA=$env:PREVIEW_SOURCE_SHA
          node scripts/publish-map.js bbya-music-test
          if($LASTEXITCODE -ne 0){throw 'Roblox test publish failed'}
          $receipt='deploy-status-test\bbya-music-test.json'
          $r=Get-Content $receipt -Raw | ConvertFrom-Json
          if($r.status -ne 'PUBLISHED'){throw "Receipt status=$($r.status)"}
          if([string]$r.universeId -ne '10762005984' -or [string]$r.placeId -ne '124607344716828'){throw 'Test target mismatch'}
          if($r.sourceCommit -ne $env:PREVIEW_SOURCE_SHA){throw "Source mismatch: $($r.sourceCommit) expected=$env:PREVIEW_SOURCE_SHA"}
          if(-not $r.response.versionNumber){throw 'versionNumber missing'}
          Get-Content $receipt
          Write-Host "BBYA_MUSIC_V3_TEST_PUBLISHED version=$($r.response.versionNumber) source=$($r.sourceCommit)"

      - uses: actions/upload-artifact@v4
        with:
          name: BBYA-MUSIC-UI-PREVIEW-V3
          path: |
            BBYA-MUSIC-UI-PREVIEW-V3.rbxl
            BBYA-MUSIC-UI-PREVIEW-V3.sha256
            deploy-status-test/bbya-music-test.json
          retention-days: 7
