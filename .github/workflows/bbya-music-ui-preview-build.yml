name: BBYA Music UI Preview Build

on:
  push:
    branches:
      - feat/bbya-music-ui-v1
    paths:
      - 'maps/bbya-social-hub/**'
      - '.github/workflows/bbya-music-ui-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojo=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-preview-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-preview-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            if(Test-Path $zip){Remove-Item $zip -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build BBYA Music UI preview RBXL
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:GITHUB_WORKSPACE 'BBYA-MUSIC-UI-PREVIEW.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo preview build failed'}
          if(-not (Test-Path $place)){throw 'Preview RBXL missing'}
          if((Get-Item $place).Length -lt 1024){throw 'Preview RBXL unexpectedly small'}
          $hash=(Get-FileHash -Algorithm SHA256 $place).Hash.ToLower()
          "$hash  BBYA-MUSIC-UI-PREVIEW.rbxl" | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'BBYA-MUSIC-UI-PREVIEW.sha256') -Encoding ascii
          Write-Host "BBYA_PREVIEW_BUILD_PASS bytes=$((Get-Item $place).Length) sha256=$hash"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-MUSIC-UI-PREVIEW
          path: |
            BBYA-MUSIC-UI-PREVIEW.rbxl
            BBYA-MUSIC-UI-PREVIEW.sha256
          retention-days: 7
