name: BBYA Studio UI Tree Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-studio-ui-tree.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dump Roblox Studio UI Automation tree
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $lines=New-Object System.Collections.Generic.List[string]
          $lines.Add("timestamp=$(Get-Date -Format o)")
          $proc=Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $proc){$lines.Add('STUDIO_PROCESS_NOT_FOUND')} else {
            $lines.Add("PID=$($proc.Id)")
            $lines.Add("WINDOW_HANDLE=$($proc.MainWindowHandle)")
            $lines.Add("WINDOW_TITLE=$($proc.MainWindowTitle)")
            if($proc.MainWindowHandle -ne 0){
              $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
              $all=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
              $count=[Math]::Min($all.Count,2000)
              $lines.Add("ELEMENT_COUNT=$($all.Count)")
              for($i=0;$i -lt $count;$i++){
                $el=$all.Item($i)
                try{
                  $name=$el.Current.Name
                  $aid=$el.Current.AutomationId
                  $ct=$el.Current.ControlType.ProgrammaticName
                  $enabled=$el.Current.IsEnabled
                  $off=$el.Current.IsOffscreen
                  $rect=$el.Current.BoundingRectangle
                  if($name -or $aid){
                    $lines.Add(("{0}|Name={1}|Id={2}|Enabled={3}|Offscreen={4}|Rect={5},{6},{7},{8}" -f $ct,$name,$aid,$enabled,$off,[int]$rect.X,[int]$rect.Y,[int]$rect.Width,[int]$rect.Height))
                  }
                }catch{}
              }
            }
          }
          $text=($lines-join "`n")+"`n"
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-studio-ui-tree.txt"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28";"User-Agent"="BBYA-Studio-Worker"}
          $sha=$null
          try{$sha=(Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $body=@{message='Record BBYA Studio UI tree [skip ci]';content=$content;branch='main'}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body|ConvertTo-Json) -ContentType 'application/json'
