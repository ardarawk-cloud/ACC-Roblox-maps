name: BBYA Studio CommandBar Ensure

on:
  push:
    branches:
      - 'bbya-mall/**'
    paths:
      - '.github/workflows/bbya-studio-commandbar-ensure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure_commandbar:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    steps:
      - name: Ensure Studio View Command Bar is visible
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class BBYAStudioFocus {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd,int cmd);
          }
          '@

          function Get-StudioRoot {
            $proc=Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0} | Select-Object -First 1
            if(-not $proc){return $null}
            $proc.Refresh()
            $h=[IntPtr]$proc.MainWindowHandle
            [BBYAStudioFocus]::ShowWindow($h,3)|Out-Null
            [BBYAStudioFocus]::SetForegroundWindow($h)|Out-Null
            Start-Sleep -Milliseconds 500
            try{return [System.Windows.Automation.AutomationElement]::FromHandle($h)}catch{return $null}
          }

          function Find-CommandBar($root){
            if(-not $root){return @($null,$null)}
            $ec=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'commandBarScriptEditor')
            $rc=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'multiLineRunButtonContainer.commandBarRunButton')
            return @(
              $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$ec),
              $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$rc)
            )
          }

          $root=Get-StudioRoot
          if(-not $root){throw 'Roblox Studio main window is not available on the cloud worker'}
          $pair=Find-CommandBar $root
          if($pair[0] -and $pair[1]){
            Write-Host 'COMMAND_BAR_ALREADY_VISIBLE=true'
            exit 0
          }

          $viewCond=New-Object System.Windows.Automation.AndCondition(
            (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::MenuItem)),
            (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty,'View'))
          )
          $view=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$viewCond)
          if(-not $view){throw 'View menu not found'}
          try{$view.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()}
          catch{try{$view.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand()}catch{throw 'Cannot open View menu'}}
          Start-Sleep -Milliseconds 900

          $desktop=[System.Windows.Automation.AutomationElement]::RootElement
          $menuItems=$desktop.FindAll([System.Windows.Automation.TreeScope]::Descendants,
            (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::MenuItem)))
          $commandItem=$null
          for($i=0;$i -lt $menuItems.Count;$i++){
            $item=$menuItems.Item($i)
            try{
              $n=$item.Current.Name
              if($n -match '^(Command Bar|Commandbar)$'){$commandItem=$item;break}
            }catch{}
          }
          if(-not $commandItem){
            $names=@()
            for($i=0;$i -lt $menuItems.Count;$i++){try{if($menuItems.Item($i).Current.Name){$names+=$menuItems.Item($i).Current.Name}}catch{}}
            Write-Host ('VIEW_MENU_ITEMS='+($names -join ' | '))
            throw 'Command Bar menu item not found after opening View'
          }
          try{$commandItem.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()}
          catch{try{$commandItem.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()}catch{throw 'Cannot activate Command Bar menu item'}}
          Start-Sleep -Seconds 2

          $root=Get-StudioRoot
          $pair=Find-CommandBar $root
          if(-not $pair[0] -or -not $pair[1]){throw 'Command Bar still not exposed after View toggle'}
          Write-Host 'COMMAND_BAR_ENSURED=true'
