name: After School City V0.5 Visual Fidelity QC

on:
  push:
    branches: [after-school-city/scaffold-v1]
    paths:
      - 'maps/after-school-city/**'
      - 'maps/registry.json'
      - '.github/scripts/after-school-city-spatial-audit.ps1'
      - '.github/scripts/after-school-city-spatial-audit-v4.ps1'
      - '.github/scripts/after-school-city-orientation-audit.ps1'
      - '.github/scripts/after-school-city-visual-fidelity-audit.ps1'
      - '.github/workflows/after-school-city-v050-visual-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/after-school-city/**'
      - 'maps/registry.json'
      - '.github/scripts/after-school-city-spatial-audit.ps1'
      - '.github/scripts/after-school-city-spatial-audit-v4.ps1'
      - '.github/scripts/after-school-city-orientation-audit.ps1'
      - '.github/scripts/after-school-city-visual-fidelity-audit.ps1'
      - '.github/workflows/after-school-city-v050-visual-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Cloud source spatial audit V4
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-spatial-audit.ps1'

      - name: Cloud source orientation audit V1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-orientation-audit.ps1'

      - name: Cloud source visual fidelity audit V1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-visual-fidelity-audit.ps1'

      - name: V0.5 static authority locks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $registry = Get-Content 'maps/registry.json' -Raw | ConvertFrom-Json
          $target = $registry.maps.'after-school-city'
          if(-not $target){throw 'after-school-city registry target missing'}
          if([string]$target.universeId -ne '10745359869'){throw "Wrong Universe ID: $($target.universeId)"}
          if([string]$target.placeId -ne '121603385909425'){throw "Wrong Place ID: $($target.placeId)"}
          if($target.enabled -ne $false){throw 'Development target must remain registry enabled=false'}

          $config = Get-Content 'maps/after-school-city/after-school-city.config.lua' -Raw
          $project = Get-Content 'maps/after-school-city/default.project.json' -Raw
          $visual = Get-Content 'maps/after-school-city/after-school-city.visual-fidelity.server.lua' -Raw
          $intro = Get-Content 'maps/after-school-city/after-school-city.intro.client.lua' -Raw
          $null = $project | ConvertFrom-Json

          foreach($token in @('Version = "0.5.0-visual-fidelity-1"','OrientationBaseVersion = "0.4.7-orientation-correction-1"','VisualFidelityVersion = "0.5.0-visual-fidelity-1"','Spawn = Vector3.new(0, 2.2, 157)','EnableOrientationCorrectionPass = true','EnableVisualFidelityPass = true','EnableActivities = false','EnableEconomy = false','EnablePersistence = false')){
            if($config -notmatch [regex]::Escape($token)){throw "Config marker missing: $token"}
          }
          foreach($token in @('ASC_OrientationCorrection','ASC_VisualFidelity','after-school-city.orientation-correction.server.lua','after-school-city.visual-fidelity.server.lua')){
            if($project -notmatch [regex]::Escape($token)){throw "Project marker missing: $token"}
          }
          foreach($token in @('V050_VisualFidelity','ASC_SchoolAxisPropClear','ASC_PrototypeVendingRemoved','ASC_StudentRowDoorTreesCleared','ASC_DowntownInteriorWidthReconciled','ASC_SkateSignCompacted','ASC_WayfindingCompacted','ASC_ExteriorLightsNormalized')){
            if($visual -notmatch [regex]::Escape($token)){throw "Visual marker missing: $token"}
          }
          foreach($token in @('PUTU AZYA PUTRI BINTANG HARDAJAYA','WITH LOVE, DAD','ENTER THE CITY')){
            if($intro -notmatch [regex]::Escape($token)){throw "Dedication lock missing: $token"}
          }
          if($visual -match 'MarketplaceService|PromptProductPurchase|ProcessReceipt|DataStoreService'){throw 'V0.5 visual layer must not contain monetization/persistence authority'}
          if($visual -match 'BillboardGui'){throw 'V0.5 must not introduce BillboardGui'}
          Write-Host 'AFTER SCHOOL CITY v0.5 static authority locks PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojoExe=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0-v050'
            $zip=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0-v050.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojoExe=$exe.FullName
          }
          $version=& $rojoExe --version
          Write-Host $version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          if(($version -join ' ') -notmatch '7\.7\.0'){throw "Expected Rojo 7.7.0, got $version"}
          "ROJO_EXE=$rojoExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact V0.5 map
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'after-school-city-v050.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
          if(-not (Test-Path $place)){throw 'Generated RBXL missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw "Generated RBXL suspiciously small: $bytes bytes"}
          $sha=(Get-FileHash -Algorithm SHA256 $place).Hash.ToLowerInvariant()
          Write-Host "AFTER SCHOOL CITY V0.5 ROJO BUILD PASS - $bytes bytes - sha256=$sha"
