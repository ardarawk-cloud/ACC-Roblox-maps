name: BBYA v345 Unified Menu QC

on:
  push:
    branches: [agent/bbya-unified-menu-v345]
    paths:
      - 'maps/bbya-social-hub/91-owner-ui.client.lua'
      - '.github/workflows/bbya-v345-unified-menu-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/91-owner-ui.client.lua'
      - '.github/workflows/bbya-v345-unified-menu-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: rojo-cache
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}
      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked
      - name: Build BBYA place
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-v345-menu.rbxl
          test -s /tmp/bbya-v345-menu.rbxl
      - name: Validate unified HUD authority
        shell: bash
        run: |
          set -euo pipefail
          f='maps/bbya-social-hub/91-owner-ui.client.lua'
          grep -q 'OWNER UNIFIED MENU v5' "$f"
          grep -q 'BBYAUnifiedMenuUI' "$f"
          grep -q 'MenuButton' "$f"
          grep -q 'btn.Parent=s.frame' "$f"
          grep -q 'dock.Visible=false' "$f"
          grep -q 'id="BBYA"' "$f"
          grep -q 'id="MUSIC"' "$f"
          grep -q 'id="SUPPORT"' "$f"
          grep -q 'id="TRAVEL"' "$f"
          grep -q 'id="MESSAGE"' "$f"
          grep -q 'id="COMMUNITY"' "$f"
          grep -q 'id="DANCE"' "$f"
          grep -q 'id="CARRY"' "$f"
          grep -q 'id="FREECAM"' "$f"
          grep -q '9 integrated features' "$f"
          echo 'BBYA v345 unified menu QC PASS'
