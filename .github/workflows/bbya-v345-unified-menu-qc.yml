name: BBYA v345 Unified Menu QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/56-dock-stability.client.lua'
      - 'maps/bbya-social-hub/91-owner-ui.client.lua'
      - '.github/workflows/bbya-v345-unified-menu-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: rojo-cache
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}
      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked
      - name: Build BBYA place
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-v345-menu.rbxl
          test -s /tmp/bbya-v345-menu.rbxl
      - name: Validate current unified command authority
        shell: bash
        run: |
          set -euo pipefail
          menu='maps/bbya-social-hub/56-dock-stability.client.lua'
          owner='maps/bbya-social-hub/91-owner-ui.client.lua'
          grep -q 'COMMAND MENU AUTHORITY v7' "$menu"
          grep -q 'V7_SINGLE_COMPACT_AUTHORITY' "$menu"
          grep -q 'BBYASinglePanelMode",true' "$menu"
          grep -q 'MenuButton' "$menu"
          grep -q 'btn.Parent~=slot.frame' "$menu"
          grep -q 'dock.Visible=false' "$menu"
          grep -q '{"BBYA",1' "$menu"
          grep -q '{"MUSIC",2' "$menu"
          grep -q '{"SUPPORT",3' "$menu"
          grep -q '{"TRAVEL",4' "$menu"
          grep -q '{"MESSAGE",5' "$menu"
          grep -q '{"COMMUNITY",6' "$menu"
          grep -q '{"DANCE",7' "$menu"
          grep -q '{"CARRY",8' "$menu"
          grep -q '{"FREECAM",9' "$menu"
          grep -q 'hideCompetingPanels' "$menu"
          grep -q 'LEFT_OF_MENU_V2_PRECISE' "$menu"
          grep -q 'OWNER UI COMPATIBILITY + ROLE PANEL v8' "$owner"
          grep -q 'COMMAND_MENU_V7' "$owner"
          if grep -q 'p.Position=UDim2.fromScale(.5,.55)' "$owner"; then echo 'Owner UI must not restore centered social panels.' >&2; exit 1; fi
          echo 'BBYA unified command authority v7 QC PASS'
