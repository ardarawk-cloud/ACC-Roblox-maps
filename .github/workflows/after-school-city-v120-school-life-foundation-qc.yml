name: After School City V1.2 Dedication No Backdrop v52 QC

on:
  push:
    branches: [after-school-city/v120-dedication-no-backdrop-v52]
    paths:
      - '.github/workflows/after-school-city-v120-school-life-foundation-qc.yml'
      - 'maps/after-school-city/after-school-city.intro.client.lua'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact dedication patch candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact v52 LIVE base and narrow diff gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '12882a30a5c3b585f4a4eb0e19109442df4dc374'
          git cat-file -e "$base^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'v52 LIVE source unavailable' }
          $mergeBase = (git merge-base $base $env:GITHUB_SHA).Trim()
          if($mergeBase -ne $base){ throw "Candidate is not based on exact v52 LIVE source: $mergeBase" }
          $allowed = @(
            '.github/workflows/after-school-city-v120-school-life-foundation-qc.yml',
            'maps/after-school-city/after-school-city.intro.client.lua'
          )
          $changed = @(git diff --name-only $base $env:GITHUB_SHA)
          if($changed.Count -ne 2){ throw "Expected exactly 2 files, got $($changed.Count): $($changed -join ', ')" }
          foreach($path in $changed){ if($allowed -notcontains $path){ throw "Scope violation: $path" } }
          foreach($path in $allowed){ if($changed -notcontains $path){ throw "Missing required change: $path" } }
          Write-Host "DEDICATION PATCH V52 NARROW DIFF PASS source=$env:GITHUB_SHA"

      - name: Verify dedication copy and backdrop removal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $introPath = 'maps/after-school-city/after-school-city.intro.client.lua'
          $intro = Get-Content $introPath -Raw
          foreach($token in @(
            'AFTER SCHOOL CITY',
            'A GAME MADE FOR',
            'PUTU AZYA PUTRI\nBINTANG HARDAJAYA',
            'This game was made especially for you.',
            'WITH LOVE, DAD',
            'ENTER THE CITY'
          )){
            if($intro -notmatch [regex]::Escape($token)){ throw "Dedication lock missing: $token" }
          }
          if($intro -match 'local\s+backdrop\s*=|backdrop\.Name\s*=\s*"Backdrop"|TweenService:Create\(backdrop'){
            throw 'Backdrop implementation still present'
          }
          foreach($token in @(
            'card.Name = "Card"',
            'enterButton.Name = "EnterButton"',
            'gui.DisplayOrder = 1000'
          )){
            if($intro -notmatch [regex]::Escape($token)){ throw "Intro card authority missing: $token" }
          }
          Write-Host 'DEDICATION COPY LOCK PASS; FULL-SCREEN BACKDROP REMOVED'

      - name: Verify v52 KPOP and non-intro production authority unchanged
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '12882a30a5c3b585f4a4eb0e19109442df4dc374'
          $unexpected = @(git diff --name-only $base $env:GITHUB_SHA -- 'maps/after-school-city' | Where-Object { $_ -ne 'maps/after-school-city/after-school-city.intro.client.lua' })
          if($unexpected.Count -gt 0){ throw "Unexpected production source change: $($unexpected -join ', ')" }
          $cfg = Get-Content 'maps/after-school-city/after-school-city.music-config.lua' -Raw
          $player = Get-Content 'maps/after-school-city/after-school-city.music-player.client.lua' -Raw
          foreach($token in @(
            'Version = "0.9.0-kpop-bank-1"',
            'BankName = "KPOP"',
            'PlaybackSpeed = 0.5714285714'
          )){ if($cfg -notmatch [regex]::Escape($token)){ throw "v52 KPOP authority missing: $token" } }
          $trackCount = ([regex]::Matches($cfg, 'AssetId\s*=')).Count
          if($trackCount -ne 18){ throw "Expected 18 v52 KPOP tracks; got $trackCount" }
          if($player -notmatch [regex]::Escape('sound.PlaybackSpeed = playbackSpeed')){ throw 'v52 KPOP playback authority missing' }
          Write-Host 'V52 KPOP + NON-INTRO PRODUCTION AUTHORITY UNCHANGED'

      - name: Verify School Life and persistence locks still present
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gameplay = Get-Content 'maps/after-school-city/after-school-city.gameplay-config.lua' -Raw
          foreach($token in @(
            'DataStoreName = "ASC_PlayerProfile_v1"',
            'SchemaVersion = 1',
            '"SCHOOL_MEET_TEACHER"',
            '"SCHOOL_HELP_CANTEEN"',
            '"SCHOOL_JOIN_CLUB"'
          )){ if($gameplay -notmatch [regex]::Escape($token)){ throw "Protected gameplay lock missing: $token" } }
          Write-Host 'SCHOOL LIFE + PERSISTENCE LOCK PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0'
          $zip = Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0.zip'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
          if(-not $exe){ throw 'rojo.exe missing' }
          $version = (& $exe.FullName --version | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $version -notmatch '7\.7\.0'){ throw "Unexpected Rojo version: $version" }
          "ROJO_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ROJO_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact v52 dedication patch candidate and hash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'asc-v52-dedication-no-backdrop-qc'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $place = Join-Path $out 'after-school-city-v52-dedication-no-backdrop.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $place)){ throw 'Rojo build failed' }
          $bytes = (Get-Item $place).Length
          if($bytes -lt 1024){ throw "RBXL too small: $bytes" }
          $hash = (Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = @(
            'STATUS=QC_PASSED',
            'MODE=DEDICATION_NO_BACKDROP_V52_PATCH',
            'BASE_LIVE_COMMIT=12882a30a5c3b585f4a4eb0e19109442df4dc374',
            "SOURCE_COMMIT=$env:GITHUB_SHA",
            "ROJO=$env:ROJO_VERSION",
            "RBXL_BYTES=$bytes",
            "SHA256=$hash",
            'SCOPE=INTRO_BACKDROP_ONLY',
            'DEDICATION_COPY=UNCHANGED',
            'KPOP_BANK=V52_PRESERVED_18_TRACKS',
            'DATASTORE_SCHEMA_GAMEPLAY_MAP=UNCHANGED'
          )
          $receipt | Set-Content (Join-Path $out 'qc-receipt.txt') -Encoding ascii
          $receipt | ForEach-Object { Write-Host $_ }
          "QC_OUT_DIR=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exact v52 dedication patch QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: after-school-city-v52-dedication-no-backdrop-qc-${{ github.sha }}
          path: ${{ env.QC_OUT_DIR }}
          if-no-files-found: error
          retention-days: 7
