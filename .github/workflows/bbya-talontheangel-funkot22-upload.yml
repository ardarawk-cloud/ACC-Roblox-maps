name: BBYA TalonTheAngel Funkot22 Upload

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  upload-funkot22:
    if: github.event.issue.title == 'BBYA TALONTHEANGEL FUNKOT22 UPLOAD RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AUDIO_KEY: ${{ secrets.TALONTHEANGEL_AUDIO_PUBLISHER }}
      MAX_MODERATION_WAIT_SECONDS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUDIO_KEY:-}" || { echo 'TALONTHEANGEL_SECRET_MISSING'; exit 10; }
          echo 'TALONTHEANGEL_SECRET_PRESENT=YES'

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python3 -m pip install --quiet 'gdown==6.1.0'

      - name: Prepare Funkot22 batch
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/funkot22.json" <<'JSON'
          [
            {"drive_file_id":"1IqS-aucCT-_j0Kew4tOcAq7T091zmAzB","title":"Bbya Funkot 01"},
            {"drive_file_id":"1gvaKsQYAexMqRnIhghf88CHrItQdwpBH","title":"Bbya Funkot 02"},
