      - name: Upload Funkot22 at 1.75x
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bbya-music-simple-upload-v13.py \
            --batch "$RUNNER_TEMP/funkot22.json" \
            --result talontheangel-funkot22-result.json \
            --moderation-wait-seconds 0

      - name: Preserve result
        if: always() && hashFiles('talontheangel-funkot22-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: talontheangel-funkot22-${{ github.run_id }}
          path: talontheangel-funkot22-result.json
          retention-days: 30
