name: BBYA Ddiaz Entrance Cars TEST

on:
  push:
    branches: [feat/bbya-entrance-ddiaz-cars-v1]
    paths:
      - '.github/workflows/bbya-entrance-premium-cars.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbya-ddiaz-entrance-cars-test-v2
  cancel-in-progress: false

jobs:
  ingest-and-test:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
      MAIN_UNIVERSE_ID: '8116636513'
      TEST_UNIVERSE_ID: '10762005984'
      TEST_PLACE_ID: '124607344716828'
      LAMBO_DRIVE_ID: '1i12dTW47U465DMmJI85B76wCfTkCBmke'
      MAZDA_DRIVE_ID: '1rt20cc9ggokbsET4oFSZDTeHDQr2frT8'
      LAMBO_SHA256: 'dd0be7d49459dc9b526d1c57093b507e85e943ef54cc36c62ed8e9aa294679d1'
      MAZDA_SHA256: '22a07bbdd657ff43d2f54eb6f96a9e0658f4a8a52d7078f96207a4043fa968b6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static source QC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='maps/bbya-social-hub/77-entrance-car-cleanup.server.lua'
          $t=Get-Content $p -Raw
          foreach($m in @('DDIAZ PREMIUM ENTRANCE CARS v1 TEST','BBYA_DDIAZ_LAMBO_ASSET_ID','BBYA_DDIAZ_MAZDA_ASSET_ID','DdiazPremiumCarsV1','AdditionalPermissionConfirmedByProjectOwner')){
            if(-not $t.Contains($m)){throw "Missing Ddiaz car marker: $m"}
          }
          Write-Host 'BBYA_DDIAZ_STATIC_QC_PASS'

      - name: Download exact Drive GLBs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --quiet gdown
          if($LASTEXITCODE -ne 0){throw 'gdown install failed'}
          $dir=Join-Path $env:RUNNER_TEMP 'bbya-ddiaz-cars-v2'
          if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $lambo=Join-Path $dir '2021_vorsteiner_lamborghini_huracan_evo_2wd.glb'
          $mazda=Join-Path $dir '2004_veilside_d1-gt_mazda_rx-8_tokyo_drift.glb'

          python -m gdown $env:LAMBO_DRIVE_ID -O $lambo
          if($LASTEXITCODE -ne 0){throw 'Lamborghini Drive download failed'}
          python -m gdown $env:MAZDA_DRIVE_ID -O $mazda
          if($LASTEXITCODE -ne 0){throw 'Mazda Drive download failed'}

          $lh=(Get-FileHash $lambo -Algorithm SHA256).Hash.ToLowerInvariant()
          $mh=(Get-FileHash $mazda -Algorithm SHA256).Hash.ToLowerInvariant()
          if($lh -ne $env:LAMBO_SHA256){throw "Lamborghini SHA mismatch: $lh"}
          if($mh -ne $env:MAZDA_SHA256){throw "Mazda SHA mismatch: $mh"}
          if((Get-Item $lambo).Length -gt 20000000){throw 'Lamborghini exceeds Roblox 20MB model upload limit'}
          if((Get-Item $mazda).Length -gt 20000000){throw 'Mazda exceeds Roblox 20MB model upload limit'}

          $lb=[System.IO.File]::ReadAllBytes($lambo)
          $mb=[System.IO.File]::ReadAllBytes($mazda)
          if([System.Text.Encoding]::ASCII.GetString($lb,0,4) -ne 'glTF'){throw 'Lamborghini is not GLB'}
          if([System.Text.Encoding]::ASCII.GetString($mb,0,4) -ne 'glTF'){throw 'Mazda is not GLB'}

          "LAMBO_GLB=$lambo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MAZDA_GLB=$mazda" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_DDIAZ_FILES_VERIFIED lambo=$((Get-Item $lambo).Length) mazda=$((Get-Item $mazda).Length)"

      - name: Resolve BBYA Roblox creator
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $meta=Invoke-RestMethod -Method Get -Uri "https://games.roblox.com/v1/games?universeIds=$env:MAIN_UNIVERSE_ID"
          if(-not $meta.data -or $meta.data.Count -lt 1){throw 'Unable to resolve BBYA creator'}
          $creator=$meta.data[0].creator
          $type=[string]$creator.type
          $id=[string]$creator.id
          if($id -notmatch '^\d+$'){throw "Invalid creator id: $id"}
          if($type -ieq 'Group'){$field='groupId'}elseif($type -ieq 'User'){$field='userId'}else{throw "Unsupported creator type: $type"}
          "BBYA_CREATOR_FIELD=$field" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BBYA_CREATOR_ID=$id" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_CREATOR_RESOLVED type=$type id=$id"

      - name: Upload Ddiaz models to Roblox Open Cloud
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ROBLOX_API_KEY){throw 'AM_STUDIO secret missing'}

          function Upload-Model([string]$File,[string]$Name,[string]$Description){
            $creator=@{}
            $creator[$env:BBYA_CREATOR_FIELD]=$env:BBYA_CREATOR_ID
            $request=@{
              assetType='Model'
              displayName=$Name
              description=$Description
              creationContext=@{creator=$creator}
            } | ConvertTo-Json -Depth 8 -Compress
            $requestFile=Join-Path $env:RUNNER_TEMP ("bbya-ddiaz-request-"+[guid]::NewGuid().ToString('N')+'.json')
            [System.IO.File]::WriteAllText($requestFile,$request,(New-Object System.Text.UTF8Encoding($false)))
            try {
              $args=@('--silent','--show-error','--location','--request','POST','--header',"x-api-key: $env:ROBLOX_API_KEY",'--form',"request=<$requestFile;type=application/json",'--form',"fileContent=@$File;type=model/gltf-binary",'https://apis.roblox.com/assets/v1/assets')
              $raw=& curl.exe @args
            } finally {Remove-Item $requestFile -Force -ErrorAction SilentlyContinue}
            if($LASTEXITCODE -ne 0){throw "Upload curl failed: $Name"}
            try{$created=$raw|ConvertFrom-Json}catch{throw "Invalid asset response: $raw"}
            if(-not $created.path){throw "Asset upload rejected: $raw"}
            $opId=([string]$created.path) -replace '^operations/',''
            Write-Host "UPLOAD_ACCEPTED name=$Name operation=$opId"
            for($i=0;$i -lt 120;$i++){
              Start-Sleep -Seconds 4
              $opRaw=& curl.exe --silent --show-error --location --header "x-api-key: $env:ROBLOX_API_KEY" "https://apis.roblox.com/assets/v1/operations/$opId"
              if($LASTEXITCODE -ne 0){continue}
              try{$op=$opRaw|ConvertFrom-Json}catch{continue}
              if($op.done){
                if($op.error){throw "Asset operation failed: $($op.error|ConvertTo-Json -Compress -Depth 8)"}
                $asset=[string]$op.response.assetId
                if($asset -notmatch '^\d+$'){throw "No assetId in completed operation: $opRaw"}
                Write-Host "UPLOAD_DONE name=$Name asset=$asset moderation=$([string]$op.response.moderationResult.moderationState)"
                return $asset
              }
            }
            throw "Timed out uploading $Name"
          }

          $license='CC Attribution-NonCommercial-ShareAlike 4.0 (https://creativecommons.org/licenses/by-nc-sa/4.0/). Additional use permission confirmed by BBYA project owner.'
          $lamboDesc='"2021 Vorsteiner Lamborghini Huracan EVO 2WD" (https://skfb.ly/pFsG9) by Ddiaz Design. '+$license
          $mazdaDesc='"2004 VeilSide D1-GT Mazda RX-8 Tokyo Drift" (https://skfb.ly/pKzpM) by Ddiaz Design. '+$license
          $lambo=Upload-Model $env:LAMBO_GLB 'BBYA - 2021 Vorsteiner Lamborghini Huracan EVO 2WD' $lamboDesc
          $mazda=Upload-Model $env:MAZDA_GLB 'BBYA - 2004 VeilSide D1-GT Mazda RX-8 Tokyo Drift' $mazdaDesc
          "LAMBO_ASSET_ID=$lambo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MAZDA_ASSET_ID=$mazda" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Lock asset IDs into TEST branch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'BBYA Ddiaz Car Ingest'
          git config user.email 'actions@users.noreply.github.com'
          $p='maps/bbya-social-hub/77-entrance-car-cleanup.server.lua'
          $t=Get-Content $p -Raw
          $t=[regex]::Replace($t,'local LAMBO_ASSET_ID = \d+ -- BBYA_DDIAZ_LAMBO_ASSET_ID',"local LAMBO_ASSET_ID = $env:LAMBO_ASSET_ID -- BBYA_DDIAZ_LAMBO_ASSET_ID")
          $t=[regex]::Replace($t,'local MAZDA_ASSET_ID = \d+ -- BBYA_DDIAZ_MAZDA_ASSET_ID',"local MAZDA_ASSET_ID = $env:MAZDA_ASSET_ID -- BBYA_DDIAZ_MAZDA_ASSET_ID")
          Set-Content -Path $p -Value $t -Encoding utf8
          git add $p
          git diff --cached --check
          git commit -m 'BBYA TEST: lock Ddiaz entrance car asset IDs [skip ci]'
          git push origin HEAD:feat/bbya-entrance-ddiaz-cars-v1
          $source=(git rev-parse HEAD).Trim()
          "TEST_SOURCE_COMMIT=$source" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BBYA_DDIAZ_ASSET_LOCK_PASS source=$source lambo=$env:LAMBO_ASSET_ID mazda=$env:MAZDA_ASSET_ID"

      - name: Build and publish TEST LAB
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $zip=Join-Path $env:RUNNER_TEMP 'rojo.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive $zip -DestinationPath $toolDir -Force
          }
          $out=Join-Path $env:RUNNER_TEMP 'bbya-ddiaz-cars-test.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Rojo build failed'}
          $bytes=(Get-Item $out).Length
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $url="https://apis.roblox.com/universes/v1/$env:TEST_UNIVERSE_ID/places/$env:TEST_PLACE_ID/versions?versionType=Published"
          $resp=& curl.exe --silent --show-error --fail-with-body --http1.1 --ipv4 --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --header 'Content-Type: application/octet-stream' --header 'Expect:' --data-binary "@$out" $url
          if($LASTEXITCODE -ne 0){throw 'TEST LAB publish failed'}
          $r=$resp|ConvertFrom-Json
          if(-not $r.versionNumber){throw 'versionNumber missing'}
          Write-Host "BBYA_DDIAZ_TEST_PUBLISHED version=$($r.versionNumber) source=$env:TEST_SOURCE_COMMIT lambo=$env:LAMBO_ASSET_ID mazda=$env:MAZDA_ASSET_ID bytes=$bytes sha256=$sha universe=$env:TEST_UNIVERSE_ID place=$env:TEST_PLACE_ID"
