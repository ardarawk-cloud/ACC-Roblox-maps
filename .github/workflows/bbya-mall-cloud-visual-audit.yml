name: BBYA Mall Cloud Visual Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-mall-cloud-visual-audit.yml'
      - '.github/worker-jobs/bbya-mall-visual-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: See current BBYA Mall in Roblox Studio cloud worker
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class BBYAWin {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          }
          "@

          $proc=Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $proc){throw 'Roblox Studio not found on BBYA cloud worker'}
          $hwnd=[IntPtr]$proc.MainWindowHandle
          [BBYAWin]::ShowWindow($hwnd,9)|Out-Null
          [BBYAWin]::SetForegroundWindow($hwnd)|Out-Null
          Start-Sleep -Milliseconds 700
          [System.Windows.Forms.SendKeys]::SendWait('+{F5}')
          Start-Sleep -Seconds 1
          [System.Windows.Forms.SendKeys]::SendWait('{F5}')
          Start-Sleep -Seconds 14

          $ui=[System.Windows.Automation.AutomationElement]::FromHandle($hwnd)
          $editCond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'commandBarScriptEditor')
          $runCond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'multiLineRunButtonContainer.commandBarRunButton')
          $edit=$ui.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$editCond)
          $run=$ui.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$runCond)
          if(-not $edit -or -not $run){throw 'Studio Command Bar unavailable'}
          $value=$edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
          $invoke=$run.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)

          function Invoke-Lua([string]$lua){
            $value.SetValue($lua)
            Start-Sleep -Milliseconds 220
            $invoke.Invoke()
            Start-Sleep -Milliseconds 950
          }

          $outDir=Join-Path $env:GITHUB_WORKSPACE 'deploy-status/bbya-mall-cloud-audit'
          New-Item -ItemType Directory -Force -Path $outDir|Out-Null

          function Capture-View([string]$name){
            [BBYAWin]::SetForegroundWindow($hwnd)|Out-Null
            Start-Sleep -Milliseconds 450
            $r=New-Object BBYAWin+RECT
            [BBYAWin]::GetWindowRect($hwnd,[ref]$r)|Out-Null
            $w=[Math]::Max(640,$r.Right-$r.Left);$h=[Math]::Max(360,$r.Bottom-$r.Top)
            $full=New-Object System.Drawing.Bitmap($w,$h)
            $gf=[System.Drawing.Graphics]::FromImage($full)
            $gf.CopyFromScreen($r.Left,$r.Top,0,0,(New-Object System.Drawing.Size($w,$h)))

            # Crop the real 3D viewport using the calibrated BBYA cloud-Studio window ratios.
            $x=[int]($w*.30);$y=[int]($h*.18);$cw=[int]($w*.50);$ch=[int]($h*.64)
            if($x+$cw -gt $w){$cw=$w-$x};if($y+$ch -gt $h){$ch=$h-$y}
            $crop=New-Object System.Drawing.Bitmap($cw,$ch)
            $gc=[System.Drawing.Graphics]::FromImage($crop)
            $gc.DrawImage($full,(New-Object System.Drawing.Rectangle(0,0,$cw,$ch)),(New-Object System.Drawing.Rectangle($x,$y,$cw,$ch)),[System.Drawing.GraphicsUnit]::Pixel)
            $targetW=900;$targetH=[int]($ch*$targetW/$cw)
            $small=New-Object System.Drawing.Bitmap($targetW,$targetH)
            $g2=[System.Drawing.Graphics]::FromImage($small)
            $g2.InterpolationMode=[System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g2.DrawImage($crop,0,0,$targetW,$targetH)
            $jpg=Join-Path $outDir ($name+'.jpg')
            $codec=[System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders()|Where-Object {$_.MimeType -eq 'image/jpeg'}|Select-Object -First 1
            $ep=New-Object System.Drawing.Imaging.EncoderParameters(1)
            $ep.Param[0]=New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality,[long]82)
            $small.Save($jpg,$codec,$ep)
            $gf.Dispose();$gc.Dispose();$g2.Dispose();$full.Dispose();$crop.Dispose();$small.Dispose()
          }

          $diag=@'
          print("[BBYA_MALL_AUDIT_BEGIN]")
          local root=workspace:FindFirstChild("BBYA_ZERO_BUILD")
          local mall=root and root:FindFirstChild("BBYAMall")
          print("ROOT="..tostring(root~=nil).."|MALL="..tostring(mall~=nil))
          if mall then
            print("PASS="..tostring(mall:GetAttribute("Pass")).."|FLOORS="..tostring(mall:GetAttribute("Floors")).."|TENANTS="..tostring(mall:GetAttribute("TenantCount")))
            for _,name in ipairs({"MallArchitectureV3","MallLiveUpgradeV2","MallRobuxCommerceV1"}) do
              local m=mall:FindFirstChild(name)
              print(name.."="..tostring(m~=nil))
            end
            for _,id in ipairs({"luma","stride","muse","north","glow"}) do
              local unit=mall:FindFirstChild("Tenant_"..id)
              if unit and unit:IsA("Model") then
                local cf,sz=unit:GetBoundingBox()
                print(string.format("TENANT=%s|POS=%.1f,%.1f,%.1f|SIZE=%.1f,%.1f,%.1f|NATIVE=%s",id,cf.Position.X,cf.Position.Y,cf.Position.Z,sz.X,sz.Y,sz.Z,tostring(unit:GetAttribute("NativeRobuxShop"))))
                for _,pn in ipairs({"SideA","SideB","StoreGlass","StoreDoor","StoreSign","Counter","Interact"}) do
                  local p=unit:FindFirstChild(pn)
                  if p and p:IsA("BasePart") then print(string.format("PART=%s/%s|POS=%.1f,%.1f,%.1f|SIZE=%.1f,%.1f,%.1f|T=%.2f",id,pn,p.Position.X,p.Position.Y,p.Position.Z,p.Size.X,p.Size.Y,p.Size.Z,p.Transparency)) end
                end
              else print("TENANT="..id.."|MISSING") end
            end
          end
          print("[BBYA_MALL_AUDIT_END]")
          '@
          Invoke-Lua $diag

          # Views are player-eye perspectives chosen around the actual Mall footprint.
          $views=@(
            @{n='01-entrance-atrium';p='0,5,304';l='0,8,365';z='18'},
            @{n='02-l1-luma-stride';p='0,5,326';l='66,5,330';z='18'},
            @{n='03-l1-muse-rear';p='0,5,390';l='68,5,405';z='18'},
            @{n='04-l2-north-glow';p='0,19,350';l='70,19,365';z='19'},
            @{n='05-l2-glow-close';p='28,19,365';l='70,19,365';z='16'},
            @{n='06-upper-atrium';p='0,34,340';l='0,28,405';z='22'},
            @{n='07-overview';p='0,52,320';l='0,22,380';z='30'}
          )
          foreach($v in $views){
            $lua="local P=game:GetService('Players'):GetPlayers()[1];if P then P.CameraMinZoomDistance=$($v.z);P.CameraMaxZoomDistance=$($v.z);local C=P.Character;local H=C and C:FindFirstChild('HumanoidRootPart');local U=C and C:FindFirstChildOfClass('Humanoid');if U then U.AutoRotate=false end;if H then H.Anchored=true;H.CFrame=CFrame.lookAt(Vector3.new($($v.p)),Vector3.new($($v.l)));H.AssemblyLinearVelocity=Vector3.zero;H.AssemblyAngularVelocity=Vector3.zero end end"
            Invoke-Lua $lua
            Start-Sleep -Milliseconds 900
            Capture-View $v.n
          }
          Invoke-Lua "local P=game:GetService('Players'):GetPlayers()[1];local H=P and P.Character and P.Character:FindFirstChild('HumanoidRootPart');if H then H.Anchored=false end"

          $marked=New-Object System.Collections.Generic.List[string]
          $logs=Get-ChildItem 'C:\Users\Administrator\AppData\Local\Roblox\logs' -File -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 6
          foreach($log in $logs){
            $capture=$false
            foreach($line in (Get-Content $log.FullName -ErrorAction SilentlyContinue)){
              if($line -match '\[BBYA_MALL_AUDIT_BEGIN\]'){$capture=$true}
              if($capture){$marked.Add($line)}
              if($capture -and $line -match '\[BBYA_MALL_AUDIT_END\]'){$capture=$false}
            }
            if($marked.Count -gt 0){break}
          }
          [IO.File]::WriteAllText((Join-Path $outDir 'geometry.txt'),($marked -join "`n"))

          $report=Join-Path $outDir 'visual-analysis.md'
          $prompt=@'
          Inspect these seven CURRENT Roblox Studio Play-mode 3D viewport captures of BBYA Mall. Be strict and spatially precise. The owner says the Mall still looks cheap/boxy and prior fixes were too source-driven. Judge only what is visibly rendered. Identify: giant blocking slabs/walls, storefronts hidden by geometry, intersecting signs/fascias, floating or protruding panels, oversized prompts/badges, dark dead zones, bad scale, incoherent tenant fronts, blocked circulation, escalator/elevator visual problems, and anything that still reads like Minecraft boxes rather than a premium mall. Compare entrance/atrium, L1 commerce tenants, rear L1, L2 NORTH/GLOW LAB, close GLOW LAB, upper circulation, and overview. Give a prioritized repair plan. Prefer deleting/replacing offending existing geometry over stacking new decorations. Do not change global Lighting, DJ/audio, VIP, fishing, or unrelated systems.
          '@
          $imgs=Get-ChildItem $outDir -Filter '*.jpg'|Sort-Object Name|ForEach-Object {$_.FullName}
          try {
            $args=@('exec','--ephemeral','-s','read-only','--color','never','-o',$report)
            foreach($img in $imgs){$args+=@('-i',$img)}
            $args+=$prompt
            & codex @args
            if($LASTEXITCODE -ne 0){throw "codex visual audit exit $LASTEXITCODE"}
          } catch {
            [IO.File]::WriteAllText($report,"VISUAL_ANALYSIS_UNAVAILABLE`n"+$_.Exception.Message)
          }

          $status=@{capturedAt=(Get-Date -Format o);runId=$env:GITHUB_RUN_ID;sourceCommit=$env:GITHUB_SHA;views=($views|ForEach-Object {$_.n});geometryLines=$marked.Count}|ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path $outDir 'audit.json'),$status)

          [BBYAWin]::SetForegroundWindow($hwnd)|Out-Null
          [System.Windows.Forms.SendKeys]::SendWait('+{F5}')
          Start-Sleep -Seconds 2

          git config user.name 'ACC BBYA Mall Auditor'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-mall-cloud-audit
          if(-not (git diff --cached --quiet)){git commit -m 'Record BBYA Mall cloud visual audit [skip ci]'}
          git pull --rebase origin main
          git push origin HEAD:main
