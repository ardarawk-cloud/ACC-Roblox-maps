name: BBYA QA Donation Notification TEST

on:
  push:
    branches:
      - 'bbya/qa/donation-notification-integrated-test-v1'
    paths:
      - '.github/workflows/bbya-qa-donation-notification-test-temp.yml'

permissions:
  contents: read

env:
  TARGET_SOURCE: a1a158dcc2edb81fb2845ce8d3c3b45263061c72
  TEST_UNIVERSE: '10762005984'
  TEST_PLACE: '124607344716828'

jobs:
  qa-test-publish:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Fetch exact integrated source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'bbya-qa-donation-source.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'bbya-qa-donation-source'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/$env:TARGET_SOURCE" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $repo=Get-ChildItem $dir -Directory | Select-Object -First 1
          if(-not $repo){throw 'Exact integrated source missing'}
          Get-ChildItem $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $repo.FullName -Force | ForEach-Object { Copy-Item $_.FullName $env:GITHUB_WORKSPACE -Recurse -Force }
          Write-Host "EXACT_INTEGRATED_SOURCE=$env:TARGET_SOURCE"

      - name: Static QA integrated checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $server='maps/bbya-social-hub/50-dj-wall-message.server.lua'
          $ui='maps/bbya-social-hub/119-support-purchase.client.lua'
          $sfx='maps/bbya-social-hub/137-donation-notification-sfx.client.lua'
          $project='maps/bbya-social-hub/default.project.json'
          foreach($p in @($server,$ui,$sfx,$project)){if(-not (Test-Path $p)){throw "Missing integrated file: $p"}}

          $a=Get-Content $server -Raw
          foreach($m in @('DonationNotification','BBYA_MonetizationReceipts_v1','BBYA_MonetizationUsers_v1','donationTotal','PurchaseId')){
            if(-not $a.Contains($m)){throw "Missing backend marker: $m"}
          }
          $receiptCount=([regex]::Matches($a,'MarketplaceService\.ProcessReceipt\s*=')).Count
          if($receiptCount -ne 1){throw "Expected exactly one ProcessReceipt assignment in authority file, found $receiptCount"}

          $u=Get-Content $ui -Raw
          foreach($m in @('BBYADonationNotificationUI','DonationNotification','GetUserThumbnailAsync')){
            if(-not $u.Contains($m)){throw "Missing popup marker: $m"}
          }

          $s=Get-Content $sfx -Raw
          foreach($m in @('DonationNotification','rbxassetid://1319346243','SoundService')){
            if(-not $s.Contains($m)){throw "Missing SFX marker: $m"}
          }
          foreach($bad in @('PromptProductPurchase','PromptProductPurchaseFinished','ProcessReceipt')){
            if($s.Contains($bad)){throw "Forbidden purchase trigger in SFX client: $bad"}
          }

          $pj=Get-Content $project -Raw
          $null=$pj | ConvertFrom-Json
          if(-not $pj.Contains('DonationNotificationSFXV1')){throw 'Donation SFX client not Rojo-mapped'}
          if(-not $pj.Contains('137-donation-notification-sfx.client.lua')){throw 'Donation SFX source path not Rojo-mapped'}
          Write-Host 'BBYA_QA_DONATION_STATIC_PASS'

      - name: Build exact integrated source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $toolDir=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rojo=Join-Path $toolDir 'rojo.exe'
          if(-not (Test-Path $rojo)){
            $z=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0.zip'
            Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $z
            Expand-Archive $z -DestinationPath $toolDir -Force
          }
          $version=& $rojo --version
          if($version -notmatch '7\.7\.0'){throw 'Rojo 7.7.0 required'}
          $out=Join-Path $env:RUNNER_TEMP 'bbya-qa-donation-notification-test.rbxl'
          & $rojo build 'maps/bbya-social-hub/default.project.json' -o $out
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw 'Build failed'}
          $bytes=(Get-Item $out).Length
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "BBYA_QA_BUILD=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BBYA_QA_BYTES=$bytes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BBYA_QA_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "BBYA_QA_DONATION_BUILD_PASS bytes=$bytes sha256=$sha"

      - name: Publish TEST place only
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ROBLOX_API_KEY){throw 'ROBLOX_OPEN_CLOUD_MASTER_V2 missing'}
          $url="https://apis.roblox.com/universes/v1/$env:TEST_UNIVERSE/places/$env:TEST_PLACE/versions?versionType=Published"
          $resp=& curl.exe --silent --show-error --fail-with-body --http1.1 --ipv4 --request POST --header "x-api-key: $env:ROBLOX_API_KEY" --header 'Content-Type: application/octet-stream' --header 'Expect:' --data-binary "@$env:BBYA_QA_BUILD" $url
          if($LASTEXITCODE -ne 0){throw 'TEST publish failed'}
          $r=$resp|ConvertFrom-Json
          if(-not $r.versionNumber){throw 'TEST versionNumber missing'}
          Write-Host "BBYA_QA_DONATION_TEST_PUBLISHED version=$($r.versionNumber) bytes=$env:BBYA_QA_BYTES sha256=$env:BBYA_QA_SHA256 candidate=$env:TARGET_SOURCE universe=$env:TEST_UNIVERSE place=$env:TEST_PLACE"
