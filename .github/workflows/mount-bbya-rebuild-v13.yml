name: MOUNT BBYA Runtime Rebuild v1.3

on:
  push:
    branches: [mount-bbya-runtime-rebuild-v13]
    paths:
      - 'maps/mount-bbya/mount-bbya.rebuild-v1.3.server.lua'
      - 'scripts/build-mount-bbya-rebuild-v13.js'
      - 'scripts/publish-mount-bbya-rebuild-v13.js'
      - '.github/workflows/mount-bbya-rebuild-v13.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mount-bbya-runtime-v13
  cancel-in-progress: false

jobs:
  build_validate_publish:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout exact v1.3 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Preflight v1.3
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/build-mount-bbya-rebuild-v13.js
          node --check scripts/publish-mount-bbya-rebuild-v13.js
          $runtime=Get-Content 'maps/mount-bbya/mount-bbya.rebuild-v1.3.server.lua' -Raw
          foreach($required in @('MOUNT_BBYA_REBUILD_V13','runtime-rebuild-v1.3','LOWLAND_FIRST_UPPER_ASYNC','MOUNT_BBYA_LOWLAND_READY','MOUNT_BBYA_FULL_READY','SELAMAT DATANG DI MOUNT BBYA')){
            if($runtime -notmatch [regex]::Escape($required)){throw "Missing v1.3 marker: $required"}
          }
          foreach($forbidden in @('ACC_MountainSocial','10744139279','82661754996018')){
            if($runtime -match [regex]::Escape($forbidden)){throw "Forbidden v1.3 marker: $forbidden"}
          }
          Write-Host 'MOUNT_BBYA_V13_PREFLIGHT_PASS'

      - name: Build v1.3 RBXLX
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/build-mount-bbya-rebuild-v13.js
          $place='maps/mount-bbya/place.rbxlx'
          if(-not (Test-Path $place)){throw 'v1.3 place missing'}
          if((Get-Item $place).Length -lt 26000){throw 'v1.3 place unexpectedly small'}
          $text=Get-Content $place -Raw
          try {[xml]$xml=$text}catch{throw "RBXLX XML parse failed: $($_.Exception.Message)"}
          foreach($required in @('MOUNT_BBYA_V13_Bootstrap','MOUNT_BBYA_V13_World','MOUNT_BBYA_V13_Release','MOUNT_BBYA_V13_MobileClient','runtime-rebuild-v1.3')){
            if($text -notmatch [regex]::Escape($required)){throw "Generated place missing: $required"}
          }
          if($text -match 'ACC_MountainSocial'){throw 'Legacy Mountain Social marker leaked'}
          Write-Host "MOUNT_BBYA_V13_BUILD_PASS bytes=$((Get-Item $place).Length)"

      - name: Publish MOUNT BBYA v1.3
        id: publish
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $log=Join-Path $env:RUNNER_TEMP 'mount-bbya-v13-publish.log'
          if(Test-Path $log){Remove-Item $log -Force}
          node scripts/publish-mount-bbya-rebuild-v13.js *> $log
          $code=$LASTEXITCODE
          if(Test-Path $log){Get-Content $log}
          "PUBLISH_EXIT_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if($code -ne 0){exit $code}

      - name: Persist v1.3 receipt
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'mount-bbya-v13-publish.log'
          $status=if($env:PUBLISH_EXIT_CODE -eq '0'){'PUBLISHED_CANDIDATE'}else{'FAILED'}
          $lines=@(
            "status=$status",
            'build=runtime-rebuild-v1.3',
            "sourceCommit=${{ github.sha }}",
            'branch=mount-bbya-runtime-rebuild-v13',
            'universeId=4187755690',
            'placeId=11832985967',
            'architecture=lowland-first-upper-async',
            'runtimeVisualQC=PENDING',
            "publishExitCode=$env:PUBLISH_EXIT_CODE"
          )
          if(Test-Path $log){$lines += (Get-Content $log | Select-Object -Last 10 | ForEach-Object {"log=$_"})}
          $raw=($lines -join "`n")+"`n"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/mount-bbya-rebuild-v13.txt"
          $sha=$null
          try{$e=Invoke-RestMethod -Headers $headers -Uri "$api`?ref=mount-bbya-runtime-rebuild-v13" -Method Get;$sha=$e.sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $payload=@{message='Record MOUNT BBYA v1.3 publish receipt [skip ci]';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($raw));branch='mount-bbya-runtime-rebuild-v13'}
          if($sha){$payload.sha=$sha}
          Invoke-RestMethod -Headers $headers -Uri $api -Method Put -ContentType 'application/json' -Body ($payload|ConvertTo-Json -Depth 5) | Out-Null
          Write-Host "MOUNT_BBYA_V13_RECEIPT=$status"

      - name: Enforce publish
        if: always()
        shell: powershell
        run: |
          if($env:PUBLISH_EXIT_CODE -ne '0'){throw 'MOUNT BBYA v1.3 publish failed'}
          Write-Host 'MOUNT_BBYA_V13_PUBLISH_PASS'
