name: After School City V0.5.2 Runtime Hard Cleanup QC

on:
  push:
    branches: [after-school-city/scaffold-v1]
    paths:
      - 'maps/after-school-city/after-school-city.runtime-hard-cleanup.server.lua'
      - '.github/scripts/after-school-city-runtime-hard-cleanup-audit.ps1'
      - '.github/workflows/after-school-city-v052-runtime-hard-cleanup-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/after-school-city/after-school-city.runtime-hard-cleanup.server.lua'
      - '.github/scripts/after-school-city-runtime-hard-cleanup-audit.ps1'
      - '.github/workflows/after-school-city-v052-runtime-hard-cleanup-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: V0.5.2 component audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-runtime-hard-cleanup-audit.ps1'

      - name: V0.5.2 component authority locks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $registry = Get-Content 'maps/registry.json' -Raw | ConvertFrom-Json
          $target = $registry.maps.'after-school-city'
          if(-not $target){throw 'after-school-city registry target missing'}
          if([string]$target.universeId -ne '10745359869'){throw "Wrong Universe ID: $($target.universeId)"}
          if([string]$target.placeId -ne '121603385909425'){throw "Wrong Place ID: $($target.placeId)"}
          if($target.enabled -ne $false){throw 'Development target must remain registry enabled=false'}

          $config = Get-Content 'maps/after-school-city/after-school-city.config.lua' -Raw
          $project = Get-Content 'maps/after-school-city/default.project.json' -Raw
          $runtime = Get-Content 'maps/after-school-city/after-school-city.runtime-hard-cleanup.server.lua' -Raw
          $intro = Get-Content 'maps/after-school-city/after-school-city.intro.client.lua' -Raw
          $null = $project | ConvertFrom-Json

          foreach($token in @('RuntimeReconcileVersion = "0.5.1-runtime-reconcile-1"','RuntimeHardCleanupVersion = "0.5.2-runtime-hard-cleanup-1"','EnableRuntimeReconcilePass = true','EnableRuntimeHardCleanupPass = true','EnableActivities = false','EnableEconomy = false','EnablePersistence = false')){
            if($config -notmatch [regex]::Escape($token)){throw "Config component marker missing: $token"}
          }
          foreach($token in @('ASC_RuntimeReconcile','ASC_RuntimeHardCleanup','after-school-city.runtime-reconcile.server.lua','after-school-city.runtime-hard-cleanup.server.lua')){
            if($project -notmatch [regex]::Escape($token)){throw "Project marker missing: $token"}
          }
          foreach($token in @('V052_RuntimeHardCleanup','ASC_SchoolAxisGroundObstructionsPurged','ASC_StudentRowEntranceEnvelopesClear','ASC_DowntownInteriorHardClamped','ASC_SkateSignDeduplicated','ASC_DowntownWayfindingDeduplicated')){
            if($runtime -notmatch [regex]::Escape($token)){throw "Runtime hard cleanup marker missing: $token"}
          }
          foreach($token in @('PUTU AZYA PUTRI','BINTANG HARDAJAYA','WITH LOVE, DAD','ENTER THE CITY')){
            if($intro -notmatch [regex]::Escape($token)){throw "Dedication lock missing: $token"}
          }
          if($runtime -match 'MarketplaceService|PromptProductPurchase|ProcessReceipt|DataStoreService'){throw 'V0.5.2 component must not contain monetization/persistence authority'}
          if($runtime -match 'BillboardGui'){throw 'V0.5.2 component must not introduce BillboardGui'}
          Write-Host 'AFTER SCHOOL CITY v0.5.2 component authority locks PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojoExe=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0-v052-component'
            $zip=Join-Path $env:RUNNER_TEMP 'asc-rojo-7.7.0-v052-component.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojoExe=$exe.FullName
          }
          $version=& $rojoExe --version
          Write-Host $version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          if(($version -join ' ') -notmatch '7\.7\.0'){throw "Expected Rojo 7.7.0, got $version"}
          "ROJO_EXE=$rojoExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build current map with V0.5.2 component
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'after-school-city-current-v052-component.rbxl'
          & $env:ROJO_EXE build 'maps/after-school-city/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
          if(-not (Test-Path $place)){throw 'Generated RBXL missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw "Generated RBXL suspiciously small: $bytes bytes"}
          $sha=(Get-FileHash -Algorithm SHA256 $place).Hash.ToLowerInvariant()
          Write-Host "AFTER SCHOOL CITY V0.5.2 COMPONENT REGRESSION PASS - current build $bytes bytes - sha256=$sha"
