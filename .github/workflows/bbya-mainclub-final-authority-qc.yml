name: BBYA Main Club Final Authority QC

on:
  pull_request:
    paths:
      - 'maps/bbya-social-hub/43-floor1-front-premium.server.lua'
      - 'maps/bbya-social-hub/67-photo-studio-lighting.server.lua'
      - 'maps/bbya-social-hub/117-club-purity-mall-studios.server.lua'
      - '.github/workflows/bbya-mainclub-final-authority-qc.yml'
  workflow_dispatch:

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/bin/rojo
          key: rojo-7.7.0-linux
      - name: Install Rojo
        run: |
          if [ ! -x "$HOME/.local/bin/rojo" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -L --fail -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
            unzip -o /tmp/rojo.zip -d "$HOME/.local/bin"
            chmod +x "$HOME/.local/bin/rojo"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build BBYA place
        run: rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-final-authority.rbxl
      - name: Validate source-purity authority v2
        shell: bash
        run: |
          set -euo pipefail
          FRONT='maps/bbya-social-hub/43-floor1-front-premium.server.lua'
          AUTH='maps/bbya-social-hub/67-photo-studio-lighting.server.lua'

          grep -q 'FRONT-OF-HOUSE PREMIUM PASS v2' "$FRONT"
          grep -q 'SalonInMall' "$FRONT"
          grep -q 'PhotoStudioInMall' "$FRONT"
          grep -q '03_PhotoArea' "$FRONT"
          grep -q '04_SalonLookStudio' "$FRONT"
          ! grep -q 'local photo=model("PhotoAreaPremium")' "$FRONT"
          ! grep -q 'local salon=model("SalonLookStudioPremium")' "$FRONT"
          ! grep -q 'ProductShelf' "$FRONT"
          ! grep -q 'CameraPedestal' "$FRONT"

          grep -q 'MAIN CLUB FINAL AUTHORITY v2' "$AUTH"
          grep -q 'MainClubFinalAuthorityV2' "$AUTH"
          grep -q 'SalonLookStudioPremium' "$AUTH"
          grep -q 'PhotoAreaPremium' "$AUTH"
          grep -q 'RearSocialRail' "$AUTH"
          grep -q 'RearCocktail_' "$AUTH"
          grep -q 'DJBoothGroundedBase' "$AUTH"
          grep -q 'PureClubFrontExtension' "$AUTH"
          grep -q 'LookLabAvatarEditorV1' "$AUTH"
          grep -q 'ClubPurityMallStudiosV1' "$AUTH"
          grep -q 'DJRequestInteract' "$AUTH"
          grep -q 'DescendantAdded' "$AUTH"
          ! grep -q 'PHOTO STUDIO LIGHTING UPGRADE' "$AUTH"
          ! grep -q 'KeySoftbox' "$AUTH"
          ! grep -q 'OverheadStudioPanel' "$AUTH"
          ! grep -Eq 'Lighting\.(Brightness|ExposureCompensation|Ambient|OutdoorAmbient)' "$AUTH"
          ! grep -Eq 'SoundId|SoundGroup|TimePosition' "$AUTH"
          test -s /tmp/bbya-final-authority.rbxl
