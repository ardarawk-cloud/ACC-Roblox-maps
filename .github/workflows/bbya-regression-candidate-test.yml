name: BBYA Regression Candidate Test

on:
  push:
    branches:
      - fix/bbya-main-audio-underground-darklock-v5
    paths:
      - 'maps/bbya-social-hub/**'
      - 'maps/registry.json'
      - '.github/workflows/bbya-regression-candidate-test.yml'

permissions:
  contents: read

jobs:
  build-publish-test:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate archive without Git
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP ("bbya-source-"+$env:GITHUB_SHA+".zip")
          $extract=Join-Path $env:RUNNER_TEMP ("bbya-source-"+$env:GITHUB_SHA)
          if(Test-Path $zip){Remove-Item $zip -Force}
          if(Test-Path $extract){Remove-Item $extract -Recurse -Force}
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          $uri="https://codeload.github.com/ardarawk-cloud/ACC-Roblox-maps/zip/$env:GITHUB_SHA"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $zip
          if(-not (Test-Path $zip) -or (Get-Item $zip).Length -lt 1024){throw 'Exact source archive missing or unexpectedly small'}
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $sourceRoot=Get-ChildItem $extract -Directory | Select-Object -First 1
          if(-not $sourceRoot){throw 'Extracted source root missing'}
          Get-ChildItem $env:GITHUB_WORKSPACE -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $sourceRoot.FullName -Force | ForEach-Object { Copy-Item $_.FullName -Destination $env:GITHUB_WORKSPACE -Recurse -Force }
          if(-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'maps\bbya-social-hub\default.project.json'))){throw 'Candidate project missing after archive extraction'}
          Write-Host "BBYA_EXACT_SOURCE_ARCHIVE_PASS source=$env:GITHUB_SHA bytes=$((Get-Item $zip).Length)"

      - name: Verify isolated test target
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $reg=Get-Content 'maps/registry.json' -Raw | ConvertFrom-Json
          $target=$reg.maps.'bbya-music-test'
          if(-not $target){throw 'bbya-music-test target missing'}
          if([string]$target.universeId -ne '10762005984'){throw 'Unexpected test universe'}
          if([string]$target.placeId -ne '124607344716828'){throw 'Unexpected test place'}
          Write-Host 'BBYA_REGRESSION_TEST_TARGET_LOCK_PASS'

      - name: Verify audio and lighting hard locks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $legacy=Get-Content 'maps/bbya-social-hub/81-basement-audio-ui.client.lua' -Raw
          $router=Get-Content 'maps/bbya-social-hub/104-venue-audio-router.client.lua' -Raw
          $builder=Get-Content 'maps/bbya-social-hub/74-basement-premium-upgrade.server.lua' -Raw
          $dark=Get-Content 'maps/bbya-social-hub/87-basement-full-upgrade.server.lua' -Raw
          if($legacy -match '(?m)\.Volume\s*='){throw 'Legacy 81 still writes audio volume'}
          if($legacy -notmatch 'BBYALegacyVolumeWriterDisabled'){throw 'Legacy volume-writer disable marker missing'}
          if($router -notmatch 'ROUTER_V9_EQ_ONLY'){throw 'Router v9 authority missing'}
          if($router -notmatch 'BBYAFunkotHardGateV9'){throw 'Funkot hard gate v9 missing'}
          if($builder -notmatch 'DARK_SAFE_V3'){throw 'Underground dark-safe builder marker missing'}
          if($builder -match 'GetService\("Lighting"\)'){throw 'Underground builder must not own global Lighting'}
          if($dark -notmatch 'DARK_UNDERGROUND_V6_SLIGHT_LIFT'){throw 'Underground final dark lock missing'}
          Write-Host 'BBYA_REGRESSION_STATIC_QC_PASS audio=router_v9_only underground=dark_safe_plus_v4_lock'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){
            $rojo=$cmd.Source
          } else {
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-regression-rojo-7.7.0'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-regression-rojo-7.7.0.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            if(Test-Path $zip){Remove-Item $zip -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojo=$exe.FullName
          }
          & $rojo --version
          if($LASTEXITCODE -ne 0){throw 'Rojo version check failed'}
          "ROJO_EXE=$rojo" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact BBYA candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:GITHUB_WORKSPACE 'BBYA-REGRESSION-CANDIDATE.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw 'Rojo candidate build failed'}
          if(-not (Test-Path $place)){throw 'Candidate RBXL missing'}
          if((Get-Item $place).Length -lt 1024){throw 'Candidate RBXL unexpectedly small'}
          $hash=(Get-FileHash -Algorithm SHA256 $place).Hash.ToLower()
          "$hash  BBYA-REGRESSION-CANDIDATE.rbxl" | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'BBYA-REGRESSION-CANDIDATE.sha256') -Encoding ascii
          Write-Host "BBYA_REGRESSION_BUILD_PASS source=${{ github.sha }} bytes=$((Get-Item $place).Length) sha256=$hash"

      - name: Publish exact candidate to BBYA Music UI Test
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_MASTER_V2 }}
          PUBLISH_RECEIPT_DIR: deploy-status-test
          PLACE_FILE_OVERRIDE: ${{ github.workspace }}\BBYA-REGRESSION-CANDIDATE.rbxl
        run: |
          $ErrorActionPreference='Stop'
          node scripts/publish-map.js bbya-music-test
          if($LASTEXITCODE -ne 0){throw 'Roblox test publish failed'}
          $receipt=Join-Path $env:GITHUB_WORKSPACE 'deploy-status-test\bbya-music-test.json'
          if(-not (Test-Path $receipt)){throw 'Publish receipt missing'}
          $r=Get-Content $receipt -Raw | ConvertFrom-Json
          if($r.status -ne 'PUBLISHED'){throw 'Receipt status is not PUBLISHED'}
          if($r.mapId -ne 'bbya-music-test'){throw 'Receipt map mismatch'}
          if([string]$r.universeId -ne '10762005984'){throw 'Receipt universe mismatch'}
          if([string]$r.placeId -ne '124607344716828'){throw 'Receipt place mismatch'}
          if($r.sourceCommit -ne '${{ github.sha }}'){throw "Receipt source mismatch: $($r.sourceCommit)"}
          Get-Content $receipt
          Write-Host "BBYA_REGRESSION_TEST_RECEIPT_PASS version=$($r.response.versionNumber) source=$($r.sourceCommit)"

      - name: Upload candidate proof
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-REGRESSION-CANDIDATE
          path: |
            BBYA-REGRESSION-CANDIDATE.rbxl
            BBYA-REGRESSION-CANDIDATE.sha256
            deploy-status-test/bbya-music-test.json
          retention-days: 7
