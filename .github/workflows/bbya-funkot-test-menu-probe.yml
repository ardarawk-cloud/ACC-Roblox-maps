name: BBYA Funkot Test Menu Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-funkot-test-menu-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure Studio is open
        shell: powershell
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win32Focus {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
          }
          '@
          function Get-StudioWindow {
            Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne 0 } |
              Sort-Object StartTime -Descending | Select-Object -First 1
          }
          $proc=Get-StudioWindow
          if(-not $proc){
            $roots=@((Join-Path $env:LOCALAPPDATA 'Roblox\Versions'),'C:\Program Files\Roblox\Versions','C:\Program Files (x86)\Roblox\Versions')
            $exe=$null
            foreach($r in $roots){
              if(-not (Test-Path $r)){continue}
              $c=Get-ChildItem $r -Filter RobloxStudioBeta.exe -File -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if($c){$exe=$c.FullName;break}
            }
            if(-not $exe){throw 'RobloxStudioBeta.exe not found'}
            Start-Process -FilePath $exe -ArgumentList '--task','EditPlace','--placeId','131894120482837','--universeId','8116636513'
            $deadline=(Get-Date).AddSeconds(60)
            do{Start-Sleep -Seconds 2;$proc=Get-StudioWindow}while(-not $proc -and (Get-Date)-lt $deadline)
            if(-not $proc){throw 'Studio launched but no main window'}
            Start-Sleep -Seconds 15
          }
          [Win32Focus]::ShowWindow([IntPtr]$proc.MainWindowHandle,9)|Out-Null
          [Win32Focus]::SetForegroundWindow([IntPtr]$proc.MainWindowHandle)|Out-Null
          Start-Sleep -Milliseconds 700

      - name: Open Test menu and dump UI
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $lines=New-Object System.Collections.Generic.List[string]
          $lines.Add("timestamp=$(Get-Date -Format o)")
          $proc=Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0} | Sort-Object StartTime -Descending | Select-Object -First 1
          if(-not $proc){throw 'Studio not found'}
          $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
          $cond=New-Object System.Windows.Automation.AndCondition(
            (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::MenuItem)),
            (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty,'Test'))
          )
          $test=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$cond)
          $lines.Add("TEST_FOUND=$($test -ne $null)")
          if($test){
            try{$p=$test.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern);$p.Invoke();$lines.Add('TEST_OPEN=INVOKE')}
            catch{try{$p=$test.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern);$p.Expand();$lines.Add('TEST_OPEN=EXPAND')}catch{$lines.Add("TEST_OPEN_ERROR=$($_.Exception.Message)")}}
            Start-Sleep -Milliseconds 900
          }
          $desktop=[System.Windows.Automation.AutomationElement]::RootElement
          $all=$desktop.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          for($i=0;$i -lt [Math]::Min($all.Count,3000);$i++){
            $el=$all.Item($i)
            try{
              $name=$el.Current.Name;$aid=$el.Current.AutomationId;$ct=$el.Current.ControlType.ProgrammaticName
              if(($ct -match 'MenuItem|Button') -and ($name -or $aid)){
                if($name -match 'Play|Run|Stop|Test|Start|Server|Player|Pause|Resume' -or $aid -match 'play|run|stop|test|start|pause'){
                  $r=$el.Current.BoundingRectangle
                  $lines.Add(("{0}|Name={1}|Id={2}|Enabled={3}|Offscreen={4}|Rect={5},{6},{7},{8}" -f $ct,$name,$aid,$el.Current.IsEnabled,$el.Current.IsOffscreen,[int]$r.X,[int]$r.Y,[int]$r.Width,[int]$r.Height))
                }
              }
            }catch{}
          }
          $text=($lines-join "`n")+"`n"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28";"User-Agent"="BBYA-Studio-Worker"}
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/deploy-status/bbya-funkot-test-menu-probe.txt"
          $sha=$null
          try{$sha=(Invoke-RestMethod -Method Get -Uri $api -Headers $headers).sha}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $body=@{message='Record Funkot Test menu probe [skip ci]';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text));branch='main'}
          if($sha){$body.sha=$sha}
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body|ConvertTo-Json) -ContentType 'application/json'|Out-Null
