name: BBYA Release Gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character MAIN commit SHA already staged in Test Lab'
        required: true
        type: string
      scope:
        description: 'Only this BBYA dependency scope may differ from the golden baseline'
        required: true
        type: choice
        options:
          - baseline-recovery
          - identity
          - underground
          - funkot
          - entrance-cars
          - mall
          - staff-tower
      runtime_qc_run_id:
        description: 'Successful BBYA Runtime QC Stage workflow run ID for this exact source/scope'
        required: true
        type: string
      runtime_qc_confirmation:
        description: 'After checking that exact Test Lab candidate, type RUNTIME_QC_PASS'
        required: true
        type: string
      confirmation:
        description: 'Type PUBLISH_BBYA_LIVE to authorize the single live publish'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: bbya-live-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require explicit runtime and live confirmations
        env:
          RUNTIME_QC_CONFIRMATION: ${{ inputs.runtime_qc_confirmation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNTIME_QC_CONFIRMATION" != "RUNTIME_QC_PASS" ]]; then
            echo 'DENIED: runtime_qc_confirmation must be exactly RUNTIME_QC_PASS'
            exit 2
          fi
          if [[ "$CONFIRMATION" != "PUBLISH_BBYA_LIVE" ]]; then
            echo 'DENIED: confirmation must be exactly PUBLISH_BBYA_LIVE'
            exit 3
          fi

      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify candidate is exact current MAIN
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'DENIED: source_sha must be an exact 40-character commit SHA'
            exit 4
          fi
          git fetch origin main --depth=1
          checked_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          echo "requested=$SOURCE_SHA"
          echo "checked=$checked_sha"
          echo "main=$main_sha"
          test "${SOURCE_SHA,,}" = "${checked_sha,,}"
          if [[ "${SOURCE_SHA,,}" != "${main_sha,,}" ]]; then
            echo 'DENIED: requested SHA is not current MAIN; stale/historical publish is forbidden'
            exit 5
          fi

      - name: Fetch golden baseline and enforce isolated scope
        env:
          SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin bbya-golden-baseline:refs/remotes/origin/bbya-golden-baseline --depth=200
          python3 scripts/bbya-scope-guard.py \
            --scope "$SCOPE" \
            --baseline-ref origin/bbya-golden-baseline \
            --candidate-ref HEAD

      - name: Verify locked BBYA live identity
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.maps["a-club"].enabled == true' maps/registry.json >/dev/null
          test "$(jq -r '.maps["a-club"].universeId' maps/registry.json)" = '8116636513'
          test "$(jq -r '.maps["a-club"].placeId' maps/registry.json)" = '131894120482837'
          test "$(jq -r '.maps["a-club-test"].placeId' maps/registry.json)" = '124607344716828'
          test -s maps/bbya-social-hub/default.project.json
          echo 'BBYA identity lock: PASS'

      - name: Verify exact successful Test Lab stage and download evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SCOPE: ${{ inputs.scope }}
          RUN_ID: ${{ inputs.runtime_qc_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'DENIED: runtime_qc_run_id must be numeric'
            exit 6
          fi
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          run_json="$(curl -fsSL "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
          test "$(jq -r '.event' <<<"$run_json")" = 'workflow_dispatch'
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$SOURCE_SHA"
          test "$(jq -r '.path' <<<"$run_json")" = '.github/workflows/bbya-runtime-qc-stage.yml'

          artifacts="$(curl -fsSL "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          artifact_name="bbya-runtime-qc-$SOURCE_SHA"
          artifact_id="$(jq -r --arg n "$artifact_name" '.artifacts[] | select(.name==$n and .expired==false) | .id' <<<"$artifacts" | head -n1)"
          if [[ -z "$artifact_id" || "$artifact_id" == 'null' ]]; then
            echo "DENIED: exact runtime-QC artifact $artifact_name not found"
            exit 7
          fi
          mkdir -p /tmp/bbya-stage-evidence
          curl -fsSL -L "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o /tmp/bbya-stage.zip
          unzip -q /tmp/bbya-stage.zip -d /tmp/bbya-stage-evidence
          test "$(tr -d '\r\n' </tmp/bbya-stage-evidence/source-sha.txt)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' </tmp/bbya-stage-evidence/scope.txt)" = "$SCOPE"
          test "$(jq -r '.status' /tmp/bbya-stage-evidence/a-club-test.json)" = 'PUBLISHED'
          test "$(jq -r '.placeId' /tmp/bbya-stage-evidence/a-club-test.json)" = '124607344716828'
          echo 'Exact Test Lab stage evidence: PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Rojo binary
        id: rojo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}

      - name: Install canonical Roblox serializer
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked

      - name: Verify Rojo
        run: rojo --version

      - name: Rebuild exact live candidate and match staged package
        shell: bash
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-release-candidate.rbxl
          test -s /tmp/bbya-release-candidate.rbxl
          live_hash="$(sha256sum /tmp/bbya-release-candidate.rbxl | awk '{print $1}')"
          stage_hash="$(awk '{print $1}' /tmp/bbya-stage-evidence/bbya-runtime-qc-candidate.sha256)"
          echo "stage_hash=$stage_hash"
          echo "live_hash=$live_hash"
          if [[ "$live_hash" != "$stage_hash" ]]; then
            echo 'DENIED: rebuilt live package differs from the package tested in Test Lab'
            exit 8
          fi
          printf '%s  %s\n' "$live_hash" /tmp/bbya-release-candidate.rbxl > /tmp/bbya-release-candidate.sha256

      - name: Publish through canonical BBYA gate once
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
          PUBLISH_RECEIPT_DIR: deploy-status
          PLACE_FILE_OVERRIDE: /tmp/bbya-release-candidate.rbxl
          BBYA_RELEASE_GATE: BBYA_SINGLE_GATE_V1
          BBYA_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/publish-map.js a-club

      - name: Verify exact-source live receipt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy-status/a-club.json
          test "$(jq -r '.status' deploy-status/a-club.json)" = 'PUBLISHED'
          test "$(jq -r '.sourceCommit' deploy-status/a-club.json)" = "$SOURCE_SHA"
          test "$(jq -r '.universeId' deploy-status/a-club.json)" = '8116636513'
          test "$(jq -r '.placeId' deploy-status/a-club.json)" = '131894120482837'
          echo 'Exact-source live release receipt: PASS'

      - name: Advance read-only golden baseline only after verified live publish
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          old="$(git rev-parse origin/bbya-golden-baseline)"
          git push origin "$SOURCE_SHA:refs/heads/bbya-golden-baseline" --force-with-lease="refs/heads/bbya-golden-baseline:$old"
          echo "Golden baseline advanced: $old -> $SOURCE_SHA"

      - name: Preserve live release evidence without mutating MAIN
        uses: actions/upload-artifact@v4
        with:
          name: bbya-release-${{ inputs.source_sha }}
          path: |
            deploy-status/a-club.json
            /tmp/bbya-release-candidate.sha256
          if-no-files-found: error
          retention-days: 90
