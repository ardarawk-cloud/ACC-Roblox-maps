name: BBYA Publish Main

on:
  push:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/**'
      - 'maps/bbya-social-hub-client/**'
      - 'maps/bbya-social-hub-assets/cars/**'
      - 'shared/**'
      - '.github/workflows/bbya-release-gate.yml'
      - '.github/bbya-release-policy.json'
      - 'scripts/bbya-scope-guard.py'
      - 'scripts/publish-map.js'
      - 'maps/registry.json'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character BBYA MAIN source SHA to publish'
        required: true
        type: string
      scope:
        description: 'Only this BBYA dependency scope may differ from the golden baseline'
        required: true
        type: choice
        options:
          - baseline-recovery
          - identity
          - main-club
          - underground
          - funkot
          - travel
          - dance
          - entrance-cars
          - mall
          - staff-tower
      confirmation:
        description: 'Type PUBLISH_BBYA_MAIN to publish directly to the live BBYA place'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bbya-main-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
    steps:
      - name: Require confirmation only for manual publish
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "PUBLISH_BBYA_MAIN" ]]; then
            echo 'DENIED: confirmation must be exactly PUBLISH_BBYA_MAIN'
            exit 2
          fi

      - name: Checkout exact BBYA source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify source is current MAIN modulo receipt-only bot churn
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'DENIED: source SHA must be an exact 40-character commit SHA'
            exit 3
          fi
          checked_sha="$(git rev-parse HEAD)"
          test "${SOURCE_SHA,,}" = "${checked_sha,,}"
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo 'DENIED: source is not an ancestor of current MAIN'
            exit 4
          }
          mapfile -t churn < <(git diff --name-only "$SOURCE_SHA..origin/main")
          for p in "${churn[@]}"; do
            [[ -z "$p" ]] && continue
            if [[ "$p" != deploy-status/* ]]; then
              echo "DENIED: MAIN changed after source outside receipt metadata: $p"
              exit 5
            fi
          done
          echo "publish_source=$SOURCE_SHA"
          echo "current_main=$(git rev-parse origin/main)"
          echo 'MAIN source freshness: PASS'

      - name: Fetch golden baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin bbya-golden-baseline:refs/remotes/origin/bbya-golden-baseline
          echo "golden=$(git rev-parse origin/bbya-golden-baseline)"

      - name: Resolve exactly one isolated scope
        id: scope
        env:
          MANUAL_SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            scope="$MANUAL_SCOPE"
          else
            pass=()
            for candidate in baseline-recovery identity main-club underground funkot travel dance entrance-cars mall staff-tower; do
              if python3 scripts/bbya-scope-guard.py \
                --scope "$candidate" \
                --baseline-ref origin/bbya-golden-baseline \
                --candidate-ref HEAD >"/tmp/bbya-guard-${candidate}.log" 2>&1; then
                pass+=("$candidate")
              fi
            done
            if [[ ${#pass[@]} -ne 1 ]]; then
              echo "DENIED: expected exactly one BBYA scope to pass; got ${#pass[@]}: ${pass[*]:-none}"
              for candidate in baseline-recovery identity main-club underground funkot travel dance entrance-cars mall staff-tower; do
                echo "----- $candidate -----"
                cat "/tmp/bbya-guard-${candidate}.log" || true
              done
              exit 6
            fi
            scope="${pass[0]}"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Resolved BBYA scope: $scope"

      - name: Enforce BBYA isolated scope and locked invariants
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bbya-scope-guard.py \
            --scope "$SCOPE" \
            --baseline-ref origin/bbya-golden-baseline \
            --candidate-ref HEAD

      - name: Verify locked live target
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.maps["a-club"].enabled == true' maps/registry.json >/dev/null
          test "$(jq -r '.maps["a-club"].universeId' maps/registry.json)" = '8116636513'
          test "$(jq -r '.maps["a-club"].placeId' maps/registry.json)" = '131894120482837'
          test -s maps/bbya-social-hub/default.project.json
          echo 'BBYA live target lock: PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Rojo binary
        id: rojo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.7.0-${{ runner.os }}

      - name: Install canonical Roblox serializer
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install rojo --version 7.7.0 --locked

      - name: Verify Rojo
        run: rojo --version

      - name: Build exact MAIN candidate
        shell: bash
        run: |
          set -euo pipefail
          rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-main-candidate.rbxl
          test -s /tmp/bbya-main-candidate.rbxl
          sha256sum /tmp/bbya-main-candidate.rbxl | tee /tmp/bbya-main-candidate.sha256
          ls -lh /tmp/bbya-main-candidate.rbxl

      - name: Publish directly to BBYA MAIN once
        env:
          ROBLOX_API_KEY: ${{ secrets.AM_STUDIO }}
          PUBLISH_RECEIPT_DIR: deploy-status
          PLACE_FILE_OVERRIDE: /tmp/bbya-main-candidate.rbxl
          BBYA_RELEASE_GATE: BBYA_SINGLE_GATE_V1
          BBYA_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: node scripts/publish-map.js a-club

      - name: Verify exact-source live receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy-status/a-club.json
          test "$(jq -r '.status' deploy-status/a-club.json)" = 'PUBLISHED'
          test "$(jq -r '.sourceCommit' deploy-status/a-club.json)" = "$SOURCE_SHA"
          test "$(jq -r '.universeId' deploy-status/a-club.json)" = '8116636513'
          test "$(jq -r '.placeId' deploy-status/a-club.json)" = '131894120482837'
          echo 'BBYA MAIN exact-source receipt: PASS'

      - name: Advance golden baseline only after verified MAIN publish
        shell: bash
        run: |
          set -euo pipefail
          old="$(git rev-parse origin/bbya-golden-baseline)"
          git push origin "$SOURCE_SHA:refs/heads/bbya-golden-baseline" --force-with-lease="refs/heads/bbya-golden-baseline:$old"
          echo "Golden baseline advanced: $old -> $SOURCE_SHA"

      - name: Preserve MAIN publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: bbya-main-${{ env.SOURCE_SHA }}
          path: |
            deploy-status/a-club.json
            /tmp/bbya-main-candidate.sha256
          if-no-files-found: error
          retention-days: 90
