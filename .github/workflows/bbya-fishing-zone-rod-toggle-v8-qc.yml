name: BBYA Fishing Zone + Rod Toggle v8 QC

on:
  push:
    branches: [fix/bbya-fishing-zone-rod-toggle-v8]
    paths:
      - 'maps/bbya-social-hub/122-fishing-ui.client.lua'
      - 'maps/bbya-social-hub/124-fishing-core.server.lua'
      - 'maps/bbya-social-hub/130-fishing-gate-v6.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-fishing-zone-rod-toggle-v8-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/122-fishing-ui.client.lua'
      - 'maps/bbya-social-hub/124-fishing-core.server.lua'
      - 'maps/bbya-social-hub/130-fishing-gate-v6.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-fishing-zone-rod-toggle-v8-qc.yml'

jobs:
  qc:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 12
    steps:
      - name: Checkout fishing v8 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Static fishing-only checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Require([string]$text,[string]$pattern,[string]$message){if($text -notmatch $pattern){throw $message}}
          function Forbid([string]$text,[string]$pattern,[string]$message){if($text -match $pattern){throw $message}}

          $uiPath='maps/bbya-social-hub/122-fishing-ui.client.lua'
          $corePath='maps/bbya-social-hub/124-fishing-core.server.lua'
          $gatePath='maps/bbya-social-hub/130-fishing-gate-v6.client.lua'
          $projectPath='maps/bbya-social-hub/default.project.json'
          foreach($p in @($uiPath,$corePath,$gatePath,$projectPath)){if(-not (Test-Path $p)){throw "Missing $p"}}

          $ui=Get-Content $uiPath -Raw
          $core=Get-Content $corePath -Raw
          $gate=Get-Content $gatePath -Raw
          $project=Get-Content $projectPath -Raw
          $null=$project | ConvertFrom-Json

          Require $ui 'VisibilityOwnedByGateV6' 'Base fishing UI did not delegate visibility to v6 gate authority'
          Require $ui 'ToggleRod' 'Rod toggle client action missing'
          Require $ui 'b\.Text="STOW"' 'Rod STOW state missing'
          Require $ui 'b\.Text="HOLD"' 'Rod HOLD state missing'
          Forbid $ui 'ENABLE_RADIUS\s*=\s*232' 'Legacy wide-radius UI authority still present'
          Forbid $ui 'gui\.Enabled\s*=\s*near' 'Legacy base UI still writes fishing visibility'

          Require $core 'action=="ToggleRod"' 'Server rod toggle action missing'
          Require $core 'held=heldName==s\.name' 'Held rod state missing from snapshot'
          Require $core 'Pilih rod di menu ROD dulu' 'CAST still auto-equips a rod instead of requiring selection'
          Require $core 'rod\.Parent=bag' 'Rod stow path missing'
          Require $gate 'GATE_Z\s*=\s*687\.5' 'Lake gate threshold changed unexpectedly'
          Require $gate 'BindToRenderStep\("BBYAFishingGateAuthorityV6"' 'Single gate visibility authority missing'
          Require $project '122-fishing-ui\.client\.lua' 'Base fishing UI mount missing'
          Require $project '124-fishing-core\.server\.lua' 'Fishing core mount missing'
          Require $project '130-fishing-gate-v6\.client\.lua' 'Fishing gate v6 mount missing'

          $changed=(git diff --name-only origin/main...HEAD)
          $allowed=@(
            'maps/bbya-social-hub/122-fishing-ui.client.lua',
            'maps/bbya-social-hub/124-fishing-core.server.lua',
            '.github/workflows/bbya-fishing-zone-rod-toggle-v8-qc.yml'
          )
          foreach($file in $changed){if($allowed -notcontains $file){throw "Out-of-scope file changed: $file"}}

          $coreDiff=(git diff --unified=0 origin/main...HEAD -- $corePath | Out-String)
          if($coreDiff -match '(?m)^[+-].*chance\s*='){throw 'Fishing chance/probability was modified'}
          if($coreDiff -match '(?m)^[+-].*VALUE_MULT'){throw 'Fishing economy multiplier was modified'}
          if($coreDiff -match '(?m)^[+-].*DataStoreService'){throw 'Fishing datastore ownership changed'}

          Write-Host 'Fishing zone + rod toggle v8 static QC PASS'

      - name: Prepare Rojo 7.7.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Get-Command rojo -ErrorAction SilentlyContinue
          if($cmd){$rojoExe=$cmd.Source}else{
            $dir=Join-Path $env:RUNNER_TEMP 'bbya-rojo-7.7.0-fishing-v8'
            $zip=Join-Path $env:RUNNER_TEMP 'bbya-rojo-7.7.0-fishing-v8.zip'
            if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe=Get-ChildItem $dir -Filter rojo.exe -File -Recurse | Select-Object -First 1
            if(-not $exe){throw 'rojo.exe not found'}
            $rojoExe=$exe.FullName
          }
          & $rojoExe --version
          if($LASTEXITCODE -ne 0){throw "Rojo version check failed: $LASTEXITCODE"}
          "ROJO_EXE=$rojoExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Full canonical BBYA build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:RUNNER_TEMP 'bbya-fishing-zone-rod-v8-qc.rbxl'
          & $env:ROJO_EXE build 'maps/bbya-social-hub/default.project.json' -o $place
          if($LASTEXITCODE -ne 0){throw "Rojo build failed: $LASTEXITCODE"}
          if(-not (Test-Path $place)){throw 'Built place missing'}
          $bytes=(Get-Item $place).Length
          if($bytes -lt 1024){throw "Built place unexpectedly small: $bytes bytes"}
          Write-Host "BBYA FISHING ZONE + ROD TOGGLE V8 QC PASS - canonical build: $bytes bytes"
