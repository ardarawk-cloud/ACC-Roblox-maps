name: BBYA Fishing Visual Index v7 Hosted QC

on:
  push:
    branches: [feature/bbya-fishing-index-visual-v7]
    paths:
      - 'maps/bbya-social-hub/131-fishing-index-visual-v7.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-fishing-index-visual-v7-hosted-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maps/bbya-social-hub/131-fishing-index-visual-v7.client.lua'
      - 'maps/bbya-social-hub/default.project.json'
      - '.github/workflows/bbya-fishing-index-visual-v7-hosted-qc.yml'

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static visual index checks
        shell: bash
        run: |
          set -euo pipefail
          client='maps/bbya-social-hub/131-fishing-index-visual-v7.client.lua'
          project='maps/bbya-social-hub/default.project.json'
          test -f "$client"
          test -f "$project"
          python -m json.tool "$project" >/dev/null
          grep -q 'ViewportFrame' "$client"
          grep -q 'WorldModel' "$client"
          grep -q 'LockedFishUseSilhouetteV7' "$client"
          grep -q 'VisualIndexSimpleTwoColumnV7' "$client"
          grep -q 'NOT DISCOVERED' "$client"
          grep -q 'FishPreviewV7' "$client"
          grep -q 'Royal Koi' "$client"
          grep -q 'Obsidian Ray' "$client"
          grep -q 'Phantom Leviathan' "$client"
          grep -q '131-fishing-index-visual-v7.client.lua' "$project"
          grep -q '47-floor1-features.server.lua' "$project"
          ! grep -q 'DataStoreService' "$client"
          ! grep -q 'ImageLabel' "$client"
          echo 'Hosted static QC PASS'

      - name: Install Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/rojo.zip 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip'
          mkdir -p /tmp/rojo
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          /tmp/rojo/rojo --version

      - name: Full canonical BBYA build
        shell: bash
        run: |
          set -euo pipefail
          /tmp/rojo/rojo build maps/bbya-social-hub/default.project.json -o /tmp/bbya-index-v7.rbxl
          test -s /tmp/bbya-index-v7.rbxl
          bytes=$(stat -c%s /tmp/bbya-index-v7.rbxl)
          test "$bytes" -gt 1024
          echo "BBYA Fishing Visual Index v7 hosted QC PASS - canonical build: $bytes bytes"
